name: bitview

services:
  bitview:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: bitview:latest
    container_name: bitview
    restart: unless-stopped
    ports:
      # (This machine only; drop `127.0.0.1:` to serve its network.)
      - 127.0.0.1:7070:3110
    volumes:
      - ${BITCOIN_DATA_DIR:-/path/to/bitcoin}:/bitcoin:ro
      - bitview-data:/home/bitview/.bitview
      # Bind mount alternative (uncomment, set BITVIEW_DATA_DIR in .env, comment the line above):
      # - ${BITVIEW_DATA_DIR:-./bitview-data}:/home/bitview/.bitview
    # A user and password instead of Bitcoin Core's cookie: write `user:password` (a cookie's
    # format) to docker/rpc-credentials, readable by UID 1000, then uncomment these two lines, the
    # two `--rpccookiefile` lines below and the `secrets:` block at the end. (Never on the command
    # line, where `ps` shows it.)
    # secrets:
    #   - bitcoin-rpc
    command:
      - --bitcoindir
      - /bitcoin
      - --blocksdir
      - /bitcoin/blocks
      - --bitviewdir
      - /home/bitview/.bitview
      - --rpcconnect
      - "${BTC_RPC_HOST:-localhost}"
      # Bitcoin Core's cookie at /bitcoin/.cookie, or the credentials (see `secrets:` above):
      # - --rpccookiefile
      # - /run/secrets/bitcoin-rpc
      # Shared vector cache size in bytes (default 1 GiB):
      # - --cachebudget
      # - "4294967296"
    healthcheck:
      test: ["CMD", "pgrep", "-x", "bitviewd"]
      interval: 30s
      retries: 3
      start_period: 10s

volumes:
  bitview-data:
    # The volume Compose has always made for this project, unless BITVIEW_DATA_VOLUME names another.
    name: ${BITVIEW_DATA_VOLUME:-bitview_bitview-data}

# secrets:
#   bitcoin-rpc:
#     file: ./rpc-credentials
