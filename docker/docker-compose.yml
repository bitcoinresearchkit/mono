name: bitview

services:
  bitview:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: bitview:latest
    container_name: bitview
    restart: unless-stopped
    ports:
      - 7070:3110
    volumes:
      - ${BITCOIN_DATA_DIR:-/path/to/bitcoin}:/bitcoin:ro
      - ${BITVIEW_DATA_VOLUME:-bitview-data}:/home/bitview/.bitview
      # Bind mount alternative (uncomment and set BITVIEW_DATA_DIR in .env):
      # - ${BITVIEW_DATA_DIR:-./bitview-data}:/home/bitview/.bitview
    command:
      - --bitcoindir
      - /bitcoin
      - --blocksdir
      - /bitcoin/blocks
      - --bitviewdir
      - /home/bitview/.bitview
      - --rpcconnect
      - "${BTC_RPC_HOST:-localhost}"
      # Without BTC_RPC_PASSWORD, bitviewd uses the cookie at /bitcoin/.cookie.
      - --rpcuser
      - "${BTC_RPC_USER:-}"
      - --rpcpassword
      - "${BTC_RPC_PASSWORD:-}"
      # Shared vector cache size in bytes (default 2 GiB):
      # - --cachebudget
      # - "4294967296"
    healthcheck:
      test: ["CMD", "pgrep", "-x", "bitviewd"]
      interval: 30s
      retries: 3
      start_period: 10s

volumes:
  bitview-data:
    driver: local
