[build]
rustflags = ["-C", "target-cpu=native"]

[alias]
bindgen = "run -p bitview_devtools --bin bitview-bindgen"
api = "run -p bitview_devtools --bin bitview-api"
surface = "run -p bitview_devtools --bin bitview-surface"
dev = "run -p bitview_devtools --bin bitview-bindgen -- --run"
prod = "run --release -p bitviewd"
# Dead or unnecessary `pub` (cargo-hawk), built in /tmp so its large instrumented target is easy to clear. The client,
# the crates it re-exports wholesale, and vendored forks are external API boundaries.
visibility = "hawk check --target-dir /tmp/cargo-hawk-target --exclude-crate bitview_client --exclude-crate bitview_types --exclude-crate bitview_catalog --exclude-crate bitview_cohort --exclude-crate bitview_primitives --exclude-crate brk_types --exclude-crate pco --exclude-crate fjall --exclude-crate lsm_tree --exclude-crate byteview"
