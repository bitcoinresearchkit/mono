<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>bitview-charts types</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0e0f11; color: #8a8f98; font: 12px/1.3 system-ui, sans-serif; overscroll-behavior: none; }
      #chart { position: fixed; inset: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    </style>
  </head>
  <body>
    <div id="chart"></div>
    <script type="module">
      // bitview-charts' series types on the price, to look at: candles with a cloud between its 50- and 200-day
      // averages and the 200-day one colored by the price's side of it; its daily changes as bars, by their sign; the
      // price rebased at each halving, its line broken at each restart.
      import { createChart } from "/modules/bitview-charts/index.js";

      const DAY = 86400, FIRST = Date.UTC(2009, 0, 1) / 1000, HALVINGS = ["2012-11-28", "2016-07-09", "2020-05-11", "2024-04-20"].map((d) => (Date.parse(d) / 1000 - FIRST) / DAY);
      const price = await (await fetch("/api/series/price_ohlc/day1")).json();
      const n = price.end, times = Float64Array.from({ length: n }, (_, i) => FIRST + i * DAY);
      const column = (k) => { const out = new Float64Array(n).fill(NaN); for (let i = price.start; i < n; i++) { const v = price.data[i - price.start][k]; if (v > 0) out[i] = v; } return out; };
      const [open, high, low, close] = [0, 1, 2, 3].map(column);
      const sma = (days) => { const out = new Float64Array(n).fill(NaN); let sum = 0, count = 0; for (let i = 0; i < n; i++) { if (close[i] === close[i]) (sum += close[i]), count++; if (i >= days && close[i - days] === close[i - days]) (sum -= close[i - days]), count--; if (count >= days * 0.9) out[i] = sum / count; } return out; };
      const fast = sma(50), slow = sma(200);
      const side = Uint8Array.from(slow, (v, i) => (close[i] >= v ? 0 : 1));
      const change = Float64Array.from(close, (v, i) => (i && close[i - 1] === close[i - 1] ? ((v - close[i - 1]) / close[i - 1]) * 100 : NaN));
      const sign = Uint8Array.from(change, (v) => (v >= 0 ? 0 : 1));
      const epoch = (i) => HALVINGS.filter((h) => i >= h).length;
      const rebased = new Float64Array(n).fill(NaN), breaks = new Uint8Array(n);
      let base = NaN, last = -1;
      for (let i = 0; i < n; i++) {
        if (close[i] !== close[i]) continue;
        if (last >= 0 && epoch(i) !== epoch(last)) (breaks[last] = 1), (base = NaN);
        if (base !== base) base = close[i];
        rebased[i] = close[i] / base;
        last = i;
      }

      const chart = createChart(document.getElementById("chart"));
      chart.setTimes(times);
      const top = chart.addPane({ share: 3, scale: { mode: "log" } });
      top.addBand({ lower: fast, upper: slow, color: "rgba(124, 154, 255, 0.16)" });
      top.addCandles({ open, high, low, close });
      top.addLine({ values: slow, colors: side, palette: ["#26a69a", "#ef5350"], width: 1.5 });
      const bars = chart.addPane({ share: 1, format: (v) => `${v}%` });
      bars.addBars({ values: change, colors: sign, palette: ["#26a69a", "#ef5350"] });
      const cycles = chart.addPane({ share: 1.4, scale: { mode: "log" }, format: (v) => `${v}×` });
      cycles.addLine({ values: rebased, breaks, color: "#f7931a", width: 1.5 });
      chart.show(365 * 2);
      Object.assign(window, { chart });
    </script>
  </body>
</html>
