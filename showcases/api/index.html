<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Its launch from a home screen, every showcase's. -->
    <script src="/assets/launch/launch.js" data-app="API" data-color="#af4000"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API · Bitview</title>
    <meta
      name="description"
      content="Free Bitcoin on-chain analytics API: thousands of time series, blocks, transactions, addresses, the mempool and mining. No key, no account."
    />
    <meta property="og:title" content="Bitview API" />
    <meta
      property="og:description"
      content="Free Bitcoin on-chain analytics API: thousands of time series, blocks, transactions, addresses, the mempool and mining. No key, no account."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://bitview.space/assets/favicon/web-app-manifest-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08090a" />
    <style>
      @font-face {
        font-family: Inter;
        src: url("../assets/fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }

      @font-face {
        font-family: Lilex;
        src: url("../assets/fonts/Lilex.woff2") format("woff2");
        font-weight: 500 700;
        font-display: swap;
      }

      /* The way home, every page's: in a bar Scalar keeps for a header (its --refs-header-height), over its sidebar on a
         desk; on a phone beside its menu button, in its own bar. */
      .brand {
        position: fixed;
        z-index: 1001;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        gap: 9px;
        height: 52px;
        padding: 0 16px;
        color: #0f1012;
        font: 600 14px / 1 Inter, -apple-system, system-ui, sans-serif;
        letter-spacing: -0.01em;
        text-decoration: none;

        @media (prefers-color-scheme: dark) {
          color: #f7f8f8;
        }

        @media (width < 1000px) {
          left: 44px;
          height: 50px;
          padding-left: 10px;
        }

        img {
          width: 18px;
          height: 18px;
        }
      }

      /* (Its bar on a desk, what scrolls passing under it; a phone's is Scalar's own.) */
      @media (width >= 1000px) {
        body::before {
          content: "";
          position: fixed;
          z-index: 1000;
          inset: 0 0 auto;
          height: 52px;
          border-bottom: 1px solid rgb(0 0 0 / 0.08);
          background: #ffffff;

          @media (prefers-color-scheme: dark) {
            border-color: rgb(255 255 255 / 0.06);
            background: #08090a;
          }
        }
      }
    </style>
  </head>

  <body>
    <a class="brand" href="/"><img src="/assets/logo/logo.svg" alt="" />Bitview</a>
    <div id="app"></div>

    <!-- Every endpoint, from the specification of the server that serves this page. -->
    <script src="../modules/scalar-api-reference/1.75.1/dist/browser/standalone.js"></script>
    <script>
      // In Bitview's type and colors (Studio's), light or dark as the system is (Scalar's own system mode, its toggle
      // hidden, a choice it kept from when it had one let go); no toolbar.
      try {
        localStorage.removeItem("colorMode");
      } catch {}
      Scalar.createApiReference("#app", {
        url: "/openapi.json",
        hideClientButton: true,
        showDeveloperTools: "never",
        hideDarkModeToggle: true,
        telemetry: false,
        withDefaultFonts: false,
        mcp: { disabled: true },
        agent: { disabled: true },
        customCss: `
          /* (Scalar's own breakpoint: its phone header under 1000px.) */
          @media (width >= 1000px) {
            .scalar-app {
              --refs-header-height: 52px;
            }
            .references-rendered {
              padding-top: 52px;
            }
          }
          /* (On a phone its header names the section read, where the way home is: the section's own title says it.) */
          @media (width < 1000px) {
            .t-doc__header > header > span {
              visibility: hidden;
            }
          }
          :root {
            --scalar-font: Inter, -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
            --scalar-font-code: Lilex, ui-monospace, "SF Mono", Menlo, monospace;
            --scalar-radius: 6px;
            --scalar-radius-lg: 8px;
            --scalar-radius-xl: 12px;
          }
          .light-mode {
            --scalar-background-1: #ffffff;
            --scalar-background-2: #f6f6f7;
            --scalar-background-3: #ececee;
            --scalar-color-1: #0f1012;
            --scalar-color-2: #5f6570;
            --scalar-color-3: #6b7079;
            --scalar-color-accent: oklch(52% 0.16 44.41);
            --scalar-background-accent: oklch(64.34% 0.191 44.41 / 0.1);
            --scalar-border-color: rgb(0 0 0 / 0.08);
            --scalar-sidebar-background-1: #f6f6f7;
            --scalar-button-1: #0f1012;
            --scalar-button-1-color: #ffffff;
            --scalar-button-1-hover: #2b2f36;
            /* (Syntax and method colors as small text: 4.5:1 or more on the light grounds.) */
            --scalar-color-red: #bf2b31;
            --scalar-color-danger: #bf2b31;
            --scalar-color-orange: #a84300;
            --scalar-color-yellow: #7a5c00;
            --scalar-color-green: #0c7642;
            --scalar-color-blue: #1d5fd1;
            --scalar-color-purple: #7139c4;
          }
          .dark-mode {
            --scalar-background-1: #08090a;
            --scalar-background-2: #0e0f11;
            --scalar-background-3: #17181b;
            --scalar-color-1: #f7f8f8;
            --scalar-color-2: #8a8f98;
            --scalar-color-3: #7c818a;
            --scalar-color-accent: oklch(64.34% 0.191 44.41);
            --scalar-background-accent: oklch(64.34% 0.191 44.41 / 0.12);
            --scalar-border-color: rgb(255 255 255 / 0.06);
            --scalar-sidebar-background-1: #0e0f11;
            /* (Red and danger as small text: 4.5:1 or more on the dark grounds.) */
            --scalar-color-red: #f2555a;
            --scalar-color-danger: #f2555a;
            --scalar-button-1: #f7f8f8;
            --scalar-button-1-color: #08090a;
            --scalar-button-1-hover: #d0d6e0;
          }
          /* Increase Contrast (iOS's and macOS's, prefers-contrast: more), as every page: the greys toward the ink, each
             still a step apart, the hairlines about twice as strong. */
          @media (prefers-contrast: more) {
            .light-mode {
              --scalar-color-2: #3d4048;
              --scalar-color-3: #4d5157;
              --scalar-border-color: rgb(0 0 0 / 0.18);
            }
            .dark-mode {
              --scalar-color-2: #b4b8bd;
              --scalar-color-3: #9fa3aa;
              --scalar-border-color: rgb(255 255 255 / 0.13);
            }
          }
          /* (Scalar's own offer, not this API's: its buttons, and the client card's.) */
          .generate-sdk-button,
          .selected-client-action {
            display: none !important;
          }
        `,
      });
    </script>
  </body>
</html>
