<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Bitcoin price and the Bitcoin Clouds.">
  <title>Bitcoin Clouds</title>
  <style>
    @font-face {
      font-family: Instrument;
      src: url("../fonts/InstrumentSerif-Regular.woff2") format("woff2");
      font-display: swap;
    }
    @font-face {
      font-family: Instrument;
      src: url("../fonts/InstrumentSerif-Italic.woff2") format("woff2");
      font-style: italic;
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      background: #100f0d;
      color: #f0f1e9;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      --muted: #96918a;
      --cloud: #e19b00;
      --gutter: clamp(22px, 4vw, 64px);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { height: 100dvh; min-height: min-content; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(350px, 1fr) auto; padding-bottom: 24px; }
    header { padding: 24px var(--gutter) 12px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px 24px; }
    a { color: inherit; text-decoration: none; }
    .identity { display: contents; }
    .wordmark { display: flex; flex-basis: 100%; gap: 12px; letter-spacing: .15em; font-size: 13px; color: #f0f1e9; }
    .wordmark span { color: var(--muted); }
    h1 { font: 400 clamp(34px, 4vw, 56px)/1.05 Instrument, Georgia, serif; letter-spacing: -.025em; margin: 0; }
    h1 em { color: #f0f1e9; font-weight: 400; }
    h1 > span { color: #f2660f; }
    .readouts { display: grid; gap: 4px; text-align: right; font-variant-numeric: tabular-nums; }
    .readout-date { color: var(--muted); font-size: 13px; white-space: nowrap; }
    #price { font: 400 26px/1.2 ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif; font-variant-numeric: lining-nums tabular-nums; letter-spacing: -.02em; }
    .cloud-labels { display: grid; grid-template-columns: repeat(4, minmax(max-content, 1fr)); gap: 24px; flex-basis: 100%; min-width: 0; overflow-x: auto; padding: 4px 0; scrollbar-width: thin; font-size: 13px; }
    .series-toggle { display: grid; align-content: start; gap: 6px; min-width: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .cloud-labels .label { display: flex; align-items: center; gap: 7px; justify-self: start; color: #aaa69e; }
    .cloud-labels .label::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .cloud-state { color: var(--muted); opacity: .65; font-size: 13px; }
    .series-toggle[aria-pressed="false"] .label::before { background: transparent; box-shadow: inset 0 0 0 1px var(--accent); }
    .series-toggle:hover .label { color: #f0f1e9; }
    .series-toggle:disabled { cursor: default; }
    .sth { --accent: #e19b00; }
    .holders { --accent: #f2660f; }
    .lth { --accent: #d50ced; }
    .cloud-range { color: #aaa69e; font-variant-numeric: tabular-nums; font-weight: 400; white-space: nowrap; line-height: 1.4; }
    .cloud-range span + span::before { content: '–'; }
    .trends-readout { --accent: #aaa69e; }
    .trend-values { display: flex; gap: 8px; color: #aaa69e; font-variant-numeric: tabular-nums; line-height: 1.4; }
    .trend-values > span { white-space: nowrap; }
    #trend-6m { color: #f11325; }
    #trend-5m { color: #f2660f; }
    #trend-4m { color: #e19b00; }
    .series-toggle:focus-visible, a:focus-visible { outline: 2px solid var(--cloud); outline-offset: 4px; }
    .plot { position: relative; min-width: 0; min-height: 0; contain: size layout; }
    footer { padding: 16px var(--gutter) 0; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; line-height: 1.4; }
    #chart { position: absolute; inset: 0; }
    #status { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); text-align: center; max-width: calc(100% - 36px); padding: 14px; background: #262019; color: #cfc9c0; }
    #status:empty { display: none; }
    #status.error { color: #f0a794; }
    @media (min-width: 1200px) {
      header { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 40px; align-items: last baseline; padding-bottom: 24px; }
      .identity { display: grid; gap: 14px; margin-right: clamp(32px, 4vw, 80px); }
      .readouts { grid-column: 3; grid-row: 1; }
      .cloud-labels { grid-column: 2; grid-row: 1; padding: 0; overflow: visible; align-items: last baseline; }
    }
    @media (max-width: 650px) {
      .cloud-labels { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; overflow: visible; }
      .cloud-labels .label { display: grid; grid-template-columns: 6px auto; gap: 4px 5px; text-align: left; }
      .cloud-state { grid-column: 2; }
    }
    @media (max-width: 480px) {
      header { padding-top: 20px; gap: 20px 12px; }
      h1 { font-size: 34px; }
      #price { font-size: 23px; }
      .readout-date { font-size: 13px; }
      main { grid-template-rows: auto minmax(380px, 1fr) auto; }
    }
  </style>
  <script type="module">
      // @ts-check
    import { createChart, LineSeries, LineStyle, CandlestickSeries, ColorType, CrosshairMode, PriceScaleMode, customSeriesDefaultOptions } from '../modules/lightweight-charts/5.2.1/dist/lightweight-charts.standalone.production.mjs';

    class CloudRenderer {
      update(data, options) {
        this.data = data;
        this.options = options;
      }

      draw(target, priceToCoordinate) {
        if (!this.data?.visibleRange) return;
        const { bars, visibleRange } = this.data;
        // Only the visible bars have current coordinates after a range change.
        const { from, to } = visibleRange;
        if (to - from < 2) return;
        target.useBitmapCoordinateSpace(({ context, horizontalPixelRatio, verticalPixelRatio }) => {
          const points = bars.slice(from, to).map(bar => ({
            x: bar.x * horizontalPixelRatio,
            upper: priceToCoordinate(bar.originalData.upper) * verticalPixelRatio,
            lower: priceToCoordinate(bar.originalData.lower) * verticalPixelRatio,
          }));
          context.beginPath();
          context.moveTo(points[0].x, points[0].upper);
          for (const point of points.slice(1)) context.lineTo(point.x, point.upper);
          for (let i = points.length - 1; i >= 0; i--) context.lineTo(points[i].x, points[i].lower);
          context.closePath();
          context.fillStyle = this.options.fillColor;
          context.fill();
        });
      }
    }

    class CloudSeries {
      constructor() { this.view = new CloudRenderer(); }
      renderer() { return this.view; }
      update(data, options) { this.view.update(data, options); }
      priceValueBuilder(row) { return [row.upper, row.lower, (row.lower + row.upper) / 2]; }
      isWhitespace(row) { return !Number.isFinite(row.lower) || !Number.isFinite(row.upper); }
      defaultOptions() {
        return {
          ...customSeriesDefaultOptions,
          fillColor: '#e19b0026',
          lastValueVisible: false,
          priceLineVisible: false,
        };
      }
    }

    function boundsLineData(points, firstTime, daySeconds) {
      let previous = null;
      let previousSide = null;
      return points.map((point, index) => {
        const time = firstTime + index * daySeconds;
        // Zero-price buckets are valid data, but cannot be shown on a log scale.
        if (point === null || point[0] === 0) {
          if (previous) previous.color = 'transparent';
          previous = null;
          return { time };
        }
        if (previous && point[1] !== previousSide) previous.color = 'transparent';
        previousSide = point[1];
        previous = { time, value: point[0] / 100 };
        return previous;
      });
    }

    function boundsEndpoints(data) {
      return data.filter((point, index) => point.value !== undefined && (
        data[index - 1]?.value === undefined || data[index - 1]?.color === 'transparent' ||
        point.color === 'transparent' || data[index + 1]?.value === undefined
      )).map(({ time, value }) => ({ time, value }));
    }

    const DAY_SECONDS = 86_400;
    const DAY_ZERO = Date.UTC(2009, 0, 1) / 1000;
    const START_DAY = (Date.UTC(2011, 2, 22) / 1000 - DAY_ZERO) / DAY_SECONDS;
    const validPrice = value => Number.isSafeInteger(value) && value > 0;

    // A point is [price in cents, displayed side: 0 = min, 1 = max]. An expanding
    // extreme selects the opposite bound; an aging-out contraction does not.
    function trendBounds(minima, maxima) {
      let side = null;
      let previous = null;
      return minima.map((min, index) => {
        const pair = [min, maxima[index]];
        if (!pair.every(value => Number.isSafeInteger(value) && value >= 0) || pair[0] > pair[1]) {
          side = null;
          previous = null;
          return null;
        }
        if (previous) {
          const lowerMin = pair[0] < previous[0];
          const higherMax = pair[1] > previous[1];
          // Both expanding on the same day leaves their ordering unknown.
          if (lowerMin !== higherMax) side = lowerMin ? 1 : 0;
        }
        previous = pair;
        return side === null ? null : [pair[side], side];
      });
    }

    /**
     * Live from bitview.space: each cloud spans the cointime- and coinflow-weighted realized and
     * capitalized prices of its cohorts; the bounds follow the young supply's cost-basis extremes.
     */
    async function loadSnapshot() {
      const { BitviewClient } = await import('../modules/bitview-client/index.js');
      const client = new BitviewClient({ baseUrl: 'https://bitview.space', timeout: 60_000 });
      const { cointime, coinflow, price, cohorts } = client.series;
      const sources = {
        sth: [
          cointime.under4mAwakePrice, cointime.under4mAwakeCapitalizedPrice, coinflow.under4mPrice, coinflow.under4mCapitalizedPrice,
          cointime.sth.awake.price, cointime.sth.awake.capitalizedPrice, coinflow.sth.price, coinflow.sth.capitalizedPrice,
          cointime.under6mAwakePrice, cointime.under6mAwakeCapitalizedPrice, coinflow.under6mPrice, coinflow.under6mCapitalizedPrice,
        ],
        holders: [cointime.awake.price, cointime.awake.capitalizedPrice, coinflow.price, coinflow.capitalizedPrice],
        lth: [
          cointime.over4mAwakePrice, cointime.over4mAwakeCapitalizedPrice, coinflow.over4mPrice, coinflow.over4mCapitalizedPrice,
          cointime.lth.awake.price, cointime.lth.awake.capitalizedPrice, coinflow.lth.price, coinflow.lth.capitalizedPrice,
          cointime.over6mAwakePrice, cointime.over6mAwakeCapitalizedPrice, coinflow.over6mPrice, coinflow.over6mCapitalizedPrice,
        ],
      };
      const boundSources = [cohorts.urpd.ageBounds.under4m, cohorts.urpd.ageBounds.under6m];
      // One request per series keeps each under the API's response-weight limit; the bounds are
      // stateful, so they start at genesis.
      const fetchDays = (series, start) => series.by.day1.slice(start).fetch();
      const [ohlc, cloudHistories, boundHistories] = await Promise.all([
        fetchDays(price.ohlc.cents, START_DAY),
        Promise.all(Object.values(sources).map(list => Promise.all(list.map(source => fetchDays(source.cents, START_DAY))))),
        Promise.all(boundSources.map(bound => Promise.all([fetchDays(bound.min.cents, 0), fetchDays(bound.max.cents, 0)]))),
      ]);
      const at = (history, day) => history.data[day - history.start];
      const end = ohlc.start + ohlc.data.length;
      const days = Array.from({ length: end - START_DAY }, (_, offset) => START_DAY + offset);
      let previous = null;
      const rows = days.map(day => {
        const candle = at(ohlc, day);
        previous = Array.isArray(candle) && candle.every(validPrice) ? candle : previous && Array(4).fill(previous[3]);
        return previous;
      });
      const clouds = Object.keys(sources).map((id, index) => ({
        id,
        ranges: days.map(day => {
          const prices = cloudHistories[index].map(history => at(history, day)).filter(validPrice);
          return prices.length ? [Math.min(...prices), Math.max(...prices)] : [NaN, NaN];
        }),
      }));
      const all = Array.from({ length: end }, (_, day) => day);
      const bounds = boundHistories.map(([minima, maxima]) => ({
        points: trendBounds(all.map(day => at(minima, day)), all.map(day => at(maxima, day))).slice(START_DAY),
      }));
      const firstValid = rows.findIndex(Boolean);
      return {
        start: new Date((DAY_ZERO + (START_DAY + firstValid) * DAY_SECONDS) * 1000).toISOString().slice(0, 10),
        rows: rows.slice(firstValid),
        clouds: clouds.map(cloud => ({ ...cloud, ranges: cloud.ranges.slice(firstValid) })),
        bounds: bounds.map(bound => ({ ...bound, points: bound.points.slice(firstValid) })),
      };
    }

    const chartElement = document.getElementById('chart');
    const status = document.getElementById('status');
    const dateElement = document.getElementById('date');
    const yearElement = document.getElementById('year');
    const priceElement = document.getElementById('price');
    const cloudColors = { sth: '#e19b00', holders: '#f2660f', lth: '#d50ced' };
    const cloudReadouts = Object.fromEntries(Object.keys(cloudColors).map(id =>
      [id, [...document.querySelectorAll(`#${id}-range span`)]]));
    const TREND_MONTHS = [4, 6];
    const trendReadouts = TREND_MONTHS.map(months => document.getElementById(`trend-${months}m`));
    const dateFormat = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short', timeZone: 'UTC' });
    const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
    const compactNumber = new Intl.NumberFormat('fr-FR', {
      minimumSignificantDigits: 3, maximumSignificantDigits: 3, useGrouping: false,
    });
    function compactPrice(value) {
      if (value < 10_000) return value.toLocaleString('en-US', { maximumFractionDigits: value < 10 ? 2 : 0 });
      const millions = value >= 1_000_000;
      return compactNumber.format(value / (millions ? 1_000_000 : 1_000)) + (millions ? 'm' : 'k');
    }
    const priceFormat = {
      type: 'custom',
      minMove: 0.01,
      formatter: value => value.toLocaleString('en-US', { maximumFractionDigits: value < 10 ? 2 : 0 }),
    };

    try {
      const snapshot = await loadSnapshot();
      const updated = /** @type {HTMLTimeElement} */ (document.getElementById('generated-at'));
      updated.dateTime = new Date().toISOString();
      updated.textContent = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date());
      const bounds = snapshot.bounds;
      const firstTime = Date.parse(snapshot.start) / 1000;
      const rows = snapshot.rows.map((row, index) => {
        const [open, high, low, close] = row.map(value => value / 100);
        return { time: firstTime + index * DAY_SECONDS, open, high, low, close };
      });
      const latest = rows.at(-1);
      await document.fonts.ready;
      await new Promise(requestAnimationFrame);
      const chart = createChart(chartElement, {
        width: chartElement.clientWidth,
        height: chartElement.clientHeight,
        hoveredSeriesOnTop: false,
        layout: { background: { type: ColorType.Solid, color: '#100f0d' }, textColor: '#96918a', fontSize: 13, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', attributionLogo: false },
        grid: { vertLines: { visible: false }, horzLines: { color: '#d8cfc10a' } },
        rightPriceScale: { mode: PriceScaleMode.Logarithmic, borderVisible: false, minimumWidth: 68, scaleMargins: { top: 0.12, bottom: 0.08 } },
        timeScale: { borderVisible: false, rightOffset: 5, minBarSpacing: 0.06, fixLeftEdge: false, fixRightEdge: false },
        crosshair: { mode: CrosshairMode.MagnetOHLC, vertLine: { color: '#e19b0040', labelBackgroundColor: '#493321' }, horzLine: { color: '#e19b0040', labelBackgroundColor: '#493321' } },
        handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
        handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true },
      });
      const cloudSeries = Object.fromEntries(snapshot.clouds.map(({ id }) => [id, []]));
      // Back to front: LTH, Holders, STH; hover never changes this order.
      for (const { id, ranges } of [...snapshot.clouds].reverse()) {
        const color = cloudColors[id];
        const fill = chart.addCustomSeries(new CloudSeries(), {
          priceFormat, fillColor: `${color}${{ sth: '38', holders: '26', lth: '1c' }[id]}`,
        });
        fill.setData(ranges.map(([lower, upper], index) => ({
          time: rows[index].time, lower: lower / 100, upper: upper / 100,
        })));
        cloudSeries[id].push(fill);
      }
      // All six boundaries sit above every fill, with Bitcoin still in front.
      for (const { id, ranges } of [...snapshot.clouds].reverse()) {
        for (const edge of [0, 1]) {
          const boundary = chart.addSeries(LineSeries, {
            color: `${cloudColors[id]}99`, lineWidth: 1, priceFormat,
            priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
          });
          boundary.setData(ranges.map((range, index) => Number.isFinite(range[edge]) ? { time: rows[index].time, value: range[edge] / 100 } : { time: rows[index].time }));
          cloudSeries[id].push(boundary);
        }
      }
      // Trends share one toggle and stay underneath Bitcoin.
      const trendSeries = [];
      const trendColors = ['#e19b00', '#f11325'];
      for (const [index, bound] of bounds.entries()) {
        const options = {
          visible: false, color: `${trendColors[index]}99`, lineWidth: 1, priceFormat,
          priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
        };
        const data = boundsLineData(bound.points, firstTime, DAY_SECONDS);
        const trend = chart.addSeries(LineSeries, {
          ...options, lineStyle: [LineStyle.LargeDashed, LineStyle.Solid][index],
        });
        trend.setData(data);
        const endpoints = chart.addSeries(LineSeries, {
          ...options, lineVisible: false, pointMarkersVisible: true, pointMarkersRadius: 1.5,
        });
        endpoints.setData(boundsEndpoints(data));
        trendSeries.push(trend, endpoints);
      }
      function bindToggle(button, series) {
        button.disabled = series.length === 0;
        // Reinitialization must replace the handler, not toggle twice per click.
        button.onclick = () => {
          const visible = button.getAttribute('aria-pressed') !== 'true';
          button.setAttribute('aria-pressed', String(visible));
          const state = button.querySelector('.cloud-state');
          if (state) state.textContent = visible ? 'active' : 'inactive';
          for (const item of series) item.applyOptions({ visible });
        };
      }
      for (const [id, series] of Object.entries(cloudSeries)) {
        bindToggle(document.getElementById(`${id}-toggle`), series);
      }
      bindToggle(document.getElementById('trends-toggle'), trendSeries);
      const line = chart.addSeries(LineSeries, {
        color: '#f0f1e9', lineWidth: 1.5, priceLineVisible: false,
        lastValueVisible: true, crosshairMarkerVisible: false, priceFormat,
      });
      const candles = chart.addSeries(CandlestickSeries, {
        visible: false, upColor: '#100f0d', downColor: '#f0f1e9',
        wickUpColor: '#f0f1e9', wickDownColor: '#f0f1e9',
        borderUpColor: '#f0f1e9', borderDownColor: '#f0f1e9',
        borderVisible: true, priceLineVisible: false, lastValueVisible: true, priceFormat,
      });
      line.setData(rows.map(({ time, close }) => ({ time, value: close })));
      candles.setData(rows.map(({ time, open, high, low, close }) => ({ time, open, high, low, close })));

      function readout(row) {
        if (!row) {
          dateElement.textContent = '—';
          yearElement.textContent = '';
          priceElement.textContent = '—';
          for (const values of Object.values(cloudReadouts)) {
            for (const value of values) { value.textContent = '—'; value.removeAttribute('title'); }
          }
          for (const value of trendReadouts) { value.textContent = '—'; value.removeAttribute('title'); }
          return;
        }
        dateElement.textContent = dateFormat.format(row.time * 1000);
        yearElement.textContent = String(new Date(row.time * 1000).getUTCFullYear());
        priceElement.textContent = money.format(row.close);
        const index = Math.round((row.time - firstTime) / DAY_SECONDS);
        for (const { id, ranges } of snapshot.clouds) {
          for (const [edge, value] of ranges[index].entries()) {
            const element = /** @type {HTMLElement} */ (cloudReadouts[id][edge]);
            element.textContent = Number.isFinite(value) ? compactPrice(value / 100) : '—';
            element.title = Number.isFinite(value) ? money.format(value / 100) : '';
          }
        }
        for (const [trendIndex, value] of trendReadouts.entries()) {
          const point = bounds[trendIndex]?.points[index];
          value.textContent = point && point[0] > 0 ? compactPrice(point[0] / 100) : '—';
          value.title = `${TREND_MONTHS[trendIndex]}m: ${point && point[0] > 0 ? money.format(point[0] / 100) : '—'}`;
        }
      }
      let hoveredIndex = null;
      function updateReadout() {
        const range = chart.timeScale().getVisibleLogicalRange();
        if (!range) return;
        const first = Math.max(0, Math.ceil(range.from));
        const last = Math.min(rows.length - 1, Math.floor(range.to));
        const index = hoveredIndex !== null && hoveredIndex >= first && hoveredIndex <= last
          ? hoveredIndex : last;
        readout(first <= last ? rows[index] : null);
      }
      chart.subscribeCrosshairMove(({ time, point }) => {
        const index = typeof time === 'number' ? Math.round((time - firstTime) / DAY_SECONDS) : -1;
        hoveredIndex = point && point.x >= 0 && point.y >= 0 &&
          point.x <= chartElement.clientWidth && point.y <= chartElement.clientHeight && rows[index]
          ? index : null;
        updateReadout();
      });
      chartElement.addEventListener('mouseleave', () => {
        hoveredIndex = null;
        updateReadout();
      });

      // Hysteresis matches the other daily-price pages and avoids flicker at the threshold.
      let candlesVisible = false;
      let rangeFrame = 0;
      chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
        cancelAnimationFrame(rangeFrame);
        rangeFrame = requestAnimationFrame(() => {
          updateReadout();
          const visibleBars = range ? range.to - range.from : Infinity;
          const showCandles = visibleBars <= (candlesVisible ? 600 : 500);
          if (showCandles === candlesVisible) return;
          candlesVisible = showCandles;
          line.applyOptions({ visible: !showCandles });
          candles.applyOptions({ visible: showCandles });
        });
      });
      function resetRange() {
        chart.timeScale().setVisibleRange({ from: Math.max(firstTime, latest.time - 4 * 365 * DAY_SECONDS), to: latest.time });
      }
      resetRange();
      updateReadout();
      let resizeFrame = 0;
      new ResizeObserver(() => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => {
          chart.resize(chartElement.clientWidth, chartElement.clientHeight, true);
        });
      }).observe(chartElement);
      chartElement.addEventListener('dblclick', resetRange);
      chartElement.setAttribute('aria-busy', 'false');
      status.textContent = '';
    } catch (error) {
      console.error(error);
      chartElement.setAttribute('aria-busy', 'false');
      status.classList.add('error');
      status.textContent = 'Unable to load the cloud. Please reload the page.';
    }
  </script>
</head>
<body>
  <main>
    <header>
      <div class="identity">
        <a class="wordmark" href="https://bitview.space">BITVIEW <span>/ CLOUDS</span></a>
        <h1><span>Bitcoin</span> <em>Clouds</em></h1>
      </div>
      <div class="readouts">
        <div class="readout-date"><span id="date">—</span> <span id="year">—</span></div>
        <strong id="price">—</strong>
      </div>
      <div class="cloud-labels" aria-label="Cloud ranges">
