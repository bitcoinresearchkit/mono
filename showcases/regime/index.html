<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Bitcoin price against dollar and coin cost-basis percentiles, with Cointime and Coinflow weighting.">
  <title>Bitcoin Regime</title>
  <style>
    @font-face {
      font-family: Instrument;
      src: url("../fonts/InstrumentSerif-Regular.woff2") format("woff2");
      font-display: swap;
    }
    :root { color-scheme: dark; color: #eee; background: #000; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { height: 100dvh; min-height: 480px; display: grid; grid-template-rows: auto minmax(180px, 1fr) auto; }
    header { padding: 18px 22px 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font: 400 44px/1 Instrument, Georgia, serif; letter-spacing: -.025em; }
    #weighting { display: flex; gap: 4px; padding: 4px; background: #141414; border-radius: 8px; }
    button { font: inherit; font-size: 14px; cursor: pointer; color: #999; background: transparent; border: 0; padding: 10px 12px; border-radius: 5px; }
    button:hover { color: #fff; }
    button[aria-pressed="true"] { color: #fff; background: #303030; }
    button:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .plot { position: relative; min-height: 0; }
    #chart { position: absolute; inset: 0; }
    #status { position: absolute; z-index: 2; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: calc(100% - 32px); background: #202020ed; padding: 12px 16px; border-radius: 6px; font-size: 14px; text-align: center; }
    #status:empty { display: none; }
    #status.error { color: #ffb9b9; }
    #status button { display: block; margin: 8px auto 0; color: #fff; background: #393939; }
    footer { padding: 12px 22px 14px; border-top: 1px solid #222; }
    .readout { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
    #price { font-size: 22px; letter-spacing: -.04em; }
    #date, #mode-label { color: #999; font-size: 12px; }
    #zone { margin-left: auto; color: var(--zone-color, #999); font-size: 12px; }
    #zone b { font-weight: 400; color: #eee; }
    .legend { display: grid; grid-template-columns: 3fr 2fr; gap: 24px; }
    h2 { font-size: 12px; color: #999; font-weight: 400; margin: 0 0 10px; }
    .levels { display: grid; grid-template-columns: repeat(var(--columns), minmax(0, 1fr)); gap: 10px; }
    .level { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .level span { display: block; color: var(--color); margin-bottom: 5px; }
    .level b { font-weight: 400; font-size: 14px; }
    .note { display: flex; justify-content: space-between; gap: 16px; margin: 14px 0 0; color: #707070; font-size: 12px; line-height: 1.5; }
    a { color: #999; text-decoration: none; }
    a:hover { color: #fff; }
    @media (max-width: 720px) {
      header { padding: 14px 12px; align-items: flex-start; }
      h1 { font-size: 36px; }
      #weighting { flex-direction: column; }
      button { padding: 7px 10px; font-size: 12px; }
      footer { padding: 10px 12px; }
      .legend { grid-template-columns: 1fr; gap: 16px; }
      .readout { flex-wrap: wrap; gap: 6px 12px; }
      .level b { font-size: 12px; }
      .levels { gap: 10px 5px; }
      #dollar-levels { --columns: 3 !important; }
      .note { font-size: 12px; }
    }
    @media (max-width: 320px), (max-height: 300px) {
      main { min-height: 0; grid-template-rows: minmax(0, 1fr); }
      header, footer { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Bitcoin Regime</h1>
      <div id="weighting" role="group" aria-label="Cost-basis weighting">
        <button type="button" data-mode="cointime" aria-pressed="true">Cointime weighted</button>
        <button type="button" data-mode="coinflow" aria-pressed="false">Coinflow weighted</button>
      </div>
    </header>
    <section class="plot" aria-label="Regime chart">
      <div id="chart" role="img" aria-label="Bitcoin price and cost-basis percentiles in US dollars, on a logarithmic scale" aria-busy="true"></div>
      <div id="status" role="status">Loading regime…</div>
    </section>
    <footer>
      <div class="readout"><strong id="price">—</strong><time id="date"></time><span id="mode-label"></span><span id="zone"></span></div>
      <div class="legend">
        <section><h2>Cost basis per dollar</h2><div id="dollar-levels" class="levels" style="--columns: 6"></div></section>
        <section><h2>Cost basis per coin</h2><div id="coin-levels" class="levels" style="--columns: 4"></div></section>
      </div>
      <p class="note"><span>P100 uses the all-supply maximum cost basis in both modes.</span><a href="https://bitview.dev" target="_blank" rel="noreferrer">Bitview ↗</a></p>
    </footer>
  </main>
  <script type="module">
      // @ts-check
    const ORIGIN = "https://bitview.space";
    const clientReady = import("../modules/bitview-client/index.js").then(
      ({ BitviewClient }) => new BitviewClient({ baseUrl: ORIGIN, timeout: 30_000 }),
    );
    const START = new Date("2012-01-01");
    const DAY_ZERO = Date.UTC(2009, 0, 1);
    const DAY_MS = 86_400_000;
    const MODES = { cointime: "Cointime weighted", coinflow: "Coinflow weighted" };
    /** @typedef {keyof typeof MODES} Mode */
    // Every series by its typed client path (dot access only, which tsc checks), so a renamed
    // series fails type-checking instead of 404ing.
    /** @type {Awaited<typeof clientReady>["series"]} */
    let series;
    /** @typedef {Awaited<typeof clientReady>["series"]["cointime"]["urpd"]["all"]["costBasis"]} CostBasis */
    const priceSource = () => series.price.split.close.usd;
    /** P100 is the all-supply maximum cost basis in both modes; the rest are weighted percentiles. @type {{ basis: string, percentile: number, color: string, pick: (costBasis: CostBasis) => ReturnType<typeof priceSource> }[]} */
    const LEVELS = [
      { basis: "dollar", percentile: 100, color: "#fb7185", pick: () => series.distributionAggregated.cohorts.all.costBasis.max.usd },
      { basis: "dollar", percentile: 90, color: "#f38763", pick: c => c.perDollar.pct90.usd },
      { basis: "dollar", percentile: 80, color: "#f5a45c", pick: c => c.perDollar.pct80.usd },
      { basis: "dollar", percentile: 70, color: "#f8bd66", pick: c => c.perDollar.pct70.usd },
      { basis: "dollar", percentile: 60, color: "#efd081", pick: c => c.perDollar.pct60.usd },
      { basis: "dollar", percentile: 50, color: "#e9dfaa", pick: c => c.perDollar.pct50.usd },
      { basis: "coin", percentile: 50, color: "#8bdcc3", pick: c => c.perCoin.pct50.usd },
      { basis: "coin", percentile: 40, color: "#5bbacb", pick: c => c.perCoin.pct40.usd },
      { basis: "coin", percentile: 30, color: "#658fdf", pick: c => c.perCoin.pct30.usd },
      { basis: "coin", percentile: 20, color: "#9b80e0", pick: c => c.perCoin.pct20.usd },
    ];
    /** @param {Mode} mode @param {(typeof LEVELS)[number]} level */
    const levelSource = (mode, level) => level.pick((mode === "cointime" ? series.cointime : series.coinflow).urpd.all.costBasis);
    /** @param {Mode} mode @param {(typeof LEVELS)[number]} level */
    const metricName = (mode, level) => levelSource(mode, level).name;
    function points(response) {
      if (!Number.isInteger(response?.start) || !Array.isArray(response.data)) throw new Error("Invalid series data");
      return response.data.map((value, offset) => {
        const time = new Date(DAY_ZERO + (response.start + offset) * DAY_MS).toISOString().slice(0, 10);
        return typeof value === "number" && Number.isFinite(value) && value > 0 ? { time, value } : { time };
      });
    }
    /** @param {ReturnType<typeof priceSource>[]} sources */
    async function fetchSeries(sources) {
      const entries = await Promise.all(sources.map(async (source) => {
        const dataPoints = points(await source.by.day1.slice(START).fetch());
        if (!dataPoints.some(point => point.value !== undefined)) throw new Error(`No data for ${source.name}`);
        return [source.name, dataPoints];
      }));
      return Object.fromEntries(entries);
    }
    const chartElement = document.getElementById("chart");
    const status = document.getElementById("status");
    const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
    const cache = new Map();
    function load(key, sources) {
      if (!cache.has(key)) cache.set(key, fetchSeries(sources).catch(error => { cache.delete(key); throw error; }));
      return cache.get(key);
    }
    /** @type {Mode} */
    let activeMode = "cointime";
    try {
      const saved = new URLSearchParams(location.search).get("weight") || localStorage.getItem("brk-regime:weight");
      if (Object.hasOwn(MODES, saved)) activeMode = /** @type {Mode} */ (saved);
    } catch {}
    let chart, priceSeries, activeData, latestTime, requestVersion = 0;
    const levelSeries = [];
    const levelValues = LEVELS.map(level => {
      const element = document.createElement("div");
      element.className = "level";
      element.style.setProperty("--color", level.color);
      const label = document.createElement("span");
      label.textContent = `P${level.percentile}`;
      const value = document.createElement("b");
      value.textContent = "—";
      element.append(label, value);
      document.getElementById(`${level.basis}-levels`).append(element);
      return value;
    });
    function showReadout(time) {
      if (!activeData) return;
      const format = name => {
        const value = activeData[name].get(time);
        return value === undefined ? "—" : money.format(value);
      };
      document.getElementById("price").textContent = `BTC ${format(priceSource().name)}`;
      document.getElementById("date").textContent = time;
      /** @type {HTMLTimeElement} */ (document.getElementById("date")).dateTime = time;
      LEVELS.forEach((level, i) => { levelValues[i].textContent = format(metricName(activeMode, level)); });
      const zone = zoneAt(time);
      const zoneElement = document.getElementById("zone");
      zoneElement.replaceChildren(...(zone ? ["Price ", Object.assign(document.createElement("b"), { textContent: zone.text })] : []));
      zoneElement.style.setProperty("--zone-color", zone?.color ?? "#999");
    }
    function updateButtons() {
      /** @type {NodeListOf<HTMLElement>} */ (document.querySelectorAll("[data-mode]")).forEach(button => button.setAttribute("aria-pressed", String(button.dataset.mode === activeMode)));
    }
    const libraryReady = import("../modules/lightweight-charts/5.2.1/dist/lightweight-charts.standalone.production.mjs");
    const compactUsd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", notation: "compact", maximumSignificantDigits: 3 });

    /** Fills between two price lines: each zone between neighboring percentiles. */
    class ZoneRenderer {
      update(data, options) {
        this.data = data;
        this.options = options;
      }
      draw(target, priceToCoordinate) {
        const { bars, visibleRange } = this.data ?? {};
        if (!visibleRange || visibleRange.to - visibleRange.from < 2) return;
        target.useBitmapCoordinateSpace(({ context, horizontalPixelRatio, verticalPixelRatio }) => {
          const points = bars.slice(visibleRange.from, visibleRange.to).flatMap(({ x, originalData: { upper, lower } }) => {
            const top = priceToCoordinate(upper), bottom = priceToCoordinate(lower);
            return top === null || bottom === null ? [] : [{ x: x * horizontalPixelRatio, top: top * verticalPixelRatio, bottom: bottom * verticalPixelRatio }];
          });
          if (points.length < 2) return;
          context.beginPath();
          points.forEach(({ x, top }, index) => (index ? context.lineTo(x, top) : context.moveTo(x, top)));
          for (const { x, bottom } of points.toReversed()) context.lineTo(x, bottom);
          context.closePath();
          context.fillStyle = this.options.fillColor;
          context.fill();
        });
      }
    }
    class ZoneSeries {
      constructor(defaults) {
        this.defaults = defaults;
        this.view = new ZoneRenderer();
      }
      renderer() { return this.view; }
      update(data, options) { this.view.update(data, options); }
      priceValueBuilder(row) { return [row.upper, row.lower, (row.upper + row.lower) / 2]; }
      isWhitespace(row) { return !(Number.isFinite(row.upper) && Number.isFinite(row.lower)); }
      defaultOptions() { return { ...this.defaults, fillColor: "transparent", lastValueVisible: false, priceLineVisible: false }; }
    }
    const zoneSeries = [];

    /** The zone the price sits in: between which neighboring levels. */
    function zoneAt(time) {
      const price = activeData[priceSource().name].get(time);
      if (price === undefined) return null;
      const values = LEVELS.map(level => activeData[metricName(activeMode, level)].get(time));
      if (values[0] !== undefined && price >= values[0]) return { text: "above every level", color: LEVELS[0].color };
      for (let index = 0; index < LEVELS.length - 1; index++) {
        const upper = values[index], lower = values[index + 1];
        if (upper === undefined || lower === undefined) continue;
        if (price <= upper && price >= lower) return { text: `between ${label(LEVELS[index])} and ${label(LEVELS[index + 1])}`, color: LEVELS[index + 1].color };
      }
      return { text: `below ${label(LEVELS.at(-1))}`, color: LEVELS.at(-1).color };
    }
    const label = level => `P${level.percentile} per ${level.basis}`;
    /** @param {Mode} mode */
    async function activate(mode) {
      const version = ++requestVersion;
      chartElement.setAttribute("aria-busy", "true");
      status.classList.remove("error");
      status.textContent = `Loading ${MODES[mode].toLowerCase()} regime…`;
      try {
        const library = await libraryReady;
        series ??= (await clientReady).series;
        const [market, weighted] = await Promise.all([
          load("market", [priceSource(), levelSource(mode, LEVELS[0])]),
          load(mode, LEVELS.filter(level => level.percentile !== 100).map(level => levelSource(mode, level))),
        ]);
        if (version !== requestVersion) return;
        if (!chart) {
          chart = library.createChart(chartElement, {
            autoSize: true,
            layout: { background: { type: "solid", color: "#000" }, textColor: "#888", fontFamily: "ui-monospace, monospace", attributionLogo: false },
            grid: { vertLines: { visible: false }, horzLines: { color: "#141414" } },
            localization: { priceFormatter: value => compactUsd.format(value) },
            rightPriceScale: { mode: library.PriceScaleMode.Logarithmic, borderVisible: false, scaleMargins: { top: .08, bottom: .06 } },
            timeScale: { borderVisible: false, rightOffset: 2, minBarSpacing: 0.05 },
            crosshair: { mode: library.CrosshairMode.Normal },
          });
          // Zones first (underneath), each tinted with its lower level's color.
          for (const level of LEVELS.slice(1)) zoneSeries.push(chart.addCustomSeries(new ZoneSeries(library.customSeriesDefaultOptions), {
            fillColor: `${level.color}2e`,
          }));
          for (const level of LEVELS) levelSeries.push(chart.addSeries(library.LineSeries, {
            color: `${level.color}b3`, lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
          }));
          priceSeries = chart.addSeries(library.LineSeries, { color: "#fff", lineWidth: 2, priceLineVisible: false, lastValueVisible: true });
          chart.subscribeCrosshairMove(event => showReadout(typeof event.time === "string" ? event.time : latestTime));
          chartElement.addEventListener("dblclick", () => chart.timeScale().fitContent());
        }
        const range = chart.timeScale().getVisibleRange();
        const data = { ...market, ...weighted };
        LEVELS.forEach((level, i) => levelSeries[i].setData(data[metricName(mode, level)]));
        zoneSeries.forEach((zone, i) => {
          const upper = new Map(data[metricName(mode, LEVELS[i])].map(point => [point.time, point.value]));
          zone.setData(data[metricName(mode, LEVELS[i + 1])].map(({ time, value }) => {
            const top = upper.get(time);
            return value === undefined || top === undefined ? { time } : { time, upper: top, lower: value };
          }));
        });
        priceSeries.setData(data[priceSource().name]);
        activeMode = mode;
        activeData = Object.fromEntries(Object.entries(data).map(([name, values]) => [name, new Map(values.map(point => [point.time, point.value]))]));
        latestTime = data[priceSource().name].findLast(point => point.value !== undefined).time;
        document.getElementById("mode-label").textContent = MODES[mode];
        showReadout(latestTime);
        updateButtons();
        if (range) chart.timeScale().setVisibleRange(range);
        else chart.timeScale().fitContent();
        try { localStorage.setItem("brk-regime:weight", mode); } catch {}
        try {
          const url = new URL(location.href);
          url.searchParams.set("weight", mode);
          history.replaceState(null, "", url);
        } catch {}
        status.textContent = "";
      } catch (error) {
        if (version !== requestVersion) return;
        status.classList.add("error");
        status.textContent = `Could not load ${MODES[mode].toLowerCase()} data. ${error.message}`;
        const retry = document.createElement("button");
        retry.type = "button";
        retry.textContent = "Retry";
        retry.addEventListener("click", () => activate(mode));
        status.append(retry);
      } finally {
        if (version === requestVersion) chartElement.setAttribute("aria-busy", "false");
      }
    }
    document.getElementById("weighting").addEventListener("click", event => {
      const mode = /** @type {Element} */ (event.target).closest("button")?.dataset.mode;
      if (Object.hasOwn(MODES, mode)) activate(/** @type {Mode} */ (mode));
    });
    updateButtons();
    activate(activeMode);
  </script>
</body>
</html>
