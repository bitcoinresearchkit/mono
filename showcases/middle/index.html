<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Time Bitcoin spends above all-holder cointime-weighted capitalized price and True Market Mean.">
  <title>Bitcoin Middle</title>
  <style>
    @font-face { font-family: Instrument; src: url('../fonts/InstrumentSerif-Regular.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: Instrument; src: url('../fonts/InstrumentSerif-Italic.woff2') format('woff2'); font-style: italic; font-display: swap; }
    :root { color-scheme: dark; background: #100f0d; color: #f0f1e9; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; --muted: #96918a; --orange: #f2660f; --cp: #00b747; --tmm: #1e6fff; --gutter: clamp(22px, 4vw, 64px); }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { margin: 0; }
    main { height: 100dvh; min-height: 0; min-width: 0; overflow: hidden; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; padding-bottom: 20px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 18px 32px; padding: 20px var(--gutter) 16px; }
    a { color: inherit; text-decoration: none; }
    .wordmark { display: inline-flex; gap: 12px; letter-spacing: .15em; margin-bottom: 14px; }
    .wordmark span, .detail { color: var(--muted); }
    h1 { font: 400 clamp(44px, 4.8vw, 72px)/1.02 Instrument, Georgia, serif; letter-spacing: -.025em; margin: 0; }
    h1 span { color: var(--orange); }
    h1 em { font-weight: 400; }
    .readouts { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 24px; font-variant-numeric: tabular-nums; }
    .readouts > div { display: grid; gap: 3px; }
    .readouts strong { font: 400 26px/1.15 ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
    .model-value { display: flex; align-items: baseline; gap: 10px; }
    .readouts .detail { white-space: nowrap; font-size: 12px; }
    .cp { color: var(--cp); }
    .tmm { color: var(--tmm); }
    .readouts .model { min-width: 18ch; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; padding: 0 var(--gutter) 12px; color: var(--muted); }
    .toolbar label { display: inline-flex; align-items: baseline; gap: 9px; }
    input { font: inherit; color: #f0f1e9; background: transparent; border: 0; border-bottom: 1px solid #d8cfc130; padding: 4px 0; width: 16ch; }
    input:focus-visible, a:focus-visible { outline: 1px solid var(--orange); outline-offset: 4px; }
    .note { margin-left: auto; }
    .plot { position: relative; min-width: 0; min-height: 0; contain: size layout; }
    #chart { position: absolute; inset: 0; overflow: hidden; }
    #status { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%); padding: 12px; background: #262019; max-width: calc(100% - 32px); }
    #status:empty { display: none; }
    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; color: var(--muted); padding: 16px var(--gutter) 0; font-variant-numeric: tabular-nums; }
    @media (max-width: 700px) {
      header { padding-top: 18px; gap: 16px; }
      .readouts { width: 100%; justify-content: space-between; gap: 12px 14px; }
      .readouts strong { font-size: 22px; }
      .readouts .model { min-width: 0; }
      .note { width: 100%; margin-left: 0; }
    }
    @media (max-width: 430px) {
      .readouts > div:first-child { width: 100%; display: flex; justify-content: space-between; align-items: baseline; }
    }
    @media (max-height: 650px) {
      main { padding-bottom: 8px; }
      header { padding: 12px var(--gutter); gap: 12px 32px; }
      .wordmark { margin-bottom: 8px; }
      h1 { font-size: 36px; }
      .readouts { gap: 8px 14px; }
      .readouts strong { font-size: 20px; }
      .toolbar { padding-bottom: 8px; gap: 6px 16px; }
      footer { padding-top: 8px; gap: 4px 12px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div><a class="wordmark" href="https://bitview.space">BITVIEW <span>/ MIDDLE</span></a><h1><span>Bitcoin</span> <em>Middle</em></h1></div>
    <div class="readouts">
      <div><time id="date" class="detail">—</time><strong id="price">—</strong></div>
      <div class="model"><span class="cp" title="All-holder cointime-weighted capitalized price">Cointime Weighted Capitalized Price</span><div class="model-value"><strong id="cp-share" class="cp">—</strong><span id="cp-count" class="detail">—</span></div></div>
      <div class="model"><span class="tmm" title="True Market Mean">True Market Mean</span><div class="model-value"><strong id="tmm-share" class="tmm">—</strong><span id="tmm-count" class="detail">—</span></div></div>
    </div>
  </header>
  <div class="toolbar">
    <label>From <input type="date" id="from" aria-label="Calculation start date"></label>
    <span class="note">Cumulative days at or above · Daily close ≥ model</span>
  </div>
  <section class="plot" aria-label="Price models and cumulative time above">
    <div id="chart" role="img" aria-label="Bitcoin and two cost-basis models above; cumulative percentage of daily closes at or above each model in the middle; equal-height bars at the bottom colored by the metric closer to 50%" aria-busy="true"></div>
    <div id="status" role="status">Loading chart…</div>
  </section>
  <footer><span>Closer to 50% · <span id="winner-label">—</span></span><span>All holders · Completed UTC days</span><span>Live from bitview.space · <time id="generated">—</time></span></footer>
</main>
<script type="module">
      // @ts-check
  import { createChart, LineSeries, BaselineSeries, HistogramSeries, CandlestickSeries, ColorType, CrosshairMode, PriceScaleMode } from '../modules/lightweight-charts/5.2.1/dist/lightweight-charts.standalone.production.mjs';

  function cumulativeShares(rows) {
    let cpCount = 0, tmmCount = 0, days = 0;
    return rows.map(row => {
      if (row.cp > 0 && row.tmm > 0) {
        cpCount += Number(row.close >= row.cp);
        tmmCount += Number(row.close >= row.tmm);
        days++;
      }
      const advantage = days ? 50 * (Math.abs(2 * tmmCount - days) - Math.abs(2 * cpCount - days)) / days : null;
      return { ...row, days, cpCount, tmmCount, advantage, cpShare: days ? 100 * cpCount / days : null, tmmShare: days ? 100 * tmmCount / days : null };
    });
  }

  /** @type {(id: string) => any} */
  const element = id => document.getElementById(id);
  const status = element('status'), chartElement = element('chart');
  const from = element('from');
  const palette = getComputedStyle(document.documentElement);
  const DAY = 86_400, CP = palette.getPropertyValue('--cp').trim(), TMM = palette.getPropertyValue('--tmm').trim();
  const dateFormat = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
  const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  const integer = new Intl.NumberFormat('en-US');
  try {
    // Live from bitview.space: price against the all-holder cointime-weighted capitalized price
    // and the True Market Mean.
    const { BitviewClient } = await import('../modules/bitview-client/index.js');
    const client = new BitviewClient({ baseUrl: 'https://bitview.space', timeout: 60_000 });
    const { price, cointime } = client.series;
    const [prices, cps, tmms] = await Promise.all(
      [price.ohlc.cents, cointime.awake.capitalizedPrice.cents, cointime.prices.trueMarketMean.cents].map(series => series.by.day1.fetch()),
    );
    const DAY_ZERO = Date.UTC(2009, 0, 1) / 1000;
    const at = (history, day) => history.data[day - history.start];
    const validCandle = candle => Array.isArray(candle) && candle.every(value => Number.isFinite(value) && value > 0);
    const isoDay = day => new Date((DAY_ZERO + day * DAY) * 1000).toISOString().slice(0, 10);
    // Completed UTC days only: today's partial close would move the shares.
    const today = Math.floor((Date.now() / 1000 - DAY_ZERO) / DAY);
    const lastDay = Math.min(prices.start + prices.data.length, today) - 1;
    let firstDay = prices.start;
    while (firstDay <= lastDay && !validCandle(at(prices, firstDay))) firstDay++;
    if (firstDay > lastDay) throw new Error('No daily prices yet.');
    let previous = at(prices, firstDay);
    const allRows = [];
    for (let day = firstDay; day <= lastDay; day++) {
      const candle = at(prices, day);
      previous = validCandle(candle) ? candle : Array(4).fill(previous[3]);
      const [open, high, low, close] = previous;
      allRows.push({ time: DAY_ZERO + day * DAY, open, high, low, close, cp: at(cps, day) ?? 0, tmm: at(tmms, day) ?? 0 });
    }
    const firstTime = allRows[0].time;
    from.min = isoDay(firstDay);
    from.max = isoDay(lastDay);
    from.value = from.min;
    element('generated').dateTime = new Date().toISOString();
    element('generated').textContent = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date());
    await document.fonts.ready;
    await new Promise(requestAnimationFrame);
    const chart = createChart(chartElement, {
      width: chartElement.clientWidth, height: chartElement.clientHeight, hoveredSeriesOnTop: false,
      layout: { background: { type: ColorType.Solid, color: '#100f0d' }, textColor: '#96918a', fontSize: 13, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', attributionLogo: false, panes: { separatorColor: '#d8cfc118', separatorHoverColor: '#d8cfc130', enableResize: true } },
      grid: { vertLines: { visible: false }, horzLines: { color: '#d8cfc10a' } },
      rightPriceScale: { mode: PriceScaleMode.Logarithmic, borderVisible: false, minimumWidth: 86, scaleMargins: { top: 0.1, bottom: 0.08 } },
      timeScale: { borderVisible: false, rightOffset: 2, minBarSpacing: 0.06, fixLeftEdge: false, fixRightEdge: false },
      crosshair: { mode: CrosshairMode.MagnetOHLC, vertLine: { color: '#d8cfc140', labelBackgroundColor: '#493321' }, horzLine: { color: '#d8cfc140', labelBackgroundColor: '#493321' } },
      handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
      handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true },
    });
    const priceOptions = { lineWidth: 1, priceLineVisible: false, lastValueVisible: true, crosshairMarkerVisible: false, priceFormat: { type: 'custom', minMove: 0.01, formatter: value => value.toLocaleString('en-US', { maximumFractionDigits: value < 10 ? 2 : 0 }) } };
    const cpLine = chart.addSeries(LineSeries, { ...priceOptions, color: CP });
    const tmmLine = chart.addSeries(LineSeries, { ...priceOptions, color: TMM });
    const priceLine = chart.addSeries(LineSeries, { ...priceOptions, color: '#f0f1e9', lineWidth: 1.5, lastValueVisible: true });
    const candles = chart.addSeries(CandlestickSeries, { visible: false, upColor: '#100f0d', downColor: '#f0f1e9', wickUpColor: '#f0f1e9', wickDownColor: '#f0f1e9', borderUpColor: '#f0f1e9', borderDownColor: '#f0f1e9', priceLineVisible: false, priceFormat: priceOptions.priceFormat });
    const shareOptions = { baseValue: { type: 'price', price: 50 }, baseLineVisible: false, lineWidth: 2, priceLineVisible: false, lastValueVisible: true, crosshairMarkerVisible: false, priceFormat: { type: 'custom', minMove: 0.1, formatter: value => `${value.toFixed(1)}%` }, autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 100 } }) };
    const addShare = color => chart.addSeries(BaselineSeries, {
      ...shareOptions, topLineColor: color, bottomLineColor: color,
      topFillColor1: `${color}26`, topFillColor2: `${color}26`,
      bottomFillColor1: `${color}26`, bottomFillColor2: `${color}26`,
    }, 1);
    const cpShare = addShare(CP);
    const tmmShare = addShare(TMM);
    chart.priceScale('right', 1).applyOptions({ mode: PriceScaleMode.Normal, scaleMargins: { top: 0.07, bottom: 0.07 } });
    cpShare.createPriceLine({ price: 50, color: '#d8cfc155', lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: '50%' });
    const winner = chart.addSeries(HistogramSeries, {
      base: 0, priceLineVisible: false, lastValueVisible: true,
      priceFormat: { type: 'custom', minMove: 1, formatter: () => '—', tickmarksFormatter: values => values.map(() => '') },
      autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 1 } }),
    }, 2);
    chart.priceScale('right', 2).applyOptions({ mode: PriceScaleMode.Normal, scaleMargins: { top: 0.12, bottom: 0.12 } });
    chart.panes()[0].setStretchFactor(2);
    chart.panes()[1].setStretchFactor(1.2);
    chart.panes()[2].setStretchFactor(0.6);
    let rows = [], hoverTime = null, candlesVisible = false, winnerLabel = '';
    function readout() {
      if (!rows.length) return;
      const range = chart.timeScale().getVisibleLogicalRange();
      const last = Math.max(0, Math.min(rows.length - 1, Math.floor(range?.to ?? rows.length - 1)));
      const index = hoverTime === null ? -1 : Math.round((hoverTime - rows[0].time) / DAY);
      const row = rows[index] ?? rows[last];
      const label = row.advantage === null ? '—' : row.advantage > 0 ? 'CP' : row.advantage < 0 ? 'TMM' : 'Tie';
      if (label !== winnerLabel) {
        winnerLabel = label;
        element('winner-label').textContent = label;
        element('winner-label').style.color = label === 'CP' ? CP : label === 'TMM' ? TMM : '#96918a';
        winner.applyOptions({ priceFormat: { formatter: () => label } });
      }
      element('date').textContent = dateFormat.format(row.time * 1000);
      element('date').dateTime = new Date(row.time * 1000).toISOString().slice(0, 10);
      element('price').textContent = money.format(row.close / 100);
      for (const key of ['cp', 'tmm']) {
        element(`${key}-share`).textContent = row.days ? `${row[`${key}Share`].toFixed(1)}%` : '—';
        element(`${key}-count`).textContent = `${integer.format(row[`${key}Count`])} / ${integer.format(row.days)} days`;
      }
    }
    function calculate() {
      if (!from.value || !from.validity.valid) {
        status.textContent = 'Choose a valid date range within the available history.';
        return;
      }
      const start = (Date.parse(from.value) / 1000 - firstTime) / DAY;
      rows = cumulativeShares(allRows.slice(start));
      hoverTime = null;
      priceLine.setData(rows.map(row => ({ time: row.time, value: row.close / 100 })));
      candles.setData(rows.map(row => ({ time: row.time, open: row.open / 100, high: row.high / 100, low: row.low / 100, close: row.close / 100 })));
      cpLine.setData(rows.map(row => (row.cp > 0 ? { time: row.time, value: row.cp / 100 } : { time: row.time })));
      tmmLine.setData(rows.map(row => (row.tmm > 0 ? { time: row.time, value: row.tmm / 100 } : { time: row.time })));
      cpShare.setData(rows.map(row => (row.cpShare !== null ? { time: row.time, value: row.cpShare } : { time: row.time })));
      tmmShare.setData(rows.map(row => (row.tmmShare !== null ? { time: row.time, value: row.tmmShare } : { time: row.time })));
      winner.setData(rows.map(row => row.advantage === null ? { time: row.time } : {
        time: row.time, value: 1, color: row.advantage > 0 ? CP : row.advantage < 0 ? TMM : '#96918a',
      }));
      chart.timeScale().fitContent();
      status.textContent = '';
      readout();
    }
    chart.subscribeCrosshairMove(({ time }) => { hoverTime = typeof time === 'number' ? time : null; readout(); });
    let rangeFrame = 0;
    chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
      cancelAnimationFrame(rangeFrame);
      rangeFrame = requestAnimationFrame(() => {
        const show = range && range.to - range.from <= (candlesVisible ? 600 : 500);
        if (Boolean(show) !== candlesVisible) {
          candlesVisible = Boolean(show);
          priceLine.applyOptions({ visible: !candlesVisible });
          candles.applyOptions({ visible: candlesVisible });
        }
        readout();
      });
    });
    from.addEventListener('change', calculate);
    chartElement.addEventListener('dblclick', () => chart.timeScale().fitContent());
    let resizeFrame = 0;
    new ResizeObserver(() => {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => chart.resize(chartElement.clientWidth, chartElement.clientHeight, true));
    }).observe(chartElement);
    calculate();
    chartElement.setAttribute('aria-busy', 'false');
  } catch (error) {
    console.error(error);
    chartElement.setAttribute('aria-busy', 'false');
    status.textContent = 'Unable to load the chart. Please reload the page.';
  }
</script>
</body>
</html>
