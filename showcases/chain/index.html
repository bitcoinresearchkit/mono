        </span>
        <span>bitview</span>
      </a>
      <form id="jump" role="search" autocomplete="off">
        <input
          name="block"
          type="search"
          inputmode="text"
          placeholder="Height or hash"
          aria-label="Open a block by height or hash"
          enterkeyhint="go"
          spellcheck="false"
        />
        <kbd>/</kbd>
      </form>
    </header>

    <main id="explore"></main>

    <noscript><p>JavaScript is required to watch the chain.</p></noscript>

    <!-- Styles and code are inline; the generated client and the QR encoder load from ../modules.
         Blocks, mempool projections and series come live from bitview.space. -->
    <script type="module">
      // @ts-check
      // Config ---------------------------------------------------------------

      const ORIGIN = "https://bitview.space";
      const REQUEST_TIMEOUT_MS = 10_000;
      const SATS_PER_BTC = 100_000_000;
      const MAX_BLOCK_WEIGHT = 4_000_000;
      const DIFFICULTY_EPOCH_BLOCKS = 2_016;
      const HALVING_EPOCH_BLOCKS = 210_000;
      const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)");
      /** Wide screens show the chain as a column beside the block, narrow ones as a row above it. */
      const WIDE = matchMedia("(min-width: 48rem)");
      const CAN_HOVER = matchMedia("(hover: hover) and (pointer: fine)");

      // DOM ------------------------------------------------------------------

      /**
       * @template {keyof HTMLElementTagNameMap} K
       * @param {K} tag
       * @param {Record<string, string | number | boolean | null | undefined> | null} [attributes]
       * @param {...(Node | string | number | null | undefined | false)} children
       * @returns {HTMLElementTagNameMap[K]}
       */
      function el(tag, attributes, ...children) {
        const node = document.createElement(tag);

        for (const [name, value] of Object.entries(attributes ?? {})) {
          if (value == null || value === false) continue;
          node.setAttribute(name, value === true ? "" : String(value));
        }

        for (const child of children) {
          if (child != null && child !== false) node.append(child instanceof Node ? child : String(child));
        }

        return node;
      }

      const dim = (text) => el("span", { "data-dim": true }, text);

      /** Touch press feedback (mouse uses :hover / :active). */
      function trackPress() {
        const selector = "a[href], button:not(:disabled), input, summary";
        let pressed = null;
        const clear = () => {
          pressed?.removeAttribute("data-press");
          pressed = null;
        };

        document.addEventListener("pointerdown", (event) => {
          if (event.pointerType === "mouse" || !(event.target instanceof Element)) return;
          clear();
          pressed = event.target.closest(selector);
          pressed?.setAttribute("data-press", "");
        }, { passive: true });
        document.addEventListener("pointerup", clear, { passive: true });
        document.addEventListener("pointercancel", clear, { passive: true });
        addEventListener("blur", clear);
      }

      /** @param {Element} element @param {string} property */
      function transitionMs(element, property) {
        const style = getComputedStyle(element);
        const properties = style.transitionProperty.split(",").map((part) => part.trim());
        const toMs = (value) => value.split(",").map((part) => {
          const time = part.trim();
          return Number.parseFloat(time) * (time.endsWith("ms") ? 1 : 1_000);
        });
        const index = properties.findIndex((part) => part === property || part === "all");
        if (index < 0) return 0;
        const durations = toMs(style.transitionDuration);
        const delays = toMs(style.transitionDelay);

        return (durations[index] ?? durations.at(-1) ?? 0) + (delays[index] ?? delays.at(-1) ?? 0);
      }

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      // Network --------------------------------------------------------------

      /** @param {string} path @param {AbortSignal} [signal] */
      async function request(path, signal) {
        const signals = [AbortSignal.timeout(REQUEST_TIMEOUT_MS)];
        if (signal) signals.push(signal);
        const response = await fetch(`${ORIGIN}${path}`, { signal: AbortSignal.any(signals) });

        if (!response.ok) throw Object.assign(new Error(`HTTP ${response.status}: ${path}`), { status: response.status });

        return response;
      }

      const requestJson = async (path, signal) => (await request(path, signal)).json();

      /** @template T @param {() => Promise<T>} load @returns {() => Promise<T>} */
      function lazy(load) {
        /** @type {Promise<T> | null} */
        let promise = null;

        return () => (promise ??= load().catch((error) => {
          promise = null;
          throw error;
        }));
      }

      const loadClient = lazy(async () => {
        const { BitviewClient } = await import("../modules/bitview-client/index.js");
        return new BitviewClient({ baseUrl: ORIGIN, timeout: REQUEST_TIMEOUT_MS, browserCache: false });
      });

      /** @typedef {Awaited<ReturnType<typeof loadClient>>} Client */

      /**
       * One request for several series over the same range.
       * @param {Client} client
       * @param {{ name: string }[]} series
       * @param {Parameters<Client["getSeriesBulk"]>[1]} index
       * @param {number} start
       * @param {number} end
       * @param {{ signal?: AbortSignal, memCache?: boolean }} options
       */
      async function fetchBulk(client, series, index, start, end, options) {
        const response = await client.getSeriesBulk(series.map(({ name }) => name).join(","), index, start, end, undefined, undefined, options);
        return /** @type {{ data: any[] }[]} */ (response);
      }

      /** lean-qr ships ambient module types that don't reach its bundled build: type what's used. */
      const loadQr = lazy(async () => {
        const { generate } = await import("../modules/lean-qr/2.7.3/index.mjs");
        return /** @type {(text: string) => { toDataURL(options: { padX: number, padY: number, scale: number }): string } | undefined} */ (
          /** @type {unknown} */ (generate)
        );
      });

      const chainApi = {
        block: (hash, signal) => requestJson(`/api/v1/block/${hash}`, signal),
        tip: (signal) => requestJson("/api/v1/blocks", signal),
        tipHeight: async () => Number(await (await request("/api/blocks/tip/height")).text()),
        /** Up to 15 blocks, newest first, starting at `height` (the tip's when `height` is above it). */
        from: (height, signal) => requestJson(`/api/v1/blocks/${height}`, signal),
        mempool: (signal) => requestJson("/api/v1/fees/mempool-blocks", signal),
      };

      // Blocks known to this page ------------------------------------------

      const REORG_SAFE_DEPTH = 6;
      const blocksByHash = new Map();
      /** Heights map to hashes only once buried: shallower ones may still be reorganized. */
      const hashByHeight = new Map();
      let knownTipHeight = -1;

      function cacheBlock(block) {
        blocksByHash.set(block.id, block);
        if (knownTipHeight - block.height >= REORG_SAFE_DEPTH) hashByHeight.set(block.height, block.id);
        return block;
      }

      function noteTip(height) {
        knownTipHeight = Math.max(knownTipHeight, height);
      }

      /** @param {number | string} target height or hash */
      async function resolveBlock(target) {
        if (typeof target === "string") {
          return blocksByHash.get(target) ?? cacheBlock(await chainApi.block(target));
        }

        const hash = hashByHeight.get(target);
        if (hash) return blocksByHash.get(hash);

        // Centered window: prefetches neighbors for newer/older stepping.
        const blocks = await chainApi.from(target + 7);
        if (blocks[0].height < target + 7) noteTip(blocks[0].height);
        blocks.forEach(cacheBlock);
        const block = blocks.find(({ height }) => height === target);
        if (!block) throw Object.assign(new Error("Block not found"), { status: 404 });

        return block;
      }

      // Formatting -----------------------------------------------------------

      const formatNumber = (value) => value.toLocaleString();
      const formatMegabytes = (bytes) => (bytes / 1_000_000).toFixed(2);
      const formatBtcCompact = (sats) =>
        (sats / SATS_PER_BTC).toLocaleString(undefined, { maximumSignificantDigits: 3 });
      const formatBytes = (bytes) =>
        bytes >= 1_000_000 ? `${(bytes / 1_000_000).toFixed(2)} MB` : `${formatNumber(bytes)} B`;
      const formatWeight = (weight) =>
        weight >= 1_000_000 ? `${(weight / 1_000_000).toFixed(2)} MWU` : `${formatNumber(weight)} WU`;
      const formatBlockFill = (weight) => `${((weight / MAX_BLOCK_WEIGHT) * 100).toFixed(1)}%`;
      const formatPoolBlock = (value) => `#${formatNumber(value ?? 0)}`;
      const formatShortDate = (seconds) => {
        const date = new Date(seconds * 1_000);
        return `${MONTHS[date.getMonth()]} ${date.getDate()}`;
      };
      const formatYear = (seconds) => String(new Date(seconds * 1_000).getFullYear());
      const formatDateTime = (seconds) =>
        new Date(seconds * 1_000).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "medium" });

      /** @param {number} rate */
      function formatFeeRate(rate) {
        if (rate >= 1_000_000) return `${(rate / 1_000_000).toFixed(1)}M`;
        if (rate >= 100_000) return `${Math.round(rate / 1_000)}k`;
        if (rate >= 1_000) return `${(rate / 1_000).toFixed(1)}k`;
        if (rate >= 100) return Math.round(rate).toLocaleString();
        if (rate >= 10) return rate.toFixed(1);
        return rate.toFixed(2);
      }

      /** @param {number} height */
      function splitHeight(height) {
        const value = String(height);
        return [`#${"0".repeat(Math.max(0, 7 - value.length))}`, value];
      }

      const heightElement = (height) => {
        const [prefix, value] = splitHeight(height);
        return el("span", null, dim(prefix), value);
      };

      /** @param {number} seconds */
      function formatInterval(seconds) {
        const total = Math.max(0, Math.round(seconds));
        const hours = Math.floor(total / 3_600);
        const minutes = Math.floor((total % 3_600) / 60);
        if (hours) return `${hours}h ${String(minutes).padStart(2, "0")}m`;
        const remainder = total % 60;
        if (minutes) return `${minutes}m ${String(remainder).padStart(2, "0")}s`;
        return `${remainder}s`;
      }

      /** @param {number} seconds */
      function formatUtcOffset(seconds) {
        const offset = -new Date(seconds * 1_000).getTimezoneOffset();
        if (offset === 0) return "UTC+0";
        const absolute = Math.abs(offset);
        const minutes = absolute % 60;
        return `UTC${offset > 0 ? "+" : "-"}${Math.floor(absolute / 60)}${minutes ? `:${String(minutes).padStart(2, "0")}` : ""}`;
      }

      const formatClock = (seconds) => {
        const date = new Date(seconds * 1_000);
        return [date.getHours(), date.getMinutes(), date.getSeconds()].map((part) => String(part).padStart(2, "0"));
      };

      const RELATIVE_TIME = new Intl.RelativeTimeFormat(undefined);
      /** @type {[Intl.RelativeTimeFormatUnit, number][]} */
      const RELATIVE_UNITS = [["year", 31_557_600], ["month", 2_629_800], ["day", 86_400], ["hour", 3_600], ["minute", 60]];

      /** @param {number} seconds */
      function formatDateAndAge(seconds) {
        const date = new Date(seconds * 1_000).toLocaleDateString(undefined, { dateStyle: "medium" });
        const difference = seconds - Date.now() / 1_000;
        if (Math.abs(difference) < 60) return `${date} · just now`;
        const [unit, size] = RELATIVE_UNITS.find(([, duration]) => Math.abs(difference) >= duration);
        return `${date} · ${RELATIVE_TIME.format(Math.trunc(difference / size), unit)}`;
      }

      /** @param {number} height @param {number} length */
      function epochProgress(height, length) {
        const blocks = (height % length) + 1;
        return { number: Math.floor(height / length) + 1, ratio: blocks / length, remaining: length - blocks };
      }

      const formatEpoch = (height, length) => {
        const { number, ratio } = epochProgress(height, length);
        return `#${formatNumber(number)} · ${(ratio * 100).toFixed(1)}%`;
      };

      /** Printable runs of the coinbase script. */
      const coinbaseMessage = (raw) =>
        (raw.match(/[\x20-\x7e]{2,}/g) ?? [])
          .map((value) => value.trim())
          .filter((value) => /[A-Za-z0-9]/.test(value))
          .join(" · ");

      // Amounts: the insignificant digits are muted ---------------------------

      function pushPart(parts, text, muted) {
        const last = parts.at(-1);
        if (last?.muted === muted) last.text += text;
        else parts.push({ text, muted });
      }

      const groupDigits = (value, separator) => value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, separator);

      /** @param {number} sats */
      function btcParts(sats) {
        const parts = [];
        const absolute = Math.abs(sats);
        const whole = Math.floor(absolute / SATS_PER_BTC);
        const fraction = String(absolute % SATS_PER_BTC).padStart(8, "0");
        const firstDigit = fraction.search(/[1-9]/);
        const lastDigit = fraction.search(/0*$/) - 1;
        const pushFraction = (isMuted, isSpaceMuted) => {
          for (let index = 0; index < fraction.length; index += 1) {
            pushPart(parts, fraction[index], isMuted(index));
            if (index === 1 || index === 4) pushPart(parts, " ", isSpaceMuted(index));
          }
        };

        if (sats < 0) pushPart(parts, "-", false);
        pushPart(parts, "₿", true);

        if (whole === 0) {
          const mutedUntil = firstDigit === -1 ? fraction.length : firstDigit;
          pushPart(parts, "0.", true);
          pushFraction((index) => index < mutedUntil, (index) => index < mutedUntil);
        } else if (lastDigit === -1) {
          pushPart(parts, `${groupDigits(whole, " ")}`, false);
          pushPart(parts, ".", true);
          pushFraction(() => true, () => true);
        } else {
          pushPart(parts, `${groupDigits(whole, " ")}.`, false);
          pushFraction((index) => index > lastDigit, (index) => index >= lastDigit);
        }

        return parts;
      }

      /** @param {number} dollars */
      function usdParts(dollars) {
        const parts = [];
        const cents = Math.round(Math.abs(dollars) * 100);
        const fraction = String(cents % 100).padStart(2, "0");

        if (dollars < 0 && cents > 0) pushPart(parts, "-", false);
        pushPart(parts, "$", true);
        pushPart(parts, groupDigits(Math.floor(cents / 100), ","), false);
        if (fraction === "00") {
          pushPart(parts, ".00", true);
        } else {
          pushPart(parts, ".", false);
          pushPart(parts, fraction[0], false);
          pushPart(parts, fraction[1], fraction[1] === "0");
        }

        return parts;
      }

      const partsText = (parts) => parts.map(({ text }) => text).join("");
      const satsToUsd = (sats, price) => (sats / SATS_PER_BTC) * price;

      /** @param {HTMLElement} element @param {{ text: string, muted: boolean }[]} parts */
      function renderAmount(element, parts) {
        element.dataset.amount = "";
        element.replaceChildren(...parts.map(({ text, muted }) => (muted ? el("span", { "data-muted": true }, text) : text)));
        return element;
      }

      const amount = (tag, parts, attributes) => renderAmount(el(tag, attributes), parts);

      // Pools ----------------------------------------------------------------

      const poolDisplayName = (name) => name.replace(/\s+(Pool|USA)$/i, "").trim();

      function poolLogo(pool) {
        const slug = pool.slug || pool.name.toLowerCase().replace(/[^a-z0-9]/g, "");
        const logo = el("img", { src: `../pools/${slug}.svg`, alt: "", decoding: "async" });
        logo.addEventListener("error", () => {
          logo.src = "../pools/default.svg";
        }, { once: true });
        return logo;
      }

      // Legend items ---------------------------------------------------------

      /** @param {{ label: string, color: string, detail?: Node | string }} args */
      function legendItem({ label, color, detail }) {
        const value = el("output", { "data-legend-value": true });
        const button = el(
          "button",
          { type: "button", "data-legend-item": true, style: `--color:${color}`, "aria-label": label },
          el("span", { "data-legend-label": true }, label),
          value,
          detail != null && el("output", { "data-legend-detail": true }, detail),
        );

        return { button, value };
      }

      // Fee rates ------------------------------------------------------------

      const FEE_RATE_PERCENTILES = [0, 10, 25, 50, 75, 90, 100];
      const FEE_RATE_STOPS = [
        { label: "min", color: "var(--emerald)" },
        { label: "10%", color: "var(--green)" },
        { label: "25%", color: "var(--lime)" },
        { label: "50%", color: "var(--yellow)" },
        { label: "75%", color: "var(--amber)" },
        { label: "90%", color: "var(--orange)" },
        { label: "max", color: "var(--red)" },
      ];

      /** Fee-rate color between the block's own percentile stops. */
      function feeRateColor(feeRate, ranges) {
        if (feeRate <= ranges[0]) return FEE_RATE_STOPS[0].color;

        for (let index = 1; index < ranges.length; index += 1) {
          if (feeRate > ranges[index]) continue;
          const span = ranges[index] - ranges[index - 1];
          const ratio = span ? (feeRate - ranges[index - 1]) / span : 0;
          return `color-mix(in oklch, ${FEE_RATE_STOPS[index - 1].color} ${((1 - ratio) * 100).toFixed(2)}%, ${FEE_RATE_STOPS[index].color} ${(ratio * 100).toFixed(2)}%)`;
        }

        return FEE_RATE_STOPS.at(-1).color;
      }

      /** Transactions by fee rate, then weight, highest first. */
      function orderTransactions(weights, feeRates) {
        const order = Uint32Array.from(feeRates, (_, index) => index);
        return order.sort((a, b) => feeRates[b] - feeRates[a] || weights[b] - weights[a]);
      }

      function previewFeeRange(feeRates, order) {
        return FEE_RATE_PERCENTILES.map((percentile) => feeRates[order[Math.round(((100 - percentile) / 100) * (order.length - 1))]]);
      }

      // Cubes ----------------------------------------------------------------

      const CUBE_FACES = [
        ["glass", "bottom"], ["glass", "rear-right"], ["glass", "rear-left"],
        ["liquid", "bottom"], ["liquid", "rear-right"], ["liquid", "rear-left"],
        ["liquid", "right"], ["liquid", "left"], ["liquid", "top"],
        ["glass", "right"], ["glass", "left"], ["glass", "top"],
      ];
      const ENTER_STAGGER_MS = 60;

      const face = (role, side) => el("div", { "data-face": true, "data-role": role, "data-side": side });

      /** @param {HTMLElement} element @param {number} fill */
      function buildCube(element, fill) {
        const top = face("text", "top");
        const right = face("text", "right");
        const left = face("text", "left");

        element.dataset.cube = "block";
        element.style.setProperty("--fill", String(fill));
        element.append(el("div", { "data-cube-visual": true }, ...CUBE_FACES.map(([role, side]) => face(role, side)), right, left, top));

        return { element, top, right, left };
      }

      function markEntering(cube, enterIndex) {
        cube.dataset.enter = "";
        cube.style.setProperty("--enter-delay", `${enterIndex * ENTER_STAGGER_MS}ms`);
        cube.addEventListener("animationend", () => cube.removeAttribute("data-enter"), { once: true });
      }

      /** Cubes are links: plain clicks route in-page, modified clicks open new tabs. */
      function createConfirmedCube(block, enterIndex = 0) {
        const { pool, totalFees, medianFee, feeRange, virtualSize } = block.extras;
        const cube = buildCube(el("a", { href: `#${block.height}` }), Math.min(1, virtualSize / 1_000_000));
        const { timestamp: time } = block;
        const [hh, mm, ss] = formatClock(time);

        cube.element.dataset.hash = block.id;
        cube.element.dataset.height = String(block.height);
        cube.element.dataset.timestamp = String(time);
        cube.element.setAttribute("aria-label", `Block ${formatNumber(block.height)}`);
        cube.top.append(el("p", null, formatShortDate(time)), dim(formatYear(time)), el("p", null, hh, dim(":"), mm, dim(":"), ss), dim(formatUtcOffset(time)));
        cube.right.append(
          el("p", { "data-cube-height": true }, heightElement(block.height)),
          el("p", null, formatNumber(block.tx_count), " ", dim(block.tx_count === 1 ? "tx" : "txs")),
          el("p", null, formatMegabytes(block.size), " ", dim("MB")),
          el("div", { "data-cube-pool": true }, poolLogo(pool), el("span", null, poolDisplayName(pool.name))),
        );
        cube.left.append(
          el("p", null, dim("₿"), formatBtcCompact(totalFees)),
          el("p", null, dim("~"), formatFeeRate(medianFee)),
          el("p", null, formatFeeRate(feeRange[0]), dim("-"), formatFeeRate(feeRange[6])),
          el("p", { "data-dim": true }, "sat/vB"),
        );
        markEntering(cube.element, enterIndex);

        return cube.element;
      }

      /** Projected cubes update in place every second: their text lives in text nodes. */
      function createProjectedCube(enterIndex) {
        const cube = buildCube(el("div", { "data-projected": true }), 0);
        const text = () => document.createTextNode("");
        const parts = Object.fromEntries(
          ["date", "year", "hh", "mm", "ss", "utcOffset", "heightPrefix", "height", "txs", "txsUnit", "size", "totalFees", "median", "rangeLo", "rangeHi"]
            .map((name) => [name, text()]),
        );
        const dimmed = (node) => el("span", { "data-dim": true }, node);
        cube.element.append(el("div", { "data-chain-boundary": true }, el("span", null, "PROJECTED"), el("span", null, "CONFIRMED")));
        cube.top.append(el("p", null, parts.date), dimmed(parts.year), el("p", null, parts.hh, dim(":"), parts.mm, dim(":"), parts.ss), dimmed(parts.utcOffset));
        cube.right.append(
          el("p", { "data-cube-height": true }, dimmed(parts.heightPrefix), parts.height),
          el("p", null, parts.txs, " ", dimmed(parts.txsUnit)),
          el("p", null, parts.size, " ", dim("MB")),
          dim("UNMINED"),
        );
        cube.left.append(
          el("p", null, dim("₿"), parts.totalFees),
          el("p", null, dim("~"), parts.median),
          el("p", null, parts.rangeLo, dim("-"), parts.rangeHi),
          el("p", { "data-dim": true }, "sat/vB"),
        );
        markEntering(cube.element, enterIndex);

        return { element: cube.element, parts };
      }

      function updateProjectedCube({ element, parts }, block) {
        element.style.setProperty("--fill", String(Math.min(1, block.blockVSize / 1_000_000)));
        parts.txs.nodeValue = formatNumber(block.nTx);
        parts.txsUnit.nodeValue = block.nTx === 1 ? "tx" : "txs";
        parts.size.nodeValue = formatMegabytes(block.blockSize);
        parts.totalFees.nodeValue = formatBtcCompact(block.totalFees);
        parts.median.nodeValue = formatFeeRate(block.medianFee);
        parts.rangeLo.nodeValue = formatFeeRate(block.feeRange[0]);
        parts.rangeHi.nodeValue = formatFeeRate(block.feeRange.at(-1));
      }

      function updateProjectedHeight({ parts }, height) {
        [parts.heightPrefix.nodeValue, parts.height.nodeValue] = splitHeight(height);
      }

      function updateProjectedTime({ parts }, time) {
        parts.date.nodeValue = formatShortDate(time);
        parts.year.nodeValue = formatYear(time);
        [parts.hh.nodeValue, parts.mm.nodeValue, parts.ss.nodeValue] = formatClock(time);
        parts.utcOffset.nodeValue = formatUtcOffset(time);
      }

      /** The gap before a cube grows with the time since the previous block. */
      function setBlockInterval(cube, seconds, label) {
        cube.style.setProperty("--block-interval", String(seconds));
        let interval = cube.querySelector(":scope > [data-block-interval]");

        if (!interval) {
          interval = el("div", { "data-block-interval": true, "aria-hidden": "true" }, el("span", { "data-interval-full": true }), el("span", { "data-interval-compact": true }));
          cube.append(interval);
        }

        interval.firstChild.textContent = label;
        interval.lastChild.textContent = `~${Math.max(1, Math.round(seconds / 60))}mn`;
      }

      function setConfirmedInterval(cube) {
        const previous = cube.previousElementSibling;
        if (!previous?.dataset.timestamp) return;
        const seconds = Math.max(0, Number(cube.dataset.timestamp) - Number(previous.dataset.timestamp));
        setBlockInterval(cube, seconds, formatInterval(seconds));
      }

      // Chain ----------------------------------------------------------------

      /** @param {{ status: HTMLElement, onTip: (block: any) => void }} options */
      function createChain({ status, onTip }) {
        const BATCH_SIZE = 15;
        const CLOCK_INTERVAL = 1_000;
        const POLL_INTERVAL = 5_000;
        const EDGE_LOAD_DISTANCE = 50;
        const PROJECTED_LIMIT = 8;
        const TARGET_BLOCK_SECONDS = 600;
        const TIP_BLOCK_THRESHOLD = 10;
        const OLDER_RESERVE_VIEWPORTS = 3;
        const NEW_BLOCK_MS = 650;
        const NEW_BLOCK_EASING = "cubic-bezier(0.22, 1, 0.36, 1)";

        const element = el("div", { id: "chain", "data-loading": true });
        const scroller = el("div", { "data-chain-scroll": true });
        const belt = el("div", { "data-chain-blocks": true });
        const tipButton = el("button", { type: "button", "data-edge": "tip", title: "Jump to chain tip", "aria-label": "Jump to chain tip" }, "←");

        scroller.append(belt);
        element.append(tipButton, scroller);

        let active = false;
        let controller = new AbortController();
        let newestHeight = -1;
        let newestTimestamp = 0;
        let reachedTip = false;
        let loadingInitial = false;
        let loadingNewer = false;
        let polling = false;
        let tipCube = null;
        /** @type {number | null | undefined} a block to bring into view once possible (null: the tip) */
        let pendingFocus;
        /** @type {number | null} */
        let selectedHeight = null;
        let pollId = 0;
        let clockId = 0;

        const isAborted = () => controller.signal.aborted;
        const logError = (label, error) => {
          if (!isAborted()) console.error(label, error);
        };

        function setStatus(text) {
          status.textContent = text;
          status.hidden = !text;
        }

        // Geometry: a column on wide screens (newest on top), a row otherwise (newest on the left).

        const axis = () => WIDE.matches
          ? { scroll: "scrollTop", client: "clientHeight", total: "scrollHeight", start: "top", end: "bottom", size: "height", to: "top" }
          : { scroll: "scrollLeft", client: "clientWidth", total: "scrollWidth", start: "left", end: "right", size: "width", to: "left" };

        function distanceFromViewport(node) {
          const { start, end } = axis();
          const viewport = scroller.getBoundingClientRect();
          const rect = node.getBoundingClientRect();
          if (rect[start] > viewport[end]) return rect[start] - viewport[end];
          if (rect[end] < viewport[start]) return viewport[start] - rect[end];
          return 0;
        }

        const isVisible = (node) => distanceFromViewport(node) === 0;

        function visibleConfirmedHeight() {
          const viewport = scroller.getBoundingClientRect();
          const x = (viewport.left + viewport.right) / 2;
          const y = (viewport.top + viewport.bottom) / 2;

          for (const node of document.elementsFromPoint(x, y)) {
            const cube = /** @type {HTMLElement | null} */ (node.closest("[data-cube][data-height]"));
            if (cube && belt.contains(cube)) return Number(cube.dataset.height);
          }

          return null;
        }

        function scrollToCube(cube, behavior) {
          const { scroll, start, size, to } = axis();
          const viewport = scroller.getBoundingClientRect();
          const rect = cube.getBoundingClientRect();
          scroller.scrollTo({ behavior, [to]: scroller[scroll] + rect[start] - viewport[start] - (viewport[size] - rect[size]) / 2 });
          scheduleTip();
        }

        // Confirmed blocks

        /** @returns {HTMLElement | null} */
        const find = (target) => belt.querySelector(`[data-${typeof target === "number" ? "height" : "hash"}="${target}"]`);
        /** @returns {HTMLElement | null} */
        const newest = () => /** @type {HTMLElement | null} */ (projected[0] ? projected[0].element.previousElementSibling : belt.lastElementChild);

        function markTip() {
          tipCube?.removeAttribute("data-tip");
          tipCube = newest();
          tipCube?.setAttribute("data-tip", "");
        }

        function markSkeletons(skeleton) {
          for (const cube of belt.children) {
            if (!cube.hasAttribute("data-projected")) cube.toggleAttribute("data-skeleton", skeleton);
          }
        }

        function createCube(block, enterIndex) {
          const cube = createConfirmedCube(cacheBlock(block), enterIndex);
          cube.toggleAttribute("data-selected", block.height === selectedHeight);
          return cube;
        }

        /** @param {number | null} height */
        function select(height) {
          selectedHeight = height;
          for (const cube of belt.querySelectorAll("[data-selected]")) cube.removeAttribute("data-selected");
          if (height != null) find(height)?.setAttribute("data-selected", "");
        }

        function prepend(block, enterIndex) {
          const oldFirst = belt.firstElementChild;
          belt.insertBefore(createCube(block, enterIndex), oldFirst);
          if (oldFirst) setConfirmedInterval(oldFirst);
        }

        function append(block) {
          const cube = createCube(block, 0);
          belt.insertBefore(cube, projected[0]?.element ?? null);
          setConfirmedInterval(cube);
          return cube;
        }

        // Older blocks: invisible placeholders reserve scroll runway, then hydrate in order.

        let oldestHeight = Infinity;
        let oldestReserved = -1;
        let hydrating = false;
        let generation = 0;
        const batches = [];

        function resetOlder() {
          oldestHeight = Infinity;
          oldestReserved = -1;
          hydrating = false;
          generation += 1;
          batches.length = 0;
        }

        function reserveOlder(delta = 0) {
          const { scroll, client, total } = axis();
          const runway = scroller[client] * OLDER_RESERVE_VIEWPORTS + delta;
          while (scroller[total] - scroller[client] - scroller[scroll] < runway) {
            if (!reserveBatch()) return;
          }
        }

        function reserveBatch() {
          if (!active || oldestReserved <= 0) return false;

          const count = Math.min(BATCH_SIZE, oldestReserved);
          const fragment = document.createDocumentFragment();
          const placeholders = Array.from({ length: count }, () => fragment.appendChild(el("div", { "data-cube": "block", "data-placeholder": true })));

          belt.insertBefore(fragment, belt.firstElementChild);
          batches.push({ generation, startHeight: oldestReserved - 1, placeholders });
          oldestReserved -= count;
          void hydrateBatches();

          return true;
        }

        async function hydrateBatches() {
          if (hydrating) return;

          const current = generation;
          hydrating = true;

          try {
            while (active && current === generation && batches.length) {
              const batch = batches[0];
              // An aborted batch stays queued and resumes on the next activation.
              if (!(await hydrateBatch(batch))) break;
              if (batches[0] === batch) batches.shift();
            }
          } finally {
            if (current === generation) hydrating = false;
          }
        }

        /** @returns {Promise<boolean>} false when aborted before completion */
        async function hydrateBatch(batch) {
          try {
            const blocks = await chainApi.from(batch.startHeight, controller.signal);
            if (batch.generation !== generation || !batch.placeholders.some((node) => node.isConnected)) return true;

            const cubes = blocks.toReversed().map((block, index, ordered) => createCube(block, ordered.length - index - 1));
            batch.placeholders.forEach((node, index) => (cubes[index] ? node.replaceWith(cubes[index]) : node.remove()));
            for (const cube of cubes) setConfirmedInterval(cube);
            const next = cubes.at(-1)?.nextElementSibling;
            if (next) setConfirmedInterval(next);

            if (blocks.length) oldestHeight = blocks.at(-1).height;
            else oldestReserved = oldestHeight;

            reserveOlder();
            return true;
          } catch (error) {
            if (batch.generation !== generation) return true;
            if (isAborted()) return false;

            // Drop every queued batch: older ones would leave a gap; scrolling reserves them again.
            for (const queued of batches) for (const node of queued.placeholders) node.remove();
            batches.length = 0;
            oldestReserved = oldestHeight;
            logError("chain older:", error);
            return true;
          }
        }

        // Projected blocks: the mempool split into the next blocks, ticking every second.

        const projected = [];
        let projectedHeight = -1;

        function renderProjected(blocks) {
          const want = Math.min(blocks.length, PROJECTED_LIMIT);

          if (projected.length !== want) projectedHeight = -1;
          while (projected.length > want) projected.pop().element.remove();
          while (projected.length < want) {
            const cube = createProjectedCube(projected.length + 1);
            if (projected.length) setBlockInterval(cube.element, TARGET_BLOCK_SECONDS, "~10mn");
            projected.push(cube);
            belt.append(cube.element);
          }

          projected.forEach((cube, index) => updateProjectedCube(cube, blocks[index]));
          markTip();
          refreshProjected();
        }

        function refreshProjected() {
          if (!projected.length || newestHeight < 0 || !newestTimestamp) return;

          const now = Math.floor(Date.now() / 1_000);
          const elapsed = Math.max(0, now - newestTimestamp);
          const heightChanged = projectedHeight !== newestHeight;
          // While the user browses older blocks, keep the belt still.
          const layoutFrozen = tipButton.hasAttribute("data-visible");

          projected.forEach((cube, index) => {
            if (index === 0 && !layoutFrozen) setBlockInterval(cube.element, elapsed, formatInterval(elapsed));
            if (heightChanged) updateProjectedHeight(cube, newestHeight + index + 1);
            updateProjectedTime(cube, now + index * TARGET_BLOCK_SECONDS);
          });

          projectedHeight = newestHeight;
        }

        async function pollProjected() {
          try {
            renderProjected(await chainApi.mempool(controller.signal));
          } catch (error) {
            logError("chain mempool:", error);
          }
        }

        // Tip button

        let tipFrame = 0;

        function setTipVisible(visible) {
          tipButton.toggleAttribute("data-visible", visible);
          tipButton.setAttribute("aria-hidden", String(!visible));
          tipButton.tabIndex = visible ? 0 : -1;
        }

        function syncTip() {
          // Browsing history away from the tip: the button returns to it.
          if (!reachedTip) {
            setTipVisible(newestHeight >= 0);
            return;
          }
          if (!tipCube || projected.some(({ element }) => isVisible(element))) {
            setTipVisible(false);
            return;
          }

          const visibleHeight = visibleConfirmedHeight();
          setTipVisible(visibleHeight != null ? newestHeight - visibleHeight > TIP_BLOCK_THRESHOLD : !isVisible(tipCube));
        }

        function scheduleTip() {
          tipFrame ||= requestAnimationFrame(() => {
            tipFrame = 0;
            syncTip();
          });
        }

        let jumpTimer = 0;
        let finishJump = null;

        function cancelJump() {
          clearTimeout(jumpTimer);
          if (finishJump) element.removeEventListener("transitionend", finishJump);
          finishJump = null;
          delete element.dataset.jumping;
        }

        /** Fade out, scroll instantly to the tip, fade back in. */
        function jumpToTip() {
          if (!tipCube || finishJump) return;

          finishJump = (event) => {
            if (event instanceof TransitionEvent && (event.target !== element || event.propertyName !== "opacity")) return;
            if (tipCube) scrollToCube(tipCube, "instant");
            cancelJump();
          };
          element.dataset.jumping = "";
          element.addEventListener("transitionend", finishJump);
          jumpTimer = setTimeout(finishJump, transitionMs(element, "opacity") + 50);
        }

        tipButton.addEventListener("click", () => (reachedTip ? jumpToTip() : navigate("")));

        // New block: slide the belt (FLIP) and drop the block out of the first projected cube.

        function captureLayout() {
          const viewport = scroller.getBoundingClientRect();
          const positions = new Map();

          for (const child of belt.children) {
            const rect = child.getBoundingClientRect();
            const near =
              rect.right >= viewport.left - rect.width && rect.left <= viewport.right + rect.width &&
              rect.bottom >= viewport.top - rect.height && rect.top <= viewport.bottom + rect.height;
            if (near) positions.set(child, rect);
          }

          return { positions, source: projected[0]?.element.getBoundingClientRect() ?? null };
        }

        async function playNewBlocks(before, entering) {
          for (const cube of entering) cube.removeAttribute("data-enter");
          if (REDUCED_MOTION.matches) return;
          for (const cube of entering) cube.dataset.newBlockEnter = "";

          const slide = (node, x, y) => node.animate(
            [{ transform: `translate3d(${x}px, ${y}px, 0)` }, { transform: "translate3d(0, 0, 0)" }],
            { duration: NEW_BLOCK_MS, easing: NEW_BLOCK_EASING },
          );
          const animations = [];

          for (const [cube, rect] of before.positions) {
            if (!cube.isConnected) continue;
            const next = cube.getBoundingClientRect();
            const x = rect.left - next.left;
            const y = rect.top - next.top;
            if (Math.abs(x) >= 0.5 || Math.abs(y) >= 0.5) animations.push(slide(cube, x, y));
          }

          for (const cube of entering) {
            const next = cube.getBoundingClientRect();
            animations.push(slide(cube, (before.source?.left ?? next.left) - next.left, (before.source?.top ?? next.top) - next.top));
            animations.push(cube.querySelector("[data-cube-visual]").animate(
              [
                { opacity: 0, filter: "brightness(2.5)" },
                { offset: 0.35, opacity: 1, filter: "brightness(1.6)" },
                { opacity: 1, filter: "brightness(1)" },
              ],
              { duration: NEW_BLOCK_MS, easing: NEW_BLOCK_EASING },
            ));
          }

          await Promise.allSettled(animations.map(({ finished }) => finished));
          for (const cube of entering) cube.removeAttribute("data-new-block-enter");
        }

        // Loading

        function clear() {
          newestHeight = -1;
          newestTimestamp = 0;
          loadingNewer = false;
          reachedTip = false;
          tipCube = null;
          belt.textContent = "";
          projected.length = 0;
          projectedHeight = -1;
          resetOlder();
          setTipVisible(false);
        }

        /** @param {number | null} height null for the tip */
        async function loadInitial(height) {
          const blocks = height == null ? await chainApi.tip(controller.signal) : await chainApi.from(height, controller.signal);

          clear();
          blocks.forEach((block, index) => prepend(block, index));
          newestHeight = blocks[0].height;
          newestTimestamp = blocks[0].timestamp;
          oldestHeight = oldestReserved = blocks.at(-1).height;
          reachedTip = height == null;
          if (reachedTip) {
            noteTip(newestHeight);
            onTip(blocks[0]);
          }
          markTip();
          reserveOlder();

          if (reachedTip) await pollProjected();
          else await loadNewer();

          return blocks[0].id;
        }

        /** @param {number | null} height null for the tip */
        async function goTo(height) {
          if (!active) return;
          if (loadingInitial) {
            pendingFocus = height;
            return;
          }

          const existing = height == null ? (reachedTip ? tipCube : null) : find(height);
          if (existing) {
            scrollToCube(existing, "smooth");
            return;
          }

          markSkeletons(true);
          element.dataset.loading = "";
          loadingInitial = true;
          setStatus("Loading blocks");
          let loaded = false;

          try {
            const cube = find(await loadInitial(height));
            if (cube) scrollToCube(cube, "instant");
            setStatus("");
            loaded = true;
          } catch (error) {
            markSkeletons(false);
            // Retried on the next poll or activation.
            if (pendingFocus === undefined) pendingFocus = height;
            if (isAborted()) return;
            setStatus(`${new URL(ORIGIN).host} unreachable · retrying`);
            console.error("chain load:", error);
          } finally {
            loadingInitial = false;
            delete element.dataset.loading;
          }

          // A focus requested mid-load runs now.
          if (loaded && pendingFocus !== undefined) {
            const next = pendingFocus;
            pendingFocus = undefined;
            void goTo(next);
          }
        }

        async function loadNewer() {
          if (!active || loadingNewer || newestHeight === -1 || reachedTip) return;

          loadingNewer = true;

          try {
            const requested = newestHeight + BATCH_SIZE;
            const blocks = await chainApi.from(requested, controller.signal);

            appendNewerBlocks(blocks);
            // The API clamps to the tip: a shorter answer means there is nothing newer.
            if (blocks[0].height < requested) {
              reachedTip = true;
              noteTip(newestHeight);
              onTip(blocks[0]);
              await pollProjected();
            }
          } catch (error) {
            logError("chain newer:", error);
          } finally {
            loadingNewer = false;
          }
        }

        function appendNewerBlocks(blocks) {
          if (!blocks.length || blocks[0].height <= newestHeight) return false;

          const { scroll, start } = axis();
          const anchor = newest();
          const anchorStart = anchor?.getBoundingClientRect()[start];
          const layout = reachedTip ? captureLayout() : null;
          const entering = blocks.filter(({ height }) => height > newestHeight).toReversed().map(append);

          newestHeight = blocks[0].height;
          newestTimestamp = blocks[0].timestamp;
          markTip();
          refreshProjected();

          if (anchor) scroller[scroll] += anchor.getBoundingClientRect()[start] - anchorStart;
          if (layout && entering.length) void playNewBlocks(layout, entering);
          syncTip();
          if (reachedTip) onTip(blocks[0]);

          return true;
        }

        async function reloadTip() {
          element.dataset.reorganizing = "";

          try {
            const cube = find(await loadInitial(null));
            if (cube) scrollToCube(cube, "instant");
          } finally {
            delete element.dataset.reorganizing;
          }
        }

        async function poll() {
          if (!active || polling || loadingInitial) return;
          if (newestHeight === -1 || pendingFocus !== undefined) {
            const target = pendingFocus ?? null;
            pendingFocus = undefined;
            void goTo(target);
            return;
          }
          if (!reachedTip) return;

          polling = true;

          try {
            const [blocks] = await Promise.all([chainApi.tip(controller.signal), pollProjected()]);
            const reorganized = blocks.some(({ height, id }) => {
              const hash = find(height)?.dataset.hash;
              return hash !== undefined && hash !== id;
            });
            // More than a batch behind (a long hidden tab) leaves a gap: reload from the tip instead.
            const gap = blocks.at(-1).height > newestHeight + 1;

            noteTip(blocks[0].height);
            if (reorganized || gap) await reloadTip();
            else appendNewerBlocks(blocks);
          } catch (error) {
            logError("chain poll:", error);
          } finally {
            polling = false;
          }
        }

        // Input

        scroller.addEventListener("wheel", (event) => {
          // A row scrolls sideways with the wheel too.
          if (!WIDE.matches && Math.abs(event.deltaY) > Math.abs(event.deltaX)) scroller.scrollLeft += event.deltaY;
          if (active) reserveOlder(Math.max(0, event.deltaX, event.deltaY));
        }, { passive: true });

        scroller.addEventListener("scroll", () => {
          scheduleTip();
          if (active) reserveOlder();

          const cube = newest();
          if (!reachedTip && !loadingNewer && cube && distanceFromViewport(cube) <= EDGE_LOAD_DISTANCE) void loadNewer();
        }, { passive: true });

        // Switching between column and row keeps the selected block (or the tip) in view.
        WIDE.addEventListener("change", () => {
          const cube = (selectedHeight != null && find(selectedHeight)) || tipCube;
          if (cube) scrollToCube(cube, "instant");
          if (active) reserveOlder();
        });

        /** @param {boolean} next */
        function setActive(next) {
          if (active === next) return;
          active = next;

          if (!active) {
            clearInterval(pollId);
            clearInterval(clockId);
            cancelAnimationFrame(tipFrame);
            tipFrame = 0;
            cancelJump();
            controller.abort();
            return;
          }

          controller = new AbortController();
          const target = pendingFocus ?? null;
          pendingFocus = undefined;
          const focused = target == null ? null : find(target);

          if (focused) scrollToCube(focused, "instant");
          if (newestHeight === -1 || (target != null && !focused)) void goTo(target);
          else void poll();

          void hydrateBatches();
          clockId = setInterval(refreshProjected, CLOCK_INTERVAL);
          pollId = setInterval(() => void poll(), POLL_INTERVAL);
        }

        return {
          element,
          setActive,
          select,
          /** @param {number | null} height brought into view, its neighborhood loaded if needed (null: the tip) */
          focus(height) {
            if (active) void goTo(height);
            else pendingFocus = height;
          },
        };
      }

      // Block preview: one cell per transaction, sized by weight, colored by fee rate --------------

      async function loadPreviewData(block, signal) {
        const client = await loadClient();
        const tx = client.series.transactions;
        const first = await tx.raw.firstTxIndex.by.height.get(block.height).fetch({ signal });
        const start = first.data[0];
        const end = start + block.tx_count;
        const [weights, feeRates] = await fetchBulk(client, [tx.raw.weight, tx.fees.feeRate], "tx_index", start, end, { signal, memCache: false });

        signal.throwIfAborted();

        return { blockWeight: block.weight, range: { start, end }, weights: weights.data, feeRates: feeRates.data };
      }

      async function loadTxid(txIndex, signal) {
        const client = await loadClient();
        return (await client.series.transactions.raw.txid.by.tx_index.get(txIndex).fetch({ signal })).data[0];
      }

      // Filters: the series behind them --------------------------------------

      const cssVar = (name) => `var(--${name})`;

      const OP_RETURN_KINDS = [
        ["runes", "runes", "runes", "orange"],
        ["veri block", "veri_block", "veriBlock", "blue"],
        ["omni", "omni", "omni", "violet"],
        ["stacks", "stacks", "stacks", "purple"],
        ["blockstack", "blockstack", "blockstack", "indigo"],
        ["colu", "colu", "colu", "cyan"],
        ["open assets", "open_assets", "openAssets", "sky"],
        ["komodo", "komodo", "komodo", "amber"],
        ["coin spark", "coin_spark", "coinSpark", "yellow"],
        ["poet", "poet", "poet", "fuchsia"],
        ["docproof", "docproof", "docproof", "emerald"],
        ["open timestamps", "open_timestamps", "openTimestamps", "green"],
        ["factom", "factom", "factom", "lime"],
        ["eternity wall", "eternity_wall", "eternityWall", "avocado"],
        ["memo", "memo", "memo", "pink"],
        ["bitproof", "bitproof", "bitproof", "rose"],
        ["ascribe", "ascribe", "ascribe", "teal"],
        ["stampery", "stampery", "stampery", "blue"],
        ["epobc", "epobc", "epobc", "violet"],
        ["bare hash", "bare_hash", "bareHash", "white"],
        ["text", "text", "text", "cyan"],
        ["empty", "empty", "empty", "gray"],
        ["unknown", "unknown", "unknown", "gray"],
      ];

      const OP_RETURN_POLICIES = [
        ["standard", "standard", "preV30Standard", "green"],
        ["oversized", "oversized", "oversized", "orange"],
        ["multiple", "multiple", "multiple", "yellow"],
        ["pre-v30 nonstandard", "pre_v30_nonstandard", "preV30Nonstandard", "red"],
      ];

      /** @type {[string, string][]} */
      const FILTER_GROUPS = [
        ["version", "version"], ["rbf", "rbf"], ["input", "input"], ["output", "output"], ["type", "type"],
        ["behavior", "behavior"], ["data", "data"], ["sighash", "sighash"], ["policy", "policy"], ["op_return", "op return"],
      ];

      const FILTERS = [
        ["version", "v1", "version:1", "blue"],
        ["version", "v2", "version:2", "violet"],
        ["version", "v3", "version:3", "fuchsia"],

        ["type", "p2pk", "type:p2pk", "yellow"],
        ["type", "p2pkh", "type:p2pkh", "amber"],
        ["type", "p2sh", "type:p2sh", "orange"],
        ["type", "p2wpkh", "type:p2wpkh", "emerald"],
        ["type", "p2wsh", "type:p2wsh", "green"],
        ["type", "taproot", "type:taproot", "violet"],

        ["type", "op ret", "type:op_return", "red"],
