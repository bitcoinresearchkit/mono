        ["sighash", "all", "sighash:all", "blue"],
        ["sighash", "none", "sighash:none", "red"],
        ["sighash", "single", "sighash:single", "orange"],
        ["sighash", "default", "sighash:default", "violet"],
        ["sighash", "anyonecanpay", "sighash:anyone_can_pay", "fuchsia"],
        ["policy", "nonstandard", "policy:nonstandard", "red"],
        ...OP_RETURN_KINDS.map(([label, kind, , color]) => ["op_return", label, `op_return:${kind}`, color]),
        ...OP_RETURN_POLICIES.map(([label, policy, , color]) => ["op_return", label, `op_return_policy:${policy}`, color]),
      ].map(([group, label, key, color], index) => ({ group, label, key, color: cssVar(color), index }));

      const FILTER_INDEX = new Map(FILTERS.map((filter) => [filter.key, filter.index]));
      const FILTER_GROUP_LABELS = new Map(FILTER_GROUPS);
      const GROUPED_FILTERS = FILTER_GROUPS.map(([key, label]) => ({ label, filters: FILTERS.filter(({ group }) => group === key) }));

      const equals = (expected) => (value) => value === expected;
      const differs = (expected) => (value) => value !== expected;
      const isTrue = (value) => value === true;

      /** Typed client paths; only their series names travel. */
      const loadFilterSources = lazy(async () => {
        const client = await loadClient();
        const { transactions: tx, mappings, opReturn } = client.series;
        const count = tx.features.count;
        const has = tx.features;

        const counts = [
          { key: "version:1", series: count.v1 }, { key: "version:2", series: count.v2 }, { key: "version:3", series: count.v3 }, { key: "version:other", series: count.otherVersion },
          { key: "rbf:yes", series: count.explicitlyRbf }, { key: "input:one", series: count.oneInput }, { key: "output:one", series: count.oneOutput },
          { key: "type:p2pk", series: count.p2pk }, { key: "type:p2pkh", series: count.p2pkh }, { key: "type:p2sh", series: count.p2sh }, { key: "type:p2wpkh", series: count.p2wpkh },
          { key: "type:p2wsh", series: count.p2wsh }, { key: "type:taproot", series: count.p2tr }, { key: "type:p2a", series: count.p2a }, { key: "type:multisig", series: count.p2ms },
          { key: "type:op_return", series: count.opReturn }, { key: "type:empty", series: count.empty }, { key: "type:unknown", series: count.unknown },
          { key: "behavior:cpfp_parent", series: tx.fees.count.cpfpParent.block }, { key: "behavior:cpfp_child", series: tx.fees.count.cpfpChild.block },
          { key: "behavior:coinjoin", series: tx.patterns.count.coinjoin.block }, { key: "behavior:consolidation", series: tx.patterns.count.consolidation.block },
          { key: "behavior:batch", series: tx.patterns.count.batchPayout.block },
          { key: "data:fake_pubkey", series: count.fakePubkey }, { key: "data:fake_scripthash", series: count.fakeScripthash },
          { key: "data:inscription", series: tx.inscription.count.block }, { key: "data:annex", series: count.annex.block }, { key: "data:dust", series: count.dustOutput.block },
          { key: "sighash:all", series: count.sighashAll.block }, { key: "sighash:none", series: count.sighashNone.block }, { key: "sighash:single", series: count.sighashSingle.block },
          { key: "sighash:default", series: count.sighashDefault.block }, { key: "sighash:anyone_can_pay", series: count.sighashAnyoneCanPay.block },
          { key: "policy:nonstandard", series: tx.policy.count.nonstandard.block },
          ...OP_RETURN_KINDS.map(([, kind, path]) => ({ key: `op_return:${kind}`, series: opReturn.protocols[path].txCount.block })),
          ...OP_RETURN_POLICIES.map(([, policy, path]) => ({ key: `op_return_policy:${policy}`, series: opReturn.policies[path].txCount.block })),
        ];

        const memberships = new Map([
          ["version:1", { matches: equals(1), series: tx.raw.txVersion }],
          ["version:2", { matches: equals(2), series: tx.raw.txVersion }],
          ["version:3", { matches: equals(3), series: tx.raw.txVersion }],
          ["version:other", { matches: (value) => value !== 1 && value !== 2 && value !== 3, series: tx.raw.txVersion }],
          ["rbf:yes", { matches: isTrue, series: tx.raw.isExplicitlyRbf }],
          ["rbf:no", { matches: equals(false), series: tx.raw.isExplicitlyRbf }],
          ["input:one", { matches: equals(1), series: mappings.txIndex.inputCount }],
          ["input:multi", { matches: differs(1), series: mappings.txIndex.inputCount }],
          ["output:one", { matches: equals(1), series: mappings.txIndex.outputCount }],
          ["output:multi", { matches: differs(1), series: mappings.txIndex.outputCount }],
          ["type:p2pk", { matches: isTrue, series: has.hasP2pk }],
          ["type:p2pkh", { matches: isTrue, series: has.hasP2pkh }],
          ["type:p2sh", { matches: isTrue, series: has.hasP2sh }],
          ["type:p2wpkh", { matches: isTrue, series: has.hasP2wpkh }],
          ["type:p2wsh", { matches: isTrue, series: has.hasP2wsh }],
          ["type:taproot", { matches: isTrue, series: has.hasP2tr }],
          ["type:p2a", { matches: isTrue, series: has.hasP2a }],
          ["type:multisig", { matches: isTrue, series: has.hasP2ms }],
          ["type:op_return", { matches: isTrue, series: has.hasOpReturn }],
          ["type:empty", { matches: isTrue, series: has.hasEmpty }],
          ["type:unknown", { matches: isTrue, series: has.hasUnknown }],
          ["behavior:cpfp_parent", { matches: isTrue, series: tx.fees.isCpfpParent }],
          ["behavior:cpfp_child", { matches: isTrue, series: tx.fees.isCpfpChild }],
          ["behavior:coinjoin", { matches: isTrue, series: tx.patterns.isCoinjoin }],
          ["behavior:consolidation", { matches: isTrue, series: tx.patterns.isConsolidation }],
          ["behavior:batch", { matches: isTrue, series: tx.patterns.isBatchPayout }],
          ["data:fake_pubkey", { matches: isTrue, series: has.hasFakePubkey }],
          ["data:fake_scripthash", { matches: isTrue, series: has.hasFakeScripthash }],
          ["data:inscription", { matches: isTrue, series: has.hasInscription }],
          ["data:annex", { matches: isTrue, series: has.hasAnnex }],
          ["data:dust", { matches: isTrue, series: has.hasDustOutput }],
          ["sighash:all", { matches: isTrue, series: has.hasSighashAll }],
          ["sighash:none", { matches: isTrue, series: has.hasSighashNone }],
          ["sighash:single", { matches: isTrue, series: has.hasSighashSingle }],
          ["sighash:default", { matches: isTrue, series: has.hasSighashDefault }],
          ["sighash:anyone_can_pay", { matches: isTrue, series: has.hasSighashAnyoneCanPay }],
          ["policy:nonstandard", { matches: isTrue, series: tx.policy.isNonstandard }],
        ]);

        return {
          client,
          counts,
          memberships,
          inspected: [...new Map([...memberships.values()].map(({ series }) => [series.name, series])).values()],
          opReturn: opReturn.raw,
        };
      });

      const MAX_STANDARD_OP_RETURN_BYTES = 82;

      function matchesOpReturnPolicy(policy, count, oversized) {
        if (policy === "standard") return count === 1 && !oversized;
        if (policy === "oversized") return oversized;
        if (policy === "multiple") return count > 1;
        return oversized || count > 1;
      }

      /** Lazily loaded per-block filter data: counts, memberships and one transaction's traits. */
      function createFilterData(height, range, signal) {
        const size = range.end - range.start;
        const memberships = new Map();
        const sources = new Map();
        let counts = null;
        let opReturnRows = null;

        async function fetchCounts() {
          const sources = await loadFilterSources();
          const response = await fetchBulk(sources.client, sources.counts.map(({ series }) => series), "height", height, height + 1, { signal });
          const result = new Uint32Array(FILTERS.length);
          const at = (key) => FILTER_INDEX.get(key);

          sources.counts.forEach(({ key }, index) => {
            result[at(key)] = Number(response[index].data[0]);
          });
          result[at("rbf:no")] = size - result[at("rbf:yes")];
          result[at("input:multi")] = size - result[at("input:one")];
          result[at("output:multi")] = size - result[at("output:one")];

          return result;
        }

        async function fetchOpReturnRows() {
          const { client, opReturn } = await loadFilterSources();
          const indexes = await opReturn.firstIndex.by.height.skip(height).take(2).fetch({ signal });
          const start = indexes.data[0];
          const end = indexes.data.length === 2 ? indexes.data[1] : await opReturn.toTxIndex.by.op_return_index.len();

          if (start === end) return { txIndexes: [], kinds: [], bytes: [] };

          const [txIndexes, kinds, bytes] = await fetchBulk(client, [opReturn.toTxIndex, opReturn.kind, opReturn.postOpReturnBytes], "op_return_index", start, end, { signal, memCache: false });

          return { txIndexes: txIndexes.data, kinds: kinds.data, bytes: bytes.data };
        }

        const loadOpReturnRows = () => (opReturnRows ??= fetchOpReturnRows());

        async function fetchOpReturnMembership(key) {
          const rows = await loadOpReturnRows();
          const membership = new Uint8Array(size);
          const [group, value] = key.split(":");

          if (group === "op_return") {
            rows.kinds.forEach((kind, index) => {
              if (kind === value) membership[rows.txIndexes[index] - range.start] = 1;
            });
            return membership;
          }

          for (let index = 0; index < rows.txIndexes.length; ) {
            const txIndex = rows.txIndexes[index];
            let count = 0;
            let oversized = false;

            while (rows.txIndexes[index] === txIndex) {
              oversized ||= rows.bytes[index] > MAX_STANDARD_OP_RETURN_BYTES;
              count += 1;
              index += 1;
            }

            if (matchesOpReturnPolicy(value, count, oversized)) membership[txIndex - range.start] = 1;
          }

          return membership;
        }

        async function fetchMembership(filter) {
          if (filter.group === "op_return") return fetchOpReturnMembership(filter.key);

          const { matches, series } = (await loadFilterSources()).memberships.get(filter.key);
          // Several filters share a series (version 1/2/3/other, input one/multi…): fetch it once.
          let source = sources.get(series.name);
          if (!source) {
            source = series.by.tx_index.skip(range.start).take(size).fetch({ signal, memCache: false }).then(({ data }) => data);
            source.catch(() => sources.delete(series.name));
            sources.set(series.name, source);
          }

          return Uint8Array.from(await source, (value) => Number(matches(value)));
        }

        async function loadTransactionKeys(txIndex, requestSignal) {
          const sources = await loadFilterSources();
          const response = await fetchBulk(sources.client, sources.inspected, "tx_index", txIndex, txIndex + 1, { signal: requestSignal, memCache: false });
          const values = new Map(sources.inspected.map(({ name }, index) => [name, response[index].data[0]]));
          const keys = [...sources.memberships]
            .filter(([, { matches, series }]) => matches(values.get(series.name)))
            .map(([key]) => key);

          if (keys.includes("type:op_return")) {
            const rows = await loadOpReturnRows();
            const kinds = new Set();
            let count = 0;
            let oversized = false;

            rows.txIndexes.forEach((rowTxIndex, index) => {
              if (rowTxIndex !== txIndex) return;
              kinds.add(rows.kinds[index]);
              oversized ||= rows.bytes[index] > MAX_STANDARD_OP_RETURN_BYTES;
              count += 1;
            });

            for (const kind of kinds) keys.push(`op_return:${kind}`);
            for (const [, policy] of OP_RETURN_POLICIES) {
              if (matchesOpReturnPolicy(policy, count, oversized)) keys.push(`op_return_policy:${policy}`);
            }
          }

          requestSignal.throwIfAborted();
          return keys;
        }

        return {
          loadCounts: () => (counts ??= fetchCounts()),
          loadMembership(filter) {
            let promise = memberships.get(filter.key);
            if (!promise) {
              promise = fetchMembership(filter);
              promise.catch(() => memberships.delete(filter.key));
              memberships.set(filter.key, promise);
            }
            return promise;
          },
          loadTransactionKeys,
        };
      }

      // Heatmap colors: the canvas needs rgb, the palette is oklch -------------

      let feeStops = null;

      function cssColor(color) {
        const name = color.match(/var\((--[^)]+)\)/)?.[1];
        return name ? getComputedStyle(document.documentElement).getPropertyValue(name) : color;
      }

      function parseOklch(css) {
        const [, lightness, percent, chroma, hue] = css.match(/oklch\(\s*([\d.]+)(%)?\s+([\d.]+)\s+([\d.]+)/);
        const radians = (Number(hue) * Math.PI) / 180;
        return { l: percent ? Number(lightness) / 100 : Number(lightness), a: Number(chroma) * Math.cos(radians), b: Number(chroma) * Math.sin(radians) };
      }

      function toRgb({ l: L, a, b }) {
        const encode = (linear) => {
          const value = linear <= 0.0031308 ? 12.92 * linear : 1.055 * linear ** (1 / 2.4) - 0.055;
          return Math.round(Math.min(1, Math.max(0, value)) * 255);
        };
        const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
        const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
        const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;

        return `rgb(${encode(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s)} ${encode(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s)} ${encode(-0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s)})`;
      }

      const canvasColor = (color) => toRgb(parseOklch(cssColor(color)));

      function canvasFeeRateColor(feeRate, ranges) {
        feeStops ??= FEE_RATE_STOPS.map(({ color }) => parseOklch(cssColor(color)));
        if (feeRate <= ranges[0]) return toRgb(feeStops[0]);

        for (let index = 1; index < ranges.length; index += 1) {
          if (feeRate > ranges[index]) continue;
          const span = ranges[index] - ranges[index - 1];
          const ratio = span ? (feeRate - ranges[index - 1]) / span : 0;
          const [from, to] = [feeStops[index - 1], feeStops[index]];
          return toRgb({ l: from.l + (to.l - from.l) * ratio, a: from.a + (to.a - from.a) * ratio, b: from.b + (to.b - from.b) * ratio });
        }

        return toRgb(feeStops.at(-1));
      }

      // Heatmap layout: square cells packed into the block's share of a square -----------------

      const HEATMAP_COLUMNS = 86;
      const CALIBRATION_STEPS = 24;

      /** Scales cell spans so their total area matches the block's fill of the grid. */
      function resolveCapacityCells(cells, blockWeight, columns) {
        const gridArea = columns * columns;
        const targetArea = Math.max(cells.length, Math.floor((gridArea * blockWeight) / MAX_BLOCK_WEIGHT));
        const ideal = Float64Array.from(cells, ({ weight }) => Math.sqrt((weight * gridArea) / MAX_BLOCK_WEIGHT));
        const area = (scale) => ideal.reduce((sum, span) => sum + Math.max(1, Math.round(span * scale)) ** 2, 0);
        let lower = 0;
        let upper = 1;

        while (area(upper) <= targetArea) upper *= 2;
        for (let step = 0; step < CALIBRATION_STEPS; step += 1) {
          const scale = (lower + upper) / 2;
          if (area(scale) <= targetArea) lower = scale;
          else upper = scale;
        }

        let total = 0;
        let largest = 1;
        const shortfall = new Float64Array(cells.length);

        cells.forEach((cell, index) => {
          cell.span = Math.max(1, Math.round(ideal[index] * lower));
          shortfall[index] = (cell.span + 0.5) / ideal[index];
          largest = Math.max(largest, cell.span);
          total += cell.span ** 2;
        });

        const candidates = Uint32Array.from(cells, (_, index) => index).sort((a, b) => shortfall[a] - shortfall[b] || a - b);

        for (const index of candidates) {
          const cell = cells[index];
          const growth = 2 * cell.span + 1;
          if (total + growth > targetArea) continue;
          cell.span += 1;
          largest = Math.max(largest, cell.span);
          total += growth;
          if (targetArea - total < 3) break;
        }

        return Math.max(largest, Math.ceil(targetArea / columns));
      }

      /** First-fit square packing, bottom-up, with one search cursor per span. */
      function packCells(cells, columns, rows) {
        const occupied = new Uint8Array(columns * rows);
        const cursors = new Uint32Array(columns + 1);
        const fits = (x, y, span) => {
          for (let row = y; row < y + span; row += 1) {
            for (let column = x; column < x + span; column += 1) if (occupied[row * columns + column]) return false;
          }
          return true;
        };
        const findPosition = (span, start) => {
          const startRow = Math.floor(start / columns);
          for (let y = startRow; y <= rows - span; y += 1) {
            for (let x = y === startRow ? start % columns : 0; x <= columns - span; x += 1) {
              if (fits(x, y, span)) return { index: y * columns + x, x, y };
            }
          }
          return null;
        };

        return cells.map((cell) => {
          let span = Math.min(cell.span, columns);
          let position = findPosition(span, cursors[span]);

          while (position === null) {
            span -= 1;
            position = findPosition(span, cursors[span]);
          }

          for (let row = position.y; row < position.y + span; row += 1) {
            occupied.fill(1, row * columns + position.x, row * columns + position.x + span);
          }
          cursors[span] = position.index + span;

          return { x: position.x, y: position.y, span };
        });
      }

      function createHeatmapGeometry(cells, layouts, canvas, width) {
        const maxGap = Number.parseFloat(getComputedStyle(canvas).getPropertyValue("--block-preview-heatmap-gap")) || 0;
        const gap = Math.max(1, maxGap * Math.min(1, width / 640));
        const cell = Math.max(1, (width - gap * (HEATMAP_COLUMNS - 1)) / HEATMAP_COLUMNS);
        const unit = cell + gap;
        const lookup = new Uint16Array(HEATMAP_COLUMNS * HEATMAP_COLUMNS);
        const rects = layouts.map((layout, index) => {
          const size = layout.span * cell + (layout.span - 1) * gap;

          for (let row = layout.y; row < layout.y + layout.span; row += 1) {
            lookup.fill(index + 1, row * HEATMAP_COLUMNS + layout.x, row * HEATMAP_COLUMNS + layout.x + layout.span);
          }

          return { color: cells[index].color, transaction: cells[index].transaction, size, x: layout.x * unit, y: width - layout.y * unit - size };
        });

        return { lookup, rects, unit, width };
      }

      function hitTest(geometry, x, y) {
        if (x < 0 || y < 0 || x > geometry.width || y > geometry.width) return null;
        const column = Math.min(HEATMAP_COLUMNS - 1, Math.floor(x / geometry.unit));
        const row = HEATMAP_COLUMNS - Math.min(HEATMAP_COLUMNS - 1, Math.floor(y / geometry.unit)) - 1;
        const rect = geometry.rects[geometry.lookup[row * HEATMAP_COLUMNS + column] - 1];

        return rect && x >= rect.x && x <= rect.x + rect.size && y >= rect.y && y <= rect.y + rect.size ? rect.transaction : null;
      }

      function createHeatmap(data, onInspect) {
        const MUTED_ALPHA = 0.12;
        const canvas = el("canvas", { role: "img", "aria-label": "Transactions sized by weight and colored by fee rate" });
        const context = canvas.getContext("2d");
        const order = orderTransactions(data.weights, data.feeRates);
        const ranges = previewFeeRange(data.feeRates, order);
        const colors = new Map();
        const cells = Array.from(order.subarray(0, HEATMAP_COLUMNS * HEATMAP_COLUMNS), (offset) => {
          const feeRate = data.feeRates[offset];
          const weight = data.weights[offset];
          let color = colors.get(feeRate);
          if (color === undefined) colors.set(feeRate, (color = canvasFeeRateColor(feeRate, ranges)));
          return { color, weight, transaction: { feeRate, weight, txIndex: data.range.start + offset } };
        });
        const layouts = packCells(cells, HEATMAP_COLUMNS, resolveCapacityCells(cells, data.blockWeight, HEATMAP_COLUMNS));
        const hiddenCounts = new Uint8Array(data.range.end - data.range.start);
        const white = canvasColor("var(--white)");
        const black = canvasColor("var(--black)");
        let hiddenFilters = 0;
        let preview = null;
        let inspected = null;
        let geometry = null;
        let bounds = null;
        let frame = 0;
        let inspectFrame = 0;
        let inspectPoint = null;
        let captured = null;

        const measure = () => (bounds = canvas.getBoundingClientRect());

        function draw() {
          const width = measure().width;
          if (width <= 0) return;

          const dpr = devicePixelRatio || 1;
          const size = Math.round(width * dpr);
          if (canvas.width !== size) canvas.width = canvas.height = size;
          if (geometry?.width !== width) geometry = createHeatmapGeometry(cells, layouts, canvas, width);

          context.setTransform(dpr, 0, 0, dpr, 0, 0);
          context.clearRect(0, 0, width, width);
          let inspectedRect = null;

          for (const rect of geometry.rects) {
            const index = rect.transaction.txIndex - data.range.start;
            context.globalAlpha = preview ? (preview[index] ? 1 : MUTED_ALPHA) : hiddenFilters && hiddenCounts[index] ? MUTED_ALPHA : 1;
            context.fillStyle = rect.color;
            context.fillRect(rect.x, rect.y, rect.size, rect.size);
            if (rect.transaction === inspected) inspectedRect = rect;
          }

          if (inspectedRect) {
            const size = Math.max(inspectedRect.size, 10);
            const x = inspectedRect.x + inspectedRect.size / 2 - size / 2;
            const y = inspectedRect.y + inspectedRect.size / 2 - size / 2;
            const line = Math.max(1, Math.min(3, size / 5));
            context.fillStyle = white;
            context.globalAlpha = 0.18;
            context.fillRect(x, y, size, size);
            context.globalAlpha = 1;
            context.lineWidth = line + 2;
            context.strokeStyle = black;
            context.strokeRect(x, y, size, size);
            context.lineWidth = line;
            context.strokeStyle = white;
            context.strokeRect(x, y, size, size);
          }

          context.globalAlpha = 1;
        }

        function scheduleDraw() {
          cancelAnimationFrame(frame);
          frame = requestAnimationFrame(draw);
        }

        function inspectAt(point, eager) {
          const box = bounds ?? measure();
          if (!geometry) draw();
          if (!geometry) return;

          const transaction = hitTest(geometry, point.clientX - box.left, point.clientY - box.top);
          // Gaps between cells keep the last transaction: no flicker while sweeping.
          if (transaction === null && inspected !== null) {
            onInspect(inspected, point, eager);
            return;
          }
          if (transaction !== inspected) {
            inspected = transaction;
            scheduleDraw();
          }
          onInspect(transaction, point, eager);
        }

        function clearInspect() {
          cancelAnimationFrame(inspectFrame);
          inspectFrame = 0;
          inspectPoint = null;
          if (inspected) {
            inspected = null;
            scheduleDraw();
          }
          onInspect(null, null, false);
        }

        const pointOf = (event) => ({ clientX: event.clientX, clientY: event.clientY });
        const clearOnOutside = (event) => {
          if (!(event.target instanceof Node && canvas.contains(event.target))) clearInspect();
        };
        const observer = new ResizeObserver(scheduleDraw);

        canvas.addEventListener("pointerenter", measure);
        canvas.addEventListener("pointerdown", (event) => {
          captured = event.pointerId;
          canvas.setPointerCapture(event.pointerId);
          measure();
          inspectAt(pointOf(event), true);
          if (event.pointerType !== "mouse") event.preventDefault();
        });
        canvas.addEventListener("pointermove", (event) => {
          if (captured === null && event.pointerType !== "mouse") return;
          inspectPoint = pointOf(event);
          inspectFrame ||= requestAnimationFrame(() => {
            inspectFrame = 0;
            if (inspectPoint) inspectAt(inspectPoint, false);
          });
          if (captured !== null && event.pointerType !== "mouse") event.preventDefault();
        });
        canvas.addEventListener("pointerup", (event) => {
          if (captured !== event.pointerId) return;
          captured = null;
          canvas.releasePointerCapture(event.pointerId);
        });
        canvas.addEventListener("pointercancel", () => {
          captured = null;
          clearInspect();
        });
        canvas.addEventListener("pointerleave", (event) => {
          if (captured === null && event.pointerType === "mouse") clearInspect();
        });
        document.addEventListener("pointerdown", clearOnOutside);
        addEventListener("blur", clearInspect);
        observer.observe(canvas);
        scheduleDraw();

        return {
          element: canvas,
          setPreview(membership) {
            if (preview === membership) return;
            preview = membership;
            scheduleDraw();
          },
          setHidden(membership, hidden) {
            const change = hidden ? 1 : -1;
            hiddenFilters += change;
            membership.forEach((member, index) => {
              if (member) hiddenCounts[index] += change;
            });
            scheduleDraw();
          },
          destroy() {
            cancelAnimationFrame(frame);
            cancelAnimationFrame(inspectFrame);
            document.removeEventListener("pointerdown", clearOnOutside);
            removeEventListener("blur", clearInspect);
            observer.disconnect();
          },
        };
      }

      // Inspector: the readout over the heatmap -------------------------------

      function createInspector(parentSignal, filterData) {
        const TRAITS_DWELL_MS = 180;
        const TXID_DWELL_MS = 120;
        const TXID_CACHE_LIMIT = 64;
        const MARGIN = 8;
        const element = el("dl", { hidden: true });
        const field = (label) => {
          const value = el("dd");
          element.append(el("div", null, el("dt", null, label), value));
          return value;
        };
        const set = (node, text, busy = false) => {
          node.textContent = text;
          if (busy) node.setAttribute("aria-busy", "true");
          else node.removeAttribute("aria-busy");
        };
        const txid = field("txid");
        const tx = field("tx");
        const fee = field("fee");
        const weight = field("weight");
        const traits = GROUPED_FILTERS.map(({ label, filters }) => ({ filters, value: field(label) }));
        const txids = new Map();
        let inspected = null;
        let point = null;
        let size = null;
        let traitsTimer = 0;
        let txidTimer = 0;
        let pending = null;

        function abortPending() {
          clearTimeout(traitsTimer);
          clearTimeout(txidTimer);
          pending?.abort();
          pending = null;
        }

        function place() {
          size ??= { width: element.offsetWidth, height: element.offsetHeight };
          const bounds = element.parentElement.getBoundingClientRect();
          const minX = Math.min(bounds.width / 2, size.width / 2 + MARGIN);
          const rawX = point.clientX - bounds.left;
          const rawY = point.clientY - bounds.top;
          const below = rawY < size.height + MARGIN * 2;
          const minY = below ? MARGIN : size.height + MARGIN;
          const maxY = Math.max(minY, below ? bounds.height - size.height - MARGIN : bounds.height - MARGIN);

          element.style.setProperty("--tx-x", `${Math.min(Math.max(minX, bounds.width - minX), Math.max(minX, rawX))}px`);
          element.style.setProperty("--tx-y", `${Math.min(maxY, Math.max(minY, rawY))}px`);
          element.toggleAttribute("data-below", below);
        }

        function refresh(transaction, mutate) {
          if (inspected !== transaction) return;
          size = null;
          mutate();
          if (point) place();
        }

        function inspect(transaction, nextPoint, eager) {
          if (!transaction || !nextPoint) {
            abortPending();
            inspected = point = null;
            element.hidden = true;
            return;
          }

          element.hidden = false;
          point = nextPoint;
          if (transaction === inspected) {
            place();
            return;
          }

          abortPending();
          inspected = transaction;
          size = null;
          const controller = new AbortController();
          const signal = AbortSignal.any([parentSignal, controller.signal]);
          pending = controller;

          set(tx, `#${formatNumber(transaction.txIndex)}`);
          set(fee, `${formatFeeRate(transaction.feeRate)} sat/vB`);
          set(weight, formatWeight(transaction.weight));
          for (const { value } of traits) {
            value.removeAttribute("title");
            set(value, "loading", true);
          }

          const known = txids.get(transaction.txIndex);
          if (known) {
            set(txid, known);
            txid.title = known;
          } else {
            txid.removeAttribute("title");
            set(txid, "loading", true);
            txidTimer = setTimeout(() => {
              void loadTxid(transaction.txIndex, signal).then((id) => {
                if (txids.size >= TXID_CACHE_LIMIT) txids.delete(txids.keys().next().value);
                txids.set(transaction.txIndex, id);
                refresh(transaction, () => {
                  set(txid, id);
                  txid.title = id;
                });
              }, (error) => {
                if (!signal.aborted) console.error(error);
              });
            }, eager ? 0 : TXID_DWELL_MS);
          }

          traitsTimer = setTimeout(() => {
            void filterData.loadTransactionKeys(transaction.txIndex, signal).then((keys) => {
              const active = new Set(keys);
              refresh(transaction, () => {
                for (const { filters, value } of traits) {
                  const text = filters.filter(({ key }) => active.has(key)).map(({ label }) => label).join(" · ") || "none";
                  set(value, text);
                  value.title = text;
                }
              });
            }, (error) => {
              if (signal.aborted || inspected !== transaction) return;
              for (const { value } of traits) set(value, "unavailable");
              console.error(error);
            });
          }, eager ? 0 : TRAITS_DWELL_MS);

          place();
        }

        return { element, inspect, destroy: abortPending };
      }

      // Filters panel ------------------------------------------------------------

      function createFilterPanel() {
        const value = el("span");
        const summary = el("summary", null, el("span", null, "filters:"), value);
        const panel = el("details", { "data-block-preview-filters": true }, summary);
        return { panel, summary, value };
      }

      function createFilters(data, heatmap) {
        const { panel, summary, value } = createFilterPanel();
        const hidden = new Set();
        const applied = new Set();
        let live = true;
        let loaded = false;
        let previewing = null;

        const summarize = () => {
          const labels = FILTERS.filter(({ key }) => hidden.has(key)).map(({ group, label }) => `${FILTER_GROUP_LABELS.get(group)} ${label}`);
          value.textContent = labels.length ? `hidden ${labels.slice(0, 3).join(", ")}${labels.length > 3 ? ` ... +${labels.length - 3}` : ""}` : "none";
        };

        function resetPreview() {
          previewing?.removeAttribute("data-preview");
          previewing = null;
          heatmap.setPreview(null);
        }

        function preview(button, filter) {
          resetPreview();
          previewing = button;
          button.setAttribute("aria-busy", "true");
          void data.loadMembership(filter).then((membership) => {
            button.removeAttribute("aria-busy");
            if (!live || previewing !== button) return;
            button.dataset.preview = "";
            heatmap.setPreview(membership);
          }, (error) => {
            button.removeAttribute("aria-busy");
            if (live) resetPreview();
            console.error(error);
          });
        }

        function render(counts) {
          panel.replaceChildren(summary);

          for (const { label, filters } of GROUPED_FILTERS) {
            const present = filters.filter(({ index }) => counts[index] > 0);
            if (!present.length) continue;

            const group = el("div", null, el("span", null, label));

            for (const filter of present) {
              const { button, value: count } = legendItem({ label: filter.label, color: filter.color });
              const sync = () => {
                button.setAttribute("aria-pressed", String(!hidden.has(filter.key)));
                button.toggleAttribute("data-muted", hidden.has(filter.key));
              };

              count.textContent = formatNumber(counts[filter.index]);
              button.addEventListener("click", () => {
                resetPreview();
                if (hidden.has(filter.key)) hidden.delete(filter.key);
                else hidden.add(filter.key);
                sync();
                summarize();
                void data.loadMembership(filter).then((membership) => {
                  const hide = hidden.has(filter.key);
                  if (!live || hide === applied.has(filter.key)) return;
                  heatmap.setHidden(membership, hide);
                  if (hide) applied.add(filter.key);
                  else applied.delete(filter.key);
                }, console.error);
              });
              if (CAN_HOVER.matches) {
                button.addEventListener("pointerenter", () => preview(button, filter));
                button.addEventListener("pointerleave", resetPreview);
              }
              button.addEventListener("focus", () => preview(button, filter));
              button.addEventListener("blur", resetPreview);
              sync();
              group.append(button);
            }

            panel.append(group);
          }
        }

        panel.addEventListener("toggle", () => {
          if (!panel.open) {
            resetPreview();
            return;
          }
          if (loaded) return;

          loaded = true;
          value.textContent = "loading";
          void data.loadCounts().then((counts) => {
            if (!live) return;
            summarize();
            render(counts);
          }, (error) => {
            if (!live) return;
            loaded = false;
            value.textContent = "unavailable";
            console.error(error);
          });
        });
        summarize();

        return {
          element: panel,
          destroy() {
            live = false;
            resetPreview();
          },
        };
      }

      function createPreviewPane(block) {
        const element = el("div", { "data-block-preview": true });
        const controller = new AbortController();
        let data = null;
        let destroyPreview = () => {};

        const figure = (body, filters, inspector) => el("figure", null, el("figcaption", null, filters), body, inspector);
        const renderStatus = (text) => {
          const pending = createFilterPanel();
          pending.value.textContent = text === "Loading" ? "loading" : "unavailable";
          element.replaceChildren(figure(el("p", { "data-block-preview-status": true }, text), pending.panel));
        };

        renderStatus("Loading");

        function load() {
          data ??= loadPreviewData(block, controller.signal);
          void data.then((preview) => {
            if (controller.signal.aborted) return;
            const filterData = createFilterData(block.height, preview.range, controller.signal);
            const inspector = createInspector(controller.signal, filterData);
            const heatmap = createHeatmap(preview, inspector.inspect);
            const filters = createFilters(filterData, heatmap);

            destroyPreview = () => {
              inspector.destroy();
              filters.destroy();
              heatmap.destroy();
            };
            element.replaceChildren(figure(heatmap.element, filters.element, inspector.element));
          }, (error) => {
            if (controller.signal.aborted) return;
            console.error("block preview:", error);
            renderStatus("Unavailable");
          });
          return data;
        }

        return {
          element,
          load,
          destroy() {
            controller.abort();
            destroyPreview();
          },
        };
      }

      // X-ray: the block as one isometric cube of transaction cubes ---------------

      const XRAY_GRID = 48;
      const XRAY_LOOKAHEAD = 4;
      const XRAY_WIDTH = 173.205;
      const XRAY_HEIGHT = 200;

      function createXrayVolume(data) {
        const GRID = XRAY_GRID;
        const fill = Math.min(1, data.blockWeight / MAX_BLOCK_WEIGHT);
        const layers = Math.max(1, Math.round(fill * GRID));
        const capacity = GRID * GRID * layers;
        const order = orderTransactions(data.weights, data.feeRates);
        const ranges = previewFeeRange(data.feeRates, order);
        const transactions = Array.from(order, (offset) => ({ color: feeRateColor(data.feeRates[offset], ranges), weight: data.weights[offset] }));
        const indexOf = (east, north, up) => up * GRID * GRID + north * GRID + east;
        const occupied = new Uint8Array(capacity);
        const cursors = new Uint32Array(layers + 1);

        // Spans: cube roots of weight shares, calibrated to fill the volume.
        const totalWeight = transactions.reduce((sum, { weight }) => sum + weight, 0);
        const ideal = Float64Array.from(transactions, ({ weight }) => Math.cbrt((weight * capacity) / totalWeight));
        const spanOf = (value, scale) => Math.max(1, Math.min(layers, Math.round(value * scale)));
        const volume = (scale) => ideal.reduce((sum, value) => sum + spanOf(value, scale) ** 3, 0);
        let lower = 0;
        let upper = 1;

        // Spans cap at `layers`: a tiny block may never fill the volume, so stop once they saturate.
        while (volume(upper) <= capacity && ideal.some((value) => spanOf(value, upper) < layers)) upper *= 2;
        for (let step = 0; step < CALIBRATION_STEPS; step += 1) {
          const scale = (lower + upper) / 2;
          if (volume(scale) <= capacity) lower = scale;
          else upper = scale;
        }

        const spans = Uint8Array.from(ideal, (value) => spanOf(value, lower));
        let used = spans.reduce((sum, span) => sum + span ** 3, 0);
        const candidates = Uint32Array.from(spans, (_, index) => index)
          .sort((a, b) => (spans[a] + 0.5) / ideal[a] - (spans[b] + 0.5) / ideal[b] || a - b);

        for (const index of candidates) {
          if (spans[index] === layers) continue;
          const growth = (spans[index] + 1) ** 3 - spans[index] ** 3;
          if (used + growth > capacity) continue;
          spans[index] += 1;
          used += growth;
        }

        function canPlace(east, north, up, span) {
          for (let z = up; z < up + span; z += 1) {
            for (let y = north; y < north + span; y += 1) {
              const offset = indexOf(east, y, z);
              for (let x = 0; x < span; x += 1) if (occupied[offset + x]) return false;
            }
          }
          return true;
        }

        function supportBelow(east, north, up, span) {
          if (up === 0) return span ** 2;
          let support = 0;
          for (let y = north; y < north + span; y += 1) {
            for (let x = east; x < east + span; x += 1) support += occupied[indexOf(x, y, up - 1)];
          }
          return support;
        }

        /** First position from the cursor, preferring the best-supported spot among a few candidates. */
        function findPosition(span, start) {
          const layerArea = GRID * GRID;
          const startUp = Math.floor(start / layerArea);
          const startNorth = Math.floor((start % layerArea) / GRID);
          const startEast = start % GRID;

          for (let up = startUp; up <= layers - span; up += 1) {
            let best = null;
            let remaining = XRAY_LOOKAHEAD;

            for (let north = up === startUp ? startNorth : 0; north <= GRID - span; north += 1) {
              for (let east = up === startUp && north === startNorth ? startEast : 0; east <= GRID - span; east += 1) {
                if (canPlace(east, north, up, span)) {
                  const support = supportBelow(east, north, up, span);
                  const placement = { east, north, up, index: up * layerArea + north * GRID + east };
                  if (support === span ** 2) return placement;
                  if (best === null || support > best.support) best = { ...placement, support };
                }
                if (best !== null && --remaining === 0) return best;
              }
            }

            if (best !== null) return best;
          }

          return null;
        }

        const placed = transactions.map((transaction, index) => {
          let span = spans[index];
          let position = findPosition(span, cursors[span]);

          while (position === null) {
            span -= 1;
            position = findPosition(span, cursors[span]);
          }

          for (let z = position.up; z < position.up + span; z += 1) {
            for (let y = position.north; y < position.north + span; y += 1) {
              const offset = indexOf(position.east, y, z);
              occupied.fill(1, offset, offset + span);
            }
          }
          cursors[span] = position.index + span;

          return { ...transaction, east: position.east, north: position.north, up: position.up, span };
        });

        const open = (cube, side) => {
          const { east, north, up, span } = cube;
          if (side === "left" && east === 0) return true;
          if (side === "right" && north === 0) return true;
          if (side === "top" && up + span === layers) return true;

          for (let a = 0; a < span; a += 1) {
            for (let b = 0; b < span; b += 1) {
              const cell = side === "left" ? indexOf(east - 1, north + b, up + a)
                : side === "right" ? indexOf(east + b, north - 1, up + a)
                : indexOf(east + b, north + a, up + span);
              if (!occupied[cell]) return true;
            }
          }

          return false;
        };

        const cubes = placed
          .map((cube) => ({ ...cube, faces: { left: open(cube, "left"), right: open(cube, "right"), top: open(cube, "top") } }))
          .filter(({ faces }) => faces.left || faces.right || faces.top)
          .sort((a, b) => a.up - a.east - a.north - (b.up - b.east - b.north));

        return { cubes, fill: layers / GRID };
      }

      function renderXray(svg, data) {
        const project = (east, north, up) =>
          `${XRAY_WIDTH / 2 + (XRAY_WIDTH / 2) * (east - north)},${XRAY_HEIGHT * (1 - 0.25 * east - 0.25 * north - 0.5 * up)}`;
        const polygon = (points, color) => `<polygon points="${points.join(" ")}" style="--xray-fee-color:${color}"></polygon>`;
        let markup = "";

        for (const cube of createXrayVolume(data).cubes) {
          const [e0, n0, u0] = [cube.east / XRAY_GRID, cube.north / XRAY_GRID, cube.up / XRAY_GRID];
          const [e1, n1, u1] = [(cube.east + cube.span) / XRAY_GRID, (cube.north + cube.span) / XRAY_GRID, (cube.up + cube.span) / XRAY_GRID];

          if (cube.faces.left) markup += polygon([project(e0, n1, u0), project(e0, n0, u0), project(e0, n0, u1), project(e0, n1, u1)], `color-mix(in oklch, ${cube.color} 72%, var(--black))`);
          if (cube.faces.right) markup += polygon([project(e0, n0, u0), project(e1, n0, u0), project(e1, n0, u1), project(e0, n0, u1)], `color-mix(in oklch, ${cube.color} 58%, var(--black))`);
          if (cube.faces.top) markup += polygon([project(e0, n0, u1), project(e1, n0, u1), project(e1, n1, u1), project(e0, n1, u1)], cube.color);
        }

        svg.innerHTML = markup;
      }

      /** Rendered once the pane nears the viewport. */
      function createXrayPane(dataPromise, scrollRoot) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        const status = el("p", null, "Loading");
        const element = el("section", { "data-block-xray": true }, el("h2", null, "X-ray"), el("div", null, status, svg));
        let live = true;

        svg.setAttribute("viewBox", `0 0 ${XRAY_WIDTH} ${XRAY_HEIGHT}`);
        svg.setAttribute("preserveAspectRatio", "none");
        svg.setAttribute("aria-hidden", "true");

        const observer = new IntersectionObserver((entries) => {
          if (!entries.some(({ isIntersecting }) => isIntersecting)) return;
          observer.disconnect();
          void dataPromise.then((data) => {
            if (!live) return;
            renderXray(svg, data);
            status.remove();
            element.dataset.ready = "";
          }, () => {
            if (live) status.textContent = "Unavailable";
          });
        }, { root: scrollRoot, rootMargin: "75% 0px" });

        observer.observe(element);

        return {
          element,
          destroy() {
            live = false;
            observer.disconnect();
          },
        };
      }

      // Fee chart: the block's fee-rate percentiles, log-scaled -------------------

      function createFeeChart(range, average) {
        const PAD = 8;
        const scale = (value) => Math.log10(value + 1);
        const samples = range.map((y, index) => ({ x: FEE_RATE_PERCENTILES[index], y }));
        const averageX = (() => {
          const target = scale(average);
          const scaled = samples.map(({ y }) => scale(y));
          if (target <= scaled[0]) return 0;
          for (let index = 1; index < scaled.length; index += 1) {
            if (target > scaled[index]) continue;
            const span = scaled[index] - scaled[index - 1];
            const ratio = span ? (target - scaled[index - 1]) / span : 0;
            return samples[index - 1].x + (samples[index].x - samples[index - 1].x) * ratio;
          }
          return 100;
        })();
        const entries = [
          ...samples.map((sample, index) => ({ ...FEE_RATE_STOPS[index], sample, priority: 0 })),
          { label: "avg", color: "var(--white)", sample: { x: averageX, y: average }, priority: 1 },
        ].sort((a, b) => a.sample.y - b.sample.y || a.priority - b.priority);

        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const legend = el("menu", { "data-legend-list": true });
        const figure = el(
          "figure",
          { "data-fee-chart": true },
          el("figcaption", null, "Fees ", el("span", null, "| sat/vB")),
          legend,
          svg,
        );
        const items = entries.map((entry) => {
          const { button, value } = legendItem({ label: entry.label, color: entry.color });
          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          value.textContent = formatFeeRate(entry.sample.y);
          circle.style.setProperty("--color", entry.color);
          legend.append(el("li", null, button));
          return { ...entry, button, circle };
        });
        let points = [];

        svg.setAttribute("role", "img");
        svg.setAttribute("aria-label", `Fee rate percentiles from ${formatFeeRate(range[0])} to ${formatFeeRate(range.at(-1))} sat/vB`);
        svg.append(path, ...items.map(({ circle }) => circle));

        const highlight = (active) => {
          svg.toggleAttribute("data-hover", active != null);
          for (const item of items) {
            item.button.toggleAttribute("data-active", item === active);
            item.circle.toggleAttribute("data-active", item === active);
          }
        };

        function render() {
          const { width, height } = svg.getBoundingClientRect();
          if (!width) return;

          const values = entries.map(({ sample }) => scale(sample.y));
          const min = Math.min(...values);
          const span = Math.max(...values) - min;
          const x = (value) => PAD + (value / 100) * (width - 2 * PAD);
          const y = (value) => (span ? PAD + (1 - (scale(value) - min) / span) * (height - 2 * PAD) : height / 2);

          svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
          path.setAttribute("d", samples.map((sample, index) => `${index ? "L" : "M"}${x(sample.x).toFixed(1)} ${y(sample.y).toFixed(1)}`).join(""));
          points = items.map((item) => {
            const point = { item, x: x(item.sample.x), y: y(item.sample.y) };
            item.circle.setAttribute("cx", point.x.toFixed(1));
            item.circle.setAttribute("cy", point.y.toFixed(1));
            item.circle.setAttribute("r", "4.5");
            return point;
          });
        }

        svg.addEventListener("pointermove", (event) => {
          const box = svg.getBoundingClientRect();
          const px = event.clientX - box.left;
          const py = event.clientY - box.top;
          let closest = null;
          let distance = Infinity;
          for (const point of points) {
            const next = Math.hypot(point.x - px, point.y - py);
            if (next < distance) [closest, distance] = [point, next];
          }
          highlight(closest?.item);
        });
        svg.addEventListener("pointerleave", () => highlight(null));
        for (const item of items) {
          item.button.addEventListener("pointerenter", () => highlight(item));
          item.button.addEventListener("pointerleave", () => highlight(null));
          item.button.addEventListener("focus", () => highlight(item));
          item.button.addEventListener("blur", () => highlight(null));
        }

        const observer = new ResizeObserver(render);
        observer.observe(svg);

        return { element: figure, destroy: () => observer.disconnect() };
      }

      // Side panes ---------------------------------------------------------------

      function createMinerPane(block) {
        const { pool, coinbaseSignatureAscii } = block.extras;
        const message = coinbaseMessage(coinbaseSignatureAscii ?? "");

        return el(
          "div",
          { "data-miner-pane": true },
          el(
            "div",
            null,
            el("div", null, el("div", null, el("strong", null, pool.name), el("span", null, formatPoolBlock(pool.blockNumber))), el("span", null, pool.slug)),
            poolLogo(pool),
          ),
          message && el("p", { title: message }, message),
        );
      }

      function createRewardsPane(extras) {
        const subsidy = extras.reward - extras.totalFees;
        const share = (sats) => `${((sats / extras.reward) * 100).toFixed(2)}%`;
        const usd = (sats) => amount("span", usdParts(satsToUsd(sats, extras.price)));
        const parts = [
          ["subsidy", "Subsidy", subsidy, "var(--orange)"],
          ["fees", "Fees", extras.totalFees, "var(--green)"],
        ];
        const bar = el("div", { "data-bar": true });
        const list = el("menu", { "data-legend-list": true, "data-legend-fill": true });
        const linked = [];

        for (const [key, label, sats, color] of parts) {
          const detail = document.createDocumentFragment();
          detail.append(usd(sats), ` · ${share(sats)}`);
          const { button, value } = legendItem({ label, color, detail });
          const segment = el("span", { style: `--share:${(sats / extras.reward) * 100}%;--segment-color:${color}` });

          value.replaceChildren(amount("span", btcParts(sats)));
          button.dataset.key = segment.dataset.key = key;
          bar.append(segment);
          list.append(el("li", null, button));
          linked.push(button, segment);
        }

        const pane = el(
          "div",
          { "data-rewards-pane": true },
          el("div", { "data-reward-total": true }, el("span", null, "Rewards"), amount("strong", btcParts(extras.reward)), usd(extras.reward)),
          bar,
          list,
        );
        const preview = (key) => {
          for (const node of linked) {
            node.toggleAttribute("data-preview", key != null && node.dataset.key === key && node.tagName === "BUTTON");
            node.toggleAttribute("data-muted", key != null && node.dataset.key !== key);
          }
        };
        const keyOf = (event) => event.target.closest?.("[data-key]")?.dataset.key ?? null;

        pane.addEventListener("pointerover", (event) => preview(keyOf(event)));
        pane.addEventListener("pointerleave", () => preview(null));
        pane.addEventListener("pointerup", () => preview(null));
        pane.addEventListener("pointercancel", () => preview(null));

        return pane;
      }

      function createDifficultyPane(block) {
        const epoch = (label, length, color) => {
          const { ratio, remaining } = epochProgress(block.height, length);
          return el(
            "div",
            { "data-epoch": true, style: `--epoch-color:${color}` },
            el("div", { "data-epoch-head": true }, el("span", null, label), el("strong", null, formatEpoch(block.height, length))),
            el(
              "div",
              { "data-bar": true },
              el("span", { style: `--share:${ratio * 100}%;--segment-color:${color}` }),
              el("span", { style: `--share:${(remaining / length) * 100}%;--segment-color:color-mix(in oklch, var(--gray) 35%, transparent)` }),
            ),
          );
        };

        return el(
          "div",
          { "data-metric-list": true },
          el("div", { "data-metric-stat": true }, el("span", null, "Difficulty"), el("strong", null, formatNumber(block.difficulty))),
          epoch("Difficulty epoch", DIFFICULTY_EPOCH_BLOCKS, "var(--orange)"),
          epoch("Halving epoch", HALVING_EPOCH_BLOCKS, "var(--red)"),
        );
      }

      function createMeta(block) {
        const item = (label, value) => el("div", null, el("span", null, label), el("strong", null, value));
        return el(
          "div",
          { "data-block-meta": true },
          item("Block", `${formatBytes(block.size)} · ${formatBlockFill(block.weight)}`),
          item("Tx", formatNumber(block.tx_count)),
          item("Input", formatNumber(block.extras.totalInputs)),
          item("Output", formatNumber(block.extras.totalOutputs)),
        );
      }

      const blockTitle = (height) => [el("span", null, "Block"), el("span", null, heightElement(height))];

      // Receipt -------------------------------------------------------------------

      function blockUrl(block) {
        return location.protocol.startsWith("http")
          ? `${location.origin}${location.pathname}#${block.id}`
          : `${ORIGIN}/api/block/${block.id}`;
      }

      /** @returns {[string, { label: string, value: string, detail?: string, variant?: string }[]][]} */
      function receiptSections(block) {
        const { extras } = block;
        const subsidy = extras.reward - extras.totalFees;
        const btc = (sats) => partsText(btcParts(sats));
        const usd = (sats) => partsText(usdParts(satsToUsd(sats, extras.price)));
        const row = (label, value, variant) => ({ label, value, variant });
        const money = (label, sats, variant) => ({ label, value: btc(sats), detail: usd(sats), variant });

        return [
          ["Summary", [
            row("Time", formatDateTime(block.timestamp), "wide"),
            row("Price", partsText(usdParts(extras.price))),
            row("Miner", extras.pool.name),
            money("Reward", extras.reward, "total"),
            money("Fees", extras.totalFees),
            row("Tx", formatNumber(block.tx_count)),
            row("Size", `${formatBytes(block.size)} · ${formatBlockFill(block.weight)}`),
          ]],
          ["Reward split", [money("Subsidy", subsidy), money("Fees", extras.totalFees)]],
          ["Block", [
            row("Weight", formatWeight(block.weight)),
            row("Virtual", `${formatNumber(extras.virtualSize)} vB`),
            row("Avg tx", formatBytes(extras.avgTxSize)),
            row("Input", formatNumber(extras.totalInputs)),
            row("Output", formatNumber(extras.totalOutputs)),
          ]],
          ["Fees", [
            row("Median", `${formatFeeRate(extras.medianFee)} sat/vB`),
            row("Average", `${formatFeeRate(extras.avgFeeRate)} sat/vB`),
            row("Range", `${formatFeeRate(extras.feeRange[0])} - ${formatFeeRate(extras.feeRange.at(-1))} sat/vB`),
            row("Avg fee", `${formatNumber(extras.avgFee)} sat`),
            row("Median fee", `${formatNumber(extras.medianFeeAmt)} sat`),
          ]],
          ["Mining", [
            row("Pool slug", extras.pool.slug),
            row("Pool block", formatPoolBlock(extras.pool.blockNumber)),
            row("Difficulty", formatNumber(block.difficulty), "wide"),
            row("Diff epoch", formatEpoch(block.height, DIFFICULTY_EPOCH_BLOCKS)),
            row("Halving", formatEpoch(block.height, HALVING_EPOCH_BLOCKS)),
          ]],
          ["Verify", [
            row("Height", `#${formatNumber(block.height)}`),
            row("Hash", block.id, "wide"),
            row("Previous", block.previousblockhash, "wide"),
          ]],
        ];
      }

      function openReceipt(block) {
        const url = blockUrl(block);
        const note = coinbaseMessage(block.extras.coinbaseSignatureAscii ?? "");
        const qr = el("img", { alt: `QR code for block ${block.height}` });
        const brand = /** @type {HTMLElement} */ (document.querySelector(".site-brand").cloneNode(true));
        const print = el("button", { type: "button", "data-print": true }, "Print");
        const dialog = el(
          "dialog",
          { "data-block-receipt": true, "aria-label": `Receipt for block ${block.height}`, tabindex: -1 },
          el(
            "div",
            null,
            el(
              "article",
              null,
              el("header", null, el("h2", { "data-block-title": true }, ...blockTitle(block.height))),
              ...receiptSections(block).map(([title, rows]) => el(
                "section",
                null,
                el("h3", null, title),
                ...rows.map(({ label, value, detail, variant }) => el(
                  "div",
                  { "data-row": variant ?? (detail ? "amount" : "") },
                  el("span", null, label),
                  el("strong", null, value, detail && el("small", null, detail)),
                )),
              )),
              note && el("p", { "data-receipt-note": true }, note),
              el("section", { "data-receipt-qr": true }, el("span", null, "Scan to verify"), qr, el("a", { href: url }, url.replace(/^https?:\/\//, ""))),
              el("section", { "data-receipt-brand": true }, brand),
            ),
          ),
          el("footer", null, el("form", { method: "dialog" }, el("button", { value: "close" }, "Close")), print),
        );

        brand.removeAttribute("href");
        brand.removeAttribute("aria-label");
        print.addEventListener("click", () => window.print());
        dialog.addEventListener("click", (event) => {
          if (event.target === dialog) dialog.close();
        });
        dialog.addEventListener("close", async () => {
          await wait(200);
          dialog.remove();
        }, { once: true });
        document.body.append(dialog);
        dialog.showModal();
        dialog.focus({ preventScroll: true });

        void loadQr().then((generate) => {
          qr.src = generate(url)?.toDataURL({ padX: 0, padY: 0, scale: 8 }) ?? "";
        }, (error) => {
          qr.remove();
          console.error("qr:", error);
        });
      }

      // Block details ---------------------------------------------------------------

      function createBlockDetails() {
        const element = el("section", { id: "block-details", "aria-label": "Block", inert: true });
        const title = el("h1", { "data-block-title": true });
        const price = el("output", { "data-size": "title", "data-tone": "positive" });
        const hash = el("p");
        const newer = el("a", { "data-button": true, "data-step": "newer", title: "Newer block (←)" }, "← Newer");
        const older = el("a", { "data-button": true, "data-step": "older", title: "Older block (→)" }, "Older →");
        const receipt = el("button", { type: "button" }, "Receipt");
        const date = el("time");
        const header = el("header", { "data-block-header": true }, title, price, hash, el("div", null, newer, older, receipt), date);
        const content = el("div", { "data-block-content": true });
        let current = null;
        let destroyers = [];
        let activatePending = null;
        let dateTimer = 0;

        element.append(header, content);
        receipt.addEventListener("click", () => {
          if (current) openReceipt(current);
        });

        function setStep(link, height, disabled) {
          if (disabled) {
            link.removeAttribute("href");
            link.setAttribute("aria-disabled", "true");
          } else {
            link.href = `#${height}`;
            link.removeAttribute("aria-disabled");
          }
        }

        function clear() {
          for (const destroy of destroyers) destroy();
          destroyers = [];
          activatePending = null;
          clearTimeout(dateTimer);
          content.textContent = "";
        }

        const atTip = (block) => knownTipHeight >= 0 && block.height >= knownTipHeight;

        function refreshDate() {
          date.textContent = formatDateAndAge(current.timestamp);
          dateTimer = setTimeout(refreshDate, 60_000);
        }

        /** @param {any} block */
        function update(block) {
          clear();
          current = block;
          header.hidden = false;
          title.replaceChildren(...blockTitle(block.height));
          renderAmount(price, usdParts(block.extras.price));
          const firstDigit = block.id.search(/[^0]/);
          hash.replaceChildren(dim(block.id.slice(0, firstDigit)), block.id.slice(firstDigit));
          hash.title = block.id;
          date.dateTime = new Date(block.timestamp * 1_000).toISOString();
          refreshDate();
          setStep(newer, block.height + 1, atTip(block));
          setStep(older, block.height - 1, block.height === 0);

          const preview = createPreviewPane(block);
          const fees = createFeeChart(block.extras.feeRange, block.extras.avgFeeRate);
          const section = (group, ...children) => el("section", { "data-group": group }, ...children);

          destroyers.push(preview.destroy, fees.destroy);
          content.append(
            el("div", { "data-block-column": "main" }, section("preview", createMeta(block), preview.element)),
            el(
              "div",
              { "data-block-column": "side" },
              section("mining", createMinerPane(block)),
              section("rewards", createRewardsPane(block.extras)),
              section("difficulty", createDifficultyPane(block)),
              section("fees", fees.element),
            ),
          );
          activatePending = () => {
            const xray = createXrayPane(preview.load(), element);
            destroyers.push(xray.destroy);
            content.append(xray.element);
          };
        }

        /** @param {string} message */
        function showMissing(message) {
          clear();
          current = null;
          header.hidden = true;
          content.append(el("p", { "data-block-missing": true }, message));
        }

        return {
          element,
          update,
          showMissing,
          isShowing: (block) => current?.id === block.id,
          /** A newer tip enables "newer". */
          refreshSteps() {
            if (current) setStep(newer, current.height + 1, atTip(current));
          },
          /** Heavy parts (heatmap, x-ray) start once the details are in place. */
          activate() {
            activatePending?.();
            activatePending = null;
          },
          step(direction) {
            const link = direction === "newer" ? newer : older;
            if (link.hasAttribute("href")) navigate(link.getAttribute("href").slice(1));
          },
        };
      }

      // Page: the chain beside (or above) the selected block, driven by the URL hash ----------

      const main = /** @type {HTMLElement} */ (document.querySelector("#explore"));
      const status = el("p", { "data-chain-status": true, role: "status", hidden: true });
      const details = createBlockDetails();
      /** Without a block in the URL, the details follow the chain tip. */
      let following = false;
      let routeId = 0;
      const chain = createChain({
        status,
        onTip(block) {
          if (following) showBlock(block);
          else details.refreshSteps();
        },
      });

      chain.element.append(status);
      main.append(chain.element, details.element);

      function syncChain() {
        chain.setActive(!document.hidden);
      }

      /** @param {string} hash "" to follow the tip, else a height or block hash */
      function navigate(hash) {
        const url = hash ? `#${hash}` : `${location.pathname}${location.search}`;
        if (url === `${location.pathname}${location.search}${location.hash}` || url === location.hash) return;
        history.pushState(null, "", url);
        void route();
      }

      /** @returns {number | string | null} */
      function parseTarget(text) {
        let value;
        try {
          value = decodeURIComponent(text).trim().toLowerCase();
        } catch {
          return null;
        }
        if (/^\d+$/.test(value)) return Number(value);
        if (/^[0-9a-f]{64}$/.test(value)) return value;
        return null;
      }

      async function latestBlock() {
        const [block] = await chainApi.tip();
        noteTip(block.height);
        return cacheBlock(block);
      }

      function showBlock(block) {
        chain.select(block.height);
        document.title = `Block ${formatNumber(block.height)} · bitview`;
        if (details.isShowing(block)) return;
        details.update(block);
        details.element.scrollTop = 0;
        details.activate();
      }

      async function route() {
        const id = ++routeId;
        const hash = location.hash.slice(1);
        const target = hash ? parseTarget(hash) : null;

        if (target === null && hash) history.replaceState(null, "", `${location.pathname}${location.search}`);
        following = target === null;

        try {
          const block = following ? await latestBlock() : await resolveBlock(target);
          if (id !== routeId) return;
          chain.focus(following ? null : block.height);
          showBlock(block);
        } catch (error) {
          if (id !== routeId) return;
          console.error("block:", error);
          chain.select(null);
          details.showMissing(error.status === 404 || error.status === 400 ? `No block at ${hash}` : `Couldn't load ${hash ? `block ${hash}` : "the latest block"}`);
          document.title = "Chain · bitview";
        }
      }

      addEventListener("popstate", () => void route());
      addEventListener("hashchange", () => void route());
      document.addEventListener("visibilitychange", syncChain);

      // Jump box and keys ---------------------------------------------------------------

      const jump = /** @type {HTMLFormElement} */ (document.querySelector("#jump"));
      const jumpInput = /** @type {HTMLInputElement} */ (jump.elements.namedItem("block"));

      jump.addEventListener("submit", (event) => {
        event.preventDefault();
        const target = parseTarget(jumpInput.value);
        if (target === null) {
          jumpInput.setAttribute("aria-invalid", "true");
          return;
        }
        jumpInput.value = "";
        jumpInput.blur();
        navigate(String(target));
      });
      jumpInput.addEventListener("input", () => jumpInput.removeAttribute("aria-invalid"));

      document.addEventListener("keydown", (event) => {
        if (event.metaKey || event.ctrlKey || event.altKey || document.querySelector("dialog[open]")) return;

        const typing = event.target instanceof HTMLInputElement;
        if (event.key === "Escape") {
          if (typing) jumpInput.blur();
          else if (!following) navigate("");
          return;
        }
        if (typing) return;

        if (event.key === "/") {
          event.preventDefault();
          jumpInput.focus();
        } else if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          event.preventDefault();
          details.step(event.key === "ArrowLeft" ? "newer" : "older");
        }
      });

      trackPress();
      syncChain();
      void route();
      // The client powers the block details: fetch it while the chain settles.
      setTimeout(() => void loadClient().catch(() => {}), 1_500);
    </script>
  </body>
</html>
