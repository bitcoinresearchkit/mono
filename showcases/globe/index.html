<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Its launch from a home screen, every showcase's. -->
    <script src="/assets/launch/launch.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04060b" />
    <title>Globe · Bitview</title>
    <meta name="description" content="Where Bitcoin's blocks are mined: every block by its mining pool's home country, live on a globe, and how that map has moved since 2011." />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png" />
    <style>
      @font-face {
        font-family: Inter;
        src: url("/assets/fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }

      @font-face {
        font-family: Lilex;
        src: url("/assets/fonts/Lilex.woff2") format("woff2");
        font-weight: 500 700;
        font-display: swap;
      }

      /* Earth from orbit: one night sky, always; the planet's own blues; readouts as an instrument's. */
      :root {
        color-scheme: dark;
        --app: #04060b;
        --card: rgb(13 19 33 / 0.62);
        --well: rgb(255 255 255 / 0.04);
        --ink: #eef3ff;
        --text: #c6d0e4;
        --soft: #8d99b3;
        --muted: #7d89a3;
        --faint: #5d6984;
        --line: rgb(140 170 255 / 0.1);
        --line-strong: rgb(140 170 255 / 0.18);
        --hover: rgb(140 170 255 / 0.07);
        --focus: rgb(180 200 255 / 0.6);
        --live: #3ccf7c;
        --sheen: inset 0 1px 0 rgb(255 255 255 / 0.05);
        --pop: 0 0 0 1px var(--line-strong), 0 16px 40px -12px rgb(0 0 0 / 0.8);
        --ocean: #0a1426;
        --land: #1c2740;
        --border: rgb(4 6 11 / 0.85);
        --grid: rgb(120 160 255 / 0.07);
        --glow: rgb(70 130 255 / 0.35);
        --sans: Inter, -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
        --mono: Lilex, ui-monospace, "SF Mono", Menlo, monospace;
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        background: radial-gradient(1200px 700px at 30% 30%, rgb(40 70 150 / 0.18), transparent 70%), var(--app);
        background-attachment: fixed;
        font: 15px/1.55 var(--sans);
        font-feature-settings: "cv11", "ss01";
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font: inherit;
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .num {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }

      /* ── Header: the brand and the page's name; the latest block, live ── */

      .top {
        grid-area: top;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 64px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;

        img {
          width: 22px;
          height: 25.5px;
        }
      }

      .crumb {
        color: var(--faint);

        & + span {
          margin-right: auto;
          color: var(--soft);
        }
      }

      .tip-height {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        border-radius: 14px;
        padding: 0 12px;
        color: var(--soft);
        box-shadow: inset 0 0 0 1px var(--line-strong);
        font-size: 13px;

        &[hidden] {
          display: none;
        }

        &::before {
          content: "";
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: var(--live);
          box-shadow: 0 0 0 3px color-mix(in oklab, var(--live), transparent 80%);
        }

        b {
          color: var(--ink);
          font-weight: 500;
        }
      }

      h1 {
        margin: 0;
        color: var(--ink);
        font-size: clamp(36px, 5.6vw, 72px);
        font-weight: 300;
        line-height: 1.02;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }

      .lede {
        max-width: 30em;
        margin: 12px 0 0;
        color: var(--soft);
        font-size: clamp(15px, 1.6vw, 17px);
        text-wrap: pretty;
      }

      .surface {
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: var(--sheen), 0 0 0 1px var(--line);
        backdrop-filter: blur(14px);
      }

      /* ── The hero: the planet across the whole first screen; over it the name, the countries, the latest blocks.
         A phone: one after another, the planet square. ── */

      .hero {
        position: relative;
        display: grid;
        grid-template: "top" "text" "globe" "history" "board" / minmax(0, 1fr);
        gap: 16px;
        padding: 0 16px 24px;

        .hero-text {
          grid-area: text;
        }

        .board {
          grid-area: board;
        }

        .history {
          grid-area: history;
        }

        > canvas {
          grid-area: globe;
          display: block;
          width: 100%;
          aspect-ratio: 1;
          cursor: grab;
          touch-action: pan-y;

          &.dragging {
            cursor: grabbing;
          }
        }

        @media (min-width: 1024px) {
          height: max(680px, 100svh);
          grid-template: "top top" 64px "text board" auto ". board" minmax(0, 1fr) "history board" auto / minmax(0, 1fr) 360px;
          gap: 0 32px;
          padding: 0 32px 24px;

          > canvas {
            position: absolute;
            inset: 0;
            grid-area: auto;
            height: 100%;
            aspect-ratio: auto;
          }

          /* (Over the planet: the words let a drag through; the countries and blocks don't.) */
          > :not(canvas) {
            position: relative;
          }

          .hero-text {
            align-self: start;
            max-width: min(30rem, 42vw);

            /* (The title in its column's measure: two lines, the planet's middle clear of it.) */
            h1 {
              font-size: clamp(40px, 4.6vw, 72px);
            }
            padding-top: 40px;
            pointer-events: none;
            /* (Where the words cross the planet, a halo of the night keeps them read.) */
            text-shadow: 0 0 2px var(--app), 0 0 12px var(--app), 0 0 24px var(--app);
          }

          .board {
            align-self: start;
            max-height: calc(100% - 24px);
            margin-top: 24px;
            overflow-y: auto;
          }

          .history {
            margin-top: 0;

            .area {
              aspect-ratio: auto;
              height: clamp(64px, 11vh, 112px);
            }
          }

        }
      }

      .board {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 16px;
      }

      .board-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px 16px;
      }

      /* (An instrument's readouts: small, spaced capitals.) */
      .when,
      .kicker {
        color: var(--soft);
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .total {
        color: var(--muted);
        font-size: 13px;
      }

      .periods {
        display: flex;
        gap: 2px;
        margin: 12px 0 8px;
        border-radius: 8px;
        padding: 2px;
        background: var(--well);
        box-shadow: inset 0 0 0 1px var(--line);

        button {
          flex: 1;
          border: 0;
          border-radius: 6px;
          padding: 5px 0;
          color: var(--soft);
          background: none;
          font-size: 13px;
          cursor: pointer;

          &:hover {
            color: var(--ink);
          }

          &[aria-pressed="true"] {
            color: var(--ink);
            background: var(--card);
            box-shadow: 0 0 0 1px var(--line-strong), 0 1px 2px rgb(0 0 0 / 0.3);
          }
        }
      }

      .countries {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .country {
        border-top: 1px solid var(--line);

        &:first-child {
          border-top: 0;
        }

        > button {
          display: grid;
          grid-template-columns: 10px minmax(0, 1fr) auto auto;
          gap: 2px 10px;
          align-items: center;
          width: 100%;
          border: 0;
          border-radius: 8px;
          padding: 9px 6px;
          text-align: left;
          background: none;
          cursor: pointer;

          &:hover {
            background: var(--hover);
          }
        }

        &.active > button {
          background: var(--hover);
          box-shadow: inset 0 0 0 1px var(--line-strong);
        }

        .swatch {
          width: 10px;
          height: 10px;
          border-radius: 3px;
          background: var(--color);
        }

        .name {
          overflow: hidden;
          color: var(--ink);
          font-weight: 500;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .count {
          color: var(--muted);
          font-size: 13px;
        }

        /* (Its hashrate, as its share of the network's says.) */
        .rate {
          margin-left: 8px;
          color: var(--muted);
          font-size: 11px;
          font-weight: 400;
        }

        .share {
          min-width: 4.5ch;
          color: var(--ink);
          font-size: 13px;
          text-align: right;
        }

        .bar {
          grid-column: 2 / -1;
          height: 3px;
          border-radius: 2px;
          background: linear-gradient(90deg, var(--color) var(--share), var(--line) var(--share));
        }

        .pools {
          margin: 0 0 8px 26px;
          padding: 0;
          color: var(--soft);
          font-size: 13px;
          list-style: none;

          li {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 2px 6px 2px 0;
          }
        }
      }

      /* ── History: each country's share by month, a cursor to read one ── */

      /* The history's notes: a word above the month each happened, a line down to it (on two rows, so near ones don't meet). */
      /* (Each label on a row, and to a side of its line: --anchor 0 starts at it, 0.5 centers on it, 1 ends at it.) */
      .events {
        position: relative;
        height: calc(26px + var(--top, 1) * 18px);
        margin-top: 12px;
        color: var(--soft);
        font-size: 11px;

        span {
          position: absolute;
          bottom: calc(6px + var(--row, 0) * 18px);
          translate: calc(var(--anchor, 0.5) * -100%) 0;
          white-space: nowrap;

          &::after {
            content: "";
            position: absolute;
            top: 100%;
            left: calc(var(--anchor, 0.5) * 100%);
            height: calc(6px + var(--row, 0) * 18px);
            border-left: 1px dashed var(--soft);
          }
        }
      }

      .kicker {
        margin: 0 0 8px;
      }


      .history {
        min-width: 0;
        padding: 14px 16px 10px;
      }

      .history-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;

        .kicker {
          margin: 0;
          font-weight: 400;
        }

        /* (Beside the title where there's room for it, else its own row.) */
        .legend {
          flex: 1 1 24rem;
        }
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin: 0;
        padding: 0;
        color: var(--soft);
        font-size: 12px;
        list-style: none;

        li {
          display: flex;
          align-items: center;
          gap: 6px;

          &::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 2px;
            background: var(--color);
          }
        }
      }

      .play {
        border: 0;
        border-radius: 8px;
        padding: 5px 12px;
        background: var(--well);
        box-shadow: inset 0 0 0 1px var(--line-strong);
        font-size: 13px;
        cursor: pointer;

        &:hover:not(:disabled) {
          background: var(--hover);
        }

        /* (Nothing to play yet.) */
        &:disabled {
          opacity: 0.45;
          cursor: default;
        }
      }

      .area {
        position: relative;
        aspect-ratio: 4;
        margin-top: 14px;
        touch-action: pan-y;
        cursor: crosshair;

        @media (max-width: 600px) {
          aspect-ratio: 2;
        }

        svg {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          border-radius: 6px;
        }

        .cursor {
          position: absolute;
          top: -4px;
          bottom: -4px;
          border-left: 2px solid var(--ink);
          pointer-events: none;

          &[hidden] {
            display: none;
          }
        }
      }

      .years {
        position: relative;
        height: 18px;
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;

        span {
          position: absolute;
          translate: -50% 0;
        }
      }

      /* ── The latest blocks ── */

      /* The latest blocks: a strip along the planet's foot (two rows of two, on a phone). */
      .ticker {
        display: grid;
        gap: 8px;
        margin-top: 18px;
      }

      .latest {
        display: grid;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;

        /* (A block a row: its pool and home on the left, its height and age on the right; the four newest.) */
        li:nth-child(n + 5) {
          display: none;
        }

        li {
          display: grid;
          grid-template-columns: 10px minmax(0, 1fr) auto;
          gap: 2px 10px;
          align-items: center;
          border-radius: 10px;
          padding: 8px 12px;
          background: var(--well);
          box-shadow: 0 0 0 1px var(--line);
          font-size: 13px;

          /* (A block new to the list, arriving.) */
          &.new {
            animation: arrive 0.6s cubic-bezier(0.2, 0.7, 0.2, 1);
          }
        }

        .swatch {
          width: 10px;
          height: 10px;
          border-radius: 3px;
          background: var(--color);
        }

        b {
          overflow: hidden;
          color: var(--ink);
          font-weight: 500;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .meta {
          grid-column: 2;
          overflow: hidden;
          color: var(--muted);
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        /* (The height above the age, at the right.) */
        .stamp {
          display: flex;
          grid-column: 3;
          grid-row: 1 / span 2;
          flex-direction: column;
          align-items: flex-end;
          row-gap: 2px;
        }
      }

      /* (What's said of new blocks: to a screen reader only.) */
      .said {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          translate: 0 6px;
        }
      }

      .float {
        position: fixed;
        z-index: 10;
        max-width: 260px;
        border-radius: 10px;
        padding: 10px 12px;
        background: var(--card);
        box-shadow: var(--pop);
        font-size: 13px;
        pointer-events: none;

        &[hidden] {
          display: none;
        }

        b {
          display: block;
          color: var(--ink);
          font-weight: 600;
        }
      }

      .message {
        padding: 48px 16px;
        color: var(--soft);
        text-align: center;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- The planet: the whole first screen; over it, the page's name, the countries, the latest blocks. -->
      <section class="hero" aria-labelledby="title">
        <canvas id="globe" role="img" aria-label="A globe, each country shaded by its share of the blocks; the list of countries has the same."></canvas>
        <header class="top">
          <a class="brand" href="/"><img src="/assets/logo/logo.svg" alt="" />Bitview</a>
          <span class="crumb" aria-hidden="true">/</span>
          <span>Globe</span>
          <span class="tip-height" id="tip" hidden>Block <b class="num" id="tip-height"></b></span>
        </header>
        <div class="hero-text">
          <p class="kicker">Bitcoin, from orbit</p>
          <h1 id="title">Where blocks are mined</h1>
          <p class="lede">
            Every block by where its mining pool is based: the pool's home, not where its machines run, which no one can
            see from the chain.
          </p>
        </div>
        <div class="board surface">
          <div class="board-head">
            <span class="when" id="when"></span>
            <span class="total num" id="total"></span>
          </div>
          <div class="periods" role="group" aria-label="Over" id="periods"></div>
          <ol class="countries" id="countries" aria-label="Countries by blocks"></ol>
          <div class="ticker">
            <span class="kicker" id="latest-title">Latest blocks</span>
            <ol class="latest" id="latest" aria-labelledby="latest-title"></ol>
            <p class="said" id="said" role="status"></p>
          </div>
        </div>
        <!-- Time, along the planet's foot: each country's share month by month since 2011; drag along it, the globe goes too. -->
        <section class="history surface" id="history" aria-labelledby="history-title">
          <div class="history-head">
            <h2 class="kicker" id="history-title">Since 2011, month by month</h2>
            <ul class="legend" id="legend"></ul>
            <button type="button" class="play" id="play" disabled>Play</button>
          </div>
          <div class="events" id="events" aria-hidden="true"></div>
          <div class="message" id="history-message">Loading…</div>
          <div class="area" id="area" hidden></div>
          <div class="years" id="years" aria-hidden="true"></div>
        </section>
      </section>
    </main>
    <div class="float" id="float" hidden aria-hidden="true"></div>
    <script type="module">
      // @ts-check
      // Where blocks are mined: each pool's home country (researched below), every block counted there; over a period, or
      // month by month since 2011; live as blocks are found. All from the server that serves the page, but the map
      // (world-atlas, kept beside the page).
      const $ = (/** @type {string} */ id) => /** @type {HTMLElement} */ (document.getElementById(id));
      const reduced = matchMedia("(prefers-reduced-motion: reduce)");
      const grouped = (/** @type {number} */ n) => n.toLocaleString("en-US");
      const percent = (/** @type {number} */ share) => (share > 0 && share < 0.001 ? "<0.1%" : `${(share * 100).toFixed(share >= 0.1 ? 0 : 1)}%`);
      const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const canvas = /** @type {HTMLCanvasElement} */ ($("globe"));
      const ctx = /** @type {CanvasRenderingContext2D} */ (canvas.getContext("2d"));

      // Countries that host at least one known pool. `at` is [lon, lat] of the
      // marker; `id` is the ISO 3166-1 numeric code used by world-atlas.
      const COUNTRIES = {
        US: { id: "840", name: "United States", at: [-98.5, 39.5] },
        CN: { id: "156", name: "China", at: [104, 35] },
        CA: { id: "124", name: "Canada", at: [-106, 56] },
        JP: { id: "392", name: "Japan", at: [138.3, 36.2] },
        IN: { id: "356", name: "India", at: [79, 22] },
        NO: { id: "578", name: "Norway", at: [9, 61] },
        RU: { id: "643", name: "Russia", at: [90, 60] },
        AU: { id: "036", name: "Australia", at: [134, -25] },
        GB: { id: "826", name: "United Kingdom", at: [-2, 54] },
        PL: { id: "616", name: "Poland", at: [19.4, 52] },
        SE: { id: "752", name: "Sweden", at: [15, 62] },
        DE: { id: "276", name: "Germany", at: [10.4, 51.1] },
        CZ: { id: "203", name: "Czechia", at: [15.5, 49.8] },
        SI: { id: "705", name: "Slovenia", at: [14.8, 46.1] },
        NL: { id: "528", name: "Netherlands", at: [5.3, 52.2] },
        UA: { id: "804", name: "Ukraine", at: [31, 49] },
        AE: { id: "784", name: "United Arab Emirates", at: [54, 24] },
        SG: { id: "702", name: "Singapore", at: [103.82, 1.35] },
        SC: { id: "690", name: "Seychelles", at: [55.49, -4.68] },
        HK: { id: "344", name: "Hong Kong", at: [114.17, 22.32] },
        LT: { id: "440", name: "Lithuania", at: [23.9, 55.3] },
        NZ: { id: "554", name: "New Zealand", at: [172.5, -41.5] },
      };

      // Where each pool is run from, by Bitview pool slug. That's the operating
      // headquarters, not the legal domicile: many pools sit in Singapore, Hong
      // Kong, Cayman or Seychelles shells while being run elsewhere; those only
      // decide when nothing else is known. Pools missing here (and `unknown`)
      // are shown as the moon, e.g. Binance Pool, whose parent says it has no
      // headquarters, and pools with no public operator information.
      const HEADQUARTERS = {
        US: `foundryusa marapool luxor ocean titan blockfills btcguild eligius eclipsemc
             coinlab cointerra 21inc cloudhashing eobot simplecoinus shawnp0wers wk057
             futurebitapollosolo portlandhodl
             bitclub megabigpower hhtt telco214`, // BitClub: US operators (DOJ); MegaBigPower: Washington state; HHTT: run by fireduck; Telco 214: US telecom
        // AntPool is legally Singaporean, SpiderPool Caymanian; both are run from Beijing.
        CN: `antpool f2pool viabtc spiderpool poolin btccom huobipool okexpool okpooltop
             okminer 1thash btctop 175btc asicminer btcc bwpool exxbw 8baochi tbdice
             hotpool 1hash bixin connectbtc batpool btpool 58coin haozhuzhu 7pool dpool
             rawpool haominer tangpool bytepool novablock lubiancom aaopool purebtccom
             wayicn canoepool canoe okkong
             secpool`, // SECPOOL: inferred. Chinese-first site, AntPool templates and custody (b10c, TheMinerMag); its app is sold by "Fair Mine Hub Limited"
        CA: "bitfarms terrapool", // Terra Pool: run by DMG Blockchain Solutions (Vancouver) with Argo
        JP: "sbicrypto bitcoincom", // Bitcoin.com was run from Tokyo while its pool mined (2016–2019)
        IN: "gbminers bitcoinindia bitcoinindiapool",
        NO: "bitminter",
        RU: "bitcoinrussia 50btc sigmapoolcom innopolistech",
        AU: "ozcoin ckpool solock kanopool digitalbtc digitalxmintsy", // ckpool and KanoPool: the Australian cgminer developers
        GB: "ghashio pegapool", // GHash.IO: CEX.IO, London; PEGA Pool: PEGA Mining Ltd
        PL: "polmine",
        SE: "kncminer gogreenlight", // GoGreenLight: Uppsala, bought KnCMiner's hardware
        DE: "bitalo",
        CZ: "braiinspool braiinssolo",

      /** The history, again if it fails (the rest of the page goes on without it). */
      async function showHistory(/** @type {{ slug: string, blockCount: number }[]} */ allTime) {
        $("history-message").textContent = "Loading…";
        try {
          history = await loadHistory(allTime);
          drawHistory();
        } catch (error) {
          const retry = Object.assign(document.createElement("button"), { type: "button", className: "play", textContent: "Try again" });
          retry.addEventListener("click", () => showHistory(allTime));
          $("history-message").replaceChildren(Object.assign(document.createElement("p"), { textContent: /** @type {Error} */ (error).message }), retry);
        }
      }

      // ── The latest blocks, live ──
      /** The last block shown (the series'), the chain's tip as seen (its height and hash), and whether a reorganization's
       * blocks are being read again. */
      let tip = 0, seen = 0, tipHash = "", rereading = false;
      /** @type {{ height: number, pool: string, time: number }[]} */
      let latest = [];
      async function blocks(/** @type {number} */ start, /** @type {number} */ end) {
        const [pools, times] = await json(`/api/series/bulk?${new URLSearchParams({ series: "block_pool,timestamp", index: "height", start: String(start), end: String(end) })}`);
        return pools.data.map((pool, i) => ({ height: pools.start + i, pool, time: times.data[i] }));
      }
      const ago = (/** @type {number} */ time) => {
        const minutes = Math.max(0, Math.round((Date.now() / 1000 - time) / 60));
        return minutes < 1 ? "just now" : minutes < 60 ? `${minutes} min ago` : `${Math.round(minutes / 60)} h ago`;
      };
      /** A block's height and age, each whole. */
      function stamp(/** @type {{ height: number, time: number }} */ block) {
        const line = Object.assign(document.createElement("span"), { className: "meta num stamp" });
        line.append(...[`#${grouped(block.height)}`, ago(block.time)].map((text) => Object.assign(document.createElement("span"), { textContent: text })));
        return line;
      }
      let shownLatest = new Set();
      function drawLatest() {
        const before = shownLatest;
        shownLatest = new Set(latest.map((block) => block.height));
        $("latest").replaceChildren(...latest.map((block) => {
          const cc = POOL_COUNTRY.get(block.pool) ?? null, item = Object.assign(document.createElement("li"), { className: before.size && !before.has(block.height) ? "new" : "" });
          item.style.setProperty("--color", colorOf(cc));
          item.append(
            Object.assign(document.createElement("span"), { className: "swatch" }),
            Object.assign(document.createElement("b"), { textContent: names.get(block.pool) ?? block.pool }),
            Object.assign(document.createElement("span"), { className: "meta", textContent: cc ? COUNTRIES[cc].name : "No known home" }),
            stamp(block),
          );
          return item;
        }));
      }
      let polling = false;
      async function poll() {
        if (polling) return;
        polling = true;
        try {
          // (The sun and the night move on, a little each poll, whatever else does.)
          invalidate();
          // (The tip by its hash: a new block, or another at the same height or lower (a reorganization), both change it.
          // What the chain's tip is (`seen`) and the last block the series gave (`tip`) apart: the series can lag.)
          const hash = await fetch("/api/blocks/tip/hash").then((response) => (response.ok ? response.text() : Promise.reject()));
          if (hash !== tipHash) {
            const height = Number(await fetch("/api/blocks/tip/height").then((response) => (response.ok ? response.text() : Promise.reject())));
            if (!Number.isFinite(height)) return;
            const first = !seen;
            if (seen && height <= seen) rereading = true;
            [seen, tipHash] = [height, hash];
            $("tip-height").textContent = grouped(height);
            $("tip").hidden = false;
            // (A new tip: every period's counts are old; the one shown asked for again, as a pick would, its answer or its
            // failure said; not waited for, so a slow answer never holds up the next poll.)
            if (!first) {
              forgetPeriods();
              if (month === null) setPeriod(period);
            }
          }
          if (tip >= seen && !rereading) return drawLatest();
          // (The blocks since the last one shown; after a reorganization, the last six again, until the series has the tip.)
          const before = tip, fresh = (await blocks(rereading || !tip ? seen - 5 : tip + 1, seen + 1)).reverse();
          if (!fresh.length) return;
          tip = fresh[0].height;
          latest = (rereading ? fresh : [...fresh, ...latest.filter((block) => block.height < fresh[fresh.length - 1].height)]).slice(0, 6);
          drawLatest();
          if (before > 0 && !rereading && fresh.length <= 3) {
            for (const block of fresh) {
              const cc = POOL_COUNTRY.get(block.pool);
              if (cc && !reduced.matches) pulses.push({ at: COUNTRIES[cc].at, t0: performance.now(), color: colorOf(cc) });
            }
            // (Said once, as it arrives.)
            $("said").textContent = fresh.map((block) => `Block ${grouped(block.height)}: ${names.get(block.pool) ?? block.pool}, ${POOL_COUNTRY.has(block.pool) ? COUNTRIES[/** @type {string} */ (POOL_COUNTRY.get(block.pool))].name : "no known home"}`).join(". ");
          }
          if (rereading && tip === seen) rereading = false;
          invalidate();
        } catch {
        } finally {
          polling = false;
        }
      }

      // ── Start ──
      async function start() {
        readInks();
        resize();
        const [topology, allTime] = await Promise.all([json("/modules/world-atlas/2.0.2/countries-110m.json"), json("/api/v1/mining/pools/all")]);
        const atlas = decodeTopology(topology);
        features = atlas.geometries("countries").map((geometry) => ({ geometry, cc: CC_BY_ID.get(geometry.id) }));
        borders = atlas.shared("countries");
        for (const pool of allTime.pools) names.set(pool.slug, pool.name);
        // (Colors by blocks ever found: the most, the first.)
        tally(allTime.pools.map((/** @type {any} */ pool) => ({ slug: pool.slug, count: pool.blockCount })), allTime.blockCount)
          .filter((row) => row.cc).slice(0, PALETTE.length).forEach((row, i) => colors.set(row.cc, PALETTE[i]));
        invalidate();
        await setPeriod(period);
        poll();
        setInterval(poll, 20_000);
        showHistory(allTime.pools);
      }
      /** The start, again if it fails (offered beside the message). */
      function begin() {
        $("countries").replaceChildren();
        start().catch((error) => {
          $("countries").replaceChildren(failure(error, begin));
          $("history-message").textContent = "Shown once the page has loaded.";
        });
      }
      begin();
    </script>
  </body>
</html>
