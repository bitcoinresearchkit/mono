<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Its launch from a home screen, every showcase's. -->
    <script src="/assets/launch/launch.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f2ec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0c0b" />
    <title>Globe · Bitview</title>
    <meta name="description" content="Where Bitcoin's blocks are mined: every block by its mining pool's home country, live on a globe, and how that map has moved since 2011." />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <style>
      @font-face {
        font-family: Lilex;
        src: url("/assets/fonts/Lilex.woff2") format("woff2");
        font-weight: 400 700;
        font-display: swap;
      }

      /* The planet as a print: land a field of fine dots in the ink, the countries that mine lit in Bitview's orange as
         strong as their share, the night a little darker; everything else type and hairlines, as the Oracle's. */
      :root {
        color-scheme: light dark;
        --app: light-dark(#f3f2ec, #0a0c0b);
        --plate: light-dark(#f8f7f2, #0e1110);
        --ink: light-dark(#151916, #e3e8e4);
        --text: light-dark(#2f3631, #b9c2bc);
        --soft: light-dark(#454d47, #a3ada6);
        --faint: light-dark(#5f6862, #7b8580);
        --line: light-dark(rgb(21 25 22 / 0.15), rgb(227 232 228 / 0.13));
        --grid: light-dark(rgb(21 25 22 / 0.07), rgb(227 232 228 / 0.06));
        --focus: light-dark(rgb(21 25 22 / 0.6), rgb(227 232 228 / 0.6));
        --answer: light-dark(rgb(206 82 16), rgb(255 128 52));
        --mono: Lilex, ui-monospace, "SF Mono", Menlo, monospace;
        --gutter: max(20px, env(safe-area-inset-left));
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        background: var(--app);
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        color: var(--text);
        background: var(--app);
        font: 450 14px/1.7 var(--mono);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font: inherit;
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .num {
        font-variant-numeric: tabular-nums;
      }

      /* An instrument's labels: small, spaced capitals. */
      .kicker,
      .when {
        margin: 0;
        color: var(--faint);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* ── One screen of data: the planet and under it the months since 2011; the countries and the latest blocks beside ── */
      .app {
        display: grid;
        grid-template: "top" "globe" "board" "history" / minmax(0, 1fr);
        gap: 20px;
        padding: 0 var(--gutter) 40px;

        > canvas {
          grid-area: globe;
          display: block;
          width: 100%;
          aspect-ratio: 1;
          cursor: grab;
          touch-action: pan-y;

          &.dragging {
            cursor: grabbing;
          }
        }

        @media (min-width: 1024px) {
          height: max(720px, 100svh);
          grid-template: "top top" 64px "globe board" minmax(0, 1fr) "history board" auto / minmax(0, 1fr) 340px;
          gap: 0 48px;
          padding: 0 clamp(24px, 3vw, 48px) 24px;

          > canvas {
            height: 100%;
            min-height: 0;
            aspect-ratio: auto;
            /* (The planet runs past its box: its top and bottom fade into the page.) */
            mask-image: linear-gradient(transparent, #000 12%, #000 86%, transparent);
          }

          .board {
            min-height: 0;
            overflow-y: auto;
            scrollbar-width: none;
          }
        }
      }

      .top {
        grid-area: top;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 64px;
        font-size: 13px;

        .brand {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          color: var(--ink);
          font-weight: 600;

          img {
            width: 22px;
            height: 22px;
          }
        }


      }

      /* The latest block, live: a dot that breathes beside its height. */
      .tip-height {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        color: var(--faint);

        &::before {
          content: "";
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: var(--answer);
          animation: breathe 2.8s ease-in-out infinite;

          @media (prefers-reduced-motion: reduce) {
            animation: none;
          }
        }

        b {
          color: var(--ink);
          font-weight: 500;
        }
      }

      .tip-height[hidden] {
        display: none;
      }

      @keyframes breathe {
        50% {
          opacity: 0.35;
        }
      }

      /* (The page's name, read aloud only: the data is the page.) */
      h1 {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .note {
        margin: 10px 0 0;
        color: var(--faint);
        font-size: 11px;
      }

      /* ── The board: the period or the month, its countries by blocks, then the latest blocks ── */
      .board {
        grid-area: board;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .board-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;

        .total {
          color: var(--faint);
          font-size: 12px;
        }
      }

      .periods {
        display: flex;
        margin: 12px 0 6px;
        border: 1px solid var(--line);

        button {
          flex: 1;
          height: 32px;
          border: 0;
          color: var(--faint);
          background: none;
          font-size: 12px;
          cursor: pointer;
          touch-action: manipulation;

          + button {
            border-left: 1px solid var(--line);
          }

          &:hover {
            color: var(--ink);
          }

          &[aria-pressed="true"] {
            color: var(--app);
            background: var(--ink);
          }
        }
      }

      .countries {
        margin: 0;
        padding: 0;
        list-style: none;

        /* (On a phone, five rows' height, the rest scrolled to: a period or a month with more or fewer countries never
           moves what's under it.) */
        @media (max-width: 1023px) {
          height: calc(5 * 59px);
          overflow-y: auto;
          overscroll-behavior: contain;
        }
      }

      /* A country: its name, its blocks, its share; under them its share as a hairline, in the answer's orange. */
      .country {
        border-bottom: 1px solid var(--line);

        > button {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto auto;
          align-content: center;
          align-items: baseline;
          gap: 2px 14px;
          width: 100%;
          height: 58px;
          border: 0;
          padding: 0;
          background: none;
          text-align: left;
          cursor: pointer;
        }

        .name {
          overflow: hidden;
          color: var(--ink);
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .rate {
          margin-left: 8px;
          color: var(--faint);
          font-size: 11px;
        }

        .count {
          color: var(--faint);
          font-size: 12px;
        }

        .share {
          min-width: 4.5ch;
          color: var(--ink);
          font-size: 18px;
          font-weight: 500;
          letter-spacing: -0.03em;
          text-align: right;
        }

        .swatch {
          display: none;
        }

        .bar {
          grid-column: 1 / -1;
          height: 2px;
          margin-top: 6px;
          background: linear-gradient(var(--color), var(--color)) 0 0 / var(--share) 100% no-repeat, var(--grid);
        }

        > button:hover .name,
        &.active .name {
          color: var(--answer);
        }
      }

      /* The pools behind a country, opened. */
      .pools {
        margin: -2px 0 10px;
        padding: 0;
        color: var(--soft);
        font-size: 12px;
        list-style: none;

        li {
          display: flex;
          justify-content: space-between;
          gap: 12px;
          padding: 2px 0;
        }

        .num {
          color: var(--faint);
        }
      }

      /* The latest blocks: a row each, the pool and its home, the height and how long ago. */
      .ticker {
        display: grid;
        gap: 8px;
        margin-top: 28px;
      }

      .latest {
        margin: 0;
        padding: 0;
        list-style: none;

        li {
          display: grid;
          grid-template-columns: 8px minmax(0, 1fr) auto;
          gap: 0 12px;
          align-items: baseline;
          border-top: 1px solid var(--line);
          padding: 9px 0;
          font-size: 13px;

          /* (A block new to the list, arriving.) */
          &.new {
            animation: arrive 0.6s cubic-bezier(0.2, 0.7, 0.2, 1);
          }

          &:nth-child(n + 5) {
            display: none;
          }
        }

        .swatch {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: var(--color);
          translate: 0 -1px;
        }

        b {
          overflow: hidden;
          color: var(--ink);
          font-weight: 500;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .meta {
          grid-column: 2;
          overflow: hidden;
          color: var(--faint);
          font-size: 12px;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        /* (The height above the age, at the right.) */
        .stamp {
          display: flex;
          grid-column: 3;
          grid-row: 1 / span 2;
          flex-direction: column;
          align-items: flex-end;
          color: var(--faint);
          font-size: 12px;
        }
      }

      @keyframes arrive {
        from {
          opacity: 0;
          translate: 0 6px;
        }
      }

      /* (What's said of new blocks: to a screen reader only.) */
      .said {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* ── How it moved: each country's share month by month since 2011, a row each, one month read across them ── */
      .history {
        grid-area: history;
        min-width: 0;
        padding-top: 16px;
        /* (A row: its name, its plot, its share in the month read; the events and years over the plots' column.) */
        --name: 8.5rem;
        --value: 3.5rem;
        --gap: 12px;
        /* (A row's plot: the rows, nine always, take their height before they load, so nothing moves when they do.) */
        --plot: clamp(22px, 3.2vh, 30px);

        /* (On a phone: narrower names, no event labels (each row shows them), every fourth year.) */
        @media (max-width: 640px) {
          --name: 6.5rem;
          --value: 2.75rem;
          --gap: 8px;

          .events {
            display: none;
          }

          .years span:nth-child(even) {
            display: none;
          }

          .area .row {
            font-size: 11px;
          }
        }
      }

      .history-head {
        display: flex;
        align-items: center;
        gap: 12px 16px;

        h2 {
          flex: 1;
          min-width: 0;
        }

        /* (As wide as the longest month, so reading one never moves the row.) */
        output {
          min-width: 14ch;
          color: var(--ink);
          font-size: 13px;
          text-align: right;
          white-space: nowrap;
        }
      }

      .play {
        height: 28px;
        border: 1px solid var(--line);
        padding: 0 12px;
        background: none;
        font-size: 12px;
        cursor: pointer;
        touch-action: manipulation;

        &:hover:not(:disabled) {
          border-color: var(--soft);
        }

        /* (Nothing to play yet.) */
        &:disabled {
          opacity: 0.35;
          cursor: default;
        }
      }

      /* (The rows' height, fixed: nine rows always, loading or loaded.) */
      .history :is(.message, .area) {
        height: calc(9 * (var(--plot) + 1px));
        margin: 0;
      }

      .message {
        margin-top: 24px;
        color: var(--faint);

        p {
          margin: 0 0 10px;
        }
      }

      /* The events that moved the map: a word above the month each happened, a line down to it. */
      /* (Each label on a row, and to a side of its line: --anchor 0 starts at it, 0.5 centers on it, 1 ends at it.) */
      .events {
        position: relative;
        height: calc(22px + var(--top, 1) * 16px);
        margin: 4px calc(var(--value) + var(--gap)) 0 calc(var(--name) + var(--gap));
        color: var(--faint);
        font-size: 11px;

        span {
          position: absolute;
          bottom: calc(4px + var(--row, 0) * 16px);
          translate: calc(var(--anchor, 0.5) * -100%) 0;
          white-space: nowrap;

          &::after {
            content: "";
            position: absolute;
            top: 100%;
            left: calc(var(--anchor, 0.5) * 100%);
            height: calc(4px + var(--row, 0) * 16px);
            border-left: 1px dotted var(--faint);
          }
        }
      }

      /* The rows: a country's name, its share since 2011 (the same scale for all), its share in the month read. */
      .area {
        position: relative;
        display: grid;
        touch-action: pan-y;
        cursor: crosshair;

        .row {
          display: grid;
          grid-template-columns: var(--name) minmax(0, 1fr) var(--value);
          align-items: end;
          gap: var(--gap);
          border-top: 1px solid var(--line);
          font-size: 12px;
        }

        .row > span {
          overflow: hidden;
          padding-bottom: 3px;
          color: var(--soft);
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .row > b {
          padding-bottom: 3px;
          color: var(--ink);
          font-weight: 500;
          text-align: right;
        }

        svg {
          display: block;
          width: 100%;
          height: var(--plot);
          padding-top: 3px;
        }

        .fill {
          fill: var(--ink);
          fill-opacity: 0.12;
        }

        .line {
          fill: none;
          stroke: var(--ink);
          stroke-width: 1.2;
          stroke-opacity: 0.7;
          vector-effect: non-scaling-stroke;
        }

        /* (The month read, across the plots' column.) */
        .cursor {
          position: absolute;
          top: 0;
          bottom: 0;
          left: calc(var(--name) + var(--gap) + (100% - var(--name) - var(--value) - 2 * var(--gap)) * var(--at));
          border-left: 1px solid var(--answer);
          pointer-events: none;

          &[hidden] {
            display: none;
          }
        }
      }

      .years {
        position: relative;
        height: 18px;
        margin: 6px calc(var(--value) + var(--gap)) 0 calc(var(--name) + var(--gap));
        color: var(--faint);
        font-size: 11px;

        span {
          position: absolute;
          translate: -50% 0;
        }
      }

      /* What's under the pointer on the planet. */
      .float {
        position: fixed;
        z-index: 10;
        max-width: 260px;
        border: 1px solid var(--line);
        padding: 8px 10px;
        color: var(--soft);
        background: var(--plate);
        font-size: 12px;
        pointer-events: none;

        b {
          display: block;
          margin-bottom: 2px;
          color: var(--ink);
          font-weight: 500;
        }

        &[hidden] {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- One screen of data: the planet with the period's shares, the countries and the latest blocks beside it, and how
           it moved since 2011 under it. -->
      <section class="app" aria-labelledby="title">
        <header class="top">
          <a class="brand" href="/"><img src="/assets/logo/logo.svg" alt="" />Bitview</a>
          <h1 id="title">Where blocks are mined</h1>
          <span class="tip-height" id="tip" hidden>Block <b class="num" id="tip-height"></b></span>
        </header>
        <canvas id="globe" role="img" aria-label="A globe, each country lit by its share of the blocks; the list of countries has the same."></canvas>
        <div class="board">
          <div class="board-head">
            <span class="when" id="when"></span>
            <span class="total num" id="total"></span>
          </div>
          <div class="periods" role="group" aria-label="Over" id="periods"></div>
          <ol class="countries" id="countries" aria-label="Countries by blocks"></ol>
          <p class="note">By each pool's home, not where its machines run, which the chain doesn't say.</p>
          <div class="ticker">
            <span class="kicker" id="latest-title">Latest blocks</span>
            <ol class="latest" id="latest" aria-labelledby="latest-title"></ol>
            <p class="said" id="said" role="status"></p>
          </div>
        </div>
        <!-- How it moved: each country's share month by month since 2011; read a month across them, the globe goes too. -->
        <section class="history" id="history" aria-labelledby="history-title">
          <div class="history-head">
            <h2 class="kicker" id="history-title">Share of blocks by month, since 2011</h2>
            <output class="num" id="history-when"></output>
            <button type="button" class="play" id="play" disabled>Play</button>
          </div>
          <div class="events" id="events" aria-hidden="true"></div>
          <div class="message" id="history-message">Loading…</div>
          <div class="area" id="area" hidden></div>
          <div class="years" id="years" aria-hidden="true"></div>
        </section>
      </section>
    </main>
    <div class="float" id="float" hidden aria-hidden="true"></div>
    <script type="module">
      // @ts-check
      // Where blocks are mined: each pool's home country (researched below), every block counted there; over a period, or
      // month by month since 2011; live as blocks are found. All from the server that serves the page, but the map
      // (world-atlas, kept beside the page).
      const $ = (/** @type {string} */ id) => /** @type {HTMLElement} */ (document.getElementById(id));
      const reduced = matchMedia("(prefers-reduced-motion: reduce)");
      const grouped = (/** @type {number} */ n) => n.toLocaleString("en-US");
      const percent = (/** @type {number} */ share) => (share > 0 && share < 0.001 ? "<0.1%" : `${(share * 100).toFixed(share >= 0.1 ? 0 : 1)}%`);
      const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const canvas = /** @type {HTMLCanvasElement} */ ($("globe"));
      const ctx = /** @type {CanvasRenderingContext2D} */ (canvas.getContext("2d"));

      // Countries that host at least one known pool. `at` is [lon, lat] of the
      // marker; `id` is the ISO 3166-1 numeric code used by world-atlas.
      const COUNTRIES = {
        US: { id: "840", name: "United States", at: [-98.5, 39.5] },
        CN: { id: "156", name: "China", at: [104, 35] },
        CA: { id: "124", name: "Canada", at: [-106, 56] },
        JP: { id: "392", name: "Japan", at: [138.3, 36.2] },
        IN: { id: "356", name: "India", at: [79, 22] },
        NO: { id: "578", name: "Norway", at: [9, 61] },
        RU: { id: "643", name: "Russia", at: [90, 60] },
        AU: { id: "036", name: "Australia", at: [134, -25] },
        GB: { id: "826", name: "United Kingdom", at: [-2, 54] },
        PL: { id: "616", name: "Poland", at: [19.4, 52] },
        SE: { id: "752", name: "Sweden", at: [15, 62] },
        DE: { id: "276", name: "Germany", at: [10.4, 51.1] },
        CZ: { id: "203", name: "Czechia", at: [15.5, 49.8] },
        SI: { id: "705", name: "Slovenia", at: [14.8, 46.1] },
        NL: { id: "528", name: "Netherlands", at: [5.3, 52.2] },
        UA: { id: "804", name: "Ukraine", at: [31, 49] },
        AE: { id: "784", name: "United Arab Emirates", at: [54, 24] },
        SG: { id: "702", name: "Singapore", at: [103.82, 1.35] },
        SC: { id: "690", name: "Seychelles", at: [55.49, -4.68] },
        HK: { id: "344", name: "Hong Kong", at: [114.17, 22.32] },
        LT: { id: "440", name: "Lithuania", at: [23.9, 55.3] },
        NZ: { id: "554", name: "New Zealand", at: [172.5, -41.5] },
      };

      // Where each pool is run from, by Bitview pool slug. That's the operating
      // headquarters, not the legal domicile: many pools sit in Singapore, Hong
      // Kong, Cayman or Seychelles shells while being run elsewhere; those only
      // decide when nothing else is known. Pools missing here (and `unknown`)
      // are shown as the moon, e.g. Binance Pool, whose parent says it has no
      // headquarters, and pools with no public operator information.
      const HEADQUARTERS = {
        US: `foundryusa marapool luxor ocean titan blockfills btcguild eligius eclipsemc
             coinlab cointerra 21inc cloudhashing eobot simplecoinus shawnp0wers wk057
             futurebitapollosolo portlandhodl
             bitclub megabigpower hhtt telco214`, // BitClub: US operators (DOJ); MegaBigPower: Washington state; HHTT: run by fireduck; Telco 214: US telecom
        // AntPool is legally Singaporean, SpiderPool Caymanian; both are run from Beijing.
        CN: `antpool f2pool viabtc spiderpool poolin btccom huobipool okexpool okpooltop
             okminer 1thash btctop 175btc asicminer btcc bwpool exxbw 8baochi tbdice
             hotpool 1hash bixin connectbtc batpool btpool 58coin haozhuzhu 7pool dpool
             rawpool haominer tangpool bytepool novablock lubiancom aaopool purebtccom
             wayicn canoepool canoe okkong
             secpool`, // SECPOOL: inferred. Chinese-first site, AntPool templates and custody (b10c, TheMinerMag); its app is sold by "Fair Mine Hub Limited"
        CA: "bitfarms terrapool", // Terra Pool: run by DMG Blockchain Solutions (Vancouver) with Argo
        JP: "sbicrypto bitcoincom", // Bitcoin.com was run from Tokyo while its pool mined (2016–2019)
        IN: "gbminers bitcoinindia bitcoinindiapool",
        NO: "bitminter",
        RU: "bitcoinrussia 50btc sigmapoolcom innopolistech",
        AU: "ozcoin ckpool solock kanopool digitalbtc digitalxmintsy", // ckpool and KanoPool: the Australian cgminer developers
        GB: "ghashio pegapool", // GHash.IO: CEX.IO, London; PEGA Pool: PEGA Mining Ltd
        PL: "polmine",
        SE: "kncminer gogreenlight", // GoGreenLight: Uppsala, bought KnCMiner's hardware
        DE: "bitalo",
        CZ: "braiinspool braiinssolo",
        SI: "nicehash", // Maribor
        NL: "bitfury miningdutch",
        UA: "bitcoinukraine",
        LT: "whitepool", // WhiteBIT, which moved its headquarters from Kyiv to Vilnius
        AE: "phoenix",
        SG: "bitfufupool miningsquared", // Mining Squared: B² Network
        HK: "emcdpool", // EMCD states Hong Kong as its headquarters (Russian-founded, Moscow office)

          const [x, y] = toScreen(v), r = size * (0.6 + 0.4 * v[2]) * (share ? 1.25 : 1);

          path.moveTo(x + r, y);
          path.arc(x, y, r, 0, TAU);
        }
        buckets.forEach((path, k) => {
          ctx.globalAlpha = ((k % ALPHAS) + 0.5) / ALPHAS;
          ctx.fillStyle = k < ALPHAS ? ink.ink : ink.answer;
          ctx.fill(path);
        });
        ctx.globalAlpha = 1;
        // The five biggest and the one picked, named beside a mark at their middle.
        // (Every mark first, then the names, each clear of the marks as of the names before it.)
        const named = [...byCountry].sort((a, b) => b[1] - a[1]).flatMap(([cc, share], rank) => {
          const v = view(COUNTRIES[cc].at);
          return v[2] > 0.05 && (rank < 5 || cc === selected) ? [{ cc, share, v, at: toScreen(v) }] : [];
        });
        // (Pointing finds a named one by its mark; the rest, by their shape.)
        marks = named.map(({ cc, at: [x, y] }) => ({ cc, x, y, r: 8 }));
        placed = named.map(({ at: [x, y] }) => [x - 6, y - 6, x + 6, y + 6]);
        for (const { v, at: [x, y] } of named) {
          ctx.globalAlpha = Math.min(1, v[2] * 3);
          ctx.fillStyle = ink.ink;
          ctx.strokeStyle = ink.app;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x, y, 3, 0, TAU);
          ctx.stroke();
          ctx.fill();
        }
        for (const { cc, share, v, at: [x, y] } of named) {
          ctx.globalAlpha = Math.min(1, v[2] * 3);
          label(`${COUNTRIES[cc].name} ${percent(share)}`, x, y, 3);
        }
        ctx.globalAlpha = 1;
        // Blocks landing: a ring that widens and fades.
        for (let i = pulses.length - 1; i >= 0; i--) {
          const pulse = pulses[i], t = (now - pulse.t0) / 1800;
          if (t >= 1) {
            pulses.splice(i, 1);
            continue;
          }
          const v = view(pulse.at);
          if (v[2] <= 0) continue;
          const [x, y] = toScreen(v);
          ctx.globalAlpha = 1 - t;
          ctx.strokeStyle = ink.answer;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(x, y, 6 + 40 * t, 0, TAU);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      // ── Motion: a slow turn, a drag, a flight; drawn only while something moves, and on screen ──
      /** @type {{ from: number[], to: number[], t0: number, dur: number } | null} */
      let flight = null;
      let dragging = /** @type {{ x: number, y: number, rot: number[], moved: boolean } | null} */ (null);
      let last = 0, frameId = 0, onScreen = true;
      const ease = (/** @type {number} */ t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
      /** Whether anything moves of itself: the turn (unless motion's reduced or a country's picked), a flight, a ring. */
      const moving = () => Boolean(flight || pulses.length || (!reduced.matches && !selected && !dragging));
      function invalidate() {
        if (!frameId && onScreen) frameId = requestAnimationFrame(frame);
      }
      function flyTo(/** @type {number[]} */ at) {
        const to = [-at[0], Math.max(-55, Math.min(55, -at[1]))], turn = ((to[0] - rot[0] + 540) % 360) - 180;
        flight = { from: [rot[0], rot[1]], to: [rot[0] + turn, to[1]], t0: performance.now(), dur: reduced.matches ? 0 : Math.min(2000, 600 + Math.hypot(turn, to[1] - rot[1]) * 8) };
        invalidate();
      }
      function frame(/** @type {number} */ now) {
        frameId = 0;
        const dt = Math.min(100, now - (last || now));
        last = now;
        if (flight) {
          const t = flight.dur ? Math.min(1, (now - flight.t0) / flight.dur) : 1, k = ease(t);
          rot[0] = flight.from[0] + (flight.to[0] - flight.from[0]) * k;
          rot[1] = flight.from[1] + (flight.to[1] - flight.from[1]) * k;
          if (t >= 1) flight = null;
        } else if (moving()) {
          rot[0] += dt * 0.004;
        }
        draw(now);
        if (moving()) invalidate();
        else last = 0;
      }
      new IntersectionObserver(([entry]) => {
        onScreen = entry.isIntersecting;
        if (onScreen) invalidate();
      }).observe(canvas);
      reduced.addEventListener("change", invalidate);
      document.addEventListener("visibilitychange", () => (last = 0));

      // Drag to turn; a tap or click (no drag) picks what's under it (a dot, a country, the moon); pointing says what it holds.
      canvas.addEventListener("pointerdown", (event) => {
        dragging = { x: event.clientX, y: event.clientY, rot: [rot[0], rot[1]], moved: false };
        flight = null;
        greeted = true;
      });
      addEventListener("pointermove", (event) => {
        if (dragging) {
          const dx = event.clientX - dragging.x, dy = event.clientY - dragging.y;
          if (Math.hypot(dx, dy) > 4) {
            dragging.moved = true;
            canvas.classList.add("dragging");
          }
          rot[0] = dragging.rot[0] + dx * (90 / R);
          rot[1] = Math.max(-80, Math.min(80, dragging.rot[1] - dy * (90 / R)));
          invalidate();
        } else if (event.target === canvas && event.pointerType === "mouse") showFloat(pickAt(event), event);
      });
      addEventListener("pointerup", (event) => {
        if (dragging && !dragging.moved && event.target === canvas) {
          const key = pickAt(event);
          select(key && key !== selected ? key : null);
        }
        dragging = null;
        canvas.classList.remove("dragging");
        invalidate();
      });
      canvas.addEventListener("pointerleave", () => showFloat(null));
      canvas.addEventListener("pointercancel", () => ((dragging = null), canvas.classList.remove("dragging"), invalidate()));
      /** What's under a pointer: a country by its shape, or a named one's mark (the small ones have no shape on this map). */
      function pickAt(/** @type {PointerEvent} */ event) {
        const box = canvas.getBoundingClientRect(), x = event.clientX - box.left, y = event.clientY - box.top;
        // (The country under it by its shape; else a named one's mark near it, for those too small to have one here.)
        const at = invert(x, y), { byCountry } = shares();
        const shape = at ? features.find((feature) => feature.cc && byCountry.has(feature.cc) && contains(feature.geometry, at))?.cc : undefined;
        return shape ?? marks.find((mark) => Math.hypot(x - mark.x, y - mark.y) <= mark.r)?.cc ?? null;
      }
      function showFloat(/** @type {string | null} */ key, /** @type {PointerEvent | undefined} */ event = undefined) {
        const float = $("float"), row = snapshot?.rows.find((r) => keyOf(r) === key);
        if (!key || !row || !event || !snapshot) return void (float.hidden = true);
        const lines = [`${percent(row.count / snapshot.total)} of the blocks, ${grouped(row.count)}`, row.pools.slice(0, 3).map(({ slug }) => names.get(slug) ?? slug).join(", ")];
        float.replaceChildren(Object.assign(document.createElement("b"), { textContent: row.cc ? COUNTRIES[row.cc].name : "No known home" }), ...lines.map((line) => Object.assign(document.createElement("div"), { textContent: line })));
        float.hidden = false;
        float.style.left = `${Math.min(innerWidth - float.offsetWidth - 8, event.clientX + 14)}px`;
        float.style.top = `${Math.min(innerHeight - float.offsetHeight - 8, event.clientY + 14)}px`;
      }

      // ── History: each country's monthly share, a row each, a cursor on a month read across them, the events that moved it ──
      /** The history's rows as drawn: a name and each month's share. @type {{ name: string, shares: number[] }[]} */
      let historyRows = [];
      function drawHistory() {
        if (!history) return;
        const h = history, n = h.months.length;
        // (A row for each country with the most blocks ever, then the rest of the known together, then the unknown.)
        const counts = leading.map((cc) => ({ name: COUNTRIES[cc].name, cc, values: new Array(n).fill(0) }));
        const others = { name: "Others", cc: "", values: new Array(n).fill(0) }, unknown = { name: "No known home", cc: "", values: new Array(n).fill(0) };
        for (const [slug, values] of h.pools) {
          const target = counts.find((row) => row.cc === POOL_COUNTRY.get(slug)) ?? others;
          values.forEach((value, k) => (target.values[k] += value));
        }
        for (let k = 0; k < n; k++) unknown.values[k] = Math.max(0, h.total[k] - counts.reduce((sum, row) => sum + row.values[k], 0) - others.values[k]);
        historyRows = [...counts, others, unknown].map(({ name, values }) => ({ name, shares: values.map((value, k) => (h.total[k] ? value / h.total[k] : 0)) }));
        // (Each the same scale, a row's full height its whole: an area under its share, month by month.)
        const x = (/** @type {number} */ k) => ((k / (n - 1)) * 1000).toFixed(1);
        $("area").innerHTML = historyRows.map(({ name, shares }) => {
          const line = shares.map((share, k) => `${x(k)},${(100 - share * 100).toFixed(2)}`).join("L");
          return `<div class="row"><span>${name}</span><svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"><path class="fill" d="M0,100L${line}L1000,100Z"/><path class="line" d="M${line}"/></svg><b class="num"></b></div>`;
        }).join("") + `<div class="cursor" id="month-cursor" hidden></div>`;
        Object.assign($("area"), { hidden: false, tabIndex: 0 });
        /** @type {HTMLButtonElement} */ ($("play")).disabled = false;
        $("area").setAttribute("role", "slider");
        $("area").setAttribute("aria-label", "Month");
        $("history-message").hidden = true;
        $("area").setAttribute("aria-valuemin", "0");
        $("area").setAttribute("aria-valuemax", String(n - 1));
        const at = (/** @type {number} */ k) => (k / (n - 1)) * 100;
        $("years").innerHTML = h.months.flatMap((date, k) => (date.endsWith("-01-01") && Number(date.slice(0, 4)) % 2 === 0 && k > n * 0.02 && k < n * 0.98 ? [`<span class="num" style="left: ${at(k)}%">${date.slice(0, 4)}</span>`] : [])).join("");
        $("events").innerHTML = EVENTS.flatMap(([date, text]) => {
          const k = h.months.indexOf(date);
          return k < 0 ? [] : [`<span style="left: ${at(k)}%">${text}</span>`];
        }).join("");
        placeEvents();
        drawCursor();
      }
      /** The events' labels placed: each a row and a side of its line, none over another or another's line, within the
       * chart (the first that fits, nearest the chart and centered first; none fitting, alternate rows). */
      function placeEvents() {
        const box = $("events"), width = box.clientWidth, labels = /** @type {HTMLElement[]} */ ([...box.children]);
        if (!width || !labels.length) return;
        const spans = labels.map((label) => ({ x: (parseFloat(label.style.left) / 100) * width, width: label.offsetWidth }));
        const options = [0, 1, 2].flatMap((row) => [0.5, 0, 1].map((anchor) => ({ row, anchor })));
        /** @type {{ row: number, anchor: number, x: number, left: number, right: number }[]} */
        const placed = [];
        const solve = (/** @type {number} */ i) => {
          if (i === spans.length) return true;
          const { x, width: w } = spans[i];
          for (const { row, anchor } of options) {
            const left = x - anchor * w, right = left + w;
            if (left < 0 || right > width) continue;
            // (Same row: apart. A label below: this line misses it. A label above: its line misses this.)
            const clear = placed.every((p) => (p.row === row ? right + 8 < p.left || left > p.right + 8 : p.row < row ? x < p.left - 4 || x > p.right + 4 : p.x < left - 4 || p.x > right + 4));
            if (!clear) continue;
            placed.push({ row, anchor, x, left, right });
            if (solve(i + 1)) return true;
            placed.pop();
          }
          return false;
        };
        const rows = solve(0) ? placed : spans.map((_, i) => ({ row: i % 2, anchor: 0.5 }));
        labels.forEach((label, i) => {
          label.style.setProperty("--row", String(rows[i].row));
          label.style.setProperty("--anchor", String(rows[i].anchor));
        });
        box.style.setProperty("--top", String(Math.max(...rows.map(({ row }) => row))));
      }
      new ResizeObserver(placeEvents).observe($("events"));
      document.fonts.ready.then(placeEvents);
      function drawCursor() {
        const cursor = document.getElementById("month-cursor");
        if (!cursor || !history) return;
        const end = history.months.length - 1;
        cursor.hidden = month === null;
        if (month !== null) cursor.style.setProperty("--at", String(month / end));
        // (Each row's share in the month read; none read, the latest.)
        $("area").querySelectorAll(".row > b").forEach((value, i) => {
          const share = historyRows[i]?.shares[month ?? end] ?? 0;
          value.textContent = share ? percent(share) : "–";
        });
        $("history-when").textContent = monthLabel(month ?? end);
        // (A period's shown: the slider stands at now.)
        $("area").setAttribute("aria-valuenow", String(month ?? end));
        const event = month === null ? undefined : EVENTS.find(([date]) => date === history?.months[month]);
        // (The slider says the month and every row's share in it: its rows are inside it, so read through it.)
        const k = month ?? end, read = historyRows.map(({ name, shares }) => `${name} ${shares[k] ? percent(shares[k]) : "none"}`).join(", ");
        $("area").setAttribute("aria-valuetext", `${monthLabel(k)}${event ? `, ${event[1]}` : ""}: ${read}`);
      }
      const monthAt = (/** @type {PointerEvent} */ event) => {
        // (Along the plots' column: a row's plot spans it.)
        const box = /** @type {Element} */ ($("area").querySelector("svg")).getBoundingClientRect(), n = /** @type {NonNullable<typeof history>} */ (history).months.length;
        return Math.round(Math.min(1, Math.max(0, (event.clientX - box.left) / box.width)) * (n - 1));
      };
      // (Pointed at, a month shows; picked (a tap, a click, a drag), it stays until another or a period's picked.)
      let pinned = /** @type {number | null} */ (null);
      // (A touch picks as it lifts: a scroll started on the chart leaves the month as it was. Playing, only a pick counts.)
      $("area").addEventListener("pointermove", (event) => history && !playing && (event.pointerType === "mouse" || event.buttons) && setMonth(monthAt(event)));
      $("area").addEventListener("pointerdown", (event) => history && event.pointerType !== "touch" && (stopPlaying(), setMonth((pinned = monthAt(event)))));
      $("area").addEventListener("pointerup", (event) => history && (stopPlaying(), setMonth((pinned = monthAt(event)))));
      $("area").addEventListener("pointercancel", () => history && !playing && setMonth(pinned));
      $("area").addEventListener("pointerleave", (event) => event.pointerType === "mouse" && history && !playing && setMonth(pinned));
      $("area").addEventListener("keydown", (event) => {
        if (!history) return;
        const end = history.months.length - 1, at = month ?? end;
        const to = { ArrowLeft: at - 1, ArrowDown: at - 1, ArrowRight: at + 1, ArrowUp: at + 1, PageDown: at - 12, PageUp: at + 12, Home: 0, End: end }[event.key];
        if (to === undefined) return;
        event.preventDefault();
        stopPlaying();
        setMonth((pinned = Math.max(0, Math.min(end, to))));
      });
      // Play: every month in turn, from the first, about twelve seconds in all.
      let playing = 0;
      function stopPlaying() {
        if (!playing) return;
        cancelAnimationFrame(playing);
        playing = 0;
        $("play").textContent = "Play";
      }
      $("play").addEventListener("click", () => {
        if (!history) return;
        if (playing) return stopPlaying();
        const n = history.months.length, t0 = performance.now(), from = month !== null && month < n - 1 ? month : 0;
        $("play").textContent = "Pause";
        const step = (/** @type {number} */ now) => {
          const k = Math.min(n - 1, from + Math.floor(((now - t0) / 12_000) * n));
          if (k !== month) setMonth((pinned = k));
          if (k < n - 1) playing = requestAnimationFrame(step);
          else stopPlaying();
        };
        playing = requestAnimationFrame(step);
      });
      /** The history, again if it fails (the rest of the page goes on without it). */
      async function showHistory(/** @type {{ slug: string, blockCount: number }[]} */ allTime) {
        $("history-message").textContent = "Loading…";
        try {
          history = await loadHistory(allTime);
          drawHistory();
        } catch (error) {
          const retry = Object.assign(document.createElement("button"), { type: "button", className: "play", textContent: "Try again" });
          retry.addEventListener("click", () => showHistory(allTime));
          $("history-message").replaceChildren(Object.assign(document.createElement("p"), { textContent: /** @type {Error} */ (error).message }), retry);
        }
      }

      // ── The latest blocks, live ──
      /** The last block shown (the series'), the chain's tip as seen (its height and hash), and whether a reorganization's
       * blocks are being read again. */
      let tip = 0, seen = 0, tipHash = "", rereading = false;
      /** @type {{ height: number, pool: string, time: number }[]} */
      let latest = [];
      async function blocks(/** @type {number} */ start, /** @type {number} */ end) {
        const [pools, times] = await json(`/api/series/bulk?${new URLSearchParams({ series: "block_pool,timestamp", index: "height", start: String(start), end: String(end) })}`);
        return pools.data.map((pool, i) => ({ height: pools.start + i, pool, time: times.data[i] }));
      }
      const ago = (/** @type {number} */ time) => {
        const minutes = Math.max(0, Math.round((Date.now() / 1000 - time) / 60));
        return minutes < 1 ? "just now" : minutes < 60 ? `${minutes} min ago` : `${Math.round(minutes / 60)} h ago`;
      };
      /** A block's height and age, each whole. */
      function stamp(/** @type {{ height: number, time: number }} */ block) {
        const line = Object.assign(document.createElement("span"), { className: "meta num stamp" });
        line.append(...[`#${grouped(block.height)}`, ago(block.time)].map((text) => Object.assign(document.createElement("span"), { textContent: text })));
        return line;
      }
      let shownLatest = new Set();
      function drawLatest() {
        const before = shownLatest;
        shownLatest = new Set(latest.map((block) => block.height));
        $("latest").replaceChildren(...latest.map((block) => {
          const cc = POOL_COUNTRY.get(block.pool) ?? null, item = Object.assign(document.createElement("li"), { className: before.size && !before.has(block.height) ? "new" : "" });
          item.style.setProperty("--color", colorOf(cc));
          item.append(
            Object.assign(document.createElement("span"), { className: "swatch" }),
            Object.assign(document.createElement("b"), { textContent: names.get(block.pool) ?? block.pool }),
            Object.assign(document.createElement("span"), { className: "meta", textContent: cc ? COUNTRIES[cc].name : "No known home" }),
            stamp(block),
          );
          return item;
        }));
      }
      let polling = false;
      async function poll() {
        if (polling) return;
        polling = true;
        try {
          // (The sun and the night move on, a little each poll, whatever else does.)
          invalidate();
          // (The tip by its hash: a new block, or another at the same height or lower (a reorganization), both change it.
          // What the chain's tip is (`seen`) and the last block the series gave (`tip`) apart: the series can lag.)
          const hash = await fetch("/api/blocks/tip/hash").then((response) => (response.ok ? response.text() : Promise.reject()));
          if (hash !== tipHash) {
            const height = Number(await fetch("/api/blocks/tip/height").then((response) => (response.ok ? response.text() : Promise.reject())));
            if (!Number.isFinite(height)) return;
            const first = !seen;
            if (seen && height <= seen) rereading = true;
            [seen, tipHash] = [height, hash];
            $("tip-height").textContent = grouped(height);
            $("tip").hidden = false;
            // (A new tip: every period's counts are old; the one shown asked for again, as a pick would, its answer or its
            // failure said; not waited for, so a slow answer never holds up the next poll.)
            if (!first) {
              forgetPeriods();
              if (month === null) setPeriod(period);
            }
          }
          if (tip >= seen && !rereading) return drawLatest();
          // (The blocks since the last one shown; after a reorganization, the last six again, until the series has the tip.)
          const before = tip, fresh = (await blocks(rereading || !tip ? seen - 5 : tip + 1, seen + 1)).reverse();
          if (!fresh.length) return;
          tip = fresh[0].height;
          latest = (rereading ? fresh : [...fresh, ...latest.filter((block) => block.height < fresh[fresh.length - 1].height)]).slice(0, 6);
          drawLatest();
          if (before > 0 && !rereading && fresh.length <= 3) {
            for (const block of fresh) {
              const cc = POOL_COUNTRY.get(block.pool);
              if (cc && !reduced.matches) pulses.push({ at: COUNTRIES[cc].at, t0: performance.now() });
            }
            // (Said once, as it arrives.)
            $("said").textContent = fresh.map((block) => `Block ${grouped(block.height)}: ${names.get(block.pool) ?? block.pool}, ${POOL_COUNTRY.has(block.pool) ? COUNTRIES[/** @type {string} */ (POOL_COUNTRY.get(block.pool))].name : "no known home"}`).join(". ");
          }
          if (rereading && tip === seen) rereading = false;
          invalidate();
        } catch {
        } finally {
          polling = false;
        }
      }

      // ── Start ──
      async function start() {
        readInks();
        resize();
        const [topology, allTime] = await Promise.all([json("/modules/world-atlas/2.0.2/countries-110m.json"), json("/api/v1/mining/pools/all")]);
        const atlas = decodeTopology(topology);
        features = atlas.geometries("countries").map((geometry) => ({ geometry, cc: CC_BY_ID.get(geometry.id) }));
        printLand();
        for (const pool of allTime.pools) names.set(pool.slug, pool.name);
        // (The history's rows: the countries with the most blocks ever found.)
        leading = tally(allTime.pools.map((/** @type {any} */ pool) => ({ slug: pool.slug, count: pool.blockCount })), allTime.blockCount)
          .flatMap((row) => (row.cc ? [row.cc] : [])).slice(0, 7);
        invalidate();
        await setPeriod(period);
        poll();
        setInterval(poll, 20_000);
        showHistory(allTime.pools);
      }
      /** The start, again if it fails (offered beside the message). */
      function begin() {
        $("countries").replaceChildren();
        start().catch((error) => {
          $("countries").replaceChildren(failure(error, begin));
          $("history-message").textContent = "Shown once the page has loaded.";
        });
      }
      begin();
    </script>
  </body>
</html>
