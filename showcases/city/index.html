        mempoolVSize = list.reduce((sum, block) => sum + block.blockVSize, 0);
        dirty = true;
      }

      /** Projections wait for the blocks found before them to be stamped, which takes theirs in. */
      function projected(/** @type {Projected[]} */ list) {
        if (arriving.length || job) projectedLater = list;
        else setProjected(list, false);
      }

      /** @type {ReturnType<typeof setTimeout> | undefined} */
      let pollTimer;
      let polling = false;

      /**
       * New blocks, in batches the server takes even after a long sleep, then the projections,
       * which so never still hold a block found. One look at a time.
       */
      async function poll() {
        // Until start() has the first blocks, it owns the polling.
        if (knownTip < 0 || polling) return;
        polling = true;
        clearTimeout(pollTimer);
        try {
          const client = await clientReady;
          const height = await client.getBlockTipHeight({ cache: false });
          while (height > knownTip) {
            const fresh = await fetchBlocks(knownTip + 1, Math.min(height, knownTip + HISTORY_BATCH) + 1, false);
            if (!fresh.length) break;
            knownTip = fresh[fresh.length - 1].height;
            arriving.push(...fresh);
          }
          projected(await client.getMempoolBlocks({ cache: false }));
          setLive(true);
        } catch (error) {
          console.error("poll", error);
          setLive(false, "Offline");
        }
        polling = false;
        pollTimer = setTimeout(poll, TIP_POLL_MS);
      }

      async function start() {
        try {
          const client = await clientReady;
          client.getPools().then((list) => {
            for (const { slug, name } of list) poolNames.set(slug, name);
            dirty = true;
            describe();
          }).catch(() => {});
          const height = await client.getBlockTipHeight({ cache: false });
          const initial = await fetchBlocks(Math.max(0, height - HISTORY_BATCH + 1), height + 1, false);
          const list = await client.getMempoolBlocks({ cache: false });
          place(initial, null);
          blocks = initial;
          reachedGenesis = initial.length > 0 && initial[0].height === 0;
          const tip = initial[initial.length - 1];
          knownTip = tip ? tip.height : height;
          lastPool = tip ? tip.pool : "";
          setProjected(list, true);
          setLive(true);
          void pollRecent();
        } catch (error) {
          console.error("start", error);
          setLive(false, "Offline");
          pollTimer = setTimeout(start, TIP_POLL_MS);
          return;
        }
        pollTimer = setTimeout(poll, TIP_POLL_MS);
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          saveCamera();
          return;
        }
        void poll();
      });

      // Where the viewer was, kept for their next visit: saved as the page goes away.
      const CAMERA_KEY = "city-camera";

      function saveCamera() {
        try {
          localStorage.setItem(CAMERA_KEY, JSON.stringify({ u: camera.u, v: camera.v, scale: camera.scale }));
        } catch {}
      }

      /** @returns {typeof camera | null} */
      function savedCamera() {
        try {
          const saved = JSON.parse(localStorage.getItem(CAMERA_KEY) ?? "null");
          if (!saved || ![saved.u, saved.v, saved.scale].every(Number.isFinite)) return null;
          return { u: saved.u, v: saved.v, scale: Math.min(MAX_SCALE, Math.max(MIN_SCALE, saved.scale)) };
        } catch {
          return null;
        }
      }

      window.addEventListener("pagehide", saveCamera);

      // Start ------------------------------------------------------------------

      readPalette();
      themeButton.textContent = root.dataset.theme === "dark" ? "Light" : "Dark";
      resize();
      Object.assign(camera, savedCamera() ?? homeView());
      document.fonts.load(`12px ${FONT}`).then(() => (dirty = true));
      tick();
      setInterval(tick, 1_000);
      requestAnimationFrame(frame);
      void start();
    </script>
  </body>
</html>
