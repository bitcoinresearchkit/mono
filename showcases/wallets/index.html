<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Watch-only Bitcoin wallets: xpubs and descriptors derived on your device, looked up through anonymity sets."
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0b0b0b" />
    <title>Wallets · bitview</title>
    <link rel="preconnect" href="https://bitview.space" crossorigin />
    <style>
      @font-face {
        font-family: Lilex;
        src: url("../fonts/Lilex.woff2") format("woff2");
        font-weight: 100 700;
        font-display: swap;
      }

      @font-face {
        font-family: Instrument;
        src: url("../fonts/InstrumentSerif-Regular.woff2") format("woff2");
        font-display: swap;
      }

      :root {
        color-scheme: dark;

        /* A vault: green-black ink, cream paper, brass fittings. */
        --white: oklch(93% 0.025 85);
        --gray: oklch(64% 0.025 160);
        --black: oklch(17% 0.02 165);
        --panel: oklch(21% 0.022 165);
        --line: oklch(31% 0.025 165);
        --red: oklch(70% 0.13 40);
        --orange: oklch(76% 0.11 80);
        --green: oklch(76% 0.11 155);

        --font-mono:
          Lilex, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
        --font-serif:
          Instrument, Charter, "Bitstream Charter", "Sitka Text", Cambria, serif;
        --font-size-xs: 0.75rem;
        --line-height-xs: calc(1 / 0.75);
        --font-size-sm: 0.875rem;
        --line-height-sm: calc(1.25 / 0.875);
        --font-size-base: 1rem;
        --line-height-base: 1.5;
        --font-size-lg: 1.25rem;
        --line-height-lg: calc(1.5 / 1.25);
        --font-weight-regular: 400;
        --font-weight-strong: 450;

        --control-radius: 999rem;
        --control-padding: 0.7rem 1.1rem;
        --button-color: var(--white);
        --button-background: transparent;
        --button-hover-background: color-mix(in oklch, var(--white) 8%, transparent);
        --button-active-background: color-mix(in oklch, var(--orange) 25%, transparent);
        --field-color: light-dark(var(--black), var(--white));

        --page-x: 2rem;
        --transition-duration: 150ms;
      }

      @media (max-width: 34rem) {
        :root {
          --page-x: 1rem;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      *:not(dialog) {
        margin: 0;
      }

      html {
        background: var(--black);
        font-family: var(--font-mono);
      }

      body {
        min-height: 100dvh;
        color: var(--white);
        background: var(--black);
        line-height: 1.5;
      }

      input,
      button,
      textarea {
        font: inherit;
      }

      p,
      h1,
      h2,
      h3 {
        overflow-wrap: break-word;
      }

      h1,
      h2,
      h3 {
        font-family: var(--font-serif);
        font-weight: 400;
        text-wrap: balance;
      }

      [hidden] {
        display: none !important;
      }

      a,
      button,
      input,
      label,
      summary,
      textarea {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      button,
      input,
      textarea {
        appearance: none;
        min-width: 0;
        border-radius: var(--control-radius);
        padding: var(--control-padding);
        font-size: var(--font-size-sm);
        line-height: 1;

        &:focus-visible {
          outline: 2px solid var(--orange);
          outline-offset: 2px;
        }
      }

      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        color: var(--button-color);
        background: var(--button-background);
        font-size: var(--font-size-xs);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition:
          background var(--transition-duration) ease,
          border-color var(--transition-duration) ease;
        -webkit-user-select: none;
        user-select: none;
        cursor: pointer;

        @media (hover: hover) and (pointer: fine) {
          &:hover {
            background: var(--button-hover-background);
          }
        }

        &:active {
          background: var(--button-active-background);
        }

        &[data-press] {
          background: var(--button-hover-background);
        }

        &:disabled {
          opacity: 0.5;
          cursor: progress;
        }
      }

      button[type="submit"],
      [data-summary] > button,
      [data-empty] menu > button:first-child {
        --button-color: var(--black);
        --button-background: var(--orange);
        --button-hover-background: oklch(from var(--orange) calc(l + 0.06) c h);
        --button-active-background: oklch(from var(--orange) calc(l - 0.06) c h);

        border-color: transparent;
      }

      input,
      textarea {
        border: 1px solid var(--line);
        color: var(--field-color);
        background: transparent;

        @media (hover: hover) and (pointer: fine) {
          &:hover {
            border-color: var(--field-color);
          }
        }

        &:active {
          border-color: var(--orange);
        }

        &[aria-invalid="true"] {
          border-color: var(--red);
          color: var(--red);

          &::placeholder {
            color: var(--red);
          }
        }

        &::placeholder {
          color: color-mix(in oklch, var(--field-color) 70%, transparent);
        }
      }

      input {
        height: 2.5rem;
      }

      textarea {
        min-height: 7rem;
        border-radius: 0.75rem;
        line-height: var(--line-height-sm);
        resize: vertical;
      }

      ::selection {
        color: var(--black);
        background-color: var(--orange);
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: var(--gray) transparent;
      }

      /* Header ------------------------------------------------------------ */

      .site-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        width: min(100%, 72rem);
        margin-inline: auto;
        padding: 1.25rem var(--page-x);
        line-height: 1;

        > [data-server] {
          margin-left: auto;
        }

        @media (max-width: 34rem) {
          flex-wrap: wrap;
          row-gap: 0.75rem;

          > [data-server] {
            order: 3;
            width: 100%;
            margin-left: 0;
          }

          > footer {
            margin-left: auto;
          }
        }

        > footer {
          display: flex;
          gap: 0.5rem;

          > button {
            padding: 0.5rem 0.8rem;
          }
        }
      }

      .site-brand {
        --brand-color: var(--white);

        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--brand-color);
        font-size: var(--font-size-base);
        text-decoration: none;
        text-transform: lowercase;
        opacity: 0.82;
        transition: opacity 150ms ease;

        &:hover,
        &:focus-visible {
          opacity: 1;
        }

        &:focus-visible {
          outline: 2px solid var(--white);
          outline-offset: 0.35rem;
        }

        &:active {
          --brand-color: var(--orange);
        }
      }

      .site-brand-mark {
        display: inline-grid;
        padding: 0.2rem 0.3rem;
        border-radius: 0.25rem;
        place-items: center;
        color: var(--black);
        background: var(--brand-color);
      }

      .site-brand-cube {
        display: block;
        width: 1.299rem;
        height: 1.5rem;
        overflow: hidden;

        .glass {
          fill: currentColor;
          fill-opacity: 0.4;
        }

        .liquid {
          fill: currentColor;
        }

        .liquid-group {
          transform-box: view-box;
          animation: brand-fill 5s linear infinite alternate;
        }
      }

      @keyframes brand-fill {
        from {
          transform: translateY(49.5%);
        }
        to {
          transform: translateY(0);
        }
      }

      [data-server] {
        color: var(--gray);
        font-size: var(--font-size-xs);

        &::before {
          content: "";
          display: inline-block;
          width: 0.4rem;
          height: 0.4rem;
          margin-right: 0.4rem;
          border-radius: 50%;
          background: var(--gray);
          vertical-align: 0.1em;
        }

        &[data-local]::before {
          background: var(--green);
        }
      }

      /* Dialogs ----------------------------------------------------------- */

      dialog[data-dialog] {
        --dialog-space: 1.5rem;

        color-scheme: light;
        width: min(100% - 2rem, 30rem);
        border: 0;
        border-radius: var(--dialog-space);
        padding: var(--dialog-space);
        --line: oklch(80% 0.03 85);
        --button-color: var(--black);
        --button-hover-background: color-mix(in oklch, var(--black) 7%, transparent);
        --field-color: var(--black);

        color: var(--black);
        background: var(--white);
        opacity: 0;
        translate: 0 0.5rem;
        transition:
          opacity var(--transition-duration) ease,
          translate var(--transition-duration) ease,
          display var(--transition-duration) allow-discrete,
          overlay var(--transition-duration) allow-discrete;

        &[open] {
          opacity: 1;
          translate: 0;
        }

        &::backdrop {
          background: color-mix(in oklch, var(--black) 72%, transparent);
          opacity: 0;
          transition:
            opacity var(--transition-duration) ease,
            display var(--transition-duration) allow-discrete,
            overlay var(--transition-duration) allow-discrete;
        }

        &[open]::backdrop {
          opacity: 1;
        }

        @starting-style {
          &[open] {
            opacity: 0;
            translate: 0 0.5rem;
          }

          &[open]::backdrop {
            opacity: 0;
          }
        }
      }

      /* Page -------------------------------------------------------------- */

      main {
        --offset: 4rem;

        display: grid;
        gap: 2rem;
        align-content: start;
        width: min(100%, 72rem);
        margin-inline: auto;
        padding: 0.5rem var(--page-x) 5rem;

        output {
          display: block;
          min-height: var(--line-height-sm);
          color: var(--gray);
          font-size: var(--font-size-sm);
          line-height: var(--line-height-sm);
        }

        > article {
          display: grid;
          gap: 1.75rem;
          align-content: start;
          min-width: 0;
        }

        label {
          display: grid;
          gap: 0.375rem;
          min-width: 0;

          > span {
            color: var(--gray);
            font-size: var(--font-size-xs);
            line-height: var(--line-height-xs);
            text-transform: uppercase;
          }
        }
      }

      [data-amount] [data-muted] {
        color: color-mix(in oklch, currentColor 45%, transparent);
      }

      /* Hold-to-confirm buttons */

      [data-hold] {
        --hold-progress: 0;
        --hold-progress-width: 0%;

        position: relative;
        isolation: isolate;
        overflow: hidden;
        color: color-mix(in oklch, var(--gray) 76%, transparent);
        background: transparent;

        &::before,
        &::after {
          content: "";
          position: absolute;
          inset: 0;
          opacity: 0;
        }

        &::before {
          z-index: -1;
          background: var(--red);
          transform: scaleX(var(--hold-progress));
          transform-origin: left;
        }

        &::after {
          content: attr(data-label);
          display: flex;
          align-items: center;
          justify-content: center;
          padding: inherit;
          color: var(--black);
          white-space: nowrap;
          clip-path: inset(0 calc(100% - var(--hold-progress-width)) 0 0);
          pointer-events: none;
        }

        @media (hover: hover) and (pointer: fine) {
          &:hover:not([data-holding]) {
            color: var(--red);
            background: transparent;
          }
        }

        &:is(:focus-visible, :active, [data-press]):not([data-holding]),
        &[data-active] {
          color: var(--red);
          background: transparent;
        }

        &[data-active]::before,
        &[data-active]::after {
          opacity: 1;
        }
      }

      /* Start */

      [data-start] {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(19rem, 26rem);
        gap: 4rem;
        align-items: center;
        width: min(100%, 68rem);
        min-height: calc(100dvh - 2 * var(--offset));
        margin-inline: auto;

        @media (max-width: 56rem) {
          grid-template-columns: 1fr;
          gap: 2rem;
          align-content: center;
          width: min(100%, 39rem);
          margin-inline: 0 auto;
        }

        > article {
          display: grid;
          gap: 0.875rem;

          > p,
          li {
            max-width: 35rem;
            font-size: var(--font-size-base);
            line-height: var(--line-height-base);
          }

          > ul {
            display: grid;
            gap: 0.75rem;
            margin: 0.5rem 0 0;
            padding: 0;
            list-style: none;
          }

          li {
            display: grid;
            grid-template-columns: 1rem minmax(0, 1fr);
            gap: 0.75rem;

            &::before {
              content: "";
              width: 0.5rem;
              height: 0.5rem;
              margin-top: 0.5rem;
              border: 1px solid var(--orange);
              border-radius: 50%;
            }
          }

          > hr {
            width: min(100%, 34rem);
            height: 0.5px;
            margin: 0.125rem 0 0;
            border: 0;
            background: var(--gray);
          }

          > small {
            max-width: 34rem;
            color: var(--gray);
            font-size: var(--font-size-sm);
            line-height: var(--line-height-sm);

            a {
              color: inherit;
            }
          }
        }

        h1 {
          font-size: 4.5rem;
          line-height: 0.95;

          span {
            color: var(--orange);
          }

          @media (max-width: 34rem) {
            font-size: 3.5rem;
          }
        }

        > div {
          display: grid;
          gap: 0.875rem;
          width: 100%;

          > section {
            display: grid;
            gap: 0.5rem;
          }

          > p {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 0.625rem;
            align-items: center;
            color: var(--gray);
            font-size: var(--font-size-xs);
            line-height: 1;

            &::before,
            &::after {
              content: "";
              height: 0.5px;
              background: var(--gray);
            }
          }

          h2 {
            font-family: var(--font-mono);
            font-size: var(--font-size-sm);
            line-height: var(--line-height-sm);
          }

          section > p {
            color: var(--gray);
            font-size: var(--font-size-sm);
            line-height: var(--line-height-sm);
          }

          form {
            display: flex;
            width: 100%;

            input {
              flex: 1 1 auto;
              border-top-right-radius: 0;
              border-bottom-right-radius: 0;
            }

            button {
              border-top-left-radius: 0;
              border-bottom-left-radius: 0;
            }

            @media (max-width: 34rem) {
              flex-direction: column;

              input {
                border-top-right-radius: var(--control-radius);
                border-bottom-left-radius: 0;
              }

              button {
                border-top-right-radius: 0;
                border-bottom-left-radius: var(--control-radius);
              }
            }
          }

          section > button {
            width: 100%;
          }
        }
      }

      /* Empty */

      [data-empty] {
        display: grid;
        gap: 1rem;
        place-content: center;
        min-height: calc(100dvh - 2 * var(--offset));
        text-align: center;

        h1 {
          font-size: 4rem;
          line-height: 1;
        }

        p {
          max-width: 31rem;
          color: var(--gray);
          font-size: var(--font-size-base);
          line-height: var(--line-height-base);
        }

        > menu {
          display: flex;
          flex-wrap: wrap;
          gap: 0.75rem;
          justify-content: center;
          padding: 0;
        }
      }

      /* Add */

      [data-add] {
        display: grid;
        gap: 1.25rem;

        > h2 {
          font-size: 2.5rem;
          line-height: 1;
        }

        > p {
          color: var(--gray);
          font-size: var(--font-size-sm);
          line-height: var(--line-height-sm);
        }

        > footer {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 0.5rem;
        }
      }

      /* Selector */

      [data-selector] {
        min-width: 0;

        > nav {
          display: flex;
          gap: 0.5rem;
          min-width: 0;
          overflow-x: auto;
          padding-bottom: 0.25rem;
          overscroll-behavior-inline: contain;
          scroll-padding-inline: var(--page-x);
          scroll-snap-type: x proximity;

          > button {
            flex: 0 0 auto;
            scroll-snap-align: center;
            line-height: 1;
          }

          /* Wallet names read as names, not commands. */
          > button[aria-pressed] {
            font-size: var(--font-size-sm);
            letter-spacing: 0;
            text-transform: none;

            &[aria-pressed="true"] {
              --button-color: var(--black);
              --button-background: var(--white);
              --button-hover-background: var(--white);

              border-color: var(--white);
            }
          }

          > button:not([aria-pressed], [data-hold]) {
            border-style: dashed;
          }

          > [data-hold] {
            border-color: transparent;
          }
        }
      }

      /* Wallet */

      [data-summary] {
        display: flex;
        gap: 1rem;
        align-items: end;
        justify-content: space-between;
        min-height: 5rem;

        @media (max-width: 34rem) {
          display: grid;
          justify-items: start;
        }

        > p {
          display: grid;
          gap: 0.75rem;

          &::before {
            content: "Balance";
            color: var(--gray);
            font-size: var(--font-size-xs);
            letter-spacing: 0.12em;
            text-transform: uppercase;
          }

          strong {
            min-width: 0;
            overflow-wrap: anywhere;
            font-family: var(--font-serif);
            font-size: clamp(3.25rem, 11vw, 6rem);
            font-weight: var(--font-weight-regular);
            letter-spacing: -0.01em;
            line-height: 0.9;
          }

          > span {
            color: var(--gray);
            font-size: var(--font-size-base);
            line-height: var(--line-height-base);
          }
        }

        > button {
          flex: 0 0 auto;
        }
      }

      [data-tabs] {
        display: grid;
        gap: 1rem;
        min-width: 0;

        > nav {
          display: flex;
          gap: 1.75rem;
          overflow-x: auto;
          border-bottom: 1px solid var(--line);

          > button {
            border: 0;
            border-radius: 0;
            padding: 0.9rem 0;
            color: var(--gray);
            background: none;

            &[aria-selected="true"] {
              color: var(--white);
              box-shadow: inset 0 -2px var(--orange);
            }

            @media (hover: hover) and (pointer: fine) {
              &:hover {
                color: var(--white);
                background: none;
              }
            }
          }
        }

        /* The tabs already name each panel. */
        [role="tabpanel"] h2 {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        }

        h3 {
          color: var(--gray);
          font-family: var(--font-mono);
          font-size: var(--font-size-xs);
          line-height: var(--line-height-xs);
          text-transform: uppercase;
        }

        section > p,
        [data-note] {
          color: var(--gray);
          font-size: var(--font-size-sm);
          line-height: var(--line-height-sm);
        }

        [role="tabpanel"] > section {
          display: grid;
          gap: 1rem;
        }

        ol,
        ul {
          display: grid;
          gap: 0.25rem;
          margin: 0;
          padding: 0;
          list-style: none;
        }

        code {
          color: inherit;
          font-family: inherit;
        }
      }

      [data-row] {
        border-bottom: 1px solid var(--line);
      }

      /* Balance over time, rebuilt from the wallet's own history. */
      [data-balance-chart] {
        display: grid;
        gap: 0.5rem;
        margin: 0;

        svg {
          display: block;
          width: 100%;
          height: clamp(7rem, 18vw, 11rem);
          overflow: visible;
        }

        [data-area] {
          fill: url(#balance-fill);
        }

        [data-line] {
          fill: none;
          stroke: var(--orange);
          stroke-width: 1.5;
          vector-effect: non-scaling-stroke;
        }

        [data-baseline] {
          stroke: var(--line);
          vector-effect: non-scaling-stroke;
        }

        figcaption {
          display: flex;
          justify-content: space-between;
          gap: 1rem;
          color: var(--gray);
          font-size: var(--font-size-xs);
          line-height: var(--line-height-xs);
        }
      }

      [data-activity] > section {
        display: grid;
        gap: 0.5rem;

        details[open] {
          display: grid;
          gap: 0.75rem;
          padding-bottom: 0.875rem;
        }

        summary {
          display: grid;
          gap: 0.25rem;
          padding: 0.875rem 0;
          list-style: none;
          cursor: pointer;

          &::-webkit-details-marker {
            display: none;
          }

          > p {
            min-width: 0;
            color: var(--gray);
            font-size: var(--font-size-sm);
            line-height: var(--line-height-sm);
          }
        }

        details > section {
          display: grid;
          gap: 1rem;

          > code {
            overflow-wrap: anywhere;
          }

          > p {
            color: var(--gray);
            font-size: var(--font-size-sm);
          }

          > ul {
            gap: 0.75rem;
          }
        }
      }

      [data-row-head] {
        display: flex;
        gap: 1rem;
        align-items: baseline;
        justify-content: space-between;
        min-width: 0;

        strong {
          font-weight: var(--font-weight-strong);
        }

        > span {
          white-space: nowrap;

          &[data-tone="positive"] {
            color: var(--green);
          }

          &[data-tone="negative"] {
            color: var(--red);
          }
        }
      }

      [data-holdings] li,
      [data-addresses] li {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0.25rem 1rem;
        align-items: center;
        padding: 0.875rem 0;

        @media (max-width: 34rem) {
          grid-template-columns: 1fr;
        }

        > p {
          min-width: 0;
          color: var(--gray);
          font-size: var(--font-size-sm);
          line-height: var(--line-height-sm);
        }
      }

      [data-holdings] li > [data-address-cell] {
        grid-column: 1 / -1;
      }

      [data-addresses] li > p {
        white-space: nowrap;

  <body>

                <polygon class="liquid" points="0,50 0,150 86.6,200 86.6,100" />

            </g>

            <polygon class="glass" points="173.2,50 173.2,150 86.6,200 86.6,100" />
            <polygon class="glass" points="0,50 0,150 86.6,200 86.6,100" />
