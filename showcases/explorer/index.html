<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Every series Bitview computes from the chain, browsed like files: what each one is, its intervals, its history drawn, and how to fetch it." />
    <meta name="color-scheme" content="light dark" />
    <title>Explorer · Bitview</title>
    <link rel="icon" href="/assets/logo/logo.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: Inter;
        src: url("/assets/fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: Lilex;
        src: url("/assets/fonts/Lilex.woff2") format("woff2");
        font-weight: 100 700;
        font-display: swap;
      }

      /* An index of the chain's series: paper and ink, hairlines between columns, ids in a monospace, Bitcoin's orange
         for what's picked. Light or dark, as the system is. */
      :root {
        color-scheme: light dark;
        --app: light-dark(#fbfaf7, #0e0f11);
        --pane: light-dark(#ffffff, #141519);
        --well: light-dark(#f3f1ec, #1b1d22);
        --ink: light-dark(#17181b, #eceae5);
        --soft: light-dark(#53565e, #a9acb4);
        --faint: light-dark(#6c6f77, #8c9099);
        --line: light-dark(#e7e4dd, #24262c);
        --line-strong: light-dark(#d6d2c9, #33363e);
        --accent: light-dark(#d4570a, #f2873a);
        --accent-ink: light-dark(#9c3d00, #ffb27a);
        --pick: light-dark(#fbe9dc, #33221a);
        --pick-strong: light-dark(#f6d7bf, #47291a);
        --hover: light-dark(#f4f1ea, #1c1e23);
        --raise: light-dark(#ffffff, #2b2d34);
        --plot: light-dark(#d4570a, #f2873a);
        --grid: light-dark(#eeebe4, #1f2126);
        --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: Lilex, ui-monospace, SFMono-Regular, Menlo, monospace;
        --radius: 10px;
        --plot-height: 300px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--app);
        color: var(--ink);
        font: 14px/1.5 var(--sans);
        font-feature-settings: "cv11", "ss01";
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
        color: inherit;
      }

      button {
        border: 0;
        background: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      a {
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
        border-radius: 6px;
      }

      [hidden] {
        display: none !important;
      }

      code,
      .mono {
        font-family: var(--mono);
        font-size: 0.92em;
      }

      .num {
        font-variant-numeric: tabular-nums;
      }

      /* ── The bar: the brand, where we are, the search ── */

      .bar {
        position: sticky;
        top: 0;
        z-index: 3;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        height: 56px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        background: var(--pane);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 600;
        letter-spacing: -0.01em;
        text-decoration: none;
        white-space: nowrap;

        img {
          width: 20px;
          height: 20px;
        }

        span {
          color: var(--faint);
          font-weight: 400;
        }
      }

      .search {
        position: relative;
        justify-self: center;
        width: min(560px, 100%);

        svg {
          position: absolute;
          top: 50%;
          left: 11px;
          width: 15px;
          height: 15px;
          translate: 0 -50%;
          color: var(--faint);
          pointer-events: none;
        }

        input {
          width: 100%;
          height: 36px;
          padding: 0 40px 0 34px;
          border: 1px solid var(--line);
          border-radius: 9px;
          background: var(--well);
          outline: none;

          &::placeholder {
            color: var(--faint);
          }

          &:focus {
            border-color: var(--accent);
            background: var(--pane);
            box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent);
          }

          &::-webkit-search-cancel-button {
            display: none;
          }
        }

        kbd {
          position: absolute;
          top: 50%;
          right: 9px;
          translate: 0 -50%;
          min-width: 20px;
          padding: 1px 6px;
          border: 1px solid var(--line-strong);
          border-radius: 5px;
          color: var(--faint);
          font: 11px var(--mono);
          text-align: center;
          pointer-events: none;
        }

        input:focus ~ kbd,
        input:not(:placeholder-shown) ~ kbd {
          display: none;
        }

        /* (What's typed cleared at a tap, as a phone's search fields do.) */
        .clear {
          position: absolute;
          top: 50%;
          right: 4px;
          display: none;
          place-items: center;
          width: 28px;
          height: 28px;
          translate: 0 -50%;
          border-radius: 7px;
          color: var(--faint);

          &:hover {
            color: var(--ink);
          }

          svg {
            position: static;
            translate: none;
            width: 16px;
            height: 16px;
            color: inherit;
          }
        }

        input:not(:placeholder-shown) ~ .clear {
          display: grid;
        }
      }

      .count {
        color: var(--faint);
        font-size: 12px;
        white-space: nowrap;
      }

      /* (A key's hint only where there are keys to press.) */
      @media (hover: none) {
        .search kbd,
        .keys {
          display: none;
        }
      }

      /* ── The catalog: a column per folder opened, the series at the end ── */

      main {
        position: relative;
        display: flex;
        min-width: 0;
        min-height: 0;
        overflow-x: auto;
        overscroll-behavior-x: contain;
      }

      .column {
        flex: none;
        width: 252px;
        overflow-y: auto;
        border-right: 1px solid var(--line);
        background: var(--pane);
        overscroll-behavior: contain;

        h2 {
          position: sticky;
          top: 0;
          z-index: 1;
          margin: 0;
          padding: 12px 14px 8px;
          background: var(--pane);
          color: var(--faint);
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.06em;
          text-transform: uppercase;

          /* (Its count said on a phone, where no row beside it says it.) */
          span {
            display: none;
          }
        }

        ul {
          margin: 0;
          padding: 0 6px 12px;
          list-style: none;
        }
      }

      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 2px 10px;
        width: 100%;
        min-height: 34px;
        padding: 6px 8px 6px 10px;
        border-radius: 7px;
        text-align: left;

        &:hover {
          background: var(--hover);
        }

        &[aria-current="true"] {
          background: var(--pick);
        }

        .label {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .side {
          display: flex;
          align-items: center;
          gap: 4px;
          color: var(--faint);
          font-size: 12px;
        }

        .id {
          grid-column: 1 / -1;
          overflow: hidden;
          color: var(--faint);
          font: 11.5px var(--mono);
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        svg {
          width: 14px;
          height: 14px;
        }
      }

      .column:focus-within .row[aria-current="true"] {
        background: var(--pick-strong);
      }

      /* (A touch screen's rows a finger tall; its search's letters as large as a phone takes without zooming in.) */
      @media (pointer: coarse) {
        .row {
          min-height: 44px;
        }

        .search input {
          font-size: 16px;
        }
      }

      /* After the columns: a series, what this is at the top, or the room left. Each takes what the whole columns
         beside it leave (fit(), in the script), at least its least. */
      .series,
      .home,
      .rest {
        flex: 1 0 0;
      }

      /* A series: its history, how to have it, what it is. */
      .series {
        min-width: 480px;
        overflow-y: auto;
        padding: 28px clamp(20px, 3vw, 40px) 48px;
      }

      .home {
        min-width: 360px;
        display: grid;
        place-content: center;
        padding: 40px;
        color: var(--faint);
        text-align: center;

        p {
          margin: 0;
        }

        kbd {
          padding: 1px 6px;
          border: 1px solid var(--line-strong);
          border-radius: 5px;
          font: 11px var(--mono);
        }
      }

      .crumbs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 4px;
        margin: 0 0 10px;
        padding: 0;
        color: var(--faint);
        font-size: 12.5px;
        list-style: none;

        li + li::before {
          content: "›";
          margin-right: 4px;
        }

        button:hover {
          color: var(--ink);
        }
      }

      .series h1 {
        margin: 0;
        font-size: clamp(22px, 2.4vw, 30px);
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.15;
        text-wrap: balance;
      }

      /* A text that copies itself at a press: an id, an address. Its icon says when it has. */
      .copyable {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: 100%;
        min-height: 28px;
        padding: 3px 8px 3px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--well);
        text-align: left;

        code {
          min-width: 0;
          font-size: 12.5px;
          overflow-wrap: anywhere;
        }

        svg {
          flex: none;
          width: 14px;
          height: 14px;
          color: var(--faint);
        }

        .done {
          display: none;
        }

        &:hover {
          border-color: var(--line-strong);

          svg {
            color: var(--ink);
          }
        }

        &.copied {
          .done {
            display: block;
            color: var(--accent);
          }

          .undone {
            display: none;
          }
        }
      }

      .series > .copyable {
        margin-top: 12px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--pane);
        color: var(--soft);
        font-size: 12.5px;
        text-decoration: none;
        white-space: nowrap;

        &:hover {
          border-color: var(--line-strong);
          color: var(--ink);
        }

        &[aria-pressed="true"] {
          border-color: var(--accent);
          background: var(--pick);
          color: var(--accent-ink);
        }

        &:disabled {
          opacity: 0.45;
          cursor: default;
          pointer-events: none;
        }

        /* (Light, a shade darker than the accent: its white words read at 4.8:1.) */
        &.primary {
          --fill: light-dark(#c24e06, var(--accent));
          border-color: var(--fill);
          background: var(--fill);
          color: light-dark(#fff, #1c0c00);

          /* (Hovered, further from its words: darker light, lighter dark.) */
          &:hover {
            --fill: light-dark(#ad4505, #f59a57);
            color: light-dark(#fff, #1c0c00);
          }
        }

        svg {
          width: 14px;
          height: 14px;
        }
      }

      /* One of a few, picked: an interval, a range. A well, the one picked raised in it; more than fit, slid along. */
      .seg {
        position: relative;
        display: flex;
        gap: 2px;
        width: fit-content;
        max-width: 100%;
        padding: 2px;
        overflow-x: auto;
        border-radius: 9px;
        background: var(--well);
        scrollbar-width: none;

        &::-webkit-scrollbar {
          display: none;
        }

        button {
          flex: none;
          height: 28px;
          padding: 0 10px;
          border-radius: 7px;
          color: var(--soft);
          font-size: 12.5px;
          white-space: nowrap;

          &:hover {
            color: var(--ink);
          }

          &[aria-pressed="true"] {
            background: var(--raise);
            box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgb(0 0 0 / 0.1);
            color: var(--ink);
            font-weight: 500;
          }
        }
      }

      .card {
        margin-top: 20px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--pane);
      }

      .card-head {
        padding: 10px 10px 0;
      }

      /* Its history's rows, each its own height whatever's in them: what's read and its scale, the plot, its range or a
         note. Loading, failed or empty, a place as tall. */
      .readout {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        height: 62px;
        padding: 12px 10px 0 14px;

        div {
          display: grid;
          min-width: 0;
        }

        b {
          font-size: 20px;
          font-weight: 600;
          letter-spacing: -0.02em;
          line-height: 1.2;
          white-space: nowrap;
        }

        span {
          overflow: hidden;
          color: var(--faint);
          font-size: 12.5px;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
      }

      .plot {
        position: relative;
        height: var(--plot-height);
        touch-action: pan-y;

        canvas {
          display: block;
          width: 100%;
          height: 100%;
        }
      }

      .under {
        display: flex;
        align-items: center;
        height: 48px;
        padding: 0 10px;

        p {
          margin: 0 4px;
          color: var(--faint);
          font-size: 12px;
        }
      }

      .message {
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        height: calc(62px + var(--plot-height) + 48px);
        padding: 0 16px;
        color: var(--soft);
        text-align: center;

        p {
          margin: 0;
        }
      }

      .card-foot {
        margin: 0;
        padding: 10px 14px 12px;
        color: var(--faint);
        font-size: 12px;
      }

      .values {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;

        th,
        td {
          padding: 7px 14px;
          border-top: 1px solid var(--line);
          text-align: left;
        }

        th {
          color: var(--faint);
          font-weight: 500;
          white-space: nowrap;
        }

        td {
          overflow-wrap: anywhere;
        }
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
      }

      /* What it is, below: the server's words (its `code` as code), its unit and type. */
      .about {
        max-width: 44rem;
        margin: 28px 0 0;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--soft);
        text-wrap: pretty;

        code {
          padding: 0 4px;
          border-radius: 4px;
          background: var(--well);
          color: var(--ink);
          font-size: 0.88em;
        }

        &:empty {
          display: none;
        }
      }

      .facts {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        align-items: baseline;
        gap: 6px 20px;
        max-width: 44rem;
        margin: 14px 0 0;

        dt {
          color: var(--faint);
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.05em;
          text-transform: uppercase;
        }

        dd {
          margin: 0;
          text-wrap: pretty;
        }
      }

      /* (For a screen reader only: what a press did.) */
      .said {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* Search: its results where the columns were. */
      .results {
        flex: 1 0 auto;
        width: min(760px, 100%);
        margin: 0 auto;
        padding: 14px 10px 40px;

        h2 {
          margin: 0;
          padding: 4px 10px 10px;
          color: var(--faint);
          font-size: 12px;
          font-weight: 500;
        }

        ul {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        .row {
          min-height: 46px;
        }

        .where {
          grid-column: 1 / -1;
          overflow: hidden;
          color: var(--faint);
          font-size: 12px;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
      }

      /* (The result Enter opens, marked while typing: the field left, Enter there no longer.) */
      body:has(#q:focus) .results .row[aria-selected="true"] {
        background: var(--pick-strong);
      }

      /* A phone: the page scrolls under the bar, one column at a time, a way back to the one before. */
      .back {
        display: none;
      }

      @media (max-width: 739px) {
        :root {
          --plot-height: 240px;
        }

        html,
        body {
          height: auto;
        }

        /* (What's scrolled into sight, a row moved to, clear of the bar.) */
        html {
          scroll-padding-top: 56px;
        }

        body {
          display: block;
        }

        .bar {
          grid-template-columns: auto minmax(0, 1fr);
          gap: 12px;
        }

        .brand span,
        .count {
          display: none;
        }

        main {
          display: block;
          overflow: visible;
        }

        main > .column:not(:nth-last-child(1 of .column)),
        main > .home,
        main > .rest,
        main:has(> .series) > .column {
          display: none;
        }

        /* (A folder's name as its title, as a phone's lists have it, and how many series it holds.) */
        .column {
          width: auto;
          overflow: visible;
          border: 0;
          background: none;

          h2 {
            position: static;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            padding: 6px 16px 12px;
            background: none;
            color: var(--ink);
            font-size: 26px;
            letter-spacing: -0.02em;
            line-height: 1.2;
            text-transform: none;

            &:first-child {
              padding-top: 20px;
            }

            span {
              display: inline;
              flex: none;
              color: var(--faint);
              font-size: 13px;
              font-weight: 400;
              letter-spacing: 0;
            }
          }

          ul {
            padding: 0 8px 24px;
          }
        }

        .row {
          min-height: 46px;
        }

        .series {
          min-width: 0;
          overflow: visible;
          padding: 10px 16px 40px;
        }

        /* (The way back names the folder; the crumbs would say it again.) */
        .crumbs {
          display: none;
        }

        /* (A result's id under its name: both whole, the name first.) */
        .results .side {
          grid-column: 1 / -1;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .back {
          display: flex;
          align-items: center;
          gap: 4px;
          margin: 0 0 8px -6px;
          padding: 6px;
          color: var(--accent-ink);
          font-size: 14px;

          svg {
            width: 16px;
            height: 16px;
          }
        }

        .column .back {
          margin: 10px 10px 0;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .row,
        .chip,
        .seg button {
          transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="/"><img src="/assets/logo/logo.svg" alt="" />Bitview <span>/ Explorer</span></a>
      <form class="search" role="search" id="search-form">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <input type="search" id="q" placeholder="Search every series" aria-label="Search every series" aria-controls="found-list" autocomplete="off" spellcheck="false" />
        <kbd>/</kbd>
        <button type="button" class="clear" id="clear" aria-label="Clear the search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg></button>
      </form>
      <span class="count num" id="count"></span>
    </header>
    <main id="main"></main>
    <p class="said" id="said" aria-live="polite"></p>
    <script type="module">
      // @ts-check
      // Every series Bitview computes, as its client names them (the server's own module), browsed folder by folder;
      // search by the server's; a series' description, unit and intervals from the server, its history fetched and drawn.
      import { BitviewClient } from "/modules/bitview-client/index.js";

      const client = new BitviewClient({ baseUrl: location.origin });
      const $ = (/** @type {string} */ id) => /** @type {HTMLElement} */ (document.getElementById(id));
      const escape = (/** @type {string} */ text) => text.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[/** @type {"&"} */ (c)]);
      const grouped = new Intl.NumberFormat("en-US");

      const ICON = {
        chevron: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg>`,
        back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6" /></svg>`,
        copy: `<svg class="undone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V6a2 2 0 0 1 2-2h9" /></svg>`,
        copied: `<svg class="done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg>`,
        chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6" /></svg>`,
      };

      // ── Words: keys and ids as people write them (Studio's rules) ──

        const canvas = /** @type {any} */ (/** @type {HTMLElement} */ (event.target).closest?.("canvas"));
        if (!canvas?.pointAt || !plot) return;
        if (event.pointerType !== "mouse" && !event.buttons) return;
        if (event.pointerType === "touch") {
          if (!finger) return;
          const along = Math.abs(event.clientX - finger.x), across = Math.abs(event.clientY - finger.y);
          if (!finger.along && !(along > 6 && along > across)) return;
          finger.along = true;
        }
        readout(canvas.pointAt(event.clientX));
      });
      main.addEventListener("pointerdown", (event) => {
        const canvas = /** @type {any} */ (/** @type {HTMLElement} */ (event.target).closest?.("canvas"));
        if (!canvas?.pointAt || !plot) return;
        if (event.pointerType === "touch") finger = { x: event.clientX, y: event.clientY, along: false };
        else readout(canvas.pointAt(event.clientX));
      });
      for (const type of ["pointerup", "pointercancel"]) main.addEventListener(type, () => (finger = null));
      main.addEventListener("pointerleave", () => plot && hovered !== null && readout(null), true);

      // ── Keys in the columns: ↑ ↓ within one, → into a folder, ← back out ──
      main.addEventListener("keydown", (event) => {
        const row = /** @type {HTMLElement | null} */ (/** @type {HTMLElement} */ (event.target).closest?.(".column .row"));
        if (!row) return;
        const rows = [...(/** @type {HTMLElement} */ (row.closest("ul")).querySelectorAll(".row"))], i = rows.indexOf(row);
        const path = JSON.parse(/** @type {string} */ (row.dataset.path));
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          const next = /** @type {HTMLElement | undefined} */ (rows[i + (event.key === "ArrowDown" ? 1 : -1)]);
          if (!next) return;
          // (Wide, the row moved to opens beside, as Finder's columns do; narrow, the focus moves, nothing opens.)
          const to = JSON.parse(/** @type {string} */ (next.dataset.path));
          if (!narrow.matches) {
            go({ path: to }, true);
            return focusRow(to);
          }
          row.tabIndex = -1;
          next.tabIndex = 0;
          next.focus();
        } else if (event.key === "ArrowRight" && !nodeAt(path).name) {
          event.preventDefault();
          const first = nodeAt(path).kids?.[0];
          if (!first) return;
          go({ path: narrow.matches ? path : first.path });
          focusRow(first.path);
        } else if (event.key === "ArrowLeft" && path.length > 1) {
          event.preventDefault();
          // (Narrow, back to the folder this one's in, this folder's row lit there.)
          go({ path: narrow.matches ? path.slice(0, -2) : path.slice(0, -1) });
          focusRow(path.slice(0, -1));
        }
      });
      function focusRow(/** @type {string[]} */ path) {
        /** @type {HTMLElement | null} */ (main.querySelector(`.column .row[data-path="${CSS.escape(JSON.stringify(path))}"]`))?.focus();
      }

      render();
    </script>
  </body>
</html>
