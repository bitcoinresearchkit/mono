<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Its launch from a home screen, every showcase's. -->
    <script src="/assets/launch/launch.js" data-app="Explorer" data-color="#e8890c"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <title>Explorer · Bitview</title>
    <meta name="description" content="What it takes to get into the next Bitcoin block, and every block, transaction and address: where a payment is, when it gets in and what it paid, read exactly from the chain." />
    <!-- (Its address, wherever it's served from, and how a shared link previews: its card made by showcases/home.mjs --pictures.) -->
    <link rel="canonical" href="https://bitview.space/explorer/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bitview.space/explorer/" />
    <meta property="og:site_name" content="Bitview" />
    <meta property="og:title" content="Explorer · Bitview" />
    <meta property="og:description" content="What it takes to get into the next Bitcoin block, and every block, transaction and address: where a payment is, when it gets in and what it paid, read exactly from the chain." />
    <meta property="og:image" content="https://bitview.space/assets/cards/explorer.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Explorer: the block forming now, each of its transactions a square, beside what it takes to get in, under the chain's latest blocks" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="preload" href="/assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/Lilex.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: Inter;
        src: url("/assets/fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: Lilex;
        src: url("/assets/fonts/Lilex.woff2") format("woff2");
        font-weight: 100 700;
        font-display: swap;
      }

      :root {
        --bg: #fbfbfa;
        --ink: #0e0e10;
        --soft: #666670;
        --faint: #b3b3bb;
        --line: rgb(14 14 16 / 0.08);
        --hair: rgb(14 14 16 / 0.05);
        --tank: #f0f0f1;
        --well: #ffffff;
        --now: #f7931a;
        --now-text: #a95600;
        --profit: #13874a;
        --profit-text: #10773f;
        --loss: #d23a30;
        --miner: #f7931a;
        --mono: Lilex, ui-monospace, monospace;
        --gutter: 40px;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --ink: #ededf0;
          --soft: #8a8a94;
          --faint: #47474f;
          --line: rgb(255 255 255 / 0.08);
          --hair: rgb(255 255 255 / 0.045);
          --tank: #121215;
          --well: #151518;
          --now: #f7931a;
          --now-text: #f7931a;
          --profit: #3ccf7f;
          --profit-text: #3ccf7f;
          --loss: #ff6d60;
          color-scheme: dark;
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 Inter, system-ui, sans-serif;
        font-feature-settings: "tnum", "cv11";
        -webkit-text-size-adjust: none;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
        color: inherit;
      }
      h1,
      h2,
      h3,
      p,
      dl,
      dd,
      figure {
        margin: 0;
      }
      .vh {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      .soft {
        color: var(--soft);
      }
      .gain {
        color: var(--profit);
      }
      .lost {
        color: var(--loss);
      }
      .unit {
        color: var(--soft);
        font-weight: 450;
        letter-spacing: 0;
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
        border-radius: 6px;
      }
      /* A label over its figure: small, spaced capitals. */
      .label {
        color: var(--soft);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* The bar: the brand, the search, the price. */
      .bar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: grid;
        grid-template-columns: 1fr minmax(0, 520px) 1fr;
        align-items: center;
        gap: 20px;
        height: 60px;
        padding: 0 max(var(--gutter), env(safe-area-inset-right)) 0 max(var(--gutter), env(safe-area-inset-left));
        background: color-mix(in srgb, var(--bg) 85%, transparent);
        backdrop-filter: blur(20px) saturate(1.5);
        border-bottom: 1px solid var(--hair);
      }
      .brand {
        justify-self: start;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--ink);
        font-weight: 600;
        text-decoration: none;
        img {
          width: 18px;
          height: 18px;
        }
      }
      .find {
        position: relative;
        svg {
          position: absolute;
          top: 11px;
          left: 13px;
          width: 14px;
          height: 14px;
          color: var(--faint);
          pointer-events: none;
        }
        .reach {
          display: none;
        }
        input {
          width: 100%;
          height: 36px;
          padding: 0 36px;
          border: 0;
          border-radius: 10px;
          background: var(--tank);
          color: var(--ink);
          font: 13px var(--mono);
          outline: none;
          transition: background 120ms, box-shadow 120ms;
        }
        input::placeholder {
          color: var(--soft);
          font-family: Inter, sans-serif;
        }
        input:focus {
          background: var(--well);
          box-shadow: 0 0 0 1px var(--line), 0 6px 24px -8px rgb(0 0 0 / 0.25);
        }
        input::-webkit-search-cancel-button {
          display: none;
        }
        kbd {
          position: absolute;
          top: 8px;
          right: 9px;
          display: grid;
          place-items: center;
          min-width: 20px;
          height: 20px;
          border-radius: 5px;
          box-shadow: inset 0 0 0 1px var(--line);
          color: var(--soft);
          font: 11px var(--mono);
        }
        input:focus ~ kbd {
          display: none;
        }
        .miss {
          position: absolute;
          top: 44px;
          left: 0;
          padding: 5px 10px;
          border-radius: 8px;
          background: var(--ink);
          color: var(--bg);
          font-size: 12px;
          white-space: nowrap;
        }
        .miss:empty {
          display: none;
        }
      }
      .price {
        justify-self: end;
        font-size: 14px;
        font-weight: 550;
        b {
          display: inline-block;
          min-width: 4.15em;
          text-align: right;
        }
        span {
          margin-right: 8px;
          color: var(--soft);
          font-size: 12px;
          font-weight: 450;
        }
      }
      @media (hover: none) {
        /* A finger's reach around the brand, unseen (the narrow bar's own, below, is wider). */
        .brand {
          padding: 11px 0;
          margin: -11px 0;
        }
        .find kbd {
          display: none;
        }
        .find input {
          font-size: 16px;
        }
        /* A finger's reach around the field, unseen: a label behind it, so a tap on the bar there lands in it. */
        .find .reach {
          display: block;
          position: absolute;
          z-index: -1;
          inset-inline: 0;
          top: 50%;
          height: 44px;
          translate: 0 -50%;
        }
      }

      /* The page: one view at a time, on one grid. */
      .page {
        display: flow-root;
        max-width: 1440px;
        margin: 0 auto;
        padding: 0 var(--gutter) 96px;
      }
      .page > section + section {
        margin-top: 96px;
      }
      .sechead {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px 24px;
        margin-bottom: 18px;
        h2 {
          font-size: 17px;
          font-weight: 600;
          letter-spacing: -0.01em;
        }
        p {
          color: var(--soft);
          font-size: 13px;
        }
      }

      .live {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .live::before {
        content: "";
        flex: none;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--now);
        animation: ping 2.4s ease-out infinite;
      }
      @keyframes ping {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--now) 60%, transparent);
        }
        70%,
        100% {
          box-shadow: 0 0 0 7px transparent;
        }
      }

      /* What gets you in: the forming block's answer, large. */
      .answer {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 12px;
        margin: 18px 0 0 -4px;
        b {
          font-size: 104px;
          font-weight: 200;
          letter-spacing: -0.06em;
          line-height: 0.9;
        }
        /* (Its words kept together: beside the figure where they fit, under it where they don't, never split.) */
        span {
          color: var(--soft);
          font-size: 20px;
          white-space: nowrap;
        }
      }
      /* The past week: each hour's cheapest way in, against what gets in now. */
      .week {
        margin: 28px 0 24px;
        svg {
          display: block;
          width: 100%;
          height: 92px;
          overflow: visible;
        }
        text {
          fill: var(--soft);
          font: 11px Inter, sans-serif;
        }
        figcaption {
          margin-top: 30px;
          color: var(--soft);
          font-size: 12px;
        }
        figcaption b {
          color: var(--ink);
          font-weight: 550;
        }
      }
      .card {
        position: fixed;
        z-index: 10;
        pointer-events: none;
        display: grid;
        gap: 3px;
        min-width: 200px;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--well);
        box-shadow: 0 0 0 1px var(--line), 0 16px 40px -12px rgb(0 0 0 / 0.4);
        font-size: 12.5px;
        white-space: nowrap;
        header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
          margin-bottom: 4px;
          font-weight: 600;
        }
        header span {
          display: flex;
          align-items: center;
          gap: 6px;
          color: var(--soft);
          font-weight: 450;
        }
        div {
          display: flex;
          justify-content: space-between;
          gap: 18px;
          color: var(--soft);
        }
        div b {
          color: var(--ink);
          font-weight: 550;
        }
        b i {
          display: inline-block;
          width: 8px;
          height: 8px;
          margin-right: 6px;
          border-radius: 2px;
        }
      }
      .card[hidden] {
        display: none;
      }

      /* A block's map: every transaction a square, beside the block's answer. */
      .mapbox {
        position: relative;
        canvas {
          display: block;
          width: 100%;
          aspect-ratio: 1;
          border-radius: 6px;
          background: var(--tank);
          touch-action: pan-y;
          cursor: crosshair;
        }
      }
      .caption {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 20px;
        min-height: 36px;
        padding-top: 12px;
        color: var(--soft);
        font-size: 12px;
        b {
          color: var(--ink);
          font-weight: 550;
        }
      }
      .scale {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        i {
          width: 120px;
          height: 6px;
          border-radius: 3px;
        }
      }
      .keys {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        span {
          display: inline-flex;
          align-items: center;
          gap: 6px;
        }
        i {
          width: 8px;
          height: 8px;
          border-radius: 2px;
        }
      }
      .steps {
        display: inline-flex;
        gap: 6px;
      }
      .step {
        display: inline-grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 16px;
        background: var(--tank);
        color: var(--soft);
        cursor: pointer;
        svg {
          width: 15px;
          height: 15px;
        }
      }
      .step:hover:not(:disabled) {
        color: var(--ink);
      }
      .step:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 26px;
        padding: 0 11px;
        border-radius: 13px;
        background: color-mix(in srgb, var(--c, var(--soft)) 13%, transparent);
        color: var(--c, var(--soft));
        font-size: 12.5px;
        font-weight: 600;
        white-space: nowrap;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
        height: 28px;
        padding: 0 11px;
        border: 0;
        border-radius: 8px;
        background: var(--tank);
        color: var(--soft);
        font: 12px var(--mono);
        cursor: copy;
        position: relative;
        white-space: nowrap;
        span {
          min-width: 0;
          overflow: hidden;
        }
        svg {
          flex: none;
          width: 12px;
          height: 12px;
          opacity: 0.7;
        }
      }
      .pill::before {
        content: "";
        position: absolute;
        inset: -8px 0;
      }
      .pill:hover {
        color: var(--ink);
      }
      .lens {
        display: inline-flex;
        padding: 3px;
        border-radius: 9px;
        background: var(--tank);
        button {
          position: relative;
          height: 26px;
          padding: 0 12px;
          border: 0;
          border-radius: 6px;
          background: none;
          color: var(--soft);
          font-size: 12.5px;
          font-weight: 550;
          cursor: pointer;
        }
        button::before {
          content: "";
          position: absolute;
          inset: -9px 0;
        }
        button[aria-pressed="true"] {
          background: var(--well);
          color: var(--ink);
          box-shadow: 0 1px 3px rgb(0 0 0 / 0.14);
        }
      }
      /* What's in a block: each kind's share of its space. */
      .kinds {
        display: grid;
        .kind {
          display: grid;
          grid-template-columns: 10px minmax(0, 1fr) 64px 46%;
          align-items: center;
          gap: 12px;
          padding: 10px 0;
          border-top: 1px solid var(--hair);
        }
        i {
          width: 10px;
          height: 10px;
          border-radius: 3px;
        }
        span {
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        b {
          font-weight: 500;
          text-align: right;
        }
        em {
          position: relative;
          height: 4px;
          border-radius: 2px;
          background: var(--hair);
        }
        em::after {
          content: "";
          position: absolute;
          inset: 0 auto 0 0;
          width: var(--w);
          min-width: 2px;
          border-radius: 2px;
          background: var(--c);
        }
      }

      /* A transaction's flow. */
      .flow {
        position: relative;
        svg {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: visible;
        }
        text {
          fill: var(--ink);
          font: 500 12px Lilex, monospace;
        }
        .sub-text {
          fill: var(--soft);
          font: 400 11.5px Inter, sans-serif;
        }
        a:hover text {
          text-decoration: underline;
        }
        /* A finger's reach around each link, unseen, on touch only. */
        .grip {
          fill: transparent;
          pointer-events: none;
        }
        @media (hover: none) {
          .grip {
            pointer-events: fill;
          }
        }
      }
      .sides {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 56px;
        align-items: start;
      }
      .list {
        min-width: 0;
        h3 {
          display: flex;
          justify-content: space-between;
          padding-bottom: 10px;
        }
        ul {
          display: grid;
          margin: 0;
          padding: 0;
          list-style: none;
        }
        li {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 2px 16px;
          padding: 12px 0;
          border-top: 1px solid var(--hair);
        }
        .addr {
          font: 12.5px var(--mono);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        a.addr:hover {
          text-decoration: underline;
        }
        /* Reach for the links, unseen: the row's own padding, up for the address, down for the line under it. */
        a.addr {
          padding-top: 12px;
          margin-top: -12px;
        }
        small {
          padding: 2px 0 12px;
          margin: -2px 0 -12px;
        }
        small a {
          position: relative;
        }
        small a::before {
          content: "";
          position: absolute;
          inset: -2px 0 -12px;
        }
        .val {
          font-weight: 500;
          text-align: right;
          white-space: nowrap;
        }
        small {
          color: var(--soft);
          font-size: 12px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        small a:hover {
          color: var(--ink);
        }
        small:last-child {
          text-align: right;
        }
      }
      .more {
        padding: 12px 0 6px;
        border-top: 1px solid var(--hair);
        color: var(--soft);
        font-size: 12px;
      }
      .wait {
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 10px;
        min-height: 420px;
        color: var(--soft);
        text-align: center;
        a {
          color: var(--ink);
          font-weight: 550;
        }
        a:hover {
          text-decoration: underline;
        }
      }
      .page.busy > * {
        opacity: 0.45;
        transition: opacity 200ms;
      }

      /* The chain strip, over every block's view: a cell a block, its height, square, median fee and when; the mined
         ones left of a dotted now line, the forming one and those to come right of it, the open one marked by a ring
         and a notch on the rule under the strip. */
      .chain {
        position: relative;
        margin: 28px 0 0;
        border-bottom: 1px solid var(--line);
        ol {
          display: flex;
          justify-content: space-between;
          gap: 18px;
          margin: 0;
          padding: 4px 2px 24px;
          list-style: none;
          overflow-x: auto;
          scrollbar-width: none;
        }
      }
      .cell {
        position: relative;
        flex: none;
        a {
          display: grid;
          justify-items: center;
          width: 76px;
        }
        .ch {
          margin-bottom: 8px;
          color: var(--soft);
          font: 500 11.5px var(--mono);
        }
        .box {
          display: block;
          width: 56px;
          height: 56px;
          margin-bottom: 10px;
          border-radius: 8px;
          overflow: hidden;
          background: var(--tank);
          box-shadow: 0 0 0 1px var(--line);
          transition: box-shadow 120ms;
        }
        canvas {
          display: block;
          width: 100%;
          height: 100%;
        }
        .cf {
          font-size: 12.5px;
          font-weight: 550;
          white-space: nowrap;
        }
        .cw {
          margin-top: 2px;
          color: var(--soft);
          font-size: 11.5px;
          white-space: nowrap;
        }
      }
      .cell a:hover .box {
        box-shadow: 0 0 0 1px var(--soft);
      }
      .cell.on .ch {
        color: var(--ink);
      }
      .cell.on .box {
        box-shadow: 0 0 0 2px var(--ink);
      }
      .cell.next .box {
        box-shadow: 0 0 0 1.5px var(--now);
      }
      .cell.next.on .box {
        box-shadow: 0 0 0 2px var(--now), 0 0 0 5px color-mix(in srgb, var(--now) 25%, transparent);
      }
      .cell.next .ch,
      .cell.next .cw {
        color: var(--now-text);
      }
      .cell.ahead .box {
        opacity: 0.55;
      }
      .cell.ahead.on .box {
        opacity: 1;
      }
      /* The notch: a turned square on the strip's rule, under the open cell wherever the strip is scrolled to. */
      .chain::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: var(--at, 50%);
        width: 9px;
        height: 9px;
        border-left: 1px solid var(--line);
        border-top: 1px solid var(--line);
        background: var(--bg);
        transform: translate(-50%, 50%) rotate(45deg);
        opacity: var(--notch, 0);
      }
      .nowline {
        flex: none;
        width: 1px;
        margin: 0 -10px;
        background: repeating-linear-gradient(to bottom, var(--now) 0 4px, transparent 4px 8px);
        opacity: 0.7;
      }
      /* A view's answer beside its picture: a block's map, a block to come's bands, a transaction's timeline. */
      .focus .mapbox {
        width: 100%;
        max-width: 640px;
      }
      .mapbox .bands {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 6px;
        overflow: hidden;
        background: var(--tank);
        canvas {
          display: block;
          width: 100%;
          height: 100%;
        }
      }
      .lead-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px 18px;
        margin-top: 26px;
        .lead-title {
          margin-top: 0;
        }
      }
      .lead-lede .pool {
        width: 17px;
        height: 17px;
        margin-right: 7px;
        vertical-align: -3px;
      }
      .lead-lede b {
        color: var(--ink);
        font-weight: 550;
      }
      .focus .answer {
        margin-top: 22px;
      }
      .lower {

      /* A transaction: the answer on the left, its life on the right as one timeline, a row a moment, the line

      .focus {

      .tt-t {

      .tt-m {

      .tdot {

      li.now .tdot {

      .tsq,
      .ssq {

      /* Linked squares: a larger hit area than they show (the canvas takes the corners the clip would have). */
      a.tsq,

      .tt-w {

      @media (width < 1000px) {

          column-gap: 12px;
        }

      @media (prefers-reduced-motion: reduce) {

          .feedback-foot {

        min-height: 100dvh;

  </head>
  <body>
    <header class="bar">
      <a class="brand" href="/"><img src="/assets/logo/logo.svg" alt="" />Bitview</a>
      <form class="find" id="find" role="search" autocomplete="off">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="5" /><path d="m14 14-3.4-3.4" /></svg>
        <label class="reach" for="find-q"></label>
        <input
          id="find-q"
          name="q"
          type="search"
          placeholder="Search a block, transaction or address"
          aria-label="Search by block height or hash, transaction id or address"
          spellcheck="false"
          enterkeyhint="search"
        />
        <kbd>/</kbd>
        <span class="miss" id="miss" role="status"></span>
      </form>
      <span class="price" title="Bitcoin's price, read from the chain by the oracle"><span>BTC</span><b id="price">&nbsp;</b></span>
    </header>
    <h1 class="vh">Explorer</h1>
    <main class="page" id="view"><div class="wait">Loading</div></main>
    <footer class="feedback-foot"><button type="button" data-feedback>Feedback</button></footer>
    <div class="card" id="card" hidden></div>
    <script type="module">
      // ---------------------------------------------------------------- Reads, all from the server serving the page.
      const get = async (path) => {
        const r = await fetch(`/api${path}`);
        if (!r.ok) throw Object.assign(new Error(`${r.status} ${path}`), { status: r.status });
        return r.headers.get("content-type")?.includes("json") ? r.json() : r.text();
      };
      const series = async (id, index, start, end) => (await get(`/series/${id}/${index}?start=${start}&end=${end}`)).data;
      const memo = new Map();
      const once = (key, read) => {
        if (!memo.has(key)) memo.set(key, read().catch((e) => (memo.delete(key), Promise.reject(e))));
        return memo.get(key);
      };
      const priceAt = (h) => once(`price ${h}`, async () => (await series("price", "height", h, h + 1))[0]);
      // A mined block's transactions, as its map draws them: each one's size and effective fee rate. Kept, as a
      // mined block's never change (a reorg's replacement has another hash, and so another key).
      const blockTxs = new Map();
      const txsOf = (b) => {
        if (!blockTxs.has(b.id))
          blockTxs.set(
            b.id,
            (async () => {
              const [start] = await series("first_tx_index", "height", b.height, b.height + 1);
              const end = start + b.tx_count;
              const [rates, sizes] = await Promise.all([series("tx_effective_fee_rate", "tx_index", start, end), series("tx_vsize", "tx_index", start, end)]);
              return { start, txs: sizes.map((s, i) => ({ vsize: s, rate: rates[i], coinbase: i === 0 })) };
            })().catch((e) => (blockTxs.delete(b.id), Promise.reject(e))),
          );
        return blockTxs.get(b.id);
      };

      // ---------------------------------------------------------------- How numbers are written.
      const nf = (max, min = 0) => new Intl.NumberFormat("en-US", { maximumFractionDigits: max, minimumFractionDigits: min });
      const int = (n) => nf(0).format(n);
      const btc = (sats) => nf(8).format(sats / 1e8);
      const usd = (n) => {
        const a = Math.abs(n);
        const s = n < 0 ? "−" : "";
        if (a >= 1e9) return `${s}$${nf(2).format(a / 1e9)}B`;
        if (a >= 1e6) return `${s}$${nf(2).format(a / 1e6)}M`;
        if (a >= 1e4) return `${s}$${nf(1).format(a / 1e3)}K`;
        if (a >= 100) return `${s}$${nf(0).format(a)}`;
        return `${s}$${a.toFixed(2)}`;
      };
      // A small sum in dollars, never rounded to nothing: under a cent is "under $0.01".
      const cost = (n) => (n < 0.005 ? "under $0.01" : usd(n));
      const signed = (n) => (n >= 0 ? `+${usd(n)}` : usd(n));
      // A price, in whole dollars as written: $78,404.
      const dollars = (n) => (n < 100 ? `$${nf(2, 2).format(n)}` : `$${int(n)}`);
      const plural = (n, word) => `${int(n)} ${word}${n === 1 ? "" : "s"}`;
      const nth = (n) => `${int(n)}${n % 100 > 10 && n % 100 < 14 ? "th" : (["th", "st", "nd", "rd"][n % 10] ?? "th")}`;
      const tone = (n) => (n >= 0 ? "gain" : "lost");
      // A fee rate to the thousandth under 1 sat/vB, where the cheapest rates differ (0.106 against 0.115), and
      // coarser above.
      const rateNum = (r) => nf(r < 1 ? 3 : r < 10 ? 2 : r < 100 ? 1 : 0).format(r);
      const unit = (u) => ` <span class="unit">${u}</span>`;
      const rate = (r) => `${rateNum(r)} sat/vB`;
      const rateU = (r) => `${rateNum(r)}${unit("sat/vB")}`;
      const btcU = (sats) => `${btc(sats)}${unit("BTC")}`;
      // A rate rounded up to the places it's written in: what pays at least as much.
      const ceilRate = (r) => {
        const k = r < 1 ? 1000 : r < 10 ? 100 : r < 100 ? 10 : 1;
        return Math.ceil(r * k - 1e-9) / k;
      };
      const vbytes = (v) => (v >= 1e5 ? `${nf(2, 2).format(v / 1e6)} MvB` : `${int(v)} vB`);
      const weight = (w) => (w >= 1e5 ? `${nf(2).format(w / 1e6)} MWU` : `${int(w)} WU`);
      const bytes = (b) => (b >= 1e5 ? `${nf(2).format(b / 1e6)} MB` : `${nf(1).format(b / 1e3)} kB`);
      const short = (s, n = 6) => (s.length > 2 * n + 1 ? `${s.slice(0, n)}…${s.slice(-n)}` : s);
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
      const UNITS = [
        ["year", 365.25 * 86400],
        ["month", 30.44 * 86400],
        ["day", 86400],
        ["hour", 3600],
        ["minute", 60],
      ];
      // A span of time in its two largest units, in full: "3 years 6 months".
      const span = (s) => {
        const top = UNITS.findIndex(([, size]) => s >= size);
        if (top < 0) return "under a minute";
        const word = (n, name) => `${n} ${name}${n === 1 ? "" : "s"}`;
        const n = Math.floor(s / UNITS[top][1]);
        const next = UNITS[top + 1];
        const m = next ? Math.floor((s - n * UNITS[top][1]) / next[1]) : 0;
        return m > 0 && top < 3 ? `${word(n, UNITS[top][0])} ${word(m, next[0])}` : word(n, UNITS[top][0]);
      };
      const nowS = () => Date.now() / 1000;
      const ago = (t) => (nowS() - t < 60 ? "just now" : `${span(nowS() - t)} ago`);
      const clockTime = (t) => new Date(t * 1000).toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: false });
      const day = (t) => new Date(t * 1000).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
      // A moment as a timeline writes it: its time within a day, its day before that, its year only past this one's.
      const stamp = (t) =>
        Math.abs(nowS() - t) < 86400
          ? clockTime(t)
          : new Date(t * 1000).getFullYear() === new Date().getFullYear()
            ? new Date(t * 1000).toLocaleDateString("en-US", { month: "short", day: "numeric" })
            : day(t);
      // A simple payment's size: one input and two outputs, all native SegWit.
      const PAYMENT = 141;

      // ---------------------------------------------------------------- Fee rates as colours, on a log scale.
      // Made in OKLCH, its hue from indigo through magenta to amber, its lightness moving one way all along: on a dark
      // ground the cheapest recede and the dearest glow, on a light one the cheapest are pale and the dearest deep.
      const LOW = 0.1;
      const HIGH = 200;
      const RAMPS = {
        dark: [
          [0, 0.42, 0.12, 272],
          [0.3, 0.57, 0.17, 300],
          [0.55, 0.67, 0.2, 345],
          [0.75, 0.75, 0.18, 32],
          [0.9, 0.84, 0.16, 68],
          [1, 0.92, 0.13, 95],
        ],
        light: [
          [0, 0.8, 0.07, 280],
          [0.3, 0.66, 0.15, 298],
          [0.55, 0.58, 0.2, 345],
          [0.75, 0.6, 0.19, 28],
          [0.9, 0.64, 0.18, 50],
          [1, 0.56, 0.19, 30],
        ],
      };
      const srgb = (L, C, h) => {
        const a = C * Math.cos((h * Math.PI) / 180);
        const b = C * Math.sin((h * Math.PI) / 180);
        const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
        const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
        const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
        const lin = [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s];
        return lin.map((c) => Math.round(255 * Math.min(1, Math.max(0, c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055))));
      };
      // 256 steps for each scheme, each read by its place on the log scale.
      const steps = (anchors) =>
        Array.from({ length: 256 }, (_, k) => {
          const t = k / 255;
          let i = 1;
          while (i < anchors.length - 1 && t > anchors[i][0]) i++;
          const [t0, L0, C0, h0] = anchors[i - 1];
          const [t1, L1, C1, h1] = anchors[i];
          const u = Math.min(1, Math.max(0, (t - t0) / (t1 - t0)));
          let dh = h1 - h0;
          if (dh > 180) dh -= 360;
          if (dh < -180) dh += 360;
          return `rgb(${srgb(L0 + (L1 - L0) * u, C0 + (C1 - C0) * u, h0 + dh * u).join(" ")})`;
        });
      const RAMP = { dark: steps(RAMPS.dark), light: steps(RAMPS.light) };
      const lightScheme = matchMedia("(prefers-color-scheme: light)");
      const ramp = () => RAMP[lightScheme.matches ? "light" : "dark"];
      const place = (r) => (Math.log(Math.max(r, LOW)) - Math.log(LOW)) / (Math.log(HIGH) - Math.log(LOW));
      const feeColor = (r) => ramp()[Math.max(0, Math.min(255, Math.round(place(r) * 255)))];
      const scaleKey = () =>
        `<span class="scale"><span>0.1</span><i style="background:linear-gradient(to right,${ramp()
          .filter((_, k) => k % 32 === 0 || k === 255)
          .join(",")})"></i><span>200+ sat/vB</span></span>`;

      // ---------------------------------------------------------------- What kind each transaction is, for the map's other lens.
      // Each one's first kind in this order (a coinjoin that writes data is a coinjoin), its colour its own.
      const KINDS = [
        ["has_inscription", "Inscriptions", "#e35d9f"],
        ["is_coinjoin", "CoinJoins", "#8a6cf2"],
        ["is_consolidation", "Consolidations", "#27b3a1"],
        ["is_batch_payout", "Batch payouts", "#f0a23a"],
        ["has_op_return", "OP_RETURN data", "#5f97de"],
        ["is_cpfp_child", "Paying for a parent", "#8acf55"],
      ];
      const OTHER = "rgb(128 128 140 / 0.4)";
      const kindsOf = (b) =>
        once(`kinds ${b.id}`, async () => {
          const { start } = await txsOf(b);
          const flags = await Promise.all(KINDS.map(([id]) => series(id, "tx_index", start, start + b.tx_count)));
          return Array.from({ length: b.tx_count }, (_, i) => flags.findIndex((f) => f[i]));
        });

      // Each pool's logo, from the shared assets (a light ground's own where it has one), the default one if missing.
      const LIGHT_LOGOS = new Set(["foundryusa", "ultimuspool", "unknown", "whitepool"]);
      const poolMark = (slug) => {
        const name = /^[a-z0-9-]+$/.test(slug ?? "") ? slug : "unknown";
        const src = `/assets/pools/${name}${lightScheme.matches && LIGHT_LOGOS.has(name) ? ".light" : ""}.svg`;
        return `<img class="pool" src="${src}" alt="" onerror="this.onerror=null;this.src='/assets/pools/default${lightScheme.matches ? ".light" : ""}.svg'" />`;
      };
      const poolName = (pool) => esc(!pool || pool.name === "Unknown" ? "Unknown miner" : pool.name);

      const ICON = {
        prev: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m10 3-5 5 5 5"/></svg>`,
        next: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg>`,
        copy: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5.5" y="5.5" width="8" height="8" rx="1.8"/><path d="M10.5 3.2A1.8 1.8 0 0 0 8.8 2H4a2 2 0 0 0-2 2v4.8c0 .8.5 1.5 1.2 1.7"/></svg>`,
      };

      // ---------------------------------------------------------------- Packing a block into squares.
      // The skyline's runs, each [x, width, height], left to right: a square of side s goes where the highest run
      // under it is lowest (the leftmost of those), always at a run's start; the runs it covers give way to it.
      function pack(sides, S) {
        const n = sides.length;
        const X = new Int16Array(n);
        const Y = new Int16Array(n);
        const sky = [[0, S, 0]];
        let top = 0;
        for (let i = 0; i < n; i++) {
          const s = Math.min(sides[i], S);
          let best = 0;
          let bestY = Infinity;
          for (let j = 0; j < sky.length; j++) {
            const x = sky[j][0];
            if (x + s > S) break;
            let y = 0;
            for (let k = j; k < sky.length && sky[k][0] < x + s && y < bestY; k++) if (sky[k][2] > y) y = sky[k][2];
            if (y < bestY) {
              bestY = y;
              best = j;
              if (y === 0) break;
            }
          }
          const x = sky[best][0];
          X[i] = x;
          Y[i] = bestY;
          if (bestY + s > top) top = bestY + s;
          let last = best;
          while (last + 1 < sky.length && sky[last + 1][0] < x + s) last++;
          const end = sky[last][0] + sky[last][1];
          const runs = [[x, s, bestY + s]];
          if (end > x + s) runs.push([x + s, end - x - s, sky[last][2]]);
          sky.splice(best, last - best + 1, ...runs);
          // Neighbours at one height are one run.
          for (let j = Math.max(1, best); j <= Math.min(sky.length - 1, best + 1); j++)
            if (sky[j - 1][2] === sky[j][2]) {
              sky[j - 1][1] += sky[j][1];
              sky.splice(j, 1);
              j--;
            }
        }
        return { X, Y, top };
      }
      // Squares at scale k (a side's pixels per √vbyte), packed in a D-pixel field.
      const packAt = (txs, D, k, min) => {
        const sides = txs.map((t) => Math.max(min, Math.round(Math.sqrt(t.vsize) * k)));
        return { sides, packed: pack(sides, D), k };
      };
      // Sizes cluster (most transactions are a few sizes), so a scale that fits can fall short of the top by a step:
      // the packing is stretched upright to the block's own fullness (at most an eighth), and sideways the few pixels
      // the widest row leaves. Rectangles in device pixels, y from the top.
      function placed(txs, D, capacity, { sides, packed }) {
        const full = Math.min(1, txs.reduce((a, t) => a + t.vsize, 0) / capacity) * D;
        const sy = packed.top > 0 ? Math.min(1.125, Math.max(1, full / packed.top), D / packed.top) : 1;
        let right = 0;
        for (let i = 0; i < txs.length; i++) right = Math.max(right, packed.X[i] + sides[i]);
        const sx = right > D * 0.95 ? D / right : 1;
        const n = txs.length;
        const x = new Float32Array(n);
        const y = new Float32Array(n);
        const w = new Float32Array(n);
        const h = new Float32Array(n);
        for (let i = 0; i < n; i++) {
          x[i] = packed.X[i] * sx;
          w[i] = sides[i] * sx;
          h[i] = sides[i] * sy;
          y[i] = D - (packed.Y[i] + sides[i]) * sy;
        }
        return { x, y, w, h };
      }

      // ---------------------------------------------------------------- State.
      const $ = (id) => document.getElementById(id);
      const state = {
        tip: null, // the latest block's height
        projected: [], // the template's blocks, next first (stats only)
        confirmed: [], // the latest blocks, newest first
        next: null, // the next block's transactions, followed by its diffs
        view: null,
      };

      // ---------------------------------------------------------------- The live chain.
      // One read of each kind at a time: a slow answer is never overtaken by the next tick's.
      function alone(read) {
        let running = null;
        return () => (running ??= read().finally(() => (running = null)));
      }
      const readProjected = alone(async () => {
        const [projected, mempool] = await Promise.all([get("/v1/fees/mempool-blocks"), get("/mempool")]);
        state.projected = projected;
        state.mempool = mempool;
        drawHome().catch(() => {});
        if (state.view?.kind === "block" && /^next-\d+$/.test(state.view.ref)) viewQueued(Number(state.view.ref.slice(5)), true).catch(() => {});
        recheckTx().catch(() => {});
      });
      // The chain's tip by its hash, so a block replaced at the same height is seen too; its height from the same read.
      const readTip = alone(async () => {
        const hash = await get("/blocks/tip/hash");
        if (hash === state.tipHash) return;
        const was = { hash: state.tipHash, tip: state.tip };
        const shot = state.tipHash === undefined ? null : snapshot();
        const latest = await get("/v1/blocks");
        state.confirmed = latest;
        state.tip = latest[0].height;
        state.tipHash = latest[0].id;
        if (!state.booted) return;
        // What's open is read again: a block's confirmations, a transaction's status, an address's balance.
        memo.clear();
        readProjected().catch(() => {});
        await loadNext().catch(() => {});
        await render();
        // Only a block on top of the one shown flies: a replacement, or more than one at once, just appears.
        if (latest[0].previousblockhash === was.hash && latest[0].height === was.tip + 1) fly(shot, latest[0]);
      });
      // A block found: the forming block, as it was last drawn, shrinks into the chain strip as its newest square. A copy of
      // its own flies (the square keeps its map), from where the map is when it starts, only while the same home is open.
      let flight = null;
      function snapshot() {
        const c = $("map");
        if (state.view?.kind !== "home" || !c?.width || matchMedia("(prefers-reduced-motion: reduce)").matches) return null;
        const copy = Object.assign(document.createElement("canvas"), { width: c.width, height: c.height });
        copy.getContext("2d").drawImage(c, 0, 0);
        return { copy, nav: navigations };
      }
      function fly(shot, b) {
        const bead = document.querySelector(`#chain [data-p="${b.height}"] .box`);
        const from = $("map")?.getBoundingClientRect();
        if (!shot || !bead || !from || state.view?.kind !== "home" || shot.nav !== navigations) return;
        const to = bead.getBoundingClientRect();
        // Out of sight at either end, nothing to watch.
        if (from.bottom < 0 || to.top > innerHeight || from.top > innerHeight || to.bottom < 0) return;
        const { copy } = shot;
        Object.assign(copy.style, { position: "fixed", left: `${from.left}px`, top: `${from.top}px`, width: `${from.width}px`, height: `${from.height}px`, zIndex: 20, borderRadius: "4px", pointerEvents: "none", transformOrigin: "0 0" });
        document.body.append(copy);
        bead.style.opacity = "0";
        const k = to.width / from.width;
        flight = copy.animate([{ transform: "none" }, { transform: `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(${k})` }], { duration: 950, easing: "cubic-bezier(0.55, 0, 0.15, 1)" });
        flight.finished
          .catch(() => {})
          .finally(() => {
            copy.remove();
            bead.style.opacity = "";
          });
      }
      async function readPrice() {
        state.price = Number(await get("/oracle/price"));
        $("price").textContent = `$${int(state.price)}`;
      }
      async function readDifficulty() {
        state.difficulty = await get("/v1/difficulty-adjustment");
      }
      // Each block's cheapest effective fee rate over the past week (1,008 blocks), read again with each new block.
      // Each block's cheapest effective fee rate and its time, a few more blocks than a week holds, read for each tip
      // (by its hash: a block replaced at the same height reads them again; a read the tip moved under, again).
      const readWeek = alone(async () => {
        for (;;) {
          const hash = state.tipHash;
          if (state.week?.hash === hash) return;
          const end = state.tip + 1;
          const start = Math.max(0, end - 1200);
          const [lows, times] = await Promise.all([series("tx_effective_fee_rate_min", "height", start, end), series("timestamp", "height", start, end)]);
          if (state.tipHash !== hash) continue;
          state.week = { hash, lows, times };
          return drawWeek();
        }
      });
      // The next block's transactions, as the template has them, then only what changed. Only the latest read is kept.
      const slim = (t) => ({ txid: t.txid, vsize: Math.ceil(t.weight / 4), rate: t.fee / Math.ceil(t.weight / 4), fee: t.fee, born: 0 });
      let nextReads = 0;
      function loadNext() {
        const n = ++nextReads;
        return get("/mempool-blocks/0").then((b) => {
          if (n === nextReads) state.next = { hash: b.hash, stats: b.stats, txs: b.transactions.map(slim) };
        });
      }
      const followNext = alone(async () => {
        if (!state.next) return;
        const n = nextReads;
        let diff;
        try {
          diff = await get(`/mempool-blocks/0/diff/${state.next.hash}`);
        } catch {
          await loadNext();
          return state.view?.kind === "home" && render();
        }
        // A diff applies only to the copy it was asked against (a new block may have replaced it meanwhile).
        if (n !== nextReads || diff.since !== state.next.hash || diff.hash === state.next.hash) return;
        nextReads++;
        const born = performance.now();
        const txs = [];
        for (const entry of diff.order)
          if (Array.isArray(entry)) txs.push(...state.next.txs.slice(entry[0], entry[0] + entry[1]));
          else txs.push({ ...slim(entry), born });
        state.next = { hash: diff.hash, stats: diff.stats, txs };
        if (state.view?.kind === "home") {
          map.set(state.next.txs);
          drawForming();
        }
      });

      // ---------------------------------------------------------------- What it takes to get in.
      // A projected block's entry: a full block's cheapest, or, where a block has room to spare or isn't there at
      // all, the cheapest the mempool holds that pays (one paying nothing gets in only with a child paying for it).
      // To be in within n blocks, a transaction pays what gets it into one.
      const floorRate = () => {
        const rates = state.mempool.fee_histogram.map(([r]) => r).filter((r) => r > 0);
        return rates.length ? Math.min(...rates) : 0.1;
      };
      const entry = (b) => (b && b.blockVSize >= 995000 ? Math.max(b.feeRange[0], floorRate()) : floorRate());
      const within = (n) => ceilRate(Math.min(...Array.from({ length: n }, (_, i) => entry(state.projected[i]))));
      const paymentSats = (r) => Math.ceil(r * PAYMENT - 1e-9);
      const paymentCost = (r) => (state.price ? cost((paymentSats(r) / 1e8) * state.price) : `${int(paymentSats(r))} sats`);

      // ---------------------------------------------------------------- The home: the forming block's view.
      // Every page is one of three, a block, a transaction or an address; the home is the block forming now: the
      // chain strip over it, what gets you in beside its map as it fills, then what getting in took each hour of the
      // past week.
      async function viewHome() {
        const v = state.view;
        const chain = await chainAround({ kind: "next" });
        if (state.view !== v) return;
        $("view").innerHTML = `${chainView(chain)}
          <div class="focus forming">
            <div class="lead">
              <p class="lead-kicker"><span class="chip live" id="forming">Forming</span></p>
              <p class="answer"><b id="answer">&nbsp;</b><span>sat/vB gets you in</span></p>
              <p class="lead-lede" id="say">&nbsp;</p>
              <dl class="lead-figs" id="alts">${fig("&nbsp;", "&nbsp;").repeat(4)}</dl>
              <p class="lead-note" id="chainsay">&nbsp;</p>
            </div>
            <figure class="mapbox"><canvas id="map" role="img" aria-label="The next block's transactions, each a square as large as its size, coloured by its fee rate"></canvas>
              <figcaption class="caption"><span id="next-caption">&nbsp;</span>${scaleKey()}</figcaption></figure>
          </div>
          <section class="lower" aria-label="What it took to get in, each hour of the past week">
            <div class="sechead"><h2>The past week</h2><p>what it took to get in, each hour</p></div>
            <figure class="week"><svg id="week" role="img" aria-label="Each hour's cheapest way into a block over the past week, against what gets in now"></svg><figcaption id="week-say">&nbsp;</figcaption></figure>
          </section>`;
        paintChain(chain);
        map.mount($("map"), (i, t) => go(url.tx(t.txid)));
        if (state.next) map.set(state.next.txs);
        drawForming();
        readWeek().catch(() => {});
      }
      // The template and the queue read again: the strip's blocks to come and the answer with them.
      async function drawHome() {
        if (state.view?.kind !== "home" || !$("answer")) return;
        const v = state.view;
        const chain = await chainAround({ kind: "next" });
        if (state.view !== v || !$("chain")) return;
        // The mined squares kept as drawn: only the forming one and those to come change between blocks.
        const was = chainState();
        $("chain").outerHTML = chainView(chain);
        paintChain(chain, was.scroll, was.drawn);
        was.refocus();
        drawForming();
        drawWeek();
      }

      // The week's hours, each its cheapest way in, as a line on a log scale, now's answer a dashed line across it, the days marked.
      function drawWeek() {
        const svg = $("week");
        const w = state.week;
        if (!svg || !w || !w.lows.length || !state.projected.length) return;
        const W = svg.clientWidth;
        const H = svg.clientHeight;
        const now = within(1);
        // By the hour, by the blocks' own times: the cheapest any block of the hour took (some pools take nothing under
        // 1 sat/vB, so one block's cheapest says what that pool took, the hour's what it took to get in at all). An hour
        // with no block has no point; the line runs past it.
        const t1 = nowS();
        const t0 = t1 - 7 * 86400;
        const hours = new Map();
        w.times.forEach((t, i) => {
          if (t < t0 || w.lows[i] === null) return;
          const hour = Math.floor(Math.min(t, t1) / 3600);
          hours.set(hour, Math.min(hours.get(hour) ?? Infinity, Math.max(0.05, w.lows[i])));
        });
        const points = [...hours].sort((a, b) => a[0] - b[0]).map(([hour, r]) => [Math.min(t1, hour * 3600 + 1800), r]);
        if (!points.length) return;
        const values = points.map(([, r]) => r);
        const lo = Math.min(now, ...values) * 0.85;
        const hi = Math.max(now, ...values) * 1.15;
        const x = (t) => ((t - t0) / (t1 - t0)) * W;
        const y = (r) => H - ((Math.log(r) - Math.log(lo)) / (Math.log(hi) - Math.log(lo))) * H;
        const line = points.map(([t, r], i) => `${i ? "L" : "M"}${x(t).toFixed(1)},${y(r).toFixed(1)}`).join("");
        const parts = [];
        // Each midnight a hairline, the day after it named under the chart where it has room.
        const midnight = new Date(t1 * 1000);
        midnight.setHours(0, 0, 0, 0);
        for (let m = midnight.getTime() / 1000; m > t0; m -= 86400) {
          parts.push(`<line x1="${x(m)}" x2="${x(m)}" y1="0" y2="${H}" style="stroke:var(--hair)"/>`);
          if (x(m) + 34 < W) parts.push(`<text x="${x(m) + 6}" y="${H + 16}">${new Date(m * 1000).toLocaleDateString("en-US", { weekday: "short" })}</text>`);
        }
        parts.push(`<path d="${line} L${x(points.at(-1)[0])},${H} L${x(points[0][0])},${H} Z" style="fill:${feeColor(now)}" opacity="0.12"/>`);
        parts.push(`<path d="${line}" fill="none" style="stroke:${feeColor(now)}" stroke-width="1.25" stroke-linejoin="round"/>`);
        parts.push(`<line x1="0" x2="${W}" y1="${y(now)}" y2="${y(now)}" style="stroke:var(--ink)" stroke-dasharray="2 3" opacity="0.6"/>`);
        parts.push(`<circle cx="${W}" cy="${y(now)}" r="3.5" style="fill:var(--now)"/>`);
        svg.innerHTML = parts.join("");
        // How now compares with the week's hours.
        const dearer = values.filter((r) => r > now).length / values.length;
        const cheaper = values.filter((r) => r < now).length / values.length;
        const pct = (f) => `${nf(0).format(f * 100)}%`;
        $("week-say").innerHTML = `What it took to get in, each hour of the past week: <b>${rateNum(Math.min(...values))}</b> to <b>${rate(Math.max(...values))}</b>.${
          dearer > cheaper ? ` Now is cheaper than ${pct(dearer)} of them.` : cheaper > dearer ? ` Now is dearer than ${pct(cheaper)} of them.` : ""
        }`;
      }
      // The forming block's answer: what gets you in, what waiting longer saves, what's in it so far and waiting.
      function drawForming() {
        if (state.view?.kind !== "home" || !$("answer")) return;
        const last = state.confirmed[0];
        if (last) $("forming").textContent = `Forming for ${nowS() - last.timestamp < 60 ? "under a minute" : span(nowS() - last.timestamp)}`;
        const s = state.next?.stats;
        if (s) {
          const fresh = state.next.txs.filter((t) => t.born && performance.now() - t.born < 60000).length;
          $("next-caption").innerHTML = `<b>${int(s.nTx)}</b> transactions${fresh ? `, ${int(fresh)} just in` : ""}`;
        }
        if (!state.mempool || !state.projected.length) return;
        const r = within(1);
        const m = state.mempool;
        $("answer").textContent = rateNum(r);
        $("say").innerHTML = `<b>${paymentCost(r)}</b> for a simple payment, in this block, about ten minutes away.`;
        $("alts").innerHTML =
          fig("Within 30 minutes", rateU(within(3)), paymentCost(within(3))) +
          fig("Within an hour", rateU(within(6)), paymentCost(within(6))) +
          (s ? fig("In it so far", `${int(s.nTx)}${unit("txs")}`, `${btc(s.totalFees)} BTC in fees${state.price ? `, ${usd((s.totalFees / 1e8) * state.price)}` : ""}`) : fig("In it so far", "&nbsp;")) +
          fig("Waiting", `${int(m.count)}${unit("txs")}`, `${nf(1).format(m.vsize / 1e6)} blocks of them`);
        // Where the chain stands: its next difficulty adjustment and halving.
        const d = state.difficulty;
        const halving = (Math.floor(state.tip / 210000) + 1) * 210000;
        $("chainsay").innerHTML = [
          d &&
            `Difficulty <b class="${tone(d.difficultyChange)}">${d.difficultyChange >= 0 ? "+" : "−"}${nf(2).format(Math.abs(d.difficultyChange))}%</b> in ${plural(d.remainingBlocks, "block")}, around ${new Date(d.estimatedRetargetDate).toLocaleDateString("en-US", { month: "short", day: "numeric" })}`,
          `the halving in ${plural(halving - state.tip, "block")}`,
        ]
          .filter(Boolean)
          .join(" · ");
      }

      // ---- Each mined block's square: its map, small, drawn once its transactions are read, for the clock and the
      // ledger alike (each copies it at its own size).
      const THUMB = 144;
      const thumbs = new Map();
      // A block's transactions painted small on a canvas, packed as its map packs them.
      function paintTxs(canvas, txs) {
        const D = canvas.width;
        const ctx = canvas.getContext("2d");
        const k = Math.sqrt((D * D) / Math.max(1e6, txs.reduce((a, t) => a + t.vsize, 0))) * 0.94;
        const r = placed(txs, D, 1e6, packAt(txs, D, k, 1));
        const miner = MINER();
        for (let i = 0; i < txs.length; i++) {
          ctx.fillStyle = txs[i].coinbase ? miner : feeColor(txs[i].rate);
          ctx.fillRect(r.x[i], r.y[i], r.w[i], r.h[i]);
        }
        return canvas;
      }
      const thumbOf = (b) => {
        if (!thumbs.has(b.id))
          thumbs.set(
            b.id,
            txsOf(b).then(({ txs }) => paintTxs(Object.assign(document.createElement("canvas"), { width: THUMB, height: THUMB }), txs)).catch((e) => (thumbs.delete(b.id), Promise.reject(e))),
          );
        return thumbs.get(b.id);
      };
      // A canvas showing a block's square, its median colour until the map is drawn.
      const square = (b, size, className) => {
        const canvas = Object.assign(document.createElement("canvas"), { className });
        canvas.width = canvas.height = Math.round(size * Math.max(2, devicePixelRatio));
        canvas.style.background = feeColor(b.extras.medianFee);
        thumbOf(b)
          .then((src) => {
            canvas.getContext("2d").drawImage(src, 0, 0, canvas.width, canvas.height);
            canvas.style.background = "var(--tank)";
          })
          .catch(() => {});
        return canvas;
      };
      // ---------------------------------------------------------------- The chain strip, over every block's view.
      // The blocks around the one open, each its square, median fee and when: the mined ones to the left, the forming
      // one, those to come to the right, the open one marked and kept in view however narrow the screen.
      const SIDE = 6; // blocks shown each side of the open one
      // Places along the chain: a mined block by its height, the forming one tip + 1, the i-th to come tip + 1 + i.
      async function chainAround(open) {
        const end = state.tip + state.projected.length; // the last place to come
        const at = open.kind === "mined" ? open.h : open.kind === "next" ? state.tip + 1 : state.tip + 1 + open.i;
        const lo = Math.max(0, Math.min(at - SIDE, end - 2 * SIDE));
        const hi = Math.min(end, lo + 2 * SIDE);
        // The mined ones, from the latest blocks known or read a page (ten, the newest first) or two.
        const top = Math.min(hi, state.tip);
        const known = new Map(state.confirmed.map((b) => [b.height, b]));
        if (lo <= top && !(known.has(lo) && known.has(top))) for (const b of (await Promise.all([top, top - 10].filter((h) => h >= lo).map((h) => get(`/v1/blocks/${h}`)))).flat()) known.set(b.height, b);
        const cells = [];
        for (let p = lo; p <= hi; p++) {
          const on = p === at;
          if (p <= state.tip) {
            const b = known.get(p);
            if (b) cells.push({ p, on, kind: "mined", b, href: url.block(p), fee: b.extras.medianFee, when: stamp(b.timestamp) });
          } else {
            const i = p - state.tip - 1;
            const q = state.projected[i];
            if (q) cells.push({ p, on, kind: i ? "ahead" : "next", i, href: url.ahead(i), fee: q.medianFee, when: i ? `~${clockTime(nowS() + (i + 1) * 600)}` : "forming" });
          }
        }
        return cells;
      }
      function chainView(cells) {
        return `<nav class="chain" id="chain" aria-label="The chain around this block"><ol>${cells
          .map(
            (c) => `${c.kind === "next" ? `<li class="nowline" aria-hidden="true"></li>` : ""}<li class="cell ${c.kind}${c.on ? " on" : ""}" data-p="${c.p}">
              <a href="${c.href}"${c.on ? ` aria-current="page"` : ""} aria-label="${c.kind === "mined" ? `Block ${int(c.p)}` : c.kind === "next" ? "The block forming now" : `The ${nth(c.i + 1)} block to come`}">
                <span class="ch">${int(c.p)}</span><span class="box"></span><span class="cf">${rateU(c.fee)}</span><span class="cw">${c.when}</span>
              </a></li>`,
          )
          .join("")}</ol></nav>`;
      }
      // The strip as it is, to draw it again the same: its scroll, its drawn mined squares, the cell with the focus.
      function chainState() {
        const nav = $("chain");
        const focused = document.activeElement?.closest?.("#chain .cell")?.dataset.p;
        return {
          scroll: nav ? nav.querySelector("ol").scrollLeft : null,
          drawn: new Map([...(nav?.querySelectorAll(".cell.mined") ?? [])].map((li) => [li.dataset.p, li.querySelector("canvas")])),
          refocus: () => focused && $("chain")?.querySelector(`[data-p="${focused}"] a`)?.focus({ preventScroll: true }),
        };
      }
      // Each cell's square, and the open one in view.
      function paintChain(cells, keep = null, drawn = new Map()) {
        const ol = $("chain")?.querySelector("ol");
        if (!ol) return;
        for (const c of cells) {
          const box = ol.querySelector(`[data-p="${c.p}"] .box`);
          box.append(c.kind === "mined" ? (drawn.get(String(c.p)) ?? square(c.b, 56, "")) : c.kind === "next" ? formingSquare(56) : bandsOf(state.projected[c.i], 56));
        }
        const on = ol.querySelector(".on");
        if (!on) return;
        if (keep !== null) ol.scrollLeft = keep;
        else if (ol.scrollWidth > ol.clientWidth) ol.scrollLeft = on.offsetLeft - (ol.clientWidth - on.offsetWidth) / 2;
        // The notch follows the open cell as the strip scrolls, shown while the cell is in view.
        const nav = ol.parentElement;
        const place = () => {
          const x = on.offsetLeft - ol.scrollLeft + on.offsetWidth / 2;
          nav.style.setProperty("--at", `${x}px`);
          nav.style.setProperty("--notch", x > 0 && x < nav.clientWidth ? 1 : 0);
        };
        ol.addEventListener("scroll", place, { passive: true });
        place();
      }
      // The forming block's square, from what's in it now.
      function formingSquare(size) {
        const c = document.createElement("canvas");
        c.width = c.height = Math.round(size * Math.max(2, devicePixelRatio));
        if (state.next?.txs.length) paintTxs(c, state.next.txs);
        return c;
      }

      // A card over its target, kept inside the window: under it where there's no room above.
      function placeCard(card, cx, top, bottom) {
        card.hidden = false;
        const { width, height } = card.getBoundingClientRect();
        card.style.left = `${Math.min(innerWidth - width - 8, Math.max(8, cx - width / 2))}px`;
        card.style.top = `${top - height - 12 >= 8 ? top - height - 12 : bottom + 12}px`;
      }

      // ---------------------------------------------------------------- A block's map.
      // Every transaction a square, its area its size, packed from the bottom left in the block's order (the
      // highest paying at the bottom, as a block fills): each set on the lowest ground it fits, then the leftmost.
      // One canvas, drawn again only when its transactions change, its size or its lens does, or a new one's glow fades.
      const MINER = () => getComputedStyle(document.documentElement).getPropertyValue("--miner");
      const map = (() => {
        let canvas;
        let txs = [];
        let colors = [];
        let colorOf = (t) => feeColor(t.rate);
        let describe = null;
        let capacity = 1e6;
        let onOpen = null;
        let glowing = false;
        let lit = -1;
        let layout = null; // { S, D, gap, rects, hit }: rectangles in device pixels; hit by CSS pixel
        let fitted = null; // the scale the last layout took, at its size in device pixels
        const GLOW = 2400;

        // Sides in whole device pixels (at least two to a CSS pixel, so even a phone's smallest squares round finely),
        // the area of each its share of the block. Squares never tile perfectly: where they'd overflow, the largest
        // scale that fits, found by halving (a full block then fills the map to its top).
        function lay() {
          const S = Math.round(canvas.clientWidth);
          if (!S) return null;
          const Q = Math.max(2, Math.round(devicePixelRatio));
          const D = S * Q;
          const gap = Q >= 3 ? 2 : Q;
          const ceiling = Math.sqrt((D * D) / capacity);
          const at = (k) => packAt(txs, D, k, gap + 2);
          const fits = (t) => t.packed.top <= D;
          const done = (best) => {
            fitted = { D, k: best.k };
            return finish(S, Q, D, gap, best);
          };
          // From the scale last found for this size, in small steps: the next block's updates change it little.
          if (fitted?.D === D && fitted.k <= ceiling) {
            let best = at(fitted.k);
            for (let i = 0; i < 6 && !fits(best); i++) best = at(best.k * 0.993);
            // Found where a step up overflows; one still fitting after three is a different block: searched afresh.
            if (fits(best))
              for (let i = 0; i < 3; i++) {
                const up = at(best.k * 1.007);
                if (!fits(up)) return done(best);
                best = up;
              }
          }
          let hi = ceiling;
          let best = at(hi);
          if (!fits(best)) {
            let lo = hi;
            while (!fits(best)) (hi = lo), (lo *= 0.85), (best = at(lo));
            for (let i = 0; i < 6; i++) {
              const tried = at((lo + hi) / 2);
              if (fits(tried)) (lo = tried.k), (best = tried);
              else hi = tried.k;
            }
          }
          return done(best);
        }
        // Which transaction each CSS pixel shows, for the pointer.
        function finish(S, Q, D, gap, best) {
          const rects = placed(txs, D, capacity, best);
          const hit = new Int32Array(S * S).fill(-1);
          for (let i = 0; i < txs.length; i++) {
            const x0 = Math.floor(rects.x[i] / Q);
            const x1 = Math.min(S, Math.ceil((rects.x[i] + rects.w[i]) / Q));
            const y0 = Math.max(0, Math.floor(rects.y[i] / Q));
            const y1 = Math.min(S, Math.ceil((rects.y[i] + rects.h[i]) / Q));
            for (let y = y0; y < y1; y++) hit.fill(i, y * S + x0, y * S + x1);
          }
          return { S, D, gap, rects, hit };
        }
        function draw() {
          if (!canvas?.isConnected) return false;
          const S = Math.round(canvas.clientWidth);
          if (!layout || layout.S !== S || layout.D !== S * Math.max(2, Math.round(devicePixelRatio))) layout = lay();
          if (!layout) return false;
          const { D, gap, rects } = layout;
          if (canvas.width !== D || canvas.height !== D) canvas.width = canvas.height = D;
          const ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, D, D);
          const now = performance.now();
          let fresh = false;
          for (let i = 0; i < txs.length; i++) {
            const w = rects.w[i] - gap;
            const h = rects.h[i] - gap;
            ctx.globalAlpha = 1;
            ctx.fillStyle = colors[i];
            ctx.fillRect(rects.x[i], rects.y[i], w, h);
            const age = txs[i].born ? now - txs[i].born : GLOW;
            if (age < GLOW) fresh = true;
            const l = i === lit ? 0.6 : age < GLOW ? 1 - age / GLOW : 0;
            if (l > 0) {
              ctx.globalAlpha = l;
              ctx.fillStyle = "#fff";
              ctx.fillRect(rects.x[i], rects.y[i], w, h);
            }
          }
          ctx.globalAlpha = 1;
          return fresh;
        }
        function glow() {
          if (glowing) return;
          glowing = true;
          const step = () => (draw() ? requestAnimationFrame(step) : (glowing = false));
          requestAnimationFrame(step);
        }
        // Which transaction lies under a point on the canvas.
        function at(e) {
          if (!layout) return -1;
          const r = canvas.getBoundingClientRect();
          const x = Math.floor(((e.clientX - r.left) / r.width) * layout.S);
          const y = Math.floor(((e.clientY - r.top) / r.height) * layout.S);
          if (x < 0 || y < 0 || x >= layout.S || y >= layout.S) return -1;
          return layout.hit[y * layout.S + x];
        }
        const card = $("card");
        const light = (i) => {
          if (i === lit) return;
          lit = i;
          draw();
        };
        function hover(e) {
          const i = at(e);
          light(i);
          if (i < 0) return (card.hidden = true);
          const t = txs[i];
          card.innerHTML = t.coinbase
            ? `<header>The coinbase</header><div>the miner's reward</div>`
            : `<header><span><b><i style="background:${colors[i]}"></i></b>${rate(t.rate)}</span>${describe?.(i) ? `<span>${describe(i)}</span>` : ""}</header><div>Size<b>${vbytes(t.vsize)}</b></div>${
                t.fee !== undefined ? `<div>Fee<b>${int(t.fee)} sats${state.price ? `, ${cost((t.fee / 1e8) * state.price)}` : ""}</b></div>` : ""
              }`;
          placeCard(card, e.clientX, e.clientY - 4, e.clientY + 16);
        }
        const recolor = () => (colors = txs.map((t, i) => (t.coinbase ? MINER() : colorOf(t, i))));
        return {
          mount(el, open) {
            canvas = el;
            onOpen = open;
            layout = null;
            colorOf = (t) => feeColor(t.rate);
            describe = null;
            canvas.addEventListener("pointermove", hover);
            canvas.addEventListener("pointerleave", () => {
              card.hidden = true;
              light(-1);
            });
            canvas.addEventListener("click", (e) => {
              const i = at(e);
              if (i >= 0) onOpen(i, txs[i]);
            });
            new ResizeObserver(() => draw()).observe(canvas);
          },
          set(list, size = 1e6) {
            txs = list;
            lit = -1;
            capacity = Math.max(size, list.reduce((s, t) => s + t.vsize, 0));
            layout = null;
            recolor();
            draw() && glow();
          },
          // A lens: each transaction's colour, and a word on it for the pointer.
          lens(color, say = null) {
            colorOf = color;
            describe = say;
            recolor();
            draw();
          },
        };
      })();

      // ---------------------------------------------------------------- Where each place lives: mempool.space's paths
      // under the explorer's own folder (served the page at any address under it).
      const BASE = location.pathname.match(/^(.*?\/explorer\/)/)?.[1] ?? "/explorer/";
      const url = {
        block: (ref) => `${BASE}block/${ref}`,
        ahead: (i) => (i ? `${BASE}mempool-block/${i}` : BASE),
        tx: (txid) => `${BASE}tx/${txid}`,
        address: (a) => `${BASE}address/${encodeURIComponent(a)}`,
      };
      const linkTo = (r) => (r.kind === "home" ? BASE : r.kind === "tx" ? url.tx(r.txid) : r.kind === "address" ? url.address(r.address) : /^next-\d+$/.test(r.ref) ? url.ahead(Number(r.ref.slice(5))) : url.block(r.ref));

      // ---------------------------------------------------------------- Views past the home.
      const fig = (name, value, note = "") => `<div><dt class="label">${name}</dt><dd>${value}</dd><small>${note || "&nbsp;"}</small></div>`;
      const copyPill = (text, label = short(text, 8)) =>
        `<button class="pill" type="button" data-copy="${esc(text)}" title="Copy ${esc(text)}"><span>${esc(label)}</span>${ICON.copy}</button>`;

      // ---------------------------------------------------------------- A block's view: the chain strip, then its answer
      // beside its map (a block to come, its fee rates as bands), then what's inside it.
      const neighbours = (h) => `<span class="steps"><button class="step" type="button" data-go="${h - 1}" ${h === 0 ? "disabled" : ""} aria-label="The block before">${ICON.prev}</button><button class="step" type="button" data-go="${h + 1}" ${h >= state.tip ? "disabled" : ""} aria-label="The block after">${ICON.next}</button></span>`;
      const lensSwitch = `<div class="lens" id="lens" role="group" aria-label="Colour the map by"><button type="button" data-lens="fee" aria-pressed="true">Fee rate</button><button type="button" data-lens="kind" aria-pressed="false">Kind</button></div>`;
      // Wide: a figure across the whole row of figures.
      const wide = (html) => html.replace("<div>", `<div class="wide">`);

      async function viewQueued(n, again = false) {
        const b = state.projected[n];
        if (!b) return go(BASE, true);
        const v = state.view;
        const chain = await chainAround({ kind: "ahead", i: n });
        if (state.view !== v) return;
        const was = again ? chainState() : null;
        $("view").innerHTML = `${chainView(chain)}
          <div class="focus ahead">
            <div class="lead">
              <p class="lead-kicker"><span class="chip">To come</span></p>
              <h2 class="lead-title">The ${nth(n + 1)} block to come</h2>
              <p class="lead-lede">In about ${span((n + 1) * 600)}, if the mempool stays as it is.</p>
              <dl class="lead-figs">
                ${fig("To get in", rateU(ceilRate(entry(b))), `${paymentCost(entry(b))} a payment`)}
                ${fig("Transactions", int(b.nTx), vbytes(b.blockVSize))}
                ${fig("Fees", btcU(b.totalFees), state.price ? usd((b.totalFees / 1e8) * state.price) : "")}
                ${fig("Median fee", rateU(b.medianFee), `${rateNum(b.feeRange[0])} to ${rate(b.feeRange.at(-1))}`)}
              </dl>
            </div>
            <figure class="mapbox"><span class="bands" id="bands"></span>
              <figcaption class="caption"><span>Its fee rates, the cheapest at the top, as tall as it's full</span>${scaleKey()}</figcaption></figure>
          </div>`;
        paintChain(chain, was?.scroll ?? null);
        was?.refocus();
        $("bands").append(bandsOf(b, 640));
      }

      async function viewBlock(ref) {
        const v = state.view;
        const hash = isHeight(ref) ? await get(`/block-height/${ref}`) : ref;
        const b = await get(`/v1/block/${hash}`);
        const h = b.height;
        // A block opened by its hash is shown, and linked, by its height.
        if (state.view === v && v.ref !== String(h)) {
          v.ref = String(h);
          history.replaceState(null, "", url.block(h));
          document.title = `Block ${int(h)} · Explorer · Bitview`;
        }
        const [[profit], [loss], [destroyed], [cdd], price, chain] = await Promise.all([
          series("realized_profit", "height", h, h + 1),
          series("realized_loss", "height", h, h + 1),
          series("value_destroyed", "height", h, h + 1),
          series("coindays_destroyed", "height", h, h + 1),
          priceAt(h),
          chainAround({ kind: "mined", h }),
        ]);
        if (state.view !== v) return;
        const x = b.extras;
        const lone = b.tx_count === 1;
        // Value created and destroyed, as Studio counts them: its coins at the price spent and at the prices they came
        // in at, the difference what it realized.
        const realized = profit - loss;
        $("view").innerHTML = `${chainView(chain)}
          <div class="focus">
            <div class="lead">
              <p class="lead-kicker"><span class="chip">Mined</span>${copyPill(b.id)}</p>
              <div class="lead-head"><h2 class="lead-title">Block ${int(h)}</h2>${neighbours(h)}</div>
              <p class="lead-lede">Mined by <b>${poolMark(x.pool?.slug)}${poolName(x.pool)}</b> at ${clockTime(b.timestamp)} on ${day(b.timestamp)}, <span data-ago="${b.timestamp}">${ago(b.timestamp)}</span>. ${plural(state.tip - h + 1, "confirmation")}.</p>
              <p class="lead-note">${
                lone
                  ? "The coinbase alone: no transaction paid to get in."
                  : !x.feeRange.at(-1)
                    ? `${plural(b.tx_count - 1, "transaction")} besides the coinbase, none of them paying a fee.`
                    : `${plural(b.tx_count - 1, "transaction")} besides the coinbase paid from ${rateNum(x.feeRange[0])} to ${rate(x.feeRange.at(-1))}, half of them more than ${rate(x.medianFee)}.`
              }</p>
              <dl class="lead-figs">
                ${fig("Fees", btcU(x.totalFees), `${price ? `${usd((x.totalFees / 1e8) * price)} · ` : ""}reward ${btc(x.reward)} BTC`)}
                ${fig("Size", bytes(b.size), weight(b.weight))}
                ${wide(
                  destroyed || profit || loss
                    ? fig("Realized", `<span class="${tone(realized)}">${signed(realized)}</span>`, `<span class="vc">value created ${usd(destroyed + realized)}</span><span class="vd">value destroyed ${usd(destroyed)}</span>`)
                    : fig("Realized", "Nothing", "it spent no coins"),
                )}
                ${fig("Coin-days destroyed", int(cdd), "by the coins it spent")}
                ${fig("Price", price ? dollars(price) : "—", price ? "read from its own payments" : "none read this early")}
              </dl>
            </div>
            <figure class="mapbox"><canvas id="map" role="img" aria-label="The block's transactions, each a square as large as its size, coloured by its fee rate or its kind"></canvas>
              <figcaption class="caption">${lone ? "" : lensSwitch}<span id="legend">${scaleKey()}</span></figcaption></figure>
          </div>
          ${lone ? "" : `<section class="lower"><div class="sechead"><h2>Inside</h2><p>by share of its space</p></div><div class="kinds" id="kinds">${`<div class="kind"><i></i><span>&nbsp;</span><b></b><em></em></div>`.repeat(5)}</div></section>`}`;
        paintChain(chain);
        // Its map, exact: every transaction's size and effective fee rate, by its place in the chain.
        const { start, txs } = await txsOf(b);
        if (state.view !== v) return;
        map.mount($("map"), async (i) => {
          const txid = await get(`/tx-index/${start + i}`);
          if (state.view === v) go(url.tx(txid));
        });
        map.set(txs, 1e6);
        if (lone) return;
        // What kinds fill it, by their share of its space, and the lens that colours by them.
        const kinds = await kindsOf(b);
        if (state.view !== v) return;
        const space = [...KINDS.map(() => 0), 0];
        const count = [...KINDS.map(() => 0), 0];
        let total = 0;
        for (let i = 1; i < txs.length; i++) {
          const k = kinds[i] < 0 ? KINDS.length : kinds[i];
          space[k] += txs[i].vsize;
          count[k]++;
          total += txs[i].vsize;
        }
        const named = [...KINDS.map(([, name, color], k) => [name, color, k]), ["Everything else", OTHER, KINDS.length]].filter(([, , k]) => count[k]);
        $("kinds").innerHTML = named
          .map(([name, color, k]) => {
            const share = total ? space[k] / total : 0;
            return `<div class="kind" style="--c:${color};--w:${(share * 100).toFixed(1)}%"><i style="background:${color}"></i><span>${name} <span class="soft">${int(count[k])}</span></span><b>${nf(1).format(share * 100)}%</b><em></em></div>`;
          })
          .join("");
        $("lens").onclick = (e) => {
          const button = e.target.closest("[data-lens]");
          if (!button) return;
          for (const other of $("lens").querySelectorAll("button")) other.setAttribute("aria-pressed", other === button);
          if (button.dataset.lens === "kind") {
            map.lens(
              (t, i) => (kinds[i] < 0 ? OTHER : KINDS[kinds[i]][2]),
              (i) => (kinds[i] < 0 ? null : KINDS[kinds[i]][1]),
            );
