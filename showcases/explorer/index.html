      :root { color-scheme: light; --paper: #faf9f6; --surface: #fffefa; --sidebar: #f2f1ec; --ink: #292e29; --muted: #74796f; --line: #e1e3da; --accent: #ad512c; --accent-soft: #ece4d8; --mono: Lilex, ui-monospace, SFMono-Regular, Consolas, monospace; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--ink); background: var(--paper); }
      * { box-sizing: border-box; }
      body { margin: 0; }
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; background: none; border: 0; }
      button:disabled { opacity: .4; cursor: default; }
      button, a, input, select { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      a { color: inherit; text-decoration: none; }
      a:hover { color: var(--accent); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      ::selection { background: #ecd9c7; }
      [hidden] { display: none !important; }
      svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
      .svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
      .skip-link { position: fixed; top: -80px; left: 16px; padding: 12px; z-index: 30; background: var(--surface); }
      .skip-link:focus { top: 12px; }
      .site-header { height: 64px; display: grid; grid-template-columns: 232px minmax(200px, 520px); align-items: center; gap: 24px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--surface); }
      .brand { display: flex; align-items: center; gap: 10px; width: fit-content; font: 500 17px var(--mono); letter-spacing: -.7px; white-space: nowrap; }
      .brand-divider { color: #b1b5aa; margin: 0 2px; font-weight: 300; }
      .product-name { font-size: 13px; letter-spacing: -.3px; color: var(--muted); }
      #search-form { position: relative; min-width: 0; }
      #search-panel { position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 10; padding: 6px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); box-shadow: 0 12px 36px #292e291c; max-height: min(560px, calc(100dvh - 130px)); overflow: auto; overscroll-behavior: contain; }
      #search-status { padding: 9px 10px; font-size: 11px; color: var(--muted); line-height: 1.6; }
      .search-option { display: flex; align-items: center; gap: 11px; width: 100%; padding: 12px 10px; text-align: left; border-radius: 5px; }
      .search-option:hover, .search-option[aria-selected=true] { background: #eeefe7; }.search-option > svg { width: 15px; color: var(--muted); }.search-option .result-label { font-size: 13px; }.search-option .result-path { font-family: inherit; font-size: 11px; line-height: 1.5; margin-top: 4px; }
      #search-all { width: 100%; padding: 13px 10px 8px; margin-top: 4px; border-top: 1px solid var(--line); font-size: 12px; text-align: left; color: var(--muted); }#search-all:hover { color: var(--ink); }
      .search-box { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); }
      .search-box:focus-within { border-color: #acb49e; box-shadow: 0 0 0 3px #6175530c; }
      .search-box svg { width: 16px; color: var(--muted); }
      .search-box input { width: 100%; min-width: 0; background: none; border: 0; outline: none; font-size: 13px; }
      .search-box input::placeholder { color: var(--muted); }
      kbd { min-width: 21px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); text-align: center; font: 11px/20px var(--mono); }
      .workspace { display: grid; grid-template-columns: 256px minmax(0, 1fr); height: calc(100dvh - 64px); }
      #sidebar { min-height: 0; display: flex; flex-direction: column; padding: 20px 12px 0; background: var(--sidebar); border-right: 1px solid var(--line); }
      .sidebar-top { align-items: center; justify-content: space-between; padding: 0 10px 16px; font-size: 15px; font-weight: 500; }
      .sidebar-nav { display: grid; gap: 3px; padding-bottom: 23px; }
      .nav-button { display: flex; align-items: center; gap: 10px; padding: 11px 12px; text-align: left; border-radius: 6px; font-size: 13px; }
      .nav-button svg { width: 16px; }.nav-button.active { background: #e6e7de; font-weight: 500; }.nav-button:hover { background: #e8e9e1; }
      .count { margin-left: auto; color: var(--muted); font: 11px var(--mono); font-variant-numeric: tabular-nums; }
      .tree-heading { display: flex; justify-content: space-between; align-items: center; padding: 0 12px 10px; }
      .eyebrow { color: var(--muted); font: 10px var(--mono); letter-spacing: 1.2px; text-transform: uppercase; }
      .tree-heading button { padding: 6px 0; font-size: 11px; color: var(--muted); }.tree-heading button:hover { color: var(--ink); }
      #tree-scroll { min-height: 0; flex: 1; overflow: auto; padding-bottom: 16px; scrollbar-width: thin; scrollbar-color: #c9ccbf transparent; }
      .tree-row { min-height: 36px; display: flex; align-items: center; gap: 5px; padding: 4px 10px 4px calc(5px + var(--depth) * 14px); font-size: 12px; border-radius: 5px; cursor: pointer; position: relative; }
      .tree-row:hover { background: #e8e9e1; }.tree-row[aria-selected=true] { color: var(--accent); background: var(--accent-soft); }.tree-row:focus-visible { outline-offset: -2px; }
      .tree-toggle { display: grid; place-items: center; min-width: 24px; height: 28px; }.tree-toggle svg { width: 11px; height: 11px; }.tree-row[aria-expanded=true] > .tree-toggle svg { transform: rotate(90deg); }
      .tree-row .leaf-icon { width: 13px; color: var(--muted); margin: 0 5px; }.tree-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }.tree-row .count { font-size: 10px; }
      .tree-more { margin-left: 28px; padding: 10px; color: var(--accent); font-size: 11px; }
      #main { min-width: 0; overflow: auto; display: flex; flex-direction: column; scrollbar-width: thin; }
      .context-bar { min-height: 58px; display: flex; align-items: center; gap: 14px; padding: 8px 36px; }
      #breadcrumbs { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; scrollbar-width: none; font-size: 12px; color: var(--muted); }
      #breadcrumbs button { padding: 7px 0; white-space: nowrap; }#breadcrumbs button:hover { color: var(--ink); }#breadcrumbs [aria-current=page] { color: var(--ink); }#breadcrumbs .separator { color: #b7bcb0; }
      .icon-button { height: 36px; min-width: 36px; padding: 8px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
      .icon-button:hover { background: #ebece4; color: var(--ink); }.icon-button[aria-pressed=true] { color: var(--accent); }.icon-button[aria-pressed=true] svg { fill: #ad512c12; }
      #content { padding: 17px 36px 40px; width: 100%; max-width: 1280px; margin: 0 auto; flex: 1; }
      h1, h2, h3, p { margin-top: 0; }h1 { font: 400 38px/1.12 Instrument, Georgia, serif; letter-spacing: -.5px; margin-bottom: 10px; overflow-wrap: anywhere; }h2 { font-size: 18px; font-weight: 500; }
      .muted { color: var(--muted); }.small { font-size: 12px; line-height: 1.7; }.mono { font-family: var(--mono); }
      .view-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px 24px; margin-bottom: 27px; flex-wrap: wrap; }.view-heading h1 { margin: 0; }.view-heading p { font-size: 12px; color: var(--muted); margin: 0; }
      .directory { border-top: 1px solid var(--line); }.directory-home { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; border-top: 0; }
      .result-row { display: flex; align-items: center; border-bottom: 1px solid var(--line); min-height: 62px; transition: background 100ms; }
      .result-row:hover { background: #f0f1e9; }.result-open { display: flex; flex: 1; min-width: 0; align-items: center; gap: 14px; text-align: left; padding: 16px 10px; align-self: stretch; }
      .result-open > svg { width: 17px; color: #979e8c; }.result-open > svg:last-child { width: 12px; height: 12px; }.result-text { flex: 1; min-width: 0; }.result-label { display: block; font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
      .result-path { display: block; margin-top: 5px; font: 10px/1.6 var(--mono); color: var(--muted); overflow-wrap: anywhere; }.result-meta { font: 11px var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }.result-row > .icon-button { margin-right: 4px; }
      .empty-state { padding: 64px 16px; text-align: center; }.empty-state > svg { width: 28px; height: 28px; color: var(--muted); margin-bottom: 18px; }.empty-state h2 { font: 30px Instrument, Georgia, serif; }.empty-state p { font-size: 13px; color: var(--muted); line-height: 1.7; }
      .loading-state { padding: 12vh 0; text-align: center; }.loading-state p { font-size: 13px; }.loader { display: block; margin: 0 auto 20px; width: 22px; height: 22px; border: 1px solid var(--line); border-top-color: var(--muted); border-radius: 50%; animation: spin 1s linear infinite; }@keyframes spin { to { transform: rotate(360deg); } }
      .error-state { max-width: 640px; padding: 28px; background: #f7eee4; border: 1px solid #e6d9c7; border-radius: 8px; }.error-state h2 { margin-bottom: 12px; }.error-state p { font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
      .compact-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; min-height: 36px; background: var(--surface); }.compact-button:hover { background: #eeefe7; }.compact-button svg { width: 15px; height: 15px; }.compact-button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
      .pagination { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 16px; margin-top: 24px; }.pagination span { font: 11px var(--mono); color: var(--muted); }
      .series-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }.series-heading h1 { margin: 0; }.series-heading > div { min-width: 0; }
      .description { max-width: 78ch; font-size: 13px; line-height: 1.7; color: var(--muted); margin: 13px 0 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }.description.expanded { display: block; }
      #description-toggle { padding: 6px 0 0; color: var(--ink); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
      .chart-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 18px 24px; flex-wrap: wrap; margin-top: 22px; padding: 20px 0 24px; border-top: 1px solid var(--line); }
      .readout { min-width: 0; flex: 1 0 250px; }.readout-caption { display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px 12px; min-height: 18px; color: var(--muted); font-size: 11px; }.readout-number { display: flex; align-items: baseline; gap: 9px; margin-top: 4px; }
      #readout-value { font: 26px/1.4 var(--mono); letter-spacing: -1px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; min-width: 0; }#readout-unit { font: 12px var(--mono); color: var(--muted); }#readout-date { font-size: 10px; }
      .preview-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
      .field { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; }.field select { height: 36px; max-width: 180px; border: 1px solid var(--line); border-radius: 6px; padding: 7px 28px 7px 10px; font-size: 12px; color: var(--ink); background: var(--surface); }
      .control-spacer { flex: 1; }.view-tabs { display: flex; padding: 3px; border-radius: 6px; background: #eeefe7; }.view-tabs button { padding: 6px 11px; font-size: 12px; border-radius: 4px; color: var(--muted); }.view-tabs button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px #292e2910; }
      .preview-tools { display: flex; gap: 3px; align-items: center; }.preview-tools .icon-button { min-width: 34px; height: 34px; }#download:not([href]) { opacity: .4; cursor: default; }
      .preview-panel { margin-top: 0; }
      #chart { height: clamp(300px, 43vh, 540px); }#chart-message { padding: 50px 24px; text-align: center; font-size: 13px; color: var(--muted); line-height: 1.8; }
      .chart-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding: 14px 0; color: var(--muted); font-size: 11px; }.chart-footer button { color: var(--muted); padding: 6px 0; font-size: 11px; }.chart-footer button:hover { color: var(--ink); }.chart-footer .range-note { margin-right: auto; }
      .data-details { margin-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }.data-details summary { width: fit-content; padding: 16px 0; cursor: pointer; }.data-details[open] summary { color: var(--ink); }.data-details dl { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 14px 24px; margin: 4px 0 24px; line-height: 1.6; }.data-details dt { color: var(--muted); }.data-details dd { margin: 0; color: var(--ink); font: 11px/1.6 var(--mono); overflow-wrap: anywhere; }.data-details a, .text-button { text-decoration: underline; text-underline-offset: 3px; }.detail-actions { display: flex; gap: 18px; padding-bottom: 20px; }.text-button { padding: 0; font-size: 12px; }
      .data-wrap { overflow-x: auto; }table { width: 100%; border-collapse: collapse; text-align: left; font: 11px/1.7 var(--mono); }caption { text-align: left; padding: 12px 0; color: var(--muted); font-size: 11px; }th { color: var(--muted); font-size: 11px; font-weight: 400; }td, th { padding: 12px 16px; border-bottom: 1px solid var(--line); }td:first-child, th:first-child { padding-left: 0; }td { vertical-align: top; }td.value { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 160px; max-width: 550px; }td:not(.value) { white-space: nowrap; }tr:hover td { background: #f0f1e9; }.table-pagination { padding-bottom: 20px; }
      .warning { font-size: 12px; padding: 14px; background: #f7eee4; border-radius: 6px; margin: 16px 0; }
      #toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 12px); padding: 12px 18px; background: var(--ink); color: var(--paper); border-radius: 7px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity 150ms, transform 150ms; z-index: 30; max-width: calc(100vw - 32px); }#toast.show { transform: translate(-50%, 0); opacity: 1; }.noscript { position: fixed; inset: 40% 10% auto; padding: 30px; background: var(--surface); border: 1px solid var(--line); }.mobile-only { display: none; }
      @media (hover: hover) and (pointer: fine) { .result-row > .icon-button:not([aria-pressed=true]) { opacity: 0; }.result-row:hover > .icon-button, .result-row:focus-within > .icon-button { opacity: 1; } }
      @media (max-width: 1100px) { .site-header { grid-template-columns: 218px minmax(200px, 1fr); gap: 20px; padding: 0 18px; }.workspace { grid-template-columns: 236px minmax(0, 1fr); }.context-bar { padding-inline: 28px; }#content { padding-inline: 28px; }.directory-home { grid-template-columns: 1fr; } }
      @media (max-width: 780px) {
        .site-header { height: 108px; grid-template-columns: 1fr; gap: 8px 16px; padding: 10px 20px 12px; }.brand { font-size: 16px; }#search-form { grid-column: 1 / -1; grid-row: 2; }.search-box { height: 36px; }.search-box input { font-size: 16px; }.search-box kbd { display: none; }
        .workspace { height: calc(100dvh - 108px); display: block; }#main { height: 100%; }
        #sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: min(320px, 88vw); z-index: 12; transform: translateX(-100%); visibility: hidden; transition: transform 160ms, visibility 160ms; padding-top: max(20px, env(safe-area-inset-top)); }.sidebar-open #sidebar { transform: translateX(0); visibility: visible; transition: transform 160ms; }
        #sidebar-backdrop { position: fixed; inset: 0; background: #292e2940; z-index: 11; width: 100%; height: 100%; }.mobile-only { display: inline-flex; }.tree-row { min-height: 40px; font-size: 13px; }
        .context-bar { min-height: 54px; padding: 8px 20px; gap: 12px; }.context-bar .compact-button { background: none; font-size: 11px; padding: 7px 9px; min-height: 34px; }#breadcrumbs { font-size: 11px; }

    <!-- Self-contained UI: styles, fonts, icons, chart library and application code are embedded.
         Only the latest generated client and live data are fetched from bitview.space.
         Catalog traversal and requests run in the inline worker; previews use the latest 10,000 values. -->
    <script id="catalog-worker" type="text/plain">
      const isSeries = node => typeof node?.name === 'string' && typeof node.indexes === 'function';
      const normalize = value => value.replace(/([a-z\d])([A-Z])/g, '$1 $2').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

      // The generated client remains the source of truth. Only small, serializable
      // descriptions of the requested branches cross the worker boundary.
      function createCatalog(series) {
        const counts = new WeakMap();
        const documents = [];
        function visit(node, path) {
          const leaf = isSeries(node);
          documents.push({ node, path, text: normalize(leaf ? node.name : path.at(-1) || ''), context: normalize(path.join(' ')) });
          const count = leaf ? 1 : Object.entries(node).reduce((sum, [key, child]) => sum + visit(child, [...path, key]), 0);
          counts.set(node, count);
          return count;
        }
        const total = visit(series, []);
        function resolve(path) {
          let node = series;
          for (const part of path) {
            if (isSeries(node) || !Object.hasOwn(node, part)) throw new Error('This path is not in the current catalog.');
            node = node[part];
          }
          return node;
        }
        function describe(node, path) {
          return { path, label: path.at(-1) || 'All series', count: counts.get(node), ...(isSeries(node) ? { name: node.name, indexes: node.indexes() } : {}) };
        }
        function browse(path, offset = 0, limit = 100) {
          const node = resolve(path);
          const keys = isSeries(node) ? [] : Object.keys(node);
          return { node: describe(node, path), total: keys.length, offset, items: keys.slice(offset, offset + limit).map(key => describe(node[key], [...path, key])) };
        }
        let previousQuery, matches = [];
        function search(query, offset = 0, limit = 100) {
          const normalized = normalize(query);
          if (normalized !== previousQuery) {
            previousQuery = normalized;
            const tokens = normalized.split(' ').filter(Boolean);
            matches = tokens.length ? documents.flatMap(doc => {
              if (!doc.path.length || !tokens.every(token => `${doc.text} ${doc.context}`.includes(token))) return [];
              const score = doc.text === normalized ? (isSeries(doc.node) ? 0 : 1) : doc.text.startsWith(normalized) ? 2 : tokens.every(token => doc.text.includes(token)) ? 3 : 4;
              return [{ doc, score }];
            }).sort((a, b) => a.score - b.score || a.doc.text.localeCompare(b.doc.text) || a.doc.path.length - b.doc.path.length) : [];
          }
          return { total: matches.length, offset, items: matches.slice(offset, offset + limit).map(({ doc }) => describe(doc.node, doc.path)) };
        }
        return { total, resolve, browse, search, describe };
      }

      const baseUrl = 'https://bitview.space';
      const MAX_SIZE = 10_000;
      let client, catalog, mappings;
      const controllers = new Map();

      async function initialize() {
        // The deployed module uses immutable caching. A fresh URL once per page load
        // ensures the tree reflects the current deployment, including new branches.
        const response = await fetch(`${baseUrl}/scripts/modules/bitview-client/index.js?v=${Date.now()}`, { cache: 'no-cache', signal: AbortSignal.timeout(30000) });
        if (!response.ok) throw new Error(`Client download failed (HTTP ${response.status}).`);
        if (!/javascript/i.test(response.headers.get('content-type') || '')) throw new Error('The client endpoint did not return JavaScript.');
        const url = URL.createObjectURL(new Blob([await response.text()], { type: 'text/javascript' }));
        try {
          const { BitviewClient } = await import(url);
          client = new BitviewClient({ baseUrl, timeout: 25000, browserCache: false, memCache: 32 });
        } finally { URL.revokeObjectURL(url); }
        catalog = createCatalog(client.series);
        mappings = new Map(Object.values(client.series.mappings?.timestamp || {}).flatMap(node => node.indexes().map(index => [index, node.name])));
        return { total: catalog.total, roots: catalog.browse([]).items };
      }

      async function preview({ path, index }, signal) {
        const node = catalog.resolve(path);
        if (!isSeries(node) || !node.indexes().includes(index)) throw new Error('This series does not support the selected index.');
        const options = { signal, cache: false, memCache: false };
        const [data, info] = await Promise.all([
          client.getSeries(node.name, index, -MAX_SIZE, undefined, MAX_SIZE, undefined, options),
          client.getSeriesInfo(node.name, { signal }).catch(() => null),
        ]);
        if (!Array.isArray(data.data)) throw new Error('The API returned an invalid data sample.');
        let timestamps = null, warning = '';
        if (mappings.has(index) && data.data.length) {
          try {
            const result = await client.getSeries(mappings.get(index), index, data.start, data.end, undefined, undefined, options);
            if (!Array.isArray(result.data)) throw new Error('Invalid time mapping.');
            timestamps = { start: result.start, data: result.data };
          } catch (error) {
            if (signal.aborted) throw error;
            warning = 'Time mapping could not load. The original values are available in the table.';
          }
        }
        // Copy only data fields; generated client convenience methods are not cloneable.
        return { data: { start: data.start, end: data.end, type: data.type, index: data.index, stamp: data.stamp, data: data.data }, info, timestamps, warning };
      }

      self.onmessage = async ({ data: { id, type, args } }) => {
        if (type === 'cancel') { controllers.get(args.id)?.abort(); return; }
        const controller = new AbortController();
        controllers.set(id, controller);
        try {
          let data;
          if (type === 'init') data = await initialize();
          else if (!catalog) throw new Error('The catalog is still loading.');
          else if (type === 'browse') data = catalog.browse(args.path, args.offset);
          else if (type === 'search') data = catalog.search(args.query, args.offset, args.limit);
          else if (type === 'preview') data = await preview(args, controller.signal);
          else throw new Error('Unknown explorer request.');
          self.postMessage({ id, data });
        } catch (error) { self.postMessage({ id, error: error.message }); }
        finally { controllers.delete(id); }
      };
    </script>
    <script id="explorer-data" type="text/javascript">
      const humanize = value => value.replace(/^_/, '').replace(/([a-z\d])([A-Z])/g, '$1 $2').replace(/_/g, ' ')
        .replace(/\b(\d+)([dwmy])\b/g, (_, count, unit) => `${count} ${{ d: 'day', w: 'week', m: 'month', y: 'year' }[unit]}${count === '1' ? '' : 's'}`)
        .replace(/\b(usd|btc|sth|lth|ohlc|utxos?|sma|ema|mvrv|sopr|nvt|dca|cagr|ath)\b/gi, word => word.toUpperCase()).replace(/^./, c => c.toUpperCase());
      function unitForType(type = '') {
        const valueType = type.replace(/^OHLC(?:<(.+)>|(.+))$/, '$1$2');
        const units = { Bitcoin: 'BTC', Dollars: 'USD', Cents: 'cents', Sats: 'sats', SatsSigned: 'sats' };
        return Object.hasOwn(units, valueType) ? units[valueType] : '';
      }
      const axisNumber = new Intl.NumberFormat('en-US', { notation: 'compact', maximumSignificantDigits: 4 });

      const indexLabels = { height: 'Block', minute10: '10 minutes', minute30: '30 minutes', hour1: '1 hour', hour4: '4 hours', hour12: '12 hours', day1: '1 day', day3: '3 days', week1: '1 week', month1: '1 month', month3: '3 months', month6: '6 months', year1: '1 year', year10: '10 years', halving: 'Halving', epoch: 'Difficulty epoch' };
      const scalar = value => typeof value === 'boolean' ? Number(value) : Number.isFinite(value) ? value : null;
      const isOHLC = type => /^OHLC/.test(type);
      const closeValue = (value, type) => scalar(isOHLC(type) && Array.isArray(value) ? value[3] : value);

      function chartPoints(data, timestamps) {
        if (!data.data.length) return { points: [], reason: 'No values are available for this sample. Try another index.' };
        if (!timestamps) return { points: [], reason: 'This index has no time mapping. Explore its values in the table.' };
        const points = [];
        let values = 0;
        for (let i = 0; i < data.data.length; i++) {
          const time = timestamps.data[data.start + i - timestamps.start];
          if (!Number.isFinite(time) || time <= 0) continue;
          const value = data.data[i];
          let point = { time };
          if (value != null) {
            if (isOHLC(data.type)) {
              if (!Array.isArray(value) || value.length !== 4 || !value.every(Number.isFinite)) return { points: [], reason: 'These structured values are available in the table.' };
              const [open, high, low, close] = value;
              if (low > Math.min(open, close) || high < Math.max(open, close) || low > high) return { points: [], reason: 'This sample contains invalid OHLC values. Inspect the table.' };
              point = { time, open, high, low, close };
            } else {
              const number = scalar(value);
              if (number === null) return { points: [], reason: 'These structured values are available in the table.' };
              point.value = number;
            }
            values++;
          }
          const previous = points.at(-1);
          if (previous && time < previous.time) return { points: [], reason: 'The timestamps are not ordered. Inspect the table.' };
          if (previous?.time === time) {
            if ('open' in previous && 'open' in point) {
              point.open = previous.open;
              point.high = Math.max(previous.high, point.high);
              point.low = Math.min(previous.low, point.low);
            }
            if ('value' in point || 'open' in point) points[points.length - 1] = point;
          } else points.push(point);
        }
        return { points: values ? points : [], reason: values ? '' : 'No plottable values in this sample. Try another index.' };
      }

      function toCSV(data, timestamps) {
        function cell(value) {
          let text = value == null ? '' : typeof value === 'object' ? JSON.stringify(value) : String(value);
          if (typeof value === 'string' && /^[=+\-@\t\r]/.test(text)) text = `'${text}`;
          return `"${text.replaceAll('"', '""')}"`;
        }
        return ['index,timestamp,value', ...data.data.map((value, i) => {
          const index = data.start + i;
          const timestamp = timestamps?.data[index - timestamps.start];
          return [index, Number.isFinite(timestamp) ? new Date(timestamp * 1000).toISOString() : '', value].map(cell).join(',');
        })].join('\r\n');
      }
    </script>

    <script id="explorer-app" type="module">
      const pathKey = path => path.join('/');

      const $ = id => document.getElementById(id);
      const number = new Intl.NumberFormat('en-US');
      const dateFormat = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
      const compact = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 2 });
      const preciseNumber = new Intl.NumberFormat('en-US', { maximumSignificantDigits: 12 });
      const timeFormat = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' });
      const icon = name => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
      const escape = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
      const pathAttr = path => escape(JSON.stringify(path));
      const categoryNames = { addrs: 'Addresses', opReturn: 'OP_RETURN', capitalSentiment: 'Capital sentiment', rarityMeter: 'Rarity meter' };
      const label = item => item.path.length === 1 ? categoryNames[item.label] || humanize(item.label) : humanize(item.label);

      let worker, requestId = 0, routeVersion = 0, treeVersion = 0, previewRequest, chart, downloadUrl, descriptionObserver, initialization = 0;
      let roots = [], total = 0, ready = false, currentPath = [], currentNode, currentPreview, tablePage = 0, activeTab = 'chart';
      let toastTimer, searchTimer, listOffset = 0;
      let searchVersion = 0, searchItems = [], searchActive = -1, searchQuery = '';
      const requests = new Map(), branches = new Map(), expanded = new Set();
      const storageKey = 'bitview-explorer-saved-v1';
      let saved;
      try {
        const stored = JSON.parse(localStorage.getItem(storageKey));
        saved = Array.isArray(stored) ? stored.filter(path => Array.isArray(path) && path.length && path.every(part => typeof part === 'string')).slice(0, 500) : [];
      } catch { saved = []; }
      const isSaved = path => saved.some(item => pathKey(item) === pathKey(path));

      function toast(message) {
        $('toast').textContent = message;
        $('toast').classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => $('toast').classList.remove('show'), 3200);
      }
      function rpc(type, args = {}) {
        const id = ++requestId;
        const promise = new Promise((resolve, reject) => {
          const timer = setTimeout(() => { requests.delete(id); worker?.postMessage({ type: 'cancel', args: { id } }); reject(new Error('The request timed out. Please try again.')); }, 65000);
          requests.set(id, { resolve, reject, timer });
          worker.postMessage({ id, type, args });
        });
        promise.id = id;
        return promise;
      }
      function cancelPreview() {
        if (previewRequest) worker?.postMessage({ type: 'cancel', args: { id: previewRequest.id } });
        previewRequest = null;
      }
      function clearChart() { chart?.remove(); chart = null; }
      function clearSample() {
        clearChart(); currentPreview = null;
        if (downloadUrl) URL.revokeObjectURL(downloadUrl);
        downloadUrl = null;
      }
      function readRoute() {
        const params = new URLSearchParams(location.hash.slice(1));
        return { path: (params.get('path') || '').split('/').filter(Boolean), query: params.get('q') || '', saved: params.get('view') === 'saved', index: params.get('index') };
      }
      function navigate(path = [], extra = {}) {
        const params = new URLSearchParams();
        if (path.length) params.set('path', pathKey(path));
        for (const [key, value] of Object.entries(extra)) if (value) params.set(key, value);
        const hash = params.toString();
        const url = `${location.pathname}${location.search}${hash ? `#${hash}` : ''}`;
        if (location.hash.slice(1) !== hash) history.pushState(null, '', url);
        $('search').blur(); closeSidebar();
        renderRoute();
      }
      function breadcrumbs(path, suffix) {
        $('breadcrumbs').innerHTML = `<button data-path="[]">Explorer</button>${path.map((part, i) => `<span class="separator" aria-hidden="true">/</span><button data-path="${pathAttr(path.slice(0, i + 1))}" ${i === path.length - 1 && !suffix ? 'aria-current="page"' : ''}>${escape(humanize(part))}</button>`).join('')}${suffix ? `<span class="separator" aria-hidden="true">/</span><span aria-current="page">${escape(suffix)}</span>` : ''}`;
        $('breadcrumbs').scrollLeft = $('breadcrumbs').scrollWidth;
      }
      function errorMarkup(title, message, retry = 'retry-view') {
        return `<div class="error-state" role="alert"><h2>${escape(title)}</h2><p>${escape(message)}</p><button class="compact-button primary" id="${retry}">Try again</button></div>`;
      }
      function toggleSaved(path) {
        if (isSaved(path)) saved = saved.filter(item => pathKey(item) !== pathKey(path));
        else if (saved.length < 500) saved.push(path);
        else { toast('Your saved list is full. Remove a series to add another.'); return; }
        try { localStorage.setItem(storageKey, JSON.stringify(saved)); }
        catch { toast('Saved for this session. Browser storage is unavailable.'); }
        $('saved-count').textContent = number.format(saved.length);
        document.querySelectorAll('[data-save]').forEach(button => {
          const selected = isSaved(JSON.parse(button.dataset.save));
          button.setAttribute('aria-pressed', selected);
          button.setAttribute('aria-label', selected ? 'Remove saved series' : 'Save series');
          button.title = selected ? 'Remove saved series' : 'Save series';
        });
        if (readRoute().saved) renderRoute();
      }
      function saveButton(item) {
        const selected = isSaved(item.path);
        return `<button class="icon-button" data-save="${pathAttr(item.path)}" aria-pressed="${selected}" aria-label="${selected ? 'Remove saved series' : 'Save series'}" title="${selected ? 'Remove saved series' : 'Save series'}">${icon('bookmark')}</button>`;
      }
      async function branch(path) {
        const key = pathKey(path);
        if (!branches.has(key)) {
          const promise = rpc('browse', { path }).catch(error => { branches.delete(key); throw error; });
          branches.set(key, promise);
        }
        return branches.get(key);
      }
      async function renderTree(focusKey) {
        const version = ++treeVersion;
        const focused = document.activeElement?.closest('.tree-row')?.dataset.key;
        const keyToFocus = focusKey ?? focused;
        async function rows(items, depth, setSize = items.length) {
          const rendered = [];
          for (const [position, item] of items.entries()) {
            const key = pathKey(item.path), open = !item.name && expanded.has(key);
            rendered.push(`<div role="treeitem" class="tree-row" data-key="${escape(key)}" data-tree-path="${pathAttr(item.path)}" style="--depth:${depth}" aria-level="${depth + 1}" aria-posinset="${position + 1}" aria-setsize="${setSize}" aria-selected="${pathKey(currentPath) === key}" ${item.name ? '' : `aria-expanded="${open}"`} tabindex="-1" title="${escape(item.name || key)}">${item.name ? `<svg class="leaf-icon" aria-hidden="true"><use href="#i-series"/></svg>` : `<span class="tree-toggle" data-toggle>${icon('chevron')}</span>`}<span class="tree-label">${escape(label(item))}</span>${item.name ? '' : `<span class="count">${compact.format(item.count)}</span>`}</div>`);
            if (open) {
              const data = await branch(item.path);
              rendered.push(await rows(data.items, depth + 1, data.total));
              if (data.items.length < data.total) rendered.push(`<button class="tree-more" data-tree-more="${pathAttr(item.path)}">Show more (${number.format(data.total - data.items.length)})</button>`);
            }
          }
          return rendered.join('');
        }
        try {
          const html = await rows(roots, 0);
          if (version !== treeVersion) return;
          $('tree').innerHTML = html;
          const elements = [...$('tree').querySelectorAll('.tree-row')];
          const selected = elements.find(row => row.dataset.key === (keyToFocus || pathKey(currentPath))) || elements[0];
          if (selected) {
            selected.tabIndex = 0;
            if (keyToFocus) selected.focus({ preventScroll: true });
            else if (currentPath.length && matchMedia('(min-width: 781px)').matches) selected.scrollIntoView({ block: 'center', inline: 'nearest' });
          }
        } catch (error) { toast(error.message); }
      }
      async function toggleBranch(path, force) {
        const key = pathKey(path);
        if (force ?? !expanded.has(key)) expanded.add(key);
        else expanded.delete(key);
        await renderTree(key);
      }
      function treeKeyboard(event) {
        const row = event.target.closest('.tree-row');
        if (!row) return;
        const path = JSON.parse(row.dataset.treePath), open = row.getAttribute('aria-expanded');
        const rows = [...$('tree').querySelectorAll('.tree-row')], position = rows.indexOf(row);
        let next;
        if (event.key === 'ArrowDown') next = rows[position + 1];
        else if (event.key === 'ArrowUp') next = rows[position - 1];
        else if (event.key === 'Home') next = rows[0];
        else if (event.key === 'End') next = rows.at(-1);
        else if (event.key === 'ArrowRight') {
          if (open === 'false') toggleBranch(path, true);
          else if (open === 'true') next = rows[position + 1];
        } else if (event.key === 'ArrowLeft') {
          if (open === 'true') toggleBranch(path, false);
          else next = rows.find(item => item.dataset.key === pathKey(path.slice(0, -1)));
        } else if (event.key === 'Enter' || event.key === ' ') {

          navigate(path);
        } else return;
        event.preventDefault();
        if (next) { row.tabIndex = -1; next.tabIndex = 0; next.focus(); }
      }

      function renderHome() {
        $('content').innerHTML = `<header class="view-heading"><h1>All series</h1><p>${number.format(total)} series · ${roots.length} categories</p></header><section class="directory directory-home" aria-label="Catalog categories">${resultRows(roots)}</section>`;
      }
      function resultRows(items, showPath = false) {
        return items.map(item => {
          const secondary = showPath ? item.path.join(' / ') : item.name || '';
          return `<div class="result-row"><button class="result-open" data-path="${pathAttr(item.path)}">${icon(item.name ? 'series' : 'folder')}<span class="result-text"><span class="result-label">${escape(item.name ? humanize(item.name) : label(item))}</span>${secondary ? `<span class="result-path">${escape(secondary)}${item.missing ? ' · No longer available' : ''}</span>` : ''}</span>${item.name ? '' : `<span class="result-meta">${number.format(item.count)} series</span>`}${icon('chevron')}</button>${item.name ? saveButton(item) : ''}</div>`;
        }).join('');
      }
      function pagination(offset, count, pageSize, target = 'list') {
        if (count <= pageSize) return '';
        return `<div class="pagination"><button class="compact-button" data-page="${Math.max(0, offset - pageSize)}" data-target="${target}" ${offset === 0 ? 'disabled' : ''}>← Previous</button><span>${number.format(offset + 1)}–${number.format(Math.min(offset + pageSize, count))} of ${number.format(count)}</span><button class="compact-button" data-page="${offset + pageSize}" data-target="${target}" ${offset + pageSize >= count ? 'disabled' : ''}>Next →</button></div>`;
      }
      async function renderList(route, version) {
        let data, title, detail;
        if (route.query) {
          data = await rpc('search', { query: route.query, offset: listOffset });
          title = `“${route.query}”`;
          detail = `${number.format(data.total)} ${data.total === 1 ? 'match' : 'matches'} across the entire catalog.`;
        } else if (route.saved) {
          const paths = saved.slice(listOffset, listOffset + 100);
          const items = await Promise.all(paths.map(async path => {

            catch { return { path, label: path.at(-1), name: path.at(-1), missing: true }; }

          detail = `${number.format(saved.length)} saved series`;
        } else {
          data = await rpc('browse', { path: route.path, offset: listOffset });
          if (version !== routeVersion) return;
          if (data.node.name) return renderSeries(data.node, route, version);

          title = label(data.node);
          detail = `${number.format(data.node.count)} series · ${number.format(data.total)} items`;
        }
        if (version !== routeVersion) return;
        const empty = route.saved ? 'No saved series' : 'No results';
        const hint = route.saved ? 'Use the bookmark beside a series to save it here.' : 'Try a shorter name, a path, or terms such as “realized price” or “supply”.';
        $('content').innerHTML = `<header class="view-heading"><h1>${escape(title)}</h1><p>${escape(detail)}</p></header>${data.items.length ? `<div class="directory">${resultRows(data.items, !!route.query || route.saved)}</div>${pagination(listOffset, data.total, 100)}` : `<div class="empty-state">${icon(route.saved ? 'bookmark' : 'search')}<h2>${empty}</h2><p>${hint}</p><button class="compact-button" data-path="[]">Explore the catalog ${icon('arrow')}</button></div>`}`;
        document.title = `${title} · Explorer · bitview`;
      }

      async function renderRoute(resetOffset = true) {
        if (!ready) return;

        if (resetOffset) listOffset = 0;

        if (document.activeElement !== $('search')) $('search').value = route.query;
        $('all-series').classList.toggle('active', !route.path.length && !route.query && !route.saved);
        $('saved-series').classList.toggle('active', route.saved);
        $('content').setAttribute('aria-busy', 'true');
        breadcrumbs(route.path, route.query ? 'Search' : route.saved ? 'Saved' : '');
        document.title = 'Explorer · bitview';
        for (let i = 1; i <= route.path.length; i++) expanded.add(pathKey(route.path.slice(0, i)));
        renderTree();
        $('main').scrollTop = 0;
        try {
          if (!route.path.length && !route.query && !route.saved) renderHome();
          else {
            $('content').innerHTML = '<div class="loading-state"><span class="loader"></span><p class="muted">Loading…</p></div>';
            await renderList(route, version);

          if (version === routeVersion) $('content').innerHTML = errorMarkup('This view could not load', error.message);
        } finally { if (version === routeVersion) $('content').setAttribute('aria-busy', 'false'); }
      }
      async function renderSeries(node, route, version) {
        if (version !== routeVersion) return;
        currentNode = node; activeTab = 'chart'; tablePage = 0;
        const index = node.indexes.includes(route.index) ? route.index : node.indexes.includes('day1') ? 'day1' : node.indexes[0];
        document.title = `${humanize(node.name)} · Explorer · bitview`;
        $('content').innerHTML = `<header class="series-heading"><h1>${escape(humanize(node.name))}</h1>${saveButton(node)}</header>
          <p id="description" class="description">Loading the series description…</p><button id="description-toggle" aria-expanded="false" aria-controls="description" hidden>Read more</button>
          <div class="chart-toolbar"><div class="readout">
            <div class="readout-caption"><span id="readout-label">Latest value</span><span id="readout-date"></span></div>
            <div class="readout-number"><span id="readout-value">—</span><span id="readout-unit"></span></div>
          </div><div class="preview-controls">
            <label class="field"><span>Interval</span><select id="index" aria-label="Interval">${node.indexes.map(value => `<option value="${escape(value)}" ${value === index ? 'selected' : ''}>${escape(indexLabels[value] || humanize(value))}</option>`).join('')}</select></label>
            <div class="view-tabs" role="group" aria-label="Preview view"><button id="chart-tab" aria-pressed="true" disabled>Chart</button><button id="table-tab" aria-pressed="false" disabled>Table</button></div>
            <span class="control-spacer"></span><div class="preview-tools"><a id="download" class="icon-button" aria-label="Download CSV" title="Download CSV">${icon('download')}</a><button id="refresh" class="icon-button" aria-label="Refresh values" title="Refresh values">${icon('refresh')}</button></div>
          </div></div><div id="preview"></div>`;
        $('index').addEventListener('change', () => navigate(currentNode.path, { index: $('index').value }));
        $('refresh').addEventListener('click', () => loadPreview(version));

      async function loadPreview(version) {

      }
      function renderPreview(plotted, version) {
        const { data, timestamps, warning } = currentPreview;
        const firstTimestamp = timestamps?.data[data.start - timestamps.start];
        const lastTimestamp = timestamps?.data[data.start + data.data.length - 1 - timestamps.start];
        const dateRange = Number.isFinite(firstTimestamp) && Number.isFinite(lastTimestamp) ? `${dateFormat.format(firstTimestamp * 1000)} – ${dateFormat.format(lastTimestamp * 1000)}` : '';
        const type = data.type || 'Unknown';
        const api = new URL(`https://bitview.space/api/series/${encodeURIComponent(currentNode.name)}/${encodeURIComponent(data.index)}`);
        api.searchParams.set('start', String(data.start)); api.searchParams.set('end', String(data.end));
        $('preview').innerHTML = `${warning ? `<p class="warning">${escape(warning)}</p>` : ''}<section class="preview-panel" aria-label="Series preview">
          <div id="chart-view" ${activeTab === 'chart' ? '' : 'hidden'}><div id="chart" ${plotted.points.length ? '' : 'hidden'} role="img" aria-label="${escape(humanize(currentNode.name))} chart. Exact values are available in the table."></div><div id="chart-message" ${plotted.points.length ? 'hidden' : ''}>${escape(plotted.reason)}</div>
            <div class="chart-footer"><span>${number.format(data.data.length)} values</span><span class="range-note">${escape(dateRange)}</span><button id="fit-chart" ${plotted.points.length ? '' : 'hidden'}>Reset view</button></div></div>
          <div id="table-view" ${activeTab === 'table' ? '' : 'hidden'}></div></section>
          <details class="data-details"><summary>Series details</summary><dl><dt>API name</dt><dd>${escape(currentNode.name)}</dd><dt>Value type</dt><dd>${escape(type)}</dd><dt>Index</dt><dd>${escape(data.index)}</dd><dt>Values</dt><dd>${number.format(data.data.length)}${data.data.length ? ` · indexes ${number.format(data.start)}–${number.format(data.end - 1)}` : ''}</dd>${data.stamp ? `<dt>Response time</dt><dd>${escape(data.stamp)} · UTC</dd>` : ''}</dl><div class="detail-actions"><a id="api-link" href="${escape(api.href)}" target="_blank" rel="noopener">View API response ↗</a><button id="copy-api" class="text-button">Copy API URL</button></div></details>`;
        updateReadout(); renderTable();
        for (const name of ['chart', 'table']) {
          $(`${name}-tab`).disabled = false;
          $(`${name}-tab`).setAttribute('aria-pressed', activeTab === name);
          $(`${name}-tab`).onclick = () => switchTab(name, plotted, version);
        }
        $('fit-chart').addEventListener('click', () => chart?.timeScale().fitContent());
        $('copy-api').addEventListener('click', () => copy(api.href, 'API link copied'));
        downloadUrl = URL.createObjectURL(new Blob([toCSV(data, timestamps)], { type: 'text/csv;charset=utf-8' }));
        $('download').href = downloadUrl;
        $('download').download = `${currentNode.name}-${data.index}.csv`;
        if (activeTab === 'chart' && plotted.points.length) renderChart(plotted, version);
      }
      function switchTab(tab, plotted, version) {
        activeTab = tab; updateReadout();
        for (const name of ['chart', 'table']) {
          $(`${name}-tab`).setAttribute('aria-pressed', name === tab);

        }
        if (tab === 'chart' && plotted.points.length && !chart) renderChart(plotted, version);
      }
      function renderChart(plotted, version) {
        const preview = currentPreview;
        const container = $('chart');
        try {
          const LC = window.LightweightCharts;
          const orange = '#d66a2b', black = '#292929';
          if (version !== routeVersion || currentPreview !== preview || !container.isConnected || chart) return;
          chart = LC.createChart(container, {
            autoSize: true,
            layout: { background: { color: '#faf9f6' }, textColor: '#74716b', fontFamily: 'Lilex, monospace', fontSize: 11, attributionLogo: false },
            grid: { vertLines: { visible: false }, horzLines: { color: '#e6e2db', style: LC.LineStyle.Dotted } },
            rightPriceScale: { borderVisible: false },
            timeScale: { borderVisible: false, minBarSpacing: 0.001, timeVisible: /^(minute|hour|height)/.test(preview.data.index), secondsVisible: false },
            crosshair: { mode: LC.CrosshairMode.Normal, vertLine: { color: '#99948d', labelBackgroundColor: black }, horzLine: { color: '#99948d', labelBackgroundColor: black } },
            localization: { locale: 'en-US', priceFormatter: value => axisNumber.format(value) },
            handleScroll: { vertTouchDrag: false },
          });
          const series = isOHLC(preview.data.type)
            ? chart.addSeries(LC.CandlestickSeries, { upColor: orange, downColor: black, borderVisible: false, wickUpColor: orange, wickDownColor: black, priceLineVisible: false })
            : chart.addSeries(LC.AreaSeries, { lineColor: orange, topColor: `${orange}24`, bottomColor: `${orange}00`, lineWidth: 2, priceLineVisible: false });

      function renderTable() {

      }
      async function copy(text, message) {
        try { await navigator.clipboard.writeText(text); toast(message); }
        catch { toast('Clipboard access is unavailable. You can copy the link from the address bar or source link.'); }
      }

      function closeSidebar() {
        const wasOpen = document.body.classList.contains('sidebar-open');
        document.body.classList.remove('sidebar-open');
        $('sidebar-backdrop').hidden = true; $('open-sidebar').setAttribute('aria-expanded', 'false');
        if (wasOpen) { $('main').inert = false; document.querySelector('.site-header').inert = false; $('open-sidebar').focus(); }
      }
      function openSidebar() {
        closeSearch();
        document.body.classList.add('sidebar-open');
        $('sidebar-backdrop').hidden = false; $('open-sidebar').setAttribute('aria-expanded', 'true');
        $('main').inert = true; document.querySelector('.site-header').inert = true;

          if (!document.body.classList.contains('sidebar-open')) return;

      document.addEventListener('click', async event => {
        const button = event.target.closest('button');

        else if (button?.dataset.save) toggleSaved(JSON.parse(button.dataset.save));
        else if (button?.dataset.page) {

        else if (button?.id === 'retry-preview') loadPreview(routeVersion);

            const next = await rpc('browse', { path, offset: data.items.length });

      $('tree').addEventListener('keydown', treeKeyboard);
      $('all-series').addEventListener('click', () => navigate());
      $('saved-series').addEventListener('click', () => navigate([], { view: 'saved' }));
      $('collapse-tree').addEventListener('click', () => { expanded.clear(); renderTree(); });
      $('share').addEventListener('click', () => copy(location.href, 'Link copied'));
      $('open-sidebar').addEventListener('click', openSidebar);
      $('close-sidebar').addEventListener('click', closeSidebar);
      $('sidebar-backdrop').addEventListener('click', closeSidebar);
      function closeSearch() {
        clearTimeout(searchTimer); ++searchVersion;

      function queueSearch() {
        clearTimeout(searchTimer);
        const version = ++searchVersion;

      $('search-form').addEventListener('submit', event => {
        event.preventDefault();

      $('search').addEventListener('input', queueSearch);
      $('search').addEventListener('focus', queueSearch);

      async function initialize() {

            for (const pending of requests.values()) { clearTimeout(pending.timer); pending.reject(new Error(message)); }
            requests.clear();
            if (ready) {
              ready = false; ++routeVersion; clearSample();
              $('content').setAttribute('aria-busy', 'false');
              $('content').innerHTML = errorMarkup('Catalog unavailable', message, 'retry-init');
            }
          };
          const catalog = await rpc('init');
          if (attempt !== initialization) return;
          roots = catalog.roots; total = catalog.total; ready = true;
          $('tree-loading').hidden = true; $('tree').setAttribute('aria-busy', 'false');
          $('total-badge').textContent = compact.format(total); $('saved-count').textContent = number.format(saved.length);
          for (const id of ['search', 'all-series', 'saved-series', 'collapse-tree']) $(id).disabled = false;
          await renderRoute();
        } catch (error) {
          if (attempt !== initialization) return;
          $('tree-loading').textContent = 'The catalog could not load.';
          $('content').setAttribute('aria-busy', 'false');
          $('content').innerHTML = errorMarkup('Catalog unavailable', error.message, 'retry-init');
        } finally {
          if (workerUrl) URL.revokeObjectURL(workerUrl);
        }
      }
      initialize();
    </script>
