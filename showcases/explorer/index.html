            $("legend").innerHTML = `<span class="keys">${named.map(([name, color]) => `<span><i style="background:${color}"></i>${name}</span>`).join("")}</span>`;
          } else {
            map.lens((t) => feeColor(t.rate));
            $("legend").innerHTML = scaleKey();
          }
        };
      }

      // A transaction's coins in: each one's birth, the price then, and what its spend made of it.
      const AGES = [
        ["under 1 month", 30.44 * 86400, "#f0b429"],
        ["1 to 6 months", 182.6 * 86400, "#ef7d3c"],
        ["6 months to 1 year", 365.25 * 86400, "#e0525f"],
        ["1 to 2 years", 2 * 365.25 * 86400, "#bc4f9c"],
        ["2 to 4 years", 4 * 365.25 * 86400, "#7f5bd0"],
        ["4 to 8 years", 8 * 365.25 * 86400, "#4479d6"],
        ["over 8 years", Infinity, "#21a3a6"],
      ];
      const ageIndex = (s) => AGES.findIndex(([, upTo]) => s < upTo);
      const ageColor = (s) => (s === null ? "var(--faint)" : AGES[ageIndex(s)][2]);
      const BIRTHS = 60; // inputs whose births are read one by one; past that, only their amounts

      async function readTx(txid) {
        const tx = await get(`/tx/${txid}`);
        const confirmed = tx.status.confirmed;
        const time = confirmed ? tx.status.block_time : nowS();
        const [outspends, spendPrice, cpfp] = await Promise.all([
          get(`/tx/${txid}/outspends`),
          confirmed ? priceAt(tx.status.block_height) : state.price ?? get("/oracle/price").then(Number),
          confirmed ? null : get(`/v1/cpfp/${txid}`).catch(() => null),
        ]);
        const inputs = await Promise.all(
          tx.vin.map(async (v, i) => {
            if (v.is_coinbase) return { coinbase: true, value: tx.vout.reduce((s, o) => s + o.value, 0), age: null };
            const base = { value: v.prevout.value, address: v.prevout.scriptpubkey_address, type: v.prevout.scriptpubkey_type, from: v.txid, age: null };
            if (i >= BIRTHS) return base;
            const birth = await once(`status ${v.txid}`, () => get(`/tx/${v.txid}/status`));
            if (!birth.confirmed) return { ...base, age: 0, pnl: 0, unconfirmed: true };
            const price = await priceAt(birth.block_height);
            return { ...base, height: birth.block_height, age: time - birth.block_time, price, pnl: (v.prevout.value / 1e8) * (spendPrice - price) };
          }),
        );
        const outputs = tx.vout.map((o, i) => ({
          value: o.value,
          address: o.scriptpubkey_address,
          type: o.scriptpubkey_type,
          spentBy: outspends[i].spent ? outspends[i].txid : null,
        }));
        const vsize = Math.ceil(tx.weight / 4);
        const counted = inputs.filter((c) => c.pnl !== undefined);
        return {
          tx,
          confirmed,
          height: tx.status.block_height,
          time,
          vsize,
          rate: tx.fee / vsize,
          effective: cpfp?.effectiveFeePerVsize ?? tx.fee / vsize,
          // The vB its effective rate is over: its own, its waiting parents' and the child paying for it.
          package: vsize + (cpfp?.ancestors ?? []).reduce((s, a) => s + a.weight / 4, 0) + (cpfp?.bestDescendant ? cpfp.bestDescendant.weight / 4 : 0),
          price: spendPrice,
          inputs,
          outputs,
          value: inputs.reduce((s, c) => s + c.value, 0),
          profit: counted.reduce((s, c) => s + Math.max(0, c.pnl), 0),
          loss: counted.reduce((s, c) => s + Math.max(0, -c.pnl), 0),
          partial: counted.length < inputs.filter((c) => !c.coinbase).length,
        };
      }

      // ---------------------------------------------------------------- A transaction: its life as one timeline.
      // On the left the answer: where it is, when, the one thing to do about it, what it moved, paid and realized. On
      // the right its moments in time order (sent, each fee raise, now, in a block, settled), the blocks between two
      // of them one strip of squares, counted, with the rates they took.
      const SETTLE = 6; // the confirmations most services wait for
      const STRIP = 14; // squares a strip draws: a longer run shows its latest, its count says how many
      // The waiting transactions paying more than a rate, in vB, from the mempool's histogram.
      const aheadOf = (r) => (state.mempool?.fee_histogram ?? []).reduce((s, [rr, vs]) => (rr > r ? s + vs : s), 0);
      // What each block to come takes from, as the queue stands: the rate where the transactions paying more fill it
      // (the reckoning that places a transaction in the queue), the next block's from its template.
      function takesFrom() {
        const queue = [...(state.mempool?.fee_histogram ?? [])].sort((a, b) => b[0] - a[0]);
        const cut = [];
        let sum = 0;
        for (const [r, vs] of queue) {
          sum += vs;
          while (sum >= (cut.length + 1) * 1e6 && cut.length < state.projected.length) cut.push(r);
        }
        return (i) => (i === 0 ? entry(state.projected[0]) : (cut[i] ?? entry(state.projected[i])));
      }
      // A block to come: its fee rates in bands from its cheapest (top) to its dearest (bottom), each as tall as the
      // share of the block it stands for, all as tall as the block is full.
      const SHARES = [0.1, 0.15, 0.25, 0.25, 0.15, 0.1]; // between its 7 fee percentiles: min, 10, 25, 50, 75, 90, max
      function bandsOf(b, size) {
        const c = document.createElement("canvas");
        c.width = c.height = Math.round(size * Math.max(2, devicePixelRatio));
        const ctx = c.getContext("2d");
        const f = b.feeRange;
        const full = Math.min(1, b.blockVSize / 1e6);
        let y = c.height * (1 - full);
        SHARES.forEach((share, k) => {
          const h = c.height * full * share;
          ctx.fillStyle = feeColor(Math.sqrt(Math.max(f[k], 0.1) * Math.max(f[k + 1], 0.1)));
          ctx.fillRect(0, y, c.width, h + 0.5);
          y += h;
        });
        return c;
      }
      const heightAt = async (t) => (await get(`/v1/mining/blocks/timestamp/${Math.floor(t)}`)).height;
      const minerOf = (b) => (b.extras.pool && b.extras.pool.name !== "Unknown" ? b.extras.pool.name : null);

      // Every version of a payment its replacements made, oldest first, each with the one that replaced it.
      async function versionsOf(txid) {
        const root = (await get(`/v1/tx/${txid}/rbf`).catch(() => null))?.replacements;
        if (!root) return null;
        const all = [];
        const walk = (n, by, depth) => {
          all.push({ ...n.tx, time: n.time, by, depth });
          for (const c of n.replaces) walk(c, n.tx, depth + 1);
        };
        walk(root, null, 0);
        return { all: all.sort((a, b) => a.time - b.time || b.depth - a.depth), latest: root.tx };
      }

      // What the page says of a transaction: where it is, when, and what it paid, moved and realized.
      async function factsOf(t) {
        const txid = t.tx.txid;
        const usdAt = (sats, price) => (price ? (sats / 1e8) * price : null);
        const [vs, [seen]] = await Promise.all([versionsOf(txid), t.confirmed ? [0] : get(`/v1/transaction-times?txId[]=${txid}`).catch(() => [0])]);
        const k = { txid, effective: t.effective, paid: t.tx.fee, paidUsd: usdAt(t.tx.fee, t.price), value: t.value, valueUsd: usdAt(t.value, t.price), coinbase: !!t.inputs[0].coinbase };
        k.coins = `${plural(t.inputs.length, "coin")} in, ${int(t.outputs.length)} out`;
        k.signals = t.tx.vin.some((v) => v.sequence < 0xfffffffe);
        if (vs?.all.length > 1) {
          k.versions = vs.all;
          k.first = vs.all[0];
          k.me = vs.all.find((x) => x.txid === txid);
        }
        // Value created and destroyed, as Studio counts them: its coins at the price they're spent at, and at the
        // prices they came in at; the difference is what spending them realizes. A coin that came in still waiting came
        // in at today's price (it creates what it destroys), one from before Bitcoin had a price at $0 (all it creates
        // is profit). A spend with no price has neither; past the coins whose births are read, the rest stay out.
        const priced = t.inputs.filter((c) => !c.coinbase && c.pnl !== undefined);
        if (t.price && priced.length) {
          k.created = priced.reduce((s, c) => s + (c.value / 1e8) * t.price, 0);
          k.destroyed = priced.reduce((s, c) => s + (c.value / 1e8) * (c.unconfirmed ? t.price : c.price), 0);
          k.realized = k.created - k.destroyed;
          k.pricedAll = priced.length === t.inputs.filter((c) => !c.coinbase).length;
        }
        if (!t.confirmed) {
          k.state = "waiting";
          k.sent = k.first?.time ?? (seen || null);
          // Its place: the next block if the template holds it, else behind all that pays more, a block a million vB.
          k.inNext = !!state.next?.txs.some((x) => x.txid === txid);
          k.ahead = k.inNext ? 0 : aheadOf(t.effective);
          k.place = k.inNext ? 0 : Math.max(1, Math.floor(k.ahead / 1e6));
          k.slot = Math.min(k.place, state.projected.length - 1); // the projected block it's in, the last holding all the rest
          k.far = !k.inNext && k.place >= state.projected.length - 1 && state.projected.at(-1).blockVSize > 1.05e6;
          // Paying nothing and not in the template: it gets in only with a transaction spending it that pays for both.
          k.stuck = !k.inNext && t.effective <= 0;
          k.eta = nowS() + (k.place + 1) * 600;
          k.settleEta = k.eta + (SETTLE - 1) * 600;
          k.need = entry(state.projected[0]);
          k.bump = k.inNext ? 0 : Math.max(0, Math.ceil((k.need - t.effective) * t.package));
          k.bumpUsd = usdAt(k.bump, state.price);
          k.title = k.inNext ? "In the next block" : k.stuck ? "Paying nothing" : k.far ? "Far back in the queue" : `About ${k.place + 1} blocks away`;
          k.lede = k.inNext
            ? `About ten minutes from now, around ${clockTime(k.eta)}.`
            : k.stuck
              ? "It gets into a block only with a transaction spending it that pays for both."
              : k.far
              ? `${nf(1).format(k.ahead / 1e6)} blocks of transactions pay more. ${span((k.place + 1) * 600)} at best.`
              : `Around ${clockTime(k.eta)}, if nothing paying more comes first.`;
          return k;
        }
        const block = await get(`/v1/block/${t.tx.status.block_hash}`);
        k.height = t.height;
        k.time = t.time;
        k.conf = state.tip - t.height + 1;
        k.state = k.conf >= SETTLE ? "settled" : "confirmed";
        k.sent = k.first?.time ?? null;
        k.settleEta = k.conf < SETTLE ? nowS() + (SETTLE - k.conf) * 600 : null;
        const floor = block.extras.feeRange[0];
        const times = floor > 0 && !k.coinbase ? t.effective / floor : null;
        const floorSats = Math.ceil(floor * t.vsize);
        k.title = k.state === "settled" ? "Settled" : "Confirmed";
        k.lede =
          k.state === "settled"
            ? `In block ${int(k.height)}${nowS() - k.time > 365.25 * 86400 ? ` on ${day(k.time)}` : `, ${ago(k.time)}`}: ${int(k.conf)} confirmations deep.`
            : `In block ${int(k.height)}, ${ago(k.time)}: ${k.conf} of the ${SETTLE} confirmations most services wait for.`;
        k.say = k.coinbase
          ? "New coins: the miner's reward, with no fee."
          : times === null
            ? `It paid ${btc(k.paid)} BTC in fees.`
            : times < 1.05
              ? `It paid ${rate(t.effective)}, the least of any transaction in its block${block.weight < 3.6e6 ? ", which had room to spare" : ""}.`
              : `It paid ${rate(t.effective)}, ${nf(times < 10 ? 1 : 0).format(times)} times the ${rate(floor)} the cheapest in its block paid: ${t.price ? cost(usdAt(floorSats, t.price)) : `${int(floorSats)} sats`} would have done.`;
        return k;
      }

      // A version its replacement took the place of: gone from the queue, so read from its replacement tree alone.
      async function replacedOf(txid) {
        const vs = await versionsOf(txid);
        const me = vs?.all.find((x) => x.txid === txid);
        if (!me?.by) return null;
        const by = vs.all.find((x) => x.txid === me.by.txid);
        const newest = await get(`/tx/${vs.latest.txid}`).catch((e) => (e.status === 404 ? null : Promise.reject(e)));
        const k = { state: "replaced", txid, effective: me.rate, paid: me.fee, paidUsd: state.price ? (me.fee / 1e8) * state.price : null, value: me.value, versions: vs.all, first: vs.all[0], me, by, latest: vs.latest };
        k.latestIn = newest?.status.confirmed ? newest.status.block_height : null;
        k.latestGone = !newest;
        k.title = "Replaced";
        k.lede = `Its sender replaced it ${span(by.time - me.time)} after sending it, with a version paying ${rate(by.rate)} instead of ${rate(me.rate)}. This one can no longer confirm.`;
        k.say = `${k.latestIn ? `The payment's latest version is in block ${int(k.latestIn)}.` : k.latestGone ? "The payment's latest version isn't in the queue any more." : "The payment's latest version is waiting to confirm."} ${me.rbf ? "This version signalled replace-by-fee." : "This version didn't signal replace-by-fee; nodes took the replacement anyway."}`;
        return k;
      }

      // Blocks a to b as a strip: the count, the latest STRIP of them, and the cheapest rate each took (all of them).
      async function stripOf(a, b) {
        const n = b - a + 1;
        if (n <= 0) return null;
        const from = Math.max(a, b - STRIP + 1);
        const [pages, floors] = await Promise.all([
          Promise.all((from <= b - 10 ? [b - 10, b] : [b]).map((h) => get(`/v1/blocks/${h}`))),
          series("tx_effective_fee_rate_min", "height", a, b + 1),
        ]);
        const at = new Map(pages.flat().map((x) => [x.height, x]));
        const blocks = [];
        for (let h = from; h <= b; h++) if (at.has(h)) blocks.push(at.get(h));
        const paying = floors.filter((f) => f > 0);
        return { kind: "strip", n, blocks, more: n - blocks.length, lo: paying.length ? Math.min(...paying) : 0, hi: Math.max(0, ...floors) };
      }
      const rates = (lo, hi) => (rateNum(lo) === rateNum(hi) ? rate(lo) : `${rateNum(lo)} to ${rate(hi)}`);

      // Its moments in time order, each a row; between two, the blocks mined or to come as a strip.
      async function momentsOf(k) {
        const usdOf = (sats) => (state.price ? cost((sats / 1e8) * state.price) : `${int(sats)} sats`);
        const moment = (at, mark, title, note, more = {}) => ({ kind: "moment", at, mark, title, note, ...more });
        const versionMoments = (list) =>
          list.map((x, i) =>
            moment(x.time, "dot", x === k.first ? "Sent" : "Fee raised", `${x === k.first ? "paying" : "to"} ${rate(x.rate)}, ${usdOf(x.fee)}${x.txid === k.txid ? " · this version" : ""}`, {
              href: x.txid === k.txid ? null : url.tx(x.txid),
              txid: x.txid,
            }),
          );
        // Moments with the blocks mined after each up to the next (the last's up to a height), as strips.
        const withStrips = async (list, until) => {
          const hs = await Promise.all(list.map((m) => heightAt(m.at)));
          const strips = await Promise.all(list.map((m, i) => stripOf(hs[i] + 1, i + 1 < list.length ? hs[i + 1] : until)));
          return list.flatMap((m, i) => (strips[i] ? [m, { ...strips[i], say: `${plural(strips[i].n, "block")} without it`, sub: `taking from ${rates(strips[i].lo, strips[i].hi)}` }] : [m]));
        };
        const rows = [];
        if (k.state === "waiting") {
          const sent = k.versions ? versionMoments(k.versions) : k.sent ? [moment(k.sent, "dot", "Sent", `paying ${rate(k.effective)}, ${usdOf(k.paid)}`)] : [];
          rows.push(...(sent.length ? await withStrips(sent, state.tip) : []));
          rows.push(moment(nowS(), "now", "Now, in the queue", k.inNext ? "next in line" : k.stuck ? "paying nothing, behind everything that pays" : `${nf(1).format(k.ahead / 1e6)} blocks of transactions pay more`));
          if (k.stuck) return rows;
          const takes = takesFrom();
          if (k.place > 0)
            rows.push({ kind: "strip", come: Array.from({ length: k.slot }, (_, i) => i), more: k.place - k.slot, n: k.place, say: `${plural(k.place, "block")} ahead of it`, sub: `taking from ${rates(takes(k.slot - 1), takes(0))}` });
          rows.push(
            moment(k.eta, "come", k.far ? "In a block, at best" : "In a block", k.far ? `about the ${nth(k.place + 1)} block to come` : `the ${k.place ? nth(k.place + 1) : "next"} block, which takes from ${rate(ceilRate(takes(k.slot)))}`, { slot: k.slot, hit: true }),
          );
          rows.push({ kind: "strip", ghosts: SETTLE - 1, n: SETTLE - 1, say: `${SETTLE - 1} more blocks`, sub: "each one more confirmation" });
          rows.push(moment(k.settleEta, "dot", "Settled", `${SETTLE} confirmations`));
        } else if (k.state === "replaced") {
          const mine = versionMoments(k.versions.filter((x) => x.time <= k.me.time));
          rows.push(...(await withStrips([...mine, moment(k.by.time, "gone", "Replaced", `by a version paying ${rate(k.by.rate)}`)], await heightAt(k.by.time))));
          // The payment after: its later raises and its latest version, softer, another version's story.
          const later = versionMoments(k.versions.filter((x) => x.time > k.me.time && x.txid !== k.by.txid)).map((m) => ({ ...m, faint: true }));
          rows.push(...later);
          rows.push(
            moment(later.at(-1)?.at ?? k.by.time, "dot", k.latestIn ? `Its latest version, in block ${int(k.latestIn)}` : k.latestGone ? "Its latest version, gone from the queue" : "Its latest version is waiting", `paying ${rate(k.latest.rate)}`, {
              href: url.tx(k.latest.txid),
              faint: true,
            }),
          );
        } else {
          const h = k.height;
          const top = Math.min(state.tip, h + SETTLE - 1);
          const [mined, sent] = await Promise.all([
            get(`/v1/blocks/${top}`).then((x) => x.filter((b) => b.height >= h && b.height <= top).reverse()),
            k.versions ? withStrips(versionMoments(k.versions), h - 1) : [],
          ]);
          rows.push(...sent);
          const its = mined[0];
          rows.push(moment(its.timestamp, "block", `In block ${int(h)}`, `1st confirmation${minerOf(its) ? ` · ${minerOf(its)}` : ""}`, { b: its, hit: true }));
          const after = mined.slice(1, SETTLE - 1);
          if (after.length) rows.push({ kind: "strip", blocks: after, n: after.length, more: 0, say: after.length === 1 ? "the 2nd confirmation" : `confirmations 2 to ${after.length + 1}` });
          if (k.conf < SETTLE) {
            const left = SETTLE - k.conf - 1;
            if (left) rows.push({ kind: "strip", ghosts: left, n: left, say: `${plural(left, "block")} to come` });
            rows.push(moment(k.settleEta, "dot", "Settled", `the ${nth(SETTLE)} confirmation`));
          } else {
            const sixth = mined[SETTLE - 1];
            rows.push(moment(sixth.timestamp, "block", "Settled", `block ${int(sixth.height)}, the ${nth(SETTLE)} confirmation`, { b: sixth, hit: true }));
            if (k.conf > SETTLE) rows.push({ kind: "strip", n: k.conf - SETTLE, more: k.conf - SETTLE, say: `${plural(k.conf - SETTLE, "block")} since` });
          }
        }
        // Raises with no block mined between them, three or more in a row, fold into one, each version listed under it.
        const out = [];
        for (let i = 0; i < rows.length; ) {
          let j = i;
          while (j < rows.length && rows[j].title === "Fee raised" && rows[j].faint === rows[i].faint) j++;
          if (j - i >= 3) {
            const run = rows.slice(i, j);
            const list = run.map((m) => k.versions.find((x) => x.txid === m.txid));
            const before = k.versions[k.versions.indexOf(list[0]) - 1] ?? list[0];
            out.push({ ...run.at(-1), title: `Fee raised ${run.length} times`, note: `from ${rate(before.rate)} to ${rate(list.at(-1).rate)}${list.at(-1).txid === k.txid ? " · this version" : ""}`, list, href: null });
            i = j;
          } else out.push(rows[i++]);
        }
        return out;
      }

      // The answer column.
      const STATE = { waiting: "Waiting", confirmed: "Confirmed", settled: "Settled", replaced: "Replaced" };
      function answerOf(k) {
        const W = k.state === "waiting";
        const money = (u, sats) => (u !== null ? cost(u) : `${btc(sats)} BTC`);
        const none = k.realized !== undefined && Math.abs(k.realized) < 0.005;
        const bump = k.bumpUsd === null ? `${int(k.bump)} sats` : k.bumpUsd < 0.005 ? "Under $0.01" : usd(k.bumpUsd);
        const realized =
          k.state === "replaced" || k.coinbase
            ? ""
            : k.created === undefined
              ? fig("Realized", "—", "no price this early")
              : wide(fig(
                  W ? "Would realize" : "Realized",
                  `<span class="${none ? "" : tone(k.realized)}">${none ? "Nothing" : signed(k.realized)}</span>`,
                  `<span class="vc">value created ${usd(k.created)}</span><span class="vd">value destroyed ${usd(k.destroyed)}${k.pricedAll ? "" : `, of its first ${BIRTHS} coins`}</span>`,
                ));
        return `<div class="lead">
            <p class="lead-kicker"><span class="chip">${STATE[k.state]}${k.state === "confirmed" ? `, ${k.conf} of ${SETTLE}` : ""}</span>${copyPill(k.txid)}</p>
            <h2 class="lead-title">${k.title}</h2>
            <p class="lead-lede">${k.lede}</p>
            ${W && !k.inNext ? `<p class="lead-act"><b>${bump} more gets it into the next block.</b>Its sender can raise the fee, or its receiver can spend it with a fee that covers both.</p>` : ""}
            ${W ? `<p class="lead-note">Not final until it's in a block: ${k.signals ? "it signals that its sender may replace it" : "its sender can still replace it"}.</p>` : `<p class="lead-note">${k.say}</p>`}
            <dl class="lead-figs">
              ${fig("Moved", btcU(k.value), k.state === "replaced" ? "" : k.valueUsd !== null ? usd(k.valueUsd) : k.coins)}
              ${k.coinbase ? "" : fig(W ? "Pays" : "Paid", money(k.paidUsd, k.paid), `${int(k.paid)} sats · ${rate(k.effective)}`)}
              ${k.state === "replaced" ? wide(fig("Its replacement", money(state.price ? (k.by.fee / 1e8) * state.price : null, k.by.fee), rate(k.by.rate))) : realized}
            </dl>
          </div>`;
      }
      // The timeline: each moment a row, its time, its mark on the line and what it was; each strip its squares.
      function timelineOf(rows) {
        const now = nowS() + 1;
        const past = (r) => (r.kind === "moment" ? r.at <= now && r.mark !== "come" : !r.come && !r.ghosts);
        return rows
          .map((r, i) => {
            const cls = `${past(r) ? "past" : "future"} ${rows[i + 1] && past(rows[i + 1]) ? "" : "dotted"}`;
            if (r.kind === "strip") {
              const squares = r.blocks
                ? r.blocks.map((b) => `<a class="ssq" href="${url.block(b.height)}" data-block="${b.height}" aria-label="Block ${int(b.height)}"></a>`).join("")
                : r.come
                  ? r.come.map((s) => `<span class="ssq come" data-slot="${s}"></span>`).join("")
                  : `<span class="ssq ghost"></span>`.repeat(r.ghosts ?? 0);
              const more = r.more > 0 && (r.blocks?.length || r.come?.length) ? `<span class="more-n">+${int(r.more)}</span>` : "";
              return `<li class="strip ${cls}"><span class="tt-t"></span><span class="tt-m"></span>
                <span class="tt-s">${r.blocks ? more + squares : squares + more}<small><b>${r.say}</b>${r.sub ? `, ${r.sub}` : ""}</small></span></li>`;
            }
            const mark =
              r.mark === "block"
                ? `<a class="tsq" href="${url.block(r.b.height)}" data-block="${r.b.height}" aria-label="Block ${int(r.b.height)}"></a>`
                : r.mark === "come"
                  ? `<a class="tsq come" href="${url.ahead(r.slot)}" data-slot="${r.slot}" aria-label="The block it should get into"></a>`
                  : `<i class="tdot"></i>`;
            const href = r.href ?? (r.mark === "block" ? url.block(r.b.height) : null);
            const list = r.list
              ? `<details class="tt-list"><summary>${int(r.list.length)} versions, ${clockTime(r.list[0].time)} to ${clockTime(r.list.at(-1).time)}</summary>${r.list
                  .map((x) => `<a href="${url.tx(x.txid)}"><span>${clockTime(x.time)}</span><span>${rate(x.rate)}</span><span>${state.price ? cost((x.fee / 1e8) * state.price) : `${int(x.fee)} sats`}</span></a>`)
                  .join("")}</details>`
              : "";
            return `<li class="moment ${r.mark} ${cls} ${r.hit ? "hit" : ""} ${r.faint ? "faint" : ""}">
              <span class="tt-t">${r.mark === "now" ? "now" : `${past(r) ? "" : "~"}${stamp(r.at)}`}</span><span class="tt-m">${mark}</span>
              <span class="tt-w"><b>${href ? `<a href="${href}">${r.title}</a>` : r.title}</b><small>${r.note}</small>${list}</span></li>`;
          })
          .join("");
      }
      function paintTimeline(rows) {
        const blocks = new Map(rows.flatMap((r) => (r.b ? [r.b] : (r.blocks ?? []))).map((b) => [b.height, b]));
        for (const el of document.querySelectorAll(".tt-rows [data-block]")) el.append(square(blocks.get(+el.dataset.block), el.classList.contains("tsq") ? 32 : 18, ""));
        for (const el of document.querySelectorAll(".tt-rows [data-slot]")) el.append(bandsOf(state.projected[+el.dataset.slot], el.classList.contains("tsq") ? 32 : 18));
      }
      // Its coins: where they went, then each coin in and out.
      function coinsOf(t) {
        const ages = [...new Set(t.inputs.filter((c) => c.age !== null && !c.coinbase).map((c) => ageIndex(c.age)))].sort((a, b) => a - b);
        return `
          <section class="tt-coins">
            <div class="sechead"><h2>Where its coins went</h2><p>${ages.length ? `held for ${ages.map((i) => AGES[i][0]).join(", ")}` : ""}</p></div>
            <figure><div class="flow" id="flow"><svg id="flow-svg" role="img" aria-label="The coins in, by how long they had been held, and the coins out"></svg></div>
              <figcaption class="caption"><span class="keys">${ages.map((i) => `<span><i style="background:${AGES[i][2]}"></i>${AGES[i][0]}</span>`).join("")}</span></figcaption></figure>
          </section>
          <section>
            <div class="sides">
              <div class="list"><h3 class="label"><span>In</span><span>${plural(t.inputs.length, "coin")}</span></h3><ul>${t.inputs.slice(0, 200).map(inputRow).join("")}</ul>${t.inputs.length > 200 ? `<p class="more">The first 200 listed.</p>` : ""}</div>
              <div class="list"><h3 class="label"><span>Out</span><span>${plural(t.outputs.length, "coin")}</span></h3><ul>${t.outputs.slice(0, 200).map(outputRow).join("")}</ul>${t.outputs.length > 200 ? `<p class="more">The first 200 listed.</p>` : ""}</div>
            </div>
          </section>`;
      }
      // Between blocks, a waiting transaction's page is read again when its place in the queue changes, the template
      // takes it in or leaves it out, or it's replaced.
      async function recheckTx() {
        const v = state.view;
        const k = v?.facts;
        if (v?.kind !== "tx" || k?.state !== "waiting") return;
        const inNext = !!state.next?.txs.some((x) => x.txid === k.txid);
        const place = inNext ? 0 : Math.max(1, Math.floor(aheadOf(k.effective) / 1e6));
        const root = (await get(`/v1/tx/${k.txid}/rbf`).catch(() => null))?.replacements?.tx.txid;

      const FLOW_MAX = 24; // coins drawn on each side; the rest join one band
      const LABEL = 36; // a label's height: its amount, and a line under it

      function drawFlow() {
        const t = state.flow;
        const svg = $("flow-svg");
        if (!svg) return;
        const fold = (list, make) => (list.length <= FLOW_MAX ? list : [...list.slice(0, FLOW_MAX - 1), make(list.slice(FLOW_MAX - 1))]);
        const ins = fold(t.inputs, (rest) => ({ value: rest.reduce((s, c) => s + c.value, 0), age: null, rest: rest.length }));
        const outs = [

        const L = narrow ? 92 : 168;
        const R = W - (narrow ? 96 : 176);

        const usable = H - 12;

        const MIN = 1.5;

        for (const c of ins) {

          parts.push(`<rect x="${L - 3}" y="${y}" width="3" height="${h}" rx="1" style="fill:${color}"/>`);

                : esc(short(c.address ?? c.type, 5));

      // ---------------------------------------------------------------- An address: what it holds on the left, its

      async function viewAddress(address) {

      // An address's timeline: as a transaction's, each moment its time, mark and what it was, green in and red out.

      // ---------------------------------------------------------------- Routes: mempool.space's, under the explorer's folder.

      // forming one, so the home); tx/TXID; address/ADDRESS. Anything else isn't a place.
      function parse() {

      // ---------------------------------------------------------------- Search: a height, a block hash, a txid or an address.

      let searches = 0;

        }
        if (e.key === "Escape" && state.view?.kind !== "home") return history.length > 1 ? history.back() : go(BASE);
        if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && state.view?.kind === "block" && isHeight(state.view.ref)) {
          const h = Number(state.view.ref) + (e.key === "ArrowLeft" ? -1 : 1);
          if (h >= 0 && h <= state.tip) {
            e.preventDefault();
            go(url.block(h), true);
          }
        }
      });

      // Each "ago" ticks, the forming block's wait with them.
      setInterval(() => {
        for (const el of document.querySelectorAll("[data-ago]")) el.textContent = ago(Number(el.dataset.ago));
        drawForming();
      }, 15000);
      new ResizeObserver(() => drawFlow()).observe(document.documentElement);

      // A phone's search field says less, in the room it has.
      const narrowBar = matchMedia("(width < 720px)");
      const placeholder = () => ($("find").q.placeholder = narrowBar.matches ? "Height, txid or address" : "Search a block, transaction or address");
      narrowBar.addEventListener("change", placeholder);
      placeholder();
      // Fee colours and pool logos are each scheme's own: drawn again on a change.
      lightScheme.addEventListener("change", () => (thumbs.clear(), render()));

      // ---------------------------------------------------------------- Start.
      // Each read on its own: one failing leaves the others shown, and the timers try it again.
      await Promise.allSettled([readTip(), readProjected(), readPrice(), loadNext(), readDifficulty()]);
      render();
      state.booted = true;
      setInterval(followNext, 4000);
      setInterval(() => readTip().catch(() => {}), 10000);
      setInterval(() => readProjected().catch(() => {}), 10000);
      setInterval(() => readPrice().catch(() => {}), 30000);
      setInterval(() => readDifficulty().catch(() => {}), 120000);
    </script>
  </body>
</html>
