[package]
name = "bitview_cli"
description = "Generated command-line client for Bitview. Bitview is a free, open-source Bitcoin data server: on-chain metrics, blocks, mempool and mining data, with charts and an API, at bitview.space or beside your own Bitcoin Core node."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["bitcoin", "analytics", "api", "cli"]
categories = ["command-line-utilities", "api-bindings"]

[dependencies]
percent-encoding = "2.3.2"
ureq = { workspace = true }

[[bin]]
name = "bitview-cli"
path = "src/main.rs"
