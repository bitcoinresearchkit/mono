[package]
name = "brk_lsm_tree"
description = "BRK-maintained fork of lsm-tree 3.1.9, a minimal log-structured merge tree implementation"
license.workspace = true
version.workspace = true
edition.workspace = true
autotests = false
readme = "README.md"
repository.workspace = true
homepage.workspace = true

[lib]
name = "lsm_tree"
path = "src/lib.rs"

[dependencies]
arc-swap = "1.9.2"
byteorder = { package = "byteorder-lite", version = "0.1.0" }
byteview = { workspace = true }
interval-heap = "0.0.5"
log = { workspace = true }
lz4_flex = { workspace = true, features = ["checked-decode"] }
quick_cache = { version = "0.7.0", default-features = false, features = [] }
rustc-hash = { workspace = true }
self_cell = "1.3.0"
sfa = "~1.0.0"
tempfile = { workspace = true }
varint-rs = "2.2.1"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
nanoid = "0.5.0"
strum = { version = "0.28.0", features = ["derive"] }
test-log = "0.2.21"

[[test]]
name = "table_only"
path = "tests/table_only.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage,coverage_nightly)',
] }

[[bench]]
name = "table_only"
harness = false
path = "benches/table_only.rs"
