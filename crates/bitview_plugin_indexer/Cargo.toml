[package]
name = "bitview_plugin_indexer"
description = "The blockchain indexer plugin for Bitview"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true
readme = "README.md"

[features]
# What `bitviewd_bench`'s serial replay needs of the indexer: a cap on the tip it indexes to, its
# background work joined into its step, and the lengths to rewind to. A `--workspace` build unifies
# it into `bitviewd`, where it stays inert (see `bitview_default`'s feature).
bench-cpu = ["fjall/bench-cpu"]

[dependencies]
arc-swap = { workspace = true }
bitcoin = { workspace = true }
bitview_plugin = { workspace = true }
bitview_primitives = { workspace = true, features = ["storage"] }
brk_error = { workspace = true, features = ["fjall", "vecdb"] }
brk_exit = { workspace = true }
brk_reader = { workspace = true }
brk_store = { workspace = true }
bitview_traversable = { workspace = true }
brk_types = { workspace = true, features = ["storage"] }
crossbeam-channel = "0.5.17"
fjall = { workspace = true }
rayon = { workspace = true }
rapidhash = { workspace = true }
rustc-hash = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
vecdb = { workspace = true, features = ["derive", "pco"] }
