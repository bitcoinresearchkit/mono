[package]
name = "brk_types"
description = "Structs used throughout BRK"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
schemars = ["dep:schemars", "dep:serde_json", "vecdb?/schemars"]
storage = ["dep:vecdb", "brk_error/vecdb"]

[dependencies]
bitcoin = { workspace = true }
brk_error = { workspace = true, features = ["bitcoin", "jiff"] }
derive_more = { workspace = true }
itoa = { workspace = true }
jiff = { workspace = true }
ryu = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
strum = { workspace = true }
vecdb = { workspace = true, optional = true }
