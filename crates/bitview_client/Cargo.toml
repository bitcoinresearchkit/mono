[package]
name = "bitview_client"
description = "Synchronous Rust client for Bitview. Bitview is a free, open-source Bitcoin data server: on-chain metrics, blocks, mempool and mining data, with charts and an API, at bitview.space or beside your own Bitcoin Core node."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["bitcoin", "blockchain", "analytics", "on-chain"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[dependencies]
bitview_cohort = { workspace = true }
bitview_primitives = { workspace = true }
bitview_types = { workspace = true }
bitview_catalog = { workspace = true }
brk_types = { workspace = true }
percent-encoding = "2.3.2"
rapidhash = { workspace = true }
ureq = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
