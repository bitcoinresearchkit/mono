[package]
name = "bitview_plugin_price"
description = "Bitcoin USD spot prices and OHLC candles from exchange history and an on-chain oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true

[dependencies]
bitview_compute = { workspace = true }
bitview_primitives = { workspace = true, features = ["storage"] }
brk_exit = { workspace = true }
bitview_vecs = { workspace = true }
bitview_plugin = { workspace = true }
bitview_plugin_mappings = { workspace = true }
brk_error = { workspace = true, features = ["vecdb"] }
bitview_plugin_indexer = { workspace = true }
brk_oracle = { workspace = true }
bitview_traversable = { workspace = true }
brk_types = { workspace = true, features = ["storage"] }
derive_more = { workspace = true }
rangeindex = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
vecdb = { workspace = true }
