[package]
name = "bitview_website"
description = "Serves Bitview's showcases, embedded or from a directory"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
include = ["src/**/*", "showcases/**/*", "Cargo.toml", "README.md"]

[dependencies]
axum = { workspace = true }
bitview_http = { workspace = true }
include_dir = { workspace = true }
flate2 = { workspace = true }
rapidhash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
brk_logger = { workspace = true }
# The example's server: a multi-thread runtime and its layers.
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tower-http = { workspace = true, features = ["catch-panic", "cors", "timeout", "trace"] }

