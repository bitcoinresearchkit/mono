[package]
name = "brk_byteview"
description = "BRK-maintained fork of byteview 0.10.2, a thin immutable zero-copy byte slice"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
[lib]
name = "byteview"
path = "src/lib.rs"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "byteview"
harness = false
path = "benches/byteview.rs"
