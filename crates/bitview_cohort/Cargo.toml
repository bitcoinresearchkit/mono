[package]
name = "bitview_cohort"
description = "Cohort definitions used throughout Bitview"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
storage = ["dep:bitview_traversable", "dep:vecdb", "brk_types/storage", "bitview_primitives/storage"]

[dependencies]
bitview_primitives = { workspace = true }
bitview_traversable = { workspace = true, optional = true }
brk_types = { workspace = true }
vecdb = { workspace = true, optional = true }
rayon = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
