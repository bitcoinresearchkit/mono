[package]
name = "bitview_server"
description = "HTTP API server for Bitview analytics"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude = ["examples/", "src/api/scalar.js"]

[features]
default = ["full-api"]
full-api = ["chain", "series", "urpd"]
bedrock = ["bitview_query/bedrock"]
blocks = ["bitview_query/blocks"]
coinflow = ["bitview_query/coinflow"]
cointime = ["bitview_query/cointime"]
distribution = ["bitview_query/distribution"]
mappings = ["bitview_query/mappings"]
inputs = ["bitview_query/inputs"]
mining = ["bitview_query/mining"]
outputs = ["bitview_query/outputs"]
pools = ["bitview_query/pools"]
price = ["mappings", "bitview_query/price"]
transactions = ["bitview_query/transactions"]
chain = [
    "blocks",
    "distribution",
    "mappings",
    "inputs",
    "mining",
    "outputs",
    "pools",
    "price",
    "transactions",
    "bitview_query/chain",
]
series = ["mappings", "bitview_query/series"]
urpd = [
    "bedrock",
    "coinflow",
    "cointime",
    "distribution",
    "price",
    "bitview_query/urpd",
]

[dependencies]
bitcoin = { workspace = true }
brk_rpc = { workspace = true, features = ["async"] }
aide = { workspace = true }
axum = { workspace = true }
http-body = { workspace = true }
brk_error = { workspace = true, features = ["jiff", "serde_json", "tokio", "vecdb"] }
brk_oracle = { workspace = true }
bitview_query = { workspace = true, default-features = false, features = ["tokio"] }
bitview_types = { workspace = true }
bitview_catalog = { workspace = true }
brk_types = { workspace = true, features = ["storage"] }
bitview_website = { workspace = true }
derive_more = { workspace = true }
jiff = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
tower-http = { workspace = true, features = ["limit"] }
tower-layer = { workspace = true }

[dev-dependencies]
vecdb = { workspace = true }
brk_mempool = { workspace = true }
tower = { workspace = true }
brk_exit = { workspace = true }
bitview_default = { workspace = true }
bitview_plugin = { workspace = true }
bitview_plugin_distribution = { workspace = true }
bitview_plugin_indexer = { workspace = true }
bitview_plugin_inputs = { workspace = true }
bitview_plugin_investing = { workspace = true }
bitview_plugin_mappings = { workspace = true }
bitview_plugin_market = { workspace = true }
bitview_plugin_outputs = { workspace = true }
bitview_plugin_price = { workspace = true }
bitview_plugin_transactions = { workspace = true }
bitview_runtime = { workspace = true }
brk_reader = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
