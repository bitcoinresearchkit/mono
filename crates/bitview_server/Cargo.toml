[package]
name = "bitview_server"
description = "HTTP API server for Bitview analytics"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude = ["examples/", "src/api/scalar.js"]

[features]
default = ["full-api"]
full-api = ["chain", "series", "urpd", "bitview_query/full-api"]
chain = ["price", "bitview_query/chain"]
series = ["bitview_query/series"]
urpd = ["price", "bitview_query/urpd"]
price = ["bitview_query/price"]

[dependencies]
bitcoin = { workspace = true }
bitview_primitives = { workspace = true, features = ["storage"] }
brk_rpc = { workspace = true, features = ["async"] }
aide = { workspace = true }
axum = { workspace = true }
http-body = { workspace = true }
brk_error = { workspace = true, features = ["jiff", "serde_json", "tokio", "vecdb"] }
brk_oracle = { workspace = true, features = ["schemars"] }
bitview_query = { workspace = true, default-features = false, features = ["indexer"] }
bitview_types = { workspace = true }
bitview_catalog = { workspace = true }
brk_types = { workspace = true, features = ["storage"] }
bitview_website = { workspace = true }
derive_more = { workspace = true }
jiff = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
tower-http = { workspace = true, features = ["limit"] }
tower-layer = { workspace = true }
