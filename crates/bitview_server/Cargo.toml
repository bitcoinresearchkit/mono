[package]
name = "bitview_server"
description = "HTTP API server for Bitview analytics"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["full-api"]
full-api = ["series", "bitview_query/full-api"]
series = ["bitview_query/series"]

[package.metadata.release]
pre-release-replacements = [
    { file = "mcp/server.json", search = '"version": "[^"]+"', replace = '"version": "{{version}}"', exactly = 1, prerelease = true },
]

[dependencies]
base64 = "0.23.1"
bitcoin = { workspace = true }
bitview_primitives = { workspace = true, features = ["storage"] }
brk_rpc = { workspace = true, features = ["async"] }
aide = { workspace = true }
axum = { workspace = true }
brk_error = { workspace = true, features = ["jiff", "serde_json", "tokio", "vecdb"] }
brk_logger = { workspace = true }
bitview_query = { workspace = true, default-features = false }
bitview_types = { workspace = true }
bitview_catalog = { workspace = true }
bitview_http = { workspace = true }
brk_types = { workspace = true, features = ["storage"] }
bitview_website = { workspace = true }
derive_more = { workspace = true, features = ["display", "from", "from_str", "into"] }
http-body-util = "0.1.3"
jiff = { workspace = true }
percent-encoding = "2.3.2"
schemars = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["catch-panic", "cors", "limit", "timeout"] }
tracing = { workspace = true }
