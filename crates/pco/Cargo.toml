[package]
name = "pco"
description = "BRK-maintained fork of PCO 1.0.3, numerical sequence compression"
version.workspace = true
edition = "2021"
rust-version = "1.87.0"
authors = ["mwlon <m.w.loncaric@gmail.com>"]
repository = "https://github.com/pcodec/pcodec"
license = "Apache-2.0"
readme = "README.md"
keywords = ["compression", "numerical", "delta"]
categories = ["compression", "encoding"]
publish = false
include = [
  "src/**/*.rs",
  "assets/*.pco",
  "Cargo.toml",
  "README.md",
  "BRK_PATCH.md",
  "LICENSE",
  "build.rs",
]
build = "build.rs"

[package.metadata.release]
release = false

[dependencies]
better_io = "0.2.0"
dtype_dispatch = "0.2.1"
half = "2.0.0"
rand_xoshiro = "0.6.0"

[dev-dependencies]
rand = "0.8.4"
