[package]
name = "bitview_vecs"
description = "Composable metric vectors, views, shapes and value transforms for Bitview plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true

[dependencies]
arc-swap = { workspace = true }
bitview_primitives = { workspace = true, features = ["storage"] }
bitview_compute = { workspace = true }
brk_exit = { workspace = true }
rangeindex = { workspace = true }
brk_error = { workspace = true, features = ["vecdb"] }
bitview_traversable = { workspace = true, features = ["zstd"] }
brk_types = { workspace = true, features = ["storage"] }
brk_oracle = { workspace = true }
derive_more = { workspace = true }
rayon = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
vecdb = { workspace = true, features = ["zstd"] }
