[package]
name = "bitview"
description = "A composition-agnostic daemon runner for Bitview plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true
readme = "README.md"
keywords = ["bitcoin", "analytics", "blockchain", "data", "self-hosted"]

[features]
default = []
full-api = ["chain", "series", "urpd"]
chain = ["price", "bitview_server/chain"]
series = ["bitview_server/series"]
urpd = ["price", "bitview_server/urpd"]
price = ["bitview_server/price"]

[dependencies]
brk_exit = { workspace = true }
bitview_query = { workspace = true, features = ["tokio"] }
bitview_runtime = { workspace = true }
bitview_server = { workspace = true }
brk_error = { workspace = true, features = ["tokio", "vecdb"] }
brk_mempool = { workspace = true }
brk_reader = { workspace = true }
brk_rpc = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
vecdb = { workspace = true }
