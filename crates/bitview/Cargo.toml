[package]
name = "bitview"
description = "A self-hostable Bitcoin data platform built on BRK"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true
readme = "README.md"
keywords = ["bitcoin", "analytics", "blockchain", "data", "self-hosted"]

[dependencies]
anyhow = "1.0"
bitview_plugin = { workspace = true }
bitview_composition = { workspace = true }
bitview_runtime = { workspace = true }
bitview_traversable = { workspace = true }
brk_alloc = { workspace = true }
brk_error = { workspace = true, features = ["tokio", "vecdb"] }
bitview_plugin_indexer = { workspace = true }
brk_logger = { workspace = true }
brk_mempool = { workspace = true }
bitview_query = { workspace = true }
brk_reader = { workspace = true }
brk_rpc = { workspace = true }
bitview_server = { workspace = true }
brk_types = { workspace = true }
lexopt = "0.3"
owo-colors = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
toml = "1.1.4"
tracing = { workspace = true }
vecdb = { workspace = true }

[dev-dependencies]
bitview_bencher = { workspace = true }
bitview_compute = { workspace = true }
bitview_plugin_distribution = { workspace = true }
color-eyre = { workspace = true }
serde_json = { workspace = true }
