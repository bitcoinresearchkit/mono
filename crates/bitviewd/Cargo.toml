[package]
name = "bitviewd"
description = "Bitview is a free, open-source Bitcoin data server: on-chain metrics, blocks, mempool and mining data, with charts and an API, at bitview.space or beside your own Bitcoin Core node."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true
readme = "README.md"
keywords = ["bitcoin", "analytics", "blockchain", "data", "self-hosted"]

[package.metadata.release]
# The clients follow the release version in its own commit and tag: bindgen writes the JS and Python
# clients' (and the JS package's), these the other packages' manifests.
pre-release-hook = ["cargo", "run", "-p", "bitview_devtools", "--bin", "bitview-bindgen"]
pre-release-replacements = [
    { file = "../../modules/quickmatch-js/package.json", search = '"version": "[^"]+"', replace = '"version": "{{version}}"', exactly = 1, prerelease = true },
    { file = "../../packages/bitview_client/pyproject.toml", search = '(?m)^version = "[^"]+"', replace = 'version = "{{version}}"', exactly = 1, prerelease = true },
]

[dependencies]
bitview = { workspace = true, features = ["full-api"] }
bitview_default = { workspace = true }
brk_alloc = { workspace = true }
