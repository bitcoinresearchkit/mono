[package]
name = "bitviewd"
description = "The self-hostable Bitview Bitcoin data daemon"
default-run = "bitviewd"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true
readme = "README.md"
keywords = ["bitcoin", "analytics", "blockchain", "data", "self-hosted"]

[package.metadata.release]
pre-release-hook = [
    "cargo",
    "run",
    "-p",
    "bitviewd",
    "--bin",
    "bitview-bindgen",
    "--features",
    "bindgen",
]

[features]
default = ["dep:bitview_default", "full-api"]
full-api = ["bitview/full-api"]
chain = ["price", "bitview/chain"]
series = ["bitview/series"]
urpd = ["price", "bitview/urpd"]
price = ["bitview/price"]
bindgen = [
    "dep:aide",
    "dep:bitview_bindgen",
    "dep:bitview_query",
    "dep:color-eyre",
    "dep:serde_json",
    "dep:tempfile",
]

[dependencies]
aide = { workspace = true, optional = true }
brk_alloc = { workspace = true }
brk_exit = { workspace = true }
bitview = { workspace = true }
bitview_bindgen = { workspace = true, optional = true }
bitview_default = { workspace = true, optional = true }
bitview_query = { workspace = true, optional = true }
bitview_server = { workspace = true }
brk_error = { workspace = true }
brk_logger = { workspace = true }
brk_reader = { workspace = true }
brk_rpc = { workspace = true }
color-eyre = { workspace = true, optional = true }
lexopt = "0.3"
owo-colors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
toml = "1.1.6"
tempfile = { workspace = true, optional = true }
vecdb = { workspace = true }

[[bin]]
name = "bitview-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen", "default"]

[[bin]]
name = "bitviewd"
path = "src/main.rs"
required-features = ["default"]
