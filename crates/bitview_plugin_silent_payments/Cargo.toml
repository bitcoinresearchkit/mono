[package]
name = "bitview_plugin_silent_payments"
description = "BIP352 silent payments: each eligible transaction's tweak, the data wallets scan with, for Bitview"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true

[dependencies]
bitcoin = { workspace = true }
bitview_compute = { workspace = true }
bitview_plugin = { workspace = true }
bitview_plugin_indexer = { workspace = true }
bitview_primitives = { workspace = true, features = ["storage"] }
bitview_traversable = { workspace = true }
brk_error = { workspace = true, features = ["bitcoin", "vecdb"] }
brk_exit = { workspace = true }
brk_types = { workspace = true, features = ["storage"] }
rayon = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
vecdb = { workspace = true }
