  <script type="module">
    import { createChart, LineSeries, LineStyle, CandlestickSeries, ColorType, CrosshairMode, PriceScaleMode, customSeriesDefaultOptions } from 'https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.mjs';

    class CloudRenderer {
      update(data, options) {
        this.data = data;
        this.options = options;
      }

      draw(target, priceToCoordinate) {
        if (!this.data?.visibleRange) return;
        const { bars, visibleRange } = this.data;
        // Only the visible bars have current coordinates after a range change.
        const { from, to } = visibleRange;
        if (to - from < 2) return;
        target.useBitmapCoordinateSpace(({ context, horizontalPixelRatio, verticalPixelRatio }) => {
          const points = bars.slice(from, to).map(bar => ({
            x: bar.x * horizontalPixelRatio,
            upper: priceToCoordinate(bar.originalData.upper) * verticalPixelRatio,
            lower: priceToCoordinate(bar.originalData.lower) * verticalPixelRatio,
          }));
          context.beginPath();
          context.moveTo(points[0].x, points[0].upper);
          for (const point of points.slice(1)) context.lineTo(point.x, point.upper);
          for (let i = points.length - 1; i >= 0; i--) context.lineTo(points[i].x, points[i].lower);
          context.closePath();
          context.fillStyle = this.options.fillColor;
          context.fill();
        });
      }
    }

    class CloudSeries {
      constructor() { this.view = new CloudRenderer(); }
      renderer() { return this.view; }
      update(data, options) { this.view.update(data, options); }
      priceValueBuilder(row) { return [row.upper, row.lower, (row.lower + row.upper) / 2]; }
      isWhitespace(row) { return !Number.isFinite(row.lower) || !Number.isFinite(row.upper); }
      defaultOptions() {
        return {
          ...customSeriesDefaultOptions,
          fillColor: '#e19b0026',
          lastValueVisible: false,
          priceLineVisible: false,
        };
      }
    }

    function boundsLineData(points, firstTime, daySeconds) {
      let previous = null;
      let previousSide = null;
      return points.map((point, index) => {
        const time = firstTime + index * daySeconds;
        // Zero-price buckets are valid data, but cannot be shown on a log scale.
        if (point === null || point[0] === 0) {
          if (previous) previous.color = 'transparent';
          previous = null;
          return { time };
        }
        if (previous && point[1] !== previousSide) previous.color = 'transparent';
        previousSide = point[1];
        previous = { time, value: point[0] / 100 };
        return previous;
      });
    }

    function boundsEndpoints(data) {
      return data.filter((point, index) => point.value !== undefined && (
        data[index - 1]?.value === undefined || data[index - 1]?.color === 'transparent' ||
        point.color === 'transparent' || data[index + 1]?.value === undefined
      )).map(({ time, value }) => ({ time, value }));
    }

    const DAY_SECONDS = 86_400;
    const chartElement = document.getElementById('chart');
    const status = document.getElementById('status');
    const dateElement = document.getElementById('date');
    const yearElement = document.getElementById('year');
    const priceElement = document.getElementById('price');
    const cloudColors = { sth: '#e19b00', holders: '#f2660f', lth: '#d50ced' };
    const cloudReadouts = Object.fromEntries(Object.keys(cloudColors).map(id =>
      [id, [...document.querySelectorAll(`#${id}-range span`)]]));
    const trendReadouts = [4, 5, 6].map(months => document.getElementById(`trend-${months}m`));
    const dateFormat = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short', timeZone: 'UTC' });
    const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
    const compactNumber = new Intl.NumberFormat('fr-FR', {
      minimumSignificantDigits: 3, maximumSignificantDigits: 3, useGrouping: false,
    });
    function compactPrice(value) {
      if (value < 10_000) return value.toLocaleString('en-US', { maximumFractionDigits: value < 10 ? 2 : 0 });
      const millions = value >= 1_000_000;
      return compactNumber.format(value / (millions ? 1_000_000 : 1_000)) + (millions ? 'm' : 'k');
    }
    const priceFormat = {
      type: 'custom',
      minMove: 0.01,
      formatter: value => value.toLocaleString('en-US', { maximumFractionDigits: value < 10 ? 2 : 0 }),
    };

    try {
      const snapshot = JSON.parse(document.getElementById('chart-data').textContent);
      const generatedAt = document.getElementById('generated-at');
      generatedAt.dateTime = snapshot.generatedAt;
      generatedAt.textContent = new Intl.DateTimeFormat('en-GB', {
        day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit',
        hourCycle: 'h23', timeZone: 'UTC', timeZoneName: 'short',
      }).format(new Date(snapshot.generatedAt));
      if (snapshot.unit !== 'cents' || snapshot.columns?.join(',') !== 'open,high,low,close' || !snapshot.rows?.length) {
        throw new Error('The cloud snapshot is incomplete.');
      }
      if (snapshot.clouds?.map(cloud => cloud.id).join(',') !== 'sth,holders,lth' ||
          snapshot.clouds.some(cloud => cloud.ranges.length !== snapshot.rows.length ||
            cloud.ranges.some(range => range.length !== 2 || !range.every(value => Number.isSafeInteger(value) && value > 0) || range[0] > range[1]))) {
        throw new Error('The cloud ranges are incomplete.');
      }
      const bounds = snapshot.bounds ?? [];
      if ((bounds.length !== 0 && bounds.length !== 3) || bounds.some(bound =>
        bound.points?.length !== snapshot.rows.length || bound.points.some(point => point !== null &&
          (!Array.isArray(point) || point.length !== 2 || !Number.isSafeInteger(point[0]) || point[0] < 0 ||
            (point[1] !== 0 && point[1] !== 1))))) {
        throw new Error('The bounds snapshot is incomplete.');
      }
      const firstTime = Date.parse(snapshot.start) / 1000;
      const rows = snapshot.rows.map((row, index) => {
        const [open, high, low, close] = row.map(value => value / 100);
        return { time: firstTime + index * DAY_SECONDS, open, high, low, close };
      });
      const latest = rows.at(-1);
      await document.fonts.ready;
      await new Promise(requestAnimationFrame);
      const chart = createChart(chartElement, {
        width: chartElement.clientWidth,
        height: chartElement.clientHeight,
        hoveredSeriesOnTop: false,
        layout: { background: { type: ColorType.Solid, color: '#100f0d' }, textColor: '#96918a', fontSize: 13, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', attributionLogo: false },
        grid: { vertLines: { visible: false }, horzLines: { color: '#d8cfc10a' } },
        rightPriceScale: { mode: PriceScaleMode.Logarithmic, borderVisible: false, minimumWidth: 68, scaleMargins: { top: 0.12, bottom: 0.08 } },
        timeScale: { borderVisible: false, rightOffset: 5, minBarSpacing: 0.06, fixLeftEdge: false, fixRightEdge: false },
        crosshair: { mode: CrosshairMode.MagnetOHLC, vertLine: { color: '#e19b0040', labelBackgroundColor: '#493321' }, horzLine: { color: '#e19b0040', labelBackgroundColor: '#493321' } },
        handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
        handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true },
      });
      const cloudSeries = Object.fromEntries(snapshot.clouds.map(({ id }) => [id, []]));
      // Back to front: LTH, Holders, STH; hover never changes this order.
      for (const { id, ranges } of [...snapshot.clouds].reverse()) {
        const color = cloudColors[id];
        const fill = chart.addCustomSeries(new CloudSeries(), {
          priceFormat, fillColor: `${color}${{ sth: '38', holders: '26', lth: '1c' }[id]}`,
        });
        fill.setData(ranges.map(([lower, upper], index) => ({
          time: rows[index].time, lower: lower / 100, upper: upper / 100,
        })));
        cloudSeries[id].push(fill);
      }
      // All six boundaries sit above every fill, with Bitcoin still in front.
      for (const { id, ranges } of [...snapshot.clouds].reverse()) {
        for (const edge of [0, 1]) {
          const boundary = chart.addSeries(LineSeries, {
            color: `${cloudColors[id]}99`, lineWidth: 1, priceFormat,
            priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
          });
          boundary.setData(ranges.map((range, index) => ({ time: rows[index].time, value: range[edge] / 100 })));
          cloudSeries[id].push(boundary);
        }
      }
      // Trends share one toggle and stay underneath Bitcoin.
      const trendSeries = [];
      const trendColors = ['#e19b00', '#f2660f', '#f11325'];
      for (const [index, bound] of bounds.entries()) {
        const options = {
          visible: false, color: `${trendColors[index]}99`, lineWidth: 1, priceFormat,
          priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
        };
        const data = boundsLineData(bound.points, firstTime, DAY_SECONDS);
        const trend = chart.addSeries(LineSeries, {
          ...options, lineStyle: [LineStyle.LargeDashed, LineStyle.Dashed, LineStyle.Solid][index],
        });
        trend.setData(data);
        const endpoints = chart.addSeries(LineSeries, {
          ...options, lineVisible: false, pointMarkersVisible: true, pointMarkersRadius: 1.5,
        });
        endpoints.setData(boundsEndpoints(data));
        trendSeries.push(trend, endpoints);
      }
      function bindToggle(button, series) {
        button.disabled = series.length === 0;
        button.addEventListener('click', () => {
          const visible = button.getAttribute('aria-pressed') !== 'true';
          button.setAttribute('aria-pressed', String(visible));
          const state = button.querySelector('.cloud-state');
          if (state) state.textContent = visible ? 'active' : 'inactive';
          for (const item of series) item.applyOptions({ visible });
        });
      }
      for (const [id, series] of Object.entries(cloudSeries)) {
        bindToggle(document.getElementById(`${id}-toggle`), series);
      }
      bindToggle(document.getElementById('trends-toggle'), trendSeries);
      const line = chart.addSeries(LineSeries, {
        color: '#f0f1e9', lineWidth: 1.5, priceLineVisible: false,
        lastValueVisible: true, crosshairMarkerVisible: false, priceFormat,
      });
      const candles = chart.addSeries(CandlestickSeries, {
        visible: false, upColor: '#100f0d', downColor: '#f0f1e9',
        wickUpColor: '#f0f1e9', wickDownColor: '#f0f1e9',
        borderUpColor: '#f0f1e9', borderDownColor: '#f0f1e9',
        borderVisible: true, priceLineVisible: false, lastValueVisible: true, priceFormat,
      });
      line.setData(rows.map(({ time, close }) => ({ time, value: close })));
      candles.setData(rows.map(({ time, open, high, low, close }) => ({ time, open, high, low, close })));

      function readout(row) {
        if (!row) {
          dateElement.textContent = '—';
          yearElement.textContent = '';
          priceElement.textContent = '—';
          for (const values of Object.values(cloudReadouts)) {
            for (const value of values) { value.textContent = '—'; value.removeAttribute('title'); }
          }
          for (const value of trendReadouts) { value.textContent = '—'; value.removeAttribute('title'); }
          return;
        }
        dateElement.textContent = dateFormat.format(row.time * 1000);
        yearElement.textContent = new Date(row.time * 1000).getUTCFullYear();
        priceElement.textContent = money.format(row.close);
        const index = Math.round((row.time - firstTime) / DAY_SECONDS);
        for (const { id, ranges } of snapshot.clouds) {
          const [lower, upper] = ranges[index];
          cloudReadouts[id][0].textContent = compactPrice(lower / 100);
          cloudReadouts[id][0].title = money.format(lower / 100);
          cloudReadouts[id][1].textContent = compactPrice(upper / 100);
          cloudReadouts[id][1].title = money.format(upper / 100);
        }
        for (const [trendIndex, value] of trendReadouts.entries()) {
          const point = bounds[trendIndex]?.points[index];
          value.textContent = point && point[0] > 0 ? compactPrice(point[0] / 100) : '—';
          value.title = `${trendIndex + 4}m: ${point && point[0] > 0 ? money.format(point[0] / 100) : '—'}`;
        }
      }
      let hoveredIndex = null;
      function updateReadout() {
        const range = chart.timeScale().getVisibleLogicalRange();
        if (!range) return;
        const first = Math.max(0, Math.ceil(range.from));
        const last = Math.min(rows.length - 1, Math.floor(range.to));
        const index = hoveredIndex !== null && hoveredIndex >= first && hoveredIndex <= last
          ? hoveredIndex : last;
        readout(first <= last ? rows[index] : null);
      }
      chart.subscribeCrosshairMove(({ time, point }) => {
        const index = typeof time === 'number' ? Math.round((time - firstTime) / DAY_SECONDS) : -1;
        hoveredIndex = point && point.x >= 0 && point.y >= 0 &&
          point.x <= chartElement.clientWidth && point.y <= chartElement.clientHeight && rows[index]
          ? index : null;
        updateReadout();
      });
      chartElement.addEventListener('mouseleave', () => {
        hoveredIndex = null;
        updateReadout();
      });

      // Hysteresis matches the other daily-price pages and avoids flicker at the threshold.
      let candlesVisible = false;
      let rangeFrame = 0;
      chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
        cancelAnimationFrame(rangeFrame);
        rangeFrame = requestAnimationFrame(() => {
          updateReadout();
          const visibleBars = range ? range.to - range.from : Infinity;
          const showCandles = visibleBars <= (candlesVisible ? 600 : 500);
          if (showCandles === candlesVisible) return;
          candlesVisible = showCandles;
          line.applyOptions({ visible: !showCandles });
          candles.applyOptions({ visible: showCandles });
        });
      });
      function resetRange() {
        chart.timeScale().setVisibleRange({ from: Math.max(firstTime, latest.time - 4 * 365 * DAY_SECONDS), to: latest.time });
      }
      resetRange();
      updateReadout();
      let resizeFrame = 0;
      new ResizeObserver(() => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => {
          chart.resize(chartElement.clientWidth, chartElement.clientHeight, true);
        });
      }).observe(chartElement);
      chartElement.addEventListener('dblclick', resetRange);
      chartElement.setAttribute('aria-busy', 'false');
      status.textContent = '';
    } catch (error) {
      console.error(error);
      chartElement.setAttribute('aria-busy', 'false');
      status.classList.add('error');
      status.textContent = 'Unable to load the cloud. Please reload the page.';
    }
  </script>

          <span id="holders-range" class="cloud-range"><span>—</span><span>—</span></span>
        </button>
        <button id="lth-toggle" class="series-toggle lth" type="button" aria-pressed="true" aria-controls="chart" aria-labelledby="lth-label" disabled>
          <span id="lth-label" class="label">LTH <span class="cloud-state">active</span></span>
          <span id="lth-range" class="cloud-range"><span>—</span><span>—</span></span>
        </button>
        <button id="trends-toggle" class="series-toggle trends-readout" type="button" aria-pressed="false" aria-controls="chart" aria-labelledby="trends-label" title="STH bounds: 6m solid red, 5m dashed orange, 4m sparse yellow" disabled>
          <span id="trends-label" class="label">Bounds <span class="cloud-state">inactive</span></span>
          <span class="trend-values">
            <span><span id="trend-6m" aria-label="6m bound">—</span></span>
            <span><span id="trend-5m" aria-label="5m bound">—</span></span>
            <span><span id="trend-4m" aria-label="4m bound">—</span></span>
          </span>
        </button>
      </div>
    </header>
    <section class="plot" aria-label="Bitcoin, STH, All, and LTH clouds">
      <div id="chart" role="img" aria-label="Bitcoin price and the Bitcoin Clouds" aria-busy="true"></div>
      <div id="status" role="status">Loading cloud…</div>
    </section>
    <footer>Generated <time id="generated-at">—</time></footer>
  </main>
</body>
