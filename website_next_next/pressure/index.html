<body>
  <main>
    <header>
      <div class="identity">
        <a class="wordmark" href="https://bitview.space">BITVIEW <span>/ PRESSURE</span></a>
        <h1><span>Bitcoin</span> <em>Pressure</em></h1>
      </div>
      <div class="readouts" aria-label="Selected date and Bitcoin price">
        <time id="date">—</time>
        <strong id="price">—</strong>
      </div>
    </header>
    <section class="plot" aria-label="Bitcoin price and pressure charts">
      <div id="chart" role="img" aria-label="Bitcoin price above; indicator in the middle; signal below" aria-busy="true"></div>
      <div id="empty" hidden>No qualifying observations in view</div>
      <div id="status" role="status">Loading chart…</div>
    </section>
    <footer>Generated <time id="generated-at">—</time></footer>
  </main>
  <script type="module">
    import { createChart, LineSeries, BaselineSeries, CandlestickSeries, HistogramSeries, ColorType, CrosshairMode, PriceScaleMode } from 'https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.mjs';
    const chartElement = document.getElementById('chart');
    const status = document.getElementById('status');
    const empty = document.getElementById('empty');
    const dateElement = document.getElementById('date');
    const priceElement = document.getElementById('price');
    const DAY_SECONDS = 86_400;
    const GREEN = '#00b747';
    const RED = '#f11325';
    const HIGHLIGHT_COLOR = '#e19b00';
    const REFERENCE_VALUE = 10;
    const dateFormat = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
    const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
    const valueFormat = value => `${value > 0 ? '+' : value < 0 ? '−' : ''}${Math.abs(value).toFixed(1)}`;
    const priceFormat = {
      type: 'custom', minMove: 0.01,
      formatter: value => value.toLocaleString('en-US', { maximumFractionDigits: value < 10 ? 2 : 0 }),
    };

    try {
      const snapshot = JSON.parse(document.getElementById('chart-data').textContent);
      if (snapshot.priceUnit !== 'cents' ||
          snapshot.columns?.join(',') !== 'open,high,low,close,signal,level' || !snapshot.rows?.length) {
        throw new Error('The chart snapshot is incomplete.');
      }
      const generated = document.getElementById('generated-at');
      generated.dateTime = snapshot.generatedAt;
      generated.textContent = new Intl.DateTimeFormat('en-GB', {
        day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit',
        hourCycle: 'h23', timeZone: 'UTC', timeZoneName: 'short',
      }).format(new Date(snapshot.generatedAt));
      const firstTime = Date.parse(snapshot.start) / 1000;
      const rows = snapshot.rows.map(([open, high, low, close, signal, level], index) => ({
        time: firstTime + index * DAY_SECONDS,
        open: open / 100, high: high / 100, low: low / 100, close: close / 100,
        signal, level,
      }));
      const latest = rows.at(-1);
      await document.fonts.ready;
      await new Promise(requestAnimationFrame);
      const chart = createChart(chartElement, {
        width: chartElement.clientWidth, height: chartElement.clientHeight,
        hoveredSeriesOnTop: false,
        layout: {
          background: { type: ColorType.Solid, color: '#100f0d' }, textColor: '#96918a',
          fontSize: 13, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', attributionLogo: false,
          panes: { separatorColor: '#d8cfc118', separatorHoverColor: '#d8cfc130', enableResize: true },
        },
        grid: { vertLines: { visible: false }, horzLines: { color: '#d8cfc10a' } },
        rightPriceScale: { mode: PriceScaleMode.Logarithmic, borderVisible: false, minimumWidth: 86, scaleMargins: { top: 0.1, bottom: 0.08 } },
        timeScale: { borderVisible: false, rightOffset: 5, minBarSpacing: 0.06, fixLeftEdge: false, fixRightEdge: false },
        crosshair: { mode: CrosshairMode.MagnetOHLC, vertLine: { color: '#f2660f40', labelBackgroundColor: '#493321' }, horzLine: { color: '#f2660f40', labelBackgroundColor: '#493321' } },
        handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
        handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true },
      });
      const line = chart.addSeries(LineSeries, {
        color: '#f0f1e9', lineWidth: 1.5, priceLineVisible: false,
        lastValueVisible: true, crosshairMarkerVisible: false, priceFormat,
      });
      const candles = chart.addSeries(CandlestickSeries, {
        visible: false, upColor: '#100f0d', downColor: '#f0f1e9',
        wickUpColor: '#f0f1e9', wickDownColor: '#f0f1e9',
        borderUpColor: '#f0f1e9', borderDownColor: '#f0f1e9',
        borderVisible: true, priceLineVisible: false, lastValueVisible: true, priceFormat,
      });
      const symmetricScale = original => {
        const range = original()?.priceRange;
        const extent = Math.max(1, Math.abs(range?.minValue ?? 0), Math.abs(range?.maxValue ?? 0));
        return { priceRange: { minValue: -extent, maxValue: extent } };
      };
      const indicatorSeries = chart.addSeries(BaselineSeries, {
        baseValue: { type: 'price', price: REFERENCE_VALUE },
        topLineColor: HIGHLIGHT_COLOR, bottomLineColor: '#f2660fb3',
        topFillColor1: '#e19b001a', topFillColor2: '#e19b001a',
        bottomFillColor1: 'transparent', bottomFillColor2: 'transparent',
        lineWidth: 1, priceLineVisible: false, lastValueVisible: false,
        crosshairMarkerVisible: false,
        priceFormat: { type: 'custom', minMove: 0.1, formatter: valueFormat },
        autoscaleInfoProvider: original => ({
          priceRange: { minValue: 0, maxValue: Math.max(REFERENCE_VALUE, original()?.priceRange.maxValue ?? 0) },
        }),
      }, 1);
      const histogram = chart.addSeries(HistogramSeries, {
        base: 0, priceLineVisible: false, lastValueVisible: false,
        priceFormat: { type: 'custom', minMove: 0.1, formatter: valueFormat },
        autoscaleInfoProvider: symmetricScale,
      }, 2);
      chart.priceScale('right', 2).applyOptions({ mode: PriceScaleMode.Normal, scaleMargins: { top: 0.14, bottom: 0.14 } });
      chart.priceScale('right', 1).applyOptions({ mode: PriceScaleMode.Normal, scaleMargins: { top: 0.14, bottom: 0.06 } });
      chart.panes()[0].setStretchFactor(3);
      chart.panes()[1].setStretchFactor(1);
      chart.panes()[2].setStretchFactor(1);
      histogram.createPriceLine({ price: 0, color: '#d8cfc130', lineWidth: 1, lineStyle: 0, axisLabelVisible: false });
      indicatorSeries.createPriceLine({ price: REFERENCE_VALUE, color: '#e19b0066', lineWidth: 1, lineStyle: 2, axisLabelVisible: false });
      line.setData(rows.map(({ time, close }) => ({ time, value: close })));
      candles.setData(rows.map(({ time, open, high, low, close }) => ({ time, open, high, low, close })));
      histogram.setData(rows.map(({ time, signal }) => signal === null ? { time } : {
        time, value: signal, color: signal >= 0 ? GREEN : RED,
      }));

      indicatorSeries.setData(rows.map(({ time, level }) => ({ time, value: level })));

      let hoverIndex = null;
      function readout() {
        const range = chart.timeScale().getVisibleLogicalRange();
        const lastVisible = Math.max(0, Math.min(rows.length - 1, Math.floor(range?.to ?? rows.length - 1)));
        const row = rows[hoverIndex] ?? rows[lastVisible];
        dateElement.textContent = dateFormat.format(row.time * 1000);
        dateElement.dateTime = new Date(row.time * 1000).toISOString().slice(0, 10);
        priceElement.textContent = money.format(row.close);
      }
      chart.subscribeCrosshairMove(({ time }) => {
        hoverIndex = typeof time === 'number' ? Math.round((time - firstTime) / DAY_SECONDS) : null;
        readout();
      });
      let candlesVisible = false;
      let rangeFrame = 0;
      chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
        cancelAnimationFrame(rangeFrame);
        rangeFrame = requestAnimationFrame(() => {
          const visibleBars = range ? range.to - range.from : Infinity;
          const showCandles = visibleBars <= (candlesVisible ? 600 : 500);
          if (showCandles !== candlesVisible) {
            candlesVisible = showCandles;
            line.applyOptions({ visible: !showCandles });
            candles.applyOptions({ visible: showCandles });
          }
          const start = Math.max(0, Math.ceil(range?.from ?? 0));
          const end = Math.min(rows.length, Math.floor(range?.to ?? rows.length - 1) + 1);
          empty.hidden = rows.slice(start, end).some(row => row.signal !== null);
          readout();
        });
      });
      function resetRange() {
        chart.timeScale().setVisibleRange({ from: Math.max(firstTime, latest.time - 4 * 365 * DAY_SECONDS), to: latest.time });
      }
      resetRange();
      readout();
      let resizeFrame = 0;
      new ResizeObserver(() => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => chart.resize(chartElement.clientWidth, chartElement.clientHeight, true));
      }).observe(chartElement);
      chartElement.addEventListener('dblclick', resetRange);
      chartElement.setAttribute('aria-busy', 'false');
      status.textContent = '';
    } catch (error) {
      console.error(error);
      chartElement.setAttribute('aria-busy', 'false');
      status.classList.add('error');
      status.textContent = 'Unable to load the chart. Please reload the page.';
    }
  </script>
