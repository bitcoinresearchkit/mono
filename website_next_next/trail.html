<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A moving 2.5D terrain view of Bitcoin's UTXO realized price distribution."
    />
    <link rel="preconnect" href="https://bitview.space" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <title>The Satoshi Trail</title>
    <style>
      @font-face {
        font-family: "Lilex";
        src: url("https://cdn.jsdelivr.net/fontsource/fonts/lilex:vf@5.3.0/latin-wght-normal.woff2")
          format("woff2-variations");
        font-style: normal;
        font-weight: 100 700;
        font-display: block;
      }

      @font-face {
        font-family: "Instrument";
        src: url("https://cdn.jsdelivr.net/fontsource/fonts/instrument-serif@5.3.0/latin-400-normal.woff2")
          format("woff2");
        font-style: normal;
        font-weight: 400;
        font-display: block;
      }

      :root {
        color-scheme: dark;
        --background: #07100f;
        --foreground: #f0eadb;
        --muted: #9ba69f;
        --control: rgba(10, 24, 21, 0.72);
        --control-border: rgba(226, 232, 216, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 0;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--background);
        color: var(--foreground);
        font-family:
          "Lilex", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        text-transform: uppercase;
      }

      button,
      select {
        font: inherit;
      }

      .app {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 460px;
        isolation: isolate;
        background:
          radial-gradient(
            circle at 58% 38%,
            rgba(78, 111, 79, 0.11),
            transparent 42%
          ),
          var(--background);
        filter: saturate(1.28) contrast(1.1);
      }

      canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      @media (hover: hover) and (pointer: fine) {
        #terrain {
          cursor: crosshair;
        }
      }

      .topbar {
        --topbar-y: max(18px, env(safe-area-inset-top));
        position: absolute;
        z-index: 2;
        top: var(--topbar-y);
        right: 22px;
        bottom: 0;
        left: 22px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        pointer-events: none;
      }

      .identity {
        position: absolute;
        left: 50%;
        min-width: 0;
        text-align: center;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      #source-credit {
        position: absolute;
        bottom: max(8px, env(safe-area-inset-bottom));
        left: 0;
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        color: var(--foreground);
        font: 500 10px/24px "Lilex", ui-monospace, SFMono-Regular, Menlo,
          Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        letter-spacing: 0.065em;
        text-transform: uppercase;
        text-overflow: ellipsis;
        white-space: nowrap;
        opacity: 0.72;
        pointer-events: auto;
      }

      #source-credit .credit-copy {
        opacity: 0.45;
      }

      #source-credit a {
        color: inherit;
        text-decoration: none;
      }

      #source-credit a:hover,
      #source-credit a:focus-visible {
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family:
          "Instrument", Charter, "Bitstream Charter", "Sitka Text", Cambria,
          serif;
        font-size: clamp(32px, 4.2vw, 54px);
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.025em;
        text-transform: none;
      }

      .selection {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 7px;
        pointer-events: none;
      }

      .selectors {
        position: absolute;
        right: 0;
        bottom: max(
          44px,
          calc(env(safe-area-inset-bottom) + 36px)
        );
        left: 0;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        pointer-events: none;
      }

      .selector-group {
        display: grid;
        width: max-content;
        grid-template-columns: max-content max-content;
        align-items: center;
        gap: 8px 7px;
        pointer-events: auto;
      }

      .selector-group-right {
        justify-items: stretch;
      }

      .selector {
        display: contents;
        color: var(--muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .selector select {
        width: 100%;
      }

      .cohort-selector {
        position: static;
      }

      .date,
      .price {
        font-family:
          "Lilex", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        font-variant-numeric: tabular-nums;
        white-space: pre;
      }

      .date {
        font-variant-numeric: tabular-nums;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }

      .readout {
        position: absolute;
        top: 81px;
        right: auto;
        left: 50%;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 9px;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      .price {
        color: #ff5147;
        font-size: 18px;
        font-weight: 500;
      }

      .status {
        position: absolute;
        top: 109px;
        right: auto;
        left: 50%;
        min-height: 14px;
        color: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        transform: translateX(-50%);
      }

      select {
        max-width: min(46vw, 230px);
        min-height: 37px;
        padding: 7px 34px 7px 11px;
        border: 1px solid rgba(226, 232, 216, 0.13);
        border-radius: 9px;
        outline: none;
        background: rgba(3, 13, 11, 0.58);
        color: var(--foreground);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0;
        text-transform: uppercase;
        transition:
          border-color 140ms ease,
          background-color 140ms ease;
      }

      @media (hover: hover) and (pointer: fine) {
        select:hover {
          border-color: rgba(231, 220, 192, 0.3);
          background: rgba(11, 27, 23, 0.8);
        }
      }

      select:focus-visible {
        border-color: rgba(231, 220, 192, 0.58);
        box-shadow: 0 0 0 3px rgba(231, 220, 192, 0.12);
      }

      .message {
        position: absolute;
        z-index: 2;
        top: 50%;
        left: 50%;
        max-width: min(420px, calc(100% - 48px));
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        text-align: center;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .message[hidden] {
        display: none;
      }

      @media (max-width: 560px) {
        .topbar {
          --topbar-y: max(14px, env(safe-area-inset-top));
          top: var(--topbar-y);
          right: 14px;
          left: 14px;
        }

        .eyebrow {
          margin-bottom: 3px;
          font-size: 10px;
        }

        h1 {
          font-size: 32px;
        }

        .selection {
          gap: 5px;
        }

        #source-credit {
          top: auto;
          bottom: max(8px, env(safe-area-inset-bottom));
          left: 50%;
          width: calc(100% - 24px);
          max-width: none;
          font-size: 10px;
          line-height: 20px;
          text-align: center;
          transform: translateX(-50%);
        }

        #source-credit .credit-copy {
          display: none;
        }

        #source-credit a:first-of-type::after {
          content: " · ";
        }

        .selector {
          display: block;
          gap: 5px;
          font-size: 10px;
        }

        .cohort-selector {
          position: static;
        }

        .selectors {
          right: -4px;
          bottom: max(
            40px,
            calc(env(safe-area-inset-bottom) + 32px)
          );
          left: -4px;
          display: grid;
          grid-template-columns: 170px 118px;
          justify-content: start;
          gap: 8px;
        }

        .selector-group {
          display: contents;
        }

        .selector > span {
          display: none;
        }

        .date {
          font-size: 14px;
        }

        .readout {
          top: 69px;
          flex-direction: column;
          align-items: center;
          gap: 1px;
        }

        .price {
          font-size: 14px;
        }

        select {
          min-height: 35px;
          padding-top: 5px;
          padding-bottom: 5px;
          font-size: 12px;
        }

        .status {
          display: none;
        }
      }

      @media (min-width: 561px) and (max-width: 960px) and (max-height: 560px) {
        .app {
          min-height: 0;
        }

        .topbar {
          --topbar-y: max(10px, env(safe-area-inset-top));
          right: 14px;
          left: 14px;
        }

        .eyebrow {
          margin-bottom: 2px;
          font-size: 9px;
        }

        .identity,
        .readout {
          text-shadow:
            0 1px 3px #07100f,
            0 0 14px #07100f;
        }

        .readout {
          top: 67px;
        }

        .status {
          display: none;
        }

        .selectors {
          bottom: max(
            32px,
            calc(env(safe-area-inset-bottom) + 26px)
          );
        }

        .selector-group {
          gap: 6px 7px;
        }

        select {
          min-height: 31px;
          padding: 5px 30px 5px 9px;
          font-size: 11px;
        }

        #source-credit {
          bottom: max(4px, env(safe-area-inset-bottom));
          font-size: 8px;
          line-height: 16px;
        }
      }

      html.is-compact .app {
        min-height: 0;
      }

      html.is-compact .topbar {
        --topbar-y: 7px;
        top: var(--topbar-y);
        right: 7px;
        left: 7px;
      }

      html.is-compact .identity,
      html.is-compact .selection,
      html.is-compact .selectors,
      html.is-compact #source-credit,
      html.is-compact .status {
        display: none;
      }

      html.is-compact .readout {
        top: 8px;
        left: 50%;
        width: calc(100% - 7rem);
        align-items: center;
        flex-direction: column;
        gap: 1px;
        text-align: center;
        transform: translateX(-50%);
      }

      html.is-compact .date {
        color: var(--muted);
        font-size: 8px;
        line-height: 10px;
      }

      html.is-compact .tiny-selection {
        display: block;
        max-width: min(100%, 24rem);
        margin-top: 3px;
        overflow: hidden;
        color: var(--muted);
        font: 550 7px/9px "Lilex", ui-monospace, monospace;
        letter-spacing: 0.055em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      html.is-compact .price {
        font-family:
          "Instrument", Charter, "Bitstream Charter", "Sitka Text", Cambria,
          serif;
        font-size: clamp(14px, 5vw, 22px);
        font-weight: 400;
        letter-spacing: -0.025em;
        line-height: 0.92;
      }

      html.is-compact .message {
        max-width: calc(100% - 20px);
        font-size: 9px;
        line-height: 1.35;
      }

      @media (max-height: 145px) {
        html.is-compact .date,
        html.is-compact .tiny-selection {
          display: none;
        }
      }

      @media (max-width: 320px), (max-height: 260px) {
        .topbar {
          --topbar-y: 7px;
          top: var(--topbar-y);
          right: 7px;
          left: 7px;
        }

        .identity,
        .selection,
        .selectors,
        #source-credit,
        .status {
          display: none;
        }

        .app {
          min-height: 0;
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        select {
          background: #0b1715;
          backdrop-filter: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <canvas
        id="terrain"
        role="img"
        aria-label="Moving terrain of Bitcoin supply by realized price and date"
      ></canvas>

      <header class="topbar">
        <div class="identity">
          <p class="eyebrow">Bitcoin through time and space</p>
          <h1>The Satoshi Trail</h1>
        </div>

        <div id="source-credit">
          <span class="credit-copy">Source:</span>
          <a href="https://bitview.space" target="_blank" rel="noreferrer"
            >Bitview.space</a
          >
          <span class="credit-copy">· Powered by</span>
          <a
            href="https://bitcoinresearchkit.org"
            target="_blank"
            rel="noreferrer"
            >Bitcoin Research Kit</a
          >
        </div>

        <div class="selection">
          <div class="selectors">
            <div class="selector-group">
              <label class="selector">
                <span>Angle</span>
                <select id="angle" aria-label="Terrain angle">
                  <option value="10">10°</option>
                  <option value="15">15°</option>
                  <option value="20">20°</option>
                  <option value="25">25°</option>
                  <option value="30" selected>30°</option>
                  <option value="35">35°</option>
                  <option value="40">40°</option>
                </select>
              </label>
              <label class="selector">
                <span>Shape</span>
                <select id="shape" aria-label="Terrain shape">
                  <option value="flats">FLATS</option>
                  <option value="peaks">PEAKS</option>
                </select>
              </label>
            </div>
            <div class="selector-group selector-group-right">
              <label class="selector">
                <span>Data</span>
                <select id="metric" aria-label="Terrain data">
                  <option value="supply">SUPPLY</option>
                  <option value="realized_cap">INVESTED CAPITAL</option>
                  <option value="unrealized_pnl">UNREALIZED P&amp;L</option>
                </select>
              </label>
              <label class="selector">
                <span>View</span>
                <select id="mode" aria-label="Terrain view">
                  <option value="value">VALUE</option>
                  <option value="1w">1W CHANGE</option>
                  <option value="1m">1M CHANGE</option>
                  <option value="3m">3M CHANGE</option>
                  <option value="6m">6M CHANGE</option>
                  <option value="1y">1Y CHANGE</option>
                  <option value="2y">2Y CHANGE</option>
                  <option value="4y">4Y CHANGE</option>
                </select>
              </label>
              <label class="selector">
                <span>Weight</span>
                <select id="weight" aria-label="Supply weighting">
                  <option value="raw">NONE</option>
                  <option value="cointime">COINTIME</option>
                  <option value="coinflow">COINFLOW</option>
                </select>
              </label>
              <label class="selector cohort-selector">
                <span>Cohort</span>
                <select id="cohort" aria-label="Cohort">
                  <option value="all">ALL UTXOS</option>
                  <option value="sth">SHORT-TERM HOLDERS</option>
                  <option value="lth">LONG-TERM HOLDERS</option>
                  <optgroup label="AGE BANDS">
                    <option value="utxos_under_1h_old">UP TO 1 HOUR</option>
                    <option value="utxos_1h_to_1d_old">1 HOUR TO 1 DAY</option>
                    <option value="utxos_1d_to_1w_old">1 DAY TO 1 WEEK</option>
                    <option value="utxos_1w_to_1m_old">1 WEEK TO 1 MONTH</option>
                    <option value="utxos_1m_to_2m_old">1 TO 2 MONTHS</option>
                    <option value="utxos_2m_to_3m_old">2 TO 3 MONTHS</option>
                    <option value="utxos_3m_to_4m_old">3 TO 4 MONTHS</option>
                    <option value="utxos_4m_to_5m_old">4 TO 5 MONTHS</option>
                    <option value="utxos_5m_to_6m_old">5 TO 6 MONTHS</option>
                    <option value="utxos_6m_to_9m_old">6 TO 9 MONTHS</option>
                    <option value="utxos_9m_to_1y_old">9 MONTHS TO 1 YEAR</option>
                    <option value="utxos_1y_to_18m_old">1 YEAR TO 18 MONTHS</option>
                    <option value="utxos_18m_to_2y_old">18 MONTHS TO 2 YEARS</option>
                    <option value="utxos_2y_to_3y_old">2 TO 3 YEARS</option>
                    <option value="utxos_3y_to_4y_old">3 TO 4 YEARS</option>
                    <option value="utxos_4y_to_5y_old">4 TO 5 YEARS</option>
                    <option value="utxos_5y_to_6y_old">5 TO 6 YEARS</option>
                    <option value="utxos_6y_to_7y_old">6 TO 7 YEARS</option>
                    <option value="utxos_7y_to_8y_old">7 TO 8 YEARS</option>
                    <option value="utxos_8y_to_10y_old">8 TO 10 YEARS</option>
                    <option value="utxos_10y_to_12y_old">10 TO 12 YEARS</option>
                    <option value="utxos_12y_to_15y_old">12 TO 15 YEARS</option>
                    <option value="utxos_over_15y_old">OVER 15 YEARS</option>
                  </optgroup>
                </select>
              </label>
            </div>
          </div>
          <div class="readout">
            <output id="price" class="price">—</output>
            <output id="date" class="date">—</output>
            <output id="tiny-selection" class="tiny-selection"></output>
          </div>
          <output id="status" class="status" aria-live="polite"></output>
        </div>
      </header>

      <p id="message" class="message">Loading available dates…</p>
    </main>

    <script>
      (() => {
        "use strict";

        const API = "https://bitview.space/api";
        const FUTURE_ALPHA = 0.16;
        const PRICE_TRAIL_LIFT = 6;
        const CACHE_LIMIT = 4_500;
        const WEIGHT_VARIANT_COUNT = 3;
        const CONCURRENCY = 7;
        const PROGRESS_PAINT_INTERVAL = 350;
        const MAX_CANVAS_PIXELS = 6_000_000;
        const TERRAIN_CHUNK_SIZE = 64;
        const SETTINGS_KEY = "satoshi-trail:settings";
        const COMPARISON_OFFSETS = {
          "1w": 1,
          "1m": 4,
          "3m": 13,
          "6m": 26,
          "1y": 52,
          "2y": 104,
          "4y": 208,
        };
        const WATER_CAP_COLOR = "rgba(75, 172, 185, 0.9)";
        const MONO_FONT =
          '"Lilex", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace';
        const palette = [
          [0, 2, 34, 31],
          [0.04, 54, 49, 78],
          [0.09, 113, 75, 102],
          [0.14, 158, 94, 103],
          [0.19, 116, 58, 83],
          [0.23, 0, 68, 51],
          [0.34, 10, 113, 68],
          [0.5, 71, 139, 75],
          [0.6, 132, 153, 84],
          [0.68, 190, 163, 94],
          [0.75, 160, 112, 74],
          [0.81, 101, 78, 70],
          [0.87, 92, 94, 94],
          [0.91, 164, 168, 166],
          [0.94, 222, 225, 221],
          [0.97, 247, 248, 245],
          [1, 255, 255, 252],
        ];
        const waterPalette = [
          [0, 108, 185, 190],
          [0.1, 68, 168, 180],
          [0.22, 40, 149, 167],
          [0.36, 25, 128, 151],
          [0.52, 16, 105, 133],
          [0.68, 13, 83, 110],
          [0.82, 11, 66, 88],
          [0.92, 10, 55, 72],
          [1, 9, 47, 62],
        ];
        const colorCache = [];
        const canvas = document.getElementById("terrain");
        const context = canvas.getContext("2d", { alpha: false });
        const futureCanvas = document.createElement("canvas");
        const futureContext = futureCanvas.getContext("2d");
        const cohortSelect = document.getElementById("cohort");
        const metricSelect = document.getElementById("metric");
        const modeSelect = document.getElementById("mode");
        const shapeSelect = document.getElementById("shape");
        const weightSelect = document.getElementById("weight");
        const angleSelect = document.getElementById("angle");
        const dateOutput = document.getElementById("date");
        const priceOutput = document.getElementById("price");
        const statusOutput = document.getElementById("status");
        const message = document.getElementById("message");
        const tinySelectionOutput = document.getElementById("tiny-selection");
        const compactViewport = window.matchMedia(
          "(max-width: 320px), (max-height: 260px)",
        );
        const embeddedPreview = window.self !== window.top;
        const compactMode = embeddedPreview || compactViewport.matches;
        if (compactMode) document.documentElement.classList.add("is-compact");
        compactViewport.addEventListener("change", () => {
          if (!embeddedPreview) window.location.reload();
        });

        if (compactMode) {
          const hasOption = (select, value) =>
            Array.from(select.options).some(
              (option) => option.value === String(value),
            );
          let stored = {};
          try {
            stored = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") || {};
          } catch (_) {}
          const params = new URLSearchParams(location.search);
          const choose = (key, select, fallback) => {
            const fromUrl = params.get(key);
            if (fromUrl !== null && hasOption(select, fromUrl)) return fromUrl;
            return hasOption(select, stored[key])
              ? String(stored[key])
              : String(fallback);
          };
          const tinySettings = {
            cohort: choose("cohort", cohortSelect, "all"),
            metric: choose("data", metricSelect, "supply"),
            mode: choose("mode", modeSelect, "value"),
            weight: choose("weight", weightSelect, "raw"),
          };
          cohortSelect.value = tinySettings.cohort;
          metricSelect.value = tinySettings.metric;
          modeSelect.value = tinySettings.mode;
          weightSelect.value = tinySettings.weight;

          const selectedLabel = (select) =>
            select.selectedOptions[0]?.textContent.trim() || select.value;
          tinySelectionOutput.textContent = [
            selectedLabel(cohortSelect),
            selectedLabel(metricSelect),
            selectedLabel(weightSelect),
            selectedLabel(modeSelect),
          ].join(" · ");

          let tinyProfile = null;
          let tinyComparison = null;
          const sourceKey =
            tinySettings.metric === "realized_cap"
              ? "realized_cap"
              : tinySettings.metric === "unrealized_pnl"
                ? "unrealized_pnl"
                : "supply";
          const formatTinyPrice = (value) =>
            Number.isFinite(value)
              ? `$${Math.round(value).toLocaleString("en-US")}`
              : "—";
          const bucketValue = (bucket) => Number(bucket?.[sourceKey]) || 0;

          const profileValues = (profile) =>
            new Map(
              (profile?.buckets || [])
                .filter((bucket) => Number(bucket.price_floor) > 0)
                .map((bucket) => [
                  Number(bucket.price_floor),
                  bucketValue(bucket),
                ]),
            );

          const tinySeries = () => {
            const current = profileValues(tinyProfile);
            const comparison = profileValues(tinyComparison);
            const prices = new Set(current.keys());
            if (tinySettings.mode !== "value") {
              comparison.forEach((_, price) => prices.add(price));
            }
            return Array.from(prices)
              .sort((left, right) => left - right)
              .map((price) => {
                const currentValue = current.get(price) || 0;
                return {
                  price,
                  value:
                    tinySettings.mode !== "value"
                      ? currentValue - (comparison.get(price) || 0)
                      : tinySettings.metric === "unrealized_pnl"
                        ? Math.abs(currentValue)
                        : currentValue,
                };
              });
          };

          const drawTinyProfile = () => {
            const width = Math.max(1, canvas.clientWidth);
            const height = Math.max(1, canvas.clientHeight);
            const dpr = Math.min(devicePixelRatio || 1, 1.25);
            canvas.width = Math.max(1, Math.round(width * dpr));
            canvas.height = Math.max(1, Math.round(height * dpr));
            context.setTransform(dpr, 0, 0, dpr, 0, 0);
            context.fillStyle = "#07100f";
            context.fillRect(0, 0, width, height);
            if (!tinyProfile?.buckets?.length) return;

            const series = tinySeries();
            if (!series.length) return;
            const left = 0;
            const right = width;
            const plotTop = 0;
            const plotBottom = height;
            const plotWidth = Math.max(1, right - left);
            const binsPerBar =
              plotWidth >= series.length * 5 ? 1 : 2;
            const bars = [];
            for (let start = 0; start < series.length; start += binsPerBar) {
              const end = Math.min(series.length, start + binsPerBar);
              let value = 0;
              for (let point = start; point < end; point++) {
                value += series[point].value;
              }
              bars.push(value);
            }
            const barCount = bars.length;
            const peak = Math.max(
              ...bars.map((value) => Math.abs(value)),
              1,
            );
            const normalized = bars.map(
              (value) =>
                Math.sign(value) *
                (Math.asinh((Math.abs(value) / peak) * 24) / Math.asinh(24)),
            );
            const baseline =
              tinySettings.mode === "value"
                ? plotBottom
                : (plotTop + plotBottom) * 0.5;
            const positiveHeight = baseline - plotTop;
            const negativeHeight = plotBottom - baseline;
            const columnWidth = plotWidth / barCount;
            const gap =
              columnWidth >= 1.75
                ? Math.min(1, columnWidth * 0.2)
                : 0;

            context.fillStyle = "rgba(255, 255, 255, 0.12)";
            context.fillRect(
              left,
              Math.min(height - 1, Math.round(baseline)),
              plotWidth,
              1,
            );
            normalized.forEach((value, index) => {
              if (value === 0) return;
              const barHeight =
                value >= 0
                  ? value * positiveHeight
                  : -value * negativeHeight;
              const x =
                left +
                index * columnWidth +
                (index === 0 ? 0 : gap * 0.5);
              const barRight =
                left +
                (index + 1) * columnWidth -
                (index === barCount - 1 ? 0 : gap * 0.5);
              const y = value >= 0 ? baseline - barHeight : baseline;
              context.fillStyle = elevationColor(
                surfaceColorHeight(Math.abs(value), 1),
                1,
                value < 0 ? -1 : 1,
              );
              context.fillRect(
                x,
                y,
                Math.max(1, barRight - x),
                Math.max(1, barHeight),
              );
            });
            const close = Number(tinyProfile.close);
            let closest = 0;
            let distance = Infinity;
            series.forEach((point, index) => {
              const next = Math.abs(point.price - close);
              if (next < distance) {
                closest = index;
                distance = next;
              }
            });
            const markerBar = Math.min(
              barCount - 1,
              Math.floor(closest / binsPerBar),
            );
            const markerX =
              left + ((markerBar + 0.5) / barCount) * plotWidth;
            context.save();
            context.lineCap = "round";
            context.beginPath();
            context.moveTo(markerX, plotTop);
            context.lineTo(markerX, plotBottom);
            context.globalAlpha = 0.32;
            context.strokeStyle = "#240b09";
            context.lineWidth = width <= 560 ? 1.8 : 2.3;
            context.stroke();
            context.globalAlpha = 0.62;
            context.strokeStyle = "#ff3b30";
            context.lineWidth = width <= 560 ? 0.7 : 0.85;
            context.stroke();
            context.restore();
          };

          const loadTinyProfile = async () => {
            try {
              const query = new URLSearchParams({
                agg: "lin1000",
                weight: tinySettings.weight,
              });
              const datesResponse = await fetch(
                `${API}/urpd/${encodeURIComponent(tinySettings.cohort)}/dates?${new URLSearchParams({ weight: tinySettings.weight })}`,
                { cache: "no-cache", signal: AbortSignal.timeout(8_000) },
              );
              if (!datesResponse.ok) {
                throw new Error(`URPD dates: ${datesResponse.status}`);
              }
              const availableDates = await datesResponse.json();
              if (!Array.isArray(availableDates) || !availableDates.length) {
                throw new Error("No URPD dates are available");
              }
              const rangeDates = availableDates.filter(
                (date) => date >= "2018-01-01",
              );
              if (!rangeDates.length) {
                throw new Error("No recent URPD dates are available");
              }
              const dates = rangeDates.filter((_, index) => index % 7 === 0);
              const latestDate = rangeDates[rangeDates.length - 1];
              if (dates[dates.length - 1] !== latestDate) dates.push(latestDate);

              const fetchProfile = async (date, cache) => {
                const response = await fetch(
                  `${API}/urpd/${encodeURIComponent(tinySettings.cohort)}/${date}?${query}`,
                  { cache, signal: AbortSignal.timeout(8_000) },
                );
                if (!response.ok) {
                  throw new Error(`URPD profile: ${response.status}`);
                }
                return response.json();
              };

              tinyProfile = await fetchProfile(latestDate, "no-cache");
              if (tinySettings.mode !== "value") {
                const offset = COMPARISON_OFFSETS[tinySettings.mode] || 1;
                const comparisonDate =
                  dates[Math.max(0, dates.length - 1 - offset)];
                tinyComparison = await fetchProfile(
                  comparisonDate,
                  "force-cache",
                );
              }
              priceOutput.textContent = formatTinyPrice(Number(tinyProfile.close));
              priceOutput.value = priceOutput.textContent;
              dateOutput.textContent = tinyProfile.date || "Latest profile";
              dateOutput.value = dateOutput.textContent;
              message.hidden = true;
              canvas.setAttribute(
                "aria-label",
                `${selectedLabel(modeSelect)} ${selectedLabel(metricSelect)} histogram for ${selectedLabel(cohortSelect)} on ${tinyProfile.date}, weighted by ${selectedLabel(weightSelect)}`,
              );
              drawTinyProfile();
            } catch (error) {
              priceOutput.textContent = "Unavailable";
              dateOutput.textContent = "Current trail";
              message.hidden = true;
              console.error(error);
            }
          };

          new ResizeObserver(drawTinyProfile).observe(canvas);
          loadTinyProfile();
          return;
        }
        const hoverQuery = window.matchMedia(
          "(hover: hover) and (pointer: fine)",
        );

        const state = {
          cohort: "all",
          metric: "supply",
          mode: "value",
          shape: "flats",
          weight: "raw",
          angle: 30,
          aggregation: "lin1000",
          dates: [],
          dateLabels: [],
          profileKeys: [],
          selectedIndex: 0,
          viewIndex: 0,
          width: 0,
          height: 0,
          dpr: 1,
          visibleCount: 721,
          halfWindow: 360,
          binCount: 120,
          priceCoordinates: new Float64Array(0),
          grid: { kind: "linear", origin: 0, size: 1_000 },
          minLog: Math.log10(60),
          maxLog: Math.log10(260_000),
          maxPrice: 260_000,
          projectionCache: null,
          cache: new Map(),
          dateCache: new Map(),
          renderRequested: false,
          progressRenderTimer: 0,
          hoverRenderTimer: 0,
          lastRenderAt: 0,
          loadTimer: 0,
          loadController: null,
          loadGeneration: 0,
          loading: 0,
          error: "",
          hoverModel: null,
          hoverActive: false,
          hoverPriceCoordinate: null,
          lastPointerAt: 0,
          terrainChunks: new Map(),
          chunkBuildTimer: 0,
          chunkGeneration: 0,
        };

        const monthFormatter = new Intl.DateTimeFormat("en", {
          month: "short",
          timeZone: "UTC",
        });
        const priceFormatter = new Intl.NumberFormat("en", {
          style: "currency",
          currency: "USD",
          maximumFractionDigits: 0,
        });

        function clamp(value, min, max) {
          return Math.min(max, Math.max(min, value));
        }

        function lerp(start, end, amount) {
          return start + (end - start) * amount;
        }

        function hasOption(select, value) {
          return Array.from(select.options).some(
            (option) => option.value === String(value),
          );
        }

        function readStoredSettings() {
          try {
            const stored = JSON.parse(
              localStorage.getItem(SETTINGS_KEY) || "{}",
            );
            return stored && typeof stored === "object" ? stored : {};
          } catch {
            return {};
          }
        }

        function restoreSettings() {
          const params = new URLSearchParams(location.search);
          const stored = readStoredSettings();
          const choose = (key, select, fallback) => {
            const fromUrl = params.get(key);
            if (fromUrl !== null && hasOption(select, fromUrl)) {
              return fromUrl;
            }
            const fromStorage = stored[key];
            return hasOption(select, fromStorage)
              ? String(fromStorage)
              : String(fallback);
          };

          state.metric = choose(
            "data",
            metricSelect,
            state.metric,
          );
          state.mode = choose(
            "mode",
            modeSelect,
            state.mode,
          );
          state.shape = choose(
            "shape",
            shapeSelect,
            state.shape,
          );
          state.weight = choose(
            "weight",
            weightSelect,
            state.weight,
          );
          state.angle = Number(
            choose("angle", angleSelect, state.angle),
          );
          state.cohort = choose(
            "cohort",
            cohortSelect,
            state.cohort,
          );

          metricSelect.value = state.metric;
          modeSelect.value = state.mode;
          shapeSelect.value = state.shape;
          weightSelect.value = state.weight;
          angleSelect.value = String(state.angle);
          cohortSelect.value = state.cohort;
        }

        function persistSettings() {
          const settings = {
            data: state.metric,
            mode: state.mode,
            shape: state.shape,
            weight: state.weight,
            angle: String(state.angle),
            cohort: state.cohort,
          };

          try {
            localStorage.setItem(
              SETTINGS_KEY,
              JSON.stringify(settings),
            );
          } catch {
            // Persistence can be unavailable in privacy-restricted contexts.
          }

          try {
            const url = new URL(location.href);
            url.searchParams.delete("view");
            for (const [key, value] of Object.entries(settings)) {
              url.searchParams.set(key, value);
            }
            history.replaceState(history.state, "", url);
          } catch {
            // The visualization still works when its host forbids URL changes.
          }
        }

        function toOdd(value) {
          return value % 2 === 0 ? value + 1 : value;
        }

        function formatDate(value) {
          if (!value) return "—";
          const date = new Date(`${value}T00:00:00Z`);
          return `${monthFormatter.format(date)} ${String(
            date.getUTCDate(),
          ).padStart(2, " ")}, ${date.getUTCFullYear()}`;
        }

        function formatPrice(value) {
          if (!(value > 0)) return "—";
          return priceFormatter.format(value);
        }

        function comparisonOffset() {
          return COMPARISON_OFFSETS[state.mode] ?? 0;
        }

        function comparisonIndex(index) {
          return index - comparisonOffset();
        }

        function profileKeyForDate(date) {
          return `${state.cohort}:${state.weight}:${state.aggregation}:${date}`;
        }

        function cacheKey(index) {
          return (
            state.profileKeys[index] ??
            profileKeyForDate(state.dates[index])
          );
        }

        function getProfile(index) {
          return state.cache.get(cacheKey(index));
        }

        function getComparisonProfile(index) {
          if (state.mode === "value" || !state.dates[index]) return null;
          const targetIndex = comparisonIndex(index);
          return targetIndex >= 0 ? getProfile(targetIndex) : null;
        }

        function hasRenderableProfile(index) {
          const comparisonAvailable =
            state.mode === "value" ||
            comparisonIndex(index) < 0 ||
            getComparisonProfile(index);
          return Boolean(
            getProfile(index) &&
              comparisonAvailable,
          );
        }

        function putProfile(key, profile) {
          state.cache.delete(key);
          state.cache.set(key, profile);

          const limit = Math.min(
            CACHE_LIMIT,
            Math.max(
              (Math.min(state.width, state.height) <= 260 ? 24 : 80) *
                WEIGHT_VARIANT_COUNT,
              (state.visibleCount + 24) * WEIGHT_VARIANT_COUNT,
            ),
          );
          while (state.cache.size > limit) {
            const oldest = state.cache.keys().next().value;
            state.cache.delete(oldest);
          }
        }

        function invalidateTerrainChunks() {
          if (state.chunkBuildTimer) {
            clearTimeout(state.chunkBuildTimer);
            state.chunkBuildTimer = 0;
          }
          state.chunkGeneration++;
          state.terrainChunks.clear();
        }

        function computeVisibleWindow() {
          const shortest = Math.min(state.width, state.height);
          const tiny = shortest <= 260;
          const compact = !tiny && (state.width <= 560 || state.height <= 360);
          const density = tiny ? 0.12 : compact ? 0.75 : 4;
          const minimum = tiny ? 17 : compact ? 91 : 721;
          const maximum = tiny ? 65 : compact ? 361 : 5_761;
          const count = toOdd(
            clamp(Math.floor(state.width * density), minimum, maximum),
          );
          state.visibleCount = count;
          state.halfWindow = (count - 1) / 2;
          computeRenderBins();
        }

        function computeRenderBins() {
          if (state.aggregation.startsWith("log")) {
            const bucketsPerDecade =
              Number(state.aggregation.slice(3)) || 50;
            const minPrice = 10 ** state.minLog;
            const maxPrice = state.maxPrice;
            const origin = Math.floor(
              Math.log10(minPrice + 1) * bucketsPerDecade,
            );
            const end = Math.max(
              origin + 1,
              Math.round(Math.log10(maxPrice + 1) * bucketsPerDecade),
            );
            const count = Math.max(2, end - origin + 1);
            const coordinates = new Float64Array(count);
            const span = state.maxLog - state.minLog;
            for (let index = 0; index < count; index++) {
              const center =
                10 ** ((origin + index + 0.5) / bucketsPerDecade) - 1;
              coordinates[index] = clamp(
                (Math.log10(center) - state.minLog) / span,
                0,
                1,
              );
            }
            state.binCount = count;
            state.priceCoordinates = coordinates;
            state.grid = {
              kind: "log",
              origin,
              size: bucketsPerDecade,
            };
            return;
          }

          const bucketWidth = Number(state.aggregation.slice(3)) || 200;
          const maxPrice = state.maxPrice;
          const origin = 0;
          const end = Math.max(origin + 1, Math.floor(maxPrice / bucketWidth));
          const count = end - origin + 1;
          const coordinates = new Float64Array(count);
          for (let index = 0; index < count; index++) {
            const price = (origin + index) * bucketWidth;
            coordinates[index] = clamp(price / maxPrice, 0, 1);
          }
          state.binCount = count;
          state.priceCoordinates = coordinates;
          state.grid = { kind: "linear", origin, size: bucketWidth };
        }

        function requestConcurrency() {
          const connection =
            navigator.connection ??
            navigator.mozConnection ??
            navigator.webkitConnection;
          if (
            connection?.saveData ||
            /(^|-)2g$/.test(connection?.effectiveType ?? "")
          ) {
            return 2;
          }
          if (Math.min(state.width, state.height) <= 260) return 2;
          if (state.width <= 560 || state.height <= 360) return 3;
          if (!state.aggregation.startsWith("log")) return CONCURRENCY;
          const buckets = Number(state.aggregation.slice(3)) || 50;
          if (buckets >= 1_000) return 3;
          if (buckets >= 500) return 4;
          return CONCURRENCY;
        }

        function visibleRange() {
          return {
            start: Math.max(0, state.viewIndex - state.halfWindow),
            end: Math.min(
              state.dates.length - 1,
              state.viewIndex + state.halfWindow,
            ),
          };
        }

        function canHoverTerrain() {
          return hoverQuery.matches && state.width > 560;
        }

        function updateReadout() {
          const date = state.dates[state.selectedIndex];
          const dateText = (
            state.dateLabels[state.selectedIndex] ?? formatDate(date)
          ).padStart(12, " ");
          const profile = state.cache.get(cacheKey(state.selectedIndex));
          const priceText = formatPrice(profile?.close).padStart(8, " ");
          if (dateOutput.value !== dateText) {
            dateOutput.value = dateText;
            dateOutput.textContent = dateText;
          }
          if (priceOutput.value !== priceText) {
            priceOutput.value = priceText;
            priceOutput.textContent = priceText;
          }
        }

        function updateStatus() {
          if (!state.dates.length) {
            statusOutput.textContent = "";
            return;
          }

          const { start, end } = visibleRange();
          let loaded = 0;
          for (let index = start; index <= end; index++) {
            if (hasRenderableProfile(index)) loaded++;
          }
          const total = Math.max(0, end - start + 1);
          const text = state.error
            ? state.error
            : loaded < total
              ? `${loaded}/${total} visible dates`
              : "";
          if (statusOutput.textContent !== text) {
            statusOutput.textContent = text;
          }
        }

        function scheduleRender() {
          if (state.progressRenderTimer) {
            clearTimeout(state.progressRenderTimer);
            state.progressRenderTimer = 0;
          }
          if (state.hoverRenderTimer) {
            cancelAnimationFrame(state.hoverRenderTimer);
            state.hoverRenderTimer = 0;
          }
          if (state.renderRequested) return;
          state.renderRequested = true;
          requestAnimationFrame(() => {
            state.renderRequested = false;
            render();
          });
        }

        function scheduleProgressRender() {
          if (document.hidden) return;
          if (state.renderRequested || state.progressRenderTimer) return;
          const elapsed = performance.now() - state.lastRenderAt;
          const delay = Math.max(0, PROGRESS_PAINT_INTERVAL - elapsed);
          state.progressRenderTimer = window.setTimeout(() => {
            state.progressRenderTimer = 0;
            scheduleRender();
          }, delay);
        }

        function scheduleHoverRender() {
          if (state.renderRequested || state.hoverRenderTimer) return;
          state.hoverRenderTimer = requestAnimationFrame(() => {
            state.hoverRenderTimer = 0;
            if (state.renderRequested) return;
            state.renderRequested = true;
            render();
            state.renderRequested = false;
          });
        }

        function resize() {
          const bounds = canvas.getBoundingClientRect();
          const width = Math.max(1, Math.round(bounds.width));
          const height = Math.max(1, Math.round(bounds.height));
          const pixelLimitedDpr = Math.sqrt(
            MAX_CANVAS_PIXELS / Math.max(1, width * height),
          );
          const shortest = Math.min(width, height);
          const dprCap = shortest <= 260 ? 1 : shortest <= 480 ? 1.25 : 1.5;
          const dpr = Math.max(
            1,
            Math.floor(
              Math.min(
                window.devicePixelRatio || 1,
                dprCap,
                pixelLimitedDpr,
              ) * 4,
            ) / 4,
          );

          if (
            width === state.width &&
            height === state.height &&
            dpr === state.dpr
          ) {
            return;
          }

          state.width = width;
          state.height = height;
          state.dpr = dpr;
          if (!canHoverTerrain()) {
            clearHoverState();
          }
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          futureCanvas.width = canvas.width;
          futureCanvas.height = canvas.height;
          context.setTransform(dpr, 0, 0, dpr, 0, 0);
          futureContext.setTransform(dpr, 0, 0, dpr, 0, 0);
          computeVisibleWindow();
          invalidateTerrainChunks();
          scheduleRender();
          scheduleWindowLoad(40);
        }

        function setPriceRange(profile) {
          const previousMinLog = state.minLog;
          const previousMaxPrice = state.maxPrice;
          let close = Number(profile?.close);
          if (!(close > 0)) {
            const nonzero = profile?.prices.filter((price) => price > 0) ?? [];
            close = nonzero.length
              ? nonzero[Math.floor(nonzero.length * 0.72)]
              : 1_000;
          }

          const minPrice = Math.max(0.01, close / 1_000);
          const { start, end } = visibleRange();
          let maxPrice = Number(profile?.maxPrice) || 0;
          for (let index = start; index <= end; index++) {
            const visibleProfile = state.cache.get(cacheKey(index));
            if (visibleProfile?.maxPrice > maxPrice) {
              maxPrice = visibleProfile.maxPrice;
            }
          }
          if (!(maxPrice > minPrice)) {
            maxPrice = Math.max(minPrice * 100, close * 4);
          }
          state.minLog = Math.log10(minPrice);
          state.maxLog = Math.log10(maxPrice);
          state.maxPrice = maxPrice;
          computeRenderBins();
          if (
            state.minLog !== previousMinLog ||
            state.maxPrice !== previousMaxPrice
          ) {
            invalidateTerrainChunks();
          }
        }

        function metricSource(profile) {
          if (state.metric === "realized_cap") {
            return profile?.realizedCaps;
          }
          if (state.metric === "unrealized_pnl") {
            return profile?.unrealizedPnls;
          }
          return profile?.supplies;
        }

        function metricTotal(profile) {
          if (state.metric === "realized_cap") {
            return profile?.totalRealizedCap;
          }
          if (state.metric === "unrealized_pnl") {
            return profile?.totalAbsolutePnl;
          }
          return profile?.totalSupply;
        }

        function sampleProfile(profile, comparisonProfile = null) {
          const sampleKey = [
            state.metric,
            state.mode,
            comparisonProfile?.date ?? "none",
            state.aggregation,
            state.grid.kind,
            state.grid.origin,
            state.grid.size,
            state.binCount,
            state.minLog,
            state.maxLog,
          ].join(":");
          if (profile.sampleKey === sampleKey) return profile.sampled;

          const values = new Float32Array(state.binCount);
          const currentTotal = Number(metricTotal(profile)) || 0;
          const comparisonTotal =
            Number(metricTotal(comparisonProfile)) || 0;
          const totalValue =
            state.mode !== "value"
              ? (currentTotal + comparisonTotal) * 0.5
              : currentTotal;
          if (
            !(totalValue > 0) ||
            (state.mode !== "value" && !comparisonProfile)
          ) {
            profile.sampleKey = sampleKey;
            profile.sampled = values;
            profile.sampledRaw = values.slice();
            profile.sampledPeak = 0;
            profile.sampledTotalValue = totalValue;
            return values;
          }
          const grid = state.grid;

          const addProfile = (sourceProfile, multiplier) => {
            const source = metricSource(sourceProfile);
            if (!source) return;
            for (
              let index = 1;
              index < sourceProfile.prices.length;
              index++
            ) {
              const price = sourceProfile.prices[index];
              if (!(price >= 0)) continue;
              const rawValue = Number(source[index]) || 0;
              const value =
                state.mode === "value" &&
                state.metric === "unrealized_pnl"
                  ? Math.abs(rawValue)
                  : rawValue;
              if (value === 0) continue;

              const bucket =
                grid.kind === "log"
                  ? Math.round(Math.log10(price + 1) * grid.size)
                  : Math.round(price / grid.size);
              const target = bucket - grid.origin;
              if (target >= 0 && target < values.length) {
                values[target] += value * multiplier;
              }
            }
          };

          addProfile(profile, 1);
          if (state.mode !== "value") {
            addProfile(comparisonProfile, -1);
          }

          profile.sampledRaw = values.slice();
          const denominator = Math.asinh(200);
          let peak = 0;
          for (let index = 0; index < values.length; index++) {
            let density;
            let densityScale;
            if (grid.kind === "log") {
              density =
                Math.abs(values[index]) /
                totalValue /
                (1 / grid.size);
              densityScale =
                state.mode === "value" ? 0.01 : 0.001;
            } else {
              density =
                Math.abs(values[index]) / totalValue / grid.size;
              densityScale =
                state.mode === "value" ? 0.000001 : 0.0000001;
            }
            const height = clamp(
              Math.asinh(density / densityScale) / denominator,
              0,
              1,
            );
            const signedHeight =
              Math.sign(values[index]) * height;
            values[index] =
              state.mode === "value" ? height : signedHeight;
            peak = Math.max(peak, height);
          }

          profile.sampleKey = sampleKey;
          profile.sampled = values;
          profile.sampledPeak = peak;
          profile.sampledTotalValue = totalValue;
          return values;
        }

        function geometry() {
          const mobile = state.width <= 560;
          const tiny = Math.min(state.width, state.height) <= 260;
          const compactLandscape =
            state.width <= 960 && state.height <= 560;
          const signed = state.mode !== "value";
          const top = tiny ? 38 : mobile ? 80 : compactLandscape ? 160 : 94;
          const bottom = tiny ? 10 : mobile ? 178 : 30;
          const available = Math.max(
            tiny ? 40 : mobile || compactLandscape ? 120 : 240,
            state.height - top - bottom,
          );
          const angleRadians = (state.angle * Math.PI) / 180;
          const isoSlope = Math.tan(angleRadians);
          let timeSpan = Math.max(1, state.halfWindow);
          let pastExtent = 1;
          let futureExtent = 1;
          if (state.dates.length) {
            const { start, end } = visibleRange();
            timeSpan = Math.max(
              1,
              state.viewIndex - start,
              end - state.viewIndex,
            );
            pastExtent = (state.viewIndex - start) / timeSpan;
            futureExtent = (end - state.viewIndex) / timeSpan;
          }

          const margin = tiny ? 12 : mobile ? 40 : 44;
          const heightScale =
            available *
            (signed
              ? mobile
                ? 0.14
                : 0.17
              : mobile
                ? 0.2
                : 0.23) *
            (Math.cos(angleRadians) / Math.cos(Math.PI / 6));
          const footprint = Math.max(tiny ? 48 : 120, state.width - margin * 2);
          const totalTimeExtent = Math.max(
            0.001,
            pastExtent + futureExtent,
          );
          const timeShare =
            (mobile ? 0.32 : 0.37) *
            (Math.sin(angleRadians) / Math.sin(Math.PI / 6));
          const timeFootprint = footprint * timeShare;
          const depthX = timeFootprint / totalTimeExtent;
          const depthY = depthX * isoSlope;
          const priceWidth = footprint - timeFootprint;
          const priceRise = priceWidth * isoSlope;
          const left =
            (state.width - footprint) * 0.5 +
            pastExtent * depthX;
          const maxYOffset =
            futureExtent * depthY;

          return {
            top,
            available,
            depthX,
            depthY,
            timeSpan,
            left,
            width: priceWidth,
            priceRise,
            priceY: -priceRise,
            timeX: depthX,
            baseY:
              state.height -
              bottom -
              maxYOffset -
              (signed ? heightScale : 0),
            heightScale,
          };
        }

        function prepareProjection(layout) {
          const key = [
            state.binCount,
            state.maxPrice,
            state.minLog,
            state.maxLog,
            layout.left,
            layout.width,
            layout.baseY,
            layout.priceY,
            layout.timeX,
            layout.depthY,
            layout.timeSpan,
          ].join(":");
          let cached = state.projectionCache;
          if (!cached || cached.key !== key) {
            const priceX = new Float32Array(state.binCount);
            const priceY = new Float32Array(state.binCount);
            const priceEdgeX = new Float32Array(state.binCount + 1);
            const priceEdgeY = new Float32Array(state.binCount + 1);
            for (let index = 0; index < state.binCount; index++) {
              const coordinate = state.priceCoordinates[index];
              priceX[index] = layout.left + coordinate * layout.width;
              priceY[index] =
                layout.baseY + coordinate * layout.priceY;
            }
            for (let index = 0; index <= state.binCount; index++) {
              const coordinate =
                index === 0
                  ? 0
                  : index === state.binCount
                    ? 1
                    : (state.priceCoordinates[index - 1] +
                        state.priceCoordinates[index]) *
                      0.5;
              priceEdgeX[index] =
                layout.left + coordinate * layout.width;
              priceEdgeY[index] =
                layout.baseY + coordinate * layout.priceY;
            }
            cached = {
              key,
              priceX,
              priceY,
              priceEdgeX,
              priceEdgeY,
            };
            state.projectionCache = cached;
          }
          layout.priceX = cached.priceX;
          layout.priceYBase = cached.priceY;
          layout.priceEdgeX = cached.priceEdgeX;
          layout.priceEdgeYBase = cached.priceEdgeY;
          layout.timeXStep = layout.timeX / layout.timeSpan;
          layout.timeYStep = layout.depthY / layout.timeSpan;
        }

        function projectAtPrice(layout, dateIndex, price, height) {
          const relative = dateIndex - state.viewIndex;
          return {
            x:
              layout.left +
              price * layout.width +
              relative * layout.timeXStep,
            y:
              layout.baseY +
              price * layout.priceY +
              relative * layout.timeYStep -
              height * layout.heightScale,
          };
        }

        function project(layout, dateIndex, priceIndex, height) {
          const coordinates = state.priceCoordinates;
          const lowerIndex = clamp(
            Math.floor(priceIndex),
            0,
            coordinates.length - 1,
          );
          const upperIndex = Math.min(
            coordinates.length - 1,
            lowerIndex + 1,
          );
          const fraction = clamp(priceIndex - lowerIndex, 0, 1);
          const price =
            coordinates[lowerIndex] +
            (coordinates[upperIndex] - coordinates[lowerIndex]) * fraction;
          return projectAtPrice(layout, dateIndex, price, height);
        }

        function priceCoordinate(price) {
          if (!(price > 0)) return null;
          const coordinate =
            state.grid.kind === "linear"
              ? price / state.maxPrice
              : (Math.log10(price) - state.minLog) /
                (state.maxLog - state.minLog);
          return coordinate >= 0 && coordinate <= 1 ? coordinate : null;
        }

        function nearestPriceIndex(coordinate) {
          const coordinates = state.priceCoordinates;
          if (coordinates.length < 2) return 0;
          let lower = 1;
          let upper = coordinates.length - 1;
          while (lower < upper) {
            const middle = (lower + upper) >> 1;
            if (coordinates[middle] < coordinate) lower = middle + 1;
            else upper = middle;
          }
          if (
            lower > 0 &&
            Math.abs(coordinates[lower - 1] - coordinate) <
              Math.abs(coordinates[lower] - coordinate)
          ) {
            return lower - 1;
          }
          return lower;
        }

        function priceAtTerrainCoordinate(coordinate) {
          const index = nearestPriceIndex(coordinate);
          if (state.grid.kind === "linear") {
            return (state.grid.origin + index) * state.grid.size;
          }
          return (
            10 **
              ((state.grid.origin + index + 0.5) /
                state.grid.size) -
            1
          );
        }

        function heightAtCoordinate(row, coordinate) {
          const coordinates = state.priceCoordinates;
          if (!coordinates.length) return 0;
          if (coordinate <= coordinates[0]) return row[0];
          const last = coordinates.length - 1;
          if (coordinate >= coordinates[last]) return row[last];
          if (state.shape === "flats") {
            return row[nearestPriceIndex(coordinate)];
          }

          let lower = 0;
          let upper = last;
          while (upper - lower > 1) {
            const middle = (lower + upper) >> 1;
            if (coordinates[middle] <= coordinate) lower = middle;
            else upper = middle;
          }
          const span = coordinates[upper] - coordinates[lower];
          const amount =
            span > 0 ? (coordinate - coordinates[lower]) / span : 0;
          return row[lower] + (row[upper] - row[lower]) * amount;
        }

        function elevationColor(height, shade, sign = 1) {
          const heightBand = Math.round(clamp(height, 0, 1) * 192);
          const shadeBand = Math.round(clamp(shade, 0.55, 1.14) * 64);
          const key =
            (sign < 0 ? 20_000 : 0) +
            heightBand * 100 +
            shadeBand;
          const cached = colorCache[key];
          if (cached) return cached;

          const value = heightBand / 192;
          const activePalette = sign < 0 ? waterPalette : palette;
          let lower = activePalette[0];
          let upper = activePalette[activePalette.length - 1];
          for (let index = 1; index < activePalette.length; index++) {
            if (value <= activePalette[index][0]) {
              lower = activePalette[index - 1];
              upper = activePalette[index];
              break;
            }
          }

          const amount =
            upper[0] === lower[0]
              ? 0
              : (value - lower[0]) / (upper[0] - lower[0]);
          const multiplier = shadeBand / 64;
          const red = Math.round(
            clamp((lower[1] + (upper[1] - lower[1]) * amount) * multiplier, 0, 255),
          );
          const green = Math.round(
            clamp((lower[2] + (upper[2] - lower[2]) * amount) * multiplier, 0, 255),
          );
          const blue = Math.round(
            clamp((lower[3] + (upper[3] - lower[3]) * amount) * multiplier, 0, 255),
          );
          const color = `rgb(${red} ${green} ${blue})`;
          colorCache[key] = color;
          return color;
        }

        function surfaceColorHeight(height, localPeak) {
          const relativeHeight =
            localPeak > 0 ? height / localPeak : 0;
          const prominenceHeight =
            height * 0.45 + relativeHeight * 0.55;
          const prominenceMix = clamp(
            (height - 0.2) / 0.12,
            0,
            1,
          );
          return (
            height +
            (prominenceHeight - height) * prominenceMix
          );
        }

        function surfaceShade(
          firstHeight,
          secondHeight,
          dateIndex,
          sceneStart,
          sceneEnd,
        ) {
          const timeSlope = secondHeight - firstHeight;
          const depthLight =
            0.86 +
            0.14 *
              ((dateIndex - sceneStart) /
                Math.max(1, sceneEnd - sceneStart));
          return clamp(
            (0.96 + timeSlope * 0.38) * depthLight,
            0.74,
            1.14,
          );
        }

        function faceGradient(
          target,
          colorHeight,
          topShade,
          topY,
          bottomY,
          sign = 1,
        ) {
          const bottomShade = Math.max(0.55, topShade * 0.62);
          if (Math.abs(bottomY - topY) < 0.5) {
            return elevationColor(colorHeight, bottomShade, sign);
          }
          const gradient = target.createLinearGradient(
            0,
            topY,
            0,
            bottomY,
          );
          gradient.addColorStop(
            0,
            elevationColor(colorHeight, topShade, sign),
          );
          gradient.addColorStop(
            0.32,
            elevationColor(
              colorHeight,
              topShade + (bottomShade - topShade) * 0.28,
              sign,
            ),
          );
          gradient.addColorStop(
            1,
            elevationColor(colorHeight, bottomShade, sign),
          );
          return gradient;
        }

        function drawBackground(layout) {
          const gradient = context.createLinearGradient(
            0,
            layout.top,
            0,
            state.height,
          );
          gradient.addColorStop(0, "#081311");
          gradient.addColorStop(0.58, "#07100f");
          gradient.addColorStop(1, "#050b0a");
          context.fillStyle = gradient;
          context.fillRect(0, 0, state.width, state.height);

          const glow = context.createRadialGradient(
            state.width * 0.57,
            layout.top + layout.available * 0.42,
            0,
            state.width * 0.57,
            layout.top + layout.available * 0.42,
            Math.max(state.width, state.height) * 0.58,
          );
          glow.addColorStop(0, "rgba(87, 116, 80, 0.11)");
          glow.addColorStop(0.5, "rgba(28, 54, 43, 0.035)");
          glow.addColorStop(1, "rgba(7, 16, 15, 0)");
          context.fillStyle = glow;
          context.fillRect(0, 0, state.width, state.height);
        }

        function drawGround(layout, start, end) {
          const startLeft = projectAtPrice(layout, start, 0, 0);
          const startRight = projectAtPrice(layout, start, 1, 0);
          const endRight = projectAtPrice(layout, end, 1, 0);
          const endLeft = projectAtPrice(layout, end, 0, 0);

          context.beginPath();
          context.moveTo(startLeft.x, startLeft.y);
          context.lineTo(startRight.x, startRight.y);
          context.lineTo(endRight.x, endRight.y);
          context.lineTo(endLeft.x, endLeft.y);
          context.closePath();
          context.fillStyle = "rgba(10, 27, 22, 0.32)";
          context.fill();
        }

        function drawAxisLegend(layout) {
          const mobile = state.width <= 560;
          const compactLandscape =
            state.width <= 960 && state.height <= 560;
          const compact = mobile || compactLandscape;
          const angle = (state.angle * Math.PI) / 180;
          const arm = compact ? 29 : 42;
          const origin = {
            x: compact ? 64 : 88,
            y: compactLandscape ? 104 : layout.top + (mobile ? 62 : 58),
          };
          const groundX = Math.cos(angle) * arm;
          const groundY = Math.sin(angle) * arm;
          const heightArm =
            arm *
            (Math.cos(angle) / Math.cos(Math.PI / 6));
          const priceEnd = {
            x: origin.x + groundX,
            y: origin.y - groundY,
          };
          const pastEnd = {
            x: origin.x - groundX,
            y: origin.y - groundY,
          };
          const heightEnd = {
            x: origin.x,
            y: origin.y - heightArm,
          };

          const drawArrow = (end) => {
            const direction = Math.atan2(
              end.y - origin.y,
              end.x - origin.x,
            );
            const head = compact ? 3.5 : 4.5;
            context.moveTo(origin.x, origin.y);
            context.lineTo(end.x, end.y);
            context.moveTo(end.x, end.y);
            context.lineTo(
              end.x - Math.cos(direction - 0.55) * head,
              end.y - Math.sin(direction - 0.55) * head,
            );
            context.moveTo(end.x, end.y);
            context.lineTo(
              end.x - Math.cos(direction + 0.55) * head,
              end.y - Math.sin(direction + 0.55) * head,
            );
          };

          context.save();
          context.strokeStyle = "rgba(238, 232, 214, 0.42)";
          context.lineWidth = compact ? 0.7 : 0.85;
          context.lineCap = "round";
          context.beginPath();
          drawArrow(priceEnd);
          drawArrow(pastEnd);
          drawArrow(heightEnd);
          context.stroke();

          context.fillStyle = "rgba(231, 228, 214, 0.64)";
          context.font = `500 ${compact ? 11 : 12}px ${MONO_FONT}`;
          context.textBaseline = "middle";

          context.textAlign = "left";
          context.fillText(
            "PRICE",
            priceEnd.x + 6,
            priceEnd.y,
          );
          context.textAlign = "right";
          context.fillText(
            "PAST",
            pastEnd.x - 6,
            pastEnd.y,
          );
          context.textAlign = "center";
          context.fillText(
            state.metric === "realized_cap"
              ? state.mode === "value"
                ? "INVESTED CAPITAL"
                : "NET INVESTED CAPITAL"
              : state.metric === "unrealized_pnl"
                ? state.mode === "value"
                  ? "UNREALIZED P&L"
                  : "NET UNREALIZED P&L"
                : state.mode === "value"
                  ? "SUPPLY"
                  : "NET SUPPLY",
            heightEnd.x,
            heightEnd.y - 8,
          );

          context.fillStyle = "rgba(155, 166, 159, 0.52)";
          context.fillText("NOW", origin.x, origin.y + 10);
          context.restore();
        }

        function formatAxisPrice(value) {
          if (value === 0) return "$0";
          if (value >= 1_000_000) {
            return `$${Number((value / 1_000_000).toFixed(1))}M`;
          }
          if (value >= 1_000) {
            return `$${Number((value / 1_000).toFixed(1))}K`;
          }
          return `$${Math.round(value)}`;
        }

        function formatAxisValue(value) {
          const currency = state.metric !== "supply";
          const negative = value < 0;
          const magnitude = Math.abs(value);
          const units = [
            [1_000_000_000_000, "T"],
            [1_000_000_000, "B"],
            [1_000_000, "M"],
            [1_000, "K"],
          ];
          let scaled = value;
          let suffix = "";
          for (const [size, unit] of units) {
            if (magnitude >= size) {
              scaled = magnitude / size;
              suffix = unit;
              break;
            }
          }
          if (!suffix) scaled = magnitude;
          const precision = scaled >= 100 ? 0 : scaled >= 10 ? 1 : 2;
          const text = Number(scaled.toFixed(precision));
          const sign = negative ? "−" : "";
          return currency
            ? `${sign}$${text}${suffix}`
            : `${sign}${text}${suffix} BTC`;
        }

        function valueAxisTitle() {
          if (state.mode !== "value") {
            return state.metric === "supply"
              ? "Δ BTC / $1K"
              : "Δ USD / $1K";
          }
          return state.metric === "supply"
            ? "BTC / $1K"
            : state.metric === "unrealized_pnl"
              ? "ABS. USD / $1K"
              : "USD / $1K";
        }

        function profileTotalValue(profile) {
          if (state.mode !== "value") {
            return profile?.sampledTotalValue;
          }
          return metricTotal(profile);
        }

        function valueAtTerrainHeight(profile, height) {
          const totalValue = profileTotalValue(profile);
          if (!(totalValue > 0)) return 0;
          const densityScale =
            state.grid.kind === "log"
              ? state.mode === "value"
                ? 0.01
                : 0.001
              : state.mode === "value"
                ? 0.000001
                : 0.0000001;
          const bucketShare =
            Math.sinh(height * Math.asinh(200)) *
            densityScale *
            (state.grid.kind === "log"
              ? 1 / state.grid.size
              : state.grid.size);
          return bucketShare * totalValue;
        }

        function nicePriceStep(maximum, targetCount) {
          const rough = maximum / Math.max(1, targetCount);
          const magnitude = 10 ** Math.floor(Math.log10(rough));
          const normalized = rough / magnitude;
          const multiple =
            normalized <= 1
              ? 1
              : normalized <= 2
                ? 2
                : normalized <= 5
                  ? 5
                  : 10;
          return multiple * magnitude;
        }

        function nearestDateIndex(value, start, end) {
          let lower = start;
          let upper = end;
          while (lower < upper) {
            const middle = (lower + upper) >> 1;
            if (state.dates[middle] < value) lower = middle + 1;
            else upper = middle;
          }
          if (
            lower > start &&
            Math.abs(
              new Date(`${state.dates[lower - 1]}T00:00:00Z`) -
                new Date(`${value}T00:00:00Z`),
            ) <
              Math.abs(
                new Date(`${state.dates[lower]}T00:00:00Z`) -
                  new Date(`${value}T00:00:00Z`),
              )
          ) {
            return lower - 1;
          }
          return lower;
        }

        function drawPlotAxes(layout, start, end) {
          const mobile = state.width <= 560;
          const axisEnd = clamp(state.selectedIndex, start, end);
          const priceLength = Math.hypot(
            layout.width,
            layout.priceY,
          );
          const timeLength = Math.hypot(
            layout.timeX,
            layout.depthY,
          );
          const priceAxis = {
            x: layout.width / priceLength,
            y: layout.priceY / priceLength,
          };
          const timeAxis = {
            x: layout.timeX / timeLength,
            y: layout.depthY / timeLength,
          };
          const priceOut = {
            x: timeAxis.x,
            y: timeAxis.y,
          };
          const timeOut = {
            x: -priceAxis.x,
            y: -priceAxis.y,
          };
          const frontMin = projectAtPrice(
            layout,
            axisEnd,
            0,
            0,
          );
          const frontMax = projectAtPrice(
            layout,
            axisEnd,
            1,
            0,
          );
          const valueTop = projectAtPrice(
            layout,
            axisEnd,
            0,
            1,
          );
          const valueBottom = projectAtPrice(
            layout,
            axisEnd,
            0,
            state.mode === "value" ? 0 : -1,
          );
          const pastMin = projectAtPrice(layout, start, 0, 0);
          const nowMin = projectAtPrice(layout, end, 0, 0);
          const drawFloorLabel = (
            text,
            x,
            y,
            baseline,
            down,
          ) => {
            context.save();
            context.translate(x, y);
            context.transform(
              baseline.x,
              baseline.y,
              down.x,
              down.y,
              0,
              0,
            );
            context.textAlign = "center";
            context.fillText(text, 0, 0);
            context.restore();
          };

          context.save();
          context.strokeStyle = "rgba(203, 212, 202, 0.22)";
          context.fillStyle = "rgba(231, 232, 219, 0.78)";
          context.lineWidth = 0.7;
          context.font = `500 ${mobile ? 11 : 12}px ${MONO_FONT}`;
          context.textBaseline = "middle";

          context.beginPath();
          context.moveTo(frontMin.x, frontMin.y);
          context.lineTo(frontMax.x, frontMax.y);
          context.moveTo(pastMin.x, pastMin.y);
          context.lineTo(nowMin.x, nowMin.y);
          context.moveTo(valueBottom.x, valueBottom.y);
          context.lineTo(valueTop.x, valueTop.y);
          context.stroke();

          const priceStep = mobile ? 20_000 : 10_000;
          for (
            let price = 0;
            price <= state.maxPrice;
            price += priceStep
          ) {
            const point = projectAtPrice(
              layout,
              axisEnd,
              price / state.maxPrice,
              0,
            );
            context.beginPath();
            context.moveTo(point.x, point.y);
            context.lineTo(
              point.x + priceOut.x * 4,
              point.y + priceOut.y * 4,
            );
            context.stroke();
            drawFloorLabel(
              formatAxisPrice(price),
              point.x + priceOut.x * (mobile ? 9 : 11),
              point.y + priceOut.y * (mobile ? 9 : 11),
              priceAxis,
              priceOut,
            );
          }

          const startYear = Number(state.dates[start].slice(0, 4));
          const endYear = Number(state.dates[end].slice(0, 4));
          for (
            let year = startYear;
            year <= endYear;
            year += mobile ? 2 : 1
          ) {
            const dateIndex = nearestDateIndex(
              `${year}-01-01`,
              start,
              end,
            );
            const point = projectAtPrice(
              layout,
              dateIndex,
              0,
              0,
            );
            context.beginPath();
            context.moveTo(point.x, point.y);
            context.lineTo(
              point.x + timeOut.x * 4,
              point.y + timeOut.y * 4,
            );
            context.stroke();
            drawFloorLabel(
              String(year),
              point.x + timeOut.x * (mobile ? 8 : 10),
              point.y + timeOut.y * (mobile ? 8 : 10),
              timeAxis,
              timeOut,
            );
          }

          const selectedProfile = getProfile(axisEnd);
          const totalValue = profileTotalValue(selectedProfile);
          if (totalValue > 0) {
            const valueSide = frontMin.x < state.width * 0.5 ? -1 : 1;
            const valueTickCount = mobile ? 2 : 4;
            const firstValueTick =
              state.mode === "value" ? 0 : -valueTickCount;
            const valueTickStep =
              state.mode === "value" ? 1 : 2;
            context.textAlign = valueSide < 0 ? "right" : "left";
            for (
              let tickIndex = firstValueTick;
              tickIndex <= valueTickCount;
              tickIndex += valueTickStep
            ) {
              const height = tickIndex / valueTickCount;
