              const point = projectAtPrice(
                layout,
                axisEnd,
                0,
                height,
              );
              context.beginPath();
              context.moveTo(point.x, point.y);
              context.lineTo(point.x + valueSide * 4, point.y);
              context.stroke();
              context.fillText(
                formatAxisValue(
                  valueAtTerrainHeight(selectedProfile, height),
                ),
                point.x + valueSide * (mobile ? 8 : 10),
                point.y,
              );
            }
            context.fillText(
              valueAxisTitle(),
              valueTop.x + valueSide * (mobile ? 8 : 10),
              valueTop.y - (mobile ? 9 : 11),
            );
          }
          context.restore();
        }

        function drawHoverCursor(
          layout,
          dateIndex,
          row,
          profile,
        ) {
          if (
            !state.hoverActive ||
            state.hoverPriceCoordinate === null ||
            !row ||
            !profile
          ) {
            return;
          }

          const coordinate = clamp(
            state.hoverPriceCoordinate,
            0,
            1,
          );
          const height = heightAtCoordinate(row, coordinate);
          const value = profile.sampledRaw
            ? heightAtCoordinate(profile.sampledRaw, coordinate)
            : valueAtTerrainHeight(profile, height);
          const datePoint = projectAtPrice(
            layout,
            dateIndex,
            0,
            0,
          );
          const pricePoint = projectAtPrice(
            layout,
            dateIndex,
            coordinate,
            0,
          );
          const valuePoint = projectAtPrice(
            layout,
            dateIndex,
            0,
            height,
          );
          const surfacePoint = projectAtPrice(
            layout,
            dateIndex,
            coordinate,
            height,
          );
          const priceLength = Math.hypot(
            layout.width,
            layout.priceY,
          );
          const timeLength = Math.hypot(
            layout.timeX,
            layout.depthY,
          );
          const priceAxis = {
            x: layout.width / priceLength,
            y: layout.priceY / priceLength,
          };
          const timeAxis = {
            x: layout.timeX / timeLength,
            y: layout.depthY / timeLength,
          };
          const priceOut = {
            x: timeAxis.x,
            y: timeAxis.y,
          };
          const timeOut = {
            x: -priceAxis.x,
            y: -priceAxis.y,
          };
          const valueSide =
            datePoint.x < state.width * 0.5 ? -1 : 1;
          const mobile = state.width <= 560;
          const accent = "#ffffff";

          context.save();
          context.strokeStyle = "rgba(255, 255, 255, 0.68)";
          context.lineWidth = 0.9;
          context.setLineDash([3, 3]);
          context.beginPath();
          context.moveTo(datePoint.x, datePoint.y);
          context.lineTo(pricePoint.x, pricePoint.y);
          context.lineTo(surfacePoint.x, surfacePoint.y);
          context.lineTo(valuePoint.x, valuePoint.y);
          context.stroke();
          context.setLineDash([]);

          const drawAxisPoint = (point) => {
            context.fillStyle = accent;
            context.beginPath();
            context.arc(point.x, point.y, mobile ? 2.2 : 2.7, 0, Math.PI * 2);
            context.fill();
          };
          drawAxisPoint(datePoint);
          drawAxisPoint(pricePoint);
          drawAxisPoint(valuePoint);

          context.shadowColor = "rgba(255, 255, 255, 0.66)";
          context.shadowBlur = 8;
          context.fillStyle = accent;
          context.beginPath();
          context.arc(
            surfacePoint.x,
            surfacePoint.y,
            mobile ? 3.2 : 4,
            0,
            Math.PI * 2,
          );
          context.fill();
          context.shadowBlur = 0;
          context.strokeStyle = "rgba(7, 16, 15, 0.9)";
          context.lineWidth = 1.2;
          context.stroke();

          const drawCursorLabel = (
            text,
            x,
            y,
            baseline = null,
            down = null,
            align = "center",
          ) => {
            context.save();
            context.translate(x, y);
            if (baseline && down) {
              context.transform(
                baseline.x,
                baseline.y,
                down.x,
                down.y,
                0,
                0,
              );
            }
            const fontSize = mobile ? 11 : 12;
            context.font = `500 ${fontSize}px ${MONO_FONT}`;
            context.textAlign = align;
            context.textBaseline = "middle";
            const textWidth = context.measureText(text).width;
            const paddingX = mobile ? 6 : 7;
            const paddingY = mobile ? 3 : 4;
            const boxWidth = textWidth + paddingX * 2;
            const boxHeight = fontSize + paddingY * 2;
            const boxX =
              align === "left"
                ? -paddingX
                : align === "right"
                  ? -textWidth - paddingX
                  : -boxWidth * 0.5;
            context.fillStyle = accent;
            context.beginPath();
            context.roundRect(
              boxX,
              -boxHeight * 0.5,
              boxWidth,
              boxHeight,
              mobile ? 3 : 4,
            );
            context.fill();
            context.fillStyle = "#07100f";
            context.fillText(text, 0, 0);
            context.restore();
          };

          drawCursorLabel(
            state.dates[dateIndex].slice(0, 4),
            datePoint.x + timeOut.x * (mobile ? 10 : 13),
            datePoint.y + timeOut.y * (mobile ? 10 : 13),
            timeAxis,
            timeOut,
          );
          drawCursorLabel(
            formatAxisPrice(
              priceAtTerrainCoordinate(coordinate),
            ),
            pricePoint.x + priceOut.x * (mobile ? 10 : 13),
            pricePoint.y + priceOut.y * (mobile ? 10 : 13),
            priceAxis,
            priceOut,
          );
          drawCursorLabel(
            formatAxisValue(value),
            valuePoint.x + valueSide * (mobile ? 8 : 11),
            valuePoint.y,
            null,
            null,
            valueSide < 0 ? "right" : "left",
          );
          context.restore();
        }

        function priceRibbonPoint(
          layout,
          row,
          dateIndex,
          coordinate,
          lift = PRICE_TRAIL_LIFT,
        ) {
          const point = projectAtPrice(
            layout,
            dateIndex,
            coordinate,
            heightAtCoordinate(row, coordinate),
          );
          point.y -= lift;
          return point;
        }

        function tracePriceSurfaceSegment(
          target,
          layout,
          firstRow,
          secondRow,
          firstCoordinate,
          secondCoordinate,
          dateIndex,
          lift,
        ) {
          if (firstCoordinate === null || secondCoordinate === null) {
            return false;
          }
          const firstPoint = priceRibbonPoint(
            layout,
            firstRow,
            dateIndex,
            firstCoordinate,
            lift,
          );
          const secondPoint = priceRibbonPoint(
            layout,
            secondRow,
            dateIndex + 1,
            secondCoordinate,
            lift,
          );
          const distance = Math.hypot(
            secondPoint.x - firstPoint.x,
            secondPoint.y - firstPoint.y,
          );
          const steps = clamp(Math.ceil(distance / 3), 2, 10);

          target.beginPath();
          for (let step = 0; step <= steps; step++) {
            const amount = step / steps;
            const coordinate =
              firstCoordinate +
              (secondCoordinate - firstCoordinate) * amount;
            const firstHeight = heightAtCoordinate(
              firstRow,
              coordinate,
            );
            const secondHeight = heightAtCoordinate(
              secondRow,
              coordinate,
            );
            const height =
              firstHeight + (secondHeight - firstHeight) * amount;
            const point = projectAtPrice(
              layout,
              dateIndex + amount,
              coordinate,
              height,
            );
            point.y -= lift;
            if (step === 0) target.moveTo(point.x, point.y);
            else target.lineTo(point.x, point.y);
          }
          return true;
        }

        function drawPriceTrailSegment(
          target,
          layout,
          first,
          second,
          firstPrice,
          secondPrice,
          dateIndex,
        ) {
          target.save();
          target.lineCap = "round";
          target.lineJoin = "round";

          target.globalAlpha = 0.1;
          target.strokeStyle = "#ff3b30";
          target.lineWidth = state.width <= 560 ? 0.7 : 0.85;
          if (
            tracePriceSurfaceSegment(
              target,
              layout,
              first,
              second,
              firstPrice,
              secondPrice,
              dateIndex,
              0,
            )
          ) {
            target.stroke();
          }

          target.globalAlpha = 0.32;
          target.strokeStyle = "#240b09";
          target.lineWidth = state.width <= 560 ? 1.8 : 2.3;
          const hasRaisedTrail = tracePriceSurfaceSegment(
            target,
            layout,
            first,
            second,
            firstPrice,
            secondPrice,
            dateIndex,
            PRICE_TRAIL_LIFT,
          );
          if (hasRaisedTrail) target.stroke();

          target.globalAlpha = 0.62;
          target.strokeStyle = "#ff3b30";
          target.lineWidth = state.width <= 560 ? 0.9 : 1.15;
          target.shadowColor = "rgba(255, 59, 48, 0.12)";
          target.shadowBlur = 1;
          if (hasRaisedTrail) target.stroke();
          target.restore();
        }

        function traceProfilePath(
          target,
          layout,
          row,
          offsetX,
          offsetY,
        ) {
          if (state.shape === "flats") {
            for (let binIndex = 0; binIndex < row.length; binIndex++) {
              const leftX = layout.priceEdgeX[binIndex] + offsetX;
              const rightX =
                layout.priceEdgeX[binIndex + 1] + offsetX;
              const leftY =
                layout.priceEdgeYBase[binIndex] +
                offsetY -
                row[binIndex] * layout.heightScale;
              const rightY =
                layout.priceEdgeYBase[binIndex + 1] +
                offsetY -
                row[binIndex] * layout.heightScale;
              if (binIndex === 0) target.moveTo(leftX, leftY);
              else target.lineTo(leftX, leftY);
              target.lineTo(rightX, rightY);
            }
            return;
          }

          for (let priceIndex = 0; priceIndex < row.length; priceIndex++) {
            const x = layout.priceX[priceIndex] + offsetX;
            const y =
              layout.priceYBase[priceIndex] +
              offsetY -
              row[priceIndex] * layout.heightScale;
            if (priceIndex === 0) target.moveTo(x, y);
            else target.lineTo(x, y);
          }
        }

        function drawMeshStrip(
          target,
          layout,
          first,
          second,
          dateIndex,
          start,
          overlapDates,
          timeStep,
        ) {
          const priceStep = Math.max(
            1,
            Math.round(state.binCount / (state.width <= 560 ? 16 : 34)),
          );
          const dateStep = Math.max(1, Math.round(9 / timeStep));
          const priceGridStep = Math.max(
            1,
            Math.ceil(0.9 / Math.max(timeStep, 0.01)),
          );
          const drawPriceGrid =
            (dateIndex - start) % priceGridStep === 0;
          const drawDateGrid =
            (dateIndex - start) % dateStep === 0;
          if (!drawPriceGrid && !drawDateGrid) return;

          const farOffset = dateIndex - state.viewIndex;
          const nearOffset =
            dateIndex + 1 + overlapDates - state.viewIndex;
          const farX = farOffset * layout.timeXStep;
          const farY = farOffset * layout.timeYStep;
          const nearX = nearOffset * layout.timeXStep;
          const nearY = nearOffset * layout.timeYStep;

          target.save();
          target.strokeStyle = "#e1dfc8";
          target.lineWidth = 0.45;

          if (drawPriceGrid) {
            target.globalAlpha = 0.11;
            target.beginPath();
            if (state.shape === "flats") {
              for (
                let edgeIndex = priceStep;
                edgeIndex < state.binCount;
                edgeIndex += priceStep
              ) {
                const binIndex = edgeIndex;
                target.moveTo(
                  layout.priceEdgeX[edgeIndex] + farX,
                  layout.priceEdgeYBase[edgeIndex] +
                    farY -
                    first[binIndex] * layout.heightScale,
                );
                target.lineTo(
                  layout.priceEdgeX[edgeIndex] + nearX,
                  layout.priceEdgeYBase[edgeIndex] +
                    nearY -
                    second[binIndex] * layout.heightScale,
                );
              }
            } else {
              for (
                let priceIndex = priceStep;
                priceIndex < state.binCount - 1;
                priceIndex += priceStep
              ) {
                target.moveTo(
                  layout.priceX[priceIndex] + farX,
                  layout.priceYBase[priceIndex] +
                    farY -
                    first[priceIndex] * layout.heightScale,
                );
                target.lineTo(
                  layout.priceX[priceIndex] + nearX,
                  layout.priceYBase[priceIndex] +
                    nearY -
                    second[priceIndex] * layout.heightScale,
                );
              }
            }
            target.stroke();
          }

          if (drawDateGrid) {
            target.globalAlpha = 0.13;
            target.beginPath();
            traceProfilePath(target, layout, first, farX, farY);
            target.stroke();
          }

          target.restore();
        }

        function heightSign(first, second = 0) {
          const height = first || second;
          return height < 0 ? -1 : 1;
        }

        function clipFaceAtZero(vertices, sign) {
          const clipped = [];
          const inside = (vertex) =>
            sign < 0 ? vertex.height <= 0 : vertex.height >= 0;
          for (let index = 0; index < vertices.length; index++) {
            const current = vertices[index];
            const previous =
              vertices[(index + vertices.length - 1) % vertices.length];
            const currentInside = inside(current);
            const previousInside = inside(previous);
            if (currentInside !== previousInside) {
              const amount =
                previous.height /
                (previous.height - current.height);
              clipped.push({
                x:
                  previous.x +
                  (current.x - previous.x) * amount,
                y:
                  previous.y +
                  (current.y - previous.y) * amount,
                height: 0,
              });
            }
            if (currentInside) clipped.push(current);
          }
          return clipped;
        }

        function appendPolygon(path, vertices) {
          if (vertices.length < 3) return;
          path.moveTo(vertices[0].x, vertices[0].y);
          for (let index = 1; index < vertices.length; index++) {
            path.lineTo(vertices[index].x, vertices[index].y);
          }
          path.closePath();
        }

        function drawSideWallSegment(
          target,
          layout,
          first,
          second,
          dateIndex,
          edgeIndex,
          binIndex,
          overlapDates,
          localPeak,
          topShade,
        ) {
          const firstHeight = first[binIndex];
          const secondHeight = second[binIndex];
          if (
            Math.abs(firstHeight) <= 0.0001 &&
            Math.abs(secondHeight) <= 0.0001
          ) {
            return;
          }

          const firstOffset = dateIndex - state.viewIndex;
          const secondOffset =
            dateIndex + 1 + overlapDates - state.viewIndex;
          const firstPriceX = layout.priceEdgeX[edgeIndex];
          const firstPriceY = layout.priceEdgeYBase[edgeIndex];
          const firstX =
            firstPriceX + firstOffset * layout.timeXStep;
          const firstBottomY =
            firstPriceY + firstOffset * layout.timeYStep;
          const secondX =
            firstPriceX + secondOffset * layout.timeXStep;
          const secondBottomY =
            firstPriceY + secondOffset * layout.timeYStep;
          const face = [
            {
              x: firstX,
              y:
                firstBottomY -
                firstHeight * layout.heightScale,
              height: firstHeight,
            },
            {
              x: secondX,
              y:
                secondBottomY -
                secondHeight * layout.heightScale,
              height: secondHeight,
            },
            {
              x: secondX,
              y: secondBottomY,
              height: 0,
            },
            {
              x: firstX,
              y: firstBottomY,
              height: 0,
            },
          ];
          for (const sign of [1, -1]) {
            if (state.mode === "value" && sign < 0) continue;
            const clipped =
              state.mode === "value"
                ? face
                : clipFaceAtZero(face, sign);
            if (clipped.length < 3) continue;
            const firstMagnitude =
              sign > 0
                ? Math.max(firstHeight, 0)
                : Math.max(-firstHeight, 0);
            const secondMagnitude =
              sign > 0
                ? Math.max(secondHeight, 0)
                : Math.max(-secondHeight, 0);
            const colorHeight = surfaceColorHeight(
              firstMagnitude > 0.0001
                ? firstMagnitude
                : secondMagnitude,
              localPeak,
            );
            const path = new Path2D();
            appendPolygon(path, clipped);
            target.fillStyle = faceGradient(
              target,
              colorHeight,
              topShade,
              (firstBottomY +
                secondBottomY -
                (firstHeight + secondHeight) *
                  layout.heightScale) *
                0.5,
              (firstBottomY + secondBottomY) * 0.5,
              sign,
            );
            target.fill(path);
          }
        }

        function drawDateWall(
          target,
          layout,
          dateIndex,
          row,
          shade,
        ) {
          const flat = state.shape === "flats";
          let localPeak = 0;
          for (const height of row) {
            localPeak = Math.max(localPeak, Math.abs(height));
          }
          const dateOffset = dateIndex - state.viewIndex;
          const offsetX = dateOffset * layout.timeXStep;
          const offsetY = dateOffset * layout.timeYStep;

          for (
            let binIndex = row.length - 1;
            binIndex >= 0;
            binIndex--
          ) {
            const height = row[binIndex];
            if (Math.abs(height) <= 0.0001) continue;
            const sign = heightSign(height);
            const leftHeight =
              flat || binIndex === 0
                ? height
                : (row[binIndex - 1] + height) * 0.5;
            const rightHeight =
              flat || binIndex === row.length - 1
                ? height
                : (height + row[binIndex + 1]) * 0.5;

            const leftX = layout.priceEdgeX[binIndex] + offsetX;
            const leftBottomY =
              layout.priceEdgeYBase[binIndex] + offsetY;
            const centerX = layout.priceX[binIndex] + offsetX;
            const centerBottomY =
              layout.priceYBase[binIndex] + offsetY;
            const rightX = layout.priceEdgeX[binIndex + 1] + offsetX;
            const rightBottomY =
              layout.priceEdgeYBase[binIndex + 1] + offsetY;

            target.beginPath();
            target.moveTo(
              leftX,
              leftBottomY - leftHeight * layout.heightScale,
            );
            target.lineTo(
              centerX,
              centerBottomY - height * layout.heightScale,
            );
            target.lineTo(
              rightX,
              rightBottomY - rightHeight * layout.heightScale,
            );
            target.lineTo(rightX, rightBottomY);
            target.lineTo(leftX, leftBottomY);
            target.closePath();
            const colorHeight = surfaceColorHeight(
              Math.abs(height),
              localPeak,
            );
            target.fillStyle = faceGradient(
              target,
              colorHeight,
              shade,
              (leftBottomY +
                centerBottomY +
                rightBottomY -
                (leftHeight + height + rightHeight) *
                  layout.heightScale) /
                3,
              (leftBottomY + rightBottomY) * 0.5,
              sign,
            );
            target.fill();
          }
        }

        function drawWaterCaps(
          target,
          layout,
          first,
          second,
          dateIndex,
          overlapDates,
        ) {
          if (state.mode === "value") return;
          const firstOffset = dateIndex - state.viewIndex;
          const secondOffset =
            dateIndex + 1 + overlapDates - state.viewIndex;
          const firstOffsetX =
            firstOffset * layout.timeXStep;
          const firstOffsetY =
            firstOffset * layout.timeYStep;
          const secondOffsetX =
            secondOffset * layout.timeXStep;
          const secondOffsetY =
            secondOffset * layout.timeYStep;
          const path = new Path2D();

          for (
            let binIndex = 0;
            binIndex < state.binCount;
            binIndex++
          ) {
            const firstHeight = first[binIndex];
            const secondHeight = second[binIndex];
            if (firstHeight >= 0 && secondHeight >= 0) continue;

            let startAmount = 0;
            let endAmount = 1;
            if (firstHeight * secondHeight < 0) {
              const crossing =
                firstHeight / (firstHeight - secondHeight);
              if (firstHeight < 0) endAmount = crossing;
              else startAmount = crossing;
            }

            const leftX = layout.priceEdgeX[binIndex];
            const leftY = layout.priceEdgeYBase[binIndex];
            const rightX = layout.priceEdgeX[binIndex + 1];
            const rightY =
              layout.priceEdgeYBase[binIndex + 1];
            const startXOffset = lerp(
              firstOffsetX,
              secondOffsetX,
              startAmount,
            );
            const startYOffset = lerp(
              firstOffsetY,
              secondOffsetY,
              startAmount,
            );
            const endXOffset = lerp(
              firstOffsetX,
              secondOffsetX,
              endAmount,
            );
            const endYOffset = lerp(
              firstOffsetY,
              secondOffsetY,
              endAmount,
            );

            path.moveTo(
              leftX + startXOffset,
              leftY + startYOffset,
            );
            path.lineTo(
              rightX + startXOffset,
              rightY + startYOffset,
            );
            path.lineTo(
              rightX + endXOffset,
              rightY + endYOffset,
            );
            path.lineTo(
              leftX + endXOffset,
              leftY + endYOffset,
            );
            path.closePath();
          }

          target.save();
          target.fillStyle = WATER_CAP_COLOR;
          target.fill(path);
          target.restore();
        }

        function drawSurface(
          target,
          layout,
          rows,
          profiles,
          start,
          end,
        ) {
          target.save();
          target.globalAlpha = 1;
          target.globalCompositeOperation = "source-over";
          const {
            start: sceneStart,
            end: sceneEnd,
          } = visibleRange();
          const timeStep = Math.hypot(
            layout.depthX / layout.timeSpan,
            layout.depthY / layout.timeSpan,
          );
          const overlapDates = clamp(
            0.72 / Math.max(timeStep, 0.01),
            0.6,
            2.4,
          );
          for (let dateIndex = start; dateIndex < end; dateIndex++) {
            const first = rows[dateIndex];
            const second = rows[dateIndex + 1];
            if (!first || !second) continue;
            const firstProfile = profiles[dateIndex];
            const secondProfile = profiles[dateIndex + 1];
            const firstPrice = priceCoordinate(
              firstProfile?.close,
            );
            const secondPrice = priceCoordinate(
              secondProfile?.close,
            );
            const flat = state.shape === "flats";
            const nearEdgeIndex = 0;
            const nearBinIndex = 0;
            const farEdgeIndex = state.binCount;
            const farBinIndex = state.binCount - 1;
            const localPeak = Math.max(
              firstProfile?.sampledPeak ?? 0,
              secondProfile?.sampledPeak ?? 0,
            );
            const firstOffset = dateIndex - state.viewIndex;
            const secondOffset =
              dateIndex + 1 + overlapDates - state.viewIndex;
            const firstOffsetX =
              firstOffset * layout.timeXStep;
            const firstOffsetY =
              firstOffset * layout.timeYStep;
            const secondOffsetX =
              secondOffset * layout.timeXStep;
            const secondOffsetY =
              secondOffset * layout.timeYStep;
            drawSideWallSegment(
              target,
              layout,
              first,
              second,
              dateIndex,
              farEdgeIndex,
              farBinIndex,
              overlapDates,
              localPeak,
              surfaceShade(
                first[farBinIndex],
                second[farBinIndex],
                dateIndex,
                sceneStart,
                sceneEnd,
              ),
            );
            const surfacePathKey = [
              state.metric,
              state.mode,
              state.shape,
              state.projectionCache?.key,
              sceneStart,
              sceneEnd,
              secondProfile?.date,
            ].join(":");
            let surfacePaths =
              firstProfile?.surfacePathCache?.key === surfacePathKey
                ? firstProfile.surfacePathCache.paths
                : null;
            if (!surfacePaths) {
              const pathsByFill = new Map();
              for (
                let binIndex = state.binCount - 1;
                binIndex >= 0;
                binIndex--
              ) {
                const firstHeight = first[binIndex];
                const secondHeight = second[binIndex];
                const firstLeftHeight =
                  flat || binIndex === 0
                    ? firstHeight
                    : (first[binIndex - 1] + firstHeight) * 0.5;
                const firstRightHeight =
                  flat || binIndex === state.binCount - 1
                    ? firstHeight
                    : (firstHeight + first[binIndex + 1]) * 0.5;
                const secondLeftHeight =
                  flat || binIndex === 0
                    ? secondHeight
                    : (second[binIndex - 1] + secondHeight) * 0.5;
                const secondRightHeight =
                  flat || binIndex === state.binCount - 1
                    ? secondHeight
                    : (secondHeight + second[binIndex + 1]) * 0.5;
                const firstLeftX =
                  layout.priceEdgeX[binIndex] + firstOffsetX;
                const firstCenterX =
                  layout.priceX[binIndex] + firstOffsetX;
                const firstRightX =
                  layout.priceEdgeX[binIndex + 1] + firstOffsetX;
                const secondRightX =
                  layout.priceEdgeX[binIndex + 1] + secondOffsetX;
                const secondCenterX =
                  layout.priceX[binIndex] + secondOffsetX;
                const secondLeftX =
                  layout.priceEdgeX[binIndex] + secondOffsetX;
                const firstLeftY =
                  layout.priceEdgeYBase[binIndex] +
                  firstOffsetY -
                  firstLeftHeight * layout.heightScale;
                const firstCenterY =
                  layout.priceYBase[binIndex] +
                  firstOffsetY -
                  firstHeight * layout.heightScale;
                const firstRightY =
                  layout.priceEdgeYBase[binIndex + 1] +
                  firstOffsetY -
                  firstRightHeight * layout.heightScale;
                const secondRightY =
                  layout.priceEdgeYBase[binIndex + 1] +
                  secondOffsetY -
                  secondRightHeight * layout.heightScale;
                const secondCenterY =
                  layout.priceYBase[binIndex] +
                  secondOffsetY -
                  secondHeight * layout.heightScale;
                const secondLeftY =
                  layout.priceEdgeYBase[binIndex] +
                  secondOffsetY -
                  secondLeftHeight * layout.heightScale;
                const appendSurfaceSegment = (
                  startAmount,
                  endAmount,
                  sign,
                ) => {
                  const startHeight = lerp(
                    firstHeight,
                    secondHeight,
                    startAmount,
                  );
                  const endHeight = lerp(
                    firstHeight,
                    secondHeight,
                    endAmount,
                  );
                  const colorHeight = surfaceColorHeight(
                    (Math.abs(startHeight) + Math.abs(endHeight)) *
                      0.5,
                    localPeak,
                  );
                  const shade = surfaceShade(
                    startHeight,
                    endHeight,
                    dateIndex,
                    sceneStart,
                    sceneEnd,
                  );
                  const fill = elevationColor(
                    colorHeight,
                    shade,
                    sign,
                  );
                  const pathKey = fill;
                  let entry = pathsByFill.get(pathKey);
                  if (!entry) {
                    entry = {
                      fill,
                      path: new Path2D(),
                    };
                    pathsByFill.set(pathKey, entry);
                  }
                  const path = entry.path;

                  path.moveTo(
                    lerp(
                      firstLeftX,
                      secondLeftX,
                      startAmount,
                    ),
                    lerp(
                      firstLeftY,
                      secondLeftY,
                      startAmount,
                    ),
                  );
                  path.lineTo(
                    lerp(
                      firstCenterX,
                      secondCenterX,
                      startAmount,
                    ),
                    lerp(
                      firstCenterY,
                      secondCenterY,
                      startAmount,
                    ),
                  );
                  path.lineTo(
                    lerp(
                      firstRightX,
                      secondRightX,
                      startAmount,
                    ),
                    lerp(
                      firstRightY,
                      secondRightY,
                      startAmount,
                    ),
                  );
                  path.lineTo(
                    lerp(
                      firstRightX,
                      secondRightX,
                      endAmount,
                    ),
                    lerp(
                      firstRightY,
                      secondRightY,
                      endAmount,
                    ),
                  );
                  path.lineTo(
                    lerp(
                      firstCenterX,
                      secondCenterX,
                      endAmount,
                    ),
                    lerp(
                      firstCenterY,
                      secondCenterY,
                      endAmount,
                    ),
                  );
                  path.lineTo(
                    lerp(
                      firstLeftX,
                      secondLeftX,
                      endAmount,
                    ),
                    lerp(
                      firstLeftY,
                      secondLeftY,
                      endAmount,
                    ),
                  );
                  path.closePath();
                };

                if (
                  state.mode !== "value" &&
                  firstHeight * secondHeight < 0
                ) {
                  const crossing =
                    firstHeight / (firstHeight - secondHeight);
                  appendSurfaceSegment(
                    0,
                    crossing,
                    firstHeight < 0 ? -1 : 1,
                  );
                  appendSurfaceSegment(
                    crossing,
                    1,
                    secondHeight < 0 ? -1 : 1,
                  );
                } else {
                  appendSurfaceSegment(
                    0,
                    1,
                    heightSign(firstHeight, secondHeight),
                  );
                }
              }
              if (flat) {
                for (
                  let edgeIndex = 1;
                  edgeIndex < state.binCount;
                  edgeIndex++
                ) {
                  const leftBin = edgeIndex - 1;
                  const rightBin = edgeIndex;
                  const nearBin = leftBin;
                  const farBin = rightBin;
                  const firstNearHeight = first[nearBin];
                  const firstFarHeight = first[farBin];
                  const secondNearHeight = second[nearBin];
                  const secondFarHeight = second[farBin];
                  const visibleHeight = Math.max(
                    Math.abs(firstFarHeight - firstNearHeight),
                    Math.abs(secondFarHeight - secondNearHeight),
                  );
                  if (visibleHeight <= 0.0001) continue;

                  const sideShade =
                    surfaceShade(
                      firstFarHeight,
                      secondFarHeight,
                      dateIndex,
                      sceneStart,
                      sceneEnd,
                    ) * 0.82;
                  const firstX =
                    layout.priceEdgeX[edgeIndex] + firstOffsetX;
                  const firstBaseY =
                    layout.priceEdgeYBase[edgeIndex] + firstOffsetY;
                  const secondX =
                    layout.priceEdgeX[edgeIndex] + secondOffsetX;
                  const secondBaseY =
                    layout.priceEdgeYBase[edgeIndex] + secondOffsetY;
                  const face = [
                    {
                      x: firstX,
                      y:
                        firstBaseY -
                        firstFarHeight * layout.heightScale,
                      height: firstFarHeight,
                    },
                    {
                      x: secondX,
                      y:
                        secondBaseY -
                        secondFarHeight * layout.heightScale,
                      height: secondFarHeight,
                    },
                    {
                      x: secondX,
                      y:
                        secondBaseY -
                        secondNearHeight * layout.heightScale,
                      height: secondNearHeight,
                    },
                    {
                      x: firstX,
                      y:
                        firstBaseY -
                        firstNearHeight * layout.heightScale,
                      height: firstNearHeight,
                    },
                  ];

                  for (const sign of [1, -1]) {
                    const clipped =
                      state.mode === "value"
                        ? sign > 0
                          ? face
                          : []
                        : clipFaceAtZero(face, sign);
                    if (clipped.length < 3) continue;
                    const firstMagnitude =
                      sign > 0
                        ? Math.max(
                            firstFarHeight,
                            firstNearHeight,
                            0,
                          )
                        : Math.max(
                            -firstFarHeight,
                            -firstNearHeight,
                            0,
                          );
                    const secondMagnitude =
                      sign > 0
                        ? Math.max(
                            secondFarHeight,
                            secondNearHeight,
                            0,
                          )
                        : Math.max(
                            -secondFarHeight,
                            -secondNearHeight,
                            0,
                          );
                    const colorHeight = surfaceColorHeight(
                      firstMagnitude > 0.0001
                        ? firstMagnitude
                        : secondMagnitude,
                      localPeak,
                    );
                    const fill = elevationColor(
                      colorHeight,
                      sideShade,
                      sign,
                    );
                    const pathKey = fill;
                    let entry = pathsByFill.get(pathKey);
                    if (!entry) {
                      entry = {
                        fill,
                        path: new Path2D(),
                      };
                      pathsByFill.set(pathKey, entry);
                    }
                    appendPolygon(entry.path, clipped);
                  }
                }
              }
              surfacePaths = Array.from(pathsByFill.values());
              if (firstProfile) {
                firstProfile.surfacePathCache = {
                  key: surfacePathKey,
                  paths: surfacePaths,
                };
              }
            }
            for (const { fill, path } of surfacePaths) {
              target.fillStyle = fill;
              target.fill(path);
            }

            drawWaterCaps(
              target,
              layout,
              first,
              second,
              dateIndex,
              overlapDates,
            );
            drawSideWallSegment(
              target,
              layout,
              first,
              second,
              dateIndex,
              nearEdgeIndex,
              nearBinIndex,
              overlapDates,
              localPeak,
              surfaceShade(
                first[nearBinIndex],
                second[nearBinIndex],
                dateIndex,
                sceneStart,
                sceneEnd,
              ),
            );
            drawMeshStrip(
              target,
              layout,
              first,
              second,
              dateIndex,
              sceneStart,
              overlapDates,
              timeStep,
            );
            drawPriceTrailSegment(
              target,
              layout,
              first,
              second,
              firstPrice,
              secondPrice,
              dateIndex,
            );
          }
          target.restore();
        }

        function terrainChunkKey() {
          const { start, end } = visibleRange();
          return [
            state.metric,
            state.mode,
            state.shape,
            state.projectionCache?.key,
            start,
            end,
          ].join(":");
        }

        function terrainChunkBounds(layout, start, end) {
          let minX = Infinity;
          let minY = Infinity;
          let maxX = -Infinity;
          let maxY = -Infinity;
          for (const dateIndex of [start - 1, end + 3]) {
            for (const price of [0, 1]) {
              for (const height of [-1.14, 0, 1.14]) {
                const point = projectAtPrice(
                  layout,
                  dateIndex,
                  price,
                  height,
                );
                minX = Math.min(minX, point.x);
                minY = Math.min(minY, point.y);
                maxX = Math.max(maxX, point.x);
                maxY = Math.max(maxY, point.y);
              }
            }
          }
          const padding = 8;
          const scale = state.dpr;
          const leftPixels = Math.max(
            0,
            Math.floor(
              (minX - padding) * scale,
            ),
          );
          const topPixels = Math.max(
            0,
            Math.floor(
              (minY - padding) * scale,
            ),
          );
          const rightPixels = Math.min(
            Math.round(state.width * scale),
            Math.ceil(
              (maxX + padding) * scale,
            ),
          );
          const bottomPixels = Math.min(
            Math.round(state.height * scale),
            Math.ceil(
              (maxY + padding) * scale,
            ),
          );
          return {
            x: leftPixels / scale,
            y: topPixels / scale,
            width: Math.max(0, rightPixels - leftPixels) / scale,
            height: Math.max(0, bottomPixels - topPixels) / scale,
          };
        }

        function buildTerrainChunk(start, end, key) {
          if (start >= end || key !== terrainChunkKey()) return null;
          const layout = geometry();
          prepareProjection(layout);
          const rows = new Array(end + 1);
          const profiles = new Array(end + 1);
          for (let index = start; index <= end; index++) {
            const profile = getProfile(index);
            const comparisonProfile = getComparisonProfile(index);
            if (
              !profile ||
              (state.mode !== "value" &&
                comparisonIndex(index) >= 0 &&
                !comparisonProfile)
            ) {
              return null;
            }
            profiles[index] = profile;
            rows[index] = sampleProfile(
              profile,
              comparisonProfile,
            );
          }

          const bounds = terrainChunkBounds(layout, start, end);
          if (!bounds.width || !bounds.height) return null;
          const scale = state.dpr;
          const chunkCanvas = document.createElement("canvas");
          chunkCanvas.width = Math.round(bounds.width * scale);
          chunkCanvas.height = Math.round(bounds.height * scale);
          const chunkContext = chunkCanvas.getContext("2d");
          chunkContext.setTransform(
            scale,
            0,
            0,
            scale,
            -bounds.x * scale,
            -bounds.y * scale,
          );
          drawSurface(
            chunkContext,
            layout,
            rows,
            profiles,
            start,
            end,
          );
          return {
            key,
            start,
            end,
            canvas: chunkCanvas,
            x: bounds.x,
            y: bounds.y,
            width: chunkCanvas.width / scale,
            height: chunkCanvas.height / scale,
          };
        }

        function scheduleTerrainChunkBuild() {
          if (
            state.chunkBuildTimer ||
            !canHoverTerrain() ||
            !state.dates.length
          ) {
            return;
          }
          const generation = state.chunkGeneration;
          const layout = geometry();
          prepareProjection(layout);
          const key = terrainChunkKey();
          const { start, end } = visibleRange();
          const first =
            Math.ceil(start / TERRAIN_CHUNK_SIZE) *
            TERRAIN_CHUNK_SIZE;
          const queue = [];
          for (
            let chunkStart = first;
            chunkStart < end;
            chunkStart += TERRAIN_CHUNK_SIZE
          ) {
            const chunkEnd = Math.min(
              end,
              chunkStart + TERRAIN_CHUNK_SIZE,
            );
            const cached = state.terrainChunks.get(chunkStart);
            if (
              !cached ||
              cached.key !== key ||
              cached.end !== chunkEnd
            ) {
              queue.push([chunkStart, chunkEnd]);
            }
          }
          if (!queue.length) return;

          const buildNext = () => {
            state.chunkBuildTimer = 0;
            if (
              generation !== state.chunkGeneration ||
              key !== terrainChunkKey()
            ) {
              return;
            }
            if (
              state.hoverActive &&
              performance.now() - state.lastPointerAt < 120
            ) {
              state.chunkBuildTimer = window.setTimeout(
                buildNext,
                100,
              );
              return;
            }
            const range = queue.shift();
            if (!range) return;
            const chunk = buildTerrainChunk(
              range[0],
              range[1],
              key,
            );
            if (chunk) {
              state.terrainChunks.set(chunk.start, chunk);
            }
            if (queue.length) {
              state.chunkBuildTimer = window.setTimeout(buildNext, 0);
            }
          };
          state.chunkBuildTimer = window.setTimeout(buildNext, 0);
        }

        function drawSurfaceRange(
          target,
          layout,
          rows,
          profiles,
          start,
          end,
        ) {
          const key = terrainChunkKey();
          let cursor = start;
          while (cursor < end) {
            if (cursor % TERRAIN_CHUNK_SIZE === 0) {
              const chunk = state.terrainChunks.get(cursor);
              if (
                chunk &&
                chunk.key === key &&
                chunk.end <= end
              ) {
                target.save();
                target.imageSmoothingEnabled = false;
                target.drawImage(
                  chunk.canvas,
                  chunk.x,
                  chunk.y,
                  chunk.width,
                  chunk.height,
                );
                target.restore();
                cursor = chunk.end;
                continue;
              }
            }

            const nextBoundary =
              Math.floor(cursor / TERRAIN_CHUNK_SIZE + 1) *
              TERRAIN_CHUNK_SIZE;
            const directEnd = Math.min(end, nextBoundary);
            drawSurface(
              target,
              layout,
              rows,
              profiles,
              cursor,
              directEnd,
            );
            cursor = directEnd;
          }
        }

        function drawSelectionOutline(layout, dateIndex, row) {
          const leftBase = projectAtPrice(
            layout,
            dateIndex,
            0,
            0,
          );
          const rightBase = projectAtPrice(
            layout,
            dateIndex,
            1,
            0,
          );
          const dateOffset = dateIndex - state.viewIndex;
          const offsetX = dateOffset * layout.timeXStep;
          const offsetY = dateOffset * layout.timeYStep;

          context.save();
          context.lineCap = "round";
          context.lineJoin = "round";
          context.beginPath();
          traceProfilePath(
            context,
            layout,
            row,
            offsetX,
            offsetY,
          );
          context.lineTo(rightBase.x, rightBase.y);
          context.lineTo(leftBase.x, leftBase.y);
          context.closePath();

          context.globalAlpha = 0.72;
          context.strokeStyle = "#07100f";
          context.lineWidth = state.width <= 560 ? 2.2 : 2.8;
          context.stroke();

          context.globalAlpha = 0.82;
          context.strokeStyle = "#f4ecd9";
          context.lineWidth = state.width <= 560 ? 0.8 : 1.05;
          context.stroke();
          context.restore();
        }

        function drawPriceCap(
          target,
          layout,
          dateIndex,
          row,
          profile,
        ) {
          const coordinate = priceCoordinate(profile?.close);
          if (coordinate === null) return;
          const surface = priceRibbonPoint(
            layout,
            row,
            dateIndex,
            coordinate,
            0,
          );
          const point = priceRibbonPoint(
            layout,
            row,
            dateIndex,
            coordinate,
          );

          target.save();
          target.strokeStyle = "rgba(255, 59, 48, 0.52)";
          target.lineWidth = 1;
          target.lineCap = "round";
          target.beginPath();
          target.moveTo(surface.x, surface.y);
          target.lineTo(point.x, point.y);
          target.stroke();

          target.shadowColor = "rgba(255, 59, 48, 0.72)";
          target.shadowBlur = 10;
          target.fillStyle = "#ff3b30";
          target.beginPath();
          target.arc(
            point.x,
            point.y,
            state.width <= 560 ? 3.4 : 4.3,
            0,
            Math.PI * 2,
          );
          target.fill();

          target.shadowBlur = 0;
          target.strokeStyle = "#ffe8d7";
          target.lineWidth = 1.35;
          target.stroke();
          target.restore();
        }

        function drawFutureImage() {
          context.drawImage(
            futureCanvas,
            0,
            0,
            futureCanvas.width,
            futureCanvas.height,
            0,
            0,
            state.width,
            state.height,
          );
        }

        function drawSelectionHighlights(
          layout,
          dateIndex,
          row,
          profile,
        ) {
          if (row) {
            drawSelectionOutline(layout, dateIndex, row);
            drawPriceCap(
              context,
              layout,
              dateIndex,
              row,
              profile,
            );
            message.hidden = true;
          } else {
            message.hidden = false;
            message.textContent = state.error
              ? state.error
              : "Loading the selected terrain…";
          }
        }

        function render() {
          if (!state.width || !state.height) return;
          state.lastRenderAt = performance.now();
          const layout = geometry();
          prepareProjection(layout);
          drawBackground(layout);

          if (!state.dates.length) {
            state.hoverModel = null;
            updateStatus();
            return;
          }

          const { start, end } = visibleRange();
          drawGround(layout, start, end);

          const rows = new Array(end + 1);
          const profiles = new Array(end + 1);
          for (let dateIndex = start; dateIndex <= end; dateIndex++) {
            const profile = getProfile(dateIndex);
            const comparisonProfile =
              getComparisonProfile(dateIndex);
            if (
              profile &&
              (state.mode === "value" ||
                comparisonIndex(dateIndex) < 0 ||
                comparisonProfile)
            ) {
              profiles[dateIndex] = profile;
              rows[dateIndex] = sampleProfile(
                profile,
                comparisonProfile,
              );
            }
          }
          const back = rows[start];
          if (back) {
            drawDateWall(
              context,
              layout,
              start,
              back,
              0.7,
            );
          }
          state.hoverModel = createHoverModel(layout, start, end);

          const pastEnd = Math.min(state.selectedIndex, end);
          if (start < pastEnd) {
            drawSurfaceRange(
              context,
              layout,
              rows,
              profiles,
              start,
              pastEnd,
            );
          }

          const selectedProfile = profiles[state.selectedIndex];
          const selected = rows[state.selectedIndex];
          if (selected) {
            drawDateWall(
              context,
              layout,
              state.selectedIndex,
              selected,
              0.82,
            );
          }

          if (!state.hoverActive && end > state.selectedIndex) {
            futureContext.clearRect(
              0,
              0,
              state.width,
              state.height,
            );
            drawSurfaceRange(
              futureContext,
              layout,
              rows,
              profiles,
              state.selectedIndex,
              end,
            );
            context.save();
            context.globalAlpha = FUTURE_ALPHA;
            drawFutureImage();
            context.restore();
          }

          updateReadout();
          drawSelectionHighlights(
            layout,
            state.selectedIndex,
            selected,
            selectedProfile,
          );
          drawAxisLegend(layout);
          drawPlotAxes(layout, start, end);
          drawHoverCursor(
            layout,
            state.selectedIndex,
            selected,
            selectedProfile,
          );
          if (state.loading > 0 || state.error) updateStatus();
        }

        async function fetchProfileByDate(date, signal) {
          const key = profileKeyForDate(date);
          const cached = state.cache.get(key);
          if (cached) return cached;

          const query = new URLSearchParams({
            agg: state.aggregation,
            weight: state.weight,
          });
          const url = `${API}/urpd/${encodeURIComponent(
            state.cohort,
          )}/${date}?${query}`;
          const response = await fetch(url, {
            signal,
            cache:
              date === state.dates[state.dates.length - 1]
                ? "no-cache"
                : "force-cache",
          });
          if (!response.ok) {
            throw new Error(`URPD request failed (${response.status})`);
          }

          const data = await response.json();
          const buckets = Array.isArray(data.buckets) ? data.buckets : [];
          const prices = new Float32Array(buckets.length);
          const supplies = new Float32Array(buckets.length);
          const realizedCaps = new Float32Array(buckets.length);
          const unrealizedPnls = new Float32Array(buckets.length);
          let maxPrice = 0;
          let totalRealizedCap = 0;
          let totalAbsolutePnl = 0;
          for (let bucketIndex = 0; bucketIndex < buckets.length; bucketIndex++) {
            prices[bucketIndex] = Number(
              buckets[bucketIndex].price_floor ??
                buckets[bucketIndex].priceFloor ??
                0,
            );
            supplies[bucketIndex] = Number(buckets[bucketIndex].supply ?? 0);
            realizedCaps[bucketIndex] = Number(
              buckets[bucketIndex].realized_cap ??
                buckets[bucketIndex].realizedCap ??
                0,
            );
            unrealizedPnls[bucketIndex] = Number(
              buckets[bucketIndex].unrealized_pnl ??
                buckets[bucketIndex].unrealizedPnl ??
                0,
            );
            totalRealizedCap += Math.max(0, realizedCaps[bucketIndex]);
            totalAbsolutePnl += Math.abs(unrealizedPnls[bucketIndex]);
            if (
              bucketIndex > 0 &&
              supplies[bucketIndex] > 0 &&
              prices[bucketIndex] > maxPrice
            ) {
              maxPrice = prices[bucketIndex];
            }
          }

          const profile = {
            date,
            aggregation: data.aggregation ?? state.aggregation,
            close: Number(data.close ?? 0),
            totalSupply: Number(
              data.total_supply ?? data.totalSupply ?? 0,
            ),
            totalRealizedCap,
            totalAbsolutePnl,
            prices,
            supplies,
            realizedCaps,
            unrealizedPnls,
            maxPrice,
          };
          putProfile(key, profile);
          return profile;
        }

        function fetchProfile(index, signal) {
          return fetchProfileByDate(state.dates[index], signal);
        }

        async function loadVisibleWindow(generation, controller) {
          if (!state.dates.length || generation !== state.loadGeneration) return;
          const { start, end } = visibleRange();
          const selected = state.viewIndex;
          const requests = [];
          const requestedDates = new Set();
          const addRequest = (date, index) => {
            const key = profileKeyForDate(date);
            if (state.cache.has(key) || requestedDates.has(date)) return;
            requestedDates.add(date);
            requests.push({
              date,
              index,
              distance: Math.abs(index - selected),
            });
          };
          const requestStart =
            state.mode === "value"
              ? start
              : Math.max(0, start - comparisonOffset());
          for (let index = requestStart; index <= end; index++) {
            addRequest(state.dates[index], index);
          }
          requests.sort(
            (first, second) =>
              first.distance - second.distance,
          );

          state.loading = requests.length;
          state.error = "";
          updateStatus();

          try {
            const selectedProfiles = [
              fetchProfile(selected, controller.signal),
            ];
            const selectedComparison = comparisonIndex(selected);
            if (
              state.mode !== "value" &&
              selectedComparison >= 0
            ) {
              selectedProfiles.push(
                fetchProfile(
                  selectedComparison,
                  controller.signal,
                ),
              );
            }
            const [selectedProfile] = await Promise.all(
              selectedProfiles,
            );
            if (generation !== state.loadGeneration) return;
            setPriceRange(selectedProfile);
            updateReadout();
            scheduleRender();

            let cursor = 0;
            const worker = async () => {
              while (
                cursor < requests.length &&
                generation === state.loadGeneration
              ) {
                const request = requests[cursor++];
                try {
                  await fetchProfileByDate(
                    request.date,
                    controller.signal,
                  );
                  if (generation === state.loadGeneration) {
                    state.loading = Math.max(0, state.loading - 1);
                    if (request.index === state.selectedIndex) {
                      updateReadout();
                    }
                    scheduleProgressRender();
                  }
                } catch (error) {
                  if (error.name !== "AbortError") throw error;
                }
              }
            };

            await Promise.all(
              Array.from(
                {
                  length: Math.min(
                    requestConcurrency(),
                    requests.length,
                  ),
                },
                worker,
              ),
            );
            if (generation === state.loadGeneration) {
              setPriceRange(selectedProfile);
              scheduleRender();
              scheduleTerrainChunkBuild();
            }
          } catch (error) {
            if (error.name !== "AbortError") {
              state.error = error.message || "Unable to load URPD data";
              message.hidden = false;
              message.textContent = state.error;
              scheduleRender();
            }
          } finally {
            if (generation === state.loadGeneration) {
              state.loading = 0;
              updateStatus();
            }
          }
        }

        function scheduleWindowLoad(delay = 90) {
          clearTimeout(state.loadTimer);
          state.loadTimer = window.setTimeout(() => {
            if (!state.dates.length || document.hidden) return;
            state.loadController?.abort();
            state.loadController = new AbortController();
            const generation = ++state.loadGeneration;
            loadVisibleWindow(generation, state.loadController);
          }, delay);
        }

        async function loadDates(cohort, preserveDate) {
          state.loadController?.abort();
          const controller = new AbortController();
          state.loadController = controller;
          const generation = ++state.loadGeneration;
          const weight = state.weight;
          state.error = "";
          clearHoverState();
          state.dates = [];
          state.dateLabels = [];
          state.profileKeys = [];
          state.hoverModel = null;
          invalidateTerrainChunks();
          message.hidden = false;
          message.textContent = "Loading available dates…";
          scheduleRender();

          try {
            const dateCacheKey = `${cohort}:${weight}`;
            let dates = state.dateCache.get(dateCacheKey);
            if (!dates) {
              const query = new URLSearchParams({
                weight,
              });
              const response = await fetch(
                `${API}/urpd/${encodeURIComponent(cohort)}/dates?${query}`,
                { signal: controller.signal },
              );
              if (!response.ok) {
                throw new Error(`Dates request failed (${response.status})`);
              }
              const availableDates = await response.json();
              if (generation !== state.loadGeneration) return;
              if (!Array.isArray(availableDates) || !availableDates.length) {
                throw new Error("No URPD dates are available for this cohort");
              }
              const rangeDates = availableDates.filter(
                (date) => date >= "2018-01-01",
              );
              if (!rangeDates.length) {
                throw new Error(
                  "No URPD dates are available from 2018 onward",
                );
              }
              dates = rangeDates.filter((_, index) => index % 7 === 0);
              const latestDate = rangeDates[rangeDates.length - 1];
              if (dates[dates.length - 1] !== latestDate) {
                dates.push(latestDate);
              }
              state.dateCache.set(dateCacheKey, dates);
            }
            if (generation !== state.loadGeneration) return;

            state.dates = dates;
            state.dateLabels = dates.map(formatDate);
            state.profileKeys = dates.map(
              (date) =>
                `${cohort}:${weight}:${state.aggregation}:${date}`,
            );
            const preservedIndex = preserveDate
              ? dates.indexOf(preserveDate)
              : -1;
            state.selectedIndex =
              preservedIndex >= 0 ? preservedIndex : dates.length - 1;
            state.viewIndex = state.selectedIndex;
            updateReadout();
            scheduleRender();
            scheduleWindowLoad(0);
          } catch (error) {
            if (
              error.name === "AbortError" ||
              generation !== state.loadGeneration
            ) {
              return;
            }
            state.error = error.message || "Unable to load available dates";
            message.textContent = state.error;
            statusOutput.textContent = state.error;
          }
        }

        function createHoverModel(layout, start, end) {
          const corners = [
            projectAtPrice(layout, start, 0, 0),
            projectAtPrice(layout, start, 1, 0),
            projectAtPrice(layout, end, 0, 0),
            projectAtPrice(layout, end, 1, 0),
          ];
          const minX = Math.min(
            corners[0].x,
            corners[1].x,
            corners[2].x,
            corners[3].x,
          );
          const maxX = Math.max(
            corners[0].x,
            corners[1].x,
            corners[2].x,
            corners[3].x,
          );
          const minY =
            Math.min(
              corners[0].y,
              corners[1].y,
              corners[2].y,
              corners[3].y,
            ) - layout.heightScale;
          const maxY = Math.max(
            corners[0].y,
            corners[1].y,
            corners[2].y,
            corners[3].y,
          ) + (state.mode === "value" ? 0 : layout.heightScale);
          return {
            layout,
            start,
            end,
            minX,
            maxX,
            minY,
            maxY,
            determinant:
              layout.width * layout.depthY -
              layout.priceY * layout.timeX,
          };
        }

        function dateAtPointer(x, y) {
          const model = state.hoverModel;
          if (!model || !canHoverTerrain()) return null;
          const {
            layout,
            start,
            end,
            minX,
            maxX,
            minY,
            maxY,
            determinant,
          } = model;
          if (
            x < minX - 16 ||
            x > maxX + 16 ||
            y < minY - 12 ||
            y > maxY + 24
          ) {
            return null;
          }

          const priceX = layout.width;
          const priceY = layout.priceY;
          const relativeTime =
            determinant === 0
              ? 0
              : (priceX * (y - layout.baseY) -
                  priceY * (x - layout.left)) /
                determinant;
          return clamp(
            Math.round(
              state.viewIndex + relativeTime * layout.timeSpan,
            ),
            start,
            end,
          );
        }

        function selectionAtPointer(x, y) {
          const index = dateAtPointer(x, y);
          if (index === null) return null;
          const layout = state.hoverModel.layout;
          const dateOffset = index - state.viewIndex;
          const rawCoordinate =
            (x -
              layout.left -
              dateOffset * layout.timeXStep) /
            layout.width;
          const priceIndex = nearestPriceIndex(
            clamp(rawCoordinate, 0, 1),
          );
          return {
            index,
            coordinate: state.priceCoordinates[priceIndex],
          };
        }

        function clearHoverState() {
          const changed =
            state.hoverActive ||
            state.hoverPriceCoordinate !== null ||
            state.selectedIndex !== state.viewIndex;
          state.hoverActive = false;
          state.hoverPriceCoordinate = null;
          state.selectedIndex = state.viewIndex;
          return changed;
        }

        function resetHover() {
          if (clearHoverState()) scheduleHoverRender();
        }

        canvas.addEventListener(
          "pointermove",
          (event) => {
            state.lastPointerAt = performance.now();
            const selection = selectionAtPointer(
              event.offsetX,
              event.offsetY,
            );
            if (selection === null) {
              resetHover();
              return;
            }
            if (
              state.hoverActive &&
              selection.index === state.selectedIndex &&
              state.hoverPriceCoordinate !== null &&
              Math.abs(
                selection.coordinate -
                  state.hoverPriceCoordinate,
              ) < 0.0005
            ) {
              return;
            }
            state.hoverActive = true;
            state.hoverPriceCoordinate = selection.coordinate;
            state.selectedIndex = selection.index;
            scheduleHoverRender();
          },
          { passive: true },
        );

        canvas.addEventListener("pointerleave", resetHover, {
          passive: true,
        });
        hoverQuery.addEventListener("change", resetHover);

        cohortSelect.addEventListener("change", () => {
          const preserveDate = state.dates[state.viewIndex];
          clearHoverState();
          state.cohort = cohortSelect.value;
          persistSettings();
          loadDates(state.cohort, preserveDate);
        });

        metricSelect.addEventListener("change", () => {
          clearHoverState();
          state.metric = metricSelect.value;
          invalidateTerrainChunks();
          updateReadout();
          persistSettings();
          scheduleRender();
          scheduleTerrainChunkBuild();
        });

        modeSelect.addEventListener("change", () => {
          clearHoverState();
          state.mode = modeSelect.value;
          invalidateTerrainChunks();
          updateReadout();
          persistSettings();
          scheduleRender();
          const { start, end } = visibleRange();
          const requiredStart =
            state.mode === "value"
              ? start
              : Math.max(0, start - comparisonOffset());
          let missingProfile = false;
          for (
            let index = requiredStart;
            index <= end;
            index++
          ) {
            if (!getProfile(index)) {
              missingProfile = true;
              break;
            }
          }
          if (missingProfile) {
            scheduleWindowLoad(0);
          } else {
            scheduleTerrainChunkBuild();
          }
        });

        shapeSelect.addEventListener("change", () => {
          clearHoverState();
          state.shape = shapeSelect.value;
          invalidateTerrainChunks();
          persistSettings();
          scheduleRender();
          scheduleTerrainChunkBuild();
        });

        weightSelect.addEventListener("change", () => {
          const preserveDate = state.dates[state.viewIndex];
          clearHoverState();
          state.weight = weightSelect.value;
          persistSettings();
          loadDates(state.cohort, preserveDate);
        });

        angleSelect.addEventListener("change", () => {
          clearHoverState();
          state.angle = Number(angleSelect.value);
          invalidateTerrainChunks();
          updateReadout();
          persistSettings();
          scheduleRender();
          scheduleTerrainChunkBuild();
        });

        const resizeObserver = new ResizeObserver(resize);
        resizeObserver.observe(canvas);
        window.addEventListener("orientationchange", resize, {
          passive: true,
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            clearTimeout(state.loadTimer);
            if (state.chunkBuildTimer) {
              clearTimeout(state.chunkBuildTimer);
              state.chunkBuildTimer = 0;
            }
            state.loadController?.abort();
            state.loadGeneration++;
            state.loading = 0;
            return;
          }
          scheduleRender();
          scheduleTerrainChunkBuild();
          scheduleWindowLoad(0);
        });

        restoreSettings();
        persistSettings();
        resize();
        loadDates(state.cohort);
        document.fonts?.ready.then(scheduleRender);
      })();
    </script>
  </body>
</html>
