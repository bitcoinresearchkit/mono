    :root{--black:#000;--white:oklch(95% 0 0);--orange:oklch(67.64% .191 44.41);--red:oklch(.607 .241 26.328);--amber:oklch(.7175 .1835 64.199);--yellow:oklch(.738 .173 80.9405);--avocado:oklch(.72 .19 110);--lime:oklch(.708 .2165 131.267);--green:oklch(.675 .2065 149.3965);--emerald:oklch(.646 .1575 162.8525);--teal:oklch(.652 .129 183.6035);--cyan:oklch(.662 .1345 218.472);--sky:oklch(.6365 .1635 239.6445);--indigo:oklch(.548 .2475 277.0415);--violet:oklch(.5735 .2655 292.863);--purple:oklch(.5925 .2765 303.1105);--rose:oklch(.6155 .2495 17.012);--mono:Lilex,ui-monospace,SFMono-Regular,Menlo,monospace;--serif:Instrument,Georgia,serif;--meta:10px;--label:11px;--small:13px;--text:clamp(16px,1.15vw,18px)}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-snap-type:y proximity;background:#000}body{margin:0;color:#000;background:#000;font-family:var(--mono);font-variation-settings:"wght" 430;overflow-x:hidden}button,input{font:inherit}button,a{color:inherit}a{text-decoration:none}a:focus-visible{outline:2px solid #000;outline-offset:3px}noscript{display:block;padding:24px;color:var(--white);background:#000}::selection{color:var(--white);background:#000}
    .slide{--bg:var(--yellow);min-height:100svh;padding:clamp(68px,8vh,104px) clamp(22px,5vw,76px) clamp(76px,9vh,106px) clamp(132px,10vw,156px);display:grid;grid-template-columns:minmax(280px,.72fr) minmax(520px,1.28fr);grid-template-rows:1fr auto;align-items:center;gap:clamp(34px,5.5vw,86px);position:relative;overflow:hidden;color:#000;background:var(--bg);border-bottom:2px solid #000;scroll-snap-align:start;scroll-margin-top:0}
    .slide.single{grid-template-columns:1fr}.slide .copy,.slide .visual,.slide .panel,.slide .foot{position:relative;z-index:2}.copy{max-width:650px}.eyebrow{margin:0 0 21px;font:650 var(--meta)/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase}.copy>p:not(.eyebrow){max-width:590px;margin:28px 0 0;color:rgba(0,0,0,.56);font-size:var(--text);line-height:1.5}.copy b{color:#000}
    h1,h2{margin:0;color:#000;font:400 clamp(51.2px,5.6vw,89.6px)/.83 var(--serif);letter-spacing:-.048em}h1{font-size:clamp(65.6px,9.04vw,144px)}h1 em,h2 em{font-weight:400}.lede{font-size:clamp(18px,1.4vw,21px)!important}.foot{grid-column:1/-1;margin:0;padding-top:15px;border-top:1px solid rgba(0,0,0,.38);color:rgba(0,0,0,.58);font:650 var(--meta)/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;display:flex;justify-content:space-between;gap:18px}.foot b{color:#000}.visual{min-width:0;display:flex;flex-direction:column;gap:12px}
    .hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin-top:32px}.data-status{display:flex;align-items:center;gap:9px;width:max-content;max-width:100%;padding:9px 11px;border:1px solid rgba(0,0,0,.38);background:rgba(0,0,0,.05);font:650 var(--meta) var(--mono);letter-spacing:.06em;text-transform:uppercase}.data-status i{width:7px;height:7px;border-radius:50%;background:#000;animation:pulse 1.5s ease-in-out infinite}.data-status.error i{background:transparent;border:1px solid #000;animation:none}.data-status button{padding:0;border:0;background:none;cursor:pointer;text-transform:inherit;letter-spacing:inherit}@keyframes pulse{50%{opacity:.25}}
    .opening-map{min-height:clamp(360px,52vh,580px);display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr) 44px minmax(0,1fr);grid-template-rows:1fr auto;border:2px solid #000}.opening-map article{min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(15px,1.8vw,26px)}.opening-map article small,.opening-map footer span{font:650 var(--meta) var(--mono);letter-spacing:.08em;text-transform:uppercase}.opening-map article strong{font:400 clamp(68px,7.4vw,118px)/.72 var(--serif);letter-spacing:-.07em}.opening-map article h3{margin:24px 0 9px;font:400 clamp(25px,2.25vw,38px)/.92 var(--serif);letter-spacing:-.035em}.opening-map article p{margin:0;color:rgba(0,0,0,.55);font-size:var(--small);line-height:1.38}.opening-map>i{display:grid;place-items:center;border-right:1px solid rgba(0,0,0,.38);border-left:1px solid rgba(0,0,0,.38);font:400 clamp(25px,2.5vw,42px) var(--serif);font-style:normal}.opening-map footer{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:24px;padding:16px clamp(15px,1.8vw,26px);border-top:2px solid #000}.opening-map footer b{font:500 clamp(15px,1.3vw,20px) var(--mono);text-align:right}

<body>
  <div class="progress-line" aria-hidden="true"></div>

  <main id="story"></main>
  <div class="story-controls" aria-label="Slide navigation">

    <span data-progress>1 / 1</span>

  </div>
  <noscript>This story needs JavaScript to load live Bitview data and draw its charts.</noscript>
  <script>
  (()=>{
    "use strict";
    const C={yellow:"var(--yellow)",orange:"var(--orange)",red:"var(--red)",amber:"var(--amber)",avocado:"var(--avocado)",lime:"var(--lime)",green:"var(--green)",emerald:"var(--emerald)",teal:"var(--teal)",cyan:"var(--cyan)",sky:"var(--sky)",indigo:"var(--indigo)",violet:"var(--violet)",purple:"var(--purple)",rose:"var(--rose)",white:"var(--white)"};
    const models=[
      {id:"200wma",name:"200WMA",kind:"Market trend",color:C.red,formula:"mean(Price, 1,400 days)",what:"The average Bitcoin close over the previous 200 weeks.",limit:"Two hundred weeks is not a holder state. The line smooths Bitcoin’s long-term trend, but nothing at that window requires selling to exhaust.",series:"price_sma_200w",note:"Direct Bitview series"},
      {id:"realized",name:"Realized Price",kind:"Mean cost basis",color:C.amber,formula:"Realized Cap ÷ Supply",what:"The average price at which the live UTXO set last moved, with every sat given equal weight.",limit:"At this line, the UTXO set is at aggregate break-even on a last-move basis. That does not mean sellers are exhausted or buyers will appear. <span data-realized-status=\"pronoun\">Bitcoin has not reached it in this cycle</span>.",series:"realized_price",note:"Direct Bitview series"},
      {id:"median",name:"Median Realized Price",kind:"Distribution midpoint",color:C.avocado,formula:"P50 of the cost-basis distribution",what:"The price separating the lower-cost half of supply from the higher-cost half.",limit:"At this line, half of supply would be in loss on a last-move basis. That is a clear state, but there is no reason the midpoint itself must stop a decline.",series:"cost_basis_per_coin_pct50",note:"Direct Bitview series"},
      {id:"investor",name:"Investor Price",kind:"Accounting adjustment",color:C.lime,formula:"(Realized Cap − Thermocap) ÷ Supply",what:"Realized Cap after subtracting Thermocap—the cumulative USD value assigned to new coins when miners received them—then divided by supply.",limit:"Nothing ties buyer demand to Realized Cap minus miner issuance value. Because the result sits below Realized Price, any decline that stops above Realized also stops above Investor Price.",series:"investor_price",note:"Computed: investor cap ÷ supply"},
      {id:"balanced",name:"Balanced Price",kind:"Transfer adjustment",color:C.emerald,formula:"Realized Price − Transfer Price",what:"Realized Price minus Transfer Price, which spreads cumulative price-weighted coin-days destroyed across Bitcoin’s age and supply.",limit:"Transfer Price contains real movement history, but subtracting it does not create a clearing price. Because the result sits below Realized Price, a decline can stop before reaching it.",series:"balanced_price",note:"BRK block-age reconstruction"},
      {id:"delta",name:"Delta Price",kind:"Valuation adjustment",color:C.teal,formula:"(Realized Cap − Average Cap) ÷ Supply",what:"Realized valuation after subtracting Bitcoin’s all-time average market valuation.",limit:"Average Cap describes market history, not holder stress. Subtracting it creates no observable capitulation state. The result also sits below Realized Price, so a decline can stop before reaching it.",series:"delta_price",note:"Computed from lifetime daily caps"},
      {id:"cvdd",name:"CVDD",kind:"Transfer memory",color:C.violet,formula:"Cumulative value-days destroyed ÷ Bitcoin age ÷ 6m BTC",what:"A cumulative record of coins moving, weighted by their value and how long they had been held.",limit:"Value-days destroyed contains real transfer information. But cumulative flow divided by Bitcoin’s age and a fixed six-million-BTC scale is neither a current holder state nor a buyer threshold.",series:"cvdd_price",note:"BRK block-age reconstruction"},
      {id:"cointime",name:"Cointime Price",kind:"Monetary history",color:C.indigo,formula:"Cumulative value of coin-time destroyed ÷ cumulative coin-time stored",what:"Each spend adds spot price × destroyed coin-time to the numerator. Dividing that history by coin-time still stored produces a price.",limit:"The ratio is economically coherent, but nothing special has to happen when price reaches it. It is an equilibrium-like valuation, not a level that exhausts supply or creates demand.",series:"cointime_price",note:"Direct Bitview series"}
    ];
    const rarity={cycle:{title:"Cycle",p1:"cycle_rarity_meter_pct01",p5:"cycle_rarity_meter_pct05",count:6,color:C.red,heading:"Cycle Rarity<br><em>6 references</em>",meaning:"Cycle uses realized and capitalized prices for long-term holders and all supply, plus realized prices for coins older than four and six months. These slower references describe long-held and whole-market cost basis.",foot:"If Rarity is useful as a cycle-floor model, this is the context expected to become extreme."},local:{title:"Local",p1:"local_rarity_meter_pct01",p5:"local_rarity_meter_pct05",count:4,color:C.lime,heading:"Local Rarity<br><em>4 references</em>",meaning:"Local uses STH realized and capitalized prices, plus realized prices for coins younger than four and six months. These references move down quickly as recent-holder cost basis resets.",foot:"A cycle bottom does not need to cross Local. It is more useful for corrections and shorter resets."},full:{title:"Full",p1:"rarity_meter_pct01",p5:"rarity_meter_pct05",count:10,color:C.violet,heading:"Full Rarity<br><em>takes the maximum</em>",meaning:"Full uses all ten references and takes the highest lower band at each percentile. It asks whether either the Cycle or Local context is extreme; it does not require both.",foot:"The maximum is an OR, not consensus. One context sets the line; the other does not have to be crossed."}};
    const DAY_MS=86400000,BASE_DAY_TIME=Date.parse("2009-01-01T00:00:00Z"),CHART_START_INDEX=Math.round((Date.parse("2017-12-16T00:00:00Z")-BASE_DAY_TIME)/DAY_MS),CHART_LINE_WIDTH=1.6;
    const BEDROCK_PERCENTILES=[{key:"pct95",label:"P95",threshold:"bedrock_raw_loss_threshold_pct95",thresholdPct:"bedrock_raw_loss_threshold_pct95_percent",opacity:.28,dash:[2,6]},{key:"pct98",label:"P98",threshold:"bedrock_raw_loss_threshold_pct98",thresholdPct:"bedrock_raw_loss_threshold_pct98_percent",opacity:.42,dash:[6,5]},{key:"pct99",label:"P99",threshold:"bedrock_raw_loss_threshold_pct99",thresholdPct:"bedrock_raw_loss_threshold_pct99_percent",opacity:.58,dash:[3,4]},{key:"pct99_5",label:"P99.5",threshold:"bedrock_raw_loss_threshold_pct99_5",thresholdPct:"bedrock_raw_loss_threshold_pct99_5_percent",opacity:.75,dash:[12,5]},{key:"pct99_9",label:"P99.9",threshold:"bedrock_raw_loss_threshold_pct99_9",thresholdPct:"bedrock_raw_loss_threshold_pct99_9_percent",opacity:.92,dash:[]}];
    const EXTREME_FLOOR_SOURCES=[{key:"rarity_meter_pct01",label:"Full Rarity P1",opacity:.5,dash:[3,5]},{key:"bedrock_raw_floor_pct99",label:"Raw Bedrock P99",opacity:.28,dash:[2,6]},{key:"bedrock_coinflow_floor_pct99",label:"Coinflow Bedrock P99",opacity:.42,dash:[10,6]},{key:"bedrock_cointime_floor_pct99",label:"Cointime Bedrock P99",opacity:.34,dash:[14,6]}];

    const money=(key,compact=false)=>`<span data-value="${key}" data-format="${compact?"usd-compact":"usd"}">—</span>`;

    const lineSwatch=dash=>dash?.length?`repeating-linear-gradient(90deg,#000 0 ${dash[0]}px,transparent ${dash[0]}px ${dash[0]+dash[1]}px)`:"#000";
    const chart=(label,lines,scale="price")=>`<figure class="chart" aria-label="${label}, ${scale==="percent"?"percent":"log price"} scale from the 2017 peak" data-scale="${scale}" data-lines="${encodeURIComponent(JSON.stringify(lines))}"><canvas tabindex="0" aria-label="Interactive time series. Use the left and right arrow keys to inspect dates."></canvas><figcaption class="chart-legend"></figcaption><div class="chart-loading">Loading Bitview data…</div><div class="tooltip" role="status" aria-live="polite"></div></figure>`;
    const urpd=(weight,bedrockLevels="")=>{const compare=weight!=="raw",label=weight==="coinflow"?"Coinflow":"Cointime",levelMode=bedrockLevels||"";return`<div class="urpd-shell">${compare?`<div class="switchbar cohort-switch" aria-label="Choose URPD cohort"><span>Cohort</span>${[["all","All"],["sth","STH"],["lth","LTH"]].map(([key,name])=>`<button type="button" data-cohort="${key}" aria-pressed="${key==="all"}" class="${key==="all"?"active":""}">${name}</button>`).join("")}</div>`:""}<figure class="urpd" aria-label="${weight} UTXO realized price distribution, one-thousand-dollar buckets with square-root bar height" data-urpd="${weight}" data-cohort="all"${levelMode?` data-bedrock-levels="${levelMode}"`:""}><canvas tabindex="0" aria-label="Interactive cost-basis distribution. Use the left and right arrow keys to inspect price buckets."></canvas><figcaption class="urpd-legend">${compare?`<span class="normal"><i></i>Normal</span><span class="weighted"><i></i>${label} weighted</span>`:`<span class="profit"><i></i>In profit</span><span class="loss"><i></i>In loss</span>`}${levelMode?BEDROCK_PERCENTILES.map(level=>`<span class="line"><i style="opacity:${level.opacity};background:${lineSwatch(level.dash)}"></i>${level.label}<b>${money(bedrockFloorKey(levelMode,level),true)}</b></span>`).join(""):""}<span>$1k buckets</span><span>Height · √BTC</span></figcaption><div class="chart-loading">Loading Bitview distribution…</div><div class="tooltip" role="status" aria-live="polite"></div></figure></div>`};
    const section=({id,group,title,color,copy,visual,foot,cls=""})=>`<section class="slide ${cls}" id="${id}" data-group="${group}" data-title="${title}" style="--bg:${color}">${copy}${visual||""}${foot?`<p class="foot">${foot}</p>`:""}</section>`;
    const copy=(eyebrow,title,text,extra="")=>`<div class="copy"><p class="eyebrow">${eyebrow}</p><h2>${title}</h2>${text?`<p>${text}</p>`:""}${extra}</div>`;
    const modelChart=m=>`<div class="visual">${chart(`Bitcoin price and ${m.name} since the 2017 peak`,[{key:"price_close",label:"BTC price",width:4.2,role:"price"},{key:m.series,label:m.name,width:2.3,opacity:.58,dash:[9,6]}])}${floorStats(m.series)}</div>`;

    function renderStory(){
      let html="";
      html+=section({id:"top",group:"start",title:"Finding the floor",color:C.yellow,copy:`<div class="copy"><p class="eyebrow">A search for a Bitcoin floor model</p><h1>Finding<br><em>the floor</em></h1><p class="lede">A line fitted to a handful of old bottoms is not enough. A useful floor must explain what becomes extreme at that exact price.</p><div class="hero-actions"><div class="data-status" data-status role="status" aria-live="polite"><i></i><span>Loading live Bitview data</span></div><a class="skip" href="#ultimate">Skip to the conclusion →</a></div></div>`,visual:`<div class="opening-map panel"><article><small>Start</small><strong>08</strong><div><h3>Existing models</h3><p>What does each line actually represent?</p></div></article><i>→</i><article><small>Search</small><strong>02</strong><div><h3>Forms of extreme</h3><p>Relative cost basis and weighted loss.</p></div></article><i>→</i><article><small>Result</small><strong>01</strong><div><h3>Extreme finder</h3><p>Take the first calibrated extreme reached as price falls.</p></div></article><footer><span>The question</span><b>Why should a bottom form here?</b></footer></div>`,foot:"A floor here is a downside reference, not a guaranteed lower bound. <b>Historical fit comes last.</b>"});
      html+=section({id:"old",group:"existing",title:"Existing floor models",color:C.orange,copy:copy("01 / Existing candidates","Existing floor<br><em>models</em>","The usual bottom models use different inputs, but each must explain why a bottom should form at its exact level. <span data-realized-status=\"named\">Bitcoin has not reached Realized Price in this cycle</span>; models built by subtracting from it sit lower still."),visual:`<div class="overview">${models.map((m,i)=>`<a href="#model-${m.id}"><small>${String(i+1).padStart(2,"0")}</small><h3>${m.name}</h3><p>${m.kind}</p><b>→</b></a>`).join("")}</div>`,foot:"Historical fit is secondary; the question is what happens at each line."});
      models.forEach((m,i)=>{
        html+=section({id:`model-${m.id}`,group:"existing",title:m.name,color:m.color,copy:copy(`01.${i+1} / What it measures`,m.name,m.what,`<div class="formula"><span>Definition</span><code>${m.formula}</code></div><div class="floor-test"><span>Why it falls short</span><p>${m.limit}</p></div>`),visual:modelChart(m),foot:m.note});
      });
      html+=section({id:"cost-basis-staircase",group:"existing",title:"Median is the best of the bunch",color:C.sky,copy:copy("01.9 / From a line to a distribution","Median is the<br><em>best of the bunch</em>","Median Realized Price is the clearest existing floor because it marks an exact state: at that price, half of supply would be in loss on a last-move basis. But the median is still one point in a distribution. The more useful view is cost basis per coin from P40 upward.",`<div class="formula"><span>The observed staircase</span><code>2018 · P40 → 2022 · P45 → current decline · P50 crossed</code></div><div class="floor-test"><span>What started the search</span><p>The percentile reached in major declines appears to be rising. The question is what change in the ownership base could move the floor upward with it.</p></div>`),visual:`<div class="visual">${chart("Bitcoin price with the cost-basis percentile staircase",[{key:"price_close",label:"BTC price",role:"price"},{key:"cost_basis_per_coin_pct40",label:"Cost basis P40",opacity:.38,dash:[2,6]},{key:"cost_basis_per_coin_pct45",label:"Cost basis P45",opacity:.5,dash:[7,6]},{key:"cost_basis_per_coin_pct50",label:"Cost basis P50",opacity:.66,dash:[11,6]},{key:"cost_basis_per_coin_pct55",label:"Cost basis P55",opacity:.42,dash:[15,6]}])}<div class="metrics three staircase-stats"><span>2018 low vs P40<b data-staircase="2018">—</b></span><span>2022 low vs P45<b data-staircase="2022">—</b></span><span>Current low vs P50<b data-staircase="current">—</b></span></div></div>`,foot:"The progression is visible, but it is not yet a rule: the current decline is unfinished, and its low so far lies between P45 and P50."});
      html+=section({id:"rarity",group:"rarity",title:"Rarity calculation",color:C.purple,copy:copy("02 / Rarity Meter","Price relative to<br><em>cost basis</em>","For each reference, Rarity follows Price ÷ reference. A lower band is today’s reference multiplied by a low percentile of that ratio’s weighted block history."),visual:`<div class="flow panel"><span><small>Observe</small><b>Price ÷ reference</b><i>relative distance</i></span><strong>→</strong><span><small>Compare</small><b>Ratio percentile</b><i>how unusual?</i></span><strong>→</strong><span><small>Convert</small><b>Ratio × today’s reference</b><i>an extreme price</i></span></div>`,foot:"P1 is the first percentile of the ratio history. It is not a one-percent probability of a bottom."});
      html+=section({id:"rarity-history",group:"rarity",title:"Weighted history",color:C.orange,copy:copy("02.1 / Weighted history","Recent blocks carry<br><em>more weight</em>","Rarity is not a plain all-time percentile. It samples the ratio from block 210,000 onward and exponentially downweights older observations. This lets the ratio range adapt as Bitcoin matures."),visual:`<div class="cards-3 panel"><article><small>History begins</small><b>210k</b><p>Block 210,000.</p><i>late 2012</i></article><article class="selected"><small>Half-life</small><b>210k</b><p>One halving interval.</p><i>roughly four years</i></article><article><small>Relative weight</small><b>½</b><p>After one half-life.</p><i>older blocks matter less</i></article></div>`,foot:"P1 therefore means the first percentile of a decayed block history, with recent regimes carrying more weight."});
      html+=section({id:"rarity-shape",group:"rarity",title:"Shape before level",color:C.cyan,copy:copy("02.2 / Shape before level","Shape matters more<br><em>than level</em>","The reference is used mainly for its shape, not its absolute value. The cost-basis line supplies the path; the weighted history of Price ÷ reference sets how far below that path the band sits."),visual:`<div class="visual">${chart("Bitcoin price, Realized Price and its P1 Rarity boundary",[{key:"price_close",label:"BTC price",width:4.2,role:"price"},{key:"realized_price",label:"Reference shape",width:2,opacity:.38,dash:[3,5]},{key:"realized_price_pct1",label:"P1 extreme envelope",width:2.7,opacity:.72,dash:[10,6]}])}<div class="metrics"><span>Reference<b>${money("realized_price")}</b></span><span>Its P1 envelope<b>${money("realized_price_pct1")}</b></span></div></div>`,foot:"The band inherits the reference’s moving shape; the reference itself is not treated as a floor."});
      html+=section({id:"realized-capitalized",group:"rarity",title:"Realized and Capitalized",color:C.rose,copy:copy("02.3 / Two cost-basis weightings","Two cost-basis<br><em>weightings</em>","Realized Price gives each sat one vote, so it tracks broad on-chain break-even. Capitalized Price gives each dollar of cost basis one vote, so coins repriced at higher levels pull it upward more strongly.",`<div class="formula"><span>Coin-weighted · broad break-even</span><code>Realized = Σ(price × sats) ÷ Σ(sats)</code></div><div class="formula"><span>Capital-weighted · high-price sensitive</span><code>Capitalized = Σ(price² × sats) ÷ Σ(price × sats)</code></div>`),visual:`<div class="visual">${chart("Bitcoin price with Realized Price and Capitalized Price",[{key:"price_close",label:"BTC price",width:4.2,role:"price"},{key:"realized_price",label:"Realized · bottom shape",width:2.4,opacity:.68,dash:[9,6]},{key:"capitalized_price",label:"Capitalized · top shape",width:2.4,opacity:.68,dash:[3,5]}])}<div class="metrics"><span>Realized<b>${money("realized_price")}</b></span><span>Capitalized<b>${money("capitalized_price")}</b></span></div></div>`,foot:"Rarity keeps both because coin-weighted references better preserve historical bottom shape, while capital-weighted references better preserve historical top shape."});
      html+=section({id:"rarity-split",group:"rarity",title:"Four, five and six months",color:C.yellow,copy:copy("02.4 / The holder split","Why four, five<br><em>and six months?</em>","The usual STH/LTH boundary sits around five months, but the behavioral divide moves with market conditions. Rarity also uses fixed four- and six-month cohorts so the result does not depend on one cutoff."),visual:`<div class="thresholds panel"><article><small>Fixed bracket</small><b>4m</b><h3>Under ↔ over</h3><i>Realized Price</i></article><article class="selected"><small>STH / LTH convention</small><b>5m</b><h3>Short ↔ long</h3><i>Realized + Capitalized</i></article><article><small>Fixed bracket</small><b>6m</b><h3>Under ↔ over</h3><i>Realized Price</i></article></div>`,foot:"Local uses the young sides. Cycle uses the old sides plus whole-market references."});
      Object.entries(rarity).forEach(([key,r],i)=>{html+=section({id:`rarity-${key}`,group:"rarity",title:`${r.title} Rarity`,color:r.color,copy:copy(`02.${i+5} / ${r.title} context`,r.heading,r.meaning,`<div class="distribution-number"><strong>${r.count}</strong><span>cost-basis references</span></div>`),visual:`<div class="visual">${chart(`Bitcoin price with ${r.title} Rarity bands`,[{key:"price_close",label:"BTC price",width:4.2,role:"price"},{key:r.p5,label:`${r.title} P5`,width:2,opacity:.42,dash:[10,6]},{key:r.p1,label:`${r.title} P1`,width:2.6,opacity:.72,dash:[3,5]}])}${floorStats(r.p1)}</div>`,foot:r.foot});});
      html+=section({id:"distribution",group:"distribution",title:"Cost-basis distribution",color:C.green,copy:copy("03 / The distribution","Cost basis<br><em>by price</em>","URPD groups live UTXO supply by last-move price. At any tested price, every bucket above it represents supply that would be in loss. Hover or tap a $1k bucket to see both quantities."),visual:`<div class="visual">${urpd("raw")}</div>`,foot:`Last-move price is a cost-basis proxy, not proof that a purchase occurred · <span data-urpd-date="raw">loading</span>`});
      html+=section({id:"bedrock-method",group:"bedrock",title:"The Bedrock method",color:C.orange,copy:copy("04 / Bedrock","Invert a loss state<br><em>into a price</em>","BRK measures supply in loss after every block. Bedrock samples the final block of each day so every day counts once. It finds a rare loss share in the earlier daily history, then scans today’s URPD for the price that would recreate it.",`<div class="formula"><span>P99 is a rank</span><code>If historical P99 = x% in loss, the target is x% — not 99%</code></div>`),visual:`<div class="flow panel"><span><small>Past only</small><b>Daily loss shares</b><i>find the P99</i></span><strong>→</strong><span><small>Today</small><b>Scan the URPD</b><i>move the price line</i></span><strong>→</strong><span><small>Output</small><b>Same loss share</b><i>the Bedrock price</i></span></div>`,foot:"At least 365 prior days are required. The current day joins the history only after its floor is calculated."});
      html+=section({id:"bedrock-loss-history",group:"bedrock",title:"Loss thresholds",color:C.rose,copy:copy("04.1 / Historical loss","How much loss<br><em>was extreme?</em>","Raw supply in loss changes with price. Each boundary is an expanding percentile calculated only from the daily values available before that date. Higher ranks represent rarer loss states."),visual:`<div class="visual">${chart("Raw supply in loss with its historical Bedrock thresholds",[{key:"supply_in_loss_share",label:"Supply in loss",opacity:1},...BEDROCK_PERCENTILES.map(level=>({key:level.thresholdPct,label:level.label,opacity:level.opacity,dash:level.dash}))],"percent")}</div>`,foot:"P99 is the 99th percentile of the loss-share series. It does not mean that 99% of supply must be in loss."});
      html+=section({id:"bedrock-urpd-levels",group:"bedrock",title:"Loss shares become prices",color:C.cyan,copy:copy("04.2 / Today’s distribution","One distribution<br><em>five prices</em>","Each rank above corresponds to a historical loss-share threshold. Bedrock scans today’s raw URPD and places a price where supply in loss would equal each threshold."),visual:`<div class="visual">${urpd("raw","raw")}</div>`,foot:"All five prices use the same current distribution. Only the historical pain rank changes."});
      html+=section({id:"bedrock",group:"bedrock",title:"Raw Bedrock",color:C.teal,copy:copy("04.3 / Raw Bedrock","Every sat gets<br><em>one vote</em>","Raw Bedrock uses no activity filter. It derives P99 from prior raw loss shares, then finds the price where today’s raw URPD would reach that same share.",`<div class="formula"><span>Definition</span><code>raw loss-share history → P99 rank → today’s raw URPD → price</code></div>`),visual:`<div class="visual">${chart("Bitcoin price and Raw Bedrock P99",[{key:"price_close",label:"BTC price",width:4.2,role:"price"},{key:"bedrock_raw_floor_pct99",label:"Raw Bedrock P99",width:2.5,opacity:.62,dash:[10,6]}])}${floorStats("bedrock_raw_floor_pct99")}</div>`,foot:"At this line, today’s raw distribution matches the P99 threshold from its own prior loss history."});
      html+=section({id:"raw-problem",group:"bedrock",title:"Dormant supply",color:C.yellow,copy:copy("04.4 / Raw supply","Dormant coins still<br><em>count as supply</em>","Raw Bedrock gives every sat the same weight, whether it moved yesterday or has been dormant since 2010."),visual:`<div class="cards-2 panel"><article><small>Coin A</small><b>1 BTC</b><p>Dormant since 2010.<br>Possibly lost.</p><i>Raw weight · 1 BTC</i></article><article><small>Coin B</small><b>1 BTC</b><p>Moved last month.<br>Recently active.</p><i>Raw weight · 1 BTC</i></article></div>`,foot:"Raw cannot distinguish a recently active coin from a possibly lost one."});
      html+=section({id:"coinflow-intro",group:"bedrock",title:"What Coinflow asks",color:C.red,copy:copy("05 / Coinflow","Who can still<br><em>move?</em>","Coinflow does not label individual UTXOs as sellers. It groups them by age and estimates what fraction of each age range will ever move if its observed age-specific spending behavior continues."),visual:`<div class="cards-3 panel"><article><small>Observe</small><h3>Spending by age</h3><p>BTC moved per BTC-day.</p><i>an age-specific rate</i></article><article><small>Project</small><h3>The remaining path</h3><p>Later age ranges an unspent coin can enter.</p><i>total exposure</i></article><article class="selected"><small>Weight</small><h3>Probability of movement</h3><p>One value from zero to one.</p><i>mobility</i></article></div>`,foot:"This is a lifetime mobility estimate for an age range, not a near-term forecast for a particular UTXO."});
      html+=section({id:"coinflow-exposure",group:"bedrock",title:"Spending exposure",color:C.emerald,copy:copy("05.1 / Coinflow · exposure","From spending rate<br><em>to exposure</em>","For each age range, Coinflow divides cumulative BTC transferred from the range by cumulative BTC-days created there. It then adds rate × time across the later ranges an unspent coin would traverse.",`<div class="framework-formula"><span>Age-range spending rate</span><code>cumulative BTC transferred ÷ cumulative BTC-days created</code></div>`),visual:`<div class="flow panel"><span><small>Rate</small><b>Spend ÷ BTC-days</b><i>per age range</i></span><strong>×</strong><span><small>Duration</small><b>Time exposed</b><i>while aging</i></span><strong>→</strong><span><small>Exposure E</small><b>Σ rate × time</b><i>remaining path</i></span></div>`,foot:"Observed age ranges supply the rates. Beyond the observed history, Coinflow continues them with a fitted decaying tail."});
      html+=section({id:"coinflow-mobility",group:"bedrock",title:"Mobility",color:C.green,copy:copy("05.2 / Coinflow · mobility","Exposure becomes<br><em>mobility</em>","Exposure E sums the spending opportunity across the remaining age path. The formula converts that total into the estimated fraction of the age range that will eventually move.",`<div class="framework-formula"><span>Mobility</span><code>m = 1 − e<sup>−E</sup></code></div>`),visual:`<div class="cards-3 panel"><article><small>Exposure E</small><b>0</b><p>No modeled exposure.</p><i>Mobility 0%</i></article><article><small>Exposure E</small><b>ln 2</b><p>Half remain unmoved.</p><i>Mobility 50%</i></article><article><small>Exposure E</small><b>3</b><p>About 5% remain unmoved.</p><i>Mobility 95%</i></article></div>`,foot:"The probability applies to an age range. It does not predict whether a particular coin will move."});
      html+=section({id:"coinflow",group:"bedrock",title:"Coinflow",color:C.lime,copy:copy("05.3 / Coinflow · the weight","Weighting supply<br><em>by mobility</em>","Each UTXO stays in the same last-move price bucket, but its amount is multiplied by the mobility of its age range. A 1 BTC coin in a 60% mobility range contributes 0.6 weighted BTC."),visual:`<div class="visual">${urpd("coinflow","coinflow")}<div class="metrics"><span>Normal → weighted supply<b data-urpd-comparison="coinflow">—</b></span><span>Weighted supply in loss<b data-urpd-loss="coinflow">—</b></span></div></div>`,foot:"Age ranges that often move retain more weight; persistently dormant ranges contribute less. The five lines are Coinflow’s all-supply pain levels; cohort switches change only the bars."});
      html+=section({id:"coinflow-bedrock",group:"bedrock",title:"Coinflow Bedrock",color:C.avocado,copy:copy("05.4 / Coinflow Bedrock","P99 loss in<br><em>mobile supply</em>","Coinflow Bedrock takes P99 from prior mobility-weighted loss shares, then finds the price where today’s mobility-weighted URPD reaches that same share. Each weighting method is calibrated against its own history.",`<div class="formula"><span>Definition</span><code>Coinflow loss-share history → P99 rank → today’s Coinflow URPD → price</code></div>`),visual:`<div class="visual">${chart("Bitcoin price and Coinflow Bedrock P99",[{key:"price_close",label:"BTC price",width:4.2,role:"price"},{key:"bedrock_coinflow_floor_pct99",label:"Coinflow P99",width:2.5,opacity:.66,dash:[10,6]}])}${floorStats("bedrock_coinflow_floor_pct99")}</div>`,foot:"A rising line is consistent with more potentially mobile supply carrying a higher cost basis. Stronger holders or deeper bids may help create that shift, but the model does not measure either directly."});
      html+=section({id:"cointime-created",group:"bedrock",title:"Coin-time created",color:C.sky,copy:copy("06 / Cointime · created","Holding creates<br><em>coin-time</em>","For each age range, one BTC held for one day creates one BTC-day. The cumulative total records how much holding time that range has produced."),visual:`<div class="cards-3 panel"><article><small>Amount</small><b>BTC</b><p>Supply in the range.</p><i>×</i></article><article><small>Time</small><b>Days</b><p>Time spent there.</p><i>=</i></article><article class="selected"><small>Created</small><b>BTC·d</b><p>Holding time produced.</p><i>cumulative</i></article></div>`,foot:"Created coin-time grows while supply remains unspent in an age range."});
      html+=section({id:"cointime-consumed",group:"bedrock",title:"Coin-time consumed",color:C.indigo,copy:copy("06.1 / Cointime · consumed","Movement consumes<br><em>coin-time</em>","When a coin moves, its destroyed coin-days are assigned to the age range it left. Wakefulness compares this demonstrated activity with all coin-time created in that range."),visual:`<div class="flow panel"><span><small>Illustration</small><b>100 BTC·d created</b><i>all holding time</i></span><strong>→</strong><span><small>Spent</small><b>20 BTC·d consumed</b><i>movement observed</i></span><strong>→</strong><span><small>Wakefulness</small><b>20%</b><i>consumed ÷ created</i></span></div>`,foot:"The numbers are illustrative. The actual ratio is cumulative for each age range and bounded from zero to one."});
      html+=section({id:"cointime-weight",group:"bedrock",title:"Cointime as a weight",color:C.violet,copy:copy("06.2 / Cointime · the weight","Weighting supply<br><em>by wakefulness</em>","This is not Cointime Price. Each UTXO stays in the same last-move price bucket, while Bedrock multiplies its amount by its age range’s wakefulness. One BTC in a 20% wakeful range contributes 0.2 weighted BTC.",`<div class="framework-formula"><span>Wakefulness</span><code>cumulative coin-time consumed ÷ cumulative coin-time created</code></div>`),visual:`<div class="visual">${urpd("cointime","cointime")}<div class="metrics"><span>Normal → weighted supply<b data-urpd-comparison="cointime">—</b></span><span>Weighted supply in loss<b data-urpd-loss="cointime">—</b></span></div></div>`,foot:"Cointime weights activity already demonstrated; Coinflow models future mobility. The five lines are Cointime’s all-supply pain levels; cohort switches change only the bars."});
      html+=section({id:"cointime-bedrock",group:"bedrock",title:"Cointime Bedrock",color:C.purple,copy:copy("06.3 / Cointime Bedrock","P99 loss in<br><em>wakeful supply</em>","Cointime Bedrock takes P99 from prior wakefulness-weighted loss shares, then finds the price where today’s weighted URPD reaches that same share. The P99 rank stays fixed while the numerical threshold is calibrated to the weighting.",`<div class="formula"><span>Definition</span><code>Cointime loss-share history → P99 rank → today’s Cointime URPD → price</code></div>`),visual:`<div class="visual">${chart("Bitcoin price and Cointime Bedrock P99",[{key:"price_close",label:"BTC price",width:4.2,role:"price"},{key:"bedrock_cointime_floor_pct99",label:"Cointime P99",width:2.5,opacity:.66,dash:[10,6]}])}${floorStats("bedrock_cointime_floor_pct99")}</div>`,foot:"At this line, today’s wakefulness-weighted distribution matches the P99 threshold from its own prior loss history."});

        if(hover!==null){const px=x(hover);ctx.strokeStyle="#000";ctx.lineWidth=1;ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(px,p.t);ctx.lineTo(px,p.t+h);ctx.stroke();ctx.setLineDash([]);lines.forEach(line=>{const value=valueAt(line,hover);if(!valid(value))return;ctx.beginPath();ctx.arc(px,y(value),line.role==="price"?4.5:3.5,0,Math.PI*2);ctx.fill()})}
      };
      legend.innerHTML=lines.map(line=>`<span><i style="opacity:${line.opacity??1};height:2px;background:${lineSwatch(line.dash)}"></i>${line.label}<b>${legendFormat(latest(line.series))}</b></span>`).join("");
      fig.querySelector(".chart-loading").remove();
      const inspect=clientX=>{const b=canvas.getBoundingClientRect(),pos=Math.max(0,Math.min(1,(clientX-b.left-plot.l)/Math.max(1,b.width-plot.l-plot.r)));hover=Math.round(pos*(length-1));tip.style.display="block";tip.innerHTML=`<time>${dateAt(start+hover,true)}</time>${lines.map(line=>`<span>${line.label}<b>${tooltipFormat(valueAt(line,hover))}</b></span>`).join("")}`;placeTooltip(tip,b,plot.l+pos*(b.width-plot.l-plot.r),Math.max(78,legend.getBoundingClientRect().height+26));draw()};
      canvas.addEventListener("pointermove",event=>inspect(event.clientX));canvas.addEventListener("click",event=>inspect(event.clientX));canvas.addEventListener("pointerleave",event=>{if(event.pointerType!=="mouse")return;hover=null;tip.style.display="none";draw()});canvas.addEventListener("keydown",event=>{if(!["ArrowLeft","ArrowRight"].includes(event.key))return;event.preventDefault();hover=Math.max(0,Math.min(length-1,(hover??length-1)+(event.key==="ArrowLeft"?-1:1)));const b=canvas.getBoundingClientRect();inspect(b.left+plot.l+hover/Math.max(1,length-1)*(b.width-plot.l-plot.r))});const resizeObserver=new ResizeObserver(draw);resizeObserver.observe(canvas);fig._cleanup=()=>resizeObserver.disconnect();draw();
    }
    function makeUrpdChart(fig){
      if(fig._ready)return;
      fig._ready=true;
      const weight=fig.dataset.urpd,compare=weight!=="raw",levelMode=fig.dataset.bedrockLevels||"",canvas=fig.querySelector("canvas"),tip=fig.querySelector(".tooltip"),legend=fig.querySelector(".urpd-legend"),shell=fig.closest(".urpd-shell");
      let cohort="all",weighted=state.urpd[urpdKey(cohort,weight)],normal=compare?state.urpd[urpdKey(cohort,"raw")]:weighted,selected=weighted?.close,hover=null,requestId=0;
      if(!weighted||!normal)return;
      const bars=()=>{const raw=new Map(normal.buckets.filter(b=>b.price_floor>=0).map(b=>[b.price_floor,b.supply])),active=new Map(weighted.buckets.filter(b=>b.price_floor>=0).map(b=>[b.price_floor,b.supply]));return[...new Set([...raw.keys(),...active.keys()])].sort((a,b)=>a-b).map(price_floor=>({price_floor,normal:raw.get(price_floor)||0,weighted:active.get(price_floor)||0})).filter(b=>b.normal>0||b.weighted>0)};
      const updateStats=()=>{const slide=fig.closest(".slide"),supply=slide.querySelector(`[data-urpd-supply="${weight}"]`),comparison=slide.querySelector(`[data-urpd-comparison="${weight}"]`),loss=slide.querySelector(`[data-urpd-loss="${weight}"]`),date=slide.querySelector(`[data-urpd-date="${weight}"]`),lossValue=urpdLoss(weighted);if(supply)supply.textContent=`${(weighted.total_supply/1e6).toFixed(2)}m BTC`;if(comparison)comparison.textContent=`${(normal.total_supply/1e6).toFixed(2)}m → ${(weighted.total_supply/1e6).toFixed(2)}m BTC`;if(loss)loss.textContent=Number.isFinite(lossValue)?`${lossValue.toFixed(1)}%`:"—";if(date)date.textContent=weighted.date};
      const draw=()=>{
        const data=bars();if(!data.length)return;
        const b=canvas.getBoundingClientRect(),ratio=Math.min(devicePixelRatio||1,2),ctx=canvas.getContext("2d");canvas.width=Math.max(1,b.width*ratio);canvas.height=Math.max(1,b.height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,b.width,b.height);
        const p={t:Math.max(52,legend.getBoundingClientRect().height+22),r:16,b:30,l:16},w=b.width-p.l-p.r,h=b.height-p.t-p.b,min=data[0].price_floor,max=data.at(-1).price_floor+1000,peak=Math.max(...data.flatMap(d=>[Math.sqrt(d.normal),Math.sqrt(d.weighted)])),x=v=>p.l+(v-min)/Math.max(1,max-min)*w;
        ctx.strokeStyle="rgba(0,0,0,.08)";ctx.fillStyle="rgba(0,0,0,.6)";ctx.font="600 10px Lilex,monospace";ctx.lineWidth=1;ctx.textAlign="center";
        const candidates=[1000,2000,5000,10000,20000,25000,50000,100000],step=candidates.find(v=>v>=(max-min)/5)||100000;for(let t=Math.ceil(min/step)*step;t<=max;t+=step){const px=x(t),txt=axisUsd(t),half=ctx.measureText(txt).width/2,labelX=Math.max(half+5,Math.min(b.width-half-5,px));ctx.beginPath();ctx.moveTo(px,p.t);ctx.lineTo(px,p.t+h);ctx.stroke();ctx.fillText(txt,labelX,b.height-8)}
        const paint=(key,alpha)=>{ctx.fillStyle="#000";data.forEach((d,i)=>{const next=data[i+1]?.price_floor??d.price_floor+1000,left=x(d.price_floor),bw=Math.max(1,x(next)-left-1),bh=Math.sqrt(d[key])/peak*h;ctx.globalAlpha=typeof alpha==="function"?alpha(d):alpha;ctx.fillRect(left,p.t+h-bh,bw,bh)})};
        if(compare){paint("normal",.18);paint("weighted",d=>d.price_floor>selected?.88:.55)}else paint("weighted",d=>d.price_floor>selected?.82:.24);
        if(levelMode){BEDROCK_PERCENTILES.forEach(level=>{const value=latest(state.series[bedrockFloorKey(levelMode,level)]);if(!Number.isFinite(value)||value<min||value>max)return;const levelX=x(value);ctx.strokeStyle="#000";ctx.globalAlpha=level.opacity;ctx.lineWidth=CHART_LINE_WIDTH;ctx.setLineDash(level.dash);ctx.beginPath();ctx.moveTo(levelX,p.t);ctx.lineTo(levelX,p.t+h);ctx.stroke()});ctx.globalAlpha=1;ctx.setLineDash([])}
        ctx.globalAlpha=1;ctx.fillStyle="#000";const px=x(Math.max(min,Math.min(selected,max))),priceLabel=axisUsd(selected),priceHalf=ctx.measureText(priceLabel).width/2;ctx.lineWidth=CHART_LINE_WIDTH;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(px,p.t);ctx.lineTo(px,p.t+h);ctx.stroke();ctx.setLineDash([]);ctx.fillText(priceLabel,Math.max(priceHalf+5,Math.min(b.width-priceHalf-5,px)),p.t+11);
        if(hover!==null&&data[hover]){const d=data[hover],left=x(d.price_floor),next=x(data[hover+1]?.price_floor??d.price_floor+1000),bh=Math.sqrt(Math.max(d.normal,d.weighted))/peak*h;ctx.strokeRect(left-1,p.t+h-bh-1,Math.max(2,next-left),bh+2)}
      };
      const inspect=clientX=>{const data=bars(),b=canvas.getBoundingClientRect(),pos=Math.max(0,Math.min(1,(clientX-b.left-16)/Math.max(1,b.width-32))),target=data[0].price_floor+pos*(data.at(-1).price_floor-data[0].price_floor);hover=data.reduce((best,d,i)=>Math.abs(d.price_floor-target)<Math.abs(data[best].price_floor-target)?i:best,0);const d=data[hover],retained=d.normal>0?d.weighted/d.normal*100:null,lossAtBin=urpdLoss(weighted,d.price_floor);tip.style.display="block";tip.innerHTML=`<time>${usd(d.price_floor)}–${usd(d.price_floor+999)}</time>${compare?`<span>Normal<b>${Math.round(d.normal).toLocaleString()} BTC</b></span><span>${weight==="coinflow"?"Coinflow":"Cointime"}<b>${Math.round(d.weighted).toLocaleString()} BTC</b></span><span>Weight retained<b>${Number.isFinite(retained)?retained.toFixed(0)+"%":"—"}</b></span>`:`<span>Supply<b>${Math.round(d.weighted).toLocaleString()} BTC</b></span>`}<span>Supply in loss<b>${Number.isFinite(lossAtBin)?"≈"+lossAtBin.toFixed(1)+"%":"—"}</b></span>`;placeTooltip(tip,b,16+pos*(b.width-32),Math.max(78,legend.getBoundingClientRect().height+26));draw()};
      canvas.addEventListener("pointermove",e=>inspect(e.clientX));canvas.addEventListener("click",e=>inspect(e.clientX));canvas.addEventListener("pointerleave",e=>{if(e.pointerType!=="mouse")return;hover=null;tip.style.display="none";draw()});canvas.addEventListener("keydown",e=>{if(!["ArrowLeft","ArrowRight"].includes(e.key))return;e.preventDefault();const data=bars(),current=hover??data.reduce((best,d,i)=>Math.abs(d.price_floor-selected)<Math.abs(data[best].price_floor-selected)?i:best,0),next=Math.max(0,Math.min(data.length-1,current+(e.key==="ArrowLeft"?-1:1))),b=canvas.getBoundingClientRect();inspect(b.left+16+next/Math.max(1,data.length-1)*(b.width-32))});new ResizeObserver(draw).observe(canvas);fig.querySelector(".chart-loading").remove();updateStats();draw();
      if(compare){shell.querySelectorAll("button[data-cohort]").forEach(button=>button.onclick=async()=>{const next=button.dataset.cohort;if(next===cohort)return;const id=++requestId;tip.style.display="none";fig.classList.add("busy");fig.setAttribute("aria-busy","true");shell.querySelectorAll("button[data-cohort]").forEach(b=>b.disabled=true);try{const[raw,nextWeighted]=await Promise.all([fetchUrpd(next,"raw"),fetchUrpd(next,weight)]);if(id!==requestId)return;cohort=next;normal=raw;weighted=nextWeighted;selected=weighted.close;hover=null;fig.dataset.cohort=cohort;shell.querySelectorAll("button[data-cohort]").forEach(b=>{const active=b.dataset.cohort===cohort;b.classList.toggle("active",active);b.setAttribute("aria-pressed",String(active))});updateStats();draw()}catch(error){tip.style.display="block";tip.style.left="12px";tip.style.right="auto";tip.style.top=`${Math.max(78,legend.getBoundingClientRect().height+26)}px`;tip.innerHTML="Cohort data unavailable"}finally{if(id===requestId){fig.classList.remove("busy");fig.removeAttribute("aria-busy");shell.querySelectorAll("button[data-cohort]").forEach(b=>b.disabled=false)}}})}
    }

    function setupBedrockExplorer(){
      const root=document.querySelector("[data-bedrock-explorer]");
      if(!root||root._ready)return;
      root._ready=true;
      const modes=[{key:"raw",label:"Raw",width:2,opacity:.4,dash:[3,5]},{key:"coinflow",label:"Coinflow",width:2.8,opacity:.9},{key:"cointime",label:"Cointime",width:2.3,opacity:.62,dash:[10,6]}];
      const percentiles=[{key:"pct95",label:"P95",width:1.6,opacity:.26,dash:[3,6]},{key:"pct98",label:"P98",width:1.9,opacity:.4,dash:[10,6]},{key:"pct99",label:"P99",width:2.1,opacity:.56,dash:[3,4]},{key:"pct99_5",label:"P99.5",width:2.5,opacity:.74,dash:[12,5]},{key:"pct99_9",label:"P99.9",width:2.9,opacity:.94}];
      const scope=root.querySelector("[data-bedrock-scope]"),chartHost=root.querySelector("[data-bedrock-chart]"),values=root.querySelector("[data-bedrock-values]");
      let view="weights",percentile="pct99",mode="coinflow";
      const seriesKey=(m,p)=>`bedrock_${m}_floor_${p}`;
      const setActive=(selector,value)=>root.querySelectorAll(selector).forEach(button=>{const active=button.dataset.bedrockView===value||button.dataset.bedrockScope===value;button.classList.toggle("active",active);button.setAttribute("aria-pressed",String(active))});
      const render=()=>{
        setActive("[data-bedrock-view]",view);
        const options=view==="weights"?percentiles:modes,current=view==="weights"?percentile:mode,label=view==="weights"?"Hold pain level":"Hold supply lens";
        scope.innerHTML=`<span>${label}</span>${options.map(o=>`<button type="button" data-bedrock-scope="${o.key}" class="${o.key===current?"active":""}" aria-pressed="${o.key===current}">${o.label}</button>`).join("")}`;
        scope.querySelectorAll("[data-bedrock-scope]").forEach(button=>button.onclick=()=>{if(view==="weights")percentile=button.dataset.bedrockScope;else mode=button.dataset.bedrockScope;render()});
        const lines=view==="weights"?modes.map(m=>({...m,key:seriesKey(m.key,percentile),label:`${m.label} · ${percentiles.find(p=>p.key===percentile).label}`})):percentiles.map(p=>({...p,key:seriesKey(mode,p.key),label:`${modes.find(m=>m.key===mode).label} · ${p.label}`}));
        chartHost.querySelector(".chart")?._cleanup?.();
        chartHost.innerHTML=chart(view==="weights"?`Bedrock ${percentiles.find(p=>p.key===percentile).label} across weighting methods`:`${modes.find(m=>m.key===mode).label} Bedrock across historical loss percentiles`,lines);
        makeLineChart(chartHost.querySelector(".chart"));
        values.innerHTML=lines.map(line=>`<span>${line.label}<b>${usd(latest(state.series[line.key]),true)}</b></span>`).join("");
      };
      root.querySelectorAll("[data-bedrock-view]").forEach(button=>button.onclick=()=>{view=button.dataset.bedrockView;render()});
      render();
    }

    function setupNavigation(){
      state.slides=[...document.querySelectorAll(".slide")];
      const groupLabels={start:"Start",existing:"Existing",rarity:"Rarity",distribution:"Distribution",bedrock:"Bedrock",conclusion:"Conclusion"};
      const seen=new Set(),groups=[];
      state.slides.forEach(slide=>{
        if(seen.has(slide.dataset.group))return;
        seen.add(slide.dataset.group);
        groups.push({id:slide.id,label:groupLabels[slide.dataset.group],group:slide.dataset.group});
      });
      const rail=document.querySelector(".chapter-rail");
      const prev=document.querySelector("[data-prev]"),next=document.querySelector("[data-next]");
      rail.innerHTML=groups.map(g=>`<a href="#${g.id}" data-group-link="${g.group}">${g.label}</a>`).join("");
      const setActive=i=>{
        state.active=Math.max(0,Math.min(state.slides.length-1,i));
        const s=state.slides[state.active],pct=(state.active+1)/state.slides.length*100;
        document.documentElement.style.setProperty("--progress",`${pct}%`);
        document.documentElement.style.setProperty("--active-bg",getComputedStyle(s).backgroundColor);
        document.querySelector("[data-progress]").textContent=`${groupLabels[s.dataset.group]} · ${state.active+1} / ${state.slides.length} · ${s.dataset.title}`;
        rail.querySelectorAll("a").forEach(a=>{const active=a.dataset.groupLink===s.dataset.group;a.classList.toggle("active",active);if(active)a.setAttribute("aria-current","step");else a.removeAttribute("aria-current")});
        prev.disabled=state.active===0;next.disabled=state.active===state.slides.length-1;
      };
      const observer=new IntersectionObserver(entries=>{
        const best=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
        if(best)setActive(state.slides.indexOf(best.target));
      },{threshold:[.35,.55,.75]});
      state.slides.forEach(s=>observer.observe(s));
      const go=d=>state.slides[Math.max(0,Math.min(state.slides.length-1,state.active+d))].scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
      prev.onclick=()=>go(-1);
      next.onclick=()=>go(1);
      addEventListener("keydown",e=>{
        if(["INPUT","BUTTON","SUMMARY","CANVAS"].includes(document.activeElement?.tagName))return;
        if(["ArrowDown","PageDown","j"].includes(e.key)){e.preventDefault();go(1)}
        if(["ArrowUp","PageUp","k"].includes(e.key)){e.preventDefault();go(-1)}
      });
      setActive(0);
    }
    renderStory();setupNavigation();loadData();
  })();
