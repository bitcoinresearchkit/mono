:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align=&quot;right&quot;]) {

  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {

  display: inline-flex;

  min-height: 28px;
  align-items: center;

}

  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

}

  border-color: transparent;
  color: var(--muted-foreground);

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

.form-control:disabled,
.form-select:disabled {

  opacity: 0.4;

  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);

  background-color: var(--secondary);

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;brk-story-landing&quot;);
    if (!root) return;

    const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
    const revealItems = root.querySelectorAll(&quot;.brk-reveal&quot;);
    const processArt = root.querySelectorAll(&quot;.brk-process-art&quot;);

    const setArtActive = (art, active) =&gt; {
      art.classList.toggle(&quot;is-active&quot;, active &amp;&amp; !reducedMotion);
      if (typeof art.pauseAnimations !== &quot;function&quot;) return;
      if (active &amp;&amp; !reducedMotion &amp;&amp; typeof art.unpauseAnimations === &quot;function&quot;) {
        art.unpauseAnimations();
      } else {
        art.pauseAnimations();
      }
    };

    if (reducedMotion) {
      processArt.forEach((art) =&gt; setArtActive(art, false));
    } else if (&quot;IntersectionObserver&quot; in window) {
      processArt.forEach((art) =&gt; setArtActive(art, false));
      const artObserver = new IntersectionObserver((entries) =&gt; {
        entries.forEach((entry) =&gt; setArtActive(entry.target, entry.isIntersecting));
      }, { rootMargin: &quot;18% 0px&quot;, threshold: 0.08 });
      processArt.forEach((art) =&gt; artObserver.observe(art));
    } else {
      processArt.forEach((art) =&gt; setArtActive(art, true));
    }

    if (reducedMotion || !(&quot;IntersectionObserver&quot; in window)) {
      revealItems.forEach((item) =&gt; item.classList.add(&quot;is-visible&quot;));
    } else {
      const revealObserver = new IntersectionObserver((entries) =&gt; {
        entries.forEach((entry) =&gt; {
          if (!entry.isIntersecting) return;
          entry.target.classList.add(&quot;is-visible&quot;);
          revealObserver.unobserve(entry.target);
        });
      }, { rootMargin: &quot;0px 0px -12%&quot;, threshold: 0.08 });
      revealItems.forEach((item) =&gt; revealObserver.observe(item));
    }

    const wordmarkSvg = root.querySelector(&quot;.brk-wordmark-svg&quot;);
    const wordmarkText = root.querySelector(&quot;.brk-wordmark-text&quot;);

    const fitWordmark = () =&gt; {
      if (!wordmarkSvg || !wordmarkText) return;
      const bounds = wordmarkText.getBBox();
      if (bounds.width &lt;= 0 || bounds.height &lt;= 0) return;
      const guard = 0.35;
      wordmarkSvg.setAttribute(
        &quot;viewBox&quot;,
        `${bounds.x - guard} ${bounds.y - guard} ${bounds.width + guard * 2} ${bounds.height + guard * 2}`
      );
    };

    fitWordmark();
    if (document.fonts?.ready) {
      document.fonts.ready.then(fitWordmark);
      document.fonts.addEventListener(&quot;loadingdone&quot;, fitWordmark);
    }

    const field = root.querySelector(&quot;[data-brk-ascii-field]&quot;);
    if (!field) return;

    let columns = 0;
    let rows = 0;
    let lastFrame = 0;
    let characterWidth = 8;
    let rowHeight = 14;

    const measureCell = () =&gt; {
      const styles = window.getComputedStyle(field);
      const probe = document.createElement(&quot;span&quot;);
      probe.textContent = &quot;0000000000000000&quot;;
      probe.style.position = &quot;absolute&quot;;
      probe.style.visibility = &quot;hidden&quot;;
      probe.style.whiteSpace = &quot;pre&quot;;
      probe.style.fontFamily = styles.fontFamily;
      probe.style.fontSize = styles.fontSize;
      probe.style.fontWeight = styles.fontWeight;
      probe.style.letterSpacing = styles.letterSpacing;
      root.appendChild(probe);
      const width = probe.getBoundingClientRect().width;
      probe.remove();
      characterWidth = width &gt; 0 ? width / 16 : 8;
      rowHeight = Number.parseFloat(styles.lineHeight) || 14;
    };

    const resizeAscii = () =&gt; {
      measureCell();
      const bounds = field.getBoundingClientRect();
      columns = Math.max(36, Math.floor(bounds.width / characterWidth));
      rows = Math.max(28, Math.floor(bounds.height / rowHeight));
      const inlineRemainder = Math.max(0, bounds.width - columns * characterWidth);
      const blockRemainder = Math.max(0, bounds.height - rows * rowHeight);
      field.style.paddingInline = `${inlineRemainder / 2}px`;
      field.style.paddingBlock = `${blockRemainder / 2}px`;
    };

    const put = (grid, row, column, value) =&gt; {
      if (row &lt; 0 || row &gt;= rows) return;
      for (let index = 0; index &lt; value.length; index += 1) {
        const x = column + index;
        if (x &gt;= 0 &amp;&amp; x &lt; columns) grid[row][x] = value[index];
      }
    };

    const drawAscii = (time) =&gt; {
      if (!columns || !rows) resizeAscii();
      const grid = Array.from({ length: rows }, () =&gt; Array(columns).fill(&quot; &quot;));
      const centerX = columns * .5;
      const centerY = rows * (.46 + Math.cos(time * .11) * .025);

      for (let y = 0; y &lt; rows; y += 1) {
        for (let x = 0; x &lt; columns; x += 1) {
          const distance = Math.hypot((x - centerX) * .13, (y - centerY) * .31);
          const ring = Math.sin(distance * 2.35 - time * .82);
          const stream = Math.sin(x * .17 - time * 1.08 + Math.sin(y * .31) * 1.5);
          const grain = Math.sin(x * 1.73 + y * 2.41) * .5;
          const power = Math.abs(ring * .56 + stream * .31 + grain * .13);
          grid[y][x] = power &gt; .86 ? &quot;#&quot; : power &gt; .72 ? &quot;*&quot; : power &gt; .58 ? &quot;+&quot; : power &gt; .46 ? &quot;:&quot; : power &gt; .34 ? &quot;·&quot; : &quot; &quot;;
        }
      }

      const tracks = columns &gt;= 86
        ? [{ row: .2, label: &quot;[ BLK FILES + MEMPOOL ] ---&gt; [ INDEX ] ---&gt; [ METRICS ] ---&gt; [ WEB + API + MCP ]&quot; }]
        : [
            { row: .2, label: &quot;[ BLK + MEMPOOL ] -&gt; [ INDEX ]&quot; },
            { row: .78, label: &quot;[ METRICS ] -&gt; [ WEB + API ]&quot; }
          ];

      tracks.forEach((track) =&gt; {
        put(grid, Math.floor(rows * track.row), Math.max(2, Math.floor((columns - track.label.length) / 2)), track.label);
      });

      const labels = [&quot;--[ BLK ]--&gt;&quot;, &quot;--[ TX ]--&gt;&quot;, &quot;--[ UTXO ]--&gt;&quot;, &quot;--[ METRIC ]--&gt;&quot;, &quot;--[ API ]--&gt;&quot;];
      const phase = Math.floor(time * .72) % labels.length;
      [
        { row: .31, offset: .04, label: labels[phase] },
        { row: .69, offset: .57, label: labels[(phase + 2) % labels.length] }
      ].forEach((lane) =&gt; {
        const guard = 2;
        const travelWidth = Math.max(0, columns - lane.label.length - guard * 2);
        const x = guard + ((time * .024 + lane.offset) % 1) * travelWidth;
        put(grid, Math.floor(rows * lane.row), Math.floor(x), lane.label);
      });

      field.textContent = grid.map((line) =&gt; line.join(&quot;&quot;)).join(&quot;\n&quot;);
    };

    const asciiObserver = new ResizeObserver(() =&gt; {
      resizeAscii();
      if (reducedMotion) drawAscii(0);
    });
    asciiObserver.observe(field);
    resizeAscii();

    if (document.fonts?.ready) {
      const refresh = () =&gt; {
        resizeAscii();
        if (reducedMotion) drawAscii(0);
      };
      document.fonts.ready.then(refresh);
      document.fonts.addEventListener(&quot;loadingdone&quot;, refresh);
    }

    if (reducedMotion) {
      drawAscii(0);
      return;
    }

    let frameId = 0;
    let running = false;

    const animate = (timestamp) =&gt; {
      if (!running) return;
      if (timestamp - lastFrame &gt;= 100) {
        drawAscii(timestamp / 1000);
        lastFrame = timestamp;
      }
      frameId = window.requestAnimationFrame(animate);
    };

    const start = () =&gt; {
      if (running) return;
      running = true;
      lastFrame = 0;
      frameId = window.requestAnimationFrame(animate);
    };
    const stop = () =&gt; {
      running = false;
      if (frameId) window.cancelAnimationFrame(frameId);
      frameId = 0;
    };

    if (&quot;IntersectionObserver&quot; in window) {
      const visibilityObserver = new IntersectionObserver((entries) =&gt; {
        if (entries[0]?.isIntersecting) start();
        else stop();
      });
      visibilityObserver.observe(field);
    } else {
      start();
    }
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
