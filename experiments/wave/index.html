<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Bitcoin HODL Waves viewed through supply, capital, Cointime, and Coinflow weighting."
    />
    <link rel="preconnect" href="https://bitview.space" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <title>Bitcoin HODL Wave</title>
    <style>
      @font-face {
        font-family: "Lilex";
        src:
          url("https://cdn.jsdelivr.net/fontsource/fonts/lilex:vf@5.3.0/latin-wght-normal.woff2")
          format("woff2-variations");
        font-style: normal;
        font-weight: 100 700;
        font-display: swap;
      }

      @font-face {
        font-family: "Instrument";
        src:
          url("https://cdn.jsdelivr.net/fontsource/fonts/instrument-serif@5.3.0/latin-400-normal.woff2")
          format("woff2");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --background: #000;
        --foreground: #f5f5f5;
        --muted: #8a8a8a;
        --panel: rgb(8 8 8 / 94%);
        --selected: #242424;
        --rail-border: rgb(255 255 255 / 10%);
        --legend-height: calc(46px + env(safe-area-inset-top));
        --controls-height: calc(50px + env(safe-area-inset-bottom));
        --font-mono:
          "Lilex", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        --font-serif:
          "Instrument", Charter, "Bitstream Charter", "Sitka Text", Cambria,
          serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      main,
      #chart {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        min-width: 320px;
        overflow: hidden;
        color: var(--foreground);
        background: var(--background);
        font-family: var(--font-mono);
      }

      main {
        position: relative;
        height: 100dvh;
        isolation: isolate;
      }

      #chart {
        position: absolute;
        inset: var(--legend-height) 0 var(--controls-height);
        height: auto;
        background: var(--background);
      }

      #overview {
        position: absolute;
        z-index: 3;
        top: calc(var(--legend-height) + 16px);
        left: max(22px, env(safe-area-inset-left));
        display: grid;
        gap: 24px;
        max-width: min(540px, calc(100% - 88px));
        pointer-events: none;
        text-shadow:
          0 1px 2px #000,
          0 0 12px rgb(0 0 0 / 92%);
      }

      #overview::before {
        position: absolute;
        z-index: -1;
        inset: -16px -96px -34px -22px;
        background: radial-gradient(
          ellipse at top left,
          rgb(0 0 0 / 68%),
          rgb(0 0 0 / 28%) 48%,
          transparent 74%
        );
        content: "";
      }

      #identity {
        display: grid;
        gap: 9px;
      }

      h1 {
        margin: 0;
        font-family: var(--font-serif);
        font-size: clamp(38px, 4.7vw, 58px);
        font-weight: 400;
        letter-spacing: -0.035em;
        line-height: 0.9;
      }

      #mode-copy {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4em;
        font-size: 11px;
        font-weight: 550;
        letter-spacing: 0.055em;
        line-height: 16px;
        text-transform: uppercase;
      }

      #mode-name {
        color: var(--foreground);
      }

      #mode-description {
        color: var(--muted);
      }

      #mode-description::before {
        margin-right: 0.4em;
        color: #555;
        content: "—";
      }

      #readout {
        display: grid;
        gap: 4px;
        font-variant-numeric: tabular-nums;
      }

      #date {
        color: var(--muted);
        font-size: 11px;
        font-weight: 550;
        letter-spacing: 0.07em;
        line-height: 15px;
        text-transform: uppercase;
      }

      #total {
        color: var(--foreground);
        font-family: var(--font-serif);
        font-size: clamp(27px, 3.2vw, 42px);
        font-weight: 400;
        letter-spacing: -0.025em;
        line-height: 1;
      }

      #total-label {
        color: var(--muted);
        font-size: 9px;
        font-weight: 550;
        letter-spacing: 0.07em;
        line-height: 14px;
        text-transform: uppercase;
      }

      #legend {
        position: absolute;
        z-index: 3;
        top: 0;
        right: 0;
        left: 0;
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(94px, 1fr);
        grid-template-rows: repeat(2, 17px);
        gap: 1px 8px;
        height: var(--legend-height);
        margin: 0;
        padding: calc(5px + env(safe-area-inset-top)) 8px 5px;
        overflow-x: auto;
        overflow-y: hidden;
        border-bottom: 1px solid var(--rail-border);
        background: linear-gradient(180deg, #080808, rgb(0 0 0 / 94%));
        list-style: none;
        scroll-snap-type: x proximity;
        scrollbar-width: none;
        backdrop-filter: blur(8px);
        font-size: 9px;
        font-variant-numeric: tabular-nums;
        font-weight: 550;
        line-height: 17px;
      }

      #legend::-webkit-scrollbar {
        display: none;
      }

      #legend li {
        display: grid;
        grid-template-columns: 7px minmax(44px, 1fr) 38px;
        align-items: center;
        gap: 5px;
        min-width: 0;
        padding: 0 4px;
        border-radius: 4px;
        color: #a7a7a7;
        scroll-snap-align: start;
        transition:
          color 100ms ease,
          background-color 100ms ease,
          opacity 100ms ease;
      }

      #legend li[data-active="true"] {
        color: #fff;
        background: rgb(255 255 255 / 8%);
      }

      #legend li[data-dimmed="true"] {
        opacity: 0.34;
      }

      #legend li[hidden] {
        display: none;
      }

      .legend-swatch {
        width: 7px;
        height: 7px;
        border-radius: 2px;
        background: var(--swatch);
        box-shadow: 0 0 0 1px rgb(255 255 255 / 14%);
      }

      .legend-value {
        color: var(--foreground);
        text-align: right;
      }

      #status {
        position: absolute;
        z-index: 5;
        top: 50%;
        left: 50%;
        max-width: min(430px, calc(100% - 32px));
        padding: 8px 11px;
        border-radius: 7px;
        color: #b8b8b8;
        background: rgb(20 20 20 / 90%);
        font-size: 11px;
        font-weight: 550;
        letter-spacing: 0.07em;
        line-height: 18px;
        text-align: center;
        text-transform: uppercase;
        transform: translate(-50%, -50%);
        pointer-events: none;
        transition: opacity 160ms ease;
      }

      #status:empty {
        opacity: 0;
      }

      #status[data-error="true"] {
        color: #fff;
        background: rgb(95 19 25 / 94%);
      }

      #axis-unit {
        position: absolute;
        z-index: 3;
        top: calc(var(--legend-height) + 7px);
        right: 56px;
        padding: 3px 5px;
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 4px;
        color: #aaa;
        background: rgb(0 0 0 / 70%);
        font-size: 8px;
        font-variant-numeric: tabular-nums;
        font-weight: 550;
        letter-spacing: 0.065em;
        line-height: 12px;
        text-transform: uppercase;
        pointer-events: none;
      }

      #axis-unit[hidden] {
        display: none;
      }

      #footer {
        position: absolute;
        z-index: 4;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        height: var(--controls-height);
        padding:
          4px max(10px, calc(env(safe-area-inset-right) + 8px))
          max(4px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
        border-top: 1px solid var(--rail-border);
        background: var(--panel);
        backdrop-filter: blur(10px);
      }

      #controls {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: flex-end;
        gap: 4px;
      }

      .control-set {
        display: flex;
        gap: 3px;
      }

      #mode-controls {
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      #view-controls {
        padding-left: 4px;
        border-left: 1px solid var(--rail-border);
      }

      button {
        min-width: 66px;
        padding: 7px 9px;
        border: 0;
        border-radius: 6px;
        color: #777;
        background: transparent;
        font: inherit;
        font-size: 10px;
        font-weight: 550;
        letter-spacing: 0.065em;
        line-height: 16px;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          color 120ms ease,
          background-color 120ms ease;
      }

      button:hover {
        color: #ddd;
        background: rgb(255 255 255 / 5%);
      }

      button:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }

      button[aria-selected="true"] {
        color: #e0e0e0;
        background: var(--selected);
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 8%);
      }

      #view-controls button[aria-selected="true"] {
        color: #090909;
        background: #dedede;
        box-shadow: none;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.5;
      }

      #credit {
        min-width: 0;
        overflow: hidden;
        color: var(--muted);
        font-size: 9px;
        font-weight: 550;
        letter-spacing: 0.07em;
        line-height: 15px;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      #credit a {
        color: inherit;
        text-decoration: none;
      }

      #credit .credit-copy {
        opacity: 0.5;
      }

      #credit a:hover,
      #credit a:focus-visible {
        color: var(--foreground);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      @media (max-width: 780px) {
        :root {
          --legend-height: calc(38px + env(safe-area-inset-top));
          --controls-height: calc(112px + env(safe-area-inset-bottom));
        }

        #overview {
          top: calc(var(--legend-height) + 12px);
          left: max(12px, env(safe-area-inset-left));
          gap: 18px;
          max-width: calc(100% - 72px);
        }

        h1 {
          font-size: 37px;
        }

        #mode-copy {
          max-width: calc(100vw - 84px);
          font-size: 9px;
        }

        #legend {
          top: 0;
          right: 0;
          bottom: auto;
          left: 0;
          grid-auto-flow: column;
          grid-auto-columns: minmax(88px, 1fr);
          grid-template-rows: repeat(2, 15px);
          gap: 0 6px;
          height: var(--legend-height);
          padding: calc(3px + env(safe-area-inset-top)) 6px 3px;
          background: linear-gradient(180deg, #080808, rgb(0 0 0 / 94%));
          font-size: 8px;
          line-height: 15px;
        }

        #legend li {
          grid-template-columns: 6px minmax(30px, 1fr) 32px;
          gap: 3px;
          min-width: 0;
          line-height: 15px;
        }

        .legend-swatch {
          width: 6px;
          height: 6px;
        }

        #footer {
          flex-direction: column;
          align-items: stretch;
          justify-content: center;
          gap: 3px;
          padding:
            5px max(7px, env(safe-area-inset-right))
            max(4px, env(safe-area-inset-bottom))
            max(7px, env(safe-area-inset-left));
        }

        #controls {
          flex-direction: column;
          align-items: stretch;
          width: 100%;
        }

        .control-set {
          width: 100%;
        }

        #view-controls {
          padding-top: 3px;
          padding-left: 0;
          border-top: 1px solid rgb(255 255 255 / 10%);
          border-left: 0;
        }

        button {
          flex: 1 1 27%;
          min-width: 72px;
          padding: 5px 6px;
          font-size: 9px;
        }

        #view-controls button {
          flex: 1 1 50%;
        }

        #credit {
          order: 2;
          width: 100%;
          font-size: 8px;
          line-height: 12px;
          text-align: center;
        }
      }

      @media (max-width: 430px) {
        #legend {
          grid-auto-columns: minmax(82px, 1fr);
          bottom: auto;
        }

        #legend li {
          grid-template-columns: 6px minmax(38px, 1fr) 34px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div
        id="chart"
        role="img"
        aria-busy="true"
        aria-label="Bitcoin HODL Wave by UTXO age"
      ></div>

      <section id="overview" aria-label="Current wave summary">
        <header id="identity">
          <h1>Bitcoin HODL Wave</h1>
          <div id="mode-copy">
            <strong id="mode-name">Normal</strong>
            <span id="mode-description">Every live BTC counts once.</span>
          </div>
        </header>

        <div id="readout" aria-live="polite">
          <time id="date">—</time>
          <strong id="total">—</strong>
          <span id="total-label">Live supply represented</span>
        </div>
      </section>

      <ol id="legend" aria-label="Age range shares"></ol>

      <output id="status">Loading HODL Wave…</output>
      <span id="axis-unit" hidden aria-hidden="true"></span>

      <footer id="footer">
        <div id="credit">
          <span class="credit-copy">Powered by</span>
          <a
            href="https://bitview.dev"
            target="_blank"
            rel="noreferrer"
          >
            Bitview
          </a>
        </div>

        <div id="controls">
          <div
            id="mode-controls"
            class="control-set"
            role="tablist"
            aria-label="HODL Wave weighting"
          >
            <button type="button" role="tab" data-mode="supply" aria-selected="true">
              Normal
            </button>
            <button type="button" role="tab" data-mode="cointime" aria-selected="false">
              Awake
            </button>
            <button type="button" role="tab" data-mode="coinflow" aria-selected="false">
              Mobile
            </button>
            <button type="button" role="tab" data-mode="capital" aria-selected="false">
              Capital
            </button>
            <button type="button" role="tab" data-mode="dormant" aria-selected="false">
              Dormant
            </button>
            <button type="button" role="tab" data-mode="immobile" aria-selected="false">
              Immobile
            </button>
          </div>
          <div
            id="view-controls"
            class="control-set"
            role="tablist"
            aria-label="HODL Wave display"
          >
            <button type="button" role="tab" data-view="share" aria-selected="true">
              Share
            </button>
            <button type="button" role="tab" data-view="absolute" aria-selected="false">
              Absolute
            </button>
          </div>
        </div>
      </footer>
    </main>

    <script type="module">
      import * as LightweightCharts from "https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.mjs";

      function start() {
        "use strict";

        const API = "https://bitview.space/api";
        const DAY_ZERO = Date.UTC(2009, 0, 1);
        const DAY_MS = 86_400_000;
        const PREFERENCE_KEY = "brk-wave:mode";
        const VIEW_PREFERENCE_KEY = "brk-wave:view";

        const ranges = [
          { id: "under_1h_old", label: "<1h" },
          { id: "1h_to_1d_old", label: "1h–1d" },
          { id: "1d_to_1w_old", label: "1d–1w" },
          { id: "1w_to_1m_old", label: "1w–1m" },
          { id: "1m_to_2m_old", label: "1m–2m" },
          { id: "2m_to_3m_old", label: "2m–3m" },
          { id: "3m_to_4m_old", label: "3m–4m" },
          { id: "4m_to_5m_old", label: "4m–5m" },
          { id: "5m_to_6m_old", label: "5m–6m" },
          { id: "6m_to_9m_old", label: "6m–9m" },
          { id: "9m_to_1y_old", label: "9m–1y" },
          { id: "1y_to_18m_old", label: "1y–18m" },
          { id: "18m_to_2y_old", label: "18m–2y" },
          { id: "2y_to_3y_old", label: "2y–3y" },
          { id: "3y_to_4y_old", label: "3y–4y" },
          { id: "4y_to_5y_old", label: "4y–5y" },
          { id: "5y_to_6y_old", label: "5y–6y" },
          { id: "6y_to_7y_old", label: "6y–7y" },
          { id: "7y_to_8y_old", label: "7y–8y" },
          { id: "8y_to_10y_old", label: "8y–10y" },
          { id: "10y_to_12y_old", label: "10y–12y" },
          { id: "12y_to_15y_old", label: "12y–15y" },
          { id: "over_15y_old", label: "15y+" },
        ];

        const modes = {
          supply: {
            button: "Normal",
            name: "Normal HODL Wave",
            description: "Every live BTC counts once.",
            totalLabel: "Live supply represented",
            suffix: "supply",
            unit: "btc",
          },
          cointime: {
            button: "Awake",
            name: "Cointime weighted",
            description: "Supply × observed wakefulness.",
            totalLabel: "Wakefulness-weighted supply represented",
            suffix: "awake_supply",
            complement: { suffix: "dormant_supply", label: "Dormant" },
            unit: "btc",
          },
          coinflow: {
            button: "Mobile",
            name: "Coinflow weighted",
            description: "Supply × estimated lifetime mobility.",
            totalLabel: "Mobility-weighted supply represented",
            suffix: "mobile_supply",
            complement: { suffix: "immobile_supply", label: "Immobile" },
            unit: "btc",
          },
          capital: {
            button: "Capital",
            name: "Capital weighted",
            description: "Supply × last-move price.",
            totalLabel: "Realized capitalization represented",
            suffix: "realized_cap",
            unit: "usd",
          },
          dormant: {
            button: "Dormant",
            name: "Dormancy weighted",
            description: "Supply × (1 − observed wakefulness).",
            totalLabel: "Dormancy-weighted supply represented",
            suffix: "dormant_supply",
            complement: { suffix: "awake_supply", label: "Awake" },
            unit: "btc",
          },
          immobile: {
            button: "Immobile",
            name: "Immobility weighted",
            description: "Supply × (1 − estimated mobility).",
            totalLabel: "Immobility-weighted supply represented",
            suffix: "immobile_supply",
            complement: { suffix: "mobile_supply", label: "Mobile" },
            unit: "btc",
          },
        };

        const PALETTE = [
          "#f11325", // red
          "#f2660f", // orange
          "#f08500", // amber
          "#e19b00", // yellow
          "#aead00", // avocado
          "#6dba00", // lime
          "#00b747", // green
          "#00aa71", // emerald
          "#00a898", // teal
          "#00a5ca", // cyan
          "#0095e3", // sky
          "#1e6fff", // blue
          "#584dfc", // indigo
          "#863dff", // violet
          "#a232ff", // purple
          "#d50ced", // fuchsia
          "#ee1988", // pink
          "#f6004b", // rose
        ];
        const colors = ranges.map(
          (_, index) => PALETTE[(index + PALETTE.length - 2) % PALETTE.length],
        );
        const COMPLEMENT_COLOR = "#737373";

        const chartElement = document.getElementById("chart");
        const dateElement = document.getElementById("date");
        const totalElement = document.getElementById("total");
        const totalLabelElement = document.getElementById("total-label");
        const modeNameElement = document.getElementById("mode-name");
        const modeDescriptionElement = document.getElementById("mode-description");
        const legendElement = document.getElementById("legend");
        const statusElement = document.getElementById("status");
        const axisUnitElement = document.getElementById("axis-unit");
        const modeControlsElement = document.getElementById("mode-controls");
        const viewControlsElement = document.getElementById("view-controls");
        const modeButtons = [...modeControlsElement.querySelectorAll("button")];
        const viewButtons = [...viewControlsElement.querySelectorAll("button")];
        const buttons = [...modeButtons, ...viewButtons];
        const cache = new Map();
        const seriesCache = new Map();
        const legendRows = [];
        const rowsByTime = new Map();
        const compactNumber = new Intl.NumberFormat("en-US", {
          notation: "compact",
          maximumFractionDigits: 2,
        });
        const dateFormatter = new Intl.DateTimeFormat("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
          timeZone: "UTC",
        });

        let activeMode = "supply";
        let activeView = "share";
        let activeRows = [];
        let latestRow = null;
        let complementLegend = null;
        let requestToken = 0;
        let fitted = false;
        let axisDivisor = 1;

        function dayToDate(day) {
          return new Date(DAY_ZERO + day * DAY_MS).toISOString().slice(0, 10);
        }

        function timeKey(time) {
          if (typeof time === "string") return time;
          if (time && Number.isFinite(time.year)) {
            return [
              time.year.toString().padStart(4, "0"),
              time.month.toString().padStart(2, "0"),
              time.day.toString().padStart(2, "0"),
            ].join("-");
          }
          return "";
        }

        function formatTotal(value, unit) {
          if (!Number.isFinite(value)) return "—";
          const formatted = compactNumber.format(value);
          return unit === "usd" ? `$${formatted}` : `${formatted} BTC`;
        }

        function formatAbsolute(value) {
          if (!Number.isFinite(value)) return "";
          const formatted = compactNumber.format(value);
          return modes[activeMode].unit === "usd" ? `$${formatted}` : formatted;
        }

        function updateAxisUnit() {
          if (activeView === "share") {
            axisDivisor = 1;
            axisUnitElement.hidden = true;
            return;
          }

          const maximum = activeRows.reduce(
            (current, row) =>
              Math.max(current, row.total + row.complementValue),
            0,
          );
          const isUsd = modes[activeMode].unit === "usd";

          if (isUsd && maximum >= 1_000_000_000_000) {
            axisDivisor = 1_000_000_000_000;
            axisUnitElement.textContent = "$T";
          } else if (isUsd) {
            axisDivisor = 1_000_000_000;
            axisUnitElement.textContent = "$B";
          } else {
            axisDivisor = 1_000_000;
            axisUnitElement.textContent = "M BTC";
          }
          axisUnitElement.hidden = false;
        }

        function formatAxis(value) {
          if (!Number.isFinite(value)) return "";
          if (activeView === "share") return `${value.toFixed(0)}%`;
          const scaled = value / axisDivisor;
          const precision = Math.abs(scaled) < 10 && scaled !== 0 ? 1 : 0;
          return scaled.toFixed(precision).replace(/\.0$/, "");
        }

        function setStatus(message, isError = false) {
          statusElement.textContent = message;
          statusElement.dataset.error = String(isError);
        }

        function setBusy(busy) {
          buttons.forEach((button) => {
            button.disabled = busy;
          });
          chartElement.setAttribute("aria-busy", String(busy));
        }

        function buildLegend() {
          [...ranges].reverse().forEach((range, reverseIndex) => {
            const index = ranges.length - reverseIndex - 1;
            const row = document.createElement("li");
            row.dataset.index = String(index);

            const swatch = document.createElement("i");
            swatch.className = "legend-swatch";
            swatch.style.setProperty("--swatch", colors[index]);

            const label = document.createElement("span");
            label.textContent = range.label;

            const value = document.createElement("span");
            value.className = "legend-value";
            value.textContent = "—";

            row.append(swatch, label, value);
            legendElement.append(row);
            legendRows[index] = { row, value };
          });

          const row = document.createElement("li");
          row.hidden = true;

          const swatch = document.createElement("i");
          swatch.className = "legend-swatch";
          swatch.style.setProperty("--swatch", COMPLEMENT_COLOR);

          const label = document.createElement("span");
          const value = document.createElement("span");
          value.className = "legend-value";

          row.append(swatch, label, value);
          legendElement.prepend(row);
          complementLegend = { row, label, value };
        }

        function updateLegend(row) {
          if (!row) return;
          row.shares.forEach((share, index) => {
            const absolute = row.weights[index];
            legendRows[index].value.textContent =
              activeView === "share"
                ? `${share.toFixed(1)}%`
                : formatAbsolute(absolute);
          });

          const hasComplement = Boolean(row.complementLabel);
          complementLegend.row.hidden = !hasComplement;
          if (hasComplement) {
            complementLegend.label.textContent = row.complementLabel;
            complementLegend.value.textContent =
              activeView === "share"
                ? `${row.complementShare.toFixed(1)}%`
                : formatAbsolute(row.complementValue);
          }
        }

        function highlightBand(index = -1) {
          legendRows.forEach(({ row }, rowIndex) => {
            const hasSelection = index >= 0;
            row.dataset.active = String(hasSelection && rowIndex === index);
            row.dataset.dimmed = String(hasSelection && rowIndex !== index);
          });
          const hasSelection = index >= 0;
          const isComplement = index === ranges.length;
          complementLegend.row.dataset.active = String(
            hasSelection && isComplement,
          );
          complementLegend.row.dataset.dimmed = String(
            hasSelection && !isComplement,
          );
        }

        function updateReadout(row) {
          if (!row) return;
          dateElement.dateTime = row.time;
          dateElement.textContent = dateFormatter.format(
            new Date(`${row.time}T00:00:00Z`),
          );
          totalElement.textContent = formatTotal(row.total, modes[activeMode].unit);
          updateLegend(row);
        }

        function fetchSeries(name) {
          if (seriesCache.has(name)) return seriesCache.get(name);

          const request = fetch(
            `${API}/series/${encodeURIComponent(name)}/day1`,
            {
              cache: "no-cache",
              signal: AbortSignal.timeout(30_000),
            },
          ).then(async (response) => {
            if (!response.ok) {
              throw new Error(`${name}: Bitview returned ${response.status}`);
            }
            const data = await response.json();
            if (
              !Number.isFinite(data.start) ||
              !Number.isFinite(data.end) ||
              !Array.isArray(data.data)
            ) {
              throw new Error(`${name}: Bitview returned invalid data`);
            }
            return data;
          });

          seriesCache.set(name, request);
          request.catch(() => seriesCache.delete(name));
          return request;
        }

        async function fetchMode(modeKey, onProgress) {
          if (cache.has(modeKey)) return cache.get(modeKey);

          const definition = modes[modeKey];
          const names = ranges.map(
            ({ id }) => `utxos_${id}_${definition.suffix}`,
          );
          const complementNames = definition.complement
            ? ranges.map(
                ({ id }) =>
                  `utxos_${id}_${definition.complement.suffix}`,
              )
            : [];
          const requestCount = names.length + complementNames.length;
          let completedRequests = 0;
          const loadSeries = (name) =>
            fetchSeries(name).then((response) => {
              completedRequests += 1;
              onProgress?.(completedRequests, requestCount);
              return response;
            });

          onProgress?.(0, requestCount);
          const [responses, complementResponses] = await Promise.all([
            Promise.all(names.map(loadSeries)),
            Promise.all(complementNames.map(loadSeries)),
          ]);
          const allResponses = [...responses, ...complementResponses];

          const start = Math.max(...allResponses.map(({ start }) => start));
          const end = Math.min(...allResponses.map(({ end }) => end));
          const rows = [];

          for (let day = start; day < end; day += 1) {
            const weights = responses.map((response) => {
              const value = Number(response.data[day - response.start]);
              return Number.isFinite(value) && value > 0 ? value : 0;
            });
            const total = weights.reduce((sum, value) => sum + value, 0);
            const complementWeights = complementResponses.map((response) => {
              const value = Number(response.data[day - response.start]);
              return Number.isFinite(value) && value > 0 ? value : 0;
            });
            const complementValue = complementWeights.reduce(
              (sum, value) => sum + value,
              0,
            );
            const chartTotal = total + complementValue;
            if (!(chartTotal > 0)) continue;

            const shares = weights.map((value) => (value / chartTotal) * 100);
            const complementShare = (complementValue / chartTotal) * 100;
            const shareValues = [0];
            const absoluteValues = [0];
            let cumulativeShare = 0;
            let cumulativeAbsolute = 0;
            shares.forEach((share) => {
              cumulativeShare += share;
              shareValues.push(cumulativeShare);
            });
            weights.forEach((weight) => {
              cumulativeAbsolute += weight;
              absoluteValues.push(cumulativeAbsolute);
            });
            if (definition.complement) {
              shareValues.push(cumulativeShare + complementShare);
              absoluteValues.push(cumulativeAbsolute + complementValue);
            }
            shareValues[shareValues.length - 1] = 100;
            absoluteValues[absoluteValues.length - 1] = chartTotal;

            rows.push({
              time: dayToDate(day),
              shareValues,
              absoluteValues,
              shares,
              weights,
              total,
              complementLabel: definition.complement?.label ?? null,
              complementShare,
              complementValue,
            });
          }

          if (!rows.length) throw new Error("No HODL Wave data is available");
          cache.set(modeKey, rows);
          return rows;
        }

        function chartSize() {
          const { width, height } = chartElement.getBoundingClientRect();
          return {
            width: Math.max(1, Math.floor(width)),
            height: Math.max(1, Math.floor(height)),
          };
        }

        const chart = LightweightCharts.createChart(chartElement, {
          ...chartSize(),
          hoveredSeriesOnTop: false,
          layout: {
            background: {
              type: LightweightCharts.ColorType.Solid,
              color: "#000000",
            },
            textColor: "#a1a1aa",
            fontFamily: '"Lilex", ui-monospace, monospace',
            attributionLogo: false,
          },
          localization: {
            priceFormatter: formatAxis,
          },
          grid: {
            vertLines: { visible: false },
            horzLines: {
              visible: true,
              color: "rgb(255 255 255 / 8%)",
              style: LightweightCharts.LineStyle.Dotted,
            },
          },
          rightPriceScale: {
            visible: true,
            borderVisible: false,
            minimumWidth: 48,
            scaleMargins: { top: 0.01, bottom: 0.01 },
          },
          timeScale: {
            visible: true,
            borderVisible: false,
            rightOffset: 0,
            minBarSpacing: 0.06,
            fixLeftEdge: true,
            fixRightEdge: true,
          },
          crosshair: {
            mode: LightweightCharts.CrosshairMode.Normal,
            vertLine: {
              color: "rgb(255 255 255 / 74%)",
              labelVisible: true,
            },
            horzLine: {
              color: "rgb(255 255 255 / 74%)",
              labelVisible: true,
            },
          },
          handleScroll: {
            mouseWheel: true,
            pressedMouseMove: true,
            horzTouchDrag: true,
            vertTouchDrag: false,
          },
          handleScale: {
            axisPressedMouseMove: true,
            mouseWheel: true,
            pinch: true,
          },
        });

        let resizeFrame = 0;
        function resizeChart() {
          if (resizeFrame) return;
          resizeFrame = requestAnimationFrame(() => {
            resizeFrame = 0;
            const { width, height } = chartSize();
            chart.resize(width, height, true);
          });
        }

        new ResizeObserver(resizeChart).observe(chartElement);
        window.addEventListener("pageshow", resizeChart);
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) resizeChart();
        });
        resizeChart();

        class WaveRenderer {
          update(seriesData, options) {
            this.seriesData = seriesData;
            this.options = options;
          }

          draw(target, priceToCoordinate) {
            const { seriesData, options } = this;
            if (!seriesData?.visibleRange) return;

            target.useBitmapCoordinateSpace(
              ({ context, horizontalPixelRatio, verticalPixelRatio }) => {
                const points = [];
                let lastX = -Infinity;

                for (
                  let index = seriesData.visibleRange.from;
                  index < seriesData.visibleRange.to;
                  index += 1
                ) {
                  const bar = seriesData.bars[index];
                  const x = Math.round(bar.x * horizontalPixelRatio);
                  const values = bar.originalData.values;
                  if (!Array.isArray(values) || values.length < 2) continue;

                  const point = {
                    x,
                    ys: values.map((value) =>
                      Math.round(
                        priceToCoordinate(value) * verticalPixelRatio,
                      ),
                    ),
                  };
                  if (x === lastX) points[points.length - 1] = point;
                  else points.push(point);
                  lastX = x;
                }

                if (points.length < 2) return;
                const bandCount = points[0].ys.length - 1;
                context.lineJoin = "round";

                for (let band = 0; band < bandCount; band += 1) {
                  context.beginPath();
                  context.moveTo(points[0].x, points[0].ys[band + 1]);
                  for (let index = 1; index < points.length; index += 1) {
                    context.lineTo(
                      points[index].x,
                      points[index].ys[band + 1],
                    );
                  }
                  for (let index = points.length - 1; index >= 0; index -= 1) {
                    context.lineTo(points[index].x, points[index].ys[band]);
                  }
                  context.closePath();
                  context.fillStyle = options.colors[band];
                  context.fill();
                }

                context.strokeStyle = "rgb(0 0 0 / 28%)";
                context.lineWidth = Math.max(1, horizontalPixelRatio * 0.55);
                for (let boundary = 1; boundary < bandCount; boundary += 1) {
                  context.beginPath();
                  context.moveTo(points[0].x, points[0].ys[boundary]);
                  for (let index = 1; index < points.length; index += 1) {
                    context.lineTo(
                      points[index].x,
                      points[index].ys[boundary],
                    );
                  }
                  context.stroke();
                }
              },
            );
          }
        }

        class WaveSeries {
          constructor() {
            this.waveRenderer = new WaveRenderer();
          }

          renderer() {
            return this.waveRenderer;
          }

          update(seriesData, options) {
            this.waveRenderer.update(seriesData, options);
          }

          priceValueBuilder(row) {
            return [row.values[0], row.values.at(-1)];
          }

          isWhitespace(row) {
            return !row.values?.length;
          }

          defaultOptions() {
            return {
              ...LightweightCharts.customSeriesDefaultOptions,
              colors: [],
            };
          }
        }

        const waveSeries = chart.addCustomSeries(new WaveSeries(), {
          colors,
          lastValueVisible: false,
          priceLineVisible: false,
          priceFormat: {
            type: "custom",
            formatter: formatAxis,
          },
        });

        function renderActiveRows() {
          if (!activeRows.length) return;

          updateAxisUnit();
          const visibleRange = fitted
            ? chart.timeScale().getVisibleLogicalRange()
            : null;
          const valueKey =
            activeView === "share" ? "shareValues" : "absoluteValues";
          const displayRows = activeRows.map((row) => ({
            ...row,
            values: row[valueKey],
          }));

          latestRow = displayRows.at(-1) ?? null;
          rowsByTime.clear();
          displayRows.forEach((row) => rowsByTime.set(row.time, row));
          waveSeries.applyOptions({
            colors: activeRows[0].complementLabel
              ? [...colors, COMPLEMENT_COLOR]
              : colors,
            priceFormat: { type: "custom", formatter: formatAxis },
          });
          chart.applyOptions({
            localization: { priceFormatter: formatAxis },
          });
          waveSeries.setData(displayRows);

          if (visibleRange) {
            chart.timeScale().setVisibleLogicalRange(visibleRange);
          } else {
            chart.timeScale().fitContent();
            fitted = true;
          }

          legendElement.setAttribute(
            "aria-label",
            activeView === "share"
              ? "Age range shares"
              : "Absolute age range values",
          );
          updateReadout(latestRow);
          highlightBand();
        }

        function applyRows(modeKey, rows) {
          activeMode = modeKey;
          activeRows = rows;

          const definition = modes[modeKey];
          modeNameElement.textContent = definition.name;
          modeDescriptionElement.textContent = definition.description;
          totalLabelElement.textContent = definition.totalLabel;
          document.title = `${definition.button} Bitcoin HODL Wave`;
          chartElement.setAttribute(
            "aria-label",
            `Bitcoin ${definition.name} by UTXO age, ${activeView} view`,
          );
          renderActiveRows();
        }

        function persistMode(modeKey) {
          try {
            localStorage.setItem(PREFERENCE_KEY, modeKey);
          } catch (_) {}
          try {
            const url = new URL(location.href);
            url.searchParams.set("mode", modeKey);
            history.replaceState(null, "", url);
          } catch (_) {}
        }

        function persistView(view) {
          try {
            localStorage.setItem(VIEW_PREFERENCE_KEY, view);
          } catch (_) {}
          try {
            const url = new URL(location.href);
            url.searchParams.set("view", view);
            history.replaceState(null, "", url);
          } catch (_) {}
        }

        function activateView(view, initial = false) {
          if (view !== "share" && view !== "absolute") return;
          if (!initial && view === activeView) return;

          activeView = view;
          viewButtons.forEach((button) => {
            button.setAttribute(
              "aria-selected",
              String(button.dataset.view === view),
            );
          });
          persistView(view);
          renderActiveRows();
        }

        async function activateMode(modeKey, initial = false) {
          if (!Object.hasOwn(modes, modeKey)) return;
          if (!initial && modeKey === activeMode && activeRows.length) return;

          const token = ++requestToken;
          modeButtons.forEach((button) => {
            button.setAttribute(
              "aria-selected",
              String(button.dataset.mode === modeKey),
            );
          });
          setBusy(true);
          setStatus(`Loading ${modes[modeKey].name}…`);

          try {
            const rows = await fetchMode(modeKey, (completed, total) => {
              if (token !== requestToken) return;
              setStatus(
                `Loading ${modes[modeKey].button} · ${completed}/${total} series`,
              );
            });
            if (token !== requestToken) return;
            applyRows(modeKey, rows);
            persistMode(modeKey);
            setStatus("");
          } catch (error) {
            if (token !== requestToken) return;
            console.error(error);
            setStatus(
              `Could not load ${modes[modeKey].button}. Check the connection and try again.`,
              true,
            );
            modeButtons.forEach((button) => {
              button.setAttribute(
                "aria-selected",
                String(button.dataset.mode === activeMode),
              );
            });
          } finally {
            if (token === requestToken) setBusy(false);
          }
        }

        chart.subscribeCrosshairMove((parameter) => {
          if (
            !parameter.time ||
            !parameter.point ||
            parameter.point.x < 0 ||
            parameter.point.y < 0
          ) {
            updateReadout(latestRow);
            highlightBand();
            return;
          }

          const row = rowsByTime.get(timeKey(parameter.time));
          if (!row) return;
          updateReadout(row);

          const percent = waveSeries.coordinateToPrice(parameter.point.y);
          const index = row.values.findIndex(
            (upper, rangeIndex) =>
              rangeIndex > 0 && percent <= upper && percent >= row.values[rangeIndex - 1],
          );
          highlightBand(index - 1);
        });

        modeControlsElement.addEventListener("click", (event) => {
          const button = event.target.closest("button[data-mode]");
          if (!button || button.disabled) return;
          activateMode(button.dataset.mode);
        });

        viewControlsElement.addEventListener("click", (event) => {
          const button = event.target.closest("button[data-view]");
          if (!button || button.disabled) return;
          activateView(button.dataset.view);
        });

        function initialMode() {
          const queryMode = new URLSearchParams(location.search).get("mode");
          if (Object.hasOwn(modes, queryMode)) return queryMode;
          try {
            const stored = localStorage.getItem(PREFERENCE_KEY);
            if (Object.hasOwn(modes, stored)) return stored;
          } catch (_) {}
          return "supply";
        }

        function initialView() {
          const queryView = new URLSearchParams(location.search).get("view");
          if (queryView === "absolute" || queryView === "share") {
            return queryView;
          }
          try {
            const stored = localStorage.getItem(VIEW_PREFERENCE_KEY);
            if (stored === "absolute" || stored === "share") return stored;
          } catch (_) {}
          return "share";
        }

        buildLegend();
        activateView(initialView(), true);
        activateMode(initialMode(), true);
      }

      if (document.readyState === "complete") start();
      else window.addEventListener("load", start, { once: true });
    </script>
  </body>
</html>
