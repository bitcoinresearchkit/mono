loaders:
  - type: python
    search_path: [.]
    modules: [bitview_client]

processors:
  - type: filter
    expression: name in ('BitviewClient', 'BitviewError', 'SeriesData', 'DateSeriesData', 'SeriesEndpoint', 'DateSeriesEndpoint', 'bitview_client') or (obj.parent and obj.parent.name == 'BitviewClient')
    documented_only: false

renderer:
  type: markdown
  render_toc: true
