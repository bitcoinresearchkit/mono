<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Different ways to explore and understand Bitcoin."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>bitview</title>
    <style>
      :root {
        color-scheme: dark;
        --black: #0a0a0a;
        --white: #f1eee7;
        --orange: #f7931a;
        --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 20rem;
        background: var(--black);
        scrollbar-color: #3a3a3a var(--black);
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--white);
        background: var(--black);
      }

      button,
      a {
        color: inherit;
        font: inherit;
      }

      button {
        border: 0;
      }

      a {
        text-decoration: none;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      #surface {
        position: relative;
        width: 100%;
        min-height: 100svh;
        overflow: clip;
        background: var(--black);
        isolation: isolate;
      }

      .card {
        position: absolute;
        top: 0;
        left: 0;
        container-type: size;
        overflow: hidden;
        color: var(--ink);
        background: var(--hard-color);
        box-shadow:
          inset 0 0 0 0.5px rgb(255 255 255 / 0.14),
          inset 0 0 0 1px rgb(0 0 0 / 0.12);
        transform-origin: center;
        transition:
          width 280ms var(--ease),
          height 280ms var(--ease),
          transform 280ms var(--ease),
          filter 180ms ease;
        will-change: width, height, transform;
      }

      .card::before {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: linear-gradient(
          180deg,
          rgb(0 0 0 / 0.08),
          transparent 36%,
          rgb(0 0 0 / 0.28)
        );
        content: "";
        pointer-events: none;
      }

      .card[data-light]::before {
        background: linear-gradient(
          180deg,
          rgb(255 255 255 / 0.04),
          transparent 40%,
          rgb(255 255 255 / 0.2)
        );
      }

      .card.is-direct {
        z-index: 80;
        transition: filter 180ms ease;
      }

      .card.is-active {
        filter: saturate(1.08) brightness(1.04);
        box-shadow:
          inset 0 0 0 1px rgb(255 255 255 / 0.55),
          0 1rem 3rem rgb(0 0 0 / 0.35);
      }

      .preview {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        opacity: 0;
        transform: scale(1.015);
        transition:
          opacity 480ms ease,
          transform 700ms var(--ease);
        pointer-events: none;
      }

      .card.is-preview-ready .preview {
        opacity: 0.82;
        transform: scale(1);
      }

      .card:hover .preview,
      .card.is-active .preview {
        opacity: 0.96;
        transform: scale(1.025);
      }

      .card-link {
        position: absolute;
        inset: 0;
        z-index: 3;
        touch-action: pan-y;
      }

      .drag-handle {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        z-index: 6;
        display: flex;
        min-height: 3.5rem;
        align-items: center;
        justify-content: space-between;
        padding: 0.8rem 0.95rem 0.75rem 1rem;
        cursor: grab;
        touch-action: none;
      }

      .drag-handle:active,
      .card.is-active .drag-handle {
        cursor: grabbing;
      }

      .drag-handle:focus-visible,
      .open-link:focus-visible,
      .resize-handle:focus-visible,
      .card-links a:focus-visible,
      .card-links button:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: -4px;
      }

      .label,
      .card-links,
      .live-number {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        font-variant-numeric: tabular-nums;
      }

      .label {
        overflow: hidden;
        max-width: calc(100% - 3rem);
        color: var(--muted);
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .open-link {
        position: relative;
        z-index: 2;
        display: grid;
        width: 2.4rem;
        height: 2.4rem;
        flex: 0 0 auto;
        border-radius: 50%;
        place-items: center;
        background: rgb(255 255 255 / 0.08);
        font-size: 1rem;
        transition:
          background 150ms ease,
          transform 150ms ease;
      }

      [data-light] .open-link {
        background: rgb(0 0 0 / 0.07);
      }

      .open-link:hover {
        background: rgb(255 255 255 / 0.18);
        transform: translate(0.08rem, -0.08rem);
      }

      [data-light] .open-link:hover {
        background: rgb(0 0 0 / 0.14);
      }

      .card-copy {
        position: absolute;
        right: clamp(1rem, 4cqw, 2rem);
        bottom: clamp(1rem, 4cqw, 2rem);
        left: clamp(1rem, 4cqw, 2rem);
        z-index: 5;
        pointer-events: none;
      }

      .card-title {
        max-width: 11ch;
        margin: 0;
        font-size: clamp(1.7rem, 11cqw, 4.6rem);
        font-weight: 570;
        line-height: 0.88;
        letter-spacing: -0.07em;
        text-wrap: balance;
      }

      .card-description {
        max-width: 32rem;
        margin: 0.65rem 0 0;
        color: var(--muted);
        font-size: clamp(0.7rem, 2.4cqw, 0.86rem);
        line-height: 1.4;
      }

      .identity .card-title {
        max-width: 8ch;
      }

      .card-links {
        display: flex;
        margin-top: 1rem;
        gap: 0.9rem;
        color: var(--muted);
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.07em;
        pointer-events: auto;
        text-transform: uppercase;
      }

      .card-links button,
      .card-links a {
        padding: 0;
        color: inherit;
        background: none;
        cursor: pointer;
      }

      .card-links button:hover,
      .card-links a:hover {
        color: var(--ink);
      }

      .live-number {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 4;
        max-width: calc(100% - 2rem);
        overflow: hidden;
        font-size: clamp(2.3rem, 16cqw, 7rem);
        font-weight: 600;
        line-height: 0.8;
        letter-spacing: -0.1em;
        text-overflow: clip;
        transform: translate(-50%, -52%);
        white-space: nowrap;
      }

      .resize-handle {
        position: absolute;
        right: 0;
        bottom: 0;
        z-index: 7;
        width: 3.25rem;
        height: 3.25rem;
        padding: 0;
        color: var(--ink);
        background: transparent;
        cursor: nwse-resize;
        opacity: 0.58;
        touch-action: none;
        transition: opacity 150ms ease;
      }

      .resize-handle::before,
      .resize-handle::after {
        position: absolute;
        right: 0.72rem;
        bottom: 0.72rem;
        width: 0.85rem;
        height: 0.85rem;
        border-right: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        content: "";
      }

      .resize-handle::after {
        right: 1.05rem;
        bottom: 1.05rem;
        width: 0.35rem;
        height: 0.35rem;
      }

      .card:hover .resize-handle,
      .card.is-active .resize-handle,
      .resize-handle:focus-visible {
        opacity: 1;
      }

      #grid-overlay {
        position: absolute;
        inset: 0;
        z-index: 100;
        width: 100%;
        height: 100%;
        mix-blend-mode: difference;
        pointer-events: none;
      }

      #ghost {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 55;
        display: none;
        background: rgb(255 255 255 / 0.08);
        box-shadow: inset 0 0 0 2px rgb(255 255 255 / 0.7);
        transition:
          width 110ms ease,
          height 110ms ease,
          transform 110ms ease;
        pointer-events: none;
      }

      #ghost[data-visible] {
        display: block;
      }

      #surface[data-editing] .card:not(.is-active) {
        filter: brightness(0.88);
      }

      noscript {
        display: block;
        padding: 2rem;
        color: var(--white);
      }

      noscript a {
        text-decoration: underline;
      }

      @container (max-width: 250px) {
        .card-title {
          font-size: clamp(1.45rem, 13cqw, 2.35rem);
        }

        .card-description {
          display: none;
        }

        .drag-handle {
          padding-left: 0.8rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card,
        .preview,
        .open-link,
        #ghost {
          transition-duration: 0ms;
        }
      }
    </style>
  </head>
  <body>
    <p id="interaction-help" class="visually-hidden">
      Drag a card by its top edge. Resize it from its lower-right corner. Use
      arrow keys on either control for keyboard movement and resizing.
    </p>

    <main id="surface" aria-label="Bitview pages">
      <div id="ghost" aria-hidden="true"></div>
      <canvas id="grid-overlay" aria-hidden="true"></canvas>
    </main>

    <noscript>
      JavaScript is required for the movable grid. Pages remain directly
      available: <a href="./floor.html">Floor</a>,
      <a href="./trail.html">Trail</a>,
      <a href="./events.html">Events</a>,
      <a href="./wave.html">Wave</a>,
      <a href="./bedrock.html">Bedrock</a>,
      <a href="./sentiment.html">Sentiment</a>,
      <a href="./rarity.html">Rarity</a>,
      <a href="./brk.html">BRK</a>,
      <a href="./height.html">Height</a>, and
      <a href="./api.html">API</a>.
    </noscript>

    <script>
      const cards = [
        {
          id: "identity",
          label: "bitview",
          title: "One dataset. Many views.",
          color: "#eeeae1",
          ink: "#121212",
          muted: "#68635b",
          light: true,
          sizes: { 16: [7, 3], 12: [5, 3], 8: [4, 3], 4: [4, 3] },
        },
        {
          id: "current",
          label: "Current",
          title: "Explore.",
          description: "Charts · blocks · transactions",
          href: "https://bitview.space/",
          color: "#171717",
          ink: "#f1eee7",
          muted: "#aaa59c",
          sizes: { 16: [9, 3], 12: [7, 3], 8: [4, 3], 4: [4, 3] },
        },
        {
          id: "floor",
          label: "Research",
          title: "Finding the floor.",
          description: "A downside reference with economic meaning",
          href: "./floor.html",
          color: "#efd65b",
          ink: "#15130c",
          muted: "#5d501f",
          light: true,
          sizes: { 16: [9, 3], 12: [7, 3], 8: [5, 3], 4: [4, 3] },
        },
        {
          id: "trail",
          label: "Story",
          title: "Satoshi trail.",
          description: "Bitcoin through time and space",
          href: "./trail.html",
          color: "#e6e0d4",
          ink: "#171512",
          muted: "#686158",
          light: true,
          sizes: { 16: [7, 3], 12: [5, 3], 8: [3, 3], 4: [4, 3] },
        },
        {
          id: "events",
          label: "Signals",
          title: "Extreme events.",
          description: "On-chain markers across price history",
          href: "./events.html",
          color: "#28191b",
          ink: "#f5e9e5",
          muted: "#c59b94",
          sizes: { 16: [5, 3], 12: [4, 3], 8: [3, 3], 4: [2, 3] },
        },
        {
          id: "wave",
          label: "Distribution",
          title: "HODL wave.",
          description: "Supply aging in motion",
          href: "./wave.html",
          color: "#10283a",
          ink: "#eef5f8",
          muted: "#9bb6c8",
          sizes: { 16: [7, 3], 12: [5, 3], 8: [3, 3], 4: [2, 3] },
        },
        {
          id: "next",
          label: "Next · in progress",
          title: "Ask.",
          description: "A more human interface",
          color: "#181818",
          ink: "#f1eee7",
          muted: "#a09c94",
          sizes: { 16: [4, 3], 12: [3, 3], 8: [2, 3], 4: [4, 2] },
        },
        {
          id: "bedrock",
          label: "Model",
          title: "Bedrock.",
          description: "A learned lower bound",
          href: "./bedrock.html",
          color: "#08263a",
          ink: "#edf7fb",
          muted: "#8cb8cf",
          sizes: { 16: [4, 2], 12: [4, 2], 8: [4, 2], 4: [2, 2] },
        },
        {
          id: "sentiment",
          label: "Phases",
          title: "Sentiment.",
          description: "Capital structure as market phase",
          href: "./sentiment.html",
          color: "#392027",
          ink: "#faedf0",
          muted: "#d2a0ad",
          sizes: { 16: [4, 2], 12: [4, 2], 8: [4, 2], 4: [2, 2] },
        },
        {
          id: "rarity",
          label: "Context",
          title: "Rarity.",
          description: "How unusual is today?",
          href: "./rarity.html",
          color: "#29203c",
          ink: "#f3eefc",
          muted: "#b7a4dc",
          sizes: { 16: [4, 2], 12: [4, 2], 8: [4, 2], 4: [2, 2] },
        },
        {
          id: "brk",
          label: "Toolkit",
          title: "BRK.",
          description: "Read · compute · serve",
          href: "./brk.html",
          color: "#131313",
          ink: "#f2efe8",
          muted: "#aaa59d",
          sizes: { 16: [4, 2], 12: [4, 2], 8: [4, 2], 4: [2, 2] },
        },
        {
          id: "height",
          label: "One number",
          title: "Height.",
          href: "./height.html",
          color: "#f7931a",
          ink: "#17100a",
          muted: "#603a14",
          light: true,
          sizes: { 16: [8, 2], 12: [4, 2], 8: [4, 2], 4: [2, 2] },
        },
        {
          id: "api",
          label: "Reference",
          title: "API.",
          href: "./api.html",
          color: "#111d18",
          ink: "#edf8f1",
          muted: "#8bb39a",
          sizes: { 16: [8, 2], 12: [4, 2], 8: [4, 2], 4: [2, 2] },
        },
      ];

      const surface = document.querySelector("#surface");
      const gridCanvas = document.querySelector("#grid-overlay");
      const ghost = document.querySelector("#ghost");
      const cardElements = new Map();
      const STORAGE_KEY = "bitview-bento-layout-v2";
      const MIN_SIZE = 2;
      let columns = columnCount();
      let cell = 1;
      let layout = restoreLayout(columns) ?? defaultLayout(columns);
      let interaction;
      let pointerFrame;
      let resizeFrame;

      function columnCount() {
        const width = document.documentElement.clientWidth;
        if (width >= 1440) return 16;
        if (width >= 900) return 12;
        if (width >= 600) return 8;
        return 4;
      }

      function overlaps(a, b) {
        return (
          a.x < b.x + b.w &&
          a.x + a.w > b.x &&
          a.y < b.y + b.h &&
          a.y + a.h > b.y
        );
      }

      function firstAvailable(items, w, h, columnTotal) {
        for (let y = 0; ; y += 1) {
          for (let x = 0; x <= columnTotal - w; x += 1) {
            const candidate = { x, y, w, h };
            if (!items.some((item) => overlaps(candidate, item))) {
              return candidate;
            }
          }
        }
      }

      function defaultLayout(columnTotal) {
        const items = [];

        for (const card of cards) {
          const [w, h] = card.sizes[columnTotal];
          items.push({ id: card.id, ...firstAvailable(items, w, h, columnTotal) });
        }

        return items;
      }

      function cloneLayout(items) {
        return items.map((item) => ({ ...item }));
      }

      function validLayout(items, columnTotal) {
        if (!Array.isArray(items) || items.length !== cards.length) return false;
        const ids = new Set(items.map((item) => item.id));
        if (ids.size !== cards.length || cards.some((card) => !ids.has(card.id))) {
          return false;
        }

        return items.every(
          (item, index) =>
            Number.isInteger(item.x) &&
            Number.isInteger(item.y) &&
            Number.isInteger(item.w) &&
            Number.isInteger(item.h) &&
            item.x >= 0 &&
            item.y >= 0 &&
            item.w >= MIN_SIZE &&
            item.h >= MIN_SIZE &&
            item.x + item.w <= columnTotal &&
            !items.slice(index + 1).some((other) => overlaps(item, other)),
        );
      }

      function storedLayouts() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) ?? "{}") ?? {};
        } catch {
          return {};
        }
      }

      function restoreLayout(columnTotal) {
        const candidate = storedLayouts()[columnTotal];
        return validLayout(candidate, columnTotal) ? candidate : undefined;
      }

      function saveLayout() {
        try {
          const stored = storedLayouts();
          stored[columns] = layout;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
        } catch {}
      }

      function createCard(card) {
        const article = document.createElement("article");
        article.className = `card ${card.id}`;
        article.dataset.id = card.id;
        article.style.setProperty("--hard-color", card.color);
        article.style.setProperty("--ink", card.ink);
        article.style.setProperty("--muted", card.muted);
        article.setAttribute("aria-label", card.title);
        if (card.light) article.dataset.light = "";

        const canvas = document.createElement("canvas");
        canvas.className = "preview";
        canvas.setAttribute("aria-hidden", "true");
        article.append(canvas);

        if (card.href) {
          const cardLink = document.createElement("a");
          cardLink.className = "card-link";
          cardLink.href = card.href;
          cardLink.setAttribute("aria-label", `Open ${card.title}`);
          article.append(cardLink);
        }

        const handle = document.createElement("div");
        handle.className = "drag-handle";
        handle.tabIndex = 0;
        handle.setAttribute("role", "button");
        handle.setAttribute("aria-label", `Move ${card.title}`);
        handle.setAttribute("aria-describedby", "interaction-help");

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = card.label;
        handle.append(label);

        if (card.href) {
          const open = document.createElement("a");
          open.className = "open-link";
          open.href = card.href;
          open.textContent = "↗";
          open.setAttribute("aria-label", `Open ${card.title}`);
          handle.append(open);
        }

        const copy = document.createElement("div");
        copy.className = "card-copy";
        const title = document.createElement("h2");
        title.className = "card-title";
        title.textContent = card.title;
        copy.append(title);

        if (card.description) {
          const description = document.createElement("p");
          description.className = "card-description";
          description.textContent = card.description;
          copy.append(description);
        }

        if (card.id === "identity") {
          const links = document.createElement("div");
          links.className = "card-links";
          links.innerHTML = `
            <a href="https://github.com/bitcoinresearchkit/brk">Source</a>
            <a href="https://bitview.space/llms.txt">Text</a>
            <button type="button" data-reset>Reset grid</button>
          `;
          copy.append(links);
        }

        if (card.id === "height") {
          const number = document.createElement("output");
          number.className = "live-number";
          number.id = "height-live";
          number.setAttribute("aria-label", "Latest indexed block");
          number.textContent = "—";
          article.append(number);
        }

        const resize = document.createElement("button");
        resize.className = "resize-handle";
        resize.type = "button";
        resize.setAttribute("aria-label", `Resize ${card.title}`);
        resize.setAttribute("aria-describedby", "interaction-help");

        article.append(handle, copy, resize);
        handle.addEventListener("pointerdown", (event) =>
          startInteraction(event, card.id, "move"),
        );
        resize.addEventListener("pointerdown", (event) =>
          startInteraction(event, card.id, "resize"),
        );
        handle.addEventListener("keydown", (event) =>
          handleKeyboard(event, card.id, "move"),
        );
        resize.addEventListener("keydown", (event) =>
          handleKeyboard(event, card.id, "resize"),
        );

        cardElements.set(card.id, article);
        surface.append(article);
      }

      for (const card of cards) createCard(card);

      document.querySelector("[data-reset]").addEventListener("click", () => {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch {}
        layout = defaultLayout(columns);
        renderLayout(layout);
        flashGrid();
      });

      function layoutRows(items) {
        return items.reduce((max, item) => Math.max(max, item.y + item.h), 0);
      }

      function renderLayout(items, skippedId) {
        cell = surface.clientWidth / columns;
        const rows = Math.max(
          layoutRows(items),
          Math.ceil(window.innerHeight / cell),
        );
        surface.style.height = `${rows * cell}px`;

        for (const item of items) {
          if (item.id === skippedId) continue;
          const element = cardElements.get(item.id);
          element.style.width = `${item.w * cell}px`;
          element.style.height = `${item.h * cell}px`;
          element.style.transform = `translate3d(${item.x * cell}px, ${item.y * cell}px, 0)`;
        }

        drawGrid(interaction?.target);
      }

      function displace(items, activeId) {
        const result = cloneLayout(items);
        const active = result.find((item) => item.id === activeId);
        const queue = [active];
        let checks = 0;

        while (queue.length && checks < 2000) {
          const mover = queue.shift();
          for (const other of result) {
            checks += 1;
            if (other.id === activeId || other.id === mover.id) continue;
            if (!overlaps(mover, other)) continue;
            other.y = mover.y + mover.h;
            queue.push(other);
          }
        }

        return result;
      }

      function compact(items, lockedId) {
        const source = cloneLayout(items);
        const locked = source.find((item) => item.id === lockedId);
        const placed = locked ? [{ ...locked }] : [];
        const rest = source
          .filter((item) => item.id !== lockedId)
          .sort((a, b) => a.y - b.y || a.x - b.x);

        for (const item of rest) {
          let y = 0;
          while (placed.some((other) => overlaps({ ...item, y }, other))) y += 1;
          placed.push({ ...item, y });
        }

        return placed;
      }

      function targetLayout(base, activeId, target) {
        const next = cloneLayout(base);
        Object.assign(
          next.find((item) => item.id === activeId),
          target,
        );
        return displace(next, activeId);
      }

      function startInteraction(event, id, type) {
        if (
          event.button !== 0 ||
          (type === "move" && event.target.closest("a, button"))
        ) {
          return;
        }
        event.preventDefault();
        const item = layout.find((entry) => entry.id === id);
        const element = cardElements.get(id);
        const capture = event.currentTarget;
        capture.setPointerCapture(event.pointerId);
        interaction = {
          id,
          type,
          pointerId: event.pointerId,
          capture,
          startX: event.clientX,
          startY: event.clientY,
          startItem: { ...item },
          base: cloneLayout(layout),
          working: cloneLayout(layout),
          target: { ...item },
          latestX: event.clientX,
          latestY: event.clientY,
          snapKey: "",
        };
        element.classList.add("is-active", "is-direct");
        surface.dataset.editing = "";
        ghost.dataset.visible = "";
        updatePointer();
      }

      surface.addEventListener("pointermove", (event) => {
        if (!interaction || event.pointerId !== interaction.pointerId) return;
        interaction.latestX = event.clientX;
        interaction.latestY = event.clientY;
        if (!pointerFrame) pointerFrame = requestAnimationFrame(updatePointer);
      });

      surface.addEventListener("pointerup", finishInteraction);
      surface.addEventListener("pointercancel", cancelInteraction);

      function updatePointer() {
        pointerFrame = undefined;
        if (!interaction) return;
        const element = cardElements.get(interaction.id);
        const { startItem } = interaction;
        const dx = interaction.latestX - interaction.startX;
        const dy = interaction.latestY - interaction.startY;

        if (interaction.type === "move") {
          const left = Math.max(
            0,
            Math.min((columns - startItem.w) * cell, startItem.x * cell + dx),
          );
          const top = Math.max(0, startItem.y * cell + dy);
          interaction.target = {
            ...startItem,
            x: Math.round(left / cell),
            y: Math.round(top / cell),
          };
          element.style.transform = `translate3d(${left}px, ${top}px, 0)`;
        } else {
          const width = Math.max(
            MIN_SIZE * cell,
            Math.min(
              (columns - startItem.x) * cell,
              startItem.w * cell + dx,
            ),
          );
          const height = Math.max(MIN_SIZE * cell, startItem.h * cell + dy);
          interaction.target = {
            ...startItem,
            w: Math.max(MIN_SIZE, Math.round(width / cell)),
            h: Math.max(MIN_SIZE, Math.round(height / cell)),
          };
          element.style.width = `${width}px`;
          element.style.height = `${height}px`;
        }

        const target = interaction.target;
        const key = `${target.x}:${target.y}:${target.w}:${target.h}`;
        positionGhost(target);

        if (key !== interaction.snapKey) {
          interaction.snapKey = key;
          interaction.working = targetLayout(
            interaction.base,
            interaction.id,
            target,
          );
          renderLayout(interaction.working, interaction.id);
        } else {
          drawGrid(target);
        }
      }

      function positionGhost(item) {
        ghost.style.width = `${item.w * cell}px`;
        ghost.style.height = `${item.h * cell}px`;
        ghost.style.transform = `translate3d(${item.x * cell}px, ${item.y * cell}px, 0)`;
      }

      function finishInteraction(event) {
        if (!interaction || event.pointerId !== interaction.pointerId) return;
        const finished = interaction;
        finished.capture.releasePointerCapture(event.pointerId);
        layout = compact(finished.working, finished.id);
        interaction = undefined;
        delete surface.dataset.editing;
        delete ghost.dataset.visible;
        const element = cardElements.get(finished.id);
        element.classList.remove("is-active", "is-direct");
        requestAnimationFrame(() => renderLayout(layout));
        saveLayout();
      }

      function cancelInteraction(event) {
        if (!interaction || event.pointerId !== interaction.pointerId) return;
        const cancelled = interaction;
        layout = cancelled.base;
        interaction = undefined;
        delete surface.dataset.editing;
        delete ghost.dataset.visible;
        cardElements
          .get(cancelled.id)
          .classList.remove("is-active", "is-direct");
        renderLayout(layout);
      }

      function handleKeyboard(event, id, type) {
        const delta = {
          ArrowLeft: [-1, 0],
          ArrowRight: [1, 0],
          ArrowUp: [0, -1],
          ArrowDown: [0, 1],
        }[event.key];
        if (!delta) return;
        event.preventDefault();
        const item = layout.find((entry) => entry.id === id);
        const target = { ...item };

        if (type === "move") {
          target.x = Math.max(
            0,
            Math.min(columns - item.w, item.x + delta[0]),
          );
          target.y = Math.max(0, item.y + delta[1]);
        } else {
          target.w = Math.max(
            MIN_SIZE,
            Math.min(columns - item.x, item.w + delta[0]),
          );
          target.h = Math.max(MIN_SIZE, item.h + delta[1]);
        }

        layout = compact(targetLayout(layout, id, target), id);
        renderLayout(layout);
        saveLayout();
        flashGrid(target);
      }

      let flashTimer;
      function flashGrid(target) {
        surface.dataset.editing = "";
        drawGrid(target);
        clearTimeout(flashTimer);
        flashTimer = setTimeout(() => {
          delete surface.dataset.editing;
          drawGrid();
        }, 420);
      }

      function drawGrid(target) {
        const width = surface.clientWidth;
        const height = surface.offsetHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        gridCanvas.width = Math.round(width * dpr);
        gridCanvas.height = Math.round(height * dpr);
        gridCanvas.style.width = `${width}px`;
        gridCanvas.style.height = `${height}px`;
        const context = gridCanvas.getContext("2d");
        context.setTransform(dpr, 0, 0, dpr, 0, 0);
        context.clearRect(0, 0, width, height);
        const editing = surface.hasAttribute("data-editing");
        const rows = Math.ceil(height / cell);

        context.fillStyle = editing
          ? "rgba(255,255,255,0.82)"
          : "rgba(255,255,255,0.46)";

        for (let y = 0; y <= rows; y += 1) {
          for (let x = 0; x <= columns; x += 1) {
            context.beginPath();
            context.arc(
              Math.min(width - 0.5, x * cell),
              Math.min(height - 0.5, y * cell),
              editing ? 1.55 : 1.05,
              0,
              Math.PI * 2,
            );
            context.fill();
          }
        }

        if (target) {
          const x = target.x * cell;
          const y = target.y * cell;
          const w = target.w * cell;
          const h = target.h * cell;
          context.strokeStyle = "rgba(255,255,255,0.72)";
          context.lineWidth = 1;
          context.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
          context.fillStyle = "white";
          for (const [cx, cy] of [
            [x, y],
            [x + w, y],
            [x, y + h],
            [x + w, y + h],
          ]) {
            context.beginPath();
            context.arc(cx, cy, 3, 0, Math.PI * 2);
            context.fill();
          }
        }
      }

      function previewContext(card) {
        const canvas = card.querySelector("canvas");
        const rect = card.getBoundingClientRect();
        if (rect.width < 2 || rect.height < 2) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        const context = canvas.getContext("2d");
        context.setTransform(dpr, 0, 0, dpr, 0, 0);
        context.clearRect(0, 0, rect.width, rect.height);
        context.lineCap = "round";
        context.lineJoin = "round";
        return { context, width: rect.width, height: rect.height };
      }

      function strokePath(context, points, color, lineWidth = 2) {
        context.beginPath();
        points.forEach(([x, y], index) =>
          index ? context.lineTo(x, y) : context.moveTo(x, y),
        );
        context.strokeStyle = color;
        context.lineWidth = lineWidth;
        context.stroke();
      }

      function seeded(id) {
        let value = [...id].reduce((sum, char) => sum + char.charCodeAt(0), 1);
        return () => {
          value = (value * 16807) % 2147483647;
          return (value - 1) / 2147483646;
        };
      }

      function drawPreview(card) {
        const preview = previewContext(card);
        if (!preview) return;
        const { context: ctx, width: w, height: h } = preview;
        const id = card.dataset.id;
        const random = seeded(id);
        const white = "rgba(255,255,255,0.64)";
        const black = "rgba(0,0,0,0.52)";
        const orange = "rgba(247,147,26,0.92)";

        if (id === "identity") {
          const cx = w * 0.78;
          const cy = h * 0.38;
          for (let radius = Math.min(w, h) * 0.1; radius < w * 0.42; radius += w * 0.08) {
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(0,0,0,0.10)";
            ctx.lineWidth = 1;
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.arc(cx, cy, Math.max(5, w * 0.018), 0, Math.PI * 2);
          ctx.fillStyle = orange;
          ctx.fill();
        } else if (id === "current") {
          const size = Math.min(w / 8, h / 5);
          const startX = w - size * 5.2;
          const startY = h * 0.12;
          for (let y = 0; y < 5; y += 1) {
            for (let x = 0; x < 5; x += 1) {
              ctx.fillStyle =
                (x === 1 && y === 2) || (x === 3 && y === 3)
                  ? orange
                  : "rgba(255,255,255,0.075)";
              ctx.fillRect(
                startX + x * size,
                startY + y * size,
                size - 4,
                size - 4,
              );
            }
          }
        } else if (id === "floor") {
          const floorY = h * 0.69;
          for (let index = 0; index < 7; index += 1) {
            const offset = index * h * 0.045;
            ctx.beginPath();
            ctx.moveTo(w * 0.43, h * 0.12 + offset);
            ctx.bezierCurveTo(
              w * 0.58,
              h * 0.28 + offset,
              w * 0.64,
              floorY - offset * 0.3,
              w * 0.92,
              floorY,
            );
            ctx.strokeStyle = `rgba(0,0,0,${0.1 + index * 0.045})`;
            ctx.lineWidth = index === 6 ? 3 : 1;
            ctx.stroke();
          }
          strokePath(ctx, [[w * 0.38, floorY], [w, floorY]], black, 1);
        } else if (id === "trail") {
          const points = [];
          for (let index = 0; index < 9; index += 1) {
            points.push([
              w * (0.37 + index * 0.08),
              h * (0.22 + random() * 0.5),
            ]);
          }
          strokePath(ctx, points, "rgba(0,0,0,0.42)", 2);
          for (const [x, y] of points) {
            ctx.beginPath();
            ctx.arc(x, y, 3.2, 0, Math.PI * 2);
            ctx.fillStyle = random() > 0.7 ? orange : "rgba(0,0,0,0.58)";
            ctx.fill();
          }
        } else if (id === "events") {
          const points = [];
          for (let index = 0; index <= 20; index += 1) {
            points.push([
              (w * index) / 20,
              h * (0.58 - index * 0.012 + (random() - 0.5) * 0.24),
            ]);
          }
          strokePath(ctx, points, "rgba(255,235,228,0.66)", 2);
          for (const index of [5, 9, 14, 18]) {
            const [x, y] = points[index];
            ctx.strokeStyle = "rgba(247,90,50,0.62)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x, y - h * 0.18);
            ctx.lineTo(x, y + h * 0.18);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fillStyle = orange;
            ctx.fill();
          }
        } else if (id === "wave") {
          const colors = [
            "rgba(247,147,26,0.80)",
            "rgba(225,109,50,0.62)",
            "rgba(111,170,197,0.56)",
            "rgba(61,117,153,0.62)",
            "rgba(230,238,240,0.34)",
          ];
          let baseline = h * 0.84;
          colors.forEach((color, layer) => {
            ctx.beginPath();
            ctx.moveTo(0, baseline);
            for (let x = 0; x <= w; x += w / 24) {
              const y =
                baseline -
                h * (0.08 + layer * 0.01) -
                Math.sin(x / w * Math.PI * 2 + layer) * h * 0.025;
              ctx.lineTo(x, y);
            }
            ctx.lineTo(w, baseline);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            baseline -= h * 0.105;
          });
        } else if (id === "next") {
          for (let y = h * 0.2; y < h * 0.8; y += h * 0.14) {
            for (let x = w * 0.2; x < w * 0.9; x += w * 0.18) {
              ctx.beginPath();
              ctx.arc(x, y, 1.5, 0, Math.PI * 2);
              ctx.fillStyle = "rgba(255,255,255,0.19)";
              ctx.fill();
            }
          }
          ctx.strokeStyle = "rgba(247,147,26,0.6)";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(w * 0.37, h * 0.23, w * 0.46, h * 0.19);
          ctx.strokeRect(w * 0.5, h * 0.48, w * 0.34, h * 0.15);
        } else if (id === "bedrock") {
          for (let layer = 0; layer < 5; layer += 1) {
            const y = h * (0.3 + layer * 0.105);
            const points = [];
            for (let index = 0; index <= 12; index += 1) {
              points.push([
                (w * index) / 12,
                y + (random() - 0.5) * h * 0.045,
              ]);
            }
            strokePath(
              ctx,
              points,
              layer === 4 ? orange : "rgba(173,220,239,0.34)",
              layer === 4 ? 3 : 1,
            );
          }
        } else if (id === "sentiment") {
          const colors = ["#5d3340", "#8b5540", "#bb7638", "#d6a753"];
          colors.forEach((color, index) => {
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.52;
            ctx.fillRect(
              w * (0.42 + index * 0.125),
              h * (0.18 + (index % 2) * 0.08),
              w * 0.1,
              h * (0.5 - (index % 2) * 0.08),
            );
          });
          ctx.globalAlpha = 1;
          strokePath(
            ctx,
            [[w * 0.38, h * 0.66], [w * 0.9, h * 0.25]],
            "rgba(255,240,230,0.64)",
            2,
          );
        } else if (id === "rarity") {
          const cx = w * 0.69;
          const cy = h * 0.44;
          const max = Math.min(w, h) * 0.34;
          for (let radius = max * 0.25; radius <= max; radius += max * 0.25) {
            ctx.beginPath();
            ctx.arc(cx, cy, radius, Math.PI * 0.85, Math.PI * 2.15);
            ctx.strokeStyle = "rgba(221,207,255,0.28)";
            ctx.lineWidth = 1;
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.arc(cx + max * 0.52, cy - max * 0.42, 5, 0, Math.PI * 2);
          ctx.fillStyle = orange;
          ctx.fill();
        } else if (id === "brk") {
          const nodes = [
            [w * 0.43, h * 0.28],
            [w * 0.62, h * 0.28],
            [w * 0.62, h * 0.56],
            [w * 0.82, h * 0.56],
          ];
          strokePath(ctx, nodes, "rgba(255,255,255,0.34)", 1.5);
          nodes.forEach(([x, y], index) => {
            ctx.fillStyle = index === nodes.length - 1 ? orange : white;
            ctx.fillRect(x - 5, y - 5, 10, 10);
          });
        } else if (id === "height") {
          ctx.font = `600 ${Math.max(72, h * 0.72)}px ui-monospace, monospace`;
          ctx.fillStyle = "rgba(0,0,0,0.08)";
          ctx.textAlign = "right";
          ctx.fillText("#", w * 0.96, h * 0.79);
        } else if (id === "api") {
          ctx.strokeStyle = "rgba(138,218,169,0.42)";
          ctx.lineWidth = 2;
          for (let index = 0; index < 6; index += 1) {
            const y = h * (0.2 + index * 0.1);
            ctx.beginPath();
            ctx.moveTo(w * 0.43, y);
            ctx.lineTo(w * (0.57 + random() * 0.3), y);
            ctx.stroke();
          }
          ctx.font = `500 ${Math.max(58, h * 0.52)}px ui-monospace, monospace`;
          ctx.fillStyle = "rgba(138,218,169,0.18)";
          ctx.textAlign = "right";
          ctx.fillText("{ }", w * 0.96, h * 0.72);
        }

        card.classList.add("is-preview-ready");
      }

      const previewFrames = new Map();
      function schedulePreview(card) {
        cancelAnimationFrame(previewFrames.get(card));
        previewFrames.set(
          card,
          requestAnimationFrame(() => {
            previewFrames.delete(card);
            drawPreview(card);
          }),
        );
      }

      const previewObserver = new ResizeObserver((entries) => {
        for (const entry of entries) schedulePreview(entry.target);
      });
      cardElements.forEach((card, id) => {
        previewObserver.observe(card);
        const index = cards.findIndex((definition) => definition.id === id);
        setTimeout(() => schedulePreview(card), 55 + index * 28);
      });

      function handleViewportResize() {
        resizeFrame = undefined;
        const nextColumns = columnCount();
        if (nextColumns !== columns) {
          saveLayout();
          columns = nextColumns;
          layout = restoreLayout(columns) ?? defaultLayout(columns);
        }
        renderLayout(layout);
      }

      window.addEventListener("resize", () => {
        if (!resizeFrame) resizeFrame = requestAnimationFrame(handleViewportResize);
      });

      fetch("https://bitview.space/api/server/sync")
        .then((response) => response.json())
        .then((data) => {
          document.querySelector("#height-live").textContent =
            new Intl.NumberFormat("en-US").format(data.indexed_height);
        })
        .catch(() => {});

      renderLayout(layout);
    </script>
  </body>
</html>
