    <style>
      /* craft rules */
      /* Written into every page by home.mjs: headings balance their lines and text pretties its last, so no one-word last
         lines (zero specificity, a page's own text-wrap wins); digits are equal width, so a number that changes never
         shifts what sits beside it (a face without equal-width digits, like Instrument Serif, can't: its box is fixed). */
      :where(h1, h2, h3, h4, h5, h6) {
        text-wrap: balance;
      }
      :where(p, li, dd, blockquote, figcaption) {
        text-wrap: pretty;
      }
      html body {
        font-variant-numeric: tabular-nums;
      }
      /* /craft rules */
      /* fallback fonts */
      /* Local faces keep text visible while the web fonts load. Width fits use a general Latin sample;
         vertical metrics come from Inter 4.1 and Lilex 2.620, divided by size-adjust.
         Menlo needs its full/PostScript name in Chromium. Other mono faces share its calibration. */
      @font-face {
        font-family: "Inter Fallback";
        src: local("ArialMT"), local("Arial"), local("Helvetica"), local("Roboto");
        font-weight: 100 600;
        size-adjust: 108.088066%;
        ascent-override: 89.625991%;
        descent-override: 22.316149%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: "Inter Fallback";
        src: local("Arial-BoldMT"), local("Arial Bold"), local("Helvetica Bold"), local("Roboto Bold");
        font-weight: 601 900;
        size-adjust: 99.756055%;
        ascent-override: 97.111900%;
        descent-override: 24.180080%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: "Lilex Fallback";
        src: local("Menlo"), local("Menlo-Regular"), local("SF Mono"), local("SFMono-Regular"), local("Consolas"), local("DejaVu Sans Mono"), local("Liberation Mono");
        font-weight: 500 700;
        size-adjust: 99.659367%;
        ascent-override: 100.241455%;
        descent-override: 30.202881%;
        line-gap-override: 0%;
      }
      /* /fallback fonts */

      @font-face {
        font-family: Inter;
        src: url("/assets/fonts/InterVariable.core.woff2") format("woff2");
        unicode-range: U+0000-017F, U+0192, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0394, U+03A3, U+03C3, U+2000-206F, U+20AC, U+20BF, U+2122, U+2190-23FF, U+2500-25FF, U+2713-2715, U+FE0E-FE0F, U+FEFF, U+FFFD;
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: Inter;
        src: url("/assets/fonts/InterVariable.rest.woff2") format("woff2");
        unicode-range: U+0180-0191, U+0193-02BA, U+02BD-02C5, U+02C7-02D9, U+02DB, U+02DD-0393, U+0395-03A1, U+03A4-03C2, U+03C4-03DD, U+03F0-04FF, U+052F, U+0E3F, U+1D00-1D1B, U+1D43-1D65, U+1D9C-1DA0, U+1DBB-1FFE, U+2070-20AB, U+20AD-20BE, U+20C0, U+20DB-2121, U+2126-213B, U+214D-2189, U+2423, U+2460-2468, U+24B6-24CF, U+24EA, U+2600-2606, U+263C, U+2661-266B, U+26A0, U+2717, U+2756-2764, U+2780-2788, U+27EF-27FA, U+2913, U+2A38, U+2B06-2B24, U+2C7C-2C7F, U+2DFF, U+2E18, U+A69F, U+A7FF, U+A92E, U+E000-E0F5, U+E106-E163, U+E1C3-E2DC, U+EE01-EEE1, U+F6C3, U+1F12F-1F149, U+1F16A-1F16B, U+1F850-1F852;
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: Lilex;
        src: url("/assets/fonts/Lilex.core.woff2") format("woff2");
        unicode-range: U+0000-017F, U+0192, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0394, U+03A3, U+03C3, U+2000-206F, U+20AC, U+20BF, U+2122, U+2190-23FF, U+2500-25FF, U+2713-2715, U+FE0E-FE0F, U+FEFF, U+FFFD;
        font-weight: 100 700;
        font-display: swap;
      }
      @font-face {
        font-family: Lilex;
        src: url("/assets/fonts/Lilex.rest.woff2") format("woff2");
        unicode-range: U+018F, U+01A0-01B0, U+01CD-01FF, U+0218-021B, U+0237, U+0259, U+02C7, U+02D8-02D9, U+02DB, U+02DD, U+0300-0328, U+037E-0393, U+0395-03A1, U+03A4-03C2, U+03C4-03CE, U+0400-0475, U+0490-04F9, U+0524-0525, U+0E3F, U+1E28-1E29, U+1E80-1E85, U+1E9E-1EF9, U+2070-2089, U+20A1-20AB, U+20AD-20BD, U+2113-2116, U+2126-212E, U+2150-215E, U+2B0E-2B11, U+2B58, U+3000, U+E0A0-E0B3;
        font-weight: 100 700;
        font-display: swap;
      }

      :root {
        color-scheme: light dark;
        --app: light-dark(#fbfaf7, #0e0f11);
        --dot: light-dark(#f5f3ed, #23262c);
        --pane: light-dark(#ffffff, #141519);
        --well: light-dark(#f3f1ec, #1b1d22);
        --ink: light-dark(#17181b, #eceae5);
        --soft: light-dark(#53565e, #a9acb4);
        --faint: light-dark(#6c6f77, #8c9099);
        --line: light-dark(#e7e4dd, #24262c);
        --line-strong: light-dark(#d6d2c9, #33363e);
        --accent: light-dark(#d4570a, #f2873a);
        --accent-ink: light-dark(#9c3d00, #ffb27a);
        --pick: light-dark(#fbe9dc, #33221a);
        --pick-strong: light-dark(#f6d7bf, #47291a);
        --trail: light-dark(#efece5, #212329);
        --solid: #c24e06;
        --hover: light-dark(#f4f1ea, #1c1e23);
        --raise: light-dark(#ffffff, #2b2d34);
        --plot: light-dark(#d4570a, #f2873a);
        --grid: light-dark(#eeebe4, #1f2126);
        --sans: Inter, "Inter Fallback", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: Lilex, "Lilex Fallback", ui-monospace, SFMono-Regular, Menlo, monospace;
        --radius: 10px;
        --plot-height: 300px;
      }

      /* Increase Contrast: written out here as plain colours, so the canvases read them too. */
      @media (prefers-contrast: more) {
        :root {
          --soft: light-dark(#3a3c42, #c3c4c7);
          --faint: light-dark(#515359, #a8aaaf);
          --line: light-dark(#c4c1bc, #3e3f44);
          --line-strong: light-dark(#b6b3ac, #4b4e55);
          --grid: light-dark(#c9c7c2, #393b3f);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--app) radial-gradient(circle, var(--dot) 1px, transparent 1.2px) 0 0 / 16px 16px;
        color: var(--ink);
        font: 14px/1.5 var(--sans);
        font-feature-settings: "cv11", "ss01";
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
        color: inherit;
      }

      button {
        border: 0;
        background: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      a {
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
        border-radius: 6px;
      }

      [hidden] {
        display: none !important;
      }

      code,
      .mono {
        font-family: var(--mono);
        font-size: 0.92em;
      }

      .num {
        font-variant-numeric: tabular-nums;
      }

      .bar {
        position: sticky;
        top: 0;
        z-index: 3;
        display: grid;
        grid-template-columns: minmax(110px, 1fr) minmax(0, 560px) minmax(110px, 1fr);
        align-items: center;
        gap: 16px;
        height: 56px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        background: var(--pane);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 600;
        letter-spacing: -0.01em;
        text-decoration: none;
        white-space: nowrap;

        img {
          width: 20px;
          height: 20px;
        }
      }

      .search {
        position: relative;

        svg {
          position: absolute;
          top: 50%;
          left: 11px;
          width: 16px;
          height: 16px;
          translate: 0 -50%;
          color: var(--faint);
          pointer-events: none;
        }

        .reach {
          display: none;
        }

        input {
          width: 100%;
          height: 36px;
          padding: 0 40px 0 34px;
          border: 1px solid var(--line);
          border-radius: 9px;
          background: var(--well);
          outline: none;

          &::placeholder {
            color: var(--faint);
          }

          &:focus {
            border-color: var(--accent);
            background: var(--pane);
            box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent);
          }

          &::-webkit-search-cancel-button {
            display: none;
          }
        }

        kbd {
          position: absolute;
          top: 50%;
          right: 9px;
          translate: 0 -50%;
          min-width: 20px;
          padding: 1px 6px;
          border: 1px solid var(--line-strong);
          border-radius: 5px;
          color: light-dark(#696c74, var(--faint));
          font: 11px var(--mono);
          text-align: center;
          pointer-events: none;
        }

        input:focus ~ kbd,
        input:not(:placeholder-shown) ~ kbd {
          display: none;
        }

        .clear {
          position: absolute;
          top: 50%;
          right: 4px;
          display: none;
          place-items: center;
          width: 28px;
          height: 28px;
          translate: 0 -50%;
          border-radius: 7px;
          color: var(--faint);

          &:hover {
            color: var(--ink);
          }

          svg {
            position: static;
            translate: none;
            width: 16px;
            height: 16px;
            color: inherit;
          }
        }

        input:not(:placeholder-shown) ~ .clear {
          display: grid;
        }
      }

      @media (hover: none) {
        .search kbd,
        .keys {
          display: none;
        }
      }

      main {
        position: relative;
        display: flex;
        min-width: 0;
        min-height: 0;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scroll-snap-type: x mandatory;
      }

      .column {
        flex: none;
        display: flex;
        flex-direction: column;
        width: 252px;
        min-height: 0;
        border-right: 1px solid var(--line);
        background: var(--pane);
        scroll-snap-align: start;

        h2 {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 10px;
          margin: 0;
          padding: 12px 14px 9px;
          border-bottom: 1px solid var(--line);
          color: var(--faint);
          font: 600 11px var(--mono);
          letter-spacing: 0.04em;
          text-transform: uppercase;

          .num {
            flex: none;
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
          }

          button {
            min-width: 0;
            padding: 0;
            font: inherit;
            letter-spacing: inherit;
            text-align: left;
            text-transform: inherit;

            > span {
              display: block;
              overflow: hidden;
              text-overflow: ellipsis;
              white-space: nowrap;
            }

            &:hover {
              color: var(--ink);
            }

            &:focus-visible {
              outline-offset: 2px;
            }
          }
        }

        ul {
          position: relative;
          flex: 1;
          margin: 0;
          padding: 6px 6px 12px;
          overflow-y: auto;
          overscroll-behavior-y: contain;
          list-style: none;
        }

        @media (pointer: coarse) {
          h2 button,
          .row {
            z-index: 1;
          }

          .row {
            position: relative;
          }
        }
      }

      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 2px 10px;
        width: 100%;
        min-height: 34px;
        padding: 6px 8px 6px 10px;
        border-radius: 7px;
        text-align: left;

        &:hover {
          background: var(--hover);
        }

        &[aria-current="true"] {
          background: var(--trail);
        }

        &.end {
          background: var(--pick);
        }

        .label {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .side {
          display: flex;
          align-items: center;
          gap: 4px;
          color: var(--faint);
          font: 11.5px var(--mono);
        }

        .id {
          grid-column: 1 / -1;
          overflow: hidden;
          color: var(--faint);
          font: 11.5px var(--mono);
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        svg {
          width: 16px;
          height: 16px;
        }
      }

      .column .row {
        grid-template-columns: 16px minmax(0, 1fr) auto;
        column-gap: 9px;

        .glyph {
          grid-row: 1;
          align-self: center;
          width: 16px;
          height: 16px;
          color: var(--faint);
        }

        .id {
          grid-column: 2 / -1;
        }
      }

      .row.end .glyph {
        color: var(--accent);
        opacity: 1;
      }

      .column:focus-within .row.end {
        background: var(--solid);
        color: #fff;

        :is(.side, .id, .glyph) {
          color: #fff;
        }
      }

      .row[aria-current="true"] :is(.side, .id) {
        color: var(--soft);
      }

      @media (pointer: coarse) {
        .row {
          min-height: 44px;
        }

        .search input {
          font-size: 16px;
        }

        /* A label behind the field, so a tap on the bar lands in it. */
        .search .reach {
          display: block;
          position: absolute;
          z-index: -1;
          inset-inline: 0;
          top: 50%;
          height: 44px;
          translate: 0 -50%;
        }

        .search .clear::before {
          content: "";
          position: absolute;
          inset: -8px;
        }
      }

      .series,
      .overview,
      .rest {
        flex: 1 0 0;
        scroll-snap-align: end;
      }

      .series {
        min-width: 480px;
        overflow-y: auto;
        padding: 28px clamp(20px, 3vw, 40px) 48px;
      }

      .overview {
        min-width: 360px;
        overflow-y: auto;
        padding: 28px clamp(20px, 3vw, 40px) 48px;

        > p {
          margin: 6px 0 0;
          color: var(--faint);
        }
      }

      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 12px;
        margin-top: 22px;
      }

      .tile {
        display: grid;
        align-content: start;
        gap: 10px;
        min-width: 0;
        padding: 14px 14px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--pane);
        text-align: left;

        @media (pointer: coarse) {
          &:has(> p) {
            gap: 24px;
          }
        }

        > button {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 0;
          text-align: left;

          .glyph {
            flex: none;
            width: 16px;
            height: 16px;
            color: var(--accent);
          }

          &:hover b {
            color: var(--accent-ink);
          }
        }

        b {
          flex: 1;
          overflow: hidden;
          font-size: 14.5px;
          font-weight: 600;
          letter-spacing: -0.01em;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        b + span {
          flex: none;
          color: var(--faint);
          font-size: 12px;
        }

        p {
          display: flex;
          flex-wrap: wrap;
          gap: 5px;
          margin: 0;

          button,
          span {
            max-width: 100%;
            padding: 2px 8px;
            overflow: hidden;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.6;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          button {
            background: var(--well);
            color: var(--soft);

            &:hover {
              background: var(--pick);
              color: var(--accent-ink);
            }
          }

          span {
            color: var(--faint);
          }

          /* (44px tall from its drawn height, up to the half pixel so it never rounds to 43.) */
          @media (pointer: coarse) {
            --chip-reach: round(up, (44px - 12px * 1.6 - 2 * 2px) / 2, 0.5px);
            row-gap: calc(2 * var(--chip-reach));

            button {
              border: solid transparent;
              border-width: var(--chip-reach) 2px;
              margin: calc(-1 * var(--chip-reach)) -2px;
              border-radius: 8px / calc(6px + var(--chip-reach));
              background-clip: padding-box;

              /* (Ring inside the clear border; the outline stays, unseen, for forced colours.) */
              &:focus-visible {
                outline-color: transparent;
                box-shadow: inset 0 0 0 2px var(--accent);
              }
            }
          }
        }

        code {
          overflow: hidden;
          color: var(--faint);
          font-size: 11.5px;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
      }

      button.tile:hover {
        border-color: var(--line-strong);

        b {
          color: var(--accent-ink);
        }
      }

      main.whole .crumbs {
        display: none;
      }

      .crumbs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 4px;
        margin: 0 0 10px;
        padding: 0;
        color: var(--faint);
        font-size: 12.5px;
        list-style: none;

        li + li::before {
          content: "›";
          margin-right: 4px;
        }

        button:hover {
          color: var(--ink);
        }

        @media (pointer: coarse) {
          row-gap: 20px;

          button {
            position: relative;

            &::before {
              content: "";
              position: absolute;
              inset: -10px 0;
            }
          }
        }
      }

      .series h1,
      .overview h1 {
        margin: 0;
        font-family: var(--mono);
        font-size: clamp(21px, 2.2vw, 28px);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.2;
        text-wrap: balance;
      }

      .copyable {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: 100%;
        min-height: 28px;
        padding: 3px 8px 3px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--well);
        text-align: left;

        code {
          min-width: 0;
          font-size: 12.5px;
          overflow-wrap: anywhere;
        }

        svg {
          flex: none;
          width: 16px;
          height: 16px;
          color: var(--faint);
        }

        .done {
          display: none;
        }

        &:hover {
          border-color: var(--line-strong);

          svg {
            color: var(--ink);
          }
        }

        &.copied {
          .done {
            display: block;
            color: var(--accent);
          }

          .undone {
            display: none;
          }
        }
      }

      .series > .copyable {
        margin-top: 12px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--pane);
        color: var(--soft);
        font-size: 12.5px;
        text-decoration: none;
        white-space: nowrap;

        &:hover {
          border-color: var(--line-strong);
          color: var(--ink);
        }

        &[aria-pressed="true"] {
          border-color: var(--accent);
          background: var(--pick);
          color: var(--accent-ink);
        }

        &:disabled {
          opacity: 0.45;
          cursor: default;
          pointer-events: none;
        }

        /* (Light: a shade darker than the accent, so its white words read at 4.8:1.) */
        &.primary {
          --fill: light-dark(#c24e06, var(--accent));
          border-color: var(--fill);
          background: var(--fill);
          color: light-dark(#fff, #1c0c00);

          &:hover {
            --fill: light-dark(#ad4505, #f59a57);
            color: light-dark(#fff, #1c0c00);
          }

          &:focus-visible {
            outline-offset: 2px;
          }
        }

        svg {
          width: 16px;
          height: 16px;
        }
      }

      .seg {
        position: relative;
        display: flex;
        gap: 2px;
        width: fit-content;
        max-width: 100%;
        padding: 2px;
        overflow-x: auto;
        border-radius: 9px;
        background: var(--well);
        scrollbar-width: none;

        &::-webkit-scrollbar {

        chevron: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.25 3.25 4.5 4.5-4.5 4.5" /></svg>`,

      const ACRONYMS = new Set(["sth", "lth", "mvrv", "sopr", "nupl", "usd", "btc", "ath", "atl", "sma", "ema", "utxo", "ohlc", "vocdd", "hodl", "rbf", "cpfp", "tx", "pnl", "aviv", "rsi", "macd", "epobc", "cdd"]);
      const WORDS = /** @type {Record<string, string>} */ ({ addrs: "addresses", addr: "address", txs: "transactions", utxos: "UTXOs", avg: "average", opreturn: "OP_RETURN" });
      function percentileKey(/** @type {string} */ key) {
        const digits = /^p(\d+(?:_\d+)?)$/.exec(key)?.[1];

      }
      const word = (/** @type {string} */ text) => WORDS[text] ?? (ACRONYMS.has(text) || /^p2[a-z]+\d*$/.test(text) ? text.toUpperCase() : text);

      const spoken = (/** @type {string[]} */ parts) => {

      const poolNames = /** @type {Map<string, string>} */ (new Map());

        ["month1", "1M"], ["month3", "3M"], ["month6", "6M"], ["year1", "1Y"], ["year10", "10Y"], ["halving_epoch", "Halving"], ["difficulty_epoch", "Epoch"], ["height", "Block"],

      const rank = (/** @type {string} */ index) => ((i) => (i < 0 ? INTERVALS.length : i))(INTERVALS.findIndex(([id]) => id === index));
      const dateBased = (/** @type {string} */ index) => {
