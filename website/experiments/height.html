<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="The latest Bitcoin block indexed by Bitview. Nothing more."
    />
    <meta name="theme-color" content="#f7931a" />
    <title>Block height · Bitview experiment</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7931a;
        color: #17100a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 20rem;
        min-height: 100vh;
        margin: 0;
      }

      a {
        color: inherit;
      }

      main {
        display: grid;
        min-height: 100vh;
        padding: clamp(1rem, 3vw, 2rem);
        grid-template-rows: auto 1fr auto;
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        font-size: 0.72rem;
        font-weight: 650;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      header a {
        padding-block: 0.4rem;
        text-decoration: none;
      }

      header a:hover {
        text-decoration: underline;
        text-underline-offset: 0.25rem;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      .status::before {
        width: 0.48rem;
        height: 0.48rem;
        border: 1px solid currentColor;
        border-radius: 50%;
        content: "";
      }

      .status[data-live]::before {
        border-color: #196c38;
        background: #196c38;
        box-shadow: 0 0 1rem #196c3880;
      }

      .height {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
      }

      .height span {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        font-size: clamp(0.7rem, 1.3vw, 0.88rem);
        font-weight: 650;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      output {
        display: block;
        margin-block: 1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        font-size: clamp(4.2rem, 20vw, 18rem);
        font-variant-numeric: tabular-nums;
        font-weight: 540;
        line-height: 0.82;
        letter-spacing: -0.1em;
      }

      .updated {
        min-height: 1.1em;
        opacity: 0.62;
      }

      footer {
        color: #513317;
      }

      @media (max-width: 520px) {
        footer {
          align-items: start;
          flex-direction: column;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .status[data-live]::before {
          animation: breathe 2.4s ease-in-out infinite;
        }

        @keyframes breathe {
          50% {
            box-shadow: 0 0 1.6rem #196c38d0;
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a href="../index.html">← Bitview</a>
        <span class="status" id="status">Connecting</span>
      </header>

      <section class="height" aria-labelledby="height-label">
        <span id="height-label">Latest indexed block</span>
        <output id="height" aria-live="polite">—</output>
        <span class="updated" id="updated"></span>
      </section>

      <footer>
        <span>Experiment 001</span>
        <span>One request · One number · One file</span>
      </footer>
    </main>

    <script>
      const height = document.querySelector("#height");
      const status = document.querySelector("#status");
      const updated = document.querySelector("#updated");

      async function loadHeight() {
        try {
          const response = await fetch(
            "https://bitview.space/api/server/sync",
          );
          if (!response.ok) throw new Error("Bitview is unavailable");

          const data = await response.json();
          height.textContent = new Intl.NumberFormat("en-US").format(
            data.indexed_height,
          );
          status.textContent = data.blocks_behind ? "Syncing" : "Live";
          status.dataset.live = "";
          updated.textContent = `updated ${new Intl.DateTimeFormat("en", {
            dateStyle: "medium",
            timeStyle: "short",
          }).format(new Date(data.last_indexed_at))}`;
        } catch {
          status.textContent = "Offline";
          updated.textContent = "Connect through a running Bitview server";
        }
      }

      void loadHeight();
    </script>
  </body>
</html>
