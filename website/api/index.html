<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Its launch from a home screen, every showcase's. -->
    <script src="/assets/launch/launch.js" data-app="API" data-color="#af4000"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

      content="Free Bitcoin on-chain analytics API: thousands of time series, blocks, transactions, addresses, the mempool and mining. No key, no account."
    />
    <!-- (Its address, wherever it's served from, and how a shared link previews: its card made by website/home.mjs --pictures.) -->
    <link rel="canonical" href="https://bitview.space/api/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bitview.space/api/" />
    <meta property="og:site_name" content="Bitview" />
    <meta property="og:title" content="Bitview API" />
    <meta property="og:description" content="Free Bitcoin on-chain analytics API: thousands of time series, blocks, transactions, addresses, the mempool and mining. No key, no account." />
    <meta property="og:image" content="https://bitview.space/assets/cards/api.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bitview's API reference: the endpoints by group beside its introduction" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f1ec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0c0b" />
    <style>
      /* craft rules */
      /* Written into every page by home.mjs: headings balance their lines and text pretties its last, so no one-word last
         lines (zero specificity, a page's own text-wrap wins); digits are equal width, so a number that changes never
         shifts what sits beside it (a face without equal-width digits, like Instrument Serif, can't: its box is fixed). */
      :where(h1, h2, h3, h4, h5, h6) {
        text-wrap: balance;
      }
      :where(p, li, dd, blockquote, figcaption) {
        text-wrap: pretty;
      }
      html body {
        font-variant-numeric: tabular-nums;
      }
      /* /craft rules */
      /* fallback fonts */
      /* Local faces keep text visible while the web fonts load. Width fits use a general Latin sample;
         vertical metrics come from Inter 4.1 and Lilex 2.620, divided by size-adjust.
         Menlo needs its full/PostScript name in Chromium. Other mono faces share its calibration. */
      @font-face {
        font-family: "Inter Fallback";
        src: local("ArialMT"), local("Arial"), local("Helvetica"), local("Roboto");
        font-weight: 100 600;
        size-adjust: 108.088066%;
        ascent-override: 89.625991%;
        descent-override: 22.316149%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: "Inter Fallback";
        src: local("Arial-BoldMT"), local("Arial Bold"), local("Helvetica Bold"), local("Roboto Bold");
        font-weight: 601 900;
        size-adjust: 99.756055%;
        ascent-override: 97.111900%;
        descent-override: 24.180080%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: "Lilex Fallback";
        src: local("Menlo"), local("Menlo-Regular"), local("SF Mono"), local("SFMono-Regular"), local("Consolas"), local("DejaVu Sans Mono"), local("Liberation Mono");
        font-weight: 500 700;
        size-adjust: 99.659367%;
        ascent-override: 100.241455%;
        descent-override: 30.202881%;
        line-gap-override: 0%;
      }
      /* /fallback fonts */

      @font-face {
        font-family: Inter;
        src: url("/assets/fonts/InterVariable.core.woff2") format("woff2");
        unicode-range: U+0000-017F, U+0192, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0394, U+03A3, U+03C3, U+2000-206F, U+20AC, U+20BF, U+2122, U+2190-23FF, U+2500-25FF, U+2713-2715, U+FE0E-FE0F, U+FEFF, U+FFFD;
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: Inter;
        src: url("/assets/fonts/InterVariable.rest.woff2") format("woff2");
        unicode-range: U+0180-0191, U+0193-02BA, U+02BD-02C5, U+02C7-02D9, U+02DB, U+02DD-0393, U+0395-03A1, U+03A4-03C2, U+03C4-03DD, U+03F0-04FF, U+052F, U+0E3F, U+1D00-1D1B, U+1D43-1D65, U+1D9C-1DA0, U+1DBB-1FFE, U+2070-20AB, U+20AD-20BE, U+20C0, U+20DB-2121, U+2126-213B, U+214D-2189, U+2423, U+2460-2468, U+24B6-24CF, U+24EA, U+2600-2606, U+263C, U+2661-266B, U+26A0, U+2717, U+2756-2764, U+2780-2788, U+27EF-27FA, U+2913, U+2A38, U+2B06-2B24, U+2C7C-2C7F, U+2DFF, U+2E18, U+A69F, U+A7FF, U+A92E, U+E000-E0F5, U+E106-E163, U+E1C3-E2DC, U+EE01-EEE1, U+F6C3, U+1F12F-1F149, U+1F16A-1F16B, U+1F850-1F852;
        font-weight: 100 900;
        font-display: swap;
      }

      @font-face {
        font-family: Lilex;
        src: url("/assets/fonts/Lilex.core.woff2") format("woff2");
        unicode-range: U+0000-017F, U+0192, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0394, U+03A3, U+03C3, U+2000-206F, U+20AC, U+20BF, U+2122, U+2190-23FF, U+2500-25FF, U+2713-2715, U+FE0E-FE0F, U+FEFF, U+FFFD;
        font-weight: 500 700;
        font-display: swap;
      }
      @font-face {
        font-family: Lilex;
        src: url("/assets/fonts/Lilex.rest.woff2") format("woff2");
        unicode-range: U+018F, U+01A0-01B0, U+01CD-01FF, U+0218-021B, U+0237, U+0259, U+02C7, U+02D8-02D9, U+02DB, U+02DD, U+0300-0328, U+037E-0393, U+0395-03A1, U+03A4-03C2, U+03C4-03CE, U+0400-0475, U+0490-04F9, U+0524-0525, U+0E3F, U+1E28-1E29, U+1E80-1E85, U+1E9E-1EF9, U+2070-2089, U+20A1-20AB, U+20AD-20BD, U+2113-2116, U+2126-212E, U+2150-215E, U+2B0E-2B11, U+2B58, U+3000, U+E0A0-E0B3;
        font-weight: 500 700;
        font-display: swap;
      }

      /* The front page's ground, ink and two faces; one grey apart, below. */
      :root {
        color-scheme: light dark;
        --app: light-dark(#f3f1ec, #0d0c0b);
        --card: light-dark(#fbfaf7, #181613);
        --well: light-dark(#e9e6df, #211e1a);
        --ink: light-dark(#16130f, #f6f3ee);
        --text: light-dark(#3a342d, #d6cfc4);
        --soft: light-dark(#625a50, #a1988a);
        /* (Dark a shade lighter than the front page's #8a8175: this page sets it on --well too, 4.33:1 there; #8e8579 is 4.57.) */
        --muted: light-dark(#6f665b, #8e8579);
        --line: light-dark(rgb(22 19 15 / 0.09), rgb(246 243 238 / 0.08));
        --line-strong: light-dark(rgb(22 19 15 / 0.16), rgb(246 243 238 / 0.14));
        --focus: light-dark(rgb(22 19 15 / 0.6), rgb(246 243 238 / 0.85));
        --brand: oklch(64.34% 0.191 44.41);
        --brand-text: light-dark(oklch(52% 0.16 44.41), var(--brand));
        --bad: light-dark(#b3261e, #ff6b6b);
        --sans: Inter, "Inter Fallback", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
        --mono: Lilex, "Lilex Fallback", ui-monospace, "SF Mono", Menlo, monospace;
        --gutter: 16px;
        --radius: 10px;
        --bar: 56px;

        @media (min-width: 720px) {
          --gutter: 40px;
          --bar: 64px;
        }

        @media (min-width: 1280px) {
          --gutter: 56px;
        }
      }

      /* Increase Contrast (prefers-contrast: more), as every page: the greys toward the ink, the hairlines stronger. */
      @media (prefers-contrast: more) {
        :root {
          --text: light-dark(#27231d, #e6e1d9);
          --soft: light-dark(#423c34, #c2bbb1);
          --muted: light-dark(#49423a, #b4ada4);
          --line: light-dark(rgb(22 19 15 / 0.2), rgb(246 243 238 / 0.18));
          --line-strong: light-dark(rgb(22 19 15 / 0.35), rgb(246 243 238 / 0.31));
        }
      }

      /* ── The bar: the way home, the developers' pages, the stars ── */
      .bar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 28px;
        box-sizing: border-box;
        height: var(--bar);
        border-bottom: 1px solid var(--line);
        padding: 0 var(--gutter);
        background: var(--app);

        a {
          color: var(--soft);
          text-decoration: none;

          &:hover {
            color: var(--ink);
          }
        }

        .brand {
          display: flex;
          flex: none;
          align-items: center;
          gap: 10px;
          color: var(--ink);
          font-size: 16px;
          font-weight: 650;
          letter-spacing: -0.01em;

          img {
            width: 22px;
            height: 25.5px;
          }
        }

        /* (The pages, in the front page's order; the one read in ink.) */
        .pages {
          display: flex;
          gap: 4px 22px;
          margin: 0 auto 0 0;
          font-size: 13.5px;
          font-weight: 500;
          white-space: nowrap;

          [aria-current] {
            color: var(--ink);
          }
        }

        .stars {
          flex: none;
          margin-left: auto;
          font-size: 13.5px;
          font-weight: 500;
          white-space: nowrap;

          b {
            color: var(--ink);
            font-weight: 600;
          }

          svg {
            width: 1em;
            height: 1em;
            margin-right: 0.4em;
            vertical-align: -0.125em;
            fill: #e8a530;
          }
        }

        /* (Its button, where the pages have no room in the bar: they open under it.) */
        .more {
          display: none;
          box-sizing: border-box;
          flex: none;
          align-items: center;
          gap: 6px;
          height: 34px;
          border: 1px solid var(--line-strong);
          border-radius: 8px;
          padding: 0 10px 0 12px;
          color: var(--ink);
          background: none;
          font: 500 13.5px var(--sans);
          cursor: pointer;

          svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
          }
        }

        @media (max-width: 1099px) {
          gap: 14px;

          .more {
            display: flex;
            order: 1;
          }

          .pages {
            position: fixed;
            inset: calc(var(--bar) + 6px) var(--gutter) auto auto;
            box-sizing: border-box;
            flex-direction: column;
            min-width: 200px;
            margin: 0;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            padding: 6px;
            color: var(--text);
            background: var(--card);
            box-shadow: 0 12px 32px rgb(0 0 0 / 0.18);
            font-size: 15px;

            &:not(:popover-open) {
              display: none;
            }

            a {
              border-radius: 6px;
              padding: 9px 12px;
              color: var(--text);

              /* (A finger's reach: 44px tall.) */
              @media (pointer: coarse) {
                padding-block: 10px;
              }

              &[aria-current] {
                color: var(--ink);
                background: var(--well);
              }
            }
          }

          .stars span {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
          }
        }

        /* (Wide enough for the pages in the bar: no popover there, shown as they are.) */
        @media (min-width: 1100px) {
          .pages {
            position: static;
            inset: auto;
            overflow: visible;
            border: 0;
            padding: 0;
            color: inherit;
            background: none;
          }
        }
      }

      /* A finger's reach, unseen: on touch, each small control at least 44px each way whatever its size (an absolute box
         measures from the padding box, inside any border). Outranking nothing, so a control placed absolute stays so. */
      @media (pointer: coarse) {
        :where(.bar :is(.brand, .stars, .more), .small, .foot a, .crumbs a, .about a, .used-by a, .op h2 a, .fields summary) {
          position: relative;

          &::before {
            content: "";
            position: absolute;
            inset: min(0px, calc((100% - 44px) / 2));
          }
        }
      }

      /* Said to a screen reader only. */
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* ── Code: a block that scrolls sideways in its frame, its copy button on its top edge ── */
      .code {
        position: relative;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--card);

        pre {
          overflow-x: auto;
          margin: 0;
          padding: 14px 16px;
          color: var(--ink);
          font: 13px/1.65 var(--mono);
          tab-size: 2;
        }

        &:has(> button) pre {
          padding-right: 76px;
        }

        > button {
          position: absolute;
          top: 9px;
          right: 9px;
        }

        .c {
          color: var(--muted);
        }

      }

      /* (A small button: Copy, Run. As wide from the start as its longest word, "Selected": saying it moves nothing.) */
      .small {
        position: relative;
        display: inline-grid;
        box-sizing: border-box;
        justify-items: center;
        align-content: center;
        height: 28px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        padding: 0 10px;
        color: var(--soft);
        background: var(--card);
        font: 500 12.5px var(--sans);
        cursor: pointer;

        &:hover {
          color: var(--ink);
        }

        &[data-copy]::after {
          content: "Selected";
          height: 0;
          overflow: hidden;
          visibility: hidden;
        }
      }

      /* ── The foot ── */
      .foot {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px 24px;
        margin: 72px var(--gutter) 0;
        border-top: 1px solid var(--line);
        padding: 22px 0 calc(40px + env(safe-area-inset-bottom));
        color: var(--muted);
        font-size: 12.5px;

        nav {
          display: flex;
          flex-wrap: wrap;
          gap: 8px 18px;

          @media (pointer: coarse) {
            row-gap: 24px;
          }
        }

        a {
          color: inherit;
          text-decoration: none;

          &:hover {
            color: var(--ink);
          }
        }
      }

      /* ── The page: its ground and type ── */
      html {
        scroll-padding-top: calc(var(--bar) + 24px);
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        color: var(--text);
        background: var(--app);
        font: 15px/1.6 var(--sans);
        font-feature-settings: "cv11", "ss01";
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }

      button,
      input,
      select {
        color: inherit;
        font: inherit;
      }

      /* (Words.) */
      h1,
      h2,
      h3 {
        margin: 0;
        color: var(--ink);
        letter-spacing: -0.015em;
      }

      h1 {
        font-size: clamp(26px, 3.2vw, 32px);
        font-weight: 680;
        line-height: 1.15;
        letter-spacing: -0.022em;
      }

      h2 {
        font-size: 20px;
        font-weight: 650;
        line-height: 1.25;
      }

      h3 {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
      }

      p {
        margin: 0;
      }

      main a:not([class]) {
        color: var(--ink);
        text-decoration: underline;
        text-decoration-color: var(--line-strong);
        text-underline-offset: 0.2em;

        &:hover {
          color: var(--brand-text);
          text-decoration-color: currentColor;
        }
      }

      code,
      kbd,
      pre {
        font-family: var(--mono);
        font-size: 0.9em;
      }

      :not(pre) > code {
        border-radius: 4px;
        padding: 1px 5px;
        color: var(--ink);
        background: var(--well);
        overflow-wrap: anywhere;
      }

      /* ── The reference: endpoints by group in a rail, the group read beside it ── */
      .frame {
        display: grid;
        grid-template-columns: 272px minmax(0, 1fr);

        @media (max-width: 999px) {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      .rail {
        position: sticky;
        top: var(--bar);
        align-self: start;
        height: calc(100dvh - var(--bar));
        overflow-y: auto;
        overscroll-behavior: contain;
        border-right: 1px solid var(--line);
        padding: 16px 12px 32px;
        font-size: 14px;
        scrollbar-width: thin;
        scrollbar-color: var(--line-strong) transparent;

        ul {
          margin: 0;
          padding: 0;
          list-style: none;
        }

        a {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 10px;
          border-radius: 7px;
          padding: 6px 10px;
          color: var(--soft);
          text-decoration: none;

          &:hover {
            color: var(--ink);
          }

          &[aria-current] {
            color: var(--ink);
            font-weight: 550;
          }

          small {
            color: var(--muted);
            font: 12px var(--mono);
          }

          /* (A finger's reach: each row 44px tall, the rows being stacked with no room between.) */
          @media (pointer: coarse) {
            align-items: center;
            min-height: 44px;
          }
        }

        /* (The group read: its endpoints under its name, on a line down their side.) */
        #groups ul {
          margin: 2px 0 8px 10px;
          border-left: 1px solid var(--line-strong);
          padding-left: 4px;
          font-size: 13.5px;

          a[aria-current] {
            background: var(--well);
            font-weight: 500;
          }
        }

        /* (A phone: the search alone, on the page under the bar; the groups are the first page's own list.) */
        @media (max-width: 999px) {
          position: static;
          height: auto;
          border: 0;
          padding: 14px var(--gutter) 0;

          #groups {
            display: none;
          }
        }
      }

      .find label {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        margin-bottom: 12px;
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        padding: 0 8px 0 10px;
        background: var(--card);

        &:focus-within {
          outline: 2px solid var(--focus);
          outline-offset: 1px;
        }

        svg {
          flex: none;
          width: 15px;
          height: 15px;
          fill: none;
          stroke: var(--muted);
          stroke-width: 2;
          stroke-linecap: round;
        }

        input {
          flex: 1;
          min-width: 0;
          border: 0;
          outline: 0;
          padding: 0;
          background: none;
          font-size: 14px;
          appearance: none;

          &::placeholder {
            color: var(--muted);
            opacity: 1;
          }

          &::-webkit-search-cancel-button {
            display: none;
          }
        }

        kbd {
          border: 1px solid var(--line-strong);
          border-radius: 5px;
          padding: 0 6px;
          color: var(--muted);
          font-size: 11.5px;
          line-height: 18px;

          @media (pointer: coarse) {
            display: none;
          }
        }

        @media (pointer: coarse) {
          height: 44px;

          input {
            font-size: 16px;
          }
        }
      }

      /* (What a search found: each endpoint's address over its name.) */
      #found {
        a {
          display: block;
          padding: 8px 10px;

          code {
            padding: 0;
            color: var(--ink);
            background: none;
            font-size: 12.5px;
            overflow-wrap: anywhere;
            display: flex;
            align-items: baseline;
          }

          &[aria-current] {
            background: var(--well);
            font-weight: 400;
          }
        }

        p {
          padding: 6px 10px;
          color: var(--muted);
        }
      }

      main {
        min-width: 0;
        max-width: 1240px;
        padding: 36px var(--gutter) 0;

        @media (max-width: 999px) {
          padding-top: 20px;
        }

        /* (Focused only so Tab goes on from the page drawn: a ring round all of it says nothing.) */
        &:focus-visible {
          outline: none;
        }
      }

      /* (A phone's way back to the groups, the rail's being out of sight.) */
      .crumbs {
        display: none;
        margin-bottom: 14px;
        color: var(--muted);
        font-size: 13.5px;

        @media (max-width: 999px) {
          display: block;
        }
      }

      .lede {
        max-width: 62ch;
        margin-top: 12px;
        font-size: 16.5px;
      }

      /* (Under the title: its version, the specification in its forms, and the line to who uses Bitview.) */
      .about,
      .used-by {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;

        /* (On touch, its rows and the line under them stand as far apart as their links' reach needs.) */
        @media (pointer: coarse) {
          row-gap: 24px;
          margin-top: 24px;
        }
      }

      /* A description as written in the specification. */
      .md {
        max-width: 68ch;

        > * + * {
          margin-top: 12px;
        }

        h3 {
          margin-top: 32px;
          font-size: 17px;
        }

        ul {
          margin-bottom: 0;
          padding-left: 20px;
        }

        li + li {
          margin-top: 6px;
        }

        i {
          color: var(--soft);
          font-style: normal;
        }
      }

      /* Words on the left, the request on the right, held in sight while its words are read. */
      .split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 440px);
        gap: 28px 56px;
        align-items: start;

        @media (max-width: 1239px) {
          grid-template-columns: minmax(0, 1fr);
        }

        /* (Pinned, it never stands taller than the screen under the bar: it scrolls in itself.) */
        > .try {
          position: sticky;
          top: calc(var(--bar) + 24px);
          max-height: calc(100dvh - var(--bar) - 48px);
          overflow-y: auto;
          /* (Room inside its scroll for the focus rings at its edges.) */
          margin: -6px;
          padding: 6px;

          /* (Unpinned, the answer scrolls in its own box instead; pinned, one scroll box, the panel's.) */
          @media (max-width: 1239px) {
            position: static;
            max-width: 68ch;
            max-height: none;
            margin: 0;
            padding: 0;

            .code pre {
              max-height: 420px;
            }
          }
        }
      }

      .intro {
        margin-top: 28px;
      }

      /* The groups, on the first page: each a line, its name, how many, what they answer. */
      .index {
        margin: 16px 0 0;
        border-top: 1px solid var(--line);
        padding: 0;
        list-style: none;

        a {
          display: grid;
          grid-template-columns: 11rem 3rem minmax(0, 1fr);
          gap: 2px 16px;
          align-items: baseline;
          border-bottom: 1px solid var(--line);
          padding: 12px 0;
          color: var(--text);
          text-decoration: none;

          b {
            color: var(--ink);
            font-weight: 600;
          }

          small {
            color: var(--muted);
            font: 12.5px var(--mono);
          }

          &:hover b {
            color: var(--brand-text);
          }

          @media (max-width: 719px) {
            grid-template-columns: minmax(0, 1fr) auto;

            span {
              grid-column: 1 / -1;
              font-size: 14px;
            }
          }
        }
      }

      .section {
        margin-top: 56px;
      }

      /* A group's endpoints by address, each a way to it below. */
      .paths {
        max-width: 68ch;
        margin: 24px 0 0;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 6px;
        background: var(--card);
        list-style: none;

        a {
          display: flex;
          align-items: baseline;
          border-radius: 6px;
          padding: 5px 10px;
          color: var(--ink);
          font: 13px/1.5 var(--mono);
          text-decoration: none;
          overflow-wrap: anywhere;

          &:hover {
            background: var(--well);
          }

          @media (pointer: coarse) {
            align-items: center;
            min-height: 44px;
          }
        }
      }

      .path {
        font-family: var(--mono);
      }

      /* (Always before a path: the one gap between them.) */
      .method {
        flex: none;
        min-width: 2.6em;
        margin-inline-end: 12px;
        color: var(--muted);
        font: 600 11.5px var(--mono);
        letter-spacing: 0.02em;

        &.post {
          color: var(--brand-text);
        }
      }

      /* An endpoint. */
      .op {
        margin-top: 56px;
        border-top: 1px solid var(--line);
        padding-top: 32px;

        h2 a {
          color: inherit;
          text-decoration: none;

          &:hover {
            color: var(--brand-text);
          }
        }

        .address {
          display: flex;
          align-items: baseline;
          margin: 10px 0 16px;
          color: var(--ink);
          font: 13.5px/1.5 var(--mono);

        }

        h3 {
          margin: 28px 0 0;
          color: var(--soft);
          font-size: 13px;
          font-weight: 550;
        }
      }

      /* Parameters and a response's fields: a name, its type, what it is; what's inside it a press away. */
      .fields {
        max-width: 68ch;
        margin: 8px 0 0;
        border-top: 1px solid var(--line);

        > div {
          border-bottom: 1px solid var(--line);
          padding: 10px 0;
        }

        dt {
          display: flex;
          flex-wrap: wrap;
          gap: 2px 10px;
          align-items: baseline;

          code {
            padding: 0;
            color: var(--ink);
            background: none;
            font-size: 13px;
            font-weight: 600;
          }

          span {
            color: var(--muted);
            font-size: 12.5px;
          }

          .must {
            color: var(--brand-text);
          }
        }

        dd {
          margin: 3px 0 0;
          font-size: 14px;

          &:empty {
            display: none;
          }

          /* (Its choices, each a chip: lines far enough apart that the chips don't touch.) */
          .one-of {
            line-height: 1.9;
          }
        }

        details {
          margin-top: 6px;

          summary {
            display: inline-flex;
            align-items: center;
            height: 28px;
            border: 1px solid var(--line-strong);
            border-radius: 14px;
            padding: 0 12px;
            color: var(--soft);
            font-size: 12.5px;
            font-weight: 500;
            list-style: none;
            cursor: pointer;

            &::-webkit-details-marker {
              display: none;
            }

            &:hover {
              color: var(--ink);
            }
          }

          > .fields {
            margin: 10px 0 0 12px;
            border-top: 0;
            border-left: 1px solid var(--line-strong);
            padding-left: 14px;

              border-bottom: 0;
            }
          }
        }
      }

      /* (Every other answer, one line each.) */
      .answers {
        max-width: 68ch;
        margin: 8px 0 0;
        padding: 0;
        color: var(--soft);
        font-size: 13.5px;
        list-style: none;

        b {
          display: inline-block;
          min-width: 3em;
          color: var(--ink);
          font: 500 12.5px var(--mono);
        }
      }

      /* The request: what it takes, as fields; its command; Run; what came back, or an example of it. */
      .try {
        min-width: 0;

        .takes {
          display: grid;
          grid-template-columns: auto minmax(0, 1fr);
          gap: 6px 12px;
          align-items: center;
          margin-bottom: 10px;

          label {
            display: contents;
            font: 12.5px var(--mono);
          }

          :is(input, select) {
            min-width: 0;
            height: 30px;
            border: 1px solid var(--line-strong);
            border-radius: 7px;
            padding: 0 8px;
            background: var(--card);
            font: 12.5px var(--mono);

            &::placeholder {
              color: var(--muted);
              opacity: 1;
            }

            @media (pointer: coarse) {
              height: 44px;
              font-size: 16px;
            }
          }
        }

        .code pre {
          overflow: auto;
          white-space: pre-wrap;
          overflow-wrap: break-word;
        }

        .ran {
          display: flex;
          gap: 12px;
          align-items: center;
          min-height: 28px;
          margin: 10px 0 8px;
          color: var(--muted);

          .small {
            border-color: var(--ink);
            color: var(--app);

              color: var(--app);
              background: var(--text);

          }

        /* (JSON, lightly: names in ink, numbers in the brand's, the rest as text.) */
        .n {
          color: var(--ink);
        }

        .v {
          color: var(--brand-text);
        }
      }
    </style>
  </head>

  <body>
    <header class="bar">

    </header>

    <!-- /used by -->

    <div class="frame">
      <nav class="rail" aria-label="Endpoints">
        <search class="find">
          <label>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.75" cy="10.75" r="6.25" /><path d="m15.5 15.5 4.25 4.25" /></svg>
            <input id="find" type="search" placeholder="Search endpoints" aria-label="Search endpoints" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" />
            <kbd aria-hidden="true">/</kbd>
          </label>
        </search>
        <ul id="found" hidden></ul>
        <ul id="groups"></ul>
      </nav>

      <main id="main" tabindex="-1">
        <h1>API</h1>
        <p class="about" role="status">Reading the endpoints from <a href="/openapi.json">/openapi.json</a>…</p>
      </main>
    </div>

    <footer class="foot">
      <span>Bitview · open source · MIT</span>
      <nav aria-label="Elsewhere"><a href="/openapi.json">OpenAPI</a><a href="/llms.txt">llms.txt</a><a href="/support/">Support</a><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a></nav>
    </footer>

    <p class="sr" id="said" role="status"></p>

    <script type="module">
      // The reference, drawn from the specification of the server that serves this page: every endpoint by group, what
      // each takes and answers, and its request run from here (the API takes no key).

      const byId = (/** @type {string} */ id) => /** @type {HTMLElement} */ (document.getElementById(id));
      const main = byId("main"), groups = byId("groups"), found = byId("found"), said = byId("said");
      const find = /** @type {HTMLInputElement} */ (byId("find"));

      /** @typedef {Record<string, any>} Schema */
      /** @typedef {{ method: string, path: string, id: string, haystack: string, summary?: string, description?: string, parameters: Schema[], requestBody?: Schema, responses: Record<string, Schema> }} Operation */
      /** @typedef {{ name: string, slug: string, description?: string, operations: Operation[] }} Group */

      const escape = (/** @type {string} */ text) => text.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c] ?? c);

      /** What kept the reference from being drawn, said on the page in its place (and thrown on, for the console). */
      function fail(/** @type {unknown} */ error, /** @type {string} */ advice = "") {
        main.innerHTML = `<h1>API</h1><p class="about" role="alert">The reference could not be drawn: ${escape(error instanceof Error ? error.message : String(error))}.${advice && ` ${escape(advice)}`}</p>`;
        throw error;
      }

      /** The specification. */
      let spec;
      try {
        const response = await fetch("/openapi.json");
        if (!response.ok) throw new Error(`/openapi.json answered ${response.status}`);
        spec = await response.json();
      } catch (error) {
        fail(error, "Reload to try again.");
      }

      // ── Words: a description's markdown, as the specification writes it ──

      /** A line's code, links, bold and italics (code kept aside first: nothing inside it is read as anything else). */
      function inline(/** @type {string} */ text) {
        /** @type {string[]} */ const codes = [];
        return escape(text)
          .replace(/`([^`]+)`/g, (_, code) => `\u0000${codes.push(code) - 1}\u0000`)
          .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
          .replace(/(^|[^*])\*(?! )([^*]+?)(?<! )\*/g, "$1<i>$2</i>")
          .replace(/\[((?:[^\]]|\](?!\())+)\]\(((?:https?:\/\/|\/(?!\/))[^)\s]*)\)/g, '<a href="$2">$1</a>')
          .replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
      }
      /** Text that wraps, where it must, after its slashes (an address, a command); copied, it's the text alone. */
      const breakable = (/** @type {string} */ text) => escape(text).replaceAll("/", "/<wbr>");
      /** A path, in a box of its own (so its breaks stay in one flex item), in the code face. */
      const pathBox = (/** @type {string} */ path) => `<span class="path">${breakable(path)}</span>`;
      const block = (/** @type {string} */ code) => `<div class="code"><pre>${escape(code)}</pre><button class="small" type="button" data-copy>Copy</button></div>`;
      /** Paragraphs, headings, lists and fenced code. */
      function markdown(/** @type {string | undefined} */ text) {
        const out = [], lines = (text ?? "").split("\n");
        /** @type {string[]} */ let paragraph = [];
        /** @type {string[] | null} */ let list = null;
        const close = () => {
          if (paragraph.length) out.push(`<p>${inline(paragraph.join(" "))}</p>`);
          if (list) out.push(`<ul>${list.map((item) => `<li>${inline(item)}</li>`).join("")}</ul>`);
          paragraph = [];
          list = null;
        };
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          if (line.startsWith("```")) {
            close();
            const from = i + 1;
            while (++i < lines.length && !lines[i].startsWith("```"));
            out.push(block(lines.slice(from, i).join("\n")));
          } else if (/^#+ /.test(line)) {
            close();
            out.push(`<h3>${inline(line.replace(/^#+ /, ""))}</h3>`);
          } else if (/^\s*[-*] /.test(line)) {
            // (A bullet under a bullet: an item of its own.)
            if (paragraph.length) close();
            (list ??= []).push(line.trimStart().slice(2));
          } else if (!line.trim()) close();
          else if (list) list[list.length - 1] += ` ${line.trim()}`;
          else paragraph.push(line.trim());
        }
        close();
        return out.join("");
      }

      // ── Types: a schema in a few words, its fields, the example the specification gives ──

      /** A schema, parameter or answer with its references followed (`named` after the last) and its `allOf` folded in. */
      function resolve(/** @type {Schema} */ schema) {
        for (let hops = 0; schema?.$ref || schema?.allOf; hops++) {
          if (hops > 8) throw new Error(`references that go round: ${schema.$ref ?? "allOf"}`);
          if (schema.$ref) {
            const { $ref, ...own } = schema, at = $ref.slice(2).split("/"), target = at.reduce((/** @type {any} */ o, /** @type {string} */ key) => o?.[key], spec);
            if (!target) throw new Error(`no ${$ref} in the specification`);
            schema = { ...target, named: at.at(-1), ...own };
          } else {
            // (One schema with words of its own beside it, as this server writes them; more would need a merge.)
            const { allOf, ...own } = schema;
            if (allOf.length > 1) throw new Error(`an allOf of ${allOf.length} schemas, which this page doesn't merge`);
            schema = { ...resolve(allOf[0]), ...own };
          }
        }
        return schema ?? {};
      }
      /** The alternatives a schema allows, without `null`; and whether `null` is one. */
      function choices(/** @type {Schema} */ schema) {
        const list = (schema.anyOf ?? schema.oneOf ?? (Array.isArray(schema.type) ? schema.type.map((/** @type {string} */ type) => ({ ...schema, type })) : [schema])).map(resolve);
        return { some: list.filter((/** @type {Schema} */ s) => s.type !== "null"), nullable: list.some((/** @type {Schema} */ s) => s.type === "null") };
      }
      /** A type in a few words: `integer`, `array of BlockInfo`, `string or null`, `map of TreeNode` (a type met again
       * inside itself said by its name). */
      function kind(/** @type {Schema} */ schema, /** @type {string[]} */ seen = []) {
        const resolved = resolve(schema);
        if (seen.includes(resolved.named)) return resolved.named;
        const within = resolved.named ? [...seen, resolved.named] : seen, { some, nullable } = choices(resolved);
        const names = some.map((/** @type {Schema} */ s) => {
          if (s.type === "array") return `array of ${kind(s.items ?? {}, within)}`;
          if (s.type !== "object" && s.type) return s.type;
          return s.named ?? (isMap(s) ? `map of ${kind(s.additionalProperties, within)}` : s.type ?? "any");
        });
        return [...new Set(names)].join(" or ") + (nullable ? " or null" : "");
      }
      /** An object of any keys, each holding one kind of value. */
      const isMap = (/** @type {Schema} */ s) => !s.properties && typeof s.additionalProperties === "object";
      /** The objects with named fields a schema holds: its own, its items', a map's values', each alternative's (none
       * reached again through itself). */
      function inside(/** @type {Schema} */ schema, /** @type {string[]} */ seen = []) {
        const resolved = resolve(schema);
        if (seen.includes(resolved.named)) return [];
        const within = resolved.named ? [...seen, resolved.named] : seen;
        return choices(resolved).some.flatMap((/** @type {Schema} */ one) =>
          one.type === "array" ? inside(one.items ?? {}, within) : one.properties ? [one] : isMap(one) ? inside(one.additionalProperties, within) : []);
      }
      /** The values a schema lists, `null` aside. */
      const listed = (/** @type {Schema} */ schema) => (schema.enum ?? choices(schema).some.flatMap((/** @type {Schema} */ s) => s.enum ?? [])).filter((/** @type {unknown} */ v) => v !== null);
      /** The example the specification gives, if it gives one: a parameter's or a media type's own, else its schema's. */
      function exampleOf(/** @type {Schema} */ holder) {
        const own = holder.example ?? (holder.examples && Object.values(holder.examples)[0]?.value);
        if (own !== undefined) return own;
        const schema = resolve(holder.schema ?? {});
        return schema.examples?.[0] ?? schema.example ?? schema.default ?? schema.const ?? schema.enum?.[0];
      }
      /** Objects' fields a press away, each under its name. */
      function nestedFields(/** @type {Schema[]} */ objects, /** @type {string[]} */ within = []) {
        return objects.map((o) => {
          const count = Object.keys(o.properties).length, name = o.named ? `${escape(o.named)} · ` : "";
          return `<details><summary>${name}${count} field${count === 1 ? "" : "s"}</summary>${fields(o, within)}</details>`;
        }).join("");
      }
      /** A row of a list of fields: a name, its type and marks, its words. */
      const row = (/** @type {string} */ name, /** @type {string} */ type, /** @type {string} */ marks, /** @type {string} */ text) =>
        `<div><dt><code>${escape(name)}</code><span>${escape(type)}</span>${marks}</dt><dd>${text}</dd></div>`;
      const OPTIONAL = "<span>optional</span>", REQUIRED = '<span class="must">required</span>';
      /** The fields of an object: each its name, type and words; an object inside one folded under it (none opened twice). */
      function fields(/** @type {Schema} */ schema, /** @type {string[]} */ within = []) {
        const inner = schema.named ? [...within, schema.named] : within;
        const rows = Object.entries(schema.properties).map(([name, field]) => {
          const resolved = resolve(field), more = nestedFields(inside(resolved).filter((o) => !inner.includes(o.named)), inner);
          return row(name, kind(resolved), schema.required?.includes(name) ? "" : OPTIONAL, markdown(resolved.description) + listedValues(resolved) + more);
        });
        return `<dl class="fields">${rows.join("")}</dl>`;
      }
      /**
       * One thing sent or answered, as a row: its name (a media type, a status), its type, its words, its fields.
       * @param {string} name @param {Schema | undefined} schema @param {string} [type] @param {string} [description]
       */
      function schemaRow(name, schema, type, description) {
        const resolved = schema && resolve(schema);
        const words = markdown(description ?? resolved?.description) + (resolved ? listedValues(resolved) + nestedFields(inside(resolved)) : "");
        return `<dl class="fields">${row(name, [type, resolved && kind(resolved)].filter(Boolean).join(" · "), "", words)}</dl>`;
      }
      /** The values a schema lists, said, if it lists them. */
      function listedValues(/** @type {Schema} */ schema) {
        const values = listed(schema);
        return values.length ? `<p class="one-of">One of ${values.map((/** @type {unknown} */ v) => `<code>${escape(String(v))}</code>`).join(" ")}</p>` : "";
      }
      /** What a parameter may be, where its type alone doesn't say: its choices, its default. */
      function allowed(/** @type {Schema} */ schema) {
        return listedValues(schema) + (schema.default !== undefined && schema.default !== "" ? `<p>Default <code>${escape(String(schema.default))}</code></p>` : "");
      }

      // ── The groups: each tag's endpoints, in the specification's order ──

      const METHODS = new Set(["get", "put", "post", "delete", "options", "head", "patch", "trace"]);
      const slug = (/** @type {string} */ name) => name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
      /** @type {Group[]} */ let GROUPS = [];
      /** Every operation, by its address on this page. @type {Map<string, Operation>} */ const OPERATION = new Map();
      try {
        GROUPS = spec.tags.map((/** @type {Schema} */ tag) => ({ ...tag, slug: slug(tag.name), operations: [] }));
        for (const [path, item] of Object.entries(spec.paths))
          for (const [method, operation] of Object.entries(item)) {
            if (!METHODS.has(method)) continue; // (The path's own words and parameters, not an operation of it.)
            const tagged = GROUPS.find((g) => g.name === operation.tags?.[0]);
            if (!tagged) throw new Error(`${method} ${path}: no group named ${operation.tags?.[0]}`);
            // (Its address on this page: a group's, then the method and path, as links to the reference have always been.)
            const id = `tag/${tagged.slug}/${method.toUpperCase()}${path}`;
            // (What the path gives every operation on it, then the operation's own, either one perhaps a reference.)
            const parameters = [...(item.parameters ?? []), ...(operation.parameters ?? [])].map(resolve);
            const haystack = [method, path, operation.summary, operation.operationId, tagged.name, operation.description].filter(Boolean).join(" ").toLowerCase();
            /** @type {Operation} */ const one = { ...operation, method, path, id, parameters, haystack };
            tagged.operations.push(one);
            OPERATION.set(id, one);
          }
      } catch (error) {
        fail(error);
      }

      // ── An endpoint: its words, what it takes, what it answers; beside them, its request ──

      /** The 2xx answer of an operation: its status, its media types, and the entry (schema, any example) of the one
       * shown, JSON where it's one of them. */
      function answer(/** @type {Operation} */ operation) {
        const status = Object.keys(operation.responses).find((code) => code.startsWith("2"));
        if (!status) throw new Error(`${operation.method} ${operation.path}: no 2xx answer`);
        const content = resolve(operation.responses[status]).content ?? {}, types = Object.keys(content), type = types.find((t) => t.includes("json")) ?? types[0];
        return { status, types: types.join(" or "), type, media: content[type] ?? {}, schema: content[type]?.schema };
      }
      /** What an operation is sent, if anything: its media type and that type's entry. */
      function bodyOf(/** @type {Operation} */ operation) {
        const asked = resolve(operation.requestBody ?? {}), type = Object.keys(asked.content ?? {})[0];
        return type && { type, description: asked.description, schema: asked.content[type].schema };
      }
      function parameterList(/** @type {Operation} */ operation, /** @type {string} */ where, /** @type {string} */ title) {
        const list = operation.parameters.filter((p) => p.in === where);
        if (!list.length) return "";
        const rows = list.map((p) => {
          const schema = resolve(p.schema ?? {});
          return row(p.name, kind(schema), where === "path" ? "" : p.required ? REQUIRED : OPTIONAL, markdown(p.description ?? schema.description) + allowed(schema));
        });
        return `<h3>${title}</h3><dl class="fields">${rows.join("")}</dl>`;
      }
      /** The request as a form: a field per parameter (one it must have holding the specification's example, if it gives
       * one), the command, Run, and the answer: the specification's example of it until Run, if it gives one. */
      function request(/** @type {Operation} */ operation) {
        const inputs = operation.parameters.filter((p) => p.in === "path" || p.in === "query").map((p) => {
          const schema = resolve(p.schema ?? {}), values = listed(schema), example = exampleOf(p), name = escape(`${p.in}:${p.name}`);
          const value = example === undefined || typeof example === "object" ? "" : escape(String(example));
          const field = values.length
            ? `<select name="${name}">${p.required ? "" : '<option value="">–</option>'}${values.map((/** @type {unknown} */ v) => `<option${p.required && v === example ? " selected" : ""}>${escape(String(v))}</option>`).join("")}</select>`
            : `<input name="${name}" ${p.required ? `value="${value}" required ` : ""}placeholder="${value || escape(kind(schema))}" autocomplete="off" autocapitalize="off" spellcheck="false" />`;
          return `<label><span>${escape(p.name)}</span>${field}</label>`;
        });
        const { type, media } = answer(operation), sample = exampleOf(media);
        const shown = sample === undefined ? "" : type?.includes("json") ? paint(JSON.stringify(sample, null, 2)) : escape(String(sample));
        // (The answer's own example, or its type's: "An example Height" says which.)
        const example = media.example !== undefined || media.examples ? "An example of its answer" : `An example ${resolve(media.schema ?? {}).named ?? kind(media.schema ?? {})}`;
        const runs = operation.method === "get";
        return `<form class="try" data-id="${escape(operation.id)}">
          ${inputs.length ? `<div class="takes">${inputs.join("")}</div>` : ""}
          <div class="code"><pre class="command"></pre><button class="small" type="button" data-copy>Copy</button></div>
          <div class="ran">${runs ? `<button class="small" type="submit">Run</button>` : ""}<output>${runs ? (shown ? escape(example) : "") : "Not run from this page: copy the command to send it"}</output></div>
          <div class="code"${shown ? "" : " hidden"}><pre class="answer" tabindex="0" role="group" aria-label="${escape(`The answer of ${operation.summary ?? operation.path}`)}">${shown}</pre></div>
        </form>`;
      }
      /** An operation's method, as a mark beside its path. */
      const chip = (/** @type {Operation} */ o) => `<b class="method ${o.method}">${o.method.toUpperCase()}</b> `;
      function endpoint(/** @type {Operation} */ operation) {
        const { status, types, schema } = answer(operation), body = bodyOf(operation);
        const others = Object.entries(operation.responses).filter(([code]) => code !== status).sort(([a], [b]) => a.localeCompare(b));
        return `<article class="op" id="${escape(operation.id)}">
          <div class="split">
            <div>
              <h2><a class="to" href="#${escape(operation.id)}">${escape(operation.summary ?? operation.path)}</a></h2>
              <p class="address">${chip(operation)}${pathBox(operation.path)}</p>
              <div class="md">${markdown(operation.description)}</div>
              ${parameterList(operation, "path", "Path")}${parameterList(operation, "query", "Query")}
              ${body ? `<h3>Body</h3>${schemaRow(body.type, body.schema, "", body.description)}` : ""}
              <h3>Answers</h3>
              ${schemaRow(status, schema, types)}
              <ul class="answers">${others.map(([code, response]) => `<li><b>${escape(code)}</b>${escape(resolve(response).description ?? "")}</li>`).join("")}</ul>
            </div>
            ${request(operation)}
          </div>
        </article>`;
      }

      // ── Pages: the introduction, or a group ──

      function introduction() {
        const [lede, ...rest] = spec.info.description.split("\n\n");
        const first = [...OPERATION.values()].find((o) => o.path === "/api/blocks/tip/height");
        return `<h1>API</h1>
          <p class="lede">${inline(lede)}</p>
          <p class="about"><span>${escape(spec.info.version)}</span><span>OpenAPI ${escape(spec.openapi)}</span><a href="/openapi.json">openapi.json</a><a href="/api.json">api.json</a><a href="/llms.txt">llms.txt</a><a href="/changes/">What changed</a></p>
          ${byId("used-by").innerHTML}
          <div class="split intro">
            <div class="md">${markdown(rest.join("\n\n"))}</div>
            ${first ? request(first) : ""}
          </div>
          <section class="section" aria-labelledby="endpoints">
            <h2 id="endpoints">Endpoints</h2>
            <ul class="index">${GROUPS.map((g) => `<li><a class="to" href="#tag/${g.slug}"><b>${escape(g.name)}</b><small>${g.operations.length}</small><span>${inline((g.description ?? "").split("\n\n")[0])}</span></a></li>`).join("")}</ul>
          </section>`;
      }
      function group(/** @type {Group} */ g) {
        return `<header id="tag/${g.slug}"><p class="crumbs"><a href="#">API</a> › ${escape(g.name)}</p><h1>${escape(g.name)}</h1></header>
          <div class="md lede">${markdown(g.description)}</div>
          <ul class="paths">${g.operations.map((o) => `<li><a class="to" href="#${escape(o.id)}">${chip(o)}${pathBox(o.path)}</a></li>`).join("")}</ul>
          ${g.operations.map(endpoint).join("")}`;
      }
      /** The rail: every group, the one read open on its endpoints. */
      function rail(/** @type {Group | undefined} */ open, /** @type {string} */ at) {
        groups.innerHTML = `<li><a href="#"${open ? "" : ' aria-current="page"'}>Introduction</a></li>` + GROUPS.map((g) =>
          `<li><a href="#tag/${g.slug}"${g === open && at === `tag/${g.slug}` ? ' aria-current="page"' : ""}>${escape(g.name)}<small>${g.operations.length}</small></a>${
            g === open ? `<ul>${g.operations.map((o) => `<li><a href="#${escape(o.id)}"${o.id === at ? ' aria-current="true"' : ""}>${o.summary ? escape(o.summary) : pathBox(o.path)}</a></li>`).join("")}</ul>` : ""
          }</li>`).join("");
      }
      /** The place the address names (a malformed one names none: the introduction). */
      function addressed() {
        try {
          return decodeURIComponent(location.hash.slice(1));
        } catch {
          return "";
        }
      }
      /** The page drawn: none yet (null), the introduction (undefined) or a group. @type {Group | undefined | null} */
      let drawn = null;
      /** The page the address names, drawn when it's another group's and brought to the place named. Within a page drawn
       * already, the browser itself goes to the place named, or back to where Back left it. */
      function show() {
        const at = addressed(), open = GROUPS.find((g) => at === `tag/${g.slug}` || at.startsWith(`tag/${g.slug}/`));
        try {
          if (open !== drawn) {
            main.innerHTML = open ? group(open) : introduction();
            for (const form of main.querySelectorAll("form")) command(form);
            drawn = open;
            const target = at && document.getElementById(at);
            if (target) target.scrollIntoView();
            else scrollTo(0, 0);
          }
          rail(open, at);
        } catch (error) {
          drawn = null;
          fail(error);
        }
        document.title = `${open ? `${open.name} · ` : ""}API · Bitview`;
      }
      addEventListener("hashchange", () => {
        show();
        // (Going to a place leaves the focus nowhere, or on a link drawn anew: it goes on to the place named, its
        // endpoint's own link, else the page, so Tab goes on from there.)
        if (document.activeElement !== document.body) return;
        const place = document.getElementById(addressed())?.querySelector("a.to");
        (/** @type {HTMLElement | null} */ (place) ?? main).focus({ preventScroll: true });
      });

      // ── A request: its command as its fields are filled; Run asks the server and shows what it said ──

      /** The address a form's fields make: its path's placeholders filled, its query's given fields. */
      function address(/** @type {HTMLFormElement} */ form) {
        const operation = /** @type {Operation} */ (OPERATION.get(form.dataset.id ?? "")), query = new URLSearchParams();
        let path = operation.path;
        for (const [name, value] of new FormData(form)) {
          const [where, key] = String(name).split(":"), text = String(value).trim();
          // (A quote encoded too, as the command quotes the address.)
          if (where === "path") path = path.replace(`{${key}}`, text ? encodeURIComponent(text).replaceAll("'", "%27") : `{${key}}`);
          else if (text) query.set(key, text);
        }
        const search = String(query);
        return { operation, url: location.origin + path + (search ? `?${search}` : "") };
      }
      function command(/** @type {HTMLFormElement} */ form) {
        const { operation, url } = address(form), body = bodyOf(operation);
        // (A body is sent from a file of one's own.)
        const data = body ? ` -H 'content-type: ${body.type}' --data-binary @body.${body.type.includes("json") ? "json" : "txt"}` : "";
        /** @type {Element} */ (form.querySelector(".command")).innerHTML = breakable(`curl -s${operation.method === "get" ? "" : ` -X ${operation.method.toUpperCase()}`} '${url}'${data}`);
      }
      /** JSON as text, its names and numbers marked. */
      const paint = (/** @type {string} */ json) =>
        escape(json).replace(/(&quot;(?:[^&\\]|\\.|&(?!quot;))*&quot;)(\s*:)?|(?<![\w.])(-?\d[\d.eE+-]*|true|false|null)\b/g, (_, text, colon, value) =>
          text ? (colon ? `<span class="n">${text}</span>${colon}` : text) : `<span class="v">${value}</span>`);
      /** An answer's start, a screen or so: JSON laid out and marked, the rest counted. */
      function preview(/** @type {string} */ text, /** @type {boolean} */ json) {
        let whole = text;
        if (json) {
          try {
            whole = JSON.stringify(JSON.parse(text), null, 2);
          } catch {
            json = false; // (Said to be JSON but not: shown as it came.)
          }
        }
        const kept = whole.split("\n", 200).join("\n").slice(0, 20000);
        return (json ? paint(kept) : escape(kept)) + (kept.length < whole.length ? `\n<span class="c">… ${(whole.length - kept.length).toLocaleString("en")} more characters</span>` : "");
      }
      /** What a form is waiting on: a new Run stops the one before. */
      const asking = new WeakMap();
      main.addEventListener("input", (event) => {
        const form = /** @type {HTMLFormElement | null} */ (/** @type {HTMLElement} */ (event.target).closest("form"));
        if (!form) return;
        command(form);
        // (A run's answer was to the address before: it goes, and a run still waiting is stopped.)
        asking.get(form)?.abort();
        if (asking.delete(form)) {
          /** @type {HTMLElement} */ (form.querySelector("output")).textContent = "";
          /** @type {HTMLElement} */ (/** @type {HTMLElement} */ (form.querySelector(".answer")).parentElement).hidden = true;
        }
      });
      main.addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = /** @type {HTMLFormElement} */ (event.target);
        if (address(form).operation.method !== "get") return; // (Enter in a field of one that writes: not sent from here.)
        const out = /** @type {HTMLOutputElement} */ (form.querySelector("output"));
        const pre = /** @type {HTMLElement} */ (form.querySelector(".answer")), frame = /** @type {HTMLElement} */ (pre.parentElement);
        asking.get(form)?.abort();
        const control = new AbortController();
        asking.set(form, control);
        out.className = "";
        out.textContent = "Asking…";
        const began = performance.now();
        try {
          const response = await fetch(address(form).url, { signal: control.signal }), type = response.headers.get("content-type") ?? "";
          const bytes = await response.arrayBuffer();
          pre.innerHTML = /json|text|csv/.test(type) ? preview(new TextDecoder().decode(bytes), type.includes("json")) : escape(`${type || "Data"}, not shown here`);
          out.className = response.ok ? "" : "bad";
          out.textContent = `${response.status} · ${Math.round(performance.now() - began)} ms · ${bytes.byteLength.toLocaleString("en")} bytes`;
          frame.hidden = false;
          pre.scrollTop = 0;
        } catch (error) {
          if (control.signal.aborted) return;
          out.className = "bad";
          out.textContent = `No answer (${/** @type {Error} */ (error).message}): check the connection, then Run again`;
          frame.hidden = true;
        }
      });

      // ── Copy: the block's text ──

      /** Each button's way back to "Copy", one at a time. */
      const resets = new WeakMap();

      document.addEventListener("click", async (event) => {
        const button = /** @type {HTMLElement} */ (event.target).closest("[data-copy]");
        if (!button) return;
        const code = /** @type {Element} */ (button.previousElementSibling);
        let word = "Copied";
        try {
          await navigator.clipboard.writeText(code.textContent ?? "");
        } catch {
          // (No clipboard here, as on a server reached over plain http: the text selected, for the keyboard's copy.)
          getSelection()?.selectAllChildren(code);
          word = "Selected";
        }
        button.textContent = said.textContent = word;
        clearTimeout(resets.get(button));
        resets.set(button, setTimeout(() => {
          button.textContent = "Copy";
          if (said.textContent === word) said.textContent = "";
        }, 1500));
      });

      // ── Search: every endpoint whose address, name or words hold each word typed ──

      /** @type {Operation[]} */ let hits = [];
      function search() {
        const terms = find.value.toLowerCase().split(/\s+/).filter(Boolean);
        found.hidden = !terms.length;
        groups.hidden = !!terms.length;
        if (!terms.length) {
          said.textContent = "";
          return;
        }
        const matched = [...OPERATION.values()].filter((o) => terms.every((term) => o.haystack.includes(term)));
        // (Those whose address or summary holds what was typed, before those that only mention it.)
        const named = (/** @type {Operation} */ o) => terms.every((term) => `${o.path} ${o.summary}`.toLowerCase().includes(term));
        hits = [...matched.filter(named), ...matched.filter((o) => !named(o))];
        found.innerHTML = hits.length
          ? hits.map((o, i) => `<li><a href="#${escape(o.id)}"${i ? "" : ' aria-current="true"'}><code>${chip(o)}${pathBox(o.path)}</code>${escape(o.summary ?? "")}</a></li>`).join("")
          : `<li><p>No endpoint holds “${escape(find.value.trim())}”.</p></li>`;
        said.textContent = `${hits.length} endpoint${hits.length === 1 ? "" : "s"}`;
      }
      function clearSearch() {
        find.value = "";
        search();
      }
      find.addEventListener("input", search);
      find.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && hits.length && find.value.trim()) {
          location.hash = hits[0].id;
          clearSearch();
          find.blur(); // (The focus then goes on to the endpoint, as from any link to it; a phone's keyboard goes.)
        } else if (event.key === "Escape") {
          clearSearch();
          find.blur();
        }
      });
      found.addEventListener("click", (event) => {
        if (/** @type {HTMLElement} */ (event.target).closest("a")) clearSearch();
      });
      // (/ or ⌘K from anywhere but a field: to the search.)
      addEventListener("keydown", (event) => {
        const typing = /** @type {HTMLElement} */ (event.target).matches("input, select, textarea");
        if ((event.key === "/" && !typing) || (event.key === "k" && (event.metaKey || event.ctrlKey))) {
          event.preventDefault();
          find.focus();
          find.select();
        }
      });

      show();
    </script>
  </body>
</html>
