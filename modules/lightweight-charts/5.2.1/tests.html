            if (!(worst <= radius + 0.01)) zoomed.push(`${label}, its ${how} at ${h}×${v}: point ${at} ${worst.toFixed(2)} px off (allowed ${radius.toFixed(2)}), ${line.length} points drawn`);
          }
          await frames();
        }
        c.remove(); window.__charts = [];
      }
    } finally { Object.assign(P, keep); }
  }
  say(`A zoom's line from each pixel's lowest and highest: ${zoomChecks} checks, ${zoomed.length} failing`);
  for (const f of zoomed.slice(0, 10)) say(`  ✗ ${f}`);

  // 9. A pinch is no tap (patch 40, the patched library alone): two fingers on the plot (its top canvas, the one that
  // listens), apart then together, either one let go first: no click; one finger on and off: one.
  const tapped = [];
  {
    document.getElementById("a").innerHTML = ""; window.__charts = [];
    seed = 47;
    const c = base(B, document.getElementById("a"));
    c.addSeries(B.LineSeries, { color: "#fff" }).setData(walk(800, 100, 0.03));
    await frames();
    let clicks = 0;
    c.subscribeClick(() => clicks++);
    const target = [...document.getElementById("a").querySelectorAll("canvas")].reduce((a, b) => (b.width * b.height >= a.width * a.height ? b : a)), box = target.getBoundingClientRect(), x = box.left + box.width / 2, y = box.top + box.height / 2;
    const finger = (id, dx) => new Touch({ identifier: id, target, clientX: x + dx, clientY: y, pageX: x + dx, pageY: y });
    const touch = (type, on, changed) => target.dispatchEvent(new TouchEvent(type, { touches: on, targetTouches: on, changedTouches: changed, bubbles: true, cancelable: true, composed: true }));
    for (const [label, spread, lastLetGo] of [["out, its first finger let go first", [10, 60], 1], ["in, its second let go first", [60, 10], 0]]) {
      clicks = 0;
      const [from, to] = spread;
      touch("touchstart", [finger(0, -from)], [finger(0, -from)]);
      touch("touchstart", [finger(0, -from), finger(1, from)], [finger(1, from)]);
      for (let k = 1; k <= 6; k++) { const d = from + ((to - from) * k) / 6; touch("touchmove", [finger(0, -d), finger(1, d)], [finger(0, -d), finger(1, d)]); }
      const first = lastLetGo ? 0 : 1, second = 1 - first, at = (id) => finger(id, id ? to : -to);
      touch("touchend", [at(second)], [at(first)]);
      touch("touchend", [], [at(second)]);
      await frames();
      if (clicks) tapped.push(`a pinch ${label}: ${clicks} clicks`);
      await new Promise((done) => setTimeout(done, 600));
    }
    clicks = 0;
    touch("touchstart", [finger(0, 30)], [finger(0, 30)]);
    touch("touchend", [], [finger(0, 30)]);
    await frames();
    if (clicks !== 1) tapped.push(`a tap: ${clicks} clicks`);
    c.remove(); window.__charts = [];
  }
  say(`A pinch is no tap: 3 checks, ${tapped.length} failing`);
  for (const f of tapped) say(`  ✗ ${f}`);

  // 10. A band its own (patch 41, the patched library alone, its fills at half resolution): two areas stacked, each
  // `bvBandFill`, the foot's in front, straight, curved, the foot starting later, and in steps, the top's color changing at
  // its last point (a run of no width): in each band, the pixel its area's alone draws there (none of the other's tint);
  // where the foot has no data yet, the top's down to the floor. All of it in view, each pixel read inside the plot.
  const owned = [];
  {
    const n = 200, foot = (k) => 1 + 0.3 * Math.sin(k / 9), top = (k) => foot(k) + 1 + 0.2 * Math.cos(k / 7);
    const drawnAt = async (which, lineType, footFrom, recolor, at) => {
      document.getElementById("a").innerHTML = ""; window.__charts = [];
      const c = base(B, document.getElementById("a"), { bvHalfFills: true }), fixed = () => ({ priceRange: { minValue: 0, maxValue: 3 } });
      const time = (k) => 1600000000 + k * 86400, series = {};
      for (const [name, value, color, from] of [["top", top, "#ff0000", 0], ["foot", foot, "#0000ff", footFrom]]) {
        if (!which.includes(name)) continue;
        series[name] = c.addSeries(B.AreaSeries, { lineColor: color, topColor: `${color}80`, bottomColor: `${color}80`, bvBandFill: true, lineType, lineWidth: 1, priceLineVisible: false, lastValueVisible: false, autoscaleInfoProvider: fixed });
        series[name].setData(Array.from({ length: n }, (_, k) => (k < from ? { time: time(k) } : { time: time(k), value: value(k), ...(recolor && name === "top" && k === n - 1 ? { lineColor: "#00ff00", topColor: "#00ff0080", bottomColor: "#00ff0080" } : {}) })));
      }
      c.timeScale().fitContent();
      await frames();
      const pane = [...document.getElementById("a").querySelectorAll("canvas")].reduce((a, b) => (b.width * b.height > a.width * a.height ? b : a)), h = pane.width / c.timeScale().width(), v = pane.height / pane.getBoundingClientRect().height;
      const any = Object.values(series)[0], px = at.map(([k, value]) => {
        const x = Math.round(c.timeScale().timeToCoordinate(time(k)) * h), y = Math.round(any.priceToCoordinate(value) * v);
        if (!(x >= 0 && x < pane.width && y >= 0 && y < pane.height)) owned.push(`point ${k} at ${value} read outside the plot (${x}, ${y})`);
        return [...pane.getContext("2d").getImageData(x, y, 1, 1).data];
      });
      c.remove(); window.__charts = [];
      return px;
    };
    const off = (a, b) => Math.max(...a.map((value, k) => Math.abs(value - b[k])));
    for (const [label, lineType, footFrom, recolor] of [["straight", 0, 0, false], ["curved", 2, 0, false], ["the foot starting later", 0, 100, false], ["in steps, its color changing at its last point", 1, 0, true]]) {
      // (Inside the foot's band, the top's, and, before the foot starts, the top's down low.)
      const k = 140, early = 50, inFoot = [k, foot(k) / 2], inTop = [k, (foot(k) + top(k)) / 2], low = [early, 0.3];
      const [footBoth, topBoth, lowBoth] = await drawnAt(["top", "foot"], lineType, footFrom, recolor, [inFoot, inTop, low]);
      const [footAlone] = await drawnAt(["foot"], lineType, footFrom, recolor, [inFoot]), [topAlone, lowAlone] = await drawnAt(["top"], lineType, footFrom, recolor, [inTop, low]);
      if (off(footBoth, footAlone) > 2) owned.push(`${label}, the foot's band: ${footBoth} where its area alone draws ${footAlone}`);
      if (off(topBoth, topAlone) > 2) owned.push(`${label}, the top's band: ${topBoth} where its area alone draws ${topAlone}`);
      if (footFrom && off(lowBoth, lowAlone) > 2) owned.push(`${label}, the top's band before the foot: ${lowBoth} where its area alone draws ${lowAlone}`);
    }
  }
  say(`A band its own: 9 checks, ${owned.length} failing`);
  for (const f of owned) say(`  ✗ ${f}`);

  // 11. A simplified line's x's read by what isn't its walk (patch 43): a line's dots alone (point markers, no line,
  // `bvSimplify`) over an area, panned a step a frame, by the patched library and the published one: the same picture each
  // step, and the pointer then on each one's dots names the same series; a line, straight then curved, the pointer alone
  // reading them.
  const later = [];
  {
    document.getElementById("a").innerHTML = ""; document.getElementById("b").innerHTML = ""; window.__charts = [];
    const made = [];
    for (const [L, id] of [[A, "a"], [B, "b"]]) {
      seed = 53;
      const c = base(L, document.getElementById(id));
      const dots = c.addSeries(L.LineSeries, { color: "#fff", lineVisible: false, pointMarkersVisible: true, bvSimplify: true });
      dots.setData(walk(400, 100, 0.03));
      c.addSeries(L.AreaSeries, { lineColor: "#f80" }).setData(walk(400, 80, 0.03));
      c.timeScale().setVisibleLogicalRange({ from: 150, to: 260 });
      made.push({ c, dots, hovered: [] });
    }
    await frames();
    for (let step = 1; step <= 8; step++) {
      for (const { c } of made) c.timeScale().scrollToPosition(c.timeScale().scrollPosition() + (step % 3 ? -4 : 6), false);
      await frames();
      const d = differ(plot(made[0].c), plot(made[1].c));
      if (d !== 0) later.push(`step ${step}: ${d < 0 ? "pictures of other sizes" : `${d} values differing`}`);
    }
    for (const item of made) {
      item.c.subscribeCrosshairMove((p) => item.hovered.push(p.hoveredSeries === item.dots ? "dots" : p.hoveredSeries ? "other" : "none"));
      const r = item.c.timeScale().getVisibleLogicalRange(), k = Math.round((r.from + r.to) / 2), x = item.c.timeScale().logicalToCoordinate(k), y = item.dots.priceToCoordinate(item.dots.dataByIndex(k).value);
      const pane = item.c.panes()[0].getHTMLElement(), canvas = [...pane.querySelectorAll("canvas")].reduce((a, b) => (b.width * b.height >= a.width * a.height ? b : a)), box = canvas.getBoundingClientRect();
      for (const type of ["mouseenter", "mousemove"]) canvas.dispatchEvent(new MouseEvent(type, { clientX: box.left + x, clientY: box.top + y, bubbles: true }));
    }
    await frames();
    const [a, b] = made.map((item) => item.hovered.at(-1) ?? "none");
    if (a !== b || b !== "dots") later.push(`the pointer on the dots: ${b} (published: ${a})`);
    for (const { c } of made) c.remove();
    window.__charts = [];
    // (The pointer alone reading them: a simplified line drawn as a line, panned, then the pointer on a point of it (mid-
    // view), by both libraries: the same series named; again, the line made curved after its pans (a curve reads the points
    // either side of those in view), the pointer at its view's end.)
    for (const lineType of [0, 2]) {
      document.getElementById("a").innerHTML = ""; document.getElementById("b").innerHTML = ""; window.__charts = [];
      const lines = [];
      for (const [L, id] of [[A, "a"], [B, "b"]]) {
        seed = 59;
        const c = base(L, document.getElementById(id)), line = c.addSeries(L.LineSeries, { color: "#fff", bvSimplify: true });
        // (Smooth: its walk keeps few points, the rest of those in view unread by it.)
        line.setData(walk(400, 100, 0).map((point, k) => ({ time: point.time, value: 100 + 10 * Math.sin(k / 40) })));
        c.timeScale().setVisibleLogicalRange({ from: 150, to: 260 });
        lines.push({ c, line, hovered: [] });
      }
      await frames();
      for (let step = 1; step <= 6; step++) {
        for (const { c } of lines) c.timeScale().scrollToPosition(c.timeScale().scrollPosition() + (step % 3 ? -25 : 9), false);
        await frames();
      }
      // (Panned straight, then curved: a curve's first point reads the one before it, unread by the straight walks.)
      if (lineType) for (const { line } of lines) line.applyOptions({ lineType });
      for (const item of lines) {
        item.c.subscribeCrosshairMove((p) => item.hovered.push(p.hoveredSeries === item.line ? "line" : p.hoveredSeries ? "other" : "none"));
        const r = item.c.timeScale().getVisibleLogicalRange(), k = lineType ? Math.floor(r.to) - 1 : Math.round((r.from + r.to) / 2), x = item.c.timeScale().logicalToCoordinate(k), y = item.line.priceToCoordinate(item.line.dataByIndex(k).value);
        const canvas = [...item.c.panes()[0].getHTMLElement().querySelectorAll("canvas")].reduce((a, b) => (b.width * b.height >= a.width * a.height ? b : a)), box = canvas.getBoundingClientRect();
        for (const type of ["mouseenter", "mousemove"]) canvas.dispatchEvent(new MouseEvent(type, { clientX: box.left + x, clientY: box.top + y, bubbles: true }));
      }
      await frames();
      const [a, b] = lines.map((item) => item.hovered.at(-1) ?? "none");
      if (a !== b || b !== "line") later.push(`the pointer on a ${lineType ? "curved" : "straight"} line: ${b} (published: ${a})`);
      for (const { c } of lines) c.remove();
      window.__charts = [];
    }
  }
  say(`A simplified line's x's read later: 11 checks, ${later.length} failing`);
  for (const f of later) say(`  ✗ ${f}`);

  // 12. Marks' words edged (patch 47): a mark's words on a line, the chart's `layout.bvHalo` blue: blue about them; none
  // without it, as published.
  const edged = [];
  {
    const blueAbout = async (halo) => {
      document.getElementById("a").innerHTML = ""; window.__charts = [];
      const c = base(B, document.getElementById("a"), { layout: { background: { color: "#111" }, textColor: "#ccc", attributionLogo: false, ...(halo ? { bvHalo: "#0000ff" } : {}) } });
      const time = (k) => 1600000000 + k * 86400, line = c.addSeries(B.LineSeries, { color: "#fff", priceLineVisible: false, lastValueVisible: false });
      line.setData(Array.from({ length: 60 }, (_, k) => ({ time: time(k), value: 100 })));
      B.createSeriesMarkers(line, [{ time: time(30), position: "inBar", shape: "circle", color: "#ff0000", text: "WWWWWW" }], { zOrder: "aboveSeries" });
      c.timeScale().fitContent();
      await frames();
      let blue = 0;
      for (const canvas of document.getElementById("a").querySelectorAll("canvas")) {
        const data = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height).data;
        for (let i = 0; i < data.length; i += 4) if (data[i + 2] > 200 && data[i] < 60 && data[i + 1] < 60) blue++;
      }
      c.remove(); window.__charts = [];
      return blue;
    };
    const [on, off] = [await blueAbout(true), await blueAbout(false)];
    if (on < 50) edged.push(`edged in blue: ${on} blue pixels about its words`);
    if (off) edged.push(`no halo: ${off} blue pixels`);
  }
  say(`Marks' words edged: 2 checks, ${edged.length} failing`);
  for (const f of edged) say(`  ✗ ${f}`);
  window.result = { marks: fails, pictures: bad, corners: corners.length, view: kept.length, sizes: sized.length, points: lost.length, pan: far.length, zoom: zoomed.length, pinch: tapped.length, own: owned.length, later: later.length, edged: edged.length };
</script>
